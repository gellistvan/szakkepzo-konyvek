<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tojásos krémek hőfoka</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="t">Hőmérséklet</label><input id="t" type="range" min="0" max="130" step="1" value="83" aria-label="Hőmérséklet"><output id="t_o" for="t"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 316" role="img" aria-label="Hőmérsékleti skála: hűtött tárolás 5 °C alatt, veszélyes zóna kb. 5–60 °C, sabayon 65–70 °C, vaníliamártás 82–84 °C, olaszhab-szirup 118–121 °C, a tojás kicsapódási határaival (75 és 85 °C)."></svg>
<p class="small">Tanulási értékek a fejezet szövegéből (ellenőrizendő: HACCP-terv, NÉBIH-útmutató). A konyhán mindig a maghőmérővel mért érték dönt.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"t":"°C"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const T=v.t, fg=css("--fg")||"#111", mu="#8a8a8a";
const X=c=>40+c*(560/130);
const B=[[0,5,"hűtött tárolás (5 °C alatt)",0],[5,60,"veszélyes zóna (kb. 5–60 °C, ellenőrizendő)",0],[65,70,"sabayon",1],[82,84,"vaníliamártás",2],[118,121,"olaszhab-szirup",3]];
B.forEach(b=>{const y=b[3]===0?250:230-b[3]*55;el("rect",{x:X(b[0]),y:y,width:X(b[1])-X(b[0]),height:30,fill:"rgba(138,138,138,.25)",stroke:fg});
 el("text",{x:(X(b[0])+X(b[1]))/2,y:y-6,"text-anchor":"middle","font-size":12,fill:fg},b[2]);});
[75,85,100].forEach(c=>el("line",{x1:X(c),x2:X(c),y1:40,y2:285,stroke:fg,"stroke-dasharray":"5 4"}));
for(let c=0;c<=130;c+=10){el("line",{x1:X(c),x2:X(c),y1:285,y2:291,stroke:fg});el("text",{x:X(c),y:306,"text-anchor":"middle","font-size":12,fill:fg},c);}
el("line",{x1:X(0),x2:X(130),y1:285,y2:285,stroke:fg});
el("line",{x1:X(T),x2:X(T),y1:30,y2:285,stroke:"#d32f2f","stroke-width":3});
let m;
if(T<=5)m="Hűtött tárolás: a kész tojásos krém, mártás itt tárolható (5 °C alatt, ellenőrizendő: HACCP-terv).";
else if(T<60)m="Veszélyes zóna (kb. 5–60 °C, ellenőrizendő): a baktériumok szaporodhatnak – a tojásos krémet gyorsan hűtsd át rajta, ne hagyd itt állni.";
else if(T<65)m="Langyos-meleg: a sárgája még nem sűrűsödik; a sabayon tartománya 65 °C-nál kezdődik.";
else if(T<=70)m="Sabayon: 65–70 °C, gőz fölött habosítva – a habos krém bevonja a kanalat. Azonnal tálald.";
else if(T<=75)m="A sabayon felső határa közelében: 75 °C fölött a tojás rántottaszerűen összeáll.";
else if(T<82)m="A sabayon már kicsapódna; a vaníliamártás még nem sűrűsödött eléggé (82 °C-tól).";
else if(T<=84)m="Vaníliamártás: 82–84 °C, a mártás bevonja a fakanál hátát (nappe-próba).";
else if(T<100)m="85 °C fölött a vaníliamártás kicsapódik: szemcsés, összefutott lesz. Azonnal húzd le a tűzről, szűrd, hűtsd.";
else if(T<118)m="Forrás és fölötte: tojásos krém itt nem készül. A cukorszirup itt még sűrűsödik.";
else if(T<=121)m="Olaszhab cukorszirupja: 118–121 °C – ÉGÉSVESZÉLY! Vékony sugárban, a habverő falához öntöd; kesztyű, hosszú eszköz.";
else m="A szirup túlfőtt, karamellizálódik: a habban megkeményedik. Égésveszély!";
status("<b>"+fmt(T,0)+" °C</b> – "+m);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
