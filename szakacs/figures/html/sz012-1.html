<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visszahűtés a veszélyes zónán át</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="d">Rétegvastagság</label><input id="d" type="range" min="2" max="15" step="1" value="12" aria-label="Rétegvastagság"><output id="d_o" for="d"></output></div>
<div class="row"><label for="lid">Fedő rajta</label><input id="lid" type="checkbox" checked aria-label="Fedő rajta"></div>
<div class="row"><label for="mode">Hűtési mód</label><select id="mode" aria-label="Hűtési mód"><option value="fridge" selected>hűtőszekrény (+4 °C)</option><option value="shock">sokkoló (−10 °C levegő)</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 320" role="img" aria-label="Lehűlési görbe 85 °C-ról a választott rétegvastagsággal, fedővel és hűtési móddal; kiírja a veszélyes zónában töltött időt."></svg>
<p class="small">Szemléltető Newton-féle lehűlési modell: τ ≈ k · rétegvastagság (hűtőben k ≈ 11 perc/cm, sokkolóban ≈ 5 perc/cm, fedővel ×1,33) – tanulási adatok, nem mérések. A visszahűtés idő- és hőmérsékleti határát a HACCP-terv és a NÉBIH-útmutató adja (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"d":"cm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const W=560,H=320; S.setAttribute("viewBox","0 0 "+W+" "+H);
const fridge=v.mode==="fridge", Tk=fridge?4:-10, k=fridge?11.25:5, tau=k*v.d*(v.lid?1.33:1), T0=85;
const X=t=>50+t/480*490, Y=T=>280-(T+12)/102*260;
el("rect",{x:X(0),y:Y(60),width:X(480)-X(0),height:Y(5)-Y(60),fill:"#f6c9c4",opacity:0.6});
[60,5].forEach(L=>{el("line",{x1:X(0),x2:X(480),y1:Y(L),y2:Y(L),stroke:"#333","stroke-dasharray":"5 4"});
  el("text",{x:X(480)-4,y:Y(L)-4,"text-anchor":"end","font-size":12,fill:"#333"},L+" °C");});
el("line",{x1:X(0),x2:X(480),y1:Y(-12),y2:Y(-12),stroke:"#333"});el("line",{x1:X(0),x2:X(0),y1:Y(-12),y2:Y(90),stroke:"#333"});
for(let m=0;m<=480;m+=60){el("text",{x:X(m),y:Y(-12)+16,"text-anchor":"middle","font-size":11,fill:"#333"},String(m));}
for(let T=0;T<=80;T+=20){el("text",{x:X(0)-6,y:Y(T)+4,"text-anchor":"end","font-size":11,fill:"#333"},String(T));}
el("text",{x:X(240),y:Y(-12)+30,"text-anchor":"middle","font-size":12,fill:"#333"},"idő (perc)");
let d="";for(let t=0;t<=480;t+=2){const T=Tk+(T0-Tk)*Math.exp(-t/tau);if(T<3)break;d+=(t?"L":"M")+X(t).toFixed(1)+" "+Y(T).toFixed(1);}
el("path",{d:d,fill:"none",stroke:"#1f4e79","stroke-width":3});
const t60=tau*Math.log((T0-Tk)/(60-Tk)), t5=tau*Math.log((T0-Tk)/(5-Tk)), inz=t5-t60;
const hm=m=>m>=60?Math.floor(m/60)+" óra "+Math.round(m%60)+" perc":Math.round(m)+" perc";
status("τ ≈ "+fmt(tau,0)+" perc. A 60 °C-ot "+hm(t60)+" alatt, az 5 °C-ot "+hm(t5)+" alatt éri el: <b>a veszélyes zónában töltött idő ≈ "+hm(inz)+"</b>."+(inz>120?" Ez több mint 2 óra – vékonyabb rétegben, fedetlenül vagy sokkolóban hűts!":" "));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
