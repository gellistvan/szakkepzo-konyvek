<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vizsga-munkaterv Gantt</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="tal">Tálalás (perc 9:30-tól)</label><input id="tal" type="range" min="120" max="160" step="5" value="150" aria-label="Tálalás (perc 9:30-tól)"><output id="tal_o" for="tal"></output></div>
<div class="row"><label for="gul">Gulyás főzési ideje felöntés után</label><input id="gul" type="range" min="30" max="80" step="5" value="55" aria-label="Gulyás főzési ideje felöntés után"><output id="gul_o" for="gul"></output></div>
<div class="row"><label for="burg">Burgonya főzési ideje</label><input id="burg" type="range" min="20" max="45" step="5" value="35" aria-label="Burgonya főzési ideje"><output id="burg_o" for="burg"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 200" role="img" aria-label="Gantt-diagram a 150 perces vizsgamenüről: a gulyás a legkorábban indul, a panírozás és a sütés az utolsó 25 percben, a CCP-mérés a tálalás előtt."></svg>
<p class="small">Visszafelé ütemezés a tálalási időpontból. Tanulási terv; a CCP-értékek ellenőrizendők (NÉBIH-útmutató), a vizsga pontos ideje a vizsgaszabályzat szerint.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"tal":"perc", "gul":"perc", "burg":"perc"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const T=v.tal, g=v.gul, p=v.burg, S=[];   // T: tálalás percben 9:30-tól számítva (150 = 12:00)
S.push(["közös","higiénia, átvétel",0,15,1],["közös","mise en place",15,40,1],["közös","kóstolás, tálalás",T-5,T,1]);
S.push(["rántott szelet","panírozás",T-25,T-18,1],["rántott szelet","sütés + maghő (CCP)",T-18,T-5,1]);
S.push(["gulyásleves","készentartás",T-25,T,0],["gulyásleves","felöntés, főzés",T-25-g,T-25,0],["gulyásleves","pörköltalap",T-25-g-30,T-25-g,1]);
S.push(["burgonya","főzés",T-15-p,T-15,0],["burgonya","hámozás",T-15-p-15,T-15-p,1]);
S.push(["túrógombóc","főzés, morzsa",T-45,T-28,1],["túrógombóc","morzsában",T-28,T,0],["túrógombóc","pihen (hűtő)",T-70,T-45,0],["túrógombóc","massza",T-80,T-70,1]);
const R=["közös","gulyásleves","túrógombóc","burgonya","rántott szelet"], X=t=>110+t*3, fg=css("--fg")||"#111";
for(let t=0;t<=165;t+=15){el("line",{x1:X(t),y1:8,x2:X(t),y2:180,stroke:css("--grid")||"#ccc"});const m=570+t;el("text",{x:X(t),y:195,"text-anchor":"middle","font-size":10},Math.floor(m/60)+":"+String(m%60).padStart(2,"0"));}
R.forEach((r,i)=>el("text",{x:4,y:28+i*34,"font-size":12},r));
const A=S.filter(s=>s[4]);const bad=new Set();
for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++)if(A[i][2]<A[j][3]&&A[j][2]<A[i][3]){bad.add(A[i]);bad.add(A[j]);}
S.forEach(s=>{const y=12+R.indexOf(s[0])*34;el("rect",{x:X(s[2]),y:y,width:Math.max(0,(s[3]-s[2])*3),height:24,fill:bad.has(s)?css("--bad"):(s[4]?"#c4c4c4":"none"),stroke:fg,"stroke-dasharray":s[4]?"":"4 2","stroke-width":bad.has(s)?3:1});});
el("line",{x1:X(150),y1:4,x2:X(150),y2:182,stroke:fg,"stroke-dasharray":"6 3","stroke-width":2});
const early=Math.min(...S.map(s=>s[2])), late=T>150;
status((bad.size?'<span class="bad">Ütközés: két figyelmet igénylő művelet egyszerre (piros).</span><br>':'<span class="ok">Nincs ütközés az aktív műveletek között.</span><br>')+
 (early<40&&S.find(s=>s[1]==="pörköltalap")[2]<40?'<span class="bad">A gulyás pörköltalapja a mise en place előtt kezdődne – nem fér bele az időbe.</span><br>':'')+
 (late?'<span class="bad">A tálalás a 150 perces vizsgaidő után lenne.</span><br>':'')+"Tálalás: "+Math.floor((570+T)/60)+":"+String((570+T)%60).padStart(2,"0"));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
