<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hal bruttó–nettó kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="a">Adagszám</label><input id="a" type="range" min="1" max="50" step="1" value="20" aria-label="Adagszám"><output id="a_o" for="a"></output></div>
<div class="row"><label for="m">Kész adagsúly</label><input id="m" type="range" min="80" max="250" step="5" value="130" aria-label="Kész adagsúly"><output id="m_o" for="m"></output></div>
<div class="row"><label for="vs">Sütési veszteség</label><input id="vs" type="range" min="0" max="35" step="1" value="20" aria-label="Sütési veszteség"><output id="vs_o" for="vs"></output></div>
<div class="row"><label for="k">Filékihozatal</label><input id="k" type="range" min="30" max="70" step="1" value="60" aria-label="Filékihozatal"><output id="k_o" for="k"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 185" role="img" aria-label="A kész haltömegből visszaszámolt nyers filé és egész hal tömege, a filézési és sütési veszteséggel; összehasonlítás a hibás, összeadott százalékkal."></svg>
<p class="small">Tanulási értékek; ellenőrizendő: üzemi anyaghányad-gyűjtemény. A fejezet példája: 20 adag × 130 g, 20 % sütési veszteség, 60 % kihozatal → 3250 g nyers filé, ≈ 5,4 kg egész lazac.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"a":"adag", "m":"g", "vs":"%", "k":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const fg=css("--fg")||"#111";
const kesz=v.a*v.m, nyers=kesz/(1-v.vs/100), egesz=nyers/(v.k/100);
const sum=v.vs+(100-v.k), rossz=sum<100?kesz/(1-sum/100):Infinity;
const mx=Math.max(egesz,isFinite(rossz)?rossz:0)*1.08, X=g=>130+g/mx*470;
const bar=(y,segs,lab,tot)=>{let x=0;segs.forEach(s=>{el("rect",{x:X(x),y:y,width:X(x+s[0])-X(x),height:30,fill:s[1],stroke:fg,"stroke-width":1.2});x+=s[0];});
  el("text",{x:10,y:y+20,"font-size":13,fill:fg},lab);el("text",{x:X(tot)+4,y:y+20,"font-size":12,fill:fg},fmt(tot/1000,2)+" kg");};
bar(20,[[nyers,"#c4c4c4"],[egesz-nyers,"none"]],"egész hal",egesz);
bar(70,[[kesz,"#8a8a8a"],[nyers-kesz,"none"]],"nyers filé",nyers);
bar(120,[[kesz,"#8a8a8a"]],"kész hal",kesz);
if(isFinite(rossz)){el("line",{x1:X(rossz),x2:X(rossz),y1:10,y2:160,stroke:"#d32f2f","stroke-width":2,"stroke-dasharray":"6 4"});
  el("text",{x:Math.min(X(rossz),600)-4,y:175,"text-anchor":"end","font-size":11,fill:"#d32f2f"},"rossz módszer (összeadott %)");}
status(`Kész hal: <b>${fmt(kesz,0)} g</b> → nyers filé: <b>${fmt(nyers,0)} g</b> (÷ ${fmt(1-v.vs/100,2)}) → egész hal: <b>${fmt(egesz/1000,2)} kg</b> (÷ ${fmt(v.k/100,2)}).<br>`+
 (isFinite(rossz)?`Rossz módszer (${v.vs} % + ${100-v.k} % = ${sum} % a kész tömegre): ${fmt(rossz/1000,2)} kg – eltérés: ${fmt((rossz-egesz)/1000,2)} kg.`:"Rossz módszer: az összeadott százalék eléri a 100 %-ot – értelmetlen eredmény.")+
 "<br><i>A sütési veszteség alapja a nyers filé, a filézési veszteségé az egész hal.</i>");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
