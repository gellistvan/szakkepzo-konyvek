<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heti menü-ellenőrző mátrix</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="d0">Hétfő</label><select id="d0" aria-label="Hétfő"><option value="csirkecomb" selected>Sült csirkecomb, petrezselymes újkrumpli</option><option value="sertespork">Sertéspörkölt, túrós csusza</option><option value="halfile">Rántott halfilé, párolt zöldborsó</option><option value="lencse">Lencsefőzelék tükörtojással</option><option value="pulyka">Grillezett pulykamell, zöldséges bulgur</option><option value="paprikas">Csirkepaprikás, galuska</option><option value="marhapork">Marhapörkölt, párolt rizs</option><option value="rcsirke">Rántott csirke, rizs</option><option value="rsertes">Rántott sertés, rizibizi</option><option value="rsajt">Rántott sajt, rizs</option></select></div>
<div class="row"><label for="d1">Kedd</label><select id="d1" aria-label="Kedd"><option value="csirkecomb">Sült csirkecomb, petrezselymes újkrumpli</option><option value="sertespork" selected>Sertéspörkölt, túrós csusza</option><option value="halfile">Rántott halfilé, párolt zöldborsó</option><option value="lencse">Lencsefőzelék tükörtojással</option><option value="pulyka">Grillezett pulykamell, zöldséges bulgur</option><option value="paprikas">Csirkepaprikás, galuska</option><option value="marhapork">Marhapörkölt, párolt rizs</option><option value="rcsirke">Rántott csirke, rizs</option><option value="rsertes">Rántott sertés, rizibizi</option><option value="rsajt">Rántott sajt, rizs</option></select></div>
<div class="row"><label for="d2">Szerda</label><select id="d2" aria-label="Szerda"><option value="csirkecomb">Sült csirkecomb, petrezselymes újkrumpli</option><option value="sertespork">Sertéspörkölt, túrós csusza</option><option value="halfile" selected>Rántott halfilé, párolt zöldborsó</option><option value="lencse">Lencsefőzelék tükörtojással</option><option value="pulyka">Grillezett pulykamell, zöldséges bulgur</option><option value="paprikas">Csirkepaprikás, galuska</option><option value="marhapork">Marhapörkölt, párolt rizs</option><option value="rcsirke">Rántott csirke, rizs</option><option value="rsertes">Rántott sertés, rizibizi</option><option value="rsajt">Rántott sajt, rizs</option></select></div>
<div class="row"><label for="d3">Csütörtök</label><select id="d3" aria-label="Csütörtök"><option value="csirkecomb">Sült csirkecomb, petrezselymes újkrumpli</option><option value="sertespork">Sertéspörkölt, túrós csusza</option><option value="halfile">Rántott halfilé, párolt zöldborsó</option><option value="lencse" selected>Lencsefőzelék tükörtojással</option><option value="pulyka">Grillezett pulykamell, zöldséges bulgur</option><option value="paprikas">Csirkepaprikás, galuska</option><option value="marhapork">Marhapörkölt, párolt rizs</option><option value="rcsirke">Rántott csirke, rizs</option><option value="rsertes">Rántott sertés, rizibizi</option><option value="rsajt">Rántott sajt, rizs</option></select></div>
<div class="row"><label for="d4">Péntek</label><select id="d4" aria-label="Péntek"><option value="csirkecomb">Sült csirkecomb, petrezselymes újkrumpli</option><option value="sertespork">Sertéspörkölt, túrós csusza</option><option value="halfile">Rántott halfilé, párolt zöldborsó</option><option value="lencse">Lencsefőzelék tükörtojással</option><option value="pulyka" selected>Grillezett pulykamell, zöldséges bulgur</option><option value="paprikas">Csirkepaprikás, galuska</option><option value="marhapork">Marhapörkölt, párolt rizs</option><option value="rcsirke">Rántott csirke, rizs</option><option value="rsertes">Rántott sertés, rizibizi</option><option value="rsajt">Rántott sajt, rizs</option></select></div>
<div class="row"><label for="d5">Szombat</label><select id="d5" aria-label="Szombat"><option value="csirkecomb">Sült csirkecomb, petrezselymes újkrumpli</option><option value="sertespork">Sertéspörkölt, túrós csusza</option><option value="halfile">Rántott halfilé, párolt zöldborsó</option><option value="lencse">Lencsefőzelék tükörtojással</option><option value="pulyka">Grillezett pulykamell, zöldséges bulgur</option><option value="paprikas" selected>Csirkepaprikás, galuska</option><option value="marhapork">Marhapörkölt, párolt rizs</option><option value="rcsirke">Rántott csirke, rizs</option><option value="rsertes">Rántott sertés, rizibizi</option><option value="rsajt">Rántott sajt, rizs</option></select></div>
<div class="row"><label for="d6">Vasárnap</label><select id="d6" aria-label="Vasárnap"><option value="csirkecomb">Sült csirkecomb, petrezselymes újkrumpli</option><option value="sertespork">Sertéspörkölt, túrós csusza</option><option value="halfile">Rántott halfilé, párolt zöldborsó</option><option value="lencse">Lencsefőzelék tükörtojással</option><option value="pulyka">Grillezett pulykamell, zöldséges bulgur</option><option value="paprikas">Csirkepaprikás, galuska</option><option value="marhapork" selected>Marhapörkölt, párolt rizs</option><option value="rcsirke">Rántott csirke, rizs</option><option value="rsertes">Rántott sertés, rizibizi</option><option value="rsajt">Rántott sajt, rizs</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 680 275" role="img" aria-label="Táblázatos ábra: a hét napjai soronként, oszloponként a fehérjeforrás, köret, technológia, szín és főétel-jelleg; az ismétlődések kiemelve."></svg>
<p class="small">Válassz főételt minden napra: a mátrix jelzi, ha két egymást követő napon ugyanaz a fehérjeforrás, köret, technológia, szín vagy jelleg; a köret a fejezet szabálya szerint legfeljebb kétszer szerepelhet. A besorolás tanulási egyszerűsítés.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();
const D={"csirkecomb": ["Sült csirkecomb, petrezselymes újkrumpli", "csirke", "burgonya", "sütés", "barna", "sült"], "sertespork": ["Sertéspörkölt, túrós csusza", "sertés", "tészta", "pörkölés", "piros", "mártásos"], "halfile": ["Rántott halfilé, párolt zöldborsó", "hal", "zöldség", "rántás", "sárga", "rántott"], "lencse": ["Lencsefőzelék tükörtojással", "hüvelyes", "főzelék", "főzés", "barna", "főzelék"], "pulyka": ["Grillezett pulykamell, zöldséges bulgur", "pulyka", "gabona", "grillezés", "zöld", "sült"], "paprikas": ["Csirkepaprikás, galuska", "csirke", "galuska", "párolás", "piros", "mártásos"], "marhapork": ["Marhapörkölt, párolt rizs", "marha", "rizs", "pörkölés", "piros", "mártásos"], "rcsirke": ["Rántott csirke, rizs", "csirke", "rizs", "rántás", "sárga", "rántott"], "rsertes": ["Rántott sertés, rizibizi", "sertés", "rizs", "rántás", "sárga", "rántott"], "rsajt": ["Rántott sajt, rizs", "sajt", "rizs", "rántás", "sárga", "rántott"]};

const C=["fehérje","köret","technológia","fő szín","jelleg"], N=["H","K","Sze","Cs","P","Szo","V"];
const w=[0,1,2,3,4,5,6].map(i=>v["d"+i]);const F=new Set();
for(let c=0;c<5;c++)for(let d=1;d<7;d++)if(D[w[d]][c+1]===D[w[d-1]][c+1]){F.add(d+"_"+c);F.add((d-1)+"_"+c);}
C.forEach((t,c)=>el("text",{x:150+c*104+52,y:20,"text-anchor":"middle","font-size":13,"font-weight":"bold"},t));
w.forEach((k,d)=>{const y=32+d*34;el("text",{x:6,y:y+21,"font-size":13},N[d]+": "+D[k][0].split(",")[0].slice(0,18));
  for(let c=0;c<5;c++){const b=F.has(d+"_"+c);el("rect",{x:150+c*104+2,y:y,width:100,height:30,fill:b?"#c4c4c4":"none",stroke:css("--line")||"#000","stroke-width":b?3:1});
   el("text",{x:150+c*104+52,y:y+20,"text-anchor":"middle","font-size":12.5,"font-weight":b?"bold":"normal",fill:b?"#111":(css("--fg")||"#111")},D[k][c+1]+(b?" !":""));}});
const prot=new Set(w.map(k=>D[k][1])).size;
const kor={};w.forEach(k=>{kor[D[k][2]]=(kor[D[k][2]]||0)+1;});const k3=Object.entries(kor).filter(e=>e[1]>2).map(e=>e[0]);
status("Különböző fehérjeforrás a héten: <b>"+prot+"</b> "+(prot>=4?'<span class="ok">(cél: legalább 4–5 ✓)</span>':'<span class="bad">(cél: legalább 4–5)</span>')+
 "<br>Egymást követő napokon ismétlődő érték: <b>"+(F.size/2|0)+"</b> pár"+(k3.length?'<br><span class="bad">Ez a köret kettőnél többször szerepel: '+k3.join(", ")+'</span>':""));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
