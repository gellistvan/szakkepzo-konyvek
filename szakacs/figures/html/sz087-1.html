<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hideg leves lehűlése</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="t0">Kezdőhőmérséklet</label><input id="t0" type="range" min="60" max="100" step="1" value="90" aria-label="Kezdőhőmérséklet"><output id="t0_o" for="t0"></output></div>
<div class="row"><label for="d">Rétegvastagság / edénymélység</label><input id="d" type="range" min="2" max="30" step="1" value="5" aria-label="Rétegvastagság / edénymélység"><output id="d_o" for="d"></output></div>
<div class="row"><label for="mode">Hűtési mód</label><select id="mode" aria-label="Hűtési mód"><option value="jeg">jeges vízfürdő, keverve</option><option value="gn" selected>lapos GN-edény hűtőben</option><option value="pult">fazék a konyhapulton – hibás</option></select></div>
<div class="row"><label for="own">Saját környezeti hőmérséklet</label><input id="own" type="checkbox" aria-label="Saját környezeti hőmérséklet"></div>
<div class="row"><label for="tk">Környezeti hőmérséklet</label><input id="tk" type="range" min="-2" max="30" step="1" value="4" aria-label="Környezeti hőmérséklet"><output id="tk_o" for="tk"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 345" role="img" aria-label="Három lehűlési görbe a két ellenőrzőponttal (2 óra – 20 °C, 6 óra – 5 °C): a jeges vízfürdő bőven, a hűtőben lapos edény épp a határon teljesít, a pulton hagyott fazék nyolc óra alatt sem hűl le."></svg>
<p class="small">Szemléltető Newton-modell, nem mérés: τ a módhoz tartozó referencia-rétegvastagsággal arányosan skálázva (jeges vízfürdő 15 cm, GN-edény 5 cm, fazék 20 cm). A határok tanulási értékek (ellenőrizendő: NÉBIH-útmutató / HACCP-terv). Az üzemben a maghőmérővel mért érték dönt.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"t0":"°C", "d":"cm", "tk":"°C"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const M={"jeg": ["jeges vízfürdő, keverve", 2.0, 25.0, 15.0], "gn": ["lapos GN-edény hűtőben", 4.0, 70.0, 5.0], "pult": ["fazék a konyhapulton – hibás", 24.0, 240.0, 20.0]};
const m=M[v.mode], Tk=v.own?v.tk:m[1], tau=m[2]*v.d/m[3];
const tt=Tc=>Tc<=Tk||v.t0<=Tc?(v.t0<=Tc?0:Infinity):tau*Math.log((v.t0-Tk)/(Tc-Tk));
const fg=css("--fg")||"#111",mu="#8a8a8a",X=t=>60+t*(560/480),Y=c=>300-c*(270/95);
el("rect",{x:60,y:Y(60),width:560,height:Y(5)-Y(60),fill:"rgba(138,138,138,.12)"});
el("path",{d:`M${X(120)},${Y(95)} L${X(120)},${Y(20)} L${X(360)},${Y(20)} L${X(360)},${Y(5)} L${X(480)},${Y(5)} L${X(480)},${Y(95)} Z`,fill:"rgba(138,138,138,.28)",stroke:fg,"stroke-width":1});
el("circle",{cx:X(120),cy:Y(20),r:6,fill:"#fff",stroke:fg,"stroke-width":2});
el("rect",{x:X(360)-6,y:Y(5)-6,width:12,height:12,fill:"#fff",stroke:fg,"stroke-width":2});
[0,5,10,20,40,60,80].forEach(c=>{el("line",{x1:60,x2:620,y1:Y(c),y2:Y(c),stroke:mu,"stroke-width":.4});el("text",{x:52,y:Y(c)+4,"text-anchor":"end","font-size":12,fill:fg},c);});
for(let h=0;h<=8;h++)el("text",{x:X(h*60),y:318,"text-anchor":"middle","font-size":12,fill:fg},h*60);
el("text",{x:340,y:336,"text-anchor":"middle","font-size":12,fill:fg},"idő a főzés végétől (perc)");
let d="";for(let i=0;i<=480;i+=2){const c=Tk+(v.t0-Tk)*Math.exp(-i/tau);d+=(i?"L":"M")+X(i)+","+Y(Math.max(0,Math.min(95,c)));}
el("path",{d:d,fill:"none",stroke:fg,"stroke-width":2.6});
const a60=tt(60),a20=tt(20),a5=tt(5);
const inz=isFinite(a5)?a5-a60:Infinity, ok20=a20<=120, ok5=a5<=360, ok=ok20&&ok5;
const f=x=>isFinite(x)?fmt(x,0)+" perc":"soha (a környezet melegebb)";
status(`<b>${ok?"MEGFELEL":"NEM FELEL MEG"}</b> a tanulási szabálynak (a főzés végétől 2 órán belül 20 °C alá, további 4 órán belül 5 °C alá; ellenőrizendő: NÉBIH-útmutató / HACCP-terv) – ${m[0]}, ${fmt(v.d,0)} cm réteg, környezet ${fmt(Tk,0)} °C, τ ≈ ${fmt(tau,0)} perc.<br>`+
 `○ 20 °C alá: ${f(a20)} (határ 120 perc) ${ok20?"✓":"✗"}; □ 5 °C alá: ${f(a5)} (határ összesen 360 perc) ${ok5?"✓":"✗"}; a veszélyes zónában (kb. 5–60 °C): ${isFinite(inz)?fmt(inz,0)+" perc":"tartósan"}.`);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
