<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Százalékszámító</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="ker">Keresett mennyiség</label><select id="ker" aria-label="Keresett mennyiség"><option value="P" selected>százalékérték, P</option><option value="A">alap, A</option><option value="p">százalékláb, p</option></select></div>
<div class="row"><label for="ex">Mintapélda</label><select id="ex" aria-label="Mintapélda"><option value="0" selected>saját adatok</option><option value="1">1. példa: 2 850 000 Ft · 28%</option><option value="2">2. példa: 390 Ft, 65%</option><option value="3">3. példa: 1 250 Ft / 3 800 Ft</option><option value="4">szemléltető: 350 000 Ft · 28%</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 210" role="img" aria-label="Az alap, a százalékláb és a százalékérték kapcsolata három képlettel."></svg>
<p class="small">Írd be a két ismert értéket, és válaszd ki a keresettet. A számítás után mindig számolj vissza (ellenőrzés).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

if(!document.getElementById("nA")){const box=document.createElement("div");box.innerHTML=
 '<div class="row"><label for="nA">Alap, A</label><input id="nA" type="number" step="any" value="350000"><output>Ft vagy mennyiség</output></div>'+
 '<div class="row"><label for="np">Százalékláb, p</label><input id="np" type="number" step="any" value="28"><output>%</output></div>'+
 '<div class="row"><label for="nP">Százalékérték, P</label><input id="nP" type="number" step="any" value="98000"><output>Ft vagy mennyiség</output></div>';
 FIG.svg.parentNode.insertBefore(box,document.getElementById("status"));
 box.querySelectorAll("input").forEach(i=>i.addEventListener("input",draw));
 window._ex="0";}
const EX={"1":[2850000,28,null,"P"],"2":[null,65,390,"A"],"3":[3800,null,1250,"p"],"4":[350000,28,null,"P"]};
if(v.ex!==window._ex){window._ex=v.ex;if(EX[v.ex]){const e=EX[v.ex];if(e[0]!==null)nA.value=e[0];if(e[1]!==null)np.value=e[1];if(e[2]!==null)nP.value=e[2];
  document.getElementById("ker").value=e[3];v.ker=e[3];}}
let A=+nA.value,p=+np.value,P=+nP.value;const n=x=>Number(x).toLocaleString("hu-HU",{maximumFractionDigits:2});
let msg="";
if(v.ker==="P"){P=A*p/100;nP.value=Math.round(P*100)/100;msg="P = A · p / 100 = "+n(A)+" · "+n(p)+" / 100 = <b>"+n(P)+"</b>";}
if(v.ker==="A"){if(p===0){status('<span class="bad">p = 0 esetén az alap nem számolható.</span>');return;}A=P*100/p;nA.value=Math.round(A*100)/100;msg="A = P · 100 / p = "+n(P)+" · 100 / "+n(p)+" = <b>"+n(A)+"</b>";}
if(v.ker==="p"){if(A===0){status('<span class="bad">A = 0 esetén a százalékláb nem számolható.</span>');return;}p=P/A*100;np.value=Math.round(p*10)/10;msg="p% = P / A · 100 = "+n(P)+" / "+n(A)+" · 100 = <b>"+n(Math.round(p*10)/10)+"%</b>";}
const fg=css("--fg")||"#111";
[["A",20,140,"Alap (A)",A],["P",420,140,"Százalékérték (P)",P],["p",220,20,"Százalékláb (p)",p]].forEach(b=>{
 el("rect",{x:b[1],y:b[2],width:200,height:60,fill:"none",stroke:fg,"stroke-width":b[0]===v.ker?4:1.2,"stroke-dasharray":b[0]===v.ker?"":"6 3"});
 el("text",{x:b[1]+100,y:b[2]+24,"text-anchor":"middle","font-size":14,"font-weight":"bold"},b[3]);
 el("text",{x:b[1]+100,y:b[2]+48,"text-anchor":"middle","font-size":14},n(Math.round(b[4]*100)/100)+(b[0]==="p"?" %":""));});
status(msg+"<br>Visszaszámolás: "+n(A)+" · "+n(p)+" / 100 = "+n(Math.round(A*p)/100)+" ≈ P = "+n(P));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
