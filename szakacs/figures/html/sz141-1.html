<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Munkaterv-Gantt</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="onte">Öntet kezdése (perc 8:00 után)</label><input id="onte" type="range" min="120" max="240" step="5" value="140" aria-label="Öntet kezdése (perc 8:00 után)"><output id="onte_o" for="onte"></output></div>
<div class="row"><label for="rizs">Rizs kezdése (perc 8:00 után)</label><input id="rizs" type="range" min="120" max="250" step="5" value="200" aria-label="Rizs kezdése (perc 8:00 után)"><output id="rizs_o" for="rizs"></output></div>
<div class="row"><label for="szuz">Sertésszűz sütésének kezdése</label><input id="szuz" type="range" min="150" max="240" step="5" value="220" aria-label="Sertésszűz sütésének kezdése"><output id="szuz_o" for="szuz"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 245" role="img" aria-label="Gantt-diagram: a 3 adagos menü műveletei 8:00 és 12:40 között gépenként, a CCP-ellenőrzések jelölve."></svg>
<p class="small">Mozgasd a három művelet kezdését: egyetlen szakács egyszerre csak egy aktív műveletet végezhet. A CCP-értékek tanulási értékek (ellenőrizendő: NÉBIH-útmutató, HACCP-terv).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"onte":"perc", "rizs":"perc", "szuz":"perc"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const T0=[["átvétel","hűtő",0,15],["zöldség","munkalap",15,35],["hús","munkalap",35,60],["leves alap","tűzhely",60,90],["leves főzés","tűzhely",90,120],
 ["turmix","botmixer",120,140],["öntet","tűzhely",v.onte,v.onte+20],["rizs","tűzhely",v.rizs,v.rizs+20],["sertésszűz","sütő",v.szuz,v.szuz+30],
 ["tál. előkészítés","munkalap",250,270],["tálalás","munkalap",270,280]];
const R=["munkalap","tűzhely","sütő","botmixer","hűtő","szakács (aktív)"], X=t=>150+t*1.7, line=css("--line")||"#000";
for(let t=0;t<=280;t+=30){el("line",{x1:X(t),y1:10,x2:X(t),y2:220,stroke:css("--grid")||"#ccc"});el("text",{x:X(t),y:236,"text-anchor":"middle","font-size":11},(8+Math.floor(t/60))+":"+String(t%60).padStart(2,"0"));}
R.forEach((r,i)=>el("text",{x:4,y:30+i*34,"font-size":12},r));
const bad=new Set();
for(let i=0;i<T0.length;i++)for(let j=i+1;j<T0.length;j++){const a=T0[i],b=T0[j];if(a[2]<b[3]&&b[2]<a[3]){bad.add(i);bad.add(j);}}
T0.forEach((t,i)=>{[t[1],"szakács (aktív)"].forEach(r=>{const y=14+R.indexOf(r)*34;
  el("rect",{x:X(t[2]),y:y,width:(t[3]-t[2])*1.7,height:24,fill:bad.has(i)?css("--bad"):"#c4c4c4",stroke:line,"stroke-width":bad.has(i)?3:1});});
  if(t[3]-t[2]>=20)el("text",{x:X((t[2]+t[3])/2),y:14+R.indexOf(t[1])*34+16,"text-anchor":"middle","font-size":10.5,fill:"#111"},t[0]);});
el("line",{x1:X(270),y1:6,x2:X(270),y2:220,stroke:line,"stroke-dasharray":"6 3","stroke-width":2});
const late=v.szuz+30>250, rl=v.rizs+20>250;
status((bad.size?'<span class="bad">Ütközés: egyetlen szakács két aktív műveletet végezne egyszerre (piros sávok).</span><br>':'<span class="ok">Nincs ütközés az aktív műveletek között.</span><br>')+
 (late?'<span class="bad">A sertésszűz nem készül el 12:10-ig (maghőmérséklet-CCP + 5 perc pihentetés kell).</span><br>':'')+(rl?'<span class="bad">A rizs nem készül el a tálalás előkészítéséig.</span><br>':'')+
 "Öntet: "+(8+Math.floor(v.onte/60))+":"+String(v.onte%60).padStart(2,"0")+", rizs: "+(8+Math.floor(v.rizs/60))+":"+String(v.rizs%60).padStart(2,"0")+", sertésszűz: "+(8+Math.floor(v.szuz/60))+":"+String(v.szuz%60).padStart(2,"0")+" kezdéssel.");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
