<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rendezvénykalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="n">Létszám</label><input id="n" type="range" min="10" max="300" step="10" value="60" aria-label="Létszám"><output id="n_o" for="n"></output></div>
<div class="row"><label for="db">Darab/fő</label><input id="db" type="range" min="2" max="8" step="1" value="4" aria-label="Darab/fő"><output id="db_o" for="db"></output></div>
<div class="row"><label for="m">Kész tömeg/db</label><input id="m" type="range" min="15" max="40" step="1" value="25" aria-label="Kész tömeg/db"><output id="m_o" for="m"></output></div>
<div class="row"><label for="vesz">Sütési veszteség</label><input id="vesz" type="range" min="5" max="20" step="1" value="12" aria-label="Sütési veszteség"><output id="vesz_o" for="vesz"></output></div>
<div class="row"><label for="pl">Liszt egységára</label><input id="pl" type="range" min="200" max="800" step="10" value="400" aria-label="Liszt egységára"><output id="pl_o" for="pl"></output></div>
<div class="row"><label for="pv">Vaj egységára</label><input id="pv" type="range" min="3000" max="8000" step="100" value="5500" aria-label="Vaj egységára"><output id="pv_o" for="pv"></output></div>
<div class="row"><label for="pt">Tojás egységára</label><input id="pt" type="range" min="40" max="150" step="5" value="80" aria-label="Tojás egységára"><output id="pt_o" for="pt"></output></div>
<div class="row"><label for="egy">Töltelék és egyéb / 10 adag</label><input id="egy" type="range" min="300" max="2000" step="50" value="900" aria-label="Töltelék és egyéb / 10 adag"><output id="egy_o" for="egy"></output></div>
<div class="row"><label for="r">Árrés-szint</label><input id="r" type="range" min="30" max="75" step="1" value="60" aria-label="Árrés-szint"><output id="r_o" for="r"></output></div>
<div class="row"><label for="afa">ÁFA-kulcs (ellenőrizendő)</label><select id="afa" aria-label="ÁFA-kulcs (ellenőrizendő)"><option value="5" selected>5% – helyben fogyasztott étel</option><option value="27">27% – egyes elviteles/kiszállított esetek</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 680 245" role="img" aria-label="Kalkulátor: 60 főre 240 kosárka; anyagköltség 10 605 Ft, 44 Ft/db; nettó ár 110 Ft/db, bruttó 116 Ft/db."></svg>
<p class="small">Tanulási kalkulátor a fejezet képleteivel. A veszteség, az árrés-szint és az ÁFA-kulcs tanulási érték (ellenőrizendő: üzemi technológiai norma, hatályos ÁFA-törvény, NAV). Az üzemi kalkuláció a Szakmai számítások II. fejezet módszerével készül.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"n":"fő", "db":"db", "m":"g", "vesz":"%", "pl":"Ft/kg", "pv":"Ft/kg", "pt":"Ft/db", "egy":"Ft", "r":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const pcs=v.n*v.db, k=pcs/40, li=250*k, va=125*k, to=k, nyers=li+va+to*50, sult=nyers*(1-v.vesz/100);
const kesz=pcs*v.m, tolt=kesz-sult, tarany=100*tolt/kesz;
const ko=li/1000*v.pl+va/1000*v.pv+to*v.pt+v.egy*k, A=Math.round(ko/pcs), Pn=A/(1-v.r/100), Pb=Math.round(Pn*(1+v.afa/100));
const n0=(x)=>Math.round(x).toLocaleString("hu-HU");
const rows=[["1. Darabszám","létszám · darab/fő",v.n+" · "+v.db+" = "+pcs+" db"],
 ["2. Szorzószám","k = darab / 40",fmt(k,2)],
 ["3. Nyersanyag","alaprecept · k","liszt "+n0(li)+" g, vaj "+n0(va)+" g, tojás "+fmt(to,1)+" db"],
 ["4. Nyers tészta","liszt + vaj + tojás · 50 g",n0(nyers)+" g"],
 ["5. Kisütött alap","nyers · (1 − veszteség)",n0(sult)+" g"],
 ["6. Töltelék","darab · kész tömeg − alap",n0(tolt)+" g ("+fmt(tarany,1)+"%)"],
 ["7. Anyagköltség","Σ mennyiség · egységár",n0(ko)+" Ft; "+A+" Ft/db"],
 ["8. Nettó ár","A / (1 − árrés-szint)",n0(Pn)+" Ft/db"],
 ["9. Bruttó ár","Pₙ · (1 + ÁFA)",n0(Pb)+" Ft/db"]];
rows.forEach((r,i)=>{const y=24+i*26;
 if(i%2==0)el("rect",{x:0,y:y-17,width:680,height:26,fill:"#8885",opacity:.25});
 el("text",{x:6,y:y,"font-size":13,"font-weight":"bold"},r[0]);el("text",{x:170,y:y,"font-size":13,"font-style":"italic"},r[1]);
 el("text",{x:420,y:y,"font-size":13,fill:(i==5&&tarany<40)?css("--bad"):(css("--fg")||"#111")},r[2]);});
status((tarany<40?'<span class="bad">Figyelem: a töltelék aránya 40% alá esett – a kosárka túlnyomórészt tészta.</span><br>':'')+
 (tolt<0?'<span class="bad">A kisütött alap nehezebb, mint a kész tömeg – növeld a kész tömeget vagy csökkentsd a tésztát.</span><br>':'')+
 "Anyagköltség összesen <b>"+n0(ko)+" Ft</b>, darabonként <b>"+A+" Ft</b>; nettó ár <b>"+n0(Pn)+" Ft/db</b>, bruttó <b>"+n0(Pb)+" Ft/db</b>.");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
