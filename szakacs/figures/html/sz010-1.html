<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A konyha hőmérséklet-skálája</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="T">Hőmérséklet</label><input id="T" type="range" min="-30" max="100" step="1" value="35" aria-label="Hőmérséklet"><output id="T_o" for="T"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 340" role="img" aria-label="Hőmérő −30 és 100 °C között, rajta a fagyasztás, a hűtés, az 5–60 °C-os veszélyes zóna, a melegen tartás és a hőkezelés sávjai; a csúszkával választott hőmérséklethez a lap kiírja a sáv nevét és a teendőt."></svg>
<p class="small">Tanulási értékek a fejezet szövegével egyezően (ellenőrizendő: NÉBIH-útmutató / hatályos rendelet / HACCP-terv). A szaporodási példa a 3.1.7 generációs-idő képletéből számolt tanulási adat.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"T":"°C"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const t=v.T, W=560, H=340; S.setAttribute("viewBox","0 0 "+W+" "+H);
const y=x=>320-(x+30)*2.3;
const bands=[[-30,-18,"#dde8f3"],[-18,0,"#f4f4f4"],[0,5,"#cfe3f7"],[5,60,"#f6c9c4"],[60,100,"#f7e0b5"]];
bands.forEach(b=>el("rect",{x:40,y:y(b[1]),width:46,height:y(b[0])-y(b[1]),fill:b[2],stroke:"#333","stroke-width":0.6}));
el("rect",{x:40,y:y(45),width:46,height:y(20)-y(45),fill:"none",stroke:"#000","stroke-dasharray":"4 3","stroke-width":1.4});
for(let k=-30;k<=100;k+=10){el("line",{x1:86,x2:94,y1:y(k),y2:y(k),stroke:"#333"});el("text",{x:34,y:y(k)+4,"text-anchor":"end","font-size":11,fill:css("--fg")||"#111"},String(k).replace("-","−"));}
el("line",{x1:30,x2:130,y1:y(t),y2:y(t),stroke:"#c00","stroke-width":3});
el("circle",{cx:63,cy:y(t),r:7,fill:"#c00"});
let n,d;
if(t< -18+0.001){n="fagyasztott tárolás";d="a mikrobák nem szaporodnak, de nem pusztulnak el – felolvasztás után újra szaporodhatnak.";}
else if(t<0){n="átmeneti sáv";d="fagyasztáskor minél gyorsabban haladj át rajta; a fagyasztott tárolás −18 °C alatt, a hűtött tárolás a HACCP-terv szerinti hűtőhőmérsékleten történik.";}
else if(t<=5){n="hűtött tárolás";d="a szaporodás nagyon lelassul; a pontos maximum (pl. +4 °C vagy +5 °C) a HACCP-terv szerint.";}
else if(t<60){n="VESZÉLYES ZÓNA";d="gyorsan hűtsd vagy hevítsd! "+(t>=20&&t<=45?"Itt a mezofil kórokozók a leggyorsabban szaporodnak: ":"")+"20 perces generációs idővel számolva 2 óra alatt 100 baktériumból 100·2<sup>6</sup> = 6400 lesz (tanulási példa; a valós ütem a hőmérséklettől és az ételtől függ).";}
else if(t<100){n="melegen tartás / hőkezelés";d="a legtöbb kórokozó nem szaporodik; hőkezelésnél a maghőmérsékletet maghőmérővel ellenőrizd (érték: HACCP-terv).";}
else {n="forrás";d="a víz forr (tengerszinten); a hőálló spórák és toxinok egy része ezt is túléli.";}
el("text",{x:150,y:y(t)+5,"font-size":15,"font-weight":"bold",fill:css("--fg")||"#111"},fmt(t,0)+" °C – "+n);
status("<b>"+fmt(t,0)+" °C: "+n+"</b> – "+d);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
