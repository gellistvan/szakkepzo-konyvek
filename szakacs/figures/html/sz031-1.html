<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energia és tápanyagarány</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="sex">Nem (BMR-tényező)</label><select id="sex" aria-label="Nem (BMR-tényező)"><option value="21.6" selected>nő – 21,6 kcal/ttkg/nap</option><option value="24">férfi – 24 kcal/ttkg/nap</option></select></div>
<div class="row"><label for="mass">Testtömeg</label><input id="mass" type="range" min="40" max="130" step="1" value="70" aria-label="Testtömeg"><output id="mass_o" for="mass"></output></div>
<div class="row"><label for="pal">Aktivitás (PAL)</label><select id="pal" aria-label="Aktivitás (PAL)"><option value="1.2">1,2 ülő</option><option value="1.4" selected>1,4 mérsékelt</option><option value="1.6">1,6 közepes</option><option value="1.8">1,8 nehéz fizikai munka</option></select></div>
<div class="row"><label for="pf">Fehérje aránya</label><input id="pf" type="range" min="10" max="35" step="1" value="15" aria-label="Fehérje aránya"><output id="pf_o" for="pf"></output></div>
<div class="row"><label for="pz">Zsír aránya</label><input id="pz" type="range" min="20" max="40" step="1" value="30" aria-label="Zsír aránya"><output id="pz_o" for="pz"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 200" role="img" aria-label="Kalkulátor: nem, testtömeg és PAL alapján BMR és TDEE, majd a fehérje, szénhidrát, zsír energia- és grammértéke sávdiagrammal."></svg>
<p class="small">Tanulási becslés a fejezet egyszerűsített módszerével (ellenőrizendő: EFSA/MDOSZ ajánlás, OKOSTÁNYÉR); a szénhidrát aránya = 100% − fehérje − zsír. Nem dietetikai tanács: diétát orvosi/dietetikusi javaslat alapján kell végrehajtani.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"mass":"kg", "pf":"%", "pz":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const kpk={f:4,s:4,z:9};
const bmr=v.mass*v.sex, tdee=bmr*v.pal;
let pf=v.pf, pz=v.pz, ps=100-pf-pz;
const fg=css("--fg")||"#111";
const e={f:tdee*pf/100,s:tdee*ps/100,z:tdee*pz/100}, g={f:e.f/4,s:e.s/4,z:e.z/9}, gt=g.f+g.s+g.z;
const names={f:"fehérje",s:"szénhidrát",z:"zsír"}, fill={f:"url(#hf)",s:"url(#hs)",z:"#8a8a8a"};
el("defs",{});
const d=FIG.svg.lastChild;
d.innerHTML='<pattern id="hf" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="white"/><line x1="0" y1="0" x2="0" y2="8" stroke="black" stroke-width="2"/></pattern><pattern id="hs" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="white"/><circle cx="3" cy="3" r="1.1" fill="black"/></pattern>';
[["energia szerint",e,tdee," kcal"],["tömeg szerint",g,gt," g"]].forEach((r,i)=>{const y=40+i*90;let x=150;
  el("text",{x:140,y:y+30,"text-anchor":"end","font-size":13,fill:fg},r[0]);
  ["f","s","z"].forEach(k=>{const w=460*r[1][k]/r[2];el("rect",{x:x,y:y,width:Math.max(0,w),height:50,fill:fill[k],stroke:"black","stroke-width":1.2});
   if(w>60){el("rect",{x:x+w/2-46,y:y+14,width:92,height:22,fill:"white",opacity:.9});
   el("text",{x:x+w/2,y:y+30,"text-anchor":"middle","font-size":12,fill:"#111"},names[k]+" "+Math.round(100*r[1][k]/r[2])+"%");}x+=w;});});
if(ps<40){status("<b>Az arányok összege nem lehet 100% ennyi fehérjével és zsírral – csökkentsd valamelyiket.</b>");return;}
status(`BMR ≈ <b>${Math.round(bmr)} kcal</b>; TDEE = BMR · PAL ≈ <b>${Math.round(tdee)} kcal</b> (${Math.round(tdee*4.184)} kJ).<br>`+
 `Fehérje ${pf}% → ${Math.round(e.f)} kcal → <b>${Math.round(g.f)} g</b>; szénhidrát ${ps}% → ${Math.round(e.s)} kcal → <b>${Math.round(g.s)} g</b>; `+
 `zsír ${pz}% → ${Math.round(e.z)} kcal → <b>${Math.round(g.z)} g</b>.<br><i>Tanulási becslés, nem dietetikai tanács.</i>`);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
