<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utánsülés és pihentetés</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="tout">Kivételi maghőmérséklet</label><input id="tout" type="range" min="60" max="75" step="1" value="68" aria-label="Kivételi maghőmérséklet"><output id="tout_o" for="tout"></output></div>
<div class="row"><label for="rest">Pihentetési idő</label><input id="rest" type="range" min="0" max="20" step="1" value="8" aria-label="Pihentetési idő"><output id="rest_o" for="rest"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 362" role="img" aria-label="Grafikon: a maghőmérséklet sütés közben emelkedik, a sütőből kivétel után néhány percig tovább nő, majd csökken; a 75 °C-os határ szaggatott vonallal jelölve."></svg>
<p class="small">Szemléltető modell, nem mért adat (kétrétegű Newton-féle hőátadás, a fejezet két példájához igazítva). A 75 °C tanulási határ (ellenőrizendő: HACCP-terv). A konyhán mindig a maghőmérővel mért érték dönt.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"tout":"°C", "rest":"min"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const A=0.03,B=0.05,C=0.08,TOV=180.0,TAMB=22.0,T0=18.0;
let Ts=T0,Tc=T0,t=0,tout=null;const dt=0.05,P=[];let Tmax=0,tmax=0;
while(true){const Te=tout===null?TOV:TAMB;const nTs=Ts+(A*(Te-Ts)+B*(Tc-Ts))*dt;Tc=Tc+C*(Ts-Tc)*dt;Ts=nTs;t+=dt;
 P.push([t,Ts,Tc]);if(tout===null&&Tc>=v.tout)tout=t;if(tout!==null){if(Tc>Tmax){Tmax=Tc;tmax=t;}if(t>=tout+Math.max(v.rest,0.01)+25)break;}if(t>150)break;}
const fg=css("--fg")||"#111",mu="#8a8a8a";
const X=m=>60+m*(560/90),Y=c=>320-c*(290/100);
el("rect",{x:X(0),y:Y(60),width:560,height:Y(5)-Y(60),fill:"rgba(138,138,138,.18)"});
el("text",{x:X(88),y:Y(8),"text-anchor":"end","font-size":12,fill:fg},"veszélyes zóna (kb. 5–60 °C, ellenőrizendő)");
[0,20,40,60,75,100].forEach(c=>{el("line",{x1:60,x2:620,y1:Y(c),y2:Y(c),stroke:mu,"stroke-width":c===75?1.4:.4,"stroke-dasharray":c===75?"6 4":""});
 el("text",{x:52,y:Y(c)+4,"text-anchor":"end","font-size":12,fill:fg},c);});
for(let m=0;m<=90;m+=10)el("text",{x:X(m),y:338,"text-anchor":"middle","font-size":12,fill:fg},m);
el("text",{x:340,y:356,"text-anchor":"middle","font-size":12,fill:fg},"idő (min)");
let d1="",d2="";P.forEach((p,i)=>{if(p[0]>90)return;d1+=(i?"L":"M")+X(p[0])+","+Y(Math.min(p[2],100));d2+=(i?"L":"M")+X(p[0])+","+Y(Math.min(p[1],100));});
el("path",{d:d2,fill:"none",stroke:fg,"stroke-width":1.4,"stroke-dasharray":"2 3"});
el("path",{d:d1,fill:"none",stroke:fg,"stroke-width":2.6});
el("line",{x1:X(tout),x2:X(tout),y1:Y(0),y2:Y(100),stroke:mu,"stroke-width":1.4});
el("line",{x1:X(tout+v.rest),x2:X(tout+v.rest),y1:Y(0),y2:Y(100),stroke:fg,"stroke-width":1,"stroke-dasharray":"3 3"});
let Tend=Tc;P.forEach(p=>{if(Math.abs(p[0]-(tout+v.rest))<dt/2+1e-9)Tend=p[2];});
const maxIn=Math.max(...P.filter(p=>p[0]<=tout+v.rest).map(p=>p[2]));
const ok=maxIn>=75;
status(`<b>${ok?"ELÉRI":"NEM ÉRI EL"} a 75 °C-os tanulási határt</b> a ${fmt(v.rest,0)} perces pihentetés alatt.<br>`+
 `Kivétel: ${fmt(tout,1)} min-nél, mag ${fmt(v.tout,0)} °C; a pihentetés végén ${fmt(Tend,1)} °C; elért legnagyobb: ${fmt(maxIn,1)} °C.<br>`+
 `Átlagos emelkedés a pihentetés alatt (a fejezet képletével): v = ΔT/Δt = ${v.rest>0?fmt((Tend-v.tout)/v.rest,2):"–"} °C/min.`);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
