<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porrobbanás</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#555;--hl:#1f4e79;--btn:#f2f2f2;--bd:#888}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--btn:#2b2b2b;--bd:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
button{font:inherit;padding:3px 10px;cursor:pointer;background:var(--btn);color:var(--fg);border:1px solid var(--bd);border-radius:4px}
button.on{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:120px}
.pane{background:#fff;color:#111;border-radius:6px;padding:6px}
.pane svg{width:100%;height:auto;display:block}
#status{margin:6px 0;min-height:3em}
.small{font-size:12px;color:var(--muted)}
.parts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.parts button{font-size:13px;padding:2px 7px}
.dim{opacity:.18;transition:opacity .15s}
label{margin-right:10px;white-space:nowrap}</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
<button id="first" title="Első lépés">⏮</button><button id="prev">◀ Lépés</button>
<button id="play">▶ Lejátszás</button><button id="next">Lépés ▶</button>
<input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása"><span id="cnt" class="small"></span></div>
<div id="status" aria-live="polite"></div>
<div class="pane" id="pane" role="img" aria-label="Három lépés: robbanás a szűrőházban, a lökéshullám felkavarja a polcokon és gerendákon lerakódott port, majd az egész műhelyben robban." style="max-width:600px;margin:0 auto"></div>
<div class="pane" style="background:transparent;color:inherit;padding:0">
<div class="ctl"><label for="d">Porréteg vastagsága</label><input id="d" type="range" min="0" max="3" step="0.1" value="1"><output id="d_o"></output></div>
<div class="ctl"><label for="lel">Alsó robbanási határ</label><input id="lel" type="range" min="30" max="80" step="5" value="60"><output id="lel_o"></output></div>
<div class="ctl"><label for="rho">Halmazsűrűség</label><input id="rho" type="range" min="100" max="300" step="10" value="200"><output id="rho_o"></output></div>
<div id="calc" style="margin:6px 0"></div></div>
<p class="small">Sematikus metszet. A kalkulátor a fejezet példájának 120 m³-es (40 m² × 3 m) műhelyével számol; a halmazsűrűség és az alsó robbanási határ tájékoztató (ellenőrizendő).</p>

let k=0,timer=null;const pane=document.getElementById("pane"),st=document.getElementById("status");
const pos=document.getElementById("pos");if(pos)pos.max=FR.length-1;
function show(i){k=Math.max(0,Math.min(FR.length-1,i));pane.innerHTML=FR[k].svg;st.innerHTML=FR[k].msg;
 if(pos){pos.value=k;document.getElementById("cnt").textContent=(k+1)+"/"+FR.length;}
 document.querySelectorAll("[data-i]").forEach(b=>b.classList.toggle("on",+b.dataset.i===k));
 if(typeof after==="function")after(k);}
function stop(){if(timer){clearInterval(timer);timer=null;}const p=document.getElementById("play");if(p)p.textContent="▶ Lejátszás";}
document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>show(+b.dataset.i));
if(pos){document.getElementById("first").onclick=()=>{stop();show(0);};
document.getElementById("prev").onclick=()=>{stop();show(k-1);};
document.getElementById("next").onclick=()=>{stop();show(k+1);};
document.getElementById("play").onclick=()=>{if(timer){stop();return;}if(k>=FR.length-1)show(0);
 document.getElementById("play").textContent="⏸ Szünet";timer=setInterval(()=>{if(k>=FR.length-1)stop();else show(k+1);},2600);};
pos.oninput=()=>{stop();show(+pos.value);};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){stop();show(k+1);}if(e.key==="ArrowLeft"){stop();show(k-1);}});}
const f=(x,d)=>Number(x).toFixed(d).replace(".",",");
function calc(){const d=+document.getElementById("d").value, lel=+document.getElementById("lel").value, rho=+document.getElementById("rho").value;
 document.getElementById("d_o").textContent=f(d,1)+" mm";document.getElementById("lel_o").textContent=lel+" g/m³";document.getElementById("rho_o").textContent=rho+" kg/m³";
 const m=40*d/1000*rho, need=120*lel/1000, ratio=need>0?m/need:0, c=m*1000/120;
 document.getElementById("calc").innerHTML="40 m² padlón "+f(d,1)+" mm por: m = 40 m² · "+f(d/1000,4)+" m · "+rho+" kg/m³ = <b>"+f(m,1)+" kg</b>. "
  +"A 120 m³-es légtér alsó robbanási határához kell: 120 · "+lel+" g = "+f(need,1)+" kg. Felkavarva elméletileg "+f(c,0)+" g/m³, "
  +"<b>az alsó robbanási határ "+f(ratio,1)+"-szerese</b>"+(ratio>=1?" – <span style='color:#b71c1c;font-weight:bold'>robbanóképes porfelhő lehet</span>.":".")
  +" (Tájékoztató értékek, ellenőrizendő; a robbanás helyi porfelhőben már kevesebb porral is indulhat.)";}
["d","lel","rho"].forEach(i=>document.getElementById(i).addEventListener("input",calc));calc();
show(0);
