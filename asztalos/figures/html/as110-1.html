<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szórófülke légárama</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="typ">leválasztás</label><select id="typ" aria-label="leválasztás"><option value="1" selected>száraz szűrő</option><option value="2">vízfüggöny</option></select></div>
<div class="row"><label for="wn">nyílás szélessége</label><input id="wn" type="range" min="1.0" max="3.0" step="0.1" value="1.8" aria-label="nyílás szélessége"><output id="wn_o" for="wn"></output></div>
<div class="row"><label for="hn">nyílás magassága</label><input id="hn" type="range" min="0.6" max="2.0" step="0.1" value="0.9" aria-label="nyílás magassága"><output id="hn_o" for="hn"></output></div>
<div class="row"><label for="vm">mért légsebesség</label><input id="vm" type="range" min="0.1" max="1.0" step="0.05" value="0.6" aria-label="mért légsebesség"><output id="vm_o" for="vm"></output></div>
<div class="row"><label for="vmin">minimum (gépkönyv szerint)</label><input id="vmin" type="range" min="0.3" max="0.8" step="0.05" value="0.5" aria-label="minimum (gépkönyv szerint)"><output id="vmin_o" for="vmin"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szórófülke oldalmetszete légárammal és légszállítással"></svg>
<p class="small">Sematikus oldalmetszet; a nyilak száma és vastagsága a mért légsebességgel arányos. A minimális légsebességet a gépkönyv adja (itt 0,5 m/s csak alapérték, ellenőrizendő). Alapértékek: a fejezet számpéldája (1,8 × 0,9 m, 0,6 m/s → ≈ 3500 m³/h).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"wn":"m", "hn":"m", "vm":"m/s", "vmin":"m/s"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const A=v.wn*v.hn, Q=v.vm*A, Qh=Q*3600, ok=v.vm>=v.vmin;
status("A = "+fmt(v.wn,1)+" · "+fmt(v.hn,1)+" = "+fmt(A,2)+" m²; Q = v·A = "+fmt(v.vm,2)+" · "+fmt(A,2)+" = "+fmt(Q,3)+
  " m³/s ≈ <b>"+Math.round(Qh/10)*10+" m³/h</b>. "+(ok?"<span class='ok'>A légsebesség megfelelő.</span>":
  "<span class='bad'>A légsebesség a minimum alatt: a szórásköd visszaáramolhat a kezelő felé – szűrőcsere / vízfüggöny ellenőrzése, újramérés; addig szórni tilos.</span>"));
const ln=(x1,y1,x2,y2,w,dash)=>el("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:"#000","stroke-width":w||2,"stroke-dasharray":dash||""});
el("rect",{x:0,y:0,width:560,height:300,fill:"#fff"});
ln(10,260,550,260,2); ln(80,60,440,60,3); ln(440,60,440,260,3); ln(80,60,80,85,3);
el("rect",{x:12,y:70,width:30,height:70,fill:"#fff",stroke:"#000"}); el("text",{x:8,y:60,"font-size":11,fill:"#000"},"befúvás");
// kezelő
el("circle",{cx:60,cy:140,r:10,fill:"#fff",stroke:"#000","stroke-width":2}); ln(60,150,60,205,3); ln(60,205,48,258,3); ln(60,205,72,258,3); ln(60,165,95,175,2.5);
el("rect",{x:92,y:168,width:20,height:12,fill:"#bbb",stroke:"#000"});
// állvány + munkadarab
ln(230,260,230,190,3); el("rect",{x:208,y:120,width:44,height:70,fill:"#e6e6e6",stroke:"#000","stroke-width":2});
// leválasztó
if(v.typ==1){const g=Math.max(0,Math.min(1,1-v.vm/0.8)); const c=Math.round(255-170*g);
  el("rect",{x:395,y:80,width:22,height:170,fill:"rgb("+c+","+c+","+c+")",stroke:"#000","stroke-width":2});
  el("text",{x:370,y:76,"font-size":11,fill:"#000"},"száraz szűrő");}
else{for(let i=0;i<3;i++){let p="";for(let y=80;y<=245;y+=5)p+=(y==80?"M":"L")+(398+i*9+3*Math.sin(y/6))+" "+y; el("path",{d:p,fill:"none",stroke:"#000"});}
  el("rect",{x:385,y:240,width:55,height:20,fill:"#999",stroke:"#000"}); el("text",{x:372,y:76,"font-size":11,fill:"#000"},"vízfüggöny");}
// ventilátor
el("circle",{cx:470,cy:80,r:20,fill:"#fff",stroke:"#000","stroke-width":2}); ln(440,100,500,100,2); ln(490,60,490,20,2); ln(510,100,510,20,2);
el("text",{x:455,y:125,"font-size":11,fill:"#000"},"ventilátor");
// légáram: nyilak száma/vastagsága a sebességgel
const n=Math.max(1,Math.round(v.vm*6)), w=1+3*v.vm;
for(let i=0;i<n;i++){const y=95+i*(150/Math.max(1,n-1||1));
  ln(30,y,380,y,w); el("path",{d:"M380 "+(y-6)+" L392 "+y+" L380 "+(y+6)+" Z",fill:"#000"});}
if(!ok){ for(const y of [150,200]){ ln(370,y,120,y-10,2.5,"7 5"); el("path",{d:"M120 "+(y-16)+" L106 "+(y-9)+" L120 "+(y-4)+" Z",fill:"#b71c1c"});}
  el("text",{x:150,y:285,"font-size":13,"font-weight":"bold",fill:"#b71c1c"},"visszaáramlás a kezelő felé!");}
el("text",{x:150,y:50,"font-size":11,fill:"#000"},"Ex-lámpatest kívül, üvegen át világít");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
