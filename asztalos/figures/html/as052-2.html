<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felmérés: átló- és falhossz-kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="a">Fal a</label><input id="a" type="range" min="2000" max="4000" step="1" value="3001" aria-label="Fal a"><output id="a_o" for="a"></output></div>
<div class="row"><label for="b">Oldalfal b</label><input id="b" type="range" min="1500" max="3500" step="1" value="2400" aria-label="Oldalfal b"><output id="b_o" for="b"></output></div>
<div class="row"><label for="d">Mért átló d</label><input id="d" type="range" min="2500" max="5300" step="1" value="3846" aria-label="Mért átló d"><output id="d_o" for="d"></output></div>
<div class="row"><label for="l1">Falhossz felül</label><input id="l1" type="range" min="2950" max="3050" step="1" value="3010" aria-label="Falhossz felül"><output id="l1_o" for="l1"></output></div>
<div class="row"><label for="l2">Falhossz középen</label><input id="l2" type="range" min="2950" max="3050" step="1" value="3001" aria-label="Falhossz középen"><output id="l2_o" for="l2"></output></div>
<div class="row"><label for="l3">Falhossz alul</label><input id="l3" type="range" min="2950" max="3050" step="1" value="2992" aria-label="Falhossz alul"><output id="l3_o" for="l3"></output></div>
<div class="row"><label for="h">Hézag oldalanként</label><input id="h" type="range" min="0" max="15" step="1" value="5" aria-label="Hézag oldalanként"><output id="h_o" for="h"></output></div>
<div class="row"><label for="p">Falhosszak</label><select id="p" aria-label="Falhosszak"><option value="0" selected>csúszkákból (12.5.2 konyhafal)</option><option value="1">3. feladat: 2405 / 2412 / 2398</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 330" role="img" aria-label="Átló-kalkulátor a sarok szögére és a három mért falhosszból számolt szekrényhosszra szerelési hézaggal."></svg>
<p class="small">Az oldalfal hossza és az átló gyakorló értékek; a 3-4-5 próbánál a = 3000, b = 4000 mellett d = 5000 mm jelent derékszöget. A szerelési hézag tájékoztató (ellenőrizendő: szerelési útmutató).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"a":"mm", "b":"mm", "d":"mm", "l1":"mm", "l2":"mm", "l3":"mm", "h":"mm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const a=v.a,b=v.b,d=v.d,g=Math.acos((a*a+b*b-d*d)/(2*a*b)),deg=g*180/Math.PI,dev=3000*Math.tan(g-Math.PI/2);
const Ls=(v.p==1)?[2405,2412,2398]:[v.l1,v.l2,v.l3];
const mn=Math.min(...Ls),mx=Math.max(...Ls),cab=mn-2*v.h;
// alaprajzi sarok (eltúlzott szögben)
const ox=100,oy=300,s=0.06,ex=(g-Math.PI/2)*8;
el("line",{x1:ox,y1:oy,x2:ox+a*s,y2:oy,stroke:css("--line"),"stroke-width":3});
el("line",{x1:ox,y1:oy,x2:ox+b*s*Math.cos(Math.PI/2+ex),y2:oy-b*s*Math.sin(Math.PI/2+ex),stroke:css("--line"),"stroke-width":3});
el("line",{x1:ox+a*s,y1:oy,x2:ox+b*s*Math.cos(Math.PI/2+ex),y2:oy-b*s*Math.sin(Math.PI/2+ex),stroke:css("--hl"),"stroke-dasharray":"6 4","stroke-width":2});
el("text",{x:ox+a*s/2,y:oy+20,"text-anchor":"middle","font-size":13},`a = ${a}`);
el("text",{x:ox-10,y:oy-b*s/2,"text-anchor":"end","font-size":13},`b = ${b}`);
el("text",{x:ox+a*s/2+20,y:oy-b*s/2-6,"font-size":13,style:"fill:"+css("--hl")},`átló d = ${d}`);
el("text",{x:ox+6,y:oy-8,"font-size":13},`${fmt(deg,2)}°`);
el("text",{x:ox,y:30,"font-size":12},"(a szög eltérése a rajzon 8-szorosan nagyítva)");
// falhosszak
const bx=360;el("text",{x:bx,y:60,"font-size":14},"Mért falhosszak:");
Ls.forEach((q,i)=>el("text",{x:bx,y:85+i*22,"font-size":14,style:q==mn?"font-weight:bold;fill:"+css("--hl2"):""},`${["felül","középen","alul"][i]}: ${q} mm`+(q==mn?" ← legkisebb":"")));
el("text",{x:bx,y:170,"font-size":14},`szekrénysor: ${mn} − 2 · ${v.h} = ${cab} mm`);
status(`Átló-ellenőrzés: cos γ = (a² + b² − d²) / (2ab) → γ = <b>${fmt(deg,2)}°</b>; 3 m-es szakaszon az eltérés a derékszögtől ≈ <b>${fmt(dev,1)} mm</b>. `+
 `Falhosszak: legnagyobb eltérés ${mx-mn} mm; a szekrénysor hossza a legkisebb méretből, ${v.h} mm-es hézaggal oldalanként: <b>${cab} mm</b>.`);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
