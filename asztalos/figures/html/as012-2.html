<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c}

*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.pic{position:relative;background:#fff;border:1px solid #999;max-width:100%}
.pic img{display:block;width:100%;height:auto}
.hs{position:absolute;border:2px solid transparent;border-radius:4px;cursor:pointer;background:rgba(0,0,0,0)}
.hs:hover,.hs:focus,.hs.on{border-color:#c55a11;background:rgba(197,90,17,.12);outline:none}
.hs.good{border-color:#2e7d32;background:rgba(46,125,50,.15)}
.hs.wrong{border-color:#b71c1c;background:rgba(183,28,28,.12)}
#status{margin:8px 0;min-height:3.2em}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
button{font:inherit;padding:3px 10px;cursor:pointer}
button.on{font-weight:bold;outline:2px solid var(--hl)}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
.small{font-size:12px;color:var(--muted)}</style>

const R=[{"name": "Ép: ép, sérülésmentes\nköpeny", "desc": "Ez az ép állapot – így kell kinéznie használat előtt.", "l": 2.42, "t": 22.14, "w": 15.59, "h": 29.64}, {"name": "HIBÁS: sérült köpeny,\nkilátszó erek", "desc": "A köpeny megsérült, az erek szigetelése látszik: áramütés- és zárlatveszély. Vedd ki a használatból.", "l": 2.42, "t": 55.93, "w": 15.59, "h": 29.64}, {"name": "HIBÁS: kihúzódott köpeny,\nlátszó erek", "desc": "A köpeny kicsúszott a dugasz húzásmentesítőjéből, az erek közvetlenül terhelődnek és elszakadhatnak.", "l": 18.55, "t": 22.14, "w": 15.59, "h": 29.64}, {"name": "Ép: a köpeny a dugaszba\nbefogva", "desc": "Ez az ép állapot – így kell kinéznie használat előtt.", "l": 18.55, "t": 55.93, "w": 15.59, "h": 29.64}, {"name": "HIBÁS: repedt dugaszház", "desc": "A repedt dugaszházon át megérinthető a feszültség alatti rész.", "l": 34.68, "t": 22.14, "w": 15.59, "h": 29.64}, {"name": "Ép: ép dugaszház", "desc": "Ez az ép állapot – így kell kinéznie használat előtt.", "l": 34.68, "t": 55.93, "w": 15.59, "h": 29.64}, {"name": "Ép: tiszta, fémes\nérintkezők", "desc": "Ez az ép állapot – így kell kinéznie használat előtt.", "l": 50.81, "t": 22.14, "w": 15.59, "h": 29.64}, {"name": "HIBÁS: égett, elszíneződött\nérintkező", "desc": "Az égésnyom laza, túlmelegedő érintkezőre utal; a dugasz és az aljzat is cserére szorulhat.", "l": 50.81, "t": 55.93, "w": 15.59, "h": 29.64}, {"name": "HIBÁS: feltekert dob:\nfelmelegszik", "desc": "A feltekert kábel rosszul hűl, a szigetelés megolvadhat: nagyobb gépnél a dobot teljesen tekerd le.", "l": 66.94, "t": 22.14, "w": 15.59, "h": 29.64}, {"name": "Ép: teljesen letekert\nkábel", "desc": "Ez az ép állapot – így kell kinéznie használat előtt.", "l": 66.94, "t": 55.93, "w": 15.59, "h": 29.64}, {"name": "TILOS: szigetelőszalagos „javítás”", "desc": "A szigetelőszalag nem pótolja a köpenyt: a kábelt cserélni kell.", "l": 83.87, "t": 55.93, "w": 15.59, "h": 29.64}];
const Q=[{"q": "<b>Köpeny:</b> melyik kép mutatja a hibás állapotot? Kattints rá!", "a": [1], "why": "A köpeny megsérült, az erek szigetelése látszik: áramütés- és zárlatveszély. Vedd ki a használatból."}, {"q": "<b>Köpeny a\ndugasznál:</b> melyik kép mutatja a hibás állapotot? Kattints rá!", "a": [2], "why": "A köpeny kicsúszott a dugasz húzásmentesítőjéből, az erek közvetlenül terhelődnek és elszakadhatnak."}, {"q": "<b>Dugaszház:</b> melyik kép mutatja a hibás állapotot? Kattints rá!", "a": [4], "why": "A repedt dugaszházon át megérinthető a feszültség alatti rész."}, {"q": "<b>Érintkezők:</b> melyik kép mutatja a hibás állapotot? Kattints rá!", "a": [7], "why": "Az égésnyom laza, túlmelegedő érintkezőre utal; a dugasz és az aljzat is cserére szorulhat."}, {"q": "<b>Kábeldob nagy\nterhelésnél:</b> melyik kép mutatja a hibás állapotot? Kattints rá!", "a": [8], "why": "A feltekert kábel rosszul hűl, a szigetelés megolvadhat: nagyobb gépnél a dobot teljesen tekerd le."}, {"q": "Melyik „javítás” tilos?", "a": [10], "why": "A szigetelőszalagos javítás tilos; a sérült kábelt cserélni kell."}];
const pic=document.getElementById("pic"), st=document.getElementById("status");
let mode="exp", qi=0, good=0, tried=0, answered=false;
const H=R.map((r,i)=>{const d=document.createElement("div");d.className="hs";d.tabIndex=0;d.setAttribute("role","button");
 d.setAttribute("aria-label",r.name);d.title=r.name;
 Object.assign(d.style,{left:r.l+"%",top:r.t+"%",width:r.w+"%",height:r.h+"%"});
 const show=()=>{if(mode=="exp")st.innerHTML="<b>"+r.name+".</b> "+r.desc;};
 d.addEventListener("mouseenter",show);d.addEventListener("focus",show);
 d.addEventListener("click",()=>{if(mode=="exp"){H.forEach(x=>x.classList.remove("on"));d.classList.add("on");show();}else answer(i);});
 d.addEventListener("keydown",e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();d.click();}});
 pic.appendChild(d);return d;});
function clearMarks(){H.forEach(x=>x.classList.remove("on","good","wrong"));}
function ask(){clearMarks();answered=false;const q=Q[qi];st.innerHTML="<b>"+(qi+1)+"/"+Q.length+".</b> "+q.q;
 document.getElementById("qNext").style.display="none";}
function answer(i){if(answered)return;const q=Q[qi];answered=true;tried++;
 if(q.a.includes(i)){good++;H[i].classList.add("good");st.innerHTML="<span class='ok'>Helyes!</span> "+q.why;}
 else{H[i].classList.add("wrong");q.a.forEach(j=>H[j].classList.add("good"));st.innerHTML="<span class='bad'>Nem ez.</span> Ez: <b>"+R[i].name+"</b>. "+q.why;}
 document.getElementById("score").textContent=good+"/"+tried+" helyes";
 const n=document.getElementById("qNext");n.style.display="";n.textContent=qi<Q.length-1?"Következő kérdés ▶":"Újrakezdés ⟲";}
if(Q.length){const e=document.getElementById("mExp"),z=document.getElementById("mQuiz");
 e.onclick=()=>{mode="exp";e.classList.add("on");z.classList.remove("on");clearMarks();document.getElementById("qNext").style.display="none";st.innerHTML="Mutass egy képre: megjelenik, ép vagy hibás. A <b>Gyakorló</b> gombbal kérdéseket kapsz: válaszd ki a hibásat!";};
 z.onclick=()=>{mode="quiz";z.classList.add("on");e.classList.remove("on");qi=0;good=0;tried=0;document.getElementById("score").textContent="";ask();};
 document.getElementById("qNext").onclick=()=>{if(qi<Q.length-1)qi++;else{qi=0;good=0;tried=0;document.getElementById("score").textContent="";}ask();};}
