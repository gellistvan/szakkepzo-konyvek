<p class="small">Sematikus vonalrajz (nem méretarányos). Kéziszerszám-biztonság: ép nyél, rögzített munkadarab, az él a testtől és a tartó kéztől elfelé.</p>
<script>
const P={"lapos": ["Laposvéső", "Fészkek, hornyok tisztítása, kisebb anyagleválasztás. Az él mindig a testtől és a tartó kéztől elfelé haladjon."], "reselo": ["Réselővéső (lyukvéső)", "Vastag, magas keresztmetszetű penge, vaskarikás nyél: mély fészkek, csaplyukak vésése fakalapáccsal."], "hornyolo": ["Hornyolóvéső", "Íves vagy hajlított penge hornyokhoz, aljazásokhoz, vasalatfészkekhez."], "elszelveny": ["A véső élszelvénye", "A letört lap és a hátlap szöge az ékszög β (kb. 25–30°, tájékoztató); a hátszöget és a homlokszöget a tartás adja."], "furdancs": ["Furdancs", "Egyszerű kézi fúró forgatókarral: lassú, megbízható fúrás."], "mellfuro": ["Fogaskerekes fúrógép (mellfúró)", "Melltámaszos, fogaskerekes hajtású: nagyobb nyomaték átvitele."], "csiga": ["Csigafúró", "Központosító csúcs, peremvágó; a csigavonal hozza fel a forgácsot."], "kozpont": ["Központfúró", "Központosító csúcs és peremvágók: pontos, tiszta furat."], "fakal": ["Fakalapács", "A véső nyelének ütésére – fémkalapáccsal a nyél szétreped."], "kalap": ["Asztalos kalapács", "Szögek beverése, kisebb igazítások; feszítésre nem való."], "raspoly": ["Ráspoly", "Durva, egyenként kiemelt fogak: gyors, durva fafelület-leválasztás (pl. ívek előnagyolása)."], "reszelo": ["Reszelő", "Finomabb vágásmintázat: pontosabb, simább felület fán és fémen."], "szinlo": ["Színlőpenge (cikliző penge)", "Vékony acéllap; az élére hajlított sorja vékony forgácsot húz le a fafelületről."]};
const G=[...document.querySelectorAll('#fig g[id]')].filter(g=>P[g.id.split('__')[0]]);
const info=document.getElementById('info');
function hl(k){G.forEach(g=>g.classList.toggle('dim',!!k&&g.id.split('__')[0]!==k));
 document.querySelectorAll('button[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===k&&!!k));
 info.innerHTML=k?'<b>'+P[k][0]+'.</b> '+P[k][1]:'';}
G.forEach(g=>{const k=g.id.split('__')[0];g.style.cursor='pointer';
 g.addEventListener('mouseenter',()=>hl(k));g.addEventListener('click',e=>{e.stopPropagation();hl(k);});});
document.getElementById('fig').addEventListener('mouseleave',()=>hl(''));
