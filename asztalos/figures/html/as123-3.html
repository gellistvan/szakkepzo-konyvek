.figbox{background:#fff;border-radius:6px;padding:4px}
.figbox svg{width:100%;height:auto;display:block}
.small{font-size:12px;color:var(--muted)}
input[type=range]{flex:1;min-width:120px}</style>

function setMsg(h){st.innerHTML=h||"";}
// --- változatváltó (switch): csak a kiválasztott opció csoportjai látszanak ---
let swHidden=new Set();
function applySwitch(){
  if(!C.switches)return;
  const pool=new Set();C.switches.forEach(sw=>sw.options.forEach(o=>o.show.forEach(g=>pool.add(g))));
  const vis=new Set();let msg=[];
  C.switches.forEach((sw,i)=>{const val=document.getElementById("sw"+i).value;const o=sw.options.find(o=>o.value==val);
    o.show.forEach(g=>vis.add(g));if(o.msg)msg.push(o.msg);});
  if(C.combo){const key=C.switches.map((sw,i)=>document.getElementById("sw"+i).value).join("_");
    (C.combo[key]||[]).forEach(g=>vis.add(g));if(C.combomsg&&C.combomsg[key])msg.push(C.combomsg[key]);
    Object.values(C.combo).forEach(l=>l.forEach(g=>pool.add(g)));}
  swHidden=new Set([...pool].filter(g=>!vis.has(g)));
  pool.forEach(g=>G(g).forEach(e=>e.style.display=vis.has(g)?"":"none"));
  setMsg(msg.join(" "));
}
// --- rétegkapcsoló ---
function applyLayers(){
  if(!C.layers)return;
  C.layers.forEach((L,i)=>{const on=document.getElementById("ly"+i).checked;L.groups.forEach(g=>G(g).forEach(e=>e.style.display=on?"":"none"));});
}
// --- rámutatásos kiemelés ---
function hl(p){
  ALL.forEach(e=>e.style.opacity="");
  document.querySelectorAll("#parts button").forEach(b=>b.classList.remove("on"));
  if(!p)return;
  const mine=new Set();p.groups.forEach(g=>G(g).forEach(e=>mine.add(e)));
  ALL.forEach(e=>{if(!mine.has(e)&&!(C.keep||[]).some(k=>e.id.startsWith(k+"__")))e.style.opacity="0.18";});
  const b=document.getElementById("pt"+C.parts.indexOf(p));if(b)b.classList.add("on");
  setMsg("<b>"+p.name+".</b> "+(p.info||""));
}
if(C.parts){
  const box=document.getElementById("parts");
  C.parts.forEach((p,i)=>{const b=document.createElement("button");b.id="pt"+i;b.textContent=(p.n?p.n+" ":"")+p.name;
    b.onmouseenter=()=>hl(p);b.onfocus=()=>hl(p);b.onclick=()=>hl(p);box.appendChild(b);
    p.groups.forEach(g=>G(g).forEach(e=>{e.style.cursor="pointer";e.addEventListener("mouseenter",()=>hl(p));}));});
  svg.addEventListener("mouseleave",()=>{hl(null);setMsg(C.intro||"");});
}
// --- lépésenkénti lejátszás ---
let k=0,timer=null;
function show(i){
  if(!C.steps)return;k=Math.max(0,Math.min(C.steps.length-1,i));const s=C.steps[k];
  const pool=new Set();C.steps.forEach(t=>t.show.forEach(g=>pool.add(g)));
  pool.forEach(g=>G(g).forEach(e=>e.style.display=s.show.includes(g)?"":"none"));
  ALL.forEach(e=>e.style.opacity="");
  (s.hl||[]).length&&ALL.forEach(e=>{if(!(s.hl.some(g=>e.id.startsWith(g+"__"))))e.style.opacity=e.style.display=="none"?"":"0.35";});
  document.getElementById("pos").value=k;document.getElementById("cnt").textContent=(k+1)+"/"+C.steps.length;setMsg(s.msg);
}
function stop(){if(timer){clearInterval(timer);timer=null;}const p=document.getElementById("play");if(p)p.textContent="▶ Lejátszás";}
if(C.steps){
  const pos=document.getElementById("pos");pos.max=C.steps.length-1;
  document.getElementById("first").onclick=()=>{stop();show(0);};
  document.getElementById("prev").onclick=()=>{stop();show(k-1);};
  document.getElementById("next").onclick=()=>{stop();show(k+1);};
  document.getElementById("play").onclick=()=>{if(timer){stop();return;}if(k>=C.steps.length-1)show(0);
    document.getElementById("play").textContent="⏸ Szünet";timer=setInterval(()=>{if(k>=C.steps.length-1)stop();else show(k+1);},C.delay||1600);};
  pos.oninput=()=>{stop();show(+pos.value);};
}
document.querySelectorAll("select.sw").forEach(s=>s.addEventListener("change",()=>{applySwitch();}));
document.querySelectorAll("input.ly").forEach(s=>s.addEventListener("change",applyLayers));
applySwitch();applyLayers();if(C.steps)show(0);else if(!C.switches)setMsg(C.intro||"");
</script>
