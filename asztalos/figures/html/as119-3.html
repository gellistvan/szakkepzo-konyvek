<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asztallap mozgása és rögzítése</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="u">Fanedvesség</label><input id="u" type="range" min="6" max="16" step="0.5" value="10" aria-label="Fanedvesség"><output id="u_o" for="u"></output></div>
<div class="row"><label for="merev">Merev (hibás) csavarozás</label><input id="merev" type="checkbox" aria-label="Merev (hibás) csavarozás"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 580 300" role="img" aria-label="Asztallap alulnézete a mozgás irányával; fémkapocs, hosszlyukas lemez és fecskefarkú heveder metszete; mellette a mereven rögzített, megrepedt lap."></svg>
<p class="small">Tölgy, húrirányú differenciális zsugorodás 0,30 %/%, 900 mm széles lap (a kidolgozott példa tájékoztató adatai, ellenőrizendő). A mozgás a rajzon túlnagyítva.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"u":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const u=v.u, d=900*0.30/100*(u-10), ex=6;     // mm, a rajzon ×6 túlnagyítva
const fg=css("--fg"), mu=css("--muted"), W0=400, cx=290, y=120, half=W0/2+d/2*ex;
const rig=v.merev;
el("text",{x:cx,y:28,"text-anchor":"middle","font-size":13},"Asztallap keresztmetszete (szélesség), a mozgás ×"+ex+" túlnagyítva");
el("line",{x1:cx,y1:40,x2:cx,y2:230,stroke:mu,"stroke-dasharray":"10 4 2 4"});
el("text",{x:cx,y:250,"text-anchor":"middle","font-size":11,fill:mu},"fix középvonal");
const crack=rig&&d<0, bulge=rig&&d>0;
if(bulge){el("path",{d:"M"+(cx-half)+","+(y+30)+" Q"+cx+","+(y-20-d*2)+" "+(cx+half)+","+(y+30)+" L"+(cx+half)+","+(y+60)+" Q"+cx+","+(y+10-d*2)+" "+(cx-half)+","+(y+60)+" Z",fill:"none",stroke:css("--bad"),"stroke-width":2});}
else{el("rect",{x:cx-half,y:y+30,width:2*half,height:30,fill:"none",stroke:fg,"stroke-width":2});}
if(crack){el("polyline",{points:[cx,y+30,cx-6,y+38,cx+5,y+46,cx-4,y+54,cx+2,y+60].join(" "),fill:"none",stroke:css("--bad"),"stroke-width":3});}
[-1,1].forEach(sg=>{const kx=cx+sg*150, slot=15*ex;
  el("rect",{x:kx-15,y:y+60,width:30,height:80,fill:"none",stroke:fg});              // káva
  el("rect",{x:kx-slot/2,y:y+62,width:slot,height:8,fill:"none",stroke:fg,"stroke-width":1.5});  // hosszlyuk (lemez)
  const sx=rig?kx:kx+sg*(150/(W0/2))*(d/2)*ex;                                   // a csavar a lappal mozog
  el("line",{x1:sx,y1:y+40,x2:sx,y2:y+75,stroke:rig?css("--bad"):css("--hl"),"stroke-width":4});
  if(!rig&&Math.abs(sx-kx)>slot/2) el("text",{x:kx,y:y+160,"text-anchor":"middle","font-size":11,fill:css("--bad")},"a csavar kifutott!");});
let m="Fanedvesség "+fmt(u,1)+" % (szerelés 10 %-on): Δb ≈ "+fmt(d,1)+" mm, a középvonaltól kétfelé ±"+fmt(Math.abs(d)/2,1)+" mm.";
if(rig) m+=(d<0?" <span class='bad'>Merev rögzítés: a zsugorodó lap megreped.</span>":(d>0?" <span class='bad'>Merev rögzítés: a dagadó lap kidomborodik.</span>":""));
else m+=" <span class='ok'>A csavar a hosszlyukban elmozdul, a lap szabadon dolgozik.</span>";
status(m);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
