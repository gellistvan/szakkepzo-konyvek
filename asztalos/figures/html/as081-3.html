<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Késkiállás és késnyom-osztás</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="z">Kések száma z</label><select id="z" aria-label="Kések száma z"><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></div>
<div class="row"><label for="k1">1. kés kiállása</label><input id="k1" type="range" min="0.5" max="1.5" step="0.01" value="1.1" aria-label="1. kés kiállása"><output id="k1_o" for="k1"></output></div>
<div class="row"><label for="k2">2. kés kiállása</label><input id="k2" type="range" min="0.5" max="1.5" step="0.01" value="0.9" aria-label="2. kés kiállása"><output id="k2_o" for="k2"></output></div>
<div class="row"><label for="k3">3. kés kiállása</label><input id="k3" type="range" min="0.5" max="1.5" step="0.01" value="1.1" aria-label="3. kés kiállása"><output id="k3_o" for="k3"></output></div>
<div class="row"><label for="k4">4. kés kiállása</label><input id="k4" type="range" min="0.5" max="1.5" step="0.01" value="1.1" aria-label="4. kés kiállása"><output id="k4_o" for="k4"></output></div>
<div class="row"><label for="vf">Előtolás v_f</label><input id="vf" type="range" min="4" max="20" step="0.5" value="8" aria-label="Előtolás v_f"><output id="vf_o" for="vf"></output></div>
<div class="row"><label for="n">Fordulatszám n</label><input id="n" type="range" min="3000" max="7000" step="100" value="6000" aria-label="Fordulatszám n"><output id="n_o" for="n"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 220" role="img" aria-label="Kalkulátor: a késkiállásból, az előtolásból, a fordulatszámból és a késszámból a gyalult felület profilja és a késnyom-osztás."></svg>
<p class="small">Szemléltető modell: Ø120 mm-es késtengely, a késívek alsó burkolója adja a felületet. A kiállásértékek szemléltetők; a megengedett kiállást a szerszámgyártó és a beállítósablon adja (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"k1":"mm", "k2":"mm", "k3":"mm", "k4":"mm", "vf":"m/min", "n":"1/min"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const z=v.z, ks=[v.k1,v.k2,v.k3,v.k4].slice(0,z), vf=v.vf, n=v.n, R0=60;
const fz=vf*1000/(n*z);
const N=900, xa=2, xb=2+Math.max(8*fz*z,6);
const ys=new Array(N).fill(Infinity), who=new Array(N).fill(-1);
for(let k=-2;k<200;k++){ for(let i=0;i<z;i++){ const r=R0+ks[i], xc=(k*z+i)*fz; if(xc>xb+r)break;
  for(let j=0;j<N;j++){const x=xa+(xb-xa)*j/(N-1), d=x-xc; if(Math.abs(d)>=r)continue;
    const yy=R0+2-Math.sqrt(r*r-d*d); if(yy<ys[j]){ys[j]=yy;who[j]=i;}}}}
const lo=Math.min(...ys), hi=Math.max(...ys), span=Math.max(hi-lo,1e-6);
const work=[...new Set(who)].filter(i=>i>=0).sort();
const X0=40,W=520,Y0=180,Hh=110;
el("rect",{x:X0,y:Y0-Hh-10,width:W,height:Hh+40,fill:"none",stroke:css("--grid")});
let d="";ys.forEach((yy,j)=>{d+=(j?"L":"M")+(X0+W*j/(N-1)).toFixed(1)+" "+(Y0-(yy-lo)/span*Hh).toFixed(1);});
el("path",{d:d,fill:"none",stroke:css("--hl"),"stroke-width":2});
el("text",{x:X0,y:Y0+24,"font-size":12},"felület oldalnézetben, "+fmt(xb-xa,1)+" mm hosszon; függőleges nagyítás: teljes magasság = "+fmt(span*1000,1)+" µm");
const eff=work.length, pitch=vf*1000/(n*eff);
let s="Elméleti késnyom-osztás (minden kés dolgozik): f<sub>z</sub> = v<sub>f</sub>/(n·z) = <b>"+fmt(fz,2)+" mm</b>. ";
s+="Ténylegesen dolgozó kések: <b>"+work.map(i=>i+1).join(", ")+"</b> ("+eff+" / "+z+"). ";
if(eff<z) s+="<span class='bad'>Egyenetlen késkiállás: a valódi osztás ≈ "+fmt(pitch,2)+" mm (ha a dolgozó kések egyenletesen oszlanak el) – durvább, hullámos felület.</span>";
else s+="<span class='ok'>Minden kés dolgozik, egyenletes késnyomok.</span>";
status(s);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
