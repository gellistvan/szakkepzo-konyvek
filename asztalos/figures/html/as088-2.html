<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgácsolási sebesség</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="D">Marófej átmérője</label><input id="D" type="range" min="80" max="200" step="5" value="140" aria-label="Marófej átmérője"><output id="D_o" for="D"></output></div>
<div class="row"><label for="n">Fordulatszám</label><input id="n" type="range" min="3000" max="6000" step="100" value="4500" aria-label="Fordulatszám"><output id="n_o" for="n"></output></div>
<div class="row"><label for="nmax">A szerszámra írt n_max</label><input id="nmax" type="range" min="3000" max="9000" step="100" value="6000" aria-label="A szerszámra írt n_max"><output id="nmax_o" for="nmax"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 500 300" role="img" aria-label="Forgácsolási sebesség a fordulatszám függvényében"></svg>
<p class="small">Szemléltető, képletből számolt értékek; a megengedett fordulatszámot a szerszám adatlapja adja (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"D":"mm", "n":"1/min", "nmax":"1/min"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const D=v.D, n=v.n, nmax=v.nmax, vc=D*Math.PI*n/60000;
const X0=60,Y0=250,W=420,H=200;
el("line",{x1:X0,y1:Y0,x2:X0+W,y2:Y0,stroke:css("--line")});
el("line",{x1:X0,y1:Y0,x2:X0,y2:Y0-H,stroke:css("--line")});
const px=q=>X0+(q-3000)/3000*W, py=u=>Y0-u/70*H;
for(let u=0;u<=70;u+=10){el("line",{x1:X0,x2:X0+W,y1:py(u),y2:py(u),stroke:css("--grid")});el("text",{x:X0-6,y:py(u)+4,"text-anchor":"end","font-size":11},String(u));}
for(let q=3000;q<=6000;q+=500)el("text",{x:px(q),y:Y0+16,"text-anchor":"middle","font-size":11},String(q));
let d="";for(let q=3000;q<=6000;q+=100){d+=(q==3000?"M":"L")+px(q)+" "+py(D*Math.PI*q/60000);}
el("path",{d:d,fill:"none",stroke:css("--hl"),"stroke-width":2});
if(nmax<=6000){el("line",{x1:px(nmax),x2:px(nmax),y1:Y0,y2:Y0-H,stroke:css("--bad"),"stroke-width":2,"stroke-dasharray":"6 4"});el("text",{x:px(nmax)-4,y:Y0-H+12,"font-size":11,"text-anchor":"end"},"n_max");}
el("circle",{cx:px(n),cy:py(vc),r:6,fill:css("--hl2"),stroke:css("--line")});
el("text",{x:X0+W/2,y:Y0+34,"text-anchor":"middle","font-size":12},"fordulatszám (1/min)");
el("text",{x:14,y:Y0-H/2,"font-size":12,transform:"rotate(-90 14 "+(Y0-H/2)+")","text-anchor":"middle"},"v (m/s)");
status((n>nmax?"<span class='bad'>TILOS – a fordulatszám nagyobb a szerszámra írt n_max = "+nmax+" 1/min értéknél!</span><br>":"")+"v = D·π·n / 60 000 = <b>"+fmt(vc,1)+" m/s</b> (D = "+D+" mm, n = "+n+" 1/min). Jellemző tartomány: 30–60 m/s "+(vc>=30&&vc<=60?"<span class='ok'>(benne van)</span>":"<span class='bad'>(kívül esik)</span>")+" – ellenőrizendő a szerszám adatlapján.");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
