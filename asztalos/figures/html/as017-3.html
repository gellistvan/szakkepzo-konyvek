<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zsugorodás-kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="b">Kiinduló méret b</label><input id="b" type="range" min="20" max="1000" step="5" value="200" aria-label="Kiinduló méret b"><output id="b_o" for="b"></output></div>
<div class="row"><label for="faj">Fafaj</label><select id="faj" aria-label="Fafaj"><option value="bukk" selected>bükk</option><option value="tolgy">tölgy</option><option value="fenyo">fenyő</option><option value="cseresznye">cseresznye</option><option value="egyeni">egyéni β</option></select></div>
<div class="row"><label for="irany">Irány</label><select id="irany" aria-label="Irány"><option value="hur" selected>húrirány</option><option value="sug">sugárirány</option><option value="rost">rostirány</option></select></div>
<div class="row"><label for="u1">Kiinduló nedvesség u₁</label><input id="u1" type="range" min="0" max="40" step="1" value="18" aria-label="Kiinduló nedvesség u₁"><output id="u1_o" for="u1"></output></div>
<div class="row"><label for="u2">Végső nedvesség u₂</label><input id="u2" type="range" min="0" max="40" step="1" value="8" aria-label="Végső nedvesség u₂"><output id="u2_o" for="u2"></output></div>
<div class="row"><label for="beta">Egyéni β</label><input id="beta" type="range" min="0.01" max="0.4" step="0.01" value="0.3" aria-label="Egyéni β"><output id="beta_o" for="beta"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 520 270" role="img" aria-label="Méretváltozás a fanedvesség változásából: Δb = b·β·Δu"></svg>
<p class="small">A β-értékek a fejezet tájékoztató adatai (ellenőrizendő szakkönyvi táblázatban); a rosttelítettségi határ 30 %-nak vett tájékoztató érték. Az 1–4. kidolgozott példák eredményét adja vissza.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"b":"mm", "u1":"%", "u2":"%", "beta":"%/%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const B={"bukk": ["bükk", {"hur": 0.3, "sug": 0.18, "rost": 0.02}], "tolgy": ["tölgy", {"hur": 0.28, "sug": 0.15}], "fenyo": ["fenyő", {"hur": 0.26}], "cseresznye": ["cseresznye", {"hur": 0.29}]}, UF=30;
const sp=v.faj, dir=v.irany, b=v.b, u1=v.u1, u2=v.u2;
let beta=null, src="";
if(sp=="egyeni"){beta=v.beta;src="egyéni";} else if(B[sp] && B[sp][1][dir]!==undefined){beta=B[sp][1][dir];src=B[sp][0]+", a fejezet tájékoztató értéke";}
const u1c=Math.min(u1,UF), u2c=Math.min(u2,UF), du=u2c-u1c;
if(beta===null){status("<span class='bad'>Ehhez a fafajhoz és irányhoz a fejezet nem ad β-értéket.</span> Válaszd az „egyéni β” lehetőséget, és add meg a szakkönyvi táblázat értékét.");}
else{const d=b*beta/100*du, nb=b+d;
 status("Δu = "+fmt(u2c,0)+" − "+fmt(u1c,0)+" = <b>"+fmt(du,0)+" százalékpont</b>"+((u1>UF||u2>UF)?" (a 30 %-os rosttelítettségi határ felett nincs méretváltozás)":"")+
  "<br>β = "+fmt(beta,2)+" %/% = "+fmt(beta/100,4)+" 1/% ("+src+")"+
  "<br>Δb = "+b+" · "+fmt(beta/100,4)+" · ("+fmt(du,0)+") = <b>"+fmt(d,1)+" mm</b>, új méret: <b>"+fmt(nb,1)+" mm</b> ("+fmt(100*d/b,2)+" %)"+
  (d>0?"; oldalanként szükséges hézag (betétnél): kb. "+fmt(d/2,1)+" mm":""));
 const X0=60,Y0=230,W=440,H=170, px=u=>X0+u/40*W;
 const f=u=>b+b*beta/100*(Math.min(u,UF)-u1c);
 const span=Math.max(f(UF)-f(0),0.5), lo=f(0)-0.08*span, hi=f(UF)+0.12*span, py=y=>Y0-(y-lo)/(hi-lo)*H;
 el("line",{x1:X0,y1:Y0,x2:X0+W,y2:Y0,stroke:css("--line")});el("line",{x1:X0,y1:Y0,x2:X0,y2:Y0-H,stroke:css("--line")});
 for(let u=0;u<=40;u+=10){el("text",{x:px(u),y:Y0+16,"text-anchor":"middle","font-size":11},String(u));}
 el("line",{x1:px(UF),x2:px(UF),y1:Y0,y2:Y0-H,stroke:css("--grid"),"stroke-dasharray":"4 3"});
 el("text",{x:px(UF)+4,y:Y0-H+12,"font-size":11},"rosttelítettségi határ");
 el("polyline",{points:[0,UF,40].map(u=>px(u)+","+py(f(u))).join(" "),fill:"none",stroke:css("--hl"),"stroke-width":2.5});
 el("circle",{cx:px(u1),cy:py(f(u1)),r:5,fill:css("--bg"),stroke:css("--line")});
 el("circle",{cx:px(u2),cy:py(f(u2)),r:6,fill:css("--hl2"),stroke:css("--line")});
 el("text",{x:X0-6,y:py(f(u1))+4,"text-anchor":"end","font-size":11},fmt(f(u1),1));
 el("text",{x:X0-6,y:py(f(u2))+4,"text-anchor":"end","font-size":11},fmt(f(u2),1));
 el("text",{x:X0+W/2,y:Y0+34,"text-anchor":"middle","font-size":12},"fanedvesség u (%)");
 el("text",{x:14,y:Y0-H/2,"font-size":12,transform:"rotate(-90 14 "+(Y0-H/2)+")","text-anchor":"middle"},"méret (mm)");}

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
