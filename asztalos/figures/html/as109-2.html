<p class="small">Sematikus vázlat; illusztrátori finomítás opcionális. A nyomás- és hatásfokértékek a fejezet tájékoztató adatai (ellenőrizendő: gyártói adatok).</p>
<script>
const P=[{"k": "p1", "n": "1 anyagtartály", "d": "felső (gravitációs) tartály a felületkezelő anyagnak"}, {"k": "p2", "n": "2 anyagfúvóka", "d": "ezen lép ki az anyag; mérete az anyag viszkozitásához illik"}, {"k": "p3", "n": "3 tűszelep (anyagtű)", "d": "a ravasz húzására visszahúzódik, és szabaddá teszi a fúvókát"}, {"k": "p4", "n": "4 levegősapka a szarvakkal", "d": "a porlasztó levegő itt áramlik ki; a szarvak levegője laposra formálja a legyezőt"}, {"k": "p5", "n": "5 ravasz", "d": "első fokozat: levegő; tovább húzva: anyag is"}, {"k": "p6", "n": "6 anyagmennyiség-szabályozó", "d": "a tű útját, így a kiáramló anyag mennyiségét állítja"}, {"k": "p7", "n": "7 szórásminta-szabályozó", "d": "a szarvak levegőjét, így a legyező szélességét állítja (kerek ↔ lapos)"}, {"k": "p8", "n": "8 levegőszabályozó", "d": "a porlasztó levegő mennyiségét/nyomását állítja"}, {"k": "p9", "n": "9 levegőcsatlakozó", "d": "a szűrt, nyomásszabályozott sűrített levegő bemenete"}, {"k": "b1", "n": "Levegős (HVLP) szórás", "d": "a porlasztást nagy mennyiségű, alacsony nyomású (0,7–1,5 bar) levegő végzi; hatásfok 65–80 % (tájékoztató)"}, {"k": "b2", "n": "Airless szórás", "d": "nagynyomású szivattyú (100–250 bar) préseli az anyagot a kis fúvókán át, porlasztólevegő nincs; befecskendezési sérülés veszélye – nyomásmentesítés előtt a fúvókához nyúlni tilos"}, {"k": "b3", "n": "Airmix szórás", "d": "az airless szivattyú préseli az anyagot, a fúvókánál kevés, alacsony nyomású levegő segíti a porlasztást; hatásfok 70–80 % (tájékoztató)"}], L=[];
const st=document.getElementById("status");
function grp(k){return document.querySelectorAll('[id^="'+k+'__"]');}
function hl(k){document.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl"));
  document.querySelectorAll("#parts button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));
  if(!k)return; grp(k).forEach(e=>e.classList.add("hl"));
  const p=P.find(x=>x.k===k); if(p) st.innerHTML="<b>"+p.n+"</b> – "+p.d;}
const pb=document.getElementById("parts");
P.forEach(p=>{const b=document.createElement("button");b.textContent=p.n;b.dataset.k=p.k;
  b.onmouseenter=()=>hl(p.k);b.onfocus=()=>hl(p.k);b.onclick=()=>hl(p.k);pb.appendChild(b);
  grp(p.k).forEach(e=>{e.style.cursor="pointer";e.addEventListener("mouseenter",()=>hl(p.k));e.addEventListener("click",()=>hl(p.k));});});
const lb=document.getElementById("layers");
L.forEach(l=>{const b=document.createElement("button");b.textContent=l.n;b.setAttribute("aria-pressed",l.on);
  const set=on=>{b.setAttribute("aria-pressed",on);grp(l.k).forEach(e=>e.classList.toggle("off",!on));};
  set(l.on);b.onclick=()=>set(b.getAttribute("aria-pressed")!=="true");lb.appendChild(b);});
if(!L.length) lb.style.display="none";
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
