<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Furatkép a 32-es rendszerben</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="pa">Kívánt polc alsó síkja (mm)</label><input id="pa" type="range" min="100" max="650" step="1" value="323" aria-label="Kívánt polc alsó síkja (mm)"><output id="pa_o" for="pa"></output></div>
<div class="row"><label for="hcs">Furatközép → polc alsó sík, h (mm)</label><input id="hcs" type="range" min="2" max="4" step="0.5" value="3" aria-label="Furatközép → polc alsó sík, h (mm)"><output id="hcs_o" for="hcs"></output></div>
<div class="row"><label for="tp">Polcvastagság (mm)</label><input id="tp" type="range" min="16" max="25" step="1" value="18" aria-label="Polcvastagság (mm)"><output id="tp_o" for="tp"></output></div>
<div class="row"><label for="y0">Kezdő eltolás y₀</label><select id="y0" aria-label="Kezdő eltolás y₀"><option value="0" selected>0 mm (y = k · 32, a fejezet képlete)</option><option value="37">37 mm (gyártói rendszer szerint)</option></select></div>
<div class="row"><label for="ha">Ajtómagasság (mm)</label><input id="ha" type="range" min="400" max="1000" step="10" value="720" aria-label="Ajtómagasság (mm)"><output id="ha_o" for="ha"></output></div>
<div class="row"><label for="ap">Csészefurat az ajtó élétől (mm)</label><input id="ap" type="range" min="80" max="150" step="5" value="100" aria-label="Csészefurat az ajtó élétől (mm)"><output id="ap_o" for="ap"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 460" role="img" aria-label="Korpuszoldal furatképe a polccal és ajtó két csészefurattal"></svg>
<p class="small">Szemléltető kalkulátor. A 37 mm, a kezdő eltolás, a h és a pántadatok tájékoztatók – a vasalat- és rendszergyártó adatlapja szerint ellenőrizendők. A polc a polctartó csapra fekszik.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"pa":"mm", "hcs":"mm", "tp":"mm", "ha":"mm", "ap":"mm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const P=32, X0=37, H=704, B=550, sc=0.5;
const y0=+v.y0, h=v.hcs, t=v.tp;
const k=Math.floor((v.pa-h-y0)/P), y=y0+k*P, pa=y+h, pf=pa+t;
// korpuszoldal
const ox=30, oy=20+H*sc;
el("rect",{x:ox,y:oy-H*sc,width:B*sc,height:H*sc,fill:"#fff",stroke:"#000","stroke-width":1.5});
for(let kk=(y0>0?0:1); y0+kk*P<H-10; kk++){ const yy=y0+kk*P;
  for(const xx of [X0,B-X0]) el("circle",{cx:ox+xx*sc,cy:oy-yy*sc,r:3,fill:(kk===k?"#000":"#fff"),stroke:"#000"});}
el("rect",{x:ox+(X0-15)*sc,y:oy-pf*sc,width:(B-2*X0+30)*sc,height:t*sc,fill:"#c8c8c8",stroke:"#000"});
el("line",{x1:ox-6,y1:oy-v.pa*sc,x2:ox+B*sc+6,y2:oy-v.pa*sc,stroke:"#c55a11","stroke-width":1.5,"stroke-dasharray":"5 3"});
el("text",{x:ox+B*sc/2,y:oy+16,"text-anchor":"middle","font-size":12,fill:"#000"},"korpuszoldal 704 × 550, furatsor 37 mm-re");
// ajtó
const ax=360, HA=v.ha, sa=0.42, oya=20+1000*sa;
el("rect",{x:ax,y:oya-HA*sa,width:400*sa,height:HA*sa,fill:"#fff",stroke:"#000","stroke-width":1.5});
const a=v.ap, y1=a, y2=HA-a;
for(const yy of [y1,y2]) el("circle",{cx:ax+21.5*sa,cy:oya-HA*sa+yy*sa,r:35/2*sa,fill:"#fff",stroke:"#000","stroke-width":1.3});
el("text",{x:ax+200*sa,y:oya+16,"text-anchor":"middle","font-size":12,fill:"#000"},"ajtó "+HA+" × 400 mm");
status("<b>Polc:</b> rácsvonal k = "+k+" → furatközép y = "+y+" mm (y = "+(y0?y0+" + ":"")+k+" · 32); a polc alsó síkja "+pa+" mm, felső síkja "+pf+" mm"+
 (Math.abs(pa-v.pa)>0.01?" (a kívánt "+fmt(v.pa,0)+" mm helyett "+fmt(v.pa-pa,1)+" mm-rel lejjebb)":"")+
 ".<br><b>Ajtó:</b> csészefuratok az ajtó felső élétől "+y1+" és "+y2+" mm-re, egymástól "+(y2-y1)+" mm; x = 21,5 mm, Ø35 mm.");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
