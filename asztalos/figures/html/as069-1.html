<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Úszó betét a keretben</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="u">fanedvesség</label><input id="u" type="range" min="6" max="14" step="0.5" value="10" aria-label="fanedvesség"><output id="u_o" for="u"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="A betét szélessége a fanedvességgel változik; a horonyfenéknél hagyott hézag felveszi a mozgást."></svg>
<p class="small">Tájékoztató számítás: zsugorodási együttható 0,3 %/% (ellenőrizendő, fafaj- és anyagfüggő; stabilizált bútorlapnál kisebb), gyártási fanedvesség 10 % (feltételezés), hézag oldalanként 2,5 mm.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"u":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const line=css("--line")||"#000";
const B=500, LEC=70, HOR=10, BET=10, HZ=2.5, K=0.003, U0=10, V=22;
const b0=B-2*LEC+2*(HOR-HZ), b=b0*(1+K*(v.u-U0)), gap=HZ-(b-b0)/2, ul=HOR-gap;
const sc=6, X=40, Y=60;
// metszet: bal és jobb oszlopléc, a betét két széle
el("rect",{x:X,y:Y,width:LEC*sc*0.6,height:V*sc,fill:"#fff",stroke:line,"stroke-width":2});
const gx=X+LEC*sc*0.6-HOR*sc;
el("rect",{x:gx,y:Y+(V-BET)/2*sc,width:HOR*sc,height:BET*sc,fill:"#fff",stroke:line});
const px=gx+gap*sc, col = gap<0 ? "#e57373" : (ul<5 ? "#ffcc80" : "#d9d9d9");
el("rect",{x:Math.min(px,gx),y:Y+(V-BET)/2*sc,width:300,height:BET*sc,fill:col,stroke:line});
el("line",{x1:gx,y1:Y+V*sc+20,x2:gx+Math.max(gap,0)*sc,y2:Y+V*sc+20,stroke:line,"stroke-width":3});
el("text",{x:gx,y:Y+V*sc+40,"font-size":13},"hézag a horony alján: "+fmt(gap,2)+" mm");
el("text",{x:gx+120,y:Y-12,"font-size":13},"a betét "+fmt(ul,2)+" mm-t ül a horonyban");
el("text",{x:X,y:Y+V*sc+70,"font-size":13},"betétszélesség: "+fmt(b,1)+" mm (gyártáskor "+fmt(b0,1)+" mm, "+fmt(U0,0)+" %-on)");
const msg = gap<0 ? "<span class='bad'>A betét a horony aljának feszül: szétnyomhatja a keret kötéseit!</span>" :
           (ul<5 ? "<span class='bad'>A betét kevesebb mint 5 mm-t ül a horonyban: kiugorhat, rés látszik.</span>" :
            "<span class='ok'>A betét szabadon mozog a horonyban (úszó betét).</span>");
status("Fanedvesség: <b>"+fmt(v.u,1)+" %</b>. "+msg);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
