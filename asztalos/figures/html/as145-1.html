<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csészés pánt állítása</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="ox">Oldalirány (balra– / jobbra+)</label><input id="ox" type="range" min="-2" max="2" step="0.5" value="0" aria-label="Oldalirány (balra– / jobbra+)"><output id="ox_o" for="ox"></output></div>
<div class="row"><label for="oz">Mélység (hátra– / előre+)</label><input id="oz" type="range" min="-2" max="2" step="0.5" value="0" aria-label="Mélység (hátra– / előre+)"><output id="oz_o" for="oz"></output></div>
<div class="row"><label for="oy">Magasság (le– / fel+)</label><input id="oy" type="range" min="-2" max="2" step="0.5" value="0" aria-label="Magasság (le– / fel+)"><output id="oy_o" for="oy"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 740 330" role="img" aria-label="Csészés pánt három állítási iránya: oldalirány, mélység és magasság; az ajtó elöl- és felülnézete élőben mozdul."></svg>
<p class="small">Szemléltető kiindulás: 2 mm fúga a szomszéd ajtóhoz, 2 mm rés a korpusz előtt, 3 mm felső fúga (tanulási értékek). Az állítási tartomány és a csavarok helye gyártónként eltér – ellenőrizendő.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"ox":"mm", "oz":"mm", "oy":"mm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const ox=v.ox, oz=v.oz, oy=v.oy, L=css("--line"), k=20;
// elölnézet: két szomszédos ajtó, a bal állítható; a korpusz kontúrja szaggatott
const X=40, Y=40, W=200, H=240;
el("rect",{x:X,y:Y,width:2*W+4,height:H,fill:"none",stroke:css("--muted"),"stroke-dasharray":"6 4"});
el("rect",{x:X+2+W+2,y:Y+2,width:W-4,height:H-4,fill:"none",stroke:L,"stroke-width":1.5});
el("rect",{x:X+2+ox*k/4,y:Y+2-oy*k/4,width:W-4,height:H-4,fill:css("--grid"),stroke:css("--hl"),"stroke-width":2});
el("text",{x:X+W,y:Y+H+22,"text-anchor":"middle","font-size":13},"elölnézet: a bal ajtó állítható");
// felülnézet: korpusz homlokéle és az ajtó
const TX=600, TY=60;
el("rect",{x:TX,y:TY,width:20,height:120,fill:"none",stroke:L});
el("text",{x:TX+10,y:TY-8,"text-anchor":"middle","font-size":12},"korpusz");
el("rect",{x:TX-60+ox*k/4,y:TY+122+oz*k/4,width:140,height:14,fill:css("--grid"),stroke:css("--hl"),"stroke-width":2});
el("text",{x:TX+10,y:TY+175,"text-anchor":"middle","font-size":12},"felülnézet");
const fuga=2-ox, gapF=2+oz, top=3-oy;
status("Oldalirány: <b>"+fmt(ox,1)+" mm</b> → fúga a szomszéd ajtóhoz kb. "+fmt(fuga,1)+" mm; mélység: <b>"+fmt(oz,1)+
 " mm</b> → rés a korpusz homlokéle előtt kb. "+fmt(gapF,1)+" mm; magasság: <b>"+fmt(oy,1)+" mm</b> → felső fúga kb. "+fmt(top,1)+" mm."+
 ((fuga<1||gapF<1||top<1)?" <span class='bad'>Az ajtó súrolhat!</span>":" <span class='ok'>Egyenletes, szabad fúgák.</span>"));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
