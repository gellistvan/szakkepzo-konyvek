<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konzolos polc kihúzóereje</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="m">Teher tömege</label><input id="m" type="range" min="5" max="60" step="1" value="20" aria-label="Teher tömege"><output id="m_o" for="m"></output></div>
<div class="row"><label for="L">Polcmélység L</label><input id="L" type="range" min="150" max="400" step="10" value="250" aria-label="Polcmélység L"><output id="L_o" for="L"></output></div>
<div class="row"><label for="h">Csavartávolság h</label><input id="h" type="range" min="60" max="200" step="5" value="120" aria-label="Csavartávolság h"><output id="h_o" for="h"></output></div>
<div class="row"><label for="n">Konzolok száma</label><input id="n" type="range" min="1" max="4" step="1" value="2" aria-label="Konzolok száma"><output id="n_o" for="n"></output></div>
<div class="row"><label for="meg">Megengedett húzóterhelés / dübel</label><input id="meg" type="range" min="0.1" max="1.0" step="0.05" value="0.4" aria-label="Megengedett húzóterhelés / dübel"><output id="meg_o" for="meg"></output></div>
<div class="row"><label for="eloszl">Teher</label><select id="eloszl" aria-label="Teher"><option value="veg" selected>a polc végén</option><option value="megoszlo">egyenletesen megoszló</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 330" role="img" aria-label="Konzolos polc oldalnézetben: a súlyerő az alsó csavar körül forgat, a felső csavarra kihúzó erő hat."></svg>
<p class="small">Egyszerűsített nyomatéki becslés (a fejezet képlete); a dübel megengedett terhelése falazatonként a gyártói táblázatból veendő (ellenőrizendő). Felső szekrény: F = 736 N · 165/180 ≈ 675 N.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"m":"kg", "L":"mm", "h":"mm", "n":"db", "meg":"kN"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const m=v.m, L=v.L, h=v.h, n=v.n, meg=v.meg, Fg=Math.round(m*9.81), kar=(v.eloszl=="megoszlo")?L/2:L;
const Fh=Fg*kar/h, pont=Fh/n, nyir=Fg/n, ok=pont<=meg*1000&&nyir<=meg*1000;
const sc=0.9, X0=200, Y0=280, X=x=>X0+x*sc, Y=y=>Y0-y*sc;
el("rect",{x:0,y:0,width:640,height:330,fill:"#fff"});
el("rect",{x:X(-60),y:Y(Math.max(h,120)+90),width:60*sc,height:(Math.max(h,120)+150)*sc,fill:"#ddd",stroke:"#000"});
const top=h+15;
el("rect",{x:X(0),y:Y(top+22),width:L*sc,height:22*sc,fill:"#f2e8d8",stroke:"#000","stroke-width":1.4});
el("polygon",{points:[[0,0],[12,0],[12,top-12],[Math.min(200,L-10),top-12],[Math.min(200,L-10),top],[0,top]].map(p=>X(p[0])+","+Y(p[1])).join(" "),fill:"#aaa",stroke:"#000"});
[10,10+h].forEach(y=>el("rect",{x:X(-45),y:Y(y)-3,width:57*sc,height:6,fill:"#444"}));
el("circle",{cx:X(6),cy:Y(10),r:6,fill:"#fff",stroke:"#000","stroke-width":2});
function arr(x1,y1,x2,y2,w){el("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:"#000","stroke-width":w});
 const a=Math.atan2(y2-y1,x2-x1);el("polygon",{points:[x2+","+y2,(x2-12*Math.cos(a-0.4))+","+(y2-12*Math.sin(a-0.4)),(x2-12*Math.cos(a+0.4))+","+(y2-12*Math.sin(a+0.4))].join(" "),fill:"#000"});}
if(v.eloszl=="megoszlo"){for(let x=20;x<=L;x+=40)arr(X(x),Y(top+70),X(x),Y(top+24),1.5);el("text",{x:X(L/2),y:Y(top+78),"text-anchor":"middle","font-size":12,fill:"#000"},"egyenletesen megoszló teher (kar = L/2)");}
else{arr(X(L),Y(top+80),X(L),Y(top+24),3);el("text",{x:X(L)+6,y:Y(top+60),"font-size":12,fill:"#000"},"Fg = "+fmt(Fg,0)+" N");}
arr(X(14),Y(h),X(14)+80,Y(h),3);
el("text",{x:X(-62),y:Y(10+h)-10,"text-anchor":"end","font-size":12,fill:"#000"},"F húzó = "+fmt(Fh,0)+" N →");
el("text",{x:X(30),y:Y(10)+4,"font-size":12,fill:"#000"},"forgáspont (alsó csavar)");
status("F<sub>g</sub> = "+fmt(m,0)+" kg · 9,81 = "+fmt(Fg,0)+" N; F<sub>húzó</sub> = F<sub>g</sub> · "+fmt(kar,0)+" / "+fmt(h,0)+" = <b>"+fmt(Fh,0)+" N</b>, felső pontonként "+fmt(pont,0)+" N, nyíróerő pontonként "+fmt(nyir,0)+" N. "+
 (ok?"<span class='ok'>A megadott dübelterhelés ("+fmt(meg,2)+" kN) alatt marad.</span>":"<span class='bad'>Meghaladja a megadott dübelterhelést ("+fmt(meg,2)+" kN)!</span>")+" A megengedett értéket a gyártói táblázat adja (ellenőrizendő).");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
