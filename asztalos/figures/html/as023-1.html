<p class="small">Sematikus vonalrajz, nem méretarányos részletekkel; a nagyító a rajzot nagyítja (a valódi vizsgálat 10–20× kézi nagyítóval történik). Valódi bütüfotóval kiegészíthető.</p>
<script>
let Z=2;const st=document.getElementById("st"),im=document.getElementById("im"),L=document.getElementById("lens");
document.querySelectorAll("button[data-z]").forEach(b=>b.onclick=()=>{Z=+b.dataset.z;});
function mv(x,y){const r=im.getBoundingClientRect(),px=x-r.left,py=y-r.top;
 if(px<0||py<0||px>r.width||py>r.height){L.style.display="none";return;}
 L.style.display="block";L.style.left=(px-85)+"px";L.style.top=(py-85)+"px";
 L.style.backgroundImage="url("+im.src+")";L.style.backgroundSize=(r.width*Z)+"px "+(r.height*Z)+"px";
 L.style.backgroundPosition=(-(px*Z-85))+"px "+(-(py*Z-85))+"px";}
