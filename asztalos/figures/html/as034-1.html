<p class="small">Sematikus vonalrajz, nem méretarányos. A furat- és beépítési méretek gyártói adatok (ellenőrizendő: gyártói katalógus).</p>
<script>
const P={"p1": {"n": "1. Fazékpánt", "d": "Az ajtóba fúrt Ø35 mm-es fazékfuratba (a méret gyártói adat, ellenőrizendő) kerül a pántfazék; a kar a korpuszoldalra csavarozott szerelőtalpra pattan, a talpon az ajtó 3 irányban állítható."}, "p2": {"n": "2. Golyós fióksín", "d": "Két-három egymásba csúszó acélprofil golyóskosárral; a külső sínt a korpuszoldalra, a belsőt a fiókoldalra csavarozzuk. A teherbírás (kg) és a beépítési hézag (oldalanként jellemzően 12,5–13 mm) gyártói adat, ellenőrizendő."}, "p3": {"n": "3. Excenteres kötővasalat", "d": "Bontható korpuszkötés: az oldalba csavart (vagy tiplis) kötőcsap gömbfejét a polcba/fenékbe fúrt excenter elfordításkor magához húzza. Furatméretek (pl. Ø15 excenter, Ø8 csapfurat) gyártónként eltérnek – ellenőrizendő."}, "p4": {"n": "4. Eurócsavar (konfirmát)", "d": "Lépcsős előfúrásba hajtott, nagy menetű bútorcsavar: az oldallapon át a polc élébe (bütüjébe) húz. Jellemző méret 7 × 50 mm, a furatsor és az előfúró gyártói adat – ellenőrizendő."}, "p5": {"n": "5. Tipli (köldökcsap)", "d": "A fatipli bordázott, letört végű bükkcsap (pl. Ø8 × 35 mm), ragasztással kötőelem; a műanyag tipli (dübel) csavar befogadására szolgál. A furatmélység a tipli hosszának fele + 1–2 mm (tájékoztató)."}, "p6": {"n": "6. Forgácslapcsavar", "d": "Süllyesztett fejű, egész hosszán menetes, kereszthornyos (PZ) csavar forgácslaphoz (pl. 4 × 30). A lapsíkba a csavartartás jó, a forgácslap élébe (bütüjébe) gyenge – ezért ott eurócsavar vagy tipli kell."}, "p7": {"n": "7. Polctartó csap", "d": "A korpuszoldal 32 mm-es osztású Ø5 furatsorába dugott csap, gallérral; a polc rajta fekszik fel, áthelyezhető. A furatsor a 32-es rendszer része."}, "p8": {"n": "8. Asztallap-rögzítő fül", "d": "Hajlított fém fül: egyik vége a káva hornyába akad, a másikat az asztallapba csavarozzuk; a lap a fül mellett keresztirányban mozoghat („a fa mozog”), lásd a keretszerkezetű asztal rajzát."}};
