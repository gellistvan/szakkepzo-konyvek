<p class="small">Rámutatáskor ugyanaz az elem mindhárom nézetben kiemelődik (vetületi összerendelés). A furatmagasságok (50, 130) tanulási adatok.</p>
<script>
const P={"kont": {"n": "Kontúr", "d": "A fiókoldal látható körvonala mindhárom nézetben vastag folytonos vonallal: elöl 400 × 180, felül 400 × 18, oldalt 18 × 180."}, "hor": {"n": "Horony", "d": "6 széles, 8 mély horony a belső lapon, az alsó éltől 10 mm-re. Elölnézet: két látható vonal; felülnézet: a horony alja takart, szaggatott vonal a belső laptól 8 mm-re; oldalnézet: a kontúr bemélyedése."}, "fur": {"n": "Köldökcsapfuratok", "d": "Ø8 × 10 furatok a belső lapban. Elölnézet: látható körök tengelykereszttel; felülnézet és oldalnézet: rövid, szaggatott vonalpárok (takart furatfalak) 10 mm mélyen."}};
const G={};document.querySelectorAll('#fig [id*="__"]').forEach(e=>{const k=e.id.split("__")[0];if(P[k])(G[k]=G[k]||[]).push(e);});
const info=document.getElementById("info");let cur=null;
function sel(k){cur=k;for(const g in G)G[g].forEach(e=>e.classList.toggle("on",g===k));
 document.querySelectorAll("button[data-k]").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
 info.innerHTML=k?"<b>"+P[k].n+"</b> – "+P[k].d:"Mutass rá vagy kattints egy elemre (vagy a gombokra).";}
for(const k in G)G[k].forEach(e=>{e.addEventListener("mouseenter",()=>sel(k));e.addEventListener("click",()=>sel(k));});
document.querySelectorAll("button[data-k]").forEach(b=>b.addEventListener("click",()=>sel(cur===b.dataset.k?null:b.dataset.k)));
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
