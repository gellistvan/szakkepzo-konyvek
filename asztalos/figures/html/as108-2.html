<p class="small">Sematikus rajz a hibatáblázat soraihoz; a valós megjelenés jogtiszta fotóval kiegészíthető.</p>
<script>
const P=[{"k": "h0", "n": "Folyás", "d": "<i>Megjelenés:</i> függőleges csíkok, cseppek, vastag szélek. <i>Ok:</i> túl sok anyag, túl lassú hígító, hideg felület, rossz szórópisztoly-beállítás. <i>Javítás, megelőzés:</i> vékonyabb réteg, gyorsabb hígító, a felület hőmérséklete a megadott tartományban; megszáradva csiszolás és új réteg."}, {"k": "h1", "n": "Kráter", "d": "<i>Megjelenés:</i> kis kerek mélyedések a friss bevonatban. <i>Ok:</i> szilikon-, olaj-, viasz-, zsírszennyezés a felületen vagy a levegőből. <i>Javítás, megelőzés:</i> alapos tisztítás, szerszámok és edények ellenőrzése; kráteres réteget csiszolni, tisztítani, újra bevonni."}, {"k": "h2", "n": "Narancsbőr", "d": "<i>Megjelenés:</i> narancshéjszerű, egyenetlen felület. <i>Ok:</i> nem megfelelő viszkozitás, rossz szórótávolság, túl gyors elpárolgás, szennyezett levegő. <i>Javítás, megelőzés:</i> a gyártói hígítás betartása, a szórópisztoly beállítása, hőmérséklet és páratartalom ellenőrzése."}, {"k": "h3", "n": "Fehéredés (blushing)", "d": "<i>Megjelenés:</i> fehéres, opálos fátyol a lakkban. <i>Ok:</i> magas páratartalom, hideg felület, víz bejutása a rétegbe, nem megfelelő hígító. <i>Javítás, megelőzés:</i> szárítás alacsonyabb páratartalomnál, a felület fűtése, gyártói hígító; súlyos esetben csiszolás."}, {"k": "h4", "n": "Hólyagosodás", "d": "<i>Megjelenés:</i> apró vagy nagyobb buborékok, hólyagok a réteg alatt. <i>Ok:</i> levegő, oldószergőz vagy gőz csapdája; túl vastag réteg; kevés köztes száradás. <i>Javítás, megelőzés:</i> vékonyabb rétegek, hosszabb köztes száradás, gyártói rétegszám; hólyagos felületet csiszolni, újra bevonni."}], L=[];
const st=document.getElementById("status");
function grp(k){return document.querySelectorAll('[id^="'+k+'__"]');}
function hl(k){document.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl"));
  document.querySelectorAll("#parts button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));
  if(!k)return; grp(k).forEach(e=>e.classList.add("hl"));
  const p=P.find(x=>x.k===k); if(p) st.innerHTML="<b>"+p.n+"</b> – "+p.d;}
const pb=document.getElementById("parts");
P.forEach(p=>{const b=document.createElement("button");b.textContent=p.n;b.dataset.k=p.k;
  b.onmouseenter=()=>hl(p.k);b.onfocus=()=>hl(p.k);b.onclick=()=>hl(p.k);pb.appendChild(b);
  grp(p.k).forEach(e=>{e.style.cursor="pointer";e.addEventListener("mouseenter",()=>hl(p.k));e.addEventListener("click",()=>hl(p.k));});});
const lb=document.getElementById("layers");
L.forEach(l=>{const b=document.createElement("button");b.textContent=l.n;b.setAttribute("aria-pressed",l.on);
  const set=on=>{b.setAttribute("aria-pressed",on);grp(l.k).forEach(e=>e.classList.toggle("off",!on));};
  set(l.on);b.onclick=()=>set(b.getAttribute("aria-pressed")!=="true");lb.appendChild(b);});
if(!L.length) lb.style.display="none";
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
