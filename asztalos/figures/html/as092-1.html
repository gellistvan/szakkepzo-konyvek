<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Széles szalagú csiszológép</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="l">Munkadarab hossza l (m)</label><input id="l" type="range" min="0.5" max="3.0" step="0.1" value="2.5" aria-label="Munkadarab hossza l (m)"><output id="l_o" for="l"></output></div>
<div class="row"><label for="ve">Előtoló sebesség vₑ (m/min)</label><input id="ve" type="range" min="4" max="20" step="1" value="8" aria-label="Előtoló sebesség vₑ (m/min)"><output id="ve_o" for="ve"></output></div>
<div class="row"><label for="n">Menetek száma</label><input id="n" type="range" min="1" max="5" step="1" value="3" aria-label="Menetek száma"><output id="n_o" for="n"></output></div>
<div class="row"><label for="tm">Adagolás, megfordítás (min/menet)</label><input id="tm" type="range" min="0" max="0.5" step="0.1" value="0.2" aria-label="Adagolás, megfordítás (min/menet)"><output id="tm_o" for="tm"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 100 100" role="img" aria-label="Széles szalagú csiszológép oldalmetszete kontakthengeres és csiszolópapucsos egységgel, szállítószalaggal és elszívással"></svg>
<p class="small">Mutass rá vagy koppints a gép egy részére. Sematikus vázlat; a méretek és a sebességek tájékoztatók (ellenőrizendő: gépkönyv).</p>
