<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hibakiejtés-tervező</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="L">Deszkahossz</label><input id="L" type="range" min="1000" max="4000" step="50" value="3000" aria-label="Deszkahossz"><output id="L_o" for="L"></output></div>
<div class="row"><label for="a">Vágási ráhagyás</label><input id="a" type="range" min="0" max="20" step="1" value="8" aria-label="Vágási ráhagyás"><output id="a_o" for="a"></output></div>
<div class="row"><label for="s1">1. hiba kezdete</label><input id="s1" type="range" min="0" max="4000" step="10" value="0" aria-label="1. hiba kezdete"><output id="s1_o" for="s1"></output></div>
<div class="row"><label for="e1">1. hiba vége</label><input id="e1" type="range" min="0" max="4000" step="10" value="150" aria-label="1. hiba vége"><output id="e1_o" for="e1"></output></div>
<div class="row"><label for="s2">2. hiba kezdete</label><input id="s2" type="range" min="0" max="4000" step="10" value="1200" aria-label="2. hiba kezdete"><output id="s2_o" for="s2"></output></div>
<div class="row"><label for="e2">2. hiba vége</label><input id="e2" type="range" min="0" max="4000" step="10" value="1260" aria-label="2. hiba vége"><output id="e2_o" for="e2"></output></div>
<div class="row"><label for="s3">3. hiba kezdete</label><input id="s3" type="range" min="0" max="4000" step="10" value="2500" aria-label="3. hiba kezdete"><output id="s3_o" for="s3"></output></div>
<div class="row"><label for="e3">3. hiba vége</label><input id="e3" type="range" min="0" max="4000" step="10" value="3000" aria-label="3. hiba vége"><output id="e3_o" for="e3"></output></div>
<div class="row"><label for="p">Kívánt darabhossz (0 = nincs)</label><input id="p" type="range" min="0" max="2000" step="10" value="0" aria-label="Kívánt darabhossz (0 = nincs)"><output id="p_o" for="p"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 520 190" role="img" aria-label="Deszka hibákkal, vágási vonalakkal és hasznos darabokkal"></svg>
<p class="small">Alapbeállítás: a 3. feladat (3000 mm lucfenyő, 8 mm ráhagyás) → 1034 + 1224 = 2258 mm. A deszka végén lévő hibánál a deszka vége felé nem kell ráhagyás. Üres hiba: a vége ne legyen nagyobb a kezdeténél.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"L":"mm", "a":"mm", "s1":"mm", "e1":"mm", "s2":"mm", "e2":"mm", "s3":"mm", "e3":"mm", "p":"mm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const L=v.L, a=v.a, p=v.p;
let D=[[v.s1,v.e1],[v.s2,v.e2],[v.s3,v.e3]].filter(d=>d[1]>d[0]&&d[0]<L).map(d=>[d[0],Math.min(d[1],L)]).sort((x,y)=>x[0]-y[0]);
const segs=[];let cur=0;
D.forEach(d=>{const stop=d[0]>0?d[0]-a:0; if(stop>cur)segs.push([cur,stop]); cur=Math.max(cur,d[1]<L?d[1]+a:L);});
if(cur<L)segs.push([cur,L]);
const tot=segs.reduce((s,x)=>s+x[1]-x[0],0), longest=segs.reduce((m,x)=>Math.max(m,x[1]-x[0]),0);
const X0=20,W=480,Y0=90,H=50,sc=W/L;
el("rect",{x:X0,y:Y0,width:W,height:H,fill:css("--bg"),stroke:css("--line"),"stroke-width":1.5});
D.forEach((d,i)=>{el("rect",{x:X0+d[0]*sc,y:Y0,width:(d[1]-d[0])*sc,height:H,fill:css("--grid"),stroke:css("--line")});
 el("text",{x:X0+(d[0]+d[1])/2*sc,y:Y0-36,"text-anchor":"middle","font-size":11},(i+1)+". hiba");});
let ci=0;
segs.forEach(s=>{[s[0],s[1]].forEach(c=>{if(c>0&&c<L){ci++;el("line",{x1:X0+c*sc,x2:X0+c*sc,y1:Y0-4,y2:Y0+H+4,stroke:css("--hl2"),"stroke-width":2,"stroke-dasharray":"5 3"});
  el("text",{x:X0+c*sc,y:(ci%2?Y0+H+18:Y0-22),"text-anchor":"middle","font-size":10},String(Math.round(c)));}});
 el("text",{x:X0+(s[0]+s[1])/2*sc,y:Y0+H/2+4,"text-anchor":"middle","font-size":12,"font-weight":"bold"},Math.round(s[1]-s[0])+" mm");
 if(p>0){const n=Math.floor((s[1]-s[0]+a)/(p+a));for(let k=0;k<n;k++){const xs=s[0]+k*(p+a);
  el("rect",{x:X0+xs*sc,y:Y0+H+28,width:p*sc,height:10,fill:css("--hl"),stroke:css("--line")});}}});
const pieces=p>0?segs.reduce((n,s)=>n+Math.floor((s[1]-s[0]+a)/(p+a)),0):0;
status("Hasznos szakaszok: <b>"+segs.map(s=>Math.round(s[1]-s[0])).join(" + ")+" = "+Math.round(tot)+" mm</b>; leghosszabb: "+Math.round(longest)+" mm; kihozatal: <b>"+fmt(100*tot/L,1)+" %</b>"+
 (p>0?"<br>"+p+" mm-es darabból kivágható: <b>"+pieces+" db</b> (a darabok között is "+a+" mm ráhagyással)":""));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
