<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az induló szerszámkészlet</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#555;--hl:#1f4e79;--btn:#f2f2f2;--bd:#888}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--btn:#2b2b2b;--bd:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
button{font:inherit;padding:3px 10px;cursor:pointer;background:var(--btn);color:var(--fg);border:1px solid var(--bd);border-radius:4px}
button.on{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:120px}
.pane{background:#fff;color:#111;border-radius:6px;padding:6px}
.pane svg{width:100%;height:auto;display:block}
#status{margin:6px 0;min-height:3em}
.small{font-size:12px;color:var(--muted)}
.parts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.parts button{font-size:13px;padding:2px 7px}
.dim{opacity:.18;transition:opacity .15s}
label{margin-right:10px;white-space:nowrap}</style>
</head>

<p class="small">Sematikus vonalrajz; mezőnként saját 100 mm-es lépték, a méretek és formák tájékoztatók. Konkrét típust, márkát a könyv nem ír elő.</p>
<script>
const P=[{"key": "t1", "name": "1 acélvonalzó 300/600 mm", "info": "Fő feladat: kimérés, derékszög ellenőrzése, előrajzolás.", "group": "g1"}, {"key": "t2", "name": "2 derékszögelő", "info": "Fő feladat: kimérés, derékszög ellenőrzése, előrajzolás.", "group": "g1"}, {"key": "t3", "name": "3 állítható szögmérő", "info": "Fő feladat: kimérés, derékszög ellenőrzése, előrajzolás.", "group": "g1"}, {"key": "t4", "name": "4 tolómérő 0–150 mm", "info": "Fő feladat: kimérés, derékszög ellenőrzése, előrajzolás. A tolómérő 0,1 mm pontosságot mutat; kíméld az élét.", "group": "g1"}, {"key": "t5", "name": "5 mérőszalag 3–5 m", "info": "Fő feladat: kimérés, derékszög ellenőrzése, előrajzolás.", "group": "g1"}, {"key": "t6", "name": "6 jelölőkés", "info": "Fő feladat: kimérés, derékszög ellenőrzése, előrajzolás.", "group": "g1"}, {"key": "t7", "name": "7 rajzceruza", "info": "Fő feladat: kimérés, derékszög ellenőrzése, előrajzolás.", "group": "g1"}, {"key": "t8", "name": "8 darabolófűrész (keresztvágó)", "info": "Fő feladat: kereszt- és hosszirányú vágás, pontos csapolás. Késszerű, kétoldalt élezett fogai a rostokat keresztben vágják el.", "group": "g2"}, {"key": "t9", "name": "9 hasítófűrész", "info": "Fő feladat: kereszt- és hosszirányú vágás, pontos csapolás. Vésőszerű, előre dőlő fogai a rostok mentén, hosszirányban hasítanak.", "group": "g2"}, {"key": "t10", "name": "10 hátfűrész", "info": "Fő feladat: kereszt- és hosszirányú vágás, pontos csapolás. A merevítő hát egyenesen tartja a vékony lapot: pontos csapoláshoz.", "group": "g2"}, {"key": "t11", "name": "11 nagyológyalu", "info": "Fő feladat: felület simítása, derékszög készítése. Íves élű, szimpla vas: vastag forgáccsal gyorsan nagyol.", "group": "g3"}, {"key": "t12", "name": "12 simítógyalu", "info": "Fő feladat: felület simítása, derékszög készítése. Egyenes élű vas csapótoldallal: vékony forgáccsal simít.", "group": "g3"}, {"key": "t13", "name": "13 rövidgyalu", "info": "Fő feladat: felület simítása, derékszög készítése. Rövid test: kisebb felületekhez, élekhez (szemléltető forma).", "group": "g3"}, {"key": "t14", "name": "14 vésők 6, 12, 20, 26 mm", "info": "Fő feladat: csaplyuk, fészek, illeszték. A vésőt soha ne használd feszítővasként.", "group": "g4"}, {"key": "t15", "name": "15 fakalapács", "info": "Fő feladat: csaplyuk, fészek, illeszték.", "group": "g4"}, {"key": "t16", "name": "16 csavaros asztalos szorító", "info": "Fő feladat: ragasztásnál, összeállításnál rögzítés. A pofákat mindig puhítsd falappal, nehogy benyomódjon.", "group": "g5"}, {"key": "t17", "name": "17 sarokszorító", "info": "Fő feladat: ragasztásnál, összeállításnál rögzítés.", "group": "g5"}, {"key": "t18", "name": "18 csiszolótuskó csiszolópapírral", "info": "Fő feladat: felület előkészítése. Csiszolás alatt mindig porvédő.", "group": "g6"}];
const st=document.getElementById("status"), list=document.getElementById("list");
let fixed=null, grp="";
function els(k){return document.querySelectorAll('[id^="'+k+'__"]');}
const ALL=P.map(p=>p.key);
function show(k){
  ALL.forEach(a=>els(a).forEach(e=>e.classList.toggle("dim", k? a!==k : (grp && (P.find(p=>p.key===a).group||"")!==grp))));
  list.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.k===k));
  const p=P.find(p=>p.key===k);
  st.innerHTML = p ? "<b>"+p.name+".</b> "+p.info : (fixed? "" : st.dataset.def);
}
st.dataset.def=st.innerHTML;
function build(){list.innerHTML="";P.forEach(p=>{ if(grp && (p.group||"")!==grp) return;
  const b=document.createElement("button"); b.textContent=p.name; b.dataset.k=p.key;
  b.onmouseenter=()=>{if(!fixed)show(p.key);}; b.onmouseleave=()=>{if(!fixed)show(null);};
  b.onclick=()=>{fixed=(fixed===p.key?null:p.key); show(fixed);}; list.appendChild(b);});}
P.forEach(p=>els(p.key).forEach(e=>{e.style.cursor="pointer";
  e.addEventListener("mouseenter",()=>{if(!fixed)show(p.key);}); e.addEventListener("mouseleave",()=>{if(!fixed)show(null);});
  e.addEventListener("click",()=>{fixed=(fixed===p.key?null:p.key); show(fixed);});}));
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{grp=b.dataset.g;fixed=null;
  document.querySelectorAll("[data-g]").forEach(x=>x.classList.toggle("on",x===b)); build(); show(null);});
build(); show(null);
</script>
