<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bútorstílusok időszalagja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#c55a11;--btn:#f0f0f0;--btnon:#1f4e79;--btnonfg:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#f0a060;--btn:#2a2a2a;--btnon:#8fb8e8;--btnonfg:#111}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer;background:var(--btn);color:var(--fg);border:1px solid var(--muted);border-radius:4px}
button.on{background:var(--btnon);color:var(--btnonfg);border-color:var(--btnon)}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:2.9em}
.fr{display:none;background:#fff;border-radius:4px;padding:4px}
.fr.on{display:block}
.fr svg{display:block;width:100%;height:auto;max-height:620px}
.fr text{fill:#111}
g.part{cursor:pointer}
g.hl path,g.hl use{stroke:#c55a11 !important;stroke-width:3px !important}
.small{font-size:12px;color:var(--muted)}
</style>
</head>

<div class="ctl" id="qz" style="display:none"><button id="qnew">Új kérdés</button><button data-a="0">Gótika</button><button data-a="1">Reneszánsz</button><button data-a="2">Barokk</button><button data-a="3">Rokokó</button><button data-a="4">Klasszicizmus</button><button data-a="5">Empire</button><button data-a="6">Biedermeier</button><button data-a="7">Historizmus</button><button data-a="8">Szecesszió</button><button data-a="9">Modern (Bauhaus)</button><button data-a="10">Magyar népi bútor</button></div>
<p class="small">Sematikus piktogramok, nem méretarányosak; az évszámok tájékoztató, kerekített korszakhatárok (ellenőrizendő: bútorstílus-kézikönyv).</p>
<script>
const MODE="buttons", MSG=["Vidd az egeret (vagy kattints) egy sávra vagy kártyára: megjelenik a stílus jellemzése.", "Kvíz: nyomd meg az „Új kérdés” gombot, majd válaszd ki, melyik stílushoz tartozik a kiemelt piktogram."], PARTS={"got": "1. Gótika (12–16. sz.) – függőleges hangsúly, csúcsív, mérműves áttörés; tömörfa, ácsolt keretbetétes táblás szerkezet, nagy látszó vaspántok; láda, tálaló, stallszerű karosszék. Anyag: tölgy, fenyő.", "ren": "2. Reneszánsz (15–17. sz.) – vízszintes hangsúly, építészeti elemek (oszlop, párkány, lizéna); főleg tömörfa, faragás és intarzia; láda, kredenc, kabinet, asztal. Anyag: dió, tölgy.", "bar": "3. Barokk (17–18. sz.) – súlyos, monumentális, ívelt; csavart láb, domború előlap, nagy párkány; furnér és marketéria, aranyozott bronzveret; komód, szekreter. Anyag: dió, tölgy.", "rok": "4. Rokokó (kb. 1730–1770) – könnyed, aszimmetrikus; S/C alakú (cabriole) láb, kagylómotívum, hullámos előlap; toalett, vitrin, kanapé. Anyag: dió, bükk.", "kla": "5. Klasszicizmus (kb. 1770–1800) – egyenes vonal, mértéktartás; kannelúrázott, kúposodó láb, girland; hengeres szekreter, komód. Anyag: mahagóni, cseresznye.", "emp": "6. Empire (kb. 1800–1815) – ünnepélyes, építészeti, szimmetrikus; aranyozott bronzveret, szfinx, hattyú, líra, palmetta, babérkoszorú; oroszlánláb; psziché, márványlapos komód. Anyag: mahagóni, ében.", "bie": "7. Biedermeier (kb. 1815–1848) – polgári, kényelmes, sima felület; egyszerű, enyhén kúposodó láb, a furnér erezete díszít; felújításkor a furnérsérülés pótlása a fő feladat. Anyag: cseresznye, dió, körte.", "his": "8. Historizmus (kb. 1850–1900) – korábbi stílusok kevert elemei (neogót, neoreneszánsz, neobarokk); esztergált láb, gyári maródísz, sötét pácolás. Anyag: tölgy, dió (pácolt).", "sze": "9. Szecesszió (kb. 1890–1910) – organikus, hullámzó vonal, stilizált növények; hajlított bükk (Thonet-féle hajlítás a 19. sz. közepétől); hajlított szék, ólomüveges vitrin. Anyag: bükk (hajlított), dió.", "mod": "10. Modern (Bauhaus) (1919-től) – funkcióközpontú, geometrikus, díszítés nélkül; hajlított acélcső váz, formázott rétegelt lemez, később lapanyag, rejtett vasalat. Anyag: acélcső, rétegelt lemez.", "nep": "11. Magyar népi bútor (főleg 18–19. sz.) – regionálisan változó; festett menyasszonyi láda (tulipán, rozmaring, gránátalma), ácsolt (szuszékos) láda, karos pad; felújításkor a festékrétegek és a fa nedvességreakciója. Anyag: fenyő, dió, tölgy, hárs."}, LABELS=["Időszalag és kártyák", "Felismerő kvíz"];
const FR=[...document.querySelectorAll(".fr")], ST=document.getElementById("status");
let k=0, timer=null;
function show(i){k=Math.max(0,Math.min(FR.length-1,i));FR.forEach((f,j)=>f.classList.toggle("on",j===k));
  document.querySelectorAll("button[data-i]").forEach(b=>b.classList.toggle("on",+b.dataset.i===k));
  const r=document.getElementById("pos");if(r){r.value=k;}
  const c=document.getElementById("cnt");if(c){c.textContent=(MODE==="slider"?LABELS[k]:(k+1)+"/"+FR.length);}
  ST.innerHTML=MSG[k]||"";}
function stop(){if(timer){clearInterval(timer);timer=null;}const p=document.getElementById("play");if(p)p.textContent="▶ Lejátszás";}
document.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{stop();show(+b.dataset.i);});
const B=id=>document.getElementById(id);
if(B("first")){B("first").onclick=()=>{stop();show(0);};B("prev").onclick=()=>{stop();show(k-1);};B("next").onclick=()=>{stop();show(k+1);};
  B("play").onclick=()=>{if(timer){stop();return;}if(k>=FR.length-1)show(0);B("play").textContent="⏸ Szünet";
    timer=setInterval(()=>{if(k>=FR.length-1)stop();else show(k+1);},1800);};}
if(B("pos"))B("pos").oninput=()=>{stop();show(+B("pos").value);};
document.querySelectorAll("g[id]").forEach(g=>{const m=g.id.match(/_p_([A-Za-z0-9]+)$/);if(!m||!(m[1] in PARTS))return;
  g.classList.add("part");const t=document.createElementNS("http://www.w3.org/2000/svg","title");t.textContent=PARTS[m[1]];g.prepend(t);
  const on=()=>{document.querySelectorAll("g.part").forEach(x=>{const mm=x.id.match(/_p_([A-Za-z0-9]+)$/);x.classList.toggle("hl",mm&&mm[1]===m[1]);});ST.innerHTML="<b>"+PARTS[m[1]]+"</b>";};
  g.addEventListener("mouseenter",on);g.addEventListener("click",on);g.addEventListener("focus",on);
  g.addEventListener("mouseleave",()=>{document.querySelectorAll("g.part.hl").forEach(x=>x.classList.remove("hl"));ST.innerHTML=MSG[k]||"";});});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){stop();show(k+1);}if(e.key==="ArrowLeft"){stop();show(k-1);}});

const QN=["Gótika", "Reneszánsz", "Barokk", "Rokokó", "Klasszicizmus", "Empire", "Biedermeier", "Historizmus", "Szecesszió", "Modern (Bauhaus)", "Magyar népi bútor"]; let qi=-1;
document.querySelectorAll("button[data-i]").forEach(b=>b.addEventListener("click",()=>{document.getElementById("qz").style.display=(+b.dataset.i===1)?"flex":"none";}));
function qhl(){document.querySelectorAll("g[id]").forEach(g=>{const m=g.id.match(/^f1_p_q(\d+)$/);if(m)g.classList.toggle("hl",+m[1]===qi);});}
document.getElementById("qnew").onclick=()=>{qi=Math.floor(Math.random()*QN.length);qhl();ST.innerHTML="Melyik stílus jellegzetes formája a kiemelt <b>"+String.fromCharCode(65+qi)+"</b> kártya?";};
document.querySelectorAll("button[data-a]").forEach(b=>b.onclick=()=>{if(qi<0){ST.innerHTML="Előbb kérj új kérdést.";return;}
  const a=+b.dataset.a; ST.innerHTML=(a===qi?"<b>Helyes!</b> ":"<b>Nem.</b> ")+"A "+String.fromCharCode(65+qi)+" kártya: <b>"+QN[qi]+"</b>.";});

show(0);
</script>
