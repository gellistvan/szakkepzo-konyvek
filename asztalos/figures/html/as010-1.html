<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tűztetraéder</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#555;--hl:#1f4e79;--btn:#f2f2f2;--bd:#888}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--btn:#2b2b2b;--bd:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
button{font:inherit;padding:3px 10px;cursor:pointer;background:var(--btn);color:var(--fg);border:1px solid var(--bd);border-radius:4px}
button.on{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:120px}
.pane{background:#fff;color:#111;border-radius:6px;padding:6px}
.pane svg{width:100%;height:auto;display:block}
#status{margin:6px 0;min-height:3em}
.small{font-size:12px;color:var(--muted)}
.parts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.parts button{font-size:13px;padding:2px 7px}
.dim{opacity:.18;transition:opacity .15s}
label{margin-right:10px;white-space:nowrap}</style>
</head>

<p class="small">Kattints egy mezőre: „kiveszed” a feltételt a tetraéderből. Az oltóanyag-választás részletei a következő
alfejezetben; tájékoztató ábra.</p>
<script>
const I={"anyag": {"name": "Éghető anyag", "how": "Az éghető anyag eltávolítása: a forgácsot, a port elhúzzuk, a gázt vagy oldószert elzárjuk."}, "oxigen": {"name": "Oxigén", "how": "Az oxigén elzárása: oltótakaró, habtakaró vagy a CO₂ kiszorítja a levegőt."}, "ho": {"name": "Hő / gyújtóforrás", "how": "Hűtés: a víz hőt von el, az anyag a gyulladási hőmérséklet alá kerül."}, "lanc": {"name": "Láncreakció", "how": "A láncreakció megszakítása: az oltópor szemcséi megszakítják az égési láncreakciót."}};
const gone=new Set();
function els(k){return document.querySelectorAll('[id^="'+k+'__"]');}
function upd(){Object.keys(I).forEach(k=>els(k).forEach(e=>e.style.opacity=gone.has(k)?0.12:1));
 const st=document.getElementById("status");
 if(!gone.size){st.innerHTML="<b>Ég:</b> mind a négy feltétel megvan (éghető anyag, oxigén, hő, láncreakció). Kattints egy mezőre!";return;}
