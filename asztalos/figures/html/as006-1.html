<html lang="hu">
<head>
<meta charset="utf-8">

<title>Szalagfűrész kezelőelemei</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#555;--hl:#1f4e79;--btn:#f2f2f2;--bd:#888}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--btn:#2b2b2b;--bd:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
button{font:inherit;padding:3px 10px;cursor:pointer;background:var(--btn);color:var(--fg);border:1px solid var(--bd);border-radius:4px}
button.on{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:120px}
.pane{background:#fff;color:#111;border-radius:6px;padding:6px}
.pane svg{width:100%;height:auto;display:block}
#status{margin:6px 0;min-height:3em}
.small{font-size:12px;color:var(--muted)}
.parts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.parts button{font-size:13px;padding:2px 7px}
.dim{opacity:.18;transition:opacity .15s}
label{margin-right:10px;white-space:nowrap}</style>
</head>

<div class="parts" id="list"></div>
<p class="small">Sematikus elölnézet, nem egy konkrét géptípus; a színjelölés és a kezelőelemek pontos elrendezése a gépkönyv szerint (ellenőrizendő).</p>
<script>
const P=[{"key": "p1", "name": "1 főkapcsoló (zárható)", "info": "A gép teljes áramtalanítása; karbantartás, szerszámcsere előtt kikapcsolva lelakatolható, így más nem kapcsolhatja vissza.", "group": "kez"}, {"key": "p2", "name": "2 indítógomb (zöld, süllyesztett)", "info": "Zöld, süllyesztett gomb: véletlen ütéssel nem indítható a gép.", "group": "kez"}, {"key": "p3", "name": "3 leállítógomb (piros)", "info": "Piros gomb: a gép normál leállítása.", "group": "kez"}, {"key": "p4", "name": "4 vészleállító (piros gomba sárga alapon)", "info": "Feltételesen ható: csak akkor állít le, ha valaki megnyomja. A kezelőhelyről mindig elérhető legyen.", "group": "feltl"}, {"key": "p5", "name": "5 rögzített védőburkolat a szíjhajtás felett", "info": "Feltétlenül ható: a szíjhajtást állandóan takarja, csak szerszámmal nyitható.", "group": "felt"}, {"key": "p6", "name": "6 mozgatható védőburkolat (kerékajtó) reteszkapcsolóval (R)", "info": "Feltétlenül ható: a kerékajtó reteszkapcsolója (R) nyitáskor azonnal megszakítja a motor áramkörét, és csukott ajtó nélkül a gép nem indítható.", "group": "felt"}, {"key": "p7", "name": "7 állítható szerszámvédő (felső vezető)", "info": "Feltételesen ható: csak akkor véd, ha a kezelő a munkadarab fölé, közvetlenül a vágás fölé állítja; a szalag szabad része így minimális.", "group": "feltl"}, {"key": "p8", "name": "8 fék (lábfék; motorfék esetén rövid kifutás)", "info": "A fék megállítja a szalag kifutását; leállítás után is várd meg a teljes megállást.", "group": "kez"}, {"key": "p9", "name": "9 elszívócsonk", "info": "Ide csatlakozik az elszívó; nélküle por és forgács gyűlik a gépben és a levegőben.", "group": "egy"}, {"key": "p10", "name": "10 adattábla és gépkönyv", "info": "Az adattábla (típus, gyártó, CE, teljesítmény) és a gépkönyv a biztonságos használat alapja.", "group": "egy"}];
const st=document.getElementById("status"), list=document.getElementById("list");
let fixed=null, grp="";
function els(k){return document.querySelectorAll('[id^="'+k+'__"]');}
const ALL=P.map(p=>p.key);
function show(k){
  ALL.forEach(a=>els(a).forEach(e=>e.classList.toggle("dim", k? a!==k : (grp && (P.find(p=>p.key===a).group||"")!==grp))));
  list.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.k===k));
  const p=P.find(p=>p.key===k);
  st.innerHTML = p ? "<b>"+p.name+".</b> "+p.info : (fixed? "" : st.dataset.def);
}
st.dataset.def=st.innerHTML;
function build(){list.innerHTML="";P.forEach(p=>{ if(grp && (p.group||"")!==grp) return;
  const b=document.createElement("button"); b.textContent=p.name; b.dataset.k=p.key;
  b.onmouseenter=()=>{if(!fixed)show(p.key);}; b.onmouseleave=()=>{if(!fixed)show(null);};
  b.onclick=()=>{fixed=(fixed===p.key?null:p.key); show(fixed);}; list.appendChild(b);});}
P.forEach(p=>els(p.key).forEach(e=>{e.style.cursor="pointer";
  e.addEventListener("mouseenter",()=>{if(!fixed)show(p.key);}); e.addEventListener("mouseleave",()=>{if(!fixed)show(null);});
  e.addEventListener("click",()=>{fixed=(fixed===p.key?null:p.key); show(fixed);});}));
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{grp=b.dataset.g;fixed=null;
  document.querySelectorAll("[data-g]").forEach(x=>x.classList.toggle("on",x===b)); build(); show(null);});
build(); show(null);
</script>
