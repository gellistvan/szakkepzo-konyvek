<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DXF-rétegek és CNC-nullpont</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="k">kontur réteg</label><input id="k" type="checkbox" checked aria-label="kontur réteg"></div>
<div class="row"><label for="f">furat réteg</label><input id="f" type="checkbox" checked aria-label="furat réteg"></div>
<div class="row"><label for="m">meret réteg</label><input id="m" type="checkbox" checked aria-label="meret réteg"></div>
<div class="row"><label for="e">elzaras réteg</label><input id="e" type="checkbox" checked aria-label="elzaras réteg"></div>
<div class="row"><label for="dx">Origó eltolása X</label><input id="dx" type="range" min="-60" max="60" step="5" value="0" aria-label="Origó eltolása X"><output id="dx_o" for="dx"></output></div>
<div class="row"><label for="dy">Origó eltolása Y</label><input id="dy" type="range" min="-60" max="60" step="5" value="0" aria-label="Origó eltolása Y"><output id="dy_o" for="dy"></output></div>
<div class="row"><label for="blokk">blokk nem robbantva</label><input id="blokk" type="checkbox" aria-label="blokk nem robbantva"></div>
<div class="row"><label for="nyit">nyitott kontúr</label><input id="nyit" type="checkbox" aria-label="nyitott kontúr"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 440" role="img" aria-label="Oldallap CAD-rajza rétegenként a CNC-nullponttal; kapcsolók a tipikus exporthibákhoz"></svg>
<p class="small">Oldallap 582 × 400 × 18 mm (a T-J4-096 szerint javított méret). A furatkép szemléltető (32-es sor 37 mm-re az élektől, Ø8 köldökcsap); a pontos furatképet a vasalat- és szerkezeti rajz adja (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"dx":"mm", "dy":"mm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const L=400,H=582,RX=[37,363],RY=[];for(let y=96;y<=480;y+=32)RY.push(y);
const sc=0.62,ox=110,oy=410,px=x=>ox+x*sc,py=y=>oy-y*sc;
el("rect",{x:0,y:0,width:560,height:440,fill:"#fff"});
// a valódi munkadarab a gépasztalon (szürke) – a gépi nullpontnál
el("rect",{x:px(0),y:py(H),width:L*sc,height:H*sc,fill:"#eeeeee",stroke:"#999","stroke-width":1});
el("text",{x:px(0),y:py(H)-8,"font-size":11,fill:"#555"},"munkadarab a gépen (szürke)");
const dx=v.dx,dy=v.dy;
if(v.k){ if(v.nyit){[[0,0,0,H],[0,H,150,H],[190,H,L,H],[L,H,L,0],[L,0,0,0]].forEach(s=>el("line",{x1:px(s[0]+dx),y1:py(s[1]+dy),x2:px(s[2]+dx),y2:py(s[3]+dy),stroke:"#000","stroke-width":3}));
   el("text",{x:px(170+dx),y:py(H+dy)-6,"text-anchor":"middle","font-size":12,fill:"#b71c1c"},"szakadás!");}
  else el("rect",{x:px(dx),y:py(H+dy),width:L*sc,height:H*sc,fill:"none",stroke:"#000","stroke-width":3}); }
if(v.e) el("line",{x1:px(L-6+dx),y1:py(dy),x2:px(L-6+dx),y2:py(H+dy),stroke:"#000","stroke-dasharray":"6 4"});
let kint=0;
if(v.f && !v.blokk){ RX.forEach(x=>RY.forEach(y=>{const X=x+dx,Y=y+dy; if(X<0||X>L||Y<0||Y>H)kint++;
  el("circle",{cx:px(X),cy:py(Y),r:3.2,fill:"none",stroke:"#000"});}));
  [[50,9],[350,9]].forEach(p=>{const X=p[0]+dx,Y=p[1]+dy; if(X<0||X>L||Y<0||Y>H)kint++; el("circle",{cx:px(X),cy:py(Y),r:4.5,fill:"#bbb",stroke:"#000"});}); }
if(v.f && v.blokk) el("rect",{x:px(15+dx),y:py(500+dy),width:50*sc,height:420*sc,fill:"none",stroke:"#000","stroke-dasharray":"2 3"});
if(v.m){ el("text",{x:px(L/2+dx),y:py(dy)+18,"text-anchor":"middle","font-size":12,fill:"#000"},"400");
  el("text",{x:px(dx)-8,y:py(H/2+dy),"text-anchor":"end","font-size":12,fill:"#000"},"582");
  el("text",{x:px(18+dx),y:py(540+dy),"text-anchor":"middle","font-size":11,fill:"#000"},"37"); }
// nullpontok
el("circle",{cx:px(0),cy:py(0),r:7,fill:"none",stroke:"#000","stroke-width":2});
el("text",{x:px(0)-10,y:py(0)+18,"text-anchor":"end","font-size":11,fill:"#000"},"gépi X0/Y0");
if(dx||dy){el("circle",{cx:px(dx),cy:py(dy),r:6,fill:"none",stroke:"#b71c1c","stroke-width":2,"stroke-dasharray":"3 2"});
  el("text",{x:px(dx)+10,y:py(dy)+18,"font-size":11,fill:"#b71c1c"},"rajzi origó");}
el("line",{x1:px(0),y1:py(0)+30,x2:px(0)+70,y2:py(0)+30,stroke:"#000","stroke-width":2,"marker-end":""});
el("text",{x:px(0)+74,y:py(0)+34,"font-size":12,"font-weight":"bold",fill:"#000"},"X");
el("line",{x1:px(0)-30,y1:py(0),x2:px(0)-30,y2:py(0)-70,stroke:"#000","stroke-width":2});
el("text",{x:px(0)-34,y:py(0)-76,"font-size":12,"font-weight":"bold",fill:"#000"},"Y");
let msg=[];
if(!v.k)msg.push("<span class='bad'>A kontúr réteg ki van kapcsolva / nincs exportálva: nincs mit marni.</span>");
if(v.nyit)msg.push("<span class='bad'>Nyitott kontúr: a CAM nem tud zárt marópályát képezni.</span>");
if(!v.f)msg.push("<span class='bad'>A furat réteg hiányzik: a gép csak a körvonalat marja (rossz réteg).</span>");
if(v.f&&v.blokk)msg.push("<span class='bad'>A furatsor robbantatlan blokk: a CAM nem lát köröket, a furatok kimaradnak.</span>");
if(dx||dy)msg.push("<span class='bad'>A rajzi origó "+dx+" / "+dy+" mm-rel eltér a gépi nullponttól: minden furat ennyivel elcsúszik"+(kint?", "+kint+" furat a lapon kívülre kerülne":"")+".</span>");
if(!msg.length)msg.push("<span class='ok'>Rendben: zárt kontúr, külön furatréteg, felrobbantott furatok, közös nullpont.</span>");
status(msg.join("<br>"));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
