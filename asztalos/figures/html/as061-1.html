<script>
const P={"talp": ["Gyalutest és gyalutalp", "A sík, merev talp (simítógyalunál kb. 250 mm) vezeti a gyalut; síkjának épnek kell lennie."], "szaj": ["Száj (szájnyílás)", "A talp nyílása a vas előtt; simításhoz szűk, nagyoláshoz tágabb."], "vas": ["Gyaluvas", "A vágóél; a letört élszalag (ékszög β ≈ 25–30°) lefelé néz, az ágyazás 45°."], "torő": ["Forgácstörő", "A vas felső lapjára csavarozott acéllap; az élhez közel állítva megtöri a forgácsot."], "szorito": ["Vasszorító kar", "Leszorítja a vasat és a forgácstörőt az ágyazásra."], "melyseg": ["Mélységállító csavar", "Ezzel állítod a vas kiállását (a fogásmélységet)."], "oldal": ["Oldalállító kar", "A vasat oldalirányban billenti, hogy az él párhuzamos legyen a talppal."], "fogantyu": ["Fogantyú", "A jobb kéz fogja; a tolás végén ide kerül a nyomás."], "gomb": ["Elülső gomb", "A bal kéz fogja; induláskor elöl nyomj."], "agy": ["Ágyazás (béka)", "A vas fekvőfelülete; dőlése a vágószöget adja (itt 45°)."]};
const G=[...document.querySelectorAll('#fig g[id]')].filter(g=>P[g.id.split('__')[0]]);
const info=document.getElementById('info');
function hl(k){G.forEach(g=>g.classList.toggle('dim',!!k&&g.id.split('__')[0]!==k));
 document.querySelectorAll('button[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===k&&!!k));
 info.innerHTML=k?'<b>'+P[k][0]+'.</b> '+P[k][1]:'';}
G.forEach(g=>{const k=g.id.split('__')[0];g.style.cursor='pointer';
 g.addEventListener('mouseenter',()=>hl(k));g.addEventListener('click',e=>{e.stopPropagation();hl(k);});});
document.getElementById('fig').addEventListener('mouseleave',()=>hl(''));
document.querySelectorAll('button[data-k]').forEach(b=>b.addEventListener('click',()=>hl(b.dataset.k)));
const QZ=document.getElementById('qz');let ask=null;
if(QZ){QZ.onclick=()=>{const ks=Object.keys(P);ask=ks[Math.floor(Math.random()*ks.length)];hl('');
 document.getElementById('qq').innerHTML='Kattints a rajzon erre: <b>'+P[ask][0]+'</b>';};
 G.forEach(g=>g.addEventListener('click',()=>{if(!ask)return;const k=g.id.split('__')[0];
  document.getElementById('qq').innerHTML=(k===ask?"<span class='ok'>Helyes!</span>":"<span class='bad'>Nem ez – ez: "+P[k][0]+".</span>")+' Új kérdés: Kvíz gomb.';ask=null;}));}
