const P={"kar": ["Kar (2 db)", "A két függőleges fakar; alsó végükön a fogantyúk tartják a fűrészlapot."], "lec": ["Feszítőléc (középléc)", "A karokat középen támasztja; emelőként működik a zsinór feszítésekor."], "lap": ["Fűrészlap a fogantyúkban", "A fogantyúkban elforgatható, cserélhető lap; a fogai lefelé, a vágás irányába néznek."], "zsinor": ["Feszítőzsinór feszítőpálcával", "A zsinór megcsavarásával (feszítőpálca) vagy feszítővassal feszítjük a lapot. Túlfeszíteni tilos: pattanáskor a lap megsebezhet."], "szabo": ["Szabó fűrész", "Nagyobb, hosszú lapú keretes fűrész durvább daraboláshoz és hosszanti szabáshoz."], "hasito": ["Hasító fűrész", "Keskenyebb, hosszú lap hasító fogazattal, rostirányú vágáshoz."], "csapozo": ["Csapozó fűrész", "Finom, sűrű fogazású, keskeny lap: csapvállak, fogazások, finom darabolás."], "iv": ["Ívfűrész", "Nagyon keskeny, finom lap ívekhez és belső kivágásokhoz; a lap a keretben elforgatható."], "roka": ["Rókafarkú fűrész", "Széles, merev, feszítetlen lap: darabolás, lemezszabás; tolásra vág."], "illeszto": ["Illesztő fűrész (hátazott)", "Merevített hátú, nagyon finom fogazású: gérvágás, finom illesztés."], "japan": ["Japán húzófűrész", "Vékony lap, húzásra vág: a húzás feszesen tartja a lapot. Kétoldalas változata egyik oldalon hasító, a másikon daraboló fogazatú."]};
const G=[...document.querySelectorAll('#fig g[id]')].filter(g=>P[g.id.split('__')[0]]);
const info=document.getElementById('info');
function hl(k){G.forEach(g=>g.classList.toggle('dim',!!k&&g.id.split('__')[0]!==k));
 document.querySelectorAll('button[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===k&&!!k));
 info.innerHTML=k?'<b>'+P[k][0]+'.</b> '+P[k][1]:'';}
G.forEach(g=>{const k=g.id.split('__')[0];g.style.cursor='pointer';
 g.addEventListener('mouseenter',()=>hl(k));g.addEventListener('click',e=>{e.stopPropagation();hl(k);});});
document.getElementById('fig').addEventListener('mouseleave',()=>hl(''));
document.querySelectorAll('button[data-k]').forEach(b=>b.addEventListener('click',()=>hl(b.dataset.k)));
const QZ=document.getElementById('qz');let ask=null;
if(QZ){QZ.onclick=()=>{const ks=Object.keys(P);ask=ks[Math.floor(Math.random()*ks.length)];hl('');
 document.getElementById('qq').innerHTML='Kattints a rajzon erre: <b>'+P[ask][0]+'</b>';};
 G.forEach(g=>g.addEventListener('click',()=>{if(!ask)return;const k=g.id.split('__')[0];
  document.getElementById('qq').innerHTML=(k===ask?"<span class='ok'>Helyes!</span>":"<span class='bad'>Nem ez – ez: "+P[k][0]+".</span>")+' Új kérdés: Kvíz gomb.';ask=null;}));}
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
