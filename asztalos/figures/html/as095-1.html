<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szorítók és felhordó eszközök</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#555;--hl:#c55a11;--card:#fff;--bd:#bbb}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#f0a060;--card:#262626;--bd:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.ctl button{font:inherit;padding:3px 10px;cursor:pointer}
.ctl button[aria-pressed=true]{font-weight:bold;outline:2px solid var(--hl)}
#fig{background:#fff;border:1px solid var(--bd);border-radius:6px;padding:4px}
#fig svg{width:100%;height:auto;display:block}
#status{min-height:2.9em;margin:6px 0}
ul#parts{display:flex;flex-wrap:wrap;gap:4px 8px;list-style:none;padding:0;margin:4px 0}
ul#parts li{border:1px solid var(--bd);border-radius:4px;padding:1px 6px;cursor:pointer;background:var(--card)}
ul#parts li.on{outline:2px solid var(--hl);font-weight:bold}
#fig .hl path,#fig .hl rect,#fig .hl ellipse,#fig .hl circle,#fig .hl polygon,#fig .hl use{stroke:#c55a11!important;stroke-width:3px!important}
#fig .hl text{fill:#c55a11!important;font-weight:bold}
.small{font-size:12px;color:var(--muted)}</style>
</head>

const fig=document.getElementById("fig"), st=document.getElementById("status"), ul=document.getElementById("parts");
let cur=0;
function partsIn(){const ks=new Set();fig.querySelectorAll('[id^="jfp"]').forEach(e=>ks.add(e.id.slice(3).split("-")[0]));return ks;}
function hl(k){fig.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl"));
  ul.querySelectorAll("li").forEach(li=>li.classList.toggle("on",li.dataset.k===k));
  if(k===null){st.innerHTML=D.views[cur].d;return;}
  fig.querySelectorAll('[id^="jfp'+k+'-"]').forEach(e=>e.classList.add("hl"));
  const p=D.parts.find(p=>p.k===k); if(p) st.innerHTML="<b>"+p.n+".</b> "+p.d;}
function show(i){cur=i;fig.innerHTML=D.views[i].svg;
  document.querySelectorAll(".ctl button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.i===i));
  const ks=partsIn();ul.innerHTML="";
  D.parts.filter(p=>ks.has(p.k)).forEach(p=>{const li=document.createElement("li");li.textContent=p.n;li.dataset.k=p.k;li.tabIndex=0;
    li.onmouseenter=li.onfocus=()=>hl(p.k);li.onclick=()=>hl(p.k);ul.appendChild(li);});
  hl(null);}
fig.addEventListener("mouseover",e=>{const g=e.target.closest('[id^="jfp"]');if(g)hl(g.id.slice(3).split("-")[0]);});
fig.addEventListener("mouseleave",()=>hl(null));
document.querySelectorAll(".ctl button").forEach(b=>b.onclick=()=>show(+b.dataset.i));
show(0);
</script>
