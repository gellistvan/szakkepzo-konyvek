<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tűrés- és átlóellenőrző</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="nom">Névleges méret</label><input id="nom" type="range" min="100" max="1000" step="1" value="300" aria-label="Névleges méret"><output id="nom_o" for="nom"></output></div>
<div class="row"><label for="tol">Tűrés ±</label><input id="tol" type="range" min="0.1" max="2" step="0.05" value="0.5" aria-label="Tűrés ±"><output id="tol_o" for="tol"></output></div>
<div class="row"><label for="dev">Mért − névleges</label><input id="dev" type="range" min="-2" max="2" step="0.05" value="0.7" aria-label="Mért − névleges"><output id="dev_o" for="dev"></output></div>
<div class="row"><label for="u1">Mérési bizonytalanság ±</label><input id="u1" type="range" min="0" max="0.5" step="0.05" value="0" aria-label="Mérési bizonytalanság ±"><output id="u1_o" for="u1"></output></div>
<div class="row"><label for="d1">1. átló (d₁)</label><input id="d1" type="range" min="995" max="1005" step="0.1" value="1001.1" aria-label="1. átló (d₁)"><output id="d1_o" for="d1"></output></div>
<div class="row"><label for="d2">2. átló (d₂)</label><input id="d2" type="range" min="995" max="1005" step="0.1" value="1000.5" aria-label="2. átló (d₂)"><output id="d2_o" for="d2"></output></div>
<div class="row"><label for="lim">Átlók megengedett különbsége</label><input id="lim" type="range" min="0.2" max="3" step="0.1" value="1.0" aria-label="Átlók megengedett különbsége"><output id="lim_o" for="lim"></output></div>
<div class="row"><label for="u2">Átlómérés bizonytalansága ±</label><input id="u2" type="range" min="0" max="0.5" step="0.05" value="0.2" aria-label="Átlómérés bizonytalansága ±"><output id="u2_o" for="u2"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 520 330" role="img" aria-label="Tűrésmező számegyenesen a mért értékkel és bizonytalansággal; ferdített keret két átlóval"></svg>
<p class="small">Döntési szabály: megfelel, ha a mért érték a bizonytalansággal együtt a tűrésmezőn belül marad; nem felel meg, ha teljesen kívül esik; határeset, ha a sáv eléri vagy átlépi a határt. Az alapbeállítás a 2. és a 6. feladat adatai. Tanulási példa, a tűrést a termék előírása adja (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"nom":"mm", "tol":"mm", "dev":"mm", "u1":"mm", "d1":"mm", "d2":"mm", "lim":"mm", "u2":"mm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const lo=v.nom-v.tol, hi=v.nom+v.tol, m=v.nom+v.dev;
function dont(lo,hi,m,u){const e=1e-9; if(m-u>hi+e||m+u<lo-e) return "nem felel meg"; if(m-u>lo+e&&m+u<hi-e) return "megfelel"; return "határeset";}
const r1=dont(lo,hi,m,v.u1);
const k=Math.abs(v.d1-v.d2), U=2*v.u2, r2=dont(-1e9,v.lim,k,U);
const epsd=Math.asin((v.d1*v.d1-v.d2*v.d2)/(4*800*600))*180/Math.PI, eltol=600*Math.tan(Math.abs(epsd)*Math.PI/180);
const cls=r=>r=="megfelel"?"ok":"bad";
// felső panel: számegyenes
const X0=40,W=440,span=Math.max(2.5*v.tol,Math.abs(v.dev)+v.u1+0.3*v.tol), px=x=>X0+W/2+(x-v.nom)/span*W/2;
el("rect",{x:0,y:0,width:520,height:330,fill:"#fff"});
el("line",{x1:X0,x2:X0+W,y1:90,y2:90,stroke:"#000"});
el("rect",{x:px(lo),y:50,width:px(hi)-px(lo),height:30,fill:"#e0e0e0",stroke:"#000"});
el("text",{x:px(v.nom),y:44,"text-anchor":"middle","font-size":12,fill:"#000"},"tűrésmező "+fmt(v.nom,1)+" ± "+fmt(v.tol,2)+" mm");
[lo,v.nom,hi].forEach(t=>{el("line",{x1:px(t),x2:px(t),y1:84,y2:96,stroke:"#000"});el("text",{x:px(t),y:110,"text-anchor":"middle","font-size":11,fill:"#000"},fmt(t,2));});
const mx=Math.max(X0,Math.min(X0+W,px(m)));
el("rect",{x:Math.max(X0,px(m-v.u1)),y:116,width:Math.max(2,Math.min(X0+W,px(m+v.u1))-Math.max(X0,px(m-v.u1))),height:10,fill:"#999",stroke:"#000"});
el("line",{x1:mx,x2:mx,y1:60,y2:130,stroke:"#000","stroke-width":4});
el("text",{x:mx,y:145,"text-anchor":"middle","font-size":12,"font-weight":"bold",fill:"#000"},"mért "+fmt(m,2)+" mm");
// alsó panel: ferdített keret (a ferdítés 200-szoros túlzás)
const s=Math.max(-0.35,Math.min(0.35,epsd*Math.PI/180*200)), bx=150,by=315,ww=160,hh=120;
const P=[[bx,by],[bx+ww,by],[bx+ww+hh*s,by-hh],[bx+hh*s,by-hh]];
el("polygon",{points:P.map(p=>p.join(",")).join(" "),fill:"none",stroke:"#000","stroke-width":3});
el("line",{x1:P[0][0],y1:P[0][1],x2:P[2][0],y2:P[2][1],stroke:"#000","stroke-width":1.5});
el("line",{x1:P[1][0],y1:P[1][1],x2:P[3][0],y2:P[3][1],stroke:"#000","stroke-width":1.5,"stroke-dasharray":"6 4"});
el("text",{x:330,y:220,"font-size":12,fill:"#000"},"keret 800 × 600 mm");
el("text",{x:330,y:240,"font-size":12,fill:"#000"},"d₁ = "+fmt(v.d1,1)+" mm (folytonos)");
el("text",{x:330,y:258,"font-size":12,fill:"#000"},"d₂ = "+fmt(v.d2,1)+" mm (szaggatott)");
el("text",{x:330,y:276,"font-size":12,fill:"#000"},"sarokszög-eltérés ≈ "+fmt(Math.abs(epsd),3)+"°");
el("text",{x:330,y:294,"font-size":12,fill:"#000"},"(600 mm-en ≈ "+fmt(eltol,2)+" mm kitérés)");
el("text",{x:20,y:180,"font-size":11,fill:"#555"},"ferdítés túlozva");
status("<b>Méret:</b> "+fmt(m,2)+" ± "+fmt(v.u1,2)+" mm a ["+fmt(lo,2)+"; "+fmt(hi,2)+"] mezőhöz: <span class='"+cls(r1)+"'>"+r1+"</span><br>"+
 "<b>Átlók:</b> különbség "+fmt(k,2)+" mm, bizonytalansága ±"+fmt(U,2)+" mm (két mérés) → "+fmt(Math.max(0,k-U),2)+"…"+fmt(k+U,2)+" mm a max. "+fmt(v.lim,2)+" mm-hez: <span class='"+cls(r2)+"'>"+r2+"</span>"+(r2=="határeset"?" – ismételd a mérést pontosabb eszközzel.":""));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
