<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lábmagasság lejtős padlón</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="d">Padlóeltérés jobb oldalon</label><input id="d" type="range" min="-10" max="10" step="1" value="-6" aria-label="Padlóeltérés jobb oldalon"><output id="d_o" for="d"></output></div>
<div class="row"><label for="k">Korpuszmagasság</label><input id="k" type="range" min="700" max="860" step="10" value="780" aria-label="Korpuszmagasság"><output id="k_o" for="k"></output></div>
<div class="row"><label for="t">Munkalapvastagság</label><input id="t" type="range" min="20" max="60" step="1" value="38" aria-label="Munkalapvastagság"><output id="t_o" for="t"></output></div>
<div class="row"><label for="H">Célmagasság</label><input id="H" type="range" min="850" max="950" step="1" value="900" aria-label="Célmagasság"><output id="H_o" for="H"></output></div>
<div class="row"><label for="min">Láb legkisebb magassága</label><input id="min" type="range" min="50" max="120" step="1" value="80" aria-label="Láb legkisebb magassága"><output id="min_o" for="min"></output></div>
<div class="row"><label for="max">Láb legnagyobb magassága</label><input id="max" type="range" min="90" max="200" step="1" value="120" aria-label="Láb legnagyobb magassága"><output id="max_o" for="max"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 520 380" role="img" aria-label="Lejtős padlón álló alsószekrény-sor oldalnézete: a magasabb padlóponton rövidebb, az alacsonyabbon hosszabb lábbal a munkalap vízszintes."></svg>
<p class="small">Alapértékek a 3. feladat adatai (82 és 88 mm). A láb állítási tartománya gyártói adat – a 80–120 mm csak szemléltető kiindulás (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"d":"mm", "k":"mm", "t":"mm", "H":"mm", "min":"mm", "max":"mm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const base=v.H-v.t-v.k, Lb=base+Math.max(0,v.d), Rb=Lb-v.d, lo=Math.min(Lb,Rb), hi=Math.max(Lb,Rb);
const ok=lo>=v.min && hi<=v.max;
const X=60, Y=300, sx=380/1800, sy=0.22, ex=8;
const fy=x=>Y-(Math.min(0,v.d)<0?0:0)-(v.d*ex*sy)*x/1800;
el("polygon",{points:X+","+fy(0)+" "+(X+1800*sx)+","+fy(1800)+" "+(X+1800*sx)+","+(Y+30)+" "+X+","+(Y+30),fill:css("--grid"),stroke:css("--line")});
const top=Y-Math.max(0,v.d)*ex*sy-base*sy;  // a bázis (legmagasabb padlópont) fölött
for(let k=0;k<3;k++){const x0=X+k*600*sx;
  el("rect",{x:x0+2,y:top-v.k*sy,width:600*sx-4,height:v.k*sy,fill:"none",stroke:css("--line"),"stroke-width":1.5});
  [60,540].forEach(xx=>{const fx=fy(k*600+xx);el("rect",{x:x0+xx*sx-4,y:top,width:8,height:Math.max(0,fx-top),fill:css("--muted")});});}
el("rect",{x:X,y:top-v.k*sy-v.t*sy,width:1800*sx,height:v.t*sy,fill:css("--grid"),stroke:css("--line")});
el("line",{x1:X-20,x2:X+1800*sx+20,y1:top-v.k*sy-v.t*sy,y2:top-v.k*sy-v.t*sy,stroke:css("--hl2"),"stroke-dasharray":"6 4"});
el("text",{x:X,y:Y+50,"font-size":13},"bal láb: "+fmt(Lb,0)+" mm");
el("text",{x:X+1800*sx,y:Y+50,"font-size":13,"text-anchor":"end"},"jobb láb: "+fmt(Rb,0)+" mm");
status("A legmagasabb padlóponton: l = H − t − h = "+v.H+" − "+v.t+" − "+v.k+" = <b>"+fmt(base,0)+" mm</b>. Bal láb: <b>"+fmt(Lb,0)+" mm</b>, jobb láb: <b>"+fmt(Rb,0)+" mm</b>. "+
 (ok?"<span class='ok'>Mindkét láb a "+v.min+"–"+v.max+" mm-es tartományban van.</span>":"<span class='bad'>A láb kívül esik a "+v.min+"–"+v.max+" mm-es állítási tartományon – alátét vagy más lábtípus kell.</span>")+
 " (A padlóeltérés a rajzon 8-szoros.)");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
