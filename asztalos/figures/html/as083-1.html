<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Körfűrész: v és e_z kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="D">Fűrészlap átmérője D</label><input id="D" type="range" min="150" max="450" step="10" value="300" aria-label="Fűrészlap átmérője D"><output id="D_o" for="D"></output></div>
<div class="row"><label for="n">Fordulatszám n</label><input id="n" type="range" min="1000" max="6000" step="100" value="4200" aria-label="Fordulatszám n"><output id="n_o" for="n"></output></div>
<div class="row"><label for="z">Fogszám z</label><input id="z" type="range" min="12" max="96" step="2" value="48" aria-label="Fogszám z"><output id="z_o" for="z"></output></div>
<div class="row"><label for="ve">Előtolás v_e</label><input id="ve" type="range" min="1" max="30" step="0.5" value="6" aria-label="Előtolás v_e"><output id="ve_o" for="ve"></output></div>
<div class="row"><label for="nmax">A lapra írt n_max</label><input id="nmax" type="range" min="2000" max="9000" step="100" value="6000" aria-label="A lapra írt n_max"><output id="nmax_o" for="nmax"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 520 240" role="img" aria-label="Kalkulátor: a fűrészlap átmérőjéből, a fordulatszámból, a fogszámból és az előtolásból a forgácsolási sebesség és a fogankénti előtolás, figyelmeztetésekkel."></svg>
<p class="small">Ellenőrző pontok: 300 mm, 4200 1/min → 65,97 m/s; 48 fog, 6 m/min → 0,0298 mm; 250 mm, 5500 1/min → 71,99 m/s. A sávok tájékoztatók; az ajánlott értékeket a szerszámgyártói adatlap adja (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"D":"mm", "n":"1/min", "z":"db", "ve":"m/min", "nmax":"1/min"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const D=v.D,n=v.n,z=v.z,ve=v.ve,nmax=v.nmax;
const vc=D*Math.PI*n/60000, e=ve*1000/(n*z);
const X0=60,Y0=200,W=430,H=170,px=q=>X0+q/7000*W,py=u=>Y0-u/110*H;
el("rect",{x:X0,y:py(90),width:W,height:py(50)-py(90),fill:css("--grid")});
el("text",{x:X0+6,y:py(90)+14,"font-size":11},"tájékoztató 50–90 m/s");
el("line",{x1:X0,y1:Y0,x2:X0+W,y2:Y0,stroke:css("--line")});el("line",{x1:X0,y1:Y0,x2:X0,y2:Y0-H,stroke:css("--line")});
for(let u=0;u<=110;u+=10){el("text",{x:X0-6,y:py(u)+4,"text-anchor":"end","font-size":11},String(u));}
for(let q=0;q<=7000;q+=1000)el("text",{x:px(q),y:Y0+15,"text-anchor":"middle","font-size":11},String(q));
let d="";for(let q=0;q<=7000;q+=100){d+=(q?"L":"M")+px(q)+" "+py(Math.min(110,D*Math.PI*q/60000));}
el("path",{d:d,fill:"none",stroke:css("--hl"),"stroke-width":2});
el("line",{x1:px(nmax),x2:px(nmax),y1:Y0,y2:Y0-H,stroke:css("--bad"),"stroke-width":2,"stroke-dasharray":"6 4"});
el("text",{x:px(nmax)+4,y:Y0-H+12,"font-size":11},"n_max");
el("circle",{cx:px(n),cy:py(Math.min(vc,110)),r:6,fill:css("--hl2"),stroke:css("--line")});
el("text",{x:X0+W/2,y:Y0+32,"text-anchor":"middle","font-size":12},"fordulatszám n (1/min)");
let s="v = D·π·n / 60 000 = <b>"+fmt(vc,2)+" m/s</b>; e<sub>z</sub> = v<sub>e</sub>·1000 / (n·z) = <b>"+fmt(e,4)+" mm</b>.<br>";
if(n>nmax) s+="<span class='bad'>TILOS – a lap megengedett fordulatszáma (n_max = "+nmax+" 1/min) túllépve!</span> ";
if(vc<50||vc>90) s+="<span class='bad'>v a tájékoztató 50–90 m/s sávon kívül.</span> ";
else s+="<span class='ok'>v a tájékoztató 50–90 m/s sávban.</span> ";
if(e<=0.035) s+="<span class='bad'>e<sub>z</sub> nagyon kicsi (mint a 2. példában): tömörfa hasításnál súrlódás, melegedés, égés – nagyobb előtolás vagy kevesebb fog.</span>";
status(s);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
