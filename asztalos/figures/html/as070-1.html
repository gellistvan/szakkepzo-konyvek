<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Évgyűrű-fordítás a táblásításnál</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="du">Fanedvesség-csökkenés</label><input id="du" type="range" min="0" max="6" step="0.5" value="3" aria-label="Fanedvesség-csökkenés"><output id="du_o" for="du"></output></div>
<div class="row"><label for="f1">1. léc megfordítva (bél felül)</label><input id="f1" type="checkbox" aria-label="1. léc megfordítva (bél felül)"></div>
<div class="row"><label for="f2">2. léc megfordítva (bél felül)</label><input id="f2" type="checkbox" checked aria-label="2. léc megfordítva (bél felül)"></div>
<div class="row"><label for="f3">3. léc megfordítva (bél felül)</label><input id="f3" type="checkbox" aria-label="3. léc megfordítva (bél felül)"></div>
<div class="row"><label for="f4">4. léc megfordítva (bél felül)</label><input id="f4" type="checkbox" checked aria-label="4. léc megfordítva (bél felül)"></div>
<div class="row"><label for="f5">5. léc megfordítva (bél felül)</label><input id="f5" type="checkbox" aria-label="5. léc megfordítva (bél felül)"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 730 300" role="img" aria-label="Öt léc homloknézete: lécenként megfordítható évgyűrűállás, a tábla ívelése a fanedvesség-csökkenés függvényében."></svg>
<p class="small">Szemléltető modell: a léc a kéreg felőli oldalán homorodik, a ragasztott fugák merevek. Az ívelés mértéke nagyított, nem mért érték.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"du":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const W=130,T=22,N=5,k=0.00034*v.du;  // nagyított, szemléltető görbület
const o=[];for(let i=1;i<=N;i++)o.push(v["f"+i]?-1:1);
// lánc: lécenként állandó görbület, merev fugák (a szél elfordulása összeadódik)
let segs=[],x=0,y=0,th=0;
for(const oi of o){const kap=k*oi,x0=x,y0=y,th0=th;
  const m=(u,w)=>{let cx,cy,t;if(Math.abs(kap)<1e-12){cx=x0+u*Math.cos(th0);cy=y0+u*Math.sin(th0);t=th0;}
    else{t=th0+kap*u;cx=x0+(Math.sin(t)-Math.sin(th0))/kap;cy=y0-(Math.cos(t)-Math.cos(th0))/kap;}
    return [cx-w*Math.sin(t),cy+w*Math.cos(t)];};
  segs.push(m);[x,y]=m(W,0);th=th0+kap*W;}
const p0=segs[0](0,0),p1=segs[N-1](W,0),ang=Math.atan2(p1[1]-p0[1],p1[0]-p0[0]);
const R=(p)=>{const dx=p[0]-p0[0],dy=p[1]-p0[1];return [dx*Math.cos(-ang)-dy*Math.sin(-ang),dx*Math.sin(-ang)+dy*Math.cos(-ang)];};
const X=(p)=>40+p[0]*1.0, Y=(p)=>190-p[1]*1.0;
let ymin=0,ymax=0;
el("line",{x1:40,y1:190,x2:690,y2:190,stroke:css("--grid"),"stroke-dasharray":"4 3"});
segs.forEach((m,i)=>{let d="";for(let u=0;u<=W;u+=5){const p=R(m(u,-T/2));d+=(u?"L":"M")+X(p)+" "+Y(p);}
  for(let u=W;u>=0;u-=5){const p=R(m(u,T/2));d+="L"+X(p)+" "+Y(p);}
  el("path",{d:d+"Z",fill:"none",stroke:css("--line"),"stroke-width":1.5});
  // évgyűrűk
  const pc=[W/2,-o[i]*(T/2+70)];
  for(let r=75;r<150;r+=13){let dd="",first=true;
    for(let u=3;u<=W-3;u+=2){const dv=r*r-(u-pc[0])*(u-pc[0]);if(dv<0){first=true;continue;}
      const w=pc[1]+o[i]*Math.sqrt(dv);if(w<-T/2+1||w>T/2-1){first=true;continue;}
      const p=R(m(u,w));dd+=(first?"M":"L")+X(p)+" "+Y(p);first=false;}
    if(dd)el("path",{d:dd,fill:"none",stroke:css("--muted"),"stroke-width":0.8});}
  const c=R(m(W/2,0));ymin=Math.min(ymin,c[1]);ymax=Math.max(ymax,c[1]);
  const b=R(m(W/2,-o[i]*(T/2+9)));el("text",{x:X(b),y:Y(b)+4,"text-anchor":"middle","font-size":12},o[i]>0?"▲":"▼");
  const l=R(m(W/2,o[i]*(T/2+16)));el("text",{x:X(l),y:Y(l)+4,"text-anchor":"middle","font-size":12},(i+1)+". léc");
  if(i){const a=R(m(0,-T/2)),bb=R(m(0,T/2));el("line",{x1:X(a),y1:Y(a),x2:X(bb),y2:Y(bb),stroke:css("--line"),"stroke-width":3.5});}
});
let same=0;for(let i=1;i<N;i++)if(o[i]===o[i-1])same++;
const all=o.every(q=>q===o[0]);
const msg = v.du===0 ? "Nincs nedvességváltozás: a tábla sík." :
  all ? '<span class="bad">Minden léc azonos irányú: a görbületek összeadódnak, a tábla vályúsan ível.</span>' :
  same===0 ? '<span class="ok">Váltakozó évgyűrűállás: a görbületek kioltják egymást, a tábla enyhén hullámos, összességében sík.</span>' :
  'Részben váltakozó: ahol két szomszédos léc azonos irányú, ott a görbület összeadódik ('+same+' azonos irányú szomszédpár).';
status(msg+'<br><span class="small">▲/▼ = a bél felőli oldal (itt domborodik a léc). Az ívelés nagyítva, szemléltető.</span>');

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
