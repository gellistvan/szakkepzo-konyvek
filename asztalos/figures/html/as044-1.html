<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferde (ék-) toldás kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="t">Vastagság t</label><input id="t" type="range" min="10" max="60" step="1" value="30" aria-label="Vastagság t"><output id="t_o" for="t"></output></div>
<div class="row"><label for="n">Hajlás 1:n</label><input id="n" type="range" min="4" max="12" step="1" value="8" aria-label="Hajlás 1:n"><output id="n_o" for="n"></output></div>
<div class="row"><label for="L1">1. darab hossza</label><input id="L1" type="range" min="500" max="2000" step="10" value="1000" aria-label="1. darab hossza"><output id="L1_o" for="L1"></output></div>
<div class="row"><label for="L2">2. darab hossza</label><input id="L2" type="range" min="500" max="2000" step="10" value="800" aria-label="2. darab hossza"><output id="L2_o" for="L2"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 700 230" role="img" aria-label="Ferde toldás metszete: a vastagság és a hajlás csúszkával állítható; kiírja a ragasztott sík hosszát és a toldott hosszt."></svg>
<p class="small">l = t / sin α, α = arctan(1/n). A hajlás tájékoztató tartománya 1:6…1:10 (ellenőrizendő: szabvány, gyártói előírás); a fejezet 15°-os példája (l ≈ 116 mm) csak rövid, takart toldáshoz illik.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"t":"mm", "n":"", "L1":"mm", "L2":"mm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const t=v.t, n=v.n, a=Math.atan(1/n), l=t/Math.sin(a), proj=n*t, L=v.L1+v.L2-proj;
const deg=a*180/Math.PI;
// metszet: két darab, a ferde sík a középen; lépték: a 2·proj + 120 mm-es szakasz kitölti a 700 px-t
const span=Math.max(2*proj+200,400), sc=680/span, x0=10, ymid=150, th=t*sc;
const cx=x0+340, a0=cx-proj/2*sc, b0=cx+proj/2*sc, y0=ymid+th/2, y1=ymid-th/2;
el("polygon",{points:`${x0},${y0} ${a0},${y0} ${b0},${y1} ${x0},${y1}`,fill:"none",stroke:css("--line"),"stroke-width":2});
el("polygon",{points:`${a0},${y0} ${x0+680},${y0} ${x0+680},${y1} ${b0},${y1}`,fill:"none",stroke:css("--line"),"stroke-width":2});
el("line",{x1:a0,y1:y0,x2:b0,y2:y1,stroke:css("--hl2"),"stroke-width":5});
for(let k=1;k<4;k++){const yy=y1+th*k/4;el("line",{x1:x0+6,x2:x0+674,y1:yy,y2:yy,stroke:css("--grid"),"stroke-width":1});}
el("text",{x:(a0+b0)/2,y:y1-14,"text-anchor":"middle","font-size":13},`ragasztott sík l = ${fmt(l,0)} mm`);
el("line",{x1:a0,x2:b0,y1:y0+22,y2:y0+22,stroke:css("--line")});
el("text",{x:(a0+b0)/2,y:y0+40,"text-anchor":"middle","font-size":13},`vízszintes vetület n·t = ${fmt(proj,0)} mm`);
el("text",{x:x0,y:30,"font-size":13},`t = ${t} mm, hajlás 1:${n}  →  α = arctan(1/${n}) = ${fmt(deg,1)}°`);
status(`l = t / sin α = ${t} / sin ${fmt(deg,1)}° ≈ <b>${fmt(l,0)} mm</b>; l / t = <b>${fmt(l/t,1)}</b>. `+
 `A két darabból kapható hossz: L1 + L2 − n·t = ${v.L1} + ${v.L2} − ${fmt(proj,0)} = <b>${fmt(L,0)} mm</b>. `+
 (n<6?'<span class="bad">1:6-nál meredekebb: rövid, csak takart, nem teherviselő toldáshoz.</span>':'<span class="ok">1:6…1:10 tartomány (tájékoztató).</span>'));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
