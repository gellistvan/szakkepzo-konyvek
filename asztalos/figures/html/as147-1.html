<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felmérési vázlat – munkalaphossz</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="l1">Falhossz alul</label><input id="l1" type="range" min="2990" max="3030" step="1" value="3012" aria-label="Falhossz alul"><output id="l1_o" for="l1"></output></div>
<div class="row"><label for="l2">Falhossz középen</label><input id="l2" type="range" min="2990" max="3030" step="1" value="3010" aria-label="Falhossz középen"><output id="l2_o" for="l2"></output></div>
<div class="row"><label for="l3">Falhossz felül</label><input id="l3" type="range" min="2990" max="3030" step="1" value="3013" aria-label="Falhossz felül"><output id="l3_o" for="l3"></output></div>
<div class="row"><label for="h">Illesztési hézag végenként</label><input id="h" type="range" min="0" max="5" step="0.5" value="1" aria-label="Illesztési hézag végenként"><output id="h_o" for="h"></output></div>
<div class="row"><label for="a">Jobb sarok szöge</label><input id="a" type="range" min="89" max="91" step="0.1" value="90.4" aria-label="Jobb sarok szöge"><output id="a_o" for="a"></output></div>
<div class="row"><label for="d">Munkalap mélysége</label><input id="d" type="range" min="500" max="700" step="10" value="600" aria-label="Munkalap mélysége"><output id="d_o" for="d"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 580 240" role="img" aria-label="Konyhai falszakasz felülnézeti vázlata, fal 3010–3013 mm között, jobb sarok 90,4°, bal oldali fűtéscső, munkalap 3008 mm, padlószint-emelkedés 4 mm."></svg>
<p class="small">A mérési magasságok és a megengedhető hézag a vállalkozás szerelési útmutatója szerint (ellenőrizendő). A számok a fejezet példájából valók.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"l1":"mm", "l2":"mm", "l3":"mm", "h":"mm", "a":"°", "d":"mm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const L=[v.l1,v.l2,v.l3], Lmin=Math.min(...L), Lmax=Lmin-2*v.h, rest=v.d*Math.tan((v.a-90)*Math.PI/180);
const X=40, Y=70, k=0.16, W=Lmin*k, D=v.d*k;
el("rect",{x:X-12,y:Y-12,width:W+24,height:12,fill:css("--grid"),stroke:css("--line")});
el("rect",{x:X-12,y:Y-12,width:12,height:D+40,fill:css("--grid"),stroke:css("--line")});
const dx=(D+28)*Math.tan((v.a-90)*Math.PI/180)*20;
el("polygon",{points:(X+W)+","+(Y-12)+" "+(X+W+12)+","+(Y-12)+" "+(X+W+12+dx)+","+(Y+D+28)+" "+(X+W+dx)+","+(Y+D+28),fill:css("--grid"),stroke:css("--line")});
el("rect",{x:X+v.h*k,y:Y,width:Lmax*k,height:D,fill:"none",stroke:css("--hl"),"stroke-width":2});
el("text",{x:X+W/2,y:Y+D/2+5,"text-anchor":"middle","font-size":13},"munkalap "+fmt(Lmax,0)+" mm");
["alul","középen","felül"].forEach((t,i)=>el("text",{x:X+W/2,y:Y-20-i*16,"text-anchor":"middle","font-size":12},t+": "+L[i]+" mm"+(L[i]==Lmin?"  ← legkisebb":"")));
status("Legnagyobb gyártható munkalaphossz: L<sub>min</sub> − 2·hézag = "+Lmin+" − 2·"+fmt(v.h,1)+" = <b>"+fmt(Lmax,0)+" mm</b>. "+
 "A "+fmt(v.a,1)+"°-os sarok miatt a "+v.d+" mm mély munkalap hátsó éle mentén kb. <b>"+fmt(Math.abs(rest),1)+" mm</b> rés/átfedés keletkezik"+
 (Math.abs(rest)>5?" – <span class='bad'>a takarólécen túl: a munkalapot a falhoz kell illeszteni</span>.":" – takaróléccel vagy tömítéssel kezelhető (tájékoztató)."));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
