<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szárítási hibák</title><style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--box:#f3f3f3}

*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.stage{position:relative;background:#fff;border-radius:4px}.stage img{width:100%;display:block}
.stage svg{position:absolute;left:0;top:0;width:100%;height:100%}
.spot{fill:transparent;stroke:transparent;stroke-width:3;cursor:pointer}
.spot:hover,.spot.on{fill:rgba(31,78,121,.13);stroke:#1f4e79}
.spot.dim{fill:rgba(255,255,255,.72)}
#info{margin:8px 0;padding:6px 10px;background:var(--box);min-height:3.2em;border-left:4px solid var(--hl)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}select,button{font:inherit}
.small{font-size:12px;color:var(--muted)}</style></head><body>
