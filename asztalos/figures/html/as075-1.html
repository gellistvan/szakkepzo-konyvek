<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fecskefarok-osztás kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="b">Deszkaszélesség b</label><input id="b" type="range" min="40" max="300" step="5" value="80" aria-label="Deszkaszélesség b"><output id="b_o" for="b"></output></div>
<div class="row"><label for="vv">Csapdarab vastagsága v</label><input id="vv" type="range" min="6" max="30" step="1" value="10" aria-label="Csapdarab vastagsága v"><output id="vv_o" for="vv"></output></div>
<div class="row"><label for="n">Farkok száma n</label><input id="n" type="range" min="1" max="8" step="1" value="3" aria-label="Farkok száma n"><output id="n_o" for="n"></output></div>
<div class="row"><label for="a">Arány</label><select id="a" aria-label="Arány"><option value="6" selected>1:6 (puhafa)</option><option value="8">1:8 (keményfa)</option></select></div>
<div class="row"><label for="s">Szélső félcsap (keskeny vég)</label><input id="s" type="range" min="2" max="10" step="0.5" value="4" aria-label="Szélső félcsap (keskeny vég)"><output id="s_o" for="s"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 230" role="img" aria-label="Fecskefarkú fogazás osztása: farokszélesség, csapszélesség, e és 2e a deszkaszélesség, a vastagság, a farokszám és az arány függvényében."></svg>
<p class="small">Osztási szabály (tájékoztató, ellenőrizendő): a belső csapok keskeny vége a szélső félcsap kétszerese. A kézi elkészítés lépésenkénti képsora a következő ábrán.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"b":"mm", "vv":"mm", "n":"db", "s":"mm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const b=v.b, vv=v.vv, n=v.n, a=v.a, s=v.s, p=2*s, e=vv/a;
const W=(b-2*s-(n-1)*p)/n, w=W-2*e;
const sc=Math.min(5, 520/b), X0=(560-b*sc)/2, Y0=170, H=Math.max(vv*sc, 30);
const k=H/vv;
el("rect",{x:X0,y:Y0,width:b*sc,height:60,fill:"none",stroke:css("--line"),"stroke-width":1.5});
let x=s;
const pts=[0];
for(let i=0;i<n;i++){pts.push(x,x+W);x+=W+p;} pts.push(b);
for(let i=1;i<pts.length-1;i+=2){const xl=pts[i],xr=pts[i+1];
  const P=[[X0+(xl+e)*sc,Y0],[X0+(xr-e)*sc,Y0],[X0+xr*sc,Y0-H],[X0+xl*sc,Y0-H]];
  el("polygon",{points:P.map(q=>q.join(",")).join(" "),fill:css("--grid"),stroke:css("--line"),"stroke-width":1.5});
  el("text",{x:X0+(xl+xr)/2*sc,y:Y0-H/2+4,"text-anchor":"middle","font-size":11},"farok");}
el("line",{x1:X0-10,y1:Y0,x2:X0+b*sc+10,y2:Y0,stroke:css("--line"),"stroke-dasharray":"8 3 2 3"});
el("text",{x:X0+b*sc/2,y:Y0+40,"text-anchor":"middle","font-size":12},"farokdarab, "+b+" mm széles (az ábra méretarányos)");
const ok=w>p && w>0 && W>0;
status("e = v/a = "+vv+"/"+a+" = <b>"+fmt(e,2)+" mm</b> (egy oldal), 2e = <b>"+fmt(2*e,2)+" mm</b><br>"+
 "farok széles vége W = (b − 2s − (n − 1)·p)/n = <b>"+fmt(W,1)+" mm</b>, keskeny vége W − 2e = <b>"+fmt(w,1)+" mm</b>; "+
 "szélső félcsap "+fmt(s,1)+" mm, belső csap keskeny vége p = 2s = "+fmt(p,1)+" mm"+
 (ok?"":' <br><span class="bad">A farok túl keskeny: kevesebb farok vagy keskenyebb csap kell.</span>'));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
