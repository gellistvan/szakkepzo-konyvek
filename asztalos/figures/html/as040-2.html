<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Négyközéppontos ovális</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Izometrikus rombuszba írt négyközéppontos ovális szerkesztése: nagy ívek a tompaszögű csúcsokból, kis ívek az összekötők metszéspontjaiból."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Ø100 mm-es kör a vízszintes síkban, izometrikus rajzon. A számolt sugarak a szerkesztés ellenőrzésére szolgálnak.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. Rajzold meg a kör köré írt 100 mm-es négyzet izometrikus képét: rombusz (tompaszög 120°, hegyesszög 60°).", "k": 0}, {"msg": "2. Jelöld a rombusz oldalfelező pontjait (1–4): a kör ezekben érinti az oldalakat.", "k": 1}, {"msg": "3. Kösd össze mindkét tompaszögű csúcsot a szemközti két oldal felezőpontjával (4 egyenes).", "k": 2}, {"msg": "4. A tompaszögű csúcsok (O₁, O₂) a nagy ívek középpontjai; az egyenesek metszéspontjai a hosszú átlón (K₁, K₂) a kis ívek középpontjai.", "k": 3}, {"msg": "5. Rajzold meg a négy ívet: R1 = O₁–3 ≈ 86,6 mm, R2 = K₁–1 ≈ 28,9 mm; a felezőpontokban érintőlegesen csatlakoznak.", "k": 4}, {"msg": "6. Összehasonlítás: a pontos izometrikus ellipszis (pontozott) és a négyközéppontos ovális szinte fedi egymást.", "k": 5}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const ELEMS=[{"t": "l", "p": [[0.0, 0.0], [86.60254037844388, 50.0], [0.0, 100.0], [-86.60254037844388, 50.0], [0.0, 0.0]], "st": "thin", "s": 0}, {"t": "l", "p": [[-86.60254037844388, 50.0], [86.60254037844388, 50.0]], "st": "cen", "s": 0}, {"t": "x", "x": 0, "y": -10, "txt": "a kör köré írt 100 × 100-as négyzet képe: rombusz", "s": 0}, {"t": "p", "x": 43.30127018922194, "y": 25.0, "lab": "1", "dx": 6, "dy": -6, "s": 1}, {"t": "p", "x": -43.30127018922194, "y": 25.0, "lab": "2", "dx": -6, "dy": -6, "s": 1}, {"t": "p", "x": 43.30127018922194, "y": 75.0, "lab": "3", "dx": 6, "dy": 6, "s": 1}, {"t": "p", "x": -43.30127018922194, "y": 75.0, "lab": "4", "dx": -6, "dy": 6, "s": 1}, {"t": "l", "p": [[0.0, 0.0], [43.30127018922194, 75.0]], "st": "thin", "s": 2}, {"t": "l", "p": [[0.0, 0.0], [-43.30127018922194, 75.0]], "st": "thin", "s": 2}, {"t": "l", "p": [[0.0, 100.0], [43.30127018922194, 25.0]], "st": "thin", "s": 2}, {"t": "l", "p": [[0.0, 100.0], [-43.30127018922194, 25.0]], "st": "thin", "s": 2}, {"t": "p", "x": 0.0, "y": 0.0, "lab": "O₁ (R1)", "dx": 0, "dy": -8, "s": 3}, {"t": "p", "x": 0.0, "y": 100.0, "lab": "O₂ (R1)", "dx": 0, "dy": 8, "s": 3}, {"t": "p", "x": 28.86751345948129, "y": 50.0, "lab": "K₁", "dx": -6, "dy": 6, "s": 3}, {"t": "p", "x": -28.86751345948129, "y": 50.0, "lab": "K₂", "dx": 6, "dy": 6, "s": 3}, {"t": "a", "c": [0.0, 0.0], "r": 86.60254037844386, "a1": 59.99999999999999, "a2": 120.00000000000001, "st": "thick", "s": 4}, {"t": "a", "c": [0.0, 100.0], "r": 86.60254037844386, "a1": -120.00000000000001, "a2": -59.99999999999999, "st": "thick", "s": 4}, {"t": "a", "c": [28.86751345948129, 50.0], "r": 28.86751345948129, "a1": -59.99999999999999, "a2": 59.99999999999999, "st": "thick", "s": 4}, {"t": "a", "c": [-28.86751345948129, 50.0], "r": 28.86751345948129, "a1": 120.00000000000001, "a2": -120.00000000000001, "st": "thick", "s": 4}, {"t": "x", "x": 0, "y": 124.0, "txt": "R1 = 86,6   R2 = 28,9", "s": 4}, {"t": "l", "p": [[43.30127018922194, 75.0], [39.304853826069404, 77.11167316680718], [35.00082369023747, 79.01116073171903], [30.422864653158776, 80.68359662911973], [25.60680545132471, 82.11589178053967], [20.59033827784405, 83.29683653444147], [15.412723789926808, 84.2171883969418], [10.114483841010165, 84.86974436685738], [4.737084342313561, 85.24939730895554], [-0.6773892641379455, 85.35317592421191], [-6.0865613811592905, 85.18026800425385], [-11.44809790290813, 84.73202678799223], [-16.720037536661916, 84.01196037069224], [-21.86112020682659, 83.02570424837134], [-26.831109970970587, 81.78097721240219], [-31.59110992062833, 80.28752093950455], [-36.10386660234727, 78.55702374991665], [-40.334061576471356, 76.60302913044188], [-44.2485878318177, 74.4408297383014], [-47.81680889292737, 72.08734771535703], [-51.01079859202428, 69.56100224940715], [-53.8055596291417, 66.88156541906858], [-56.17921920988712, 64.07000745045349], [-58.113200229714614, 61.14833259671743], [-59.59236666495565, 58.13940692494408], [-60.605142032726484, 55.06677935816727], [-61.14359999260273, 51.954497373119445], [-61.20352638098005, 48.82691879612149], [-60.78445219261822, 45.70852117006615], [-59.88965725124293, 42.6237101844571], [-58.52614454047828, 39.596628667798015], [-56.70458539600484, 36.650967637225605], [-54.439235987889305, 33.809780884178885], [-51.74782574672441, 31.095304547223844], [-48.651418606796156, 28.5287830841202], [-45.174248152238434, 26.130303005135133], [-41.343527956380115, 23.918635668866195], [-37.18923859863616, 21.911090370909076], [-32.74389302582465, 20.12337887515082], [-28.04228209427506, 18.569492447914552], [-23.12120228420651, 17.261592357330493], [-18.019167717379364, 16.20991469492393], [-12.77610873187318, 15.422690264320476], [-7.4330593730516865, 14.906080164047939], [-2.0318362465216633, 14.66412756858681], [3.385288753502759, 14.698726085048015], [8.77591927908693, 15.009604933129863], [14.097866337481085, 15.594331064340976], [19.309478477190883, 16.44832820390365], [24.369967767058082, 17.564912666308675], [29.239729017124567, 18.935345664216577], [33.880649742942246, 20.54890170131699], [38.25640844743874, 22.392952513879493], [42.33275888587838, 24.453065904039253], [46.07779808916021, 26.713118691313312], [49.462216047806734, 29.15542289834844], [52.45952510252813, 31.760864183326177], [55.0462672460693, 34.509051435603666], [57.20219771392247, 37.37847636380189], [58.91044342705814, 40.346681827347595], [60.15763504664583, 43.390437594046794], [60.93401160725742, 46.48592214814849], [61.233496909655834, 49.608909126003766], [61.05374707529266, 52.734956920208695], [60.39616889033563, 55.83959996832134], [59.26590879565947, 58.898540229059584], [57.67181260896826, 61.88783734741872], [55.62635629427841, 64.7840960204087], [53.14554832058452, 67.56464909702076], [50.2488043738845, 70.20773497941721], [46.95879540311185, 72.69266793694007], [43.301270189221945, 75.0]], "st": "ref", "s": 5}, {"t": "x", "x": 0, "y": -22, "txt": "pontos ellipszis (pontozott) – a közelítés eltérése kicsi", "s": 5}], BOX=[-96.60254037844388, -30, 96.60254037844388, 130.0];
function render(s){
 const B=s.box||BOX; const W=B[2]-B[0], Hh=B[3]-B[1]; const sc=Math.min(540/W, 330/Hh);
 svg.setAttribute("viewBox","0 0 "+(W*sc+20)+" "+(Hh*sc+20)); svg.innerHTML="";
 const X=x=>10+(x-B[0])*sc, Y=y=>10+(B[3]-y)*sc;
 const ST={thick:[2.6,""],thin:[1,""],dash:[1.2,"5 3"],cen:[1,"12 3 2 3"],ref:[1.4,"2 2"]};
 ELEMS.forEach(e=>{if(e.s>s.k)return; const on=e.s==s.k, c=on?css("--hl2"):css("--line"), st=ST[e.st||"thin"];
  const w=st[0]+(on?0.8:0);
  if(e.t=="l") el("polyline",{points:e.p.map(q=>X(q[0])+","+Y(q[1])).join(" "),fill:"none",stroke:c,"stroke-width":w,"stroke-dasharray":st[1]});
  else if(e.t=="a"){const r=e.r*sc, a1=e.a1*Math.PI/180, a2=e.a2*Math.PI/180;
    const x1=X(e.c[0]+e.r*Math.cos(a1)), y1=Y(e.c[1]+e.r*Math.sin(a1)), x2=X(e.c[0]+e.r*Math.cos(a2)), y2=Y(e.c[1]+e.r*Math.sin(a2));
    let d=e.a2-e.a1; while(d<0)d+=360; if(d>=359.9){el("circle",{cx:X(e.c[0]),cy:Y(e.c[1]),r:r,fill:"none",stroke:c,"stroke-width":w,"stroke-dasharray":st[1]});}
    else el("path",{d:"M"+x1+" "+y1+" A"+r+" "+r+" 0 "+(d>180?1:0)+" 0 "+x2+" "+y2,fill:"none",stroke:c,"stroke-width":w,"stroke-dasharray":st[1]});}
  else if(e.t=="p"){el("circle",{cx:X(e.x),cy:Y(e.y),r:on?4.5:3.2,fill:c});
    if(e.lab)el("text",{x:X(e.x)+(e.dx||0)*sc,y:Y(e.y)-(e.dy||0)*sc+4,"text-anchor":e.ha=="left"?"start":(e.ha=="right"?"end":"middle"),"font-size":13,fill:c},e.lab);}
  else if(e.t=="x")el("text",{x:X(e.x),y:Y(e.y)+4,"text-anchor":e.ha=="left"?"start":(e.ha=="right"?"end":"middle"),"font-size":12,fill:c},e.txt);
 });}

// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.innerHTML = s.msg || "";   // a lépésszöveg saját, megbízható HTML-t (<b>, <i>) tartalmazhat
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
