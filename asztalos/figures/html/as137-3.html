<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lépcsőkorlát elemei</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#555;--btn:#e8eefc;--btnb:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--btn:#26324a;--btnb:#8fb8e8}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px}
button{font:inherit;padding:5px 12px;border:1.5px solid var(--btnb);background:var(--btn);color:var(--fg);border-radius:6px;cursor:pointer}
button[aria-pressed=true]{background:var(--btnb);color:var(--bg)}
button:focus-visible{outline:3px solid var(--btnb);outline-offset:2px}
label.chk{display:inline-flex;gap:5px;align-items:center;cursor:pointer;margin-right:8px}
.card{background:#fff;border-radius:8px;padding:6px;color:#111}
.card svg{width:100%;height:auto;display:block;max-height:80vh}
#status{margin:6px 0;min-height:2.6em}
.parts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.parts button{font-size:12.5px;padding:3px 8px}
.small{font-size:12px;color:var(--muted)}
svg .hl path,svg .hl line,svg .hl polyline,svg .hl ellipse,svg .hl circle,svg .hl rect{stroke:#d32f2f!important;stroke-width:2.4px!important}
svg .hl text{fill:#d32f2f!important;font-weight:bold}
svg .hl{filter:drop-shadow(0 0 2px rgba(211,47,47,.7))}
svg .dim{opacity:.18}
svg .off{display:none}</style>
</head>

<p class="small">Szemléltető rajz; a méretek tájékoztatók, ellenőrizendő: hatályos előírás (OTÉK, szabvány).</p>
<script>
const PARTS=[{"k": "kapasz", "n": "1", "name": "kapaszkodó", "d": "Ø 40–45 mm, kb. 100 cm-re a fokél vonala fölött (ellenőrizendő)"}, {"k": "foosz", "n": "2", "name": "főoszlop", "d": "a kezdő- és a végponton, valamint a fordulóban"}, {"k": "ok", "n": "3", "name": "korlátorsók", "d": "közbenső függőleges elemek; a nyílás legfeljebb 10–12 cm (ellenőrizendő)"}, {"k": "pofa", "n": "4", "name": "pofa", "d": "a fokokat tartó ferde oldalelem"}, {"k": "fok", "n": "5", "name": "fok (foklap)", "d": "a járófelület"}, {"k": "homlok", "n": "6", "name": "homloklap", "d": "a fokok közötti függőleges elem"}, {"k": "jaro", "n": "", "name": "járóvonal", "d": "egyenes karon a kar közepén"}], LAYERS=[],
GROUPS=[], FRAMES=[{"k": "ok", "c": "HELYES: a korlátorsók közötti szabad nyílás legfeljebb 10–12 cm (ellenőrizendő: előírás) – gyermekfej nem fér át.", "b": "helyes orsótávolság", "z": ""}, {"k": "bad", "c": "HIBÁS: 22 cm-es nyílás – egy gyermek feje átfér, beszorulhat vagy átbújva leeshet.", "b": "hibás orsótávolság", "z": ""}], STEPPER=true,
ZOOM=false, START=0, DELAY=1800,
ALLMSG="Mutasson egy részre vagy a lenti gombokra a kiemeléshez.";


const SVG=document.getElementById("fig"), ST=document.getElementById("status");
const VB0=SVG.getAttribute("viewBox");
const q=k=>Array.from(SVG.querySelectorAll('[id^="'+k+'-"]'));
function status(h){ST.innerHTML=h;}
let cur=null;
function hl(k,on){q(k).forEach(e=>e.classList.toggle("hl",on));}
function pick(p){if(cur)hl(cur.k,false);cur=p;if(p){hl(p.k,true);status("<b>"+(p.n?p.n+" – ":"")+p.name+"</b>"+(p.d?": "+p.d:""));}
  document.querySelectorAll(".parts button").forEach(b=>b.setAttribute("aria-pressed",p&&b.dataset.k===p.k?"true":"false"));}
if(PARTS.length){const box=document.getElementById("parts");
  PARTS.forEach(p=>{const b=document.createElement("button");b.type="button";b.dataset.k=p.k;b.textContent=(p.n?p.n+" ":"")+p.name;
    b.addEventListener("mouseenter",()=>pick(p));b.addEventListener("focus",()=>pick(p));b.addEventListener("click",()=>pick(p));box.appendChild(b);
    q(p.k).forEach(e=>{e.style.cursor="pointer";e.addEventListener("mouseenter",()=>pick(p));e.addEventListener("click",()=>pick(p));});});}
/* rétegek: ki-be kapcsolás */
LAYERS.forEach(L=>{const c=document.getElementById("ly_"+L.id);const f=()=>{L.k.split(",").forEach(k=>q(k).forEach(e=>e.classList.toggle("off",!c.checked)));};
  c.addEventListener("change",f);f();});
/* kiemelő csoportok: a többi kulcsos elem elhalványul */
let gcur=-1;
function focusGroup(i){gcur=i;const all=new Set();GROUPS.forEach(G=>G.k.split(",").forEach(k=>all.add(k)));
  all.forEach(k=>q(k).forEach(e=>e.classList.remove("dim")));
  if(i>=0){const on=new Set(GROUPS[i].k.split(","));all.forEach(k=>{if(!on.has(k))q(k).forEach(e=>e.classList.add("dim"));});status("<b>"+GROUPS[i].t+"</b> – "+GROUPS[i].d);}
  else status(ALLMSG);
  document.querySelectorAll(".grp").forEach((b,j)=>b.setAttribute("aria-pressed",j===i?"true":"false"));}
if(GROUPS.length){const bar=document.getElementById("groups");
  const b0=document.createElement("button");b0.type="button";b0.textContent="Minden réteg";b0.className="grp";b0.addEventListener("click",()=>focusGroup(-1));bar.appendChild(b0);
  GROUPS.forEach((G,j)=>{const b=document.createElement("button");b.type="button";b.textContent=G.t;b.className="grp";b.addEventListener("click",()=>focusGroup(j));bar.appendChild(b);});}
/* képkockák */
let fi=-1,timer=null;
function zoomTo(keys){let b=null;keys.forEach(k=>q(k).forEach(e=>{const r=e.getBBox();if(!r.width&&!r.height)return;
  if(!b)b={x:r.x,y:r.y,x2:r.x+r.width,y2:r.y+r.height};else{b.x=Math.min(b.x,r.x);b.y=Math.min(b.y,r.y);b.x2=Math.max(b.x2,r.x+r.width);b.y2=Math.max(b.y2,r.y+r.height);}}));
  if(!b)return;const p=8;SVG.setAttribute("viewBox",(b.x-p)+" "+(b.y-p)+" "+(b.x2-b.x+2*p)+" "+(b.y2-b.y+2*p));}
function show(i){if(!FRAMES.length)return;fi=(i+FRAMES.length)%FRAMES.length;
  const vis=new Set(FRAMES[fi].k.split(","));
  FRAMES.forEach(F=>F.k.split(",").forEach(k=>{if(!vis.has(k))q(k).forEach(e=>e.classList.add("off"));}));
  vis.forEach(k=>q(k).forEach(e=>e.classList.remove("off")));
  if(ZOOM)zoomTo(FRAMES[fi].z?FRAMES[fi].z.split(","):[...vis]);
  status("<b>"+(fi+1)+"/"+FRAMES.length+"</b> – "+FRAMES[fi].c);
  document.querySelectorAll(".fr").forEach((b,j)=>b.setAttribute("aria-pressed",j===fi?"true":"false"));
  if(typeof onFrame==="function")onFrame(fi);}
function stop(){if(timer){clearInterval(timer);timer=null;const b=document.getElementById("play");if(b)b.textContent="▶ lejátszás";}}
if(FRAMES.length){const bar=document.getElementById("frames");
  const mkb=(t,f,id)=>{const b=document.createElement("button");b.type="button";b.textContent=t;if(id)b.id=id;b.addEventListener("click",f);bar.appendChild(b);return b;};
  if(STEPPER){mkb("⏮",()=>{stop();show(0);});mkb("◀",()=>{stop();show(fi<0?0:fi-1);});mkb("▶",()=>{stop();show(fi+1);});
    mkb("▶ lejátszás",()=>{if(timer){stop();return;}document.getElementById("play").textContent="⏸ megállítás";if(fi<0||fi>=FRAMES.length-1)show(0);
      timer=setInterval(()=>{if(fi>=FRAMES.length-1){stop();return;}show(fi+1);},DELAY);},"play");}
  FRAMES.forEach((F,j)=>{const b=mkb(F.b||String(j+1),()=>{stop();show(j);});b.className="fr";});
  document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"){stop();show(fi+1);}if(e.key==="ArrowLeft"){stop();show(fi<0?0:fi-1);}});
  show(START);}
else if(!GROUPS.length) status(ALLMSG);
else focusGroup(-1);

</script>
