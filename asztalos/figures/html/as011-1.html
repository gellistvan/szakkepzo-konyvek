<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oltóanyag-választás</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#555;--hl:#1f4e79;--btn:#f2f2f2;--bd:#888}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--btn:#2b2b2b;--bd:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
button{font:inherit;padding:3px 10px;cursor:pointer;background:var(--btn);color:var(--fg);border:1px solid var(--bd);border-radius:4px}
button.on{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:120px}
.pane{background:#fff;color:#111;border-radius:6px;padding:6px}
.pane svg{width:100%;height:auto;display:block}
#status{margin:6px 0;min-height:3em}
.small{font-size:12px;color:var(--muted)}
.parts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.parts button{font-size:13px;padding:2px 7px}
.dim{opacity:.18;transition:opacity .15s}
label{margin-right:10px;white-space:nowrap}</style>
</head>

<script>
const C=[[0, "Előbb állítsd le és áramtalanítsd az elszívót. A parázsló porra víz (permetszerűen) vagy ABC por jó; a CO₂ nem, mert elillan, és a parázs újra lángra kap. A fészket szét kell húzni."], [1, "B tűz: hab, ABC por vagy CO₂; kis mennyiségnél oltótakaró. Vízzel leönteni TILOS: az égő folyadék szétfolyik."], [1, "B tűz: hab, ABC por vagy CO₂. Víz TILOS. A menekülési út legyen a hátad mögött."], [3, "Előbb áramtalaníts! Feszültség alatt CO₂ vagy a címke szerinti feszültségig ABC por. Víz és hab TILOS."], [0, "A tűz: víz vagy ABC por; a kupacot nem égő szerszámmal szét kell húzni, mert a mélyben izzhat. CO₂ nem."], [2, "C tűz: ha biztonságosan lehet, zárd el a gázt; oltásra ABC por. Hívd a 112-t; zárt térben ne kockáztass."], [4, "F tűz: oltótakaró vagy F-jelölésű készülék. Víz TILOS (robbanásszerű lángcsóva)."]];
function els(k){return document.querySelectorAll('[id^="'+k+'__"]');}
document.getElementById("sel").addEventListener("change",e=>{const k=+e.target.value;

</script>
