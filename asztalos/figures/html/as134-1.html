<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ékelési sémák nyitásmódonként</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="mod">Nyitásmód</label><select id="mod" aria-label="Nyitásmód"><option value="fix">fix üvegezés</option><option value="nyilo" selected>nyíló, bal pánt</option><option value="bn">bukó-nyíló, bal pánt</option></select></div>
<div class="row"><label for="nek">Ékek nélkül (hibás)</label><input id="nek" type="checkbox" aria-label="Ékek nélkül (hibás)"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 420" role="img" aria-label="Üvegfalc metszete az ékekkel és az ékelési sémák nyitásmódonként."></svg>
<p class="small">Szemléltető séma; a pontos ékelést az üveggyártói és a vasalatgyártói ékelési irányelv adja (ellenőrizendő). Az ereszkedés túlzott léptékű.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const L=css("--line")||"#000", fg=css("--fg"), bad=css("--bad");
const SCH={fix:[["T",.15,0],["T",.85,0],["D",.15,1],["D",.85,1],["D",0,.7],["D",1,.7]],
 nyilo:[["T",.15,0],["D",.85,0],["D",.15,1],["T",.85,1],["D",0,.75],["D",1,.25]],
 bn:[["T",.15,0],["T",.85,0],["D",.15,1],["T",.85,1],["D",0,.75],["D",1,.25]]};
const m=v.mod, nb=v.nek, x0=170, y0=40, W=220, H=300, f=16;
// tok
el("rect",{x:x0-f,y:y0-f,width:W+2*f,height:H+2*f,fill:"none",stroke:fg,"stroke-width":3});
// szárny: ékek nélkül a kilincsoldal leereszkedik (nyíló, bukó-nyíló) – túlzott lépték
const s=(nb&&m!=="fix")?14:0;
const P=[[x0,y0],[x0+W,y0+s],[x0+W,y0+H+s],[x0,y0+H]];
el("polygon",{points:P.map(p=>p.join(",")).join(" "),fill:"none",stroke:nb&&m!=="fix"?bad:fg,"stroke-width":2.5});
el("rect",{x:x0+14,y:y0+14,width:W-28,height:H-28,fill:"none",stroke:fg,"stroke-width":1,"stroke-dasharray":"4 3"});
if(m!=="fix") el("line",{x1:x0-f,y1:y0-f+4,x2:x0-f,y2:y0+H+f-4,stroke:fg,"stroke-width":6,"stroke-dasharray":"14 4 3 4"});
if(m==="bn") el("line",{x1:x0-f+4,y1:y0+H+f,x2:x0+W+f-4,y2:y0+H+f,stroke:fg,"stroke-width":6,"stroke-dasharray":"14 4 3 4"});
if(!nb){SCH[m].forEach(([t,u,w])=>{const cx=x0+14+u*(W-28), cy=y0+14+(1-w)*(H-28), hz=(w===0||w===1);
  const bw=hz?30:10, bh=hz?10:30;
  el("rect",{x:cx-bw/2,y:cy-bh/2,width:bw,height:bh,fill:t==="T"?fg:"none",stroke:fg,"stroke-width":1.5});});
  if(m!=="fix") el("line",{x1:x0+30,y1:y0+H-30,x2:x0+W-30,y2:y0+30,stroke:fg,"stroke-width":1.5,"stroke-dasharray":"6 4"});
  status(m==="fix"?"<span class='ok'>Fix üvegezés:</span> két teherhordó ék alul, a többi távtartó.":
   "<span class='ok'>Átlós ékelés:</span> teherhordó ék a pántoldalon alul és a kilincsoldalon felül"+(m==="bn"?" (bukó-nyílónál alul mindkét sarokban is – a gyártói ékelési rajz szerint)":"")+"; az üveg nyomott átlóként tartja a szárnyat.");}
else{ if(m==="fix") status("Fix üvegezésnél ék nélkül az üveg a falcfenékre ül, a perem sérül, a hézag eltűnik.");
  else {el("text",{x:x0+W+24,y:y0+H+s+4,fill:bad,"font-size":15},"súrol, nem zár");
   el("path",{d:`M ${x0+W+12} ${y0+H-30} l 0 34`,stroke:bad,"stroke-width":2,"marker-end":""});
   status("<span class='bad'>Ékek nélkül:</span> a szárny a kilincsoldalon leereszkedik (túlzott léptékben), súrol a tokon és nem zár.");}}
el("text",{x:x0+W/2,y:y0+H+f+30,"text-anchor":"middle","font-size":14},"belső nézet; fekete: teherhordó ék, üres: távtartó ék");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
