<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csiszolómozgások összehasonlítása</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="vs">vezetési sebesség</label><input id="vs" type="range" min="0.1" max="1.0" step="0.05" value="0.5" aria-label="vezetési sebesség"><output id="vs_o" for="vs"></output></div>
<div class="row"><label for="still">egy helyben tartva</label><input id="still" type="checkbox" aria-label="egy helyben tartva"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 700 200" role="img" aria-label="A szalag-, rezgő- és excentercsiszoló mozgáspályája és karcmintája: párhuzamos, ismétlődő körös és rendezetlen."></svg>
<p class="small">Szemléltető kinematika egy szemcsére (nem mért adat); excenter 5 mm lökethossz, rezgő kb. 2 mm körpálya – tájékoztató, ellenőrizendő: gépkönyv.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"vs":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const line=css("--line")||"#000", bad=css("--bad")||"#b71c1c";
const vv = v.still ? 0 : v.vs, W=220, H=120, sc=8.4;
const names=["Szalagcsiszoló","Rezgőcsiszoló","Excentercsiszoló"];
function frame(i){const X=10+i*(W+12), Y=40;
  el("rect",{x:X,y:Y,width:W,height:H,fill:"#fff",stroke:line});
  el("text",{x:X+W/2,y:Y-10,"text-anchor":"middle","font-size":14,"font-weight":"bold"},names[i]); return [X+W/2, Y+H/2];}
function poly(pts,cx,cy,col,w){let d="";pts.forEach((p,j)=>{const x=cx+p[0]*sc, y=cy-p[1]*sc; d+=(j?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);});
  el("path",{d:d,fill:"none",stroke:col,"stroke-width":w});}
const N=2400, T=1.0, w=2*Math.PI*40, Om=w*0.083;
// szalag
let [cx,cy]=frame(0);
if(vv===0){ el("rect",{x:cx-100,y:cy-8,width:200,height:16,fill:bad,opacity:0.35}); el("text",{x:cx,y:cy+40,"text-anchor":"middle","font-size":12,style:"fill:"+bad},"egy helyben: barázda!"); }
for(const y of [-4.5,-3,-1.5,0,1.5,3,4.5]) poly([[-12,y],[12,y]],cx,cy,"#333",1);
// rezgő
[cx,cy]=frame(1); let P=[];
for(let k=0;k<N;k++){const t=k/N*T; P.push([vv*t*48-12+Math.cos(w*t), Math.sin(w*t)]);} poly(P.filter(p=>p[0]>-12.5&&p[0]<12.5),cx,cy,"#333",0.7);
// excenter
[cx,cy]=frame(2); P=[];
for(let k=0;k<N;k++){const t=k/N*T; P.push([vv*t*48-12+2.5*Math.cos(w*t)+3*Math.cos(Om*t), 2.5*Math.sin(w*t)+3*Math.sin(Om*t)]);} poly(P.filter(p=>p[0]>-12.5&&p[0]<12.5),cx,cy,"#333",0.7);
status(vv===0 ? "<span class='bad'>A gépet egy helyben tartod: a szalag barázdát vés, a rezgő- és az excentercsiszoló egy foltot políroz/karcol. Mindig mozgasd a gépet!</span>" :
  "Vezetési sebesség: <b>"+fmt(vv,2)+"</b> (szemléltető egység). Lassú vezetésnél a rezgőcsiszoló körei sűrűsödnek; az excenter pályája nem ismétlődik, ezért nem rajzol szabályos karcmintát.");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
