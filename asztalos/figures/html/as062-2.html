<p class="small">Sematikus vonalrajz; a gyalupadok kialakítása típusonként eltér.</p>
<script>
const P={"padlap": ["1 Padlap (munkalap)", "Vastag, sík keményfa lap; a munkadarab rajta fekszik."], "elso": ["2 Elülső satu (oldalsatu)", "A pad elülső oldalán: élgyalulásnál, fűrészelésnél fogja a munkadarabot."], "hatso": ["3 Hátsó satu (farsatu)", "A pad végén; a padkutyákkal együtt a lapon fekvő munkadarabot szorítja."], "furat": ["4 Padkutya-furatok sora", "A padlap szélén sorban; a padkutya ezekbe kerül a darab hosszához igazítva."], "kutya": ["5 Padkutyák (padpecek)", "Kiálló fa- vagy fémpecek; két padkutya között fogjuk a munkadarabot. Gyalulásnál a vas ne érje!"], "talca": ["6 Szerszámtálca", "Mélyített rész a pad hátsó oldalán; munka közben ide tedd a szerszámot (éllel befelé)."], "lab": ["7 Lábazat és merevítés", "Stabil, merevített láb: a pad nem billeghet, nem csúszhat."], "b1": ["Gyalulás padkutyák között", "A lapon fekvő munkadarab a hátsó satu padkutyája és egy furatba tett padkutya közé szorul."], "b2": ["Élgyalulás az elülső satuban", "A darab élével felfelé áll a satuban; hosszú darabnál alátámasztás kell."], "b3": ["Vésés szorítóval", "A darab szorítóval a padlaphoz rögzítve, a pad szilárd részén (a láb fölött), alatta alátéttel."], "b4": ["Fűrészelés padhoroggal", "A padhorog (fűrészelő támasz) a pad elejébe akad; a darabot nekitámasztva fűrészelünk."]};
const G=[...document.querySelectorAll('#fig g[id]')].filter(g=>P[g.id.split('__')[0]]);
const info=document.getElementById('info');
function hl(k){G.forEach(g=>g.classList.toggle('dim',!!k&&g.id.split('__')[0]!==k));
 document.querySelectorAll('button[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===k&&!!k));
 info.innerHTML=k?'<b>'+P[k][0]+'.</b> '+P[k][1]:'';}
G.forEach(g=>{const k=g.id.split('__')[0];g.style.cursor='pointer';
