<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betétméret-számító keretes elemhez</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="A">Keret külső szélessége</label><input id="A" type="range" min="300" max="900" step="5" value="480" aria-label="Keret külső szélessége"><output id="A_o" for="A"></output></div>
<div class="row"><label for="H">Keret külső magassága</label><input id="H" type="range" min="600" max="2200" step="10" value="1800" aria-label="Keret külső magassága"><output id="H_o" for="H"></output></div>
<div class="row"><label for="b">Keretléc szélessége</label><input id="b" type="range" min="40" max="100" step="1" value="60" aria-label="Keretléc szélessége"><output id="b_o" for="b"></output></div>
<div class="row"><label for="t">Nútmélység</label><input id="t" type="range" min="6" max="15" step="1" value="10" aria-label="Nútmélység"><output id="t_o" for="t"></output></div>
<div class="row"><label for="h">Hézag oldalanként</label><input id="h" type="range" min="0" max="5" step="0.5" value="2" aria-label="Hézag oldalanként"><output id="h_o" for="h"></output></div>
<div class="row"><label for="faj">Betét anyaga</label><select id="faj" aria-label="Betét anyaga"><option value="0.41" selected>tömör bükk (≈0,41 %/%)</option><option value="0.36">tömör tölgy (≈0,36 %/%)</option><option value="0.31">tömör fenyő (≈0,31 %/%)</option><option value="0">rétegelt lemez / MDF</option></select></div>
<div class="row"><label for="du">Fanedvesség-ingadozás</label><input id="du" type="range" min="1" max="6" step="0.5" value="3" aria-label="Fanedvesség-ingadozás"><output id="du_o" for="du"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 580 350" role="img" aria-label="Keretes oldalelem és nútmetszet a betétméret levezetésével."></svg>
<p class="small">A betétméret az as118 képletével számol (példa: 376 × 1696 mm; 3. feladat: 620 × 1850, 65 mm léc → 506 × 1736 mm). A húrirányú differenciális zsugorodási értékek és a hézagjavaslat tájékoztatók (ellenőrizendő: a könyv fanedvesség- és zsugorodási táblázata).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"A":"mm", "H":"mm", "b":"mm", "t":"mm", "h":"mm", "du":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const A=v.A,H=v.H,b=v.b,t=v.t,h=v.h, du=v.du, q=+v.faj;
const B=A-2*b+2*t-2*h, Hb=H-2*b+2*t-2*h, nb=A-2*b+2*t, nh=H-2*b+2*t;
const fg=css("--fg"),mu=css("--muted");
const k=Math.min(300/H, 170/A), x0=20, y0=20;
const Rr=(x,y,w,hh,a)=>el("rect",Object.assign({x:x0+x*k,y:y0+(H-y-hh)*k,width:w*k,height:hh*k,fill:"none",stroke:fg,"stroke-width":1.3},a||{}));
Rr(0,0,A,H,{"stroke-width":2});Rr(0,0,b,H);Rr(A-b,0,b,H);Rr(b,0,A-2*b,b);Rr(b,H-b,A-2*b,b);
const bad=B>=nb||Hb>=nh||B<=0||Hb<=0;
Rr(b-t+h,b-t+h,B,Hb,{"stroke-dasharray":"5 3",stroke:bad?css("--bad"):css("--hl")});
el("text",{x:x0+A*k/2,y:y0+H*k/2,"text-anchor":"middle","font-size":12},B+" × "+Hb);
// metszet (nagyítva)
const s=2.4, sx=260, sy=120;
el("rect",{x:sx,y:sy,width:b*s,height:30*s,fill:"none",stroke:fg,"stroke-width":1.5});
el("rect",{x:sx+(b-t)*s,y:sy+12*s,width:t*s,height:6*s,fill:css("--bg"),stroke:fg});
el("rect",{x:sx+(b-t+h)*s,y:sy+12*s,width:Math.max(0,(110-(b-t+h)))*s*0.9,height:6*s,fill:mu,stroke:fg});
el("text",{x:sx,y:sy-8,"font-size":12},"vízszintes metszet a nútnál (nagyítva)");
el("text",{x:sx+(b-t)*s,y:sy+30*s+16,"font-size":11},"nút "+t+" mm · hézag "+h+" mm");
// javasolt hézag
const mov=q*B*du/100;
let rec=q>0?"Javasolt mozgási hézag oldalanként ≈ "+fmt(Math.max(1,mov/2),1)+" mm (betétmozgás ≈ "+fmt(mov,1)+" mm, tájékoztató)":"Rétegelt/MDF betét: a szélességi mozgás elhanyagolható; 1–2 mm hézag elég.";
status("Betét: <b>"+B+" × "+Hb+" mm</b> · nútfenekek távolsága "+nb+" × "+nh+" mm → "+
  (bad?"<span class='bad'>a betét nem fér el a nútban!</span>":"<span class='ok'>elfér ("+(nb-B)+" mm össz-hézag)</span>")+"<br>"+rec);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
