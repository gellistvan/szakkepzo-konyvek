<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Körfűrészgép védőelemei</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#c55a11;--btn:#f0f0f0;--bd:#999}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#f0a060;--btn:#2a2a2a;--bd:#666}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer;background:var(--btn);color:var(--fg);border:1px solid var(--bd);border-radius:4px}
button.on{outline:2px solid var(--hl);font-weight:bold}
#status{margin:4px 0 6px;min-height:3em}
.fig{position:relative;width:100%;background:#fff;border:1px solid var(--bd)}
.fig img{display:block;width:100%;height:auto}
.fig svg{position:absolute;left:0;top:0;width:100%;height:100%}
.fig rect{fill:rgba(197,90,17,0);stroke:none;cursor:pointer}
.fig rect.on{fill:rgba(197,90,17,.18);stroke:#c55a11;stroke-width:3}
#parts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
#parts button{font-size:12.5px;padding:2px 7px}
.small{font-size:12px;color:var(--muted)}
</style>
</head>

": "Veszélyzóna", "d": "A fűrészlap előtti és mögötti sáv a lap síkjában: ide kéz nem kerülhet; a visszavágódó darab a kezelő felé, a lap síkjában repül.", "b": [0.3443, 0.52, 0.3726, 0.7867]}, {"n": "Kezelő helyzete", "d": "A kezelő a fűrészlap síkjától kissé balra áll, nem a lap vonalában; keskeny darabnál tolófát használ.", "b": [0.1792, 0.8667, 0.3302, 0.9467]}]}, {"label": "Védőelemek", "msg": "A számozott védőelemek és alkatrészek.", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAArUAAAHqCAYAAAAakLb+AAAAQHRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjcrZGZzZzEsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvhF0PpwAAAAlwSFlzAAAOnAAADpwBB5RT3QAA4pJJREFUeJzs3Xd8jef/+PHXyZYhOyFChBBqb9Va0SqJPaoxQ1Gj1aCt1RJKtFTRmrVCxB6xa5WYKbWL8jEjgkpCkiOy798fvs7PaRKSSJyTeD8fjzweue/7uq7zvu+QvM91rqFSFEVBCCGEEEKIQsxA1wEIIYQQQgjxuiSpFUIIIYQQhZ4ktUIIIYQQotCTpFYIIYQQQhR6ktQKoScuX75MQEAAf/75p65DEUIIIQodSWqF+D9BQUGoVCrKli2b5flbt25RtmxZ/Pz8tK4HBASgUqlo1qxZnl/76dOndO3alVOnTlG7du08tyOEEEK8rSSpFUVGs2bNUKlUmb5sbGxeq11HR0caNGiAqakptWrVonz58vkT8AtGjBiBs7Mz69evx9jYOF/bLlu2LCqViqCgoHxtVwghhNAnRroOQIj8ZmVlxTvvvKN1/Dp8fHzw8fEBYPPmza/VVnbmz59fIO0KIYQQbwvpqRVFTu3atQkPD9d87d27F4DTp0/j7e2NtbU1xYoVo1mzZpw4ceKlbT3v7X2xl/P5uYMHD76y3tKlS/noo48wNzenatWqHDlyRKvcunXrqFu3LsWKFcPGxoZu3bpx586dTO389+v5az958oQRI0ZQpkwZTExMKF++PD///LNW/du3bwPQt2/fLIdXCCGEEEWB9NSKt8LFixdp3LgxiYmJlCpVClNTU8LCwmjevDl//fUXlStXLpDXHTRoEKVLl0alUnHx4kW6d+/O9evXMTY2ZtmyZfTr1w+AypUr8/DhQ9atW8dff/3FuXPnsLS0pEGDBpq27t69S2RkJABmZmYoioKPjw9hYWGYm5tTuXJlLl26xMiRI1Gr1YwfP54GDRpw5swZUlJSKFeuHI6OjpQsWbJA7lUIIYTQJempFUVOWFiYVq9mhw4d+OGHH0hMTKRVq1ZERERw/fp12rRpQ2JiItOnTy+wWDp16sT169dZs2YNAHfu3OHatWsATJgwAYDAwEAuXbrEzZs3KVGiBDdu3CA4OBhA09v84rCH/v3707BhQ/744w/CwsIwNTXl4sWLnDt3jtWrVwPw448/8vTpU8LDwzVJ7HfffZepLSGEEKKokJ5aUeT8d0ytp6cn27ZtA+D333/H0NBQq/zJkycLLJZPPvkEQKsn+N9//8Xe3l4zzGDs2LGMHTtWq965c+c03yclJdGhQwciIyNp1qwZ8+bNA+DUqVMAJCcn4+7urlU/MTGRS5cuUadOnfy/KSGEEEIPSVIripzatWtnGu/6PKktVaoUrq6uWtdcXFxe2WZ6ejoA8fHxuYrl+coLRkb//7+aoihaZT7++ONMSemLyWi/fv04ceIEFSpUYO AAAABJRU5ErkJggg==", "hot": [{"n": "Vágásmagasság és hasítóék", "d": "A fogak csak 5–15 mm-rel (egy-két fogmagassággal) érjenek túl a darabon (tájékoztató, gépkönyv). A hasítóék a lap mögött, a fogkoszorúval koncentrikusan, a gépkönyv szerinti távolságra.", "b": [0.6415, 0.68, 0.9717, 0.9067]}, {"n": "Gépasztal", "d": "Sík, tiszta támasztófelület; a munkadarab ezen csúszik.", "b": [0.1132, 0.08, 0.3113, 0.26]}, {"n": "Körfűrészlap", "d": "Csak a fogkoszorú kis része emelkedik a munkadarab fölé.", "b": [0.3491, 0.3467, 0.3679, 0.52]}, {"n": "Hasítóék", "d": "A fűrészlap mögött, a fogkoszorúval koncentrikusan, előírt távolságra és magasságra állítva: nyitva tartja a vágásrést, így a hátsó fogak nem kapják el a darabot. Nem távolítható el.", "b": [0.3491, 0.2733, 0.3679, 0.3467]}, {"n": "Védőburkolat elszívócsonkkal", "d": "Állítható burkolat a fűrészlap fölött; eltakarja a fogkoszorút, felfogja a por egy részét. Nem távolítható el.", "b": [0.3255, 0.24, 0.3915, 0.5533]}, {"n": "Párhuzamütköző", "d": "Hasításhoz; a rövidített ütközőléc a fűrészlap elejénél végződik, hogy a levágott darab ne szoruljon az ütköző és a lap közé.", "b": [0.4434, 0.44, 0.4717, 0.7733]}, {"n": "Szögütköző / tolóasztal", "d": "Keresztvágáshoz, gérvágáshoz; a darabot a szánon rögzítjük, és a szánt toljuk.", "b": [0.0189, 0.08, 0.1132, 0.8]}, {"n": "Tolófa", "d": "Keskeny darabnál a kéz helyett a tolófa tolja a darabot a lap mellett.", "b": [0.3774, 0.72, 0.434, 0.8067]}, {"n": "Vészleállító", "d": "A kezelő felőli oldalon, kézzel jól elérhető.", "b": [0.5283, 0.8, 0.566, 0.8533]}, {"n": "Asztalbetét", "d": "A fűrészlap körüli cserélhető betét; a lap körül csak kis hézag lehet.", "b": [0.3349, 0.2867, 0.3821, 0.5667]}]}, {"label": "Veszélyzóna", "msg": "Veszélyzóna a lap előtt és mögött, a visszavágódás iránya: a kezelő felé.", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAArUAAAHqCAYAAAAakLb+AAAAQHRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjcrZGZzZzEsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcv tett ütközőléc a fűrészlap elejénél végződik, hogy a levágott darab ne szoruljon az ütköző és a lap közé.", "b": [0.4434, 0.44, 0.4717, 0.7733]}, {"n": "Szögütköző / tolóasztal", "d": "Keresztvágáshoz, gérvágáshoz; a darabot a szánon rögzítjük, és a szánt toljuk.", "b": [0.0189, 0.08, 0.1132, 0.8]}, {"n": "Tolófa", "d": "Keskeny darabnál a kéz helyett a tolófa tolja a darabot a lap mellett.", "b": [0.3774, 0.72, 0.434, 0.8067]}, {"n": "Vészleállító", "d": "A kezelő felőli oldalon, kézzel jól elérhető.", "b": [0.5283, 0.8, 0.566, 0.8533]}, {"n": "Asztalbetét", "d": "A fűrészlap körüli cserélhető betét; a lap körül csak kis hézag lehet.", "b": [0.3349, 0.2867, 0.3821, 0.5667]}, {"n": "Veszélyzóna", "d": "A fűrészlap előtti és mögötti sáv a lap síkjában: ide kéz nem kerülhet; a visszavágódó darab a kezelő felé, a lap síkjában repül.", "b": [0.3443, 0.52, 0.3726, 0.7867]}]}, {"label": "Kezelő helyzete", "msg": "A kezelő a lap síkjától oldalra áll; keskeny darabot tolófa tol.", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAArUAAAHqCAYAAAAakLb+AAAAQHRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjcrZGZzZzEsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvhF0PpwAAAAlwSFlzAAAOnAAADpwBB5RT3QAAx8xJREFUeJzs3Xd8jef/+PHXyRDZO5HItGLviGqRokiMmiWChtIarY+t1SKUUKpLrVoxgqCo2aq2MRpptLUTUiOJCCEJiZPIkvP7w8/9dSSxiSPv5+NxHo9z39e43/edkPe5znVft0qj0WgQQgghhBBCh+mVdgBCCCGEEEI8LUlqhRBCCCGEzpOkVgghhBBC6DxJaoUQQgghhM6TpFaIl0RsbCzBwcH89ddfpR2KEEIIoXMkqRXi/wsNDUWlUuHh4VHs/vj4eDw8PAgKCtIqDw4ORqVS4evr+8THvnXrFj179uSff/6hYcOGT9yPEEIIUVZJUiteGb6+vqhUqiIvKyurp+rX3t4eHx8fjIyMaNCgAZUrV342Ad9j9OjRODo6snHjRgwNDZ9p3x4eHqhUKkJDQ59pv0IIIcTLxKC0AxDiWTM3N6dmzZpa20+jQ4cOdOjQAYAtW7Y8VV8lWbhw4XPpVwghhCgrZKRWvHIaNmxIVFSU8vr1118B+Pfff/H398fS0hJjY2N8fX2Jjo5+YF93R3vvHeW8uy8iIuKh7ZYvX067du0wMTGhdu3aHDx4UKvehg0baNy4McbGxlhZWdGrVy8uXrxYpJ/7X3ePnZWVxejRo3Fzc6NcuXJUrlyZr776Sqt9QkICAAMGDCh2eoUQQgjxKpCRWlEmnDp1iubNm5OdnU3FihUxMjJi3759vPnmm/z999/UqFHjuRx3yJAhuLq6olKpOHXqFH369OHcuXMYGhqyYsUKBg4cCECNGjW4du0aGzZs4O+//+bYsWOYmZnh4+Oj9HXp0i let k=0,timer=null,sel=-1;
const im=document.getElementById("im"),hs=document.getElementById("hs"),st=document.getElementById("status"),
 views=document.getElementById("views"),parts=document.getElementById("parts");
if(MODE==="views"){document.getElementById("nav").style.display="none";}
F.forEach((f,i)=>{const b=document.createElement("button");b.textContent=f.label;b.onclick=()=>{stop();show(i);};views.appendChild(b);});
function info(i){const f=F[k];sel=i;hs.querySelectorAll("rect").forEach((r,j)=>r.classList.toggle("on",j===i));
 parts.querySelectorAll("button").forEach((b,j)=>b.classList.toggle("on",j===i));
 st.innerHTML=i<0?f.msg:"<b>"+f.hot[i].n+".</b> "+f.hot[i].d;}
function show(i){k=Math.max(0,Math.min(F.length-1,i));const f=F[k];im.src=f.img;
 document.getElementById("cnt").textContent=(k+1)+"/"+F.length;
 views.querySelectorAll("button").forEach((b,j)=>b.classList.toggle("on",j===k));
 hs.innerHTML="";parts.innerHTML="";
 f.hot.forEach((h,j)=>{const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.setAttribute("x",h.b[0]*1000);r.setAttribute("y",h.b[1]*1000);r.setAttribute("width",(h.b[2]-h.b[0])*1000);
  r.setAttribute("height",(h.b[3]-h.b[1])*1000);r.setAttribute("tabindex","0");r.setAttribute("aria-label",h.n);
  r.addEventListener("mouseenter",()=>info(j));r.addEventListener("mouseleave",()=>info(-1));
  r.addEventListener("click",()=>info(sel===j?-1:j));r.addEventListener("focus",()=>info(j));hs.appendChild(r);
  const b=document.createElement("button");b.textContent=h.n;b.onclick=()=>info(sel===j?-1:j);parts.appendChild(b);});
 info(-1);}
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById("play").textContent="▶ Lejátszás";}
document.getElementById("first").onclick=()=>{stop();show(0);};
document.getElementById("prev").onclick=()=>{stop();show(k-1);};
document.getElementById("next").onclick=()=>{stop();show(k+1);};
document.getElementById("play").onclick=()=>{if(timer){stop();return;}if(k>=F.length-1)show(0);
 document.getElementById("play").textContent="⏸ Szünet";timer=setInterval(()=>{if(k>=F.length-1)stop();else show(k+1);},2200);};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){stop();show(k+1);}if(e.key==="ArrowLeft"){stop();show(k-1);}});
show(0);
