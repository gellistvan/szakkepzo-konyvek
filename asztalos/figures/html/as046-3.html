const MSG=["Mutass egy kötőelemre a rajzon vagy a táblázatban."];let cur=0;
function groups(k){return document.querySelectorAll('.fig [id^="'+k+'-"]');}
function hl(k,on){groups(k).forEach(g=>g.classList.toggle("hl",on));
 document.querySelectorAll('tr[data-k="'+k+'"]').forEach(r=>{r.classList.toggle("hl",on);
  if(on)document.getElementById("status").innerHTML="<b>"+r.cells[0].textContent+" – "+r.cells[1].textContent+"</b>: "+r.dataset.x;});
 if(!on)document.getElementById("status").innerHTML=MSG[cur];}
document.querySelectorAll("tbody tr").forEach(r=>{const k=r.dataset.k;
 r.addEventListener("mouseenter",()=>hl(k,true));r.addEventListener("mouseleave",()=>hl(k,false));
 r.addEventListener("focusin",()=>hl(k,true));r.tabIndex=0;});
document.querySelectorAll('.fig g[id]').forEach(g=>{const m=g.id.match(/^(.+)-\d+$/);if(!m)return;
 if(!document.querySelector('tr[data-k="'+m[1]+'"]'))return;g.style.cursor="pointer";
 g.addEventListener("mouseenter",()=>hl(m[1],true));g.addEventListener("mouseleave",()=>hl(m[1],false));});
document.querySelectorAll("input[data-k]").forEach(c=>c.addEventListener("change",()=>{
 groups(c.dataset.k).forEach(g=>g.classList.toggle("off",!c.checked));}));
function setv(i){cur=i;document.querySelectorAll(".fig").forEach((f,j)=>f.style.display=j==i?"block":"none");
 document.querySelectorAll("button[data-v]").forEach((b,j)=>b.classList.toggle("on",j==i));
 document.getElementById("status").innerHTML=MSG[i];}
document.querySelectorAll("button[data-v]").forEach(b=>b.onclick=()=>setv(+b.dataset.v));
setv(0);
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
