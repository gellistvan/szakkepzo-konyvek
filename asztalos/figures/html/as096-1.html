<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hengeres ragasztófelhordó</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="s">Adagolórés s (mm)</label><input id="s" type="range" min="0.1" max="0.5" step="0.05" value="0.2" aria-label="Adagolórés s (mm)"><output id="s_o" for="s"></output></div>
<div class="row"><label for="t">Lapvastagság (mm)</label><input id="t" type="range" min="4" max="40" step="1" value="19" aria-label="Lapvastagság (mm)"><output id="t_o" for="t"></output></div>
<div class="row"><label for="c">Összenyomás (mm)</label><input id="c" type="range" min="0" max="1.5" step="0.1" value="0.5" aria-label="Összenyomás (mm)"><output id="c_o" for="c"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 100 100" role="img" aria-label="Kétoldalas hengeres ragasztófelhordó metszete: a lap két felhordóhenger között halad, a mennyiséget az adagolórés szabja meg"></svg>
<p class="small">Sematikus metszet. A felhordás becslése szemléltető modell, nem gyártói adat (ellenőrizendő: gépkönyv, ragasztó adatlapja, próbalap mérlegelése).</p>
