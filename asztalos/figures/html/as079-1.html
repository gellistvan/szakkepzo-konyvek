<div style="margin:8px 0;padding:6px;border:1px solid #888;border-radius:4px">
<b>Felszerelhető a lap?</b>
<label> Gép fordulatszáma <input id="ng" type="number" value="4500" style="width:6em"> min⁻¹</label>
<label> Előtolás <select id="mod"><option value="MAN">kézi</option><option value="MEC">gépi</option></select></label>
<div id="calc_out" style="margin-top:4px"></div></div>
<script>
function chk(){const n=+document.getElementById("ng").value, m=document.getElementById("mod").value, out=document.getElementById("calc_out");
 const okn = n<=6000, okm = (m==="MEC") || true; let t="";
 t += okn ? '<span style="color:var(--ok)">n_gép = '+n+' ≤ n_max = 6000 min⁻¹ – rendben.</span>' : '<span style="color:var(--bad)">n_gép = '+n+' > n_max = 6000 min⁻¹ – TILOS felszerelni!</span>';
 t += '<br>' + (m==="MAN" ? 'Kézi előtolású gép: a lap MAN jelölésű – rendben.' : 'Gépi előtolású gép: MAN és MEC jelölésű lap is használható (a gyártó előírása szerint).');
 out.innerHTML=t;}
document.getElementById("ng").addEventListener("input",chk);document.getElementById("mod").addEventListener("change",chk);chk();
</script><ul id="list"></ul>
<p class="small">Sematikus rajz; a jelölések a fejezet példája. A jelölési szabvány (MSZ EN 847) ellenőrizendő.</p>
<script>
const INFO = {"meret": ["D 300 × d 30 × z 48", "külső átmérő 300 mm, furat 30 mm (a géporsóra illik), 48 fog"], "nmax": ["n max 6000 min⁻¹", "megengedett legnagyobb fordulatszám: a gép fordulatszáma ennél nem lehet nagyobb"], "man": ["MAN", "kézi előtolású géphez való (korlátozó geometria); kézi előtolású gépen csak MAN"], "hmjel": ["HM", "keményfém (HM) fogak – a lapkák élezése szakszervizben"], "nyil": ["Forgásirány-nyíl", "egyezzen a gépen jelölt forgásiránnyal"], "hm": ["Keményfém lapka", "a fogcsúcsra forrasztott vágóél; kitört lapkával a lap nem használható"], "res": ["Tágulási / zajcsökkentő rés", "a hőtágulást és a zajt csökkenti; a résből induló repedés selejtokot jelent"], "karima": ["A szorítókarima felfekvése", "tiszta, sérülésmentes legyen – a szennyeződés ütést okoz"], "furat": ["Furat (d = 30 mm)", "pontosan illeszkedjen az orsóra; szűkítőgyűrű csak a gyártó szerint"], "fog": ["Fogak (z = 48)", "a fogszám a vágás minőségét és az előtolást befolyásolja"]};           // {azonosító: [név, magyarázat]}
const MODE = "hover";         // "hover" (rámutatás) vagy "find" (keresd a hibát)
const st = document.getElementById("status"), list = document.getElementById("list");
const found = new Set();
const total = Object.keys(INFO).length;
function groups(){ return document.querySelectorAll('#pic g[id^="hl_"]'); }
function key(g){ return g.id.replace(/^hl_/,"").replace(/_\d+$/,""); }
function mark(k, on){ groups().forEach(g => { if (key(g) === k) g.classList.toggle("on", on); }); }
groups().forEach(g => {
  const k = key(g); if (!INFO[k]) return;
  g.setAttribute("tabindex","0");
  g.addEventListener("mouseenter", () => { if (MODE === "hover") { mark(k, true); st.innerHTML = "<b>" + INFO[k][0] + "</b> – " + INFO[k][1]; } });
  g.addEventListener("mouseleave", () => { if (MODE === "hover") mark(k, false); });
  const pick = () => {
    if (MODE === "find") {
      if (!found.has(k)) { found.add(k); groups().forEach(x => { if (key(x) === k) x.classList.add("found"); });
        const li = document.createElement("li"); li.innerHTML = "<b>" + INFO[k][0] + "</b> – " + INFO[k][1]; list.appendChild(li); }
      st.innerHTML = "Megtalált hibák: <b>" + found.size + " / " + total + "</b>" + (found.size === total ? " – mind megvan!" : "");
    } else { st.innerHTML = "<b>" + INFO[k][0] + "</b> – " + INFO[k][1]; }
  };
  g.addEventListener("click", pick);
  g.addEventListener("keydown", e => { if (e.key === "Enter") pick(); });
});
function showAll(){ if (MODE === "find") { Object.keys(INFO).forEach(k => { if (!found.has(k)) { found.add(k);
  groups().forEach(x => { if (key(x) === k) x.classList.add("found"); });
  const li = document.createElement("li"); li.innerHTML = "<b>" + INFO[k][0] + "</b> – " + INFO[k][1]; list.appendChild(li); } });
  st.innerHTML = "Megtalált hibák: <b>" + found.size + " / " + total + "</b>"; } }
function reset(){ found.clear(); list.innerHTML = ""; groups().forEach(x => x.classList.remove("found","on")); st.innerHTML = "Vidd az egeret (vagy koppints) egy részre: a neve és a feladata itt jelenik meg."; }
</script>
