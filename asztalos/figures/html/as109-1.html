<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szórási átfedés</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="ov">átfedés</label><input id="ov" type="range" min="0" max="75" step="5" value="50" aria-label="átfedés"><output id="ov_o" for="ov"></output></div>
<div class="row"><label for="d">szórási távolság</label><input id="d" type="range" min="100" max="300" step="10" value="200" aria-label="szórási távolság"><output id="d_o" for="d"></output></div>
<div class="row"><label for="path">pisztolyvezetés</label><select id="path" aria-label="pisztolyvezetés"><option value="1" selected>egyenes, merőleges</option><option value="2">ívelt (csuklóból)</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 250" role="img" aria-label="Rétegvastagság-profil az átfedés és a távolság függvényében"></svg>
<p class="small">Szemléltető modell: egy menet keresztmetszeti eloszlása háromszög (közepén vastagabb), a legyező szélessége a távolsággal nő. 50 % átfedésnél az összeg egyenletes. A fejezet tájékoztató értékei: 150–250 mm, 50 % átfedés (ellenőrizendő: a pisztoly gyártójának ajánlása).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"ov":"%", "d":"mm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const ov=v.ov/100, d=v.d, W=560;
// legyezőszélesség ~ távolság, csúcs ~ 1/távolság (szemléltető)
const w=1.6*d/200, peak=200/d, n=6, step=w*(1-ov);
const X0=40, sx=70, base=230, sy=60;
const xs=[]; for(let i=0;i<=400;i++) xs.push(-0.8+i*(step*(n-1)+1.6*w)/400);
const tri=(x,c)=>Math.max(0,1-Math.abs(x-c)/(w/2))*peak;
const tot=xs.map(x=>{let s=0;for(let k=0;k<n;k++)s+=tri(x,k*step);return s;});
const px=x=>X0+(x+0.8)*sx*Math.min(1,6.2/(step*(n-1)+1.6*w));
for(let k=0;k<n;k++){let p="";xs.forEach((x,i)=>{p+=(i?"L":"M")+px(x)+" "+(base-tri(x,k*step)*sy);});
  el("path",{d:p,fill:"none",stroke:css("--muted"),"stroke-dasharray":"4 3"});
  el("rect",{x:px(k*step-w/2),y:40+(k%2)*14,width:px(k*step+w/2)-px(k*step-w/2),height:12,fill:k%2?"#ddd":"#999",stroke:"#000"});}
let p="";xs.forEach((x,i)=>{p+=(i?"L":"M")+px(x)+" "+(base-tot[i]*sy);});
el("path",{d:p,fill:"none",stroke:css("--hl"),"stroke-width":3});
el("line",{x1:X0,y1:base,x2:W-20,y2:base,stroke:css("--line")});
el("text",{x:X0,y:30,"font-size":12},"sávok (felülnézet) és rétegvastagság-profil (keresztmetszet)");
// egyenetlenség a középső szakaszon
const lo=step*(n-1)*0.3, hi=step*(n-1)*0.7; let mn=1e9,mx=0,sm=0,c=0;
xs.forEach((x,i)=>{if(x>=lo&&x<=hi){mn=Math.min(mn,tot[i]);mx=Math.max(mx,tot[i]);sm+=tot[i];c++;}});
let u=c?(mx-mn)/(sm/c)*100:0;
let msg="Egyenetlenség a középső szakaszon: <b>"+fmt(u,0)+" %</b>. ";
if(v.path==2){u+=35; msg="Ívelt mozgás: a menet közepén a pisztoly közelebb van → ott vastagabb, a szélén vékonyabb a réteg (folyás- és narancsbőrveszély). ";}
if(d<150) msg+="<span class='bad'>Túl közel (150 mm alatt): csepegés, folyás.</span> ";
else if(d>250) msg+="<span class='bad'>Túl messze (250 mm fölött): porszáraz permet, rossz terülés.</span> ";
msg+= (u<5 && v.path==1)? "<span class='ok'>Egyenletes réteg.</span>" : "<span class='bad'>Egyenetlen réteg – állíts az átfedésen / a vezetésen.</span>";
status(msg);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
