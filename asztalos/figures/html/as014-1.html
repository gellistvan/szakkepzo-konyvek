<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olajos rongy: nyitott kupac vagy zárt tartály</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.pic{position:relative;background:#fff;border:1px solid #999;max-width:100%}
.pic img{display:block;width:100%;height:auto}
.hs{position:absolute;border:2px solid transparent;border-radius:4px;cursor:pointer;background:rgba(0,0,0,0)}
.hs:hover,.hs:focus,.hs.on{border-color:#c55a11;background:rgba(197,90,17,.12);outline:none}
.hs.good{border-color:#2e7d32;background:rgba(46,125,50,.15)}
.hs.wrong{border-color:#b71c1c;background:rgba(183,28,28,.12)}
#status{margin:8px 0;min-height:3.2em}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
button{font:inherit;padding:3px 10px;cursor:pointer}
button.on{font-weight:bold;outline:2px solid var(--hl)}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="btns" id="b"></div><div id="status" aria-live="polite"></div><div class="pic"><img id="im" alt="Olajos rongy kupacban felmelegszik, zárt fém tartályban vízzel átitatva nem"></div>
