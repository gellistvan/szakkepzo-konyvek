<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az átlátszó plexi doboz</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="t">Falak nyitása</label><input id="t" type="range" min="0" max="90" step="1" value="0" aria-label="Falak nyitása"><output id="t_o" for="t"></output></div>
<div class="row"><label for="yaw">Forgatás</label><input id="yaw" type="range" min="-60" max="60" step="1" value="-28" aria-label="Forgatás"><output id="yaw_o" for="yaw"></output></div>
<div class="row"><label for="pitch">Rálátás felülről</label><input id="pitch" type="range" min="0" max="70" step="1" value="22" aria-label="Rálátás felülről"><output id="pitch_o" for="pitch"></output></div>
<div class="row"><label for="obj">A test látszik</label><input id="obj" type="checkbox" checked aria-label="A test látszik"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 360" role="img" aria-label="Fiókoldal átlátszó dobozban, vetületei a doboz falain, majd a kinyitott doboz síkban az elöl-, felül- és oldalnézettel."></svg>
<p class="small">Fiókoldal 400 × 180 × 18, horony 6 × 8 az alsó éltől 10 mm-re (a javított kidolgozott példa adatai). Nyisd ki a falakat 90°-ig, majd állítsd a forgatást és a rálátást 0°-ra: így kapod a rajzlapot.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"t":"°", "yaw":"°", "pitch":"°"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const SEG=[{"w": 1, "p": [[0.0, 200.0, 0.0], [560.0, 200.0, 0.0], [560.0, 200.0, 250.0], [0.0, 200.0, 250.0], [0.0, 200.0, 0.0]], "st": "wall", "f": "wall"}, {"w": 2, "p": [[0.0, 0.0, 0.0], [560.0, 0.0, 0.0], [560.0, 200.0, 0.0], [0.0, 200.0, 0.0], [0.0, 0.0, 0.0]], "st": "wall", "f": "wall"}, {"w": 3, "p": [[560.0, 0.0, 0.0], [560.0, 200.0, 0.0], [560.0, 200.0, 250.0], [560.0, 0.0, 250.0], [560.0, 0.0, 0.0]], "st": "wall", "f": "wall"}, {"w": 1, "p": [[80.0, 200.0, 0.0], [480.0, 200.0, 0.0], [480.0, 200.0, 180.0], [80.0, 200.0, 180.0], [80.0, 200.0, 0.0]], "st": "thick", "f": null}, {"w": 1, "p": [[80.0, 200.0, 10.0], [480.0, 200.0, 10.0]], "st": "thick", "f": null}, {"w": 1, "p": [[80.0, 200.0, 16.0], [480.0, 200.0, 16.0]], "st": "thick", "f": null}, {"w": 2, "p": [[80.0, 90.0, 0.0], [480.0, 90.0, 0.0], [480.0, 108.0, 0.0], [80.0, 108.0, 0.0], [80.0, 90.0, 0.0]], "st": "thick", "f": null}, {"w": 2, "p": [[80.0, 98.0, 0.0], [480.0, 98.0, 0.0]], "st": "hid", "f": null}, {"w": 3, "p": [[560.0, 108.0, 0.0], [560.0, 108.0, 180.0], [560.0, 90.0, 180.0], [560.0, 90.0, 16.0], [560.0, 98.0, 16.0], [560.0, 98.0, 10.0], [560.0, 90.0, 10.0], [560.0, 90.0, 0.0], [560.0, 108.0, 0.0]], "st": "thick", "f": null}, {"w": 0, "p": [[80.0, 90.0, 0.0], [80.0, 90.0, 180.0]], "st": "obj", "f": null}, {"w": 0, "p": [[80.0, 90.0, 0.0], [80.0, 108.0, 0.0]], "st": "obj", "f": null}, {"w": 0, "p": [[80.0, 90.0, 0.0], [480.0, 90.0, 0.0]], "st": "obj", "f": null}, {"w": 0, "p": [[80.0, 90.0, 180.0], [80.0, 108.0, 180.0]], "st": "obj", "f": null}, {"w": 0, "p": [[80.0, 90.0, 180.0], [480.0, 90.0, 180.0]], "st": "obj", "f": null}, {"w": 0, "p": [[80.0, 108.0, 0.0], [80.0, 108.0, 180.0]], "st": "obj", "f": null}, {"w": 0, "p": [[80.0, 108.0, 0.0], [480.0, 108.0, 0.0]], "st": "obj", "f": null}, {"w": 0, "p": [[80.0, 108.0, 180.0], [480.0, 108.0, 180.0]], "st": "obj", "f": null}, {"w": 0, "p": [[480.0, 90.0, 0.0], [480.0, 90.0, 180.0]], "st": "obj", "f": null}, {"w": 0, "p": [[480.0, 90.0, 0.0], [480.0, 108.0, 0.0]], "st": "obj", "f": null}, {"w": 0, "p": [[480.0, 90.0, 180.0], [480.0, 108.0, 180.0]], "st": "obj", "f": null}, {"w": 0, "p": [[480.0, 108.0, 0.0], [480.0, 108.0, 180.0]], "st": "obj", "f": null}, {"w": 0, "p": [[80.0, 90.0, 10.0], [480.0, 90.0, 10.0]], "st": "obj", "f": null}, {"w": 0, "p": [[80.0, 90.0, 16.0], [480.0, 90.0, 16.0]], "st": "obj", "f": null}, {"w": 0, "p": [[80.0, 108.0, 180.0], [80.0, 200.0, 180.0]], "st": "ray", "f": null}, {"w": 0, "p": [[480.0, 108.0, 180.0], [480.0, 200.0, 180.0]], "st": "ray", "f": null}, {"w": 0, "p": [[80.0, 90.0, 180.0], [80.0, 90.0, 0.0]], "st": "ray", "f": null}, {"w": 0, "p": [[480.0, 90.0, 180.0], [480.0, 90.0, 0.0]], "st": "ray", "f": null}, {"w": 0, "p": [[480.0, 90.0, 180.0], [560.0, 90.0, 180.0]], "st": "ray", "f": null}, {"w": 0, "p": [[480.0, 108.0, 0.0], [560.0, 108.0, 0.0]], "st": "ray", "f": null}], W=560, D=200;
const t=v.t*Math.PI/180, yaw=v.yaw*Math.PI/180, pitch=v.pitch*Math.PI/180;
function unf(w,p){const [x,y,z]=p; if(w==2)return [x, D-(D-y)*Math.cos(t), -(D-y)*Math.sin(t)];
  if(w==3)return [W+(D-y)*Math.sin(t), D-(D-y)*Math.cos(t), z]; return p;}
function pr(p){const [x,y,z]=p, cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  return [x*cy+y*sy, z*cp+(y*cy-x*sy)*sp];}
const Q=SEG.map(s=>({s:s, q:s.p.map(p=>pr(unf(s.w,p)))}));
let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9; Q.forEach(o=>o.q.forEach(([a,b])=>{mnx=Math.min(mnx,a);mxx=Math.max(mxx,a);mny=Math.min(mny,b);mxy=Math.max(mxy,b);}));
const sc=Math.min(520/(mxx-mnx), 330/(mxy-mny)), X=a=>20+(a-mnx)*sc, Y=b=>15+(mxy-b)*sc;
const ST={wall:["#999",0.8,""],thick:[css("--line"),2.4,""],hid:[css("--line"),1.3,"6 3"],obj:[css("--hl"),1.6,""],ray:[css("--muted"),0.8,"2 3"]};
Q.forEach(o=>{if(o.s.w==0&&!v.obj)return; if(o.s.st=="ray"&&v.t>5)return;
  const pts=o.q.map(([a,b])=>X(a)+","+Y(b)).join(" "), st=ST[o.s.st];
  if(o.s.f=="wall")el("polygon",{points:pts,fill:"#bdbdbd","fill-opacity":0.25,stroke:"#999","stroke-width":0.8});
  else el("polyline",{points:pts,fill:"none",stroke:st[0],"stroke-width":st[1],"stroke-dasharray":st[2]});});
status(v.t<5?"A test vetületei a doboz három falán: elölnézet a hátsó falon, felülnézet az aljon, bal oldalnézet a jobb oldalfalon.":
 (v.t<88?"A falak nyílnak: az alj lefelé, a jobb oldalfal jobbra fordul a hátsó fal élei körül.":
 "Kiterítve: <b>E (európai) nézetrend</b> – a felülnézet az elölnézet <b>alatt</b>, a bal oldalnézet az elölnézettől <b>jobbra</b> van. A horony: elöl két látható vonal, felülről takart (szaggatott), oldalról a kontúr bemélyedése."));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
