let k=0,timer=null,sel=-1;
const im=document.getElementById("im"),hs=document.getElementById("hs"),st=document.getElementById("status"),
 views=document.getElementById("views"),parts=document.getElementById("parts");
if(MODE==="views"){document.getElementById("nav").style.display="none";}
F.forEach((f,i)=>{const b=document.createElement("button");b.textContent=f.label;b.onclick=()=>{stop();show(i);};views.appendChild(b);});
function info(i){const f=F[k];sel=i;hs.querySelectorAll("rect").forEach((r,j)=>r.classList.toggle("on",j===i));
 parts.querySelectorAll("button").forEach((b,j)=>b.classList.toggle("on",j===i));
 st.innerHTML=i<0?f.msg:"<b>"+f.hot[i].n+".</b> "+f.hot[i].d;}
function show(i){k=Math.max(0,Math.min(F.length-1,i));const f=F[k];im.src=f.img;
 document.getElementById("cnt").textContent=(k+1)+"/"+F.length;
 views.querySelectorAll("button").forEach((b,j)=>b.classList.toggle("on",j===k));
 hs.innerHTML="";parts.innerHTML="";
 f.hot.forEach((h,j)=>{const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.setAttribute("x",h.b[0]*1000);r.setAttribute("y",h.b[1]*1000);r.setAttribute("width",(h.b[2]-h.b[0])*1000);
  r.setAttribute("height",(h.b[3]-h.b[1])*1000);r.setAttribute("tabindex","0");r.setAttribute("aria-label",h.n);
  r.addEventListener("mouseenter",()=>info(j));r.addEventListener("mouseleave",()=>info(-1));
  r.addEventListener("click",()=>info(sel===j?-1:j));r.addEventListener("focus",()=>info(j));hs.appendChild(r);
  const b=document.createElement("button");b.textContent=h.n;b.onclick=()=>info(sel===j?-1:j);parts.appendChild(b);});
 info(-1);}
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById("play").textContent="▶ Lejátszás";}
document.getElementById("first").onclick=()=>{stop();show(0);};
document.getElementById("prev").onclick=()=>{stop();show(k-1);};
document.getElementById("next").onclick=()=>{stop();show(k+1);};
document.getElementById("play").onclick=()=>{if(timer){stop();return;}if(k>=F.length-1)show(0);
 document.getElementById("play").textContent="⏸ Szünet";timer=setInterval(()=>{if(k>=F.length-1)stop();else show(k+1);},2200);};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){stop();show(k+1);}if(e.key==="ArrowLeft"){stop();show(k-1);}});
show(0);
