<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kovászérés – térfogat és pH</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="T">kovászhőmérséklet</label><input id="T" type="range" min="22" max="30" step="0.5" value="26" aria-label="kovászhőmérséklet"><output id="T_o" for="T"></output></div>
<div class="row"><label for="t">érési idő</label><input id="t" type="range" min="0" max="24" step="0.5" value="9" aria-label="érési idő"><output id="t_o" for="t"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 270" role="img" aria-label="A kovász térfogata kb. 10 óráig a duplájára nő, majd csökken; a pH 6-ról 4 körülire esik; az érett ablak 7 és 11 óra között."></svg>
<p class="small">Szemléltető modell, nem mért adat; az időtengely a hőmérséklettől, a kovásznagyságtól és a TA-tól függ. A Q10 ≈ 2 hőmérsékleti szabály durva tanulási közelítés (ellenőrizendő); a döntést a kovász vizsgálata (térfogat, illat, pH, savfok) hozza.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"T":"°C", "t":"óra"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const f=Math.pow(2,(26-v.T)/10);
const V=t=>{const u=t/f;let x=1+1.05/(1+Math.exp(-(u-6)/1.3));if(u>11)x-=0.1*(u-11);return x;};
const P=t=>4.1+1.9*Math.exp(-(t/f)/4.5);
const tmax=24, X=t=>50+t*20, YV=y=>230-(y-0.8)*120, YP=p=>230-(p-3.6)*68.6;
const a=7*f, b=11*f;
el("rect",{x:X(a),y:20,width:X(Math.min(b,tmax))-X(a),height:210,fill:css("--ok"),opacity:0.22});
el("rect",{x:X(Math.min(b,tmax)),y:20,width:X(tmax)-X(Math.min(b,tmax)),height:210,fill:css("--bad"),opacity:0.12});
el("line",{x1:X(0),y1:230,x2:X(tmax),y2:230,stroke:css("--line")});
for(let t=0;t<=tmax;t+=4)el("text",{x:X(t),y:246,"text-anchor":"middle","font-size":11},String(t));
el("text",{x:X(12),y:262,"text-anchor":"middle","font-size":12},"érési idő (óra)");
let dv="",dp="";for(let t=0;t<=tmax;t+=0.2){dv+=(t?"L":"M")+X(t)+" "+YV(V(t));dp+=(t?"L":"M")+X(t)+" "+YP(P(t));}
el("path",{d:dv,fill:"none",stroke:css("--line"),"stroke-width":2.5});
el("path",{d:dp,fill:"none",stroke:css("--hl"),"stroke-width":2.2,"stroke-dasharray":"7 4"});
el("text",{x:X(0.3),y:YV(2.25),"font-size":12},"térfogat (folytonos)");el("text",{x:X(0.3),y:YP(5.6),"font-size":12,fill:css("--hl")},"pH (szaggatott)");
el("circle",{cx:X(v.t),cy:YV(V(v.t)),r:5,fill:css("--hl2")});
const st=v.t<a?"fiatal":(v.t<=b?"érett":"túlérett");
status("Kovász "+fmt(v.T,0)+" °C-on: az érett ablak kb. <b>"+fmt(a,1)+"–"+fmt(b,1)+" óra</b> között (26 °C-on 7–11 óra). "+
 fmt(v.t,1)+" óránál: térfogat ≈ "+fmt(V(v.t),2)+"×, pH ≈ "+fmt(P(v.t),2)+" → <b>"+st+"</b>.");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
