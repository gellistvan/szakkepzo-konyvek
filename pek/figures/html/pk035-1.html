<ul class="items"><li tabindex="0" data-k="hej">1 gyümölcshéj</li><li tabindex="0" data-k="maghej">2 maghéj</li><li tabindex="0" data-k="aleuron">3 aleuronréteg</li><li tabindex="0" data-k="endo">4 endospermium (liszttest)</li><li tabindex="0" data-k="pajzs">5 pajzsocska</li><li tabindex="0" data-k="csira">6 csíra</li><li tabindex="0" data-k="kefe">7 kefe</li><li tabindex="0" data-k="barazda">8 barázda</li></ul>
<p class="small">Sematikus vonalrajz, nem méretarányos; a részarányok és az őrlési váltó szemléltető (fajta-, évjárat- és malomfüggő; ellenőrizendő).</p>
<script>

const MSG=["A búzaszem részei. Mutass egy névre: a rajzon kiemelődik, alatta az összetétel.", "BL 55 (fehér liszt): szinte csak a liszttest kerül bele; a héjat, az aleuronréteget és a csírát a malom leválasztja.", "BL 80 (félfehér, kenyérliszt): a liszttest mellett az aleuronréteg és a héjrészek egy része is bekerül – sötétebb, nagyobb a hamutartalma.", "Teljes kiőrlésű búzaliszt: a szem minden része (héj, aleuron, liszttest, csíra) bekerül – több rost és ásványi anyag, rövidebb eltarthatóság a csíra zsírja miatt."];let CUR=0;
function show(i){CUR=i;document.querySelectorAll(".bar button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.i===i));
  document.querySelectorAll("div.fig").forEach(d=>d.hidden=(+d.dataset.i!==i));
  document.getElementById("status").innerHTML=MSG[i];}
document.querySelectorAll(".bar button").forEach(b=>b.addEventListener("click",()=>show(+b.dataset.i)));

const ITEMS=[{"k": "hej", "n": "1", "name": "gyümölcshéj", "d": "a legkülső, rostban dús védőréteg; a malomban durva korpa lesz belőle."}, {"k": "maghej", "n": "2", "name": "maghéj", "d": "a gyümölcshéj alatti vékony réteg; a korpával együtt válik le."}, {"k": "aleuron", "n": "3", "name": "aleuronréteg", "d": "egy sejtsornyi réteg: fehérje, ásványi anyagok (Mg, P), B-vitaminok, rost; a hamu fő forrása, az őrlésnél többnyire a korpával válik le."}, {"k": "endo", "n": "4", "name": "endospermium (liszttest)", "d": "a legnagyobb tömegű rész: keményítő, tartalék- és sikérfehérje (gliadin, glutenin) – a fehér liszt alapja."}, {"k": "pajzs", "n": "5", "name": "pajzsocska", "d": "a csírát a liszttesttől elválasztó réteg; a csírával együtt távolítják el."}, {"k": "csira", "n": "6", "name": "csíra", "d": "a szem alján, a liszttest mellett ül (nem a közepén!): zsír, fehérje, E-vitamin, enzimek; kb. 2–3 %. Zsírja miatt a fehér lisztből elválasztják."}, {"k": "kefe", "n": "7", "name": "kefe", "d": "a szem csúcsán lévő szőröcskék; a tisztításnál (súrolás) távolítják el a port."}, {"k": "barazda", "n": "8", "name": "barázda", "d": "a szem hasi oldalán végigfutó mély bemélyedés; benne héj és szennyeződés marad, ezért a héj nem hántolható le egyszerűen – a malom hengerekkel tárja fel a szemet."}];
const st=document.getElementById("status");
function groups(k){return document.querySelectorAll('.fig:not([hidden]) [id^="'+k+'__"]');}
function sel(k){document.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl"));
  document.querySelectorAll("ul.items li").forEach(li=>li.classList.toggle("on",li.dataset.k===k));
  const it=ITEMS.find(i=>i.k===k);
  if(!it){st.textContent=DEFAULT;return;}
  groups(k).forEach(g=>g.classList.add("hl"));
  st.innerHTML="<b>"+it.n+" "+it.name+"</b> – "+it.d;}
const DEFAULT=MSG[CUR];
document.querySelectorAll("ul.items li").forEach(li=>{
  li.addEventListener("mouseenter",()=>sel(li.dataset.k));li.addEventListener("focus",()=>sel(li.dataset.k));
  li.addEventListener("click",()=>sel(li.dataset.k));});
ITEMS.forEach(it=>groups(it.k).forEach(g=>{g.style.cursor="pointer";
  g.addEventListener("mouseenter",()=>sel(it.k));g.addEventListener("click",()=>sel(it.k));}));
st.textContent=DEFAULT;
show(0);

</script>
