<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silós lisztellátás vázlata</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>
#v .on path,#v .on use,#v .on line,#v .on polyline{stroke:#c55a11 !important}
#v .on text{fill:#c55a11 !important;font-weight:bold}
#v .dim{opacity:.22}
.parts{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.parts button{font-size:12.5px;padding:2px 7px}
</style><div class="parts" role="group" aria-label="Alkatrészek kiemelése"><button type="button" onmouseenter="peek('fill')" onfocus="peek('fill')" onmouseleave="unpeek()" onblur="unpeek()">1 töltőcsonk</button><button type="button" onmouseenter="peek('sfilter')" onfocus="peek('sfilter')" onmouseleave="unpeek()" onblur="unpeek()">2 silószűrő</button><button type="button" onmouseenter="peek('level')" onfocus="peek('level')" onmouseleave="unpeek()" onblur="unpeek()">3 szintjelző</button><button type="button" onmouseenter="peek('pad')" onfocus="peek('pad')" onmouseleave="unpeek()" onblur="unpeek()">4 fluidizáló párna</button><button type="button" onmouseenter="peek('gate')" onfocus="peek('gate')" onmouseleave="unpeek()" onblur="unpeek()">5 ürítőtoló</button><button type="button" onmouseenter="peek('feeder')" onfocus="peek('feeder')" onmouseleave="unpeek()" onblur="unpeek()">6 cellás adagoló</button><button type="button" onmouseenter="peek('blower')" onfocus="peek('blower')" onmouseleave="unpeek()" onblur="unpeek()">7 levegő</button><button type="button" onmouseenter="peek('pipe')" onfocus="peek('pipe')" onmouseleave="unpeek()" onblur="unpeek()">8 cső</button><button type="button" onmouseenter="peek('sight')" onfocus="peek('sight')" onmouseleave="unpeek()" onblur="unpeek()">9 látónyílás</button><button type="button" onmouseenter="peek('cyclone')" onfocus="peek('cyclone')" onmouseleave="unpeek()" onblur="unpeek()">10 ciklon</button><button type="button" onmouseenter="peek('bag')" onfocus="peek('bag')" onmouseleave="unpeek()" onblur="unpeek()">11 zsákszűrő</button><button type="button" onmouseenter="peek('gauge')" onfocus="peek('gauge')" onmouseleave="unpeek()" onblur="unpeek()">12 nyomásmérő</button><button type="button" onmouseenter="peek('vent')" onfocus="peek('vent')" onmouseleave="unpeek()" onblur="unpeek()">13 robbanáslap</button><button type="button" onmouseenter="peek('daybin')" onfocus="peek('daybin')" onmouseleave="unpeek()" onblur="unpeek()">14 napi tartály</button><button type="button" onmouseenter="peek('sieve')" onfocus="peek('sieve')" onmouseleave="unpeek()" onblur="unpeek()">15 szita</button><button type="button" onmouseenter="peek('magnet')" onfocus="peek('magnet')" onmouseleave="unpeek()" onblur="unpeek()">16 mágnes</button><button type="button" onmouseenter="peek('scale')" onfocus="peek('scale')" onmouseleave="unpeek()" onblur="unpeek()">17 mérleg</button><button type="button" onmouseenter="peek('kneader')" onfocus="peek('kneader')" onmouseleave="unpeek()" onblur="unpeek()">18 dagasztó</button><button type="button" onmouseenter="peek('hazard')" onfocus="peek('hazard')" onmouseleave="unpeek()" onblur="unpeek()">⚠ veszélyes pontok</button></div></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A silótól a dagasztóig vezető lisztút: siló, fluidizáló párna, cellás adagoló, földelt szállítócső, ciklon és zsákszűrő a napi tartályon, szita, mágnes, mérleg, dagasztógép."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető vázlat, üzemenként eltér; a nyomás- és sebességértékek a gyártói adatlap szerint ellenőrizendők. Az alkatrészgombokra mutatva az elem kiemelődik.</p>

// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "<b>1. Betárolás.</b> A tartálykocsi a lisztet a töltőcsonkon (1) át a silóba nyomja; a silószűrő (2) engedi ki a levegőt. <i>Ellenőrzés:</i> szintjelző (3) – van-e elég liszt, nincs-e betárolás folyamatban.", "on": ["fill", "sfilter", "level", "silo"], "dim": true}, {"msg": "<b>2. Fluidizálás.</b> A fúvó száraz levegőt vezet a fluidizáló párnába (4), a liszt „folyóssá” válik; az ürítőtoló (5) nyitja a kifolyást. <i>Ellenőrzés:</i> a fluidizáló levegő száraz legyen (csomósodás!).", "on": ["pad", "gate", "blower"], "dim": true}, {"msg": "<b>3. Szállítás.</b> A cellás adagoló (6) a lisztet az injektorba adagolja, a kompresszor levegője (7) a földelt fémcsőben (8) viszi. <i>Ellenőrzés:</i> látónyílás (9) – áramlik-e a liszt; földelés ép.", "on": ["feeder", "blower", "pipe", "sight"], "dim": true}, {"msg": "<b>4. Leválasztás.</b> A ciklonban (10) a liszt kihullik, a maradék port a zsákszűrő (11) fogja fel; a robbanáslap (13) túlnyomásnál nyit. <i>Ellenőrzés:</i> nyomásmérő (12) – hirtelen emelkedés = eltömődés, azonnal leállítani.", "on": ["cyclone", "bag", "gauge", "vent", "daybin", "hazard"], "dim": true}, {"msg": "<b>5. Tisztítás.</b> A napi tartályból (14) a liszt a szitán (15), majd a mágneses fémleválasztón (16) halad át. <i>Ellenőrzés:</i> szita ép, mágnes tiszta; a fennakadt anyagot fel kell jegyezni.", "on": ["daybin", "sieve", "magnet"], "dim": true}, {"msg": "<b>6. Mérés.</b> A mérleg (17) a receptúra szerinti lisztet méri ki a dagasztógépbe (18). <i>Ellenőrzés:</i> mért tömeg = technológiai lap; a szállított mennyiség és a rendellenességek naplózása.", "on": ["scale", "kneader"], "dim": true}];

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let _ready = false;
function hl(keys, dim){
  const cur = STEPS[k] || {}, hide = cur.hide || [];
  svg.querySelectorAll('[id*="__"]').forEach(e => {
    const key = e.id.split("__")[0];
    const on = keys.includes(key);
    e.classList.toggle("on", on);
    e.classList.toggle("dim", !!dim && !on && !(cur.keep || []).includes(key));
    e.style.display = hide.includes(key) ? "none" : "";
  });
}
function render(s){
  if (!_ready){

function unpeek(){ show(k); }

let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";

function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;

  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
