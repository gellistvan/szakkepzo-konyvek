<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keverési kereszt – kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="pre">előbeállítás</label><select id="pre" aria-label="előbeállítás"><option value="0">kézi</option><option value="1" selected>só: 0 / 20 → 8 % (2,5 kg)</option><option value="2">liszt: BL 55 / BL 80 → 0,70 % hamu (100 kg)</option><option value="3">Önellenőrzés 2: 0 / 25 → 10 % (25 kg)</option></select></div>
<div class="row"><label for="c1">c₁</label><input id="c1" type="range" min="0" max="30" step="0.01" value="0" aria-label="c₁"><output id="c1_o" for="c1"></output></div>
<div class="row"><label for="c2">c₂</label><input id="c2" type="range" min="0" max="30" step="0.01" value="20" aria-label="c₂"><output id="c2_o" for="c2"></output></div>
<div class="row"><label for="c">c (cél)</label><input id="c" type="range" min="0" max="30" step="0.01" value="8" aria-label="c (cél)"><output id="c_o" for="c"></output></div>
<div class="row"><label for="M">össztömeg</label><input id="M" type="range" min="0.5" max="200" step="0.5" value="2.5" aria-label="össztömeg"><output id="M_o" for="M"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 225" role="img" aria-label="Keverési kereszt: 0%-os víz és 20%-os sóoldat keverése 8%-os oldattá; a víz 12, az oldat 8 tömegrész."></svg>
<p class="small">Tanulási példa; csak additív jellemzőre (tömeg%, hamutartalom, sótartalom) érvényes. A lisztek hamutartalma a gyártói adatlap szerint (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"c1":"%", "c2":"%", "c":"%", "M":"kg"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const P={1:[0,20,8,2.5],2:[0.55,0.80,0.70,100],3:[0,25,10,25]};
if(v.pre && v.pre!==window._lp){const p=P[v.pre];["c1","c2","c","M"].forEach((id,i)=>{document.getElementById(id).value=p[i];});
  window._lp=v.pre;draw();return;}
window._lp=v.pre;
const lo=Math.min(v.c1,v.c2), hi=Math.max(v.c1,v.c2);
const B=(x,y,t,s,g)=>{el("rect",{x:x-45,y:y-18,width:90,height:36,rx:6,fill:g?css("--grid"):"none",stroke:css("--line")});
  el("text",{x:x,y:y+5,"text-anchor":"middle","font-size":15,"font-weight":"bold"},t);el("text",{x:x,y:y+32,"text-anchor":"middle","font-size":11},s);};
const d1=Math.abs(v.c2-v.c), d2=Math.abs(v.c-v.c1), dg=v.c1<1?3:2;
B(70,40,fmt(v.c1,dg)+" %","c₁");B(70,170,fmt(v.c2,dg)+" %","c₂");B(230,105,fmt(v.c,dg)+" %","c (cél)",true);
B(390,40,fmt(d1,dg),"|c₂ − c| → m₁");B(390,170,fmt(d2,dg),"|c − c₁| → m₂");
el("line",{x1:115,y1:160,x2:345,y2:50,stroke:css("--hl"),"stroke-width":2.5});
el("line",{x1:115,y1:50,x2:345,y2:160,stroke:css("--hl2"),"stroke-width":2.5,"stroke-dasharray":"7 5"});
if(!(v.c>lo && v.c<hi)){status('<span class="bad">A cél ('+fmt(v.c,dg)+' %) nincs c₁ és c₂ között – keveréssel nem állítható elő!</span>');return;}
const m1=v.M*d1/(d1+d2), m2=v.M*d2/(d1+d2), mx=Math.max(m1,m2);
el("rect",{x:470,y:200-m1/mx*150,width:30,height:m1/mx*150,fill:"none",stroke:css("--line")});
el("rect",{x:515,y:200-m2/mx*150,width:30,height:m2/mx*150,fill:css("--grid"),stroke:css("--line")});
el("text",{x:485,y:215,"text-anchor":"middle","font-size":11},"m₁");el("text",{x:530,y:215,"text-anchor":"middle","font-size":11},"m₂");
status("m₁ : m₂ = "+fmt(d1,dg)+" : "+fmt(d2,dg)+" = <b>"+fmt(d1/d2,3)+"</b>; "+fmt(v.M,1)+" kg keverékhez: <b>m₁ = "+fmt(m1,2)+" kg</b>, <b>m₂ = "+fmt(m2,2)+" kg</b>"+
 "<br>Ellenőrzés: ("+fmt(m1,2)+" · "+fmt(v.c1,dg)+" + "+fmt(m2,2)+" · "+fmt(v.c2,dg)+") / "+fmt(v.M,1)+" = "+fmt((m1*v.c1+m2*v.c2)/v.M,dg)+" %");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
