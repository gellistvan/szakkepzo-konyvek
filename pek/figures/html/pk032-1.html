<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titrálási görbe és fenolftalein</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="sav">titrált sav</label><select id="sav" aria-label="titrált sav"><option value="1" selected>ecetsav 0,1 mol/l (gyenge)</option><option value="2">sósav 0,1 mol/l (erős)</option></select></div>
<div class="row"><label for="vb">hozzáadott NaOH</label><input id="vb" type="range" min="0" max="30" step="0.05" value="18" aria-label="hozzáadott NaOH"><output id="vb_o" for="vb"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 260" role="img" aria-label="pH-görbe ecetsav és sósav lúgos titrálásához, a fenolftalein átcsapási sávjával."></svg>
<p class="small">20,0 ml 0,1 mol/l sav titrálása 0,1 mol/l NaOH-dal; számolt szemléltető modell. A fenolftalein átcsapási sávja kb. pH 8,2–10 (ellenőrizendő: indikátor-adatlap).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"vb":"ml"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const KW=1e-14,C=0.1,VA=20;
function ph(vb,ka){const na=C*vb/(VA+vb),ct=C*VA/(VA+vb);let lo=0,hi=14;for(let i=0;i<60;i++){const p=(lo+hi)/2,h=Math.pow(10,-p);
  const a=ct*ka/(ka+h);const f=h+na-KW/h-a;if(f>0)lo=p;else hi=p;}return (lo+hi)/2;}
const ka=v.sav===1?1.8e-5:1e3, vb=v.vb, p=ph(vb,ka);
const W=560,H=260,L=40,R=200,T=10,B=30, X=x=>L+x/30*(W-L-R), Y=y=>T+(14-y)/14*(H-T-B);
el("rect",{x:L,y:Y(10),width:X(30)-L,height:Y(8.2)-Y(10),fill:css("--grid")});
el("line",{x1:L,y1:T,x2:L,y2:H-B,stroke:css("--line")});el("line",{x1:L,y1:H-B,x2:X(30),y2:H-B,stroke:css("--line")});
let d="";for(let i=0;i<=300;i++){const x=30*i/300;d+=(i?"L":"M")+X(x).toFixed(1)+","+Y(ph(x,ka)).toFixed(1);}
el("path",{d:d,fill:"none",stroke:css("--hl"),"stroke-width":2.5});
el("circle",{cx:X(vb),cy:Y(p),r:5,fill:css("--hl2")});
[0,5,10,15,20,25,30].forEach(x=>el("text",{x:X(x),y:H-B+16,"text-anchor":"middle","font-size":10},x));
[0,2,4,6,8,10,12,14].forEach(y=>el("text",{x:L-6,y:Y(y)+4,"text-anchor":"end","font-size":10},y));
// lombik a pH szerinti színnel (fenolftalein: < 8,2 színtelen, 8,2–10 halvány → rózsaszín, > 10 erős)
const pink=p<8.2?0:Math.min(1,(p-8.2)/1.8), col="rgba(214,51,132,"+(0.15+0.8*pink).toFixed(2)+")";
const fx=470;el("path",{d:"M"+(fx-12)+",60 L"+(fx-12)+",110 L"+(fx-50)+",200 L"+(fx+50)+",200 L"+(fx+12)+",110 L"+(fx+12)+",60",fill:"none",stroke:css("--line"),"stroke-width":2});
el("path",{d:"M"+(fx-38)+",172 L"+(fx-50)+",200 L"+(fx+50)+",200 L"+(fx+38)+",172 Z",fill:pink>0?col:"none",stroke:"none"});
el("text",{x:fx,y:225,"text-anchor":"middle","font-size":12},p<8.2?"színtelen":(p<10?"halvány rózsaszín → végpont":"erős rózsaszín – túltitrálva"));
el("text",{x:fx,y:40,"text-anchor":"middle","font-size":12},"büretta: "+fmt(vb,2)+" ml");
status("Hozzáadott NaOH: <b>"+fmt(vb,2)+" ml</b> → pH ≈ <b>"+fmt(p,2)+"</b>"+(Math.abs(vb-20)<0.05?" (egyenértékpont)":"")+
 "<br><small>Szemléltető modell (25 °C, aktivitási korrekció nélkül), nem mért adat. A színkép csak tájékoztató.</small>");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
