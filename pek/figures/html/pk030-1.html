<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maghőmérő – hova szúrjam?</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="dir">szúrás iránya</label><select id="dir" aria-label="szúrás iránya"><option value="1" selected>oldalról</option><option value="2">felülről</option></select></div>
<div class="row"><label for="px">vízszintes helyzet (közép = 0)</label><input id="px" type="range" min="-95" max="95" step="1" value="-40" aria-label="vízszintes helyzet (közép = 0)"><output id="px_o" for="px"></output></div>
<div class="row"><label for="py">magasság a lemez fölött</label><input id="py" type="range" min="0" max="100" step="1" value="42" aria-label="magasság a lemez fölött"><output id="py_o" for="py"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 280" role="img" aria-label="Négy hőmérőtípus és egy kenyér metszete: a maghőmérő helyesen oldalról a közepébe, hibásan a héj alá vagy a lemezig szúrva."></svg>
<p class="small">Állítsd a szonda hegyét a kenyér geometriai közepébe (vízszintes 0 %, magasság kb. 42 %). Szemléltető modell; a valódi eloszlást a termék, a kemence és a sütési idő határozza meg.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"px":"%", "py":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const W=560,H=300,cx=280,base=250,hw=220,hh=190;
const top=x=>base-hh*Math.pow(Math.max(0,1-((x-cx)/hw)**2),0.4);
let d="M"+(cx-hw)+","+base;for(let i=0;i<=60;i++){const x=cx-hw+2*hw*i/60;d+=" L"+x.toFixed(1)+","+top(x).toFixed(1);}d+=" Z";
el("path",{d:d,fill:css("--grid"),stroke:css("--line"),"stroke-width":2});
el("rect",{x:cx-hw-20,y:base,width:2*hw+40,height:10,fill:css("--muted")});
const core=[cx,base-hh*0.42];
el("line",{x1:core[0]-8,y1:core[1],x2:core[0]+8,y2:core[1],stroke:css("--line")});el("line",{x1:core[0],y1:core[1]-8,x2:core[0],y2:core[1]+8,stroke:css("--line")});
const tx=cx+(v.px/100)*hw, ty=base-(v.py/100)*hh;
let side=v.dir===1;
let sx=side?20:tx, sy=side?ty:20;
el("line",{x1:sx,y1:sy,x2:tx,y2:ty,stroke:css("--hl2"),"stroke-width":4});
el("circle",{cx:tx,cy:ty,r:4,fill:css("--hl2")});
const inside=ty<base-2 && ty>top(tx)+6, onTray=ty>=base-2;
// sematikus eloszlás: a mag a fejezet példája szerint 96 °C, a héj felé melegebb
const rx=(tx-core[0])/hw, ry=(ty-core[1])/(hh*0.75), r=Math.min(1,Math.sqrt(rx*rx+ry*ry));
let T, msg;
if(onTray){T=null;msg='<span class="bad">A szonda a lemezt érinti: a kijelző a lemez hőmérsékletét mutatja – hamis érték!</span>';}
else if(!inside){T=null;msg='<span class="bad">A szonda hegye nincs a bélzetben.</span>';}
else{T=96+8*r*r; const ok=r<0.2; msg=(ok?'<span class="ok">✓ A hegy a geometriai középen van: ez a maghőmérséklet.</span>':'<span class="bad">✗ A hegy nem a közepén van: a kijelzett érték melegebb, mint a mag – átsültnek tűnhet a kenyér, pedig a mag nem ellenőrzött.</span>');}
el("rect",{x:430,y:20,width:110,height:44,rx:6,fill:"none",stroke:css("--line")});
el("text",{x:485,y:50,"text-anchor":"middle","font-size":20,"font-weight":"bold"},T===null?"– – –":fmt(T,1)+" °C");
status(msg+"<br><small>Sematikus hőmérséklet-eloszlás (mag ≈ 96 °C a fejezet példája szerint, kifelé melegebb) – szemléltető modell, nem mért adat. A kritikus határt a HACCP-terv adja (ellenőrizendő).</small>");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
