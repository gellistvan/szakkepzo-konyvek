<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kockázati mátrix – kockázatbecslő</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="vv">V – valószínűség</label><input id="vv" type="range" min="1" max="3" step="1" value="2" aria-label="V – valószínűség"><output id="vv_o" for="vv"></output></div>
<div class="row"><label for="ss">S – súlyosság</label><input id="ss" type="range" min="1" max="3" step="1" value="3" aria-label="S – súlyosság"><output id="ss_o" for="ss"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 480 340" role="img" aria-label="3×3 kockázati mátrix, valószínűség × súlyosság; a kiválasztott cella kiemelve, mellette a kockázati kategória és a javasolt intézkedéstípus."></svg>
<p class="small">Tanulási példa, 1–3 skála; sávok: 1–2 alacsony, 3–4 közepes, 6–9 magas. Az üzem saját kockázatértékelési módszere az irányadó (ellenőrizendő: a pékség kockázatértékelése).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"vv":"", "ss":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const V=v.vv, Sv=v.ss, R=V*Sv;
const cat=r=>r<=2?"alacsony":(r<=4?"közepes":"magas");
const fill={"alacsony":"#ffffff","közepes":"#f4d58d","magas":"#e8908a"};
const meas={"alacsony":"Elfogadható; a meglévő intézkedések fenntartása, oktatás, időszakos ellenőrzés.",
 "közepes":"Intézkedési terv határidővel: szervezési intézkedés (eljárás, jelölés, oktatás), ahol lehet, műszaki javítás.",
 "magas":"Azonnali intézkedés: a munka vagy a gép leállítása, műszaki védelem (burkolat, reteszelés javítása), csak utána szervezési intézkedés és egyéni védőeszköz."};
const X0=150,Y0=20,C=90;
for(let vv=3;vv>=1;vv--)for(let s=1;s<=3;s++){const r=vv*s,x=X0+(s-1)*C,y=Y0+(3-vv)*C,on=(vv===V&&s===Sv);
  el("rect",{x:x,y:y,width:C,height:C,fill:fill[cat(r)],stroke:on?"#000":"#555","stroke-width":on?5:1.2});
  el("text",{x:x+C/2,y:y+C/2-4,"text-anchor":"middle","font-size":20,"font-weight":"bold",fill:"#111"},"R = "+r);
  el("text",{x:x+C/2,y:y+C/2+18,"text-anchor":"middle","font-size":13,fill:"#111"},cat(r));}
["1 enyhe","2 közepes","3 súlyos"].forEach((t,i)=>el("text",{x:X0+i*C+C/2,y:Y0+3*C+18,"text-anchor":"middle","font-size":13},t));
["3 gyakori","2 közepes","1 ritka"].forEach((t,i)=>el("text",{x:X0-8,y:Y0+i*C+C/2+5,"text-anchor":"end","font-size":13},t));
el("text",{x:X0+1.5*C,y:Y0+3*C+40,"text-anchor":"middle","font-size":13},"S – súlyosság");
el("text",{x:20,y:Y0+1.5*C,"text-anchor":"middle","font-size":13,transform:"rotate(-90 20 "+(Y0+1.5*C)+")"},"V – valószínűség");
const c=cat(R);
status("<b>R = "+V+" × "+Sv+" = "+R+" → "+c+" kockázat.</b> "+meas[c]+"<br><span class='small'>A védekezés sorrendje mindig: műszaki megoldás → szervezési intézkedés → egyéni védőeszköz.</span>");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
