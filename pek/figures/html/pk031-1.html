<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meniszkusz és areométer</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="eye">szemmagasság a meniszkuszhoz képest</label><input id="eye" type="range" min="-4" max="4" step="0.1" value="0" aria-label="szemmagasság a meniszkuszhoz képest"><output id="eye_o" for="eye"></output></div>
<div class="row"><label for="so">sótartalom</label><input id="so" type="range" min="0" max="20" step="0.5" value="8" aria-label="sótartalom"><output id="so_o" for="so"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 280" role="img" aria-label="Mérőhenger homorú folyadékfelszínnel és három nézőponttal; két areométer vízben és sóoldatban."></svg>
<p class="small">Sematikus modell. Sűrűség 20 °C-on: 0 % → 0,998; 10 % → 1,071; 20 % → 1,148 g/cm³ (tankönyvi tájékoztató értékek, ellenőrizendő: sóoldat-sűrűségtáblázat).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"eye":"skálarész", "so":"m/m%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const W=560,H=280, X0=60,X1=160,Y100=140, sc=14;
el("line",{x1:X0,y1:30,x2:X0,y2:260,stroke:css("--line"),"stroke-width":2});el("line",{x1:X1,y1:30,x2:X1,y2:260,stroke:css("--line"),"stroke-width":2});
let d="M"+X0+","+(Y100-14);for(let i=0;i<=40;i++){const u=i/40;d+=" L"+(X0+(X1-X0)*u).toFixed(1)+","+(Y100-14*Math.pow(2*u-1,4)).toFixed(1);}
el("path",{d:d,fill:"none",stroke:css("--hl"),"stroke-width":2});
for(let ml=96;ml<=104;ml++){const y=Y100-(ml-100)*sc;el("line",{x1:X1-(ml%5?8:16),x2:X1,y1:y,y2:y,stroke:css("--line")});el("text",{x:X1+6,y:y+4,"font-size":11},ml);}
const ey=Y100-v.eye*sc, ex=10;
el("circle",{cx:ex,cy:ey,r:6,fill:"none",stroke:css("--line"),"stroke-width":2});
const mx=(X0+X1)/2, yr=ey+(Y100-ey)/(mx-ex)*(X1-ex), read=100+(Y100-yr)/sc;
el("line",{x1:ex,y1:ey,x2:X1,y2:yr,stroke:css("--hl2"),"stroke-dasharray":"5 3","stroke-width":1.5});
// areométer
const p=v.so, rho=p<=10?0.998+(1.071-0.998)*p/10:1.071+(1.148-1.071)*(p-10)/10;
const cx=380, surf=90, V0=1.0;  // merülés ~ 1/rho
const sub=(V0/rho-0.82)*700;     // a szár bemerülő hossza (sematikus)
el("rect",{x:cx-50,y:surf,width:100,height:170,fill:css("--grid"),stroke:css("--line")});
const top=surf-sub+40;
el("ellipse",{cx:cx,cy:top+110,rx:18,ry:45,fill:"none",stroke:css("--line"),"stroke-width":2});
el("rect",{x:cx-4,y:top-40,width:8,height:110,fill:"none",stroke:css("--line")});
el("line",{x1:cx+20,x2:cx+80,y1:surf,y2:surf,stroke:css("--hl2")});
el("text",{x:cx+84,y:surf+4,"font-size":12},fmt(rho,3)+" g/cm³");
status("Szem: "+(v.eye>0.3?"a meniszkusz fölött":v.eye<-0.3?"a meniszkusz alatt":"szemmagasságban")+" → leolvasott érték: <b>"+fmt(read,1)+" ml</b> (valódi: 100 ml)"+
 "<br>Sótartalom "+fmt(p,1)+" % → sűrűség ≈ <b>"+fmt(rho,3)+" g/cm³</b> (20 °C, lineáris közelítés a 0/10/20 %-os táblázati pontok között; ellenőrizendő: sűrűségtáblázat)");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
