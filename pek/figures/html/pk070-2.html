<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folytonos tésztakészítő berendezés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>
#v .on path,#v .on use,#v .on line,#v .on polyline{stroke:#c55a11 !important}
#v .on text{fill:#c55a11 !important;font-weight:bold}
#v .dim{opacity:.22}
.parts{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.parts button{font-size:12.5px;padding:2px 7px}
</style><div class="parts" role="group" aria-label="Alkatrészek kiemelése"><button type="button" onmouseenter="peek('u1')" onfocus="peek('u1')" onmouseleave="unpeek()" onblur="unpeek()">1 lisztadagoló</button><button type="button" onmouseenter="peek('u2')" onfocus="peek('u2')" onmouseleave="unpeek()" onblur="unpeek()">2 folyadékadagolók</button><button type="button" onmouseenter="peek('u3')" onfocus="peek('u3')" onmouseleave="unpeek()" onblur="unpeek()">3 elődagasztó</button><button type="button" onmouseenter="peek('u4')" onfocus="peek('u4')" onmouseleave="unpeek()" onblur="unpeek()">4 fejlesztő</button><button type="button" onmouseenter="peek('u5')" onfocus="peek('u5')" onmouseleave="unpeek()" onblur="unpeek()">5 kiadó</button><button type="button" onmouseenter="peek('guard')" onfocus="peek('guard')" onmouseleave="unpeek()" onblur="unpeek()">6 burkolat</button><button type="button" onmouseenter="peek('estop')" onfocus="peek('estop')" onmouseleave="unpeek()" onblur="unpeek()">7 vészleállítók</button><button type="button" onmouseenter="peek('clean')" onfocus="peek('clean')" onmouseleave="unpeek()" onblur="unpeek()">▲ nehezen tisztítható</button><button type="button" onmouseenter="peek('flow')" onfocus="peek('flow')" onmouseleave="unpeek()" onblur="unpeek()">anyagáram</button></div></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Folytonos tésztakészítő vázlata: lisztadagoló és folyadékadagolók, elődagasztó kamra, hűtött fejlesztő szakasz és kiadó egység, jelölve a vészleállítók és a nehezen tisztítható pontok."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus, márkafüggetlen vázlat; az indítási/leállítási sorrend és az ellenőrző pontok határai a gyártói utasítás és a HACCP-terv szerint (ellenőrizendő).</p>

// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "<b>Indítás előtt.</b> A védőburkolatok (6) zártak, a vészleállítók (7) működnek, a gépnaplóban nincs tiltó bejegyzés; a nehezen tisztítható pontok (▲) a takarítási terv szerint tiszták.", "on": ["guard", "estop", "clean"], "dim": true}, {"msg": "<b>1–2. Adagolás.</b> Indul a mérlegelt lisztadagoló (1) és a folyadékadagolás (2): víz, sóoldat, élesztőoldat a beállított arányban, a hűtővíz hőmérséklete (T) szerint.", "on": ["u1", "u2"], "dim": true}, {"msg": "<b>3. Keverés.</b> Az elődagasztó kamra (3) előkeveri az anyagokat, kezdeti tésztát képez.", "on": ["u3"], "dim": true}, {"msg": "<b>4. Fejlesztés.</b> A fejlesztő szakasz (4) továbbdagasztja a tésztát; a hűtőköpeny és az érzékelő (T) tartja a tésztahőmérsékletet – ellenőrző pont.", "on": ["u4"], "dim": true}, {"msg": "<b>5. Kiadás.</b> A kiadó egység (5) folyamatosan adja a tésztát az osztógépnek; az első mintán ellenőrizd a hőmérsékletet, állagot, tömeget.", "on": ["u5", "flow"], "dim": true}, {"msg": "<b>Leállítás.</b> Előbb az adagolók (1–2), majd a szakaszok a gyártói sorrendben; tisztítás csak a teljes leállás, leválasztás és újraindítás elleni biztosítás után. A vészleállító nem leválasztó eszköz.", "on": ["u1", "u2", "u3", "u4", "u5", "estop"], "dim": false}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let _ready = false;
function hl(keys, dim){
  const cur = STEPS[k] || {}, hide = cur.hide || [];
  svg.querySelectorAll('[id*="__"]').forEach(e => {
    const key = e.id.split("__")[0];
    const on = keys.includes(key);
    e.classList.toggle("on", on);
    e.classList.toggle("dim", !!dim && !on && !(cur.keep || []).includes(key));
    e.style.display = hide.includes(key) ? "none" : "";
  });
}
function render(s){
  if (!_ready){
    svg.setAttribute("viewBox", "0 0 " + FW + " " + FH);
    svg.innerHTML = '<rect width="100%" height="100%" fill="#fff"/>' + FIGSVG;
    const inner = svg.querySelector("svg"); if (inner){ inner.setAttribute("width", FW); inner.setAttribute("height", FH); }
    _ready = true;
  }
  hl(s.on || [], s.dim);
}
function peek(key){ hl([key], false); }
function unpeek(){ show(k); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.innerHTML = s.msg || "";   // a lépésszöveg saját, megbízható HTML-t (<b>, <i>) tartalmazhat
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
