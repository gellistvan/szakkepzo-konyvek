<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Próbasütés-kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="ve">V edény</label><input id="ve" type="range" min="3000" max="9000" step="50" value="6000" aria-label="V edény"><output id="ve_o" for="ve"></output></div>
<div class="row"><label for="m1">V mag – 1. mérés</label><input id="m1" type="range" min="1000" max="8000" step="10" value="4120" aria-label="V mag – 1. mérés"><output id="m1_o" for="m1"></output></div>
<div class="row"><label for="m2">V mag – 2. mérés</label><input id="m2" type="range" min="1000" max="8000" step="10" value="4130" aria-label="V mag – 2. mérés"><output id="m2_o" for="m2"></output></div>
<div class="row"><label for="m3">V mag – 3. mérés</label><input id="m3" type="range" min="1000" max="8000" step="10" value="4110" aria-label="V mag – 3. mérés"><output id="m3_o" for="m3"></output></div>
<div class="row"><label for="mm">cipó tömege m</label><input id="mm" type="range" min="200" max="1500" step="5" value="470" aria-label="cipó tömege m"><output id="mm_o" for="mm"></output></div>
<div class="row"><label for="hh">magasság H</label><input id="hh" type="range" min="3" max="20" step="0.1" value="9.2" aria-label="magasság H"><output id="hh_o" for="hh"></output></div>
<div class="row"><label for="dd">átmérő D</label><input id="dd" type="range" min="5" max="30" step="0.1" value="13.5" aria-label="átmérő D"><output id="dd_o" for="dd"></output></div>
<div class="row"><label for="h0">h0 (eredeti)</label><input id="h0" type="range" min="10" max="60" step="1" value="40" aria-label="h0 (eredeti)"><output id="h0_o" for="h0"></output></div>
<div class="row"><label for="h1">h1 (terhelés alatt)</label><input id="h1" type="range" min="5" max="60" step="1" value="28" aria-label="h1 (terhelés alatt)"><output id="h1_o" for="h1"></output></div>
<div class="row"><label for="h2">h2 (visszaalakult)</label><input id="h2" type="range" min="5" max="60" step="1" value="37" aria-label="h2 (visszaalakult)"><output id="h2_o" for="h2"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 245" role="img" aria-label="Magkiszorításos edény a cipóval, a cipó magassága és átmérője, valamint a bélzet-próbatest három magassága; a kalkulátor a fajlagos térfogatot, az alaki hányadost és a bélzetrugalmasságot a referenciatartományhoz méri."></svg>
<p class="small">Képletből számolt tanulási példa (V = V_edény − V_mag; v = V/m; AH = H/D; R = (h2 − h1)/(h0 − h1) · 100). A referenciatartományok tanulási példák (ellenőrizendő: hatályos próbasütési szabvány).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"ve":"cm³", "m1":"cm³", "m2":"cm³", "m3":"cm³", "mm":"g", "hh":"cm", "dd":"cm", "h0":"mm", "h1":"mm", "h2":"mm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const fg=css("--fg"), mu=css("--muted"), hl=css("--hl");
const Vs=[v.ve-v.m1, v.ve-v.m2, v.ve-v.m3], Vav=(Vs[0]+Vs[1]+Vs[2])/3, Vmax=Math.max(...Vs), Vmin=Math.min(...Vs);
const spread=Vmax>0?(Vmax-Vmin)/Vmax*100:0;
const sv=Vav/v.mm, ah=v.hh/v.dd, ok1=v.h0>v.h1, R=ok1?(v.h2-v.h1)/(v.h0-v.h1)*100:NaN;
function bar(y, name, val, lo, hi, min, max, unit, d){
  const X=180, W=330, sx=x=>X+W*(Math.min(Math.max(x,min),max)-min)/(max-min);
  el("text",{x:10,y:y+15,"font-size":13,fill:fg},name);
  el("rect",{x:X,y:y,width:W,height:22,fill:"none",stroke:fg});
  el("rect",{x:sx(lo),y:y,width:sx(hi)-sx(lo),height:22,fill:mu,opacity:0.35});
  el("text",{x:sx(lo),y:y+36,"font-size":11,fill:mu,"text-anchor":"middle"},fmt(lo,d));
  el("text",{x:sx(hi),y:y+36,"font-size":11,fill:mu,"text-anchor":"middle"},fmt(hi,d));
  if(isFinite(val)){el("line",{x1:sx(val),y1:y-5,x2:sx(val),y2:y+27,stroke:hl,"stroke-width":3});
    el("text",{x:Math.min(sx(val)+5,X+W-40),y:y-8,"font-size":12,fill:hl},fmt(val,d)+" "+unit);}
  const inside=val>=lo&&val<=hi; el("text",{x:X+W+8,y:y+15,"font-size":12,fill:fg},isFinite(val)?(inside?"tartományban":"eltér"):"–");
}
bar(30,"fajlagos térfogat v",sv,3.5,4.5,2,6,"cm³/g",2);
bar(100,"alaki hányados AH",ah,0.60,0.75,0.3,1.0,"",2);
bar(170,"bélzetrugalmasság R",R,70,90,0,100,"%",0);
el("text",{x:10,y:235,"font-size":11,fill:mu},"Szürke sáv: tanulási referenciatartomány (ellenőrizendő: hatályos próbasütési szabvány, liszttípus).");
let s=`Térfogat: ${fmt(Vs[0],0)} / ${fmt(Vs[1],0)} / ${fmt(Vs[2],0)} cm³, átlag <b>${fmt(Vav,0)} cm³</b>; eltérés ${fmt(spread,1)} % a legnagyobb értékhez ` +
 (spread<=3?"(≤ 3 %: jó ismételhetőség)":'<span class="bad">(> 3 %: tömörödés, mozgás vagy leolvasási hiba?)</span>') +
 `<br>v = ${fmt(Vav,0)} / ${fmt(v.mm,0)} = <b>${fmt(sv,2)} cm³/g</b>; AH = ${fmt(v.hh,1)} / ${fmt(v.dd,1)} = <b>${fmt(ah,2)}</b>; `;
s+= ok1?`R = (${fmt(v.h2,0)} − ${fmt(v.h1,0)}) / (${fmt(v.h0,0)} − ${fmt(v.h1,0)}) · 100 = <b>${fmt(R,0)} %</b>`:'<span class="bad">h1 legyen kisebb, mint h0.</span>';
if(ok1&&v.h2>v.h0) s+=' <span class="bad">(h2 nem lehet nagyobb h0-nál)</span>';
status(s);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
