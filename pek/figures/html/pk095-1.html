<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hőmérleg-kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="m">tésztatömeg</label><input id="m" type="range" min="10" max="300" step="5" value="100" aria-label="tésztatömeg"><output id="m_o" for="m"></output></div>
<div class="row"><label for="t0">kezdeti hőm.</label><input id="t0" type="range" min="15" max="40" step="1" value="30" aria-label="kezdeti hőm."><output id="t0_o" for="t0"></output></div>
<div class="row"><label for="t1">végső bélhőm.</label><input id="t1" type="range" min="85" max="100" step="1" value="97" aria-label="végső bélhőm."><output id="t1_o" for="t1"></output></div>
<div class="row"><label for="c">fajhő</label><input id="c" type="range" min="2.5" max="4.2" step="0.1" value="3.2" aria-label="fajhő"><output id="c_o" for="c"></output></div>
<div class="row"><label for="vs">sütési veszteség</label><input id="vs" type="range" min="4" max="20" step="0.5" value="10" aria-label="sütési veszteség"><output id="vs_o" for="vs"></output></div>
<div class="row"><label for="src">energiaforrás</label><select id="src" aria-label="energiaforrás"><option value="0" selected>földgáz (m³ × fűtőérték)</option><option value="1">villamos energia (kWh)</option></select></div>
<div class="row"><label for="gas">gázfogyasztás</label><input id="gas" type="range" min="0.5" max="8" step="0.1" value="2.5" aria-label="gázfogyasztás"><output id="gas_o" for="gas"></output></div>
<div class="row"><label for="hg">fűtőérték</label><input id="hg" type="range" min="30" max="40" step="0.5" value="34" aria-label="fűtőérték"><output id="hg_o" for="hg"></output></div>
<div class="row"><label for="kwh">villamos fogyasztás</label><input id="kwh" type="range" min="5" max="60" step="0.5" value="24" aria-label="villamos fogyasztás"><output id="kwh_o" for="kwh"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Egy kemencetöltet hőmérlege: a bevitt hőből a tészta felmelegítésére, a víz elpárologtatására és a veszteségekre jutó rész, valamint a termikus hatásfok."></svg>
<p class="small">Egyszerűsített modell (r = 2260 kJ/kg); a számok tanulási példák, nem mért adatok. A fűtőérték a tényleges gázminőségtől függ (ellenőrizendő: gázszolgáltatói adat, gyártói adatlap).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"m":"kg", "t0":"°C", "t1":"°C", "c":"kJ/(kg·°C)", "vs":"%", "gas":"m³", "hg":"MJ/m³", "kwh":"kWh"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const Qfel=v.m*v.c*(v.t1-v.t0), Qpar=v.m*v.vs/100*2260, Qelm=Qfel+Qpar;
const Qbe = v.src==0 ? v.gas*v.hg*1000 : v.kwh*3600;
const eta=Qelm/Qbe*100, loss=Qbe-Qelm;
const W=560,H=300,L=70,B=30,Tp=12, mx=Math.max(Qbe,Qelm)*1.12, Y=q=>Tp+(1-q/mx)*(H-Tp-B), hh=q=>q/mx*(H-Tp-B);
const nf=x=>Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
el("line",{x1:L,y1:H-B,x2:W-10,y2:H-B,stroke:css("--line")});
let y=0;[[Qfel,"#ffffff","tészta felmelegítése"],[Qpar,"#bdbdbd","víz elpárologtatása"],[Math.max(loss,0),"#6e6e6e","veszteség"]].forEach(([q,f,n])=>{
  el("rect",{x:L+30,y:Y(y+q),width:110,height:hh(q),fill:f,stroke:css("--line")});
  if(q>0)el("text",{x:L+150,y:Y(y+q/2)+4,"font-size":12},n+": "+nf(q)+" kJ");y+=q;});
el("rect",{x:L+330,y:Y(Qfel),width:80,height:hh(Qfel),fill:"#ffffff",stroke:css("--line")});
el("rect",{x:L+330,y:Y(Qelm),width:80,height:hh(Qpar),fill:"#bdbdbd",stroke:css("--line")});
el("text",{x:L+85,y:H-B+18,"text-anchor":"middle","font-size":12},"bevitt hő");
el("text",{x:L+370,y:H-B+18,"text-anchor":"middle","font-size":12},"elméleti hőszükséglet");
let w = eta>100 ? '<span class="bad">η > 100 %: hibás adat vagy fordított képlet (vö. 3. tipikus hiba) – a bevitt hő nem lehet kisebb az elméletinél.</span>'
       : (eta<30 ? '<span class="bad">Nagyon alacsony hatásfok: ellenőrizd az adatokat, a töltést, a szigetelést.</span>' : '<span class="ok">Ésszerű tartomány (tanulási példa: 40–60 %).</span>');
status("Q_fel = "+nf(Qfel)+" kJ · Q_pár = "+nf(Qpar)+" kJ · <b>Q_elm = "+nf(Qelm)+" kJ</b> ("+fmt(Qelm/3600,1)+" kWh)<br>"+
 "Q_be = "+nf(Qbe)+" kJ ("+fmt(Qbe/3600,1)+" kWh) · veszteség = "+nf(loss)+" kJ · <b>η = "+fmt(eta,1)+" %</b><br>"+w);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
