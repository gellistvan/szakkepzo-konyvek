<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pontozólap-kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="w1">súly: külső</label><input id="w1" type="range" min="0" max="1" step="0.05" value="0.2" aria-label="súly: külső"><output id="w1_o" for="w1"></output></div>
<div class="row"><label for="w2">súly: bélzet</label><input id="w2" type="range" min="0" max="1" step="0.05" value="0.4" aria-label="súly: bélzet"><output id="w2_o" for="w2"></output></div>
<div class="row"><label for="w3">súly: íz-illat</label><input id="w3" type="range" min="0" max="1" step="0.05" value="0.4" aria-label="súly: íz-illat"><output id="w3_o" for="w3"></output></div>
<div class="row"><label for="nb">bírálók száma</label><select id="nb" aria-label="bírálók száma"><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option></select></div>
<div class="row"><label for="b1t1">1. bíráló – külső</label><input id="b1t1" type="range" min="1" max="10" step="0.5" value="8" aria-label="1. bíráló – külső"><output id="b1t1_o" for="b1t1"></output></div>
<div class="row"><label for="b1t2">1. bíráló – bélzet</label><input id="b1t2" type="range" min="1" max="10" step="0.5" value="9" aria-label="1. bíráló – bélzet"><output id="b1t2_o" for="b1t2"></output></div>
<div class="row"><label for="b1t3">1. bíráló – íz</label><input id="b1t3" type="range" min="1" max="10" step="0.5" value="9" aria-label="1. bíráló – íz"><output id="b1t3_o" for="b1t3"></output></div>
<div class="row"><label for="b2t1">2. bíráló – külső</label><input id="b2t1" type="range" min="1" max="10" step="0.5" value="9.5" aria-label="2. bíráló – külső"><output id="b2t1_o" for="b2t1"></output></div>
<div class="row"><label for="b2t2">2. bíráló – bélzet</label><input id="b2t2" type="range" min="1" max="10" step="0.5" value="9" aria-label="2. bíráló – bélzet"><output id="b2t2_o" for="b2t2"></output></div>
<div class="row"><label for="b2t3">2. bíráló – íz</label><input id="b2t3" type="range" min="1" max="10" step="0.5" value="9" aria-label="2. bíráló – íz"><output id="b2t3_o" for="b2t3"></output></div>
<div class="row"><label for="b3t1">3. bíráló – külső</label><input id="b3t1" type="range" min="1" max="10" step="0.5" value="6" aria-label="3. bíráló – külső"><output id="b3t1_o" for="b3t1"></output></div>
<div class="row"><label for="b3t2">3. bíráló – bélzet</label><input id="b3t2" type="range" min="1" max="10" step="0.5" value="6" aria-label="3. bíráló – bélzet"><output id="b3t2_o" for="b3t2"></output></div>
<div class="row"><label for="b3t3">3. bíráló – íz</label><input id="b3t3" type="range" min="1" max="10" step="0.5" value="6" aria-label="3. bíráló – íz"><output id="b3t3_o" for="b3t3"></output></div>
<div class="row"><label for="b4t1">4. bíráló – külső</label><input id="b4t1" type="range" min="1" max="10" step="0.5" value="8" aria-label="4. bíráló – külső"><output id="b4t1_o" for="b4t1"></output></div>
<div class="row"><label for="b4t2">4. bíráló – bélzet</label><input id="b4t2" type="range" min="1" max="10" step="0.5" value="8" aria-label="4. bíráló – bélzet"><output id="b4t2_o" for="b4t2"></output></div>
<div class="row"><label for="b4t3">4. bíráló – íz</label><input id="b4t3" type="range" min="1" max="10" step="0.5" value="8" aria-label="4. bíráló – íz"><output id="b4t3_o" for="b4t3"></output></div>
<div class="row"><label for="b5t1">5. bíráló – külső</label><input id="b5t1" type="range" min="1" max="10" step="0.5" value="8.5" aria-label="5. bíráló – külső"><output id="b5t1_o" for="b5t1"></output></div>
<div class="row"><label for="b5t2">5. bíráló – bélzet</label><input id="b5t2" type="range" min="1" max="10" step="0.5" value="8" aria-label="5. bíráló – bélzet"><output id="b5t2_o" for="b5t2"></output></div>
<div class="row"><label for="b5t3">5. bíráló – íz</label><input id="b5t3" type="range" min="1" max="10" step="0.5" value="9" aria-label="5. bíráló – íz"><output id="b5t3_o" for="b5t3"></output></div>
<div class="row"><label for="b6t1">6. bíráló – külső</label><input id="b6t1" type="range" min="1" max="10" step="0.5" value="9" aria-label="6. bíráló – külső"><output id="b6t1_o" for="b6t1"></output></div>
<div class="row"><label for="b6t2">6. bíráló – bélzet</label><input id="b6t2" type="range" min="1" max="10" step="0.5" value="8.5" aria-label="6. bíráló – bélzet"><output id="b6t2_o" for="b6t2"></output></div>
<div class="row"><label for="b6t3">6. bíráló – íz</label><input id="b6t3" type="range" min="1" max="10" step="0.5" value="8.5" aria-label="6. bíráló – íz"><output id="b6t3_o" for="b6t3"></output></div>
<div class="row"><label for="b7t1">7. bíráló – külső</label><input id="b7t1" type="range" min="1" max="10" step="0.5" value="8" aria-label="7. bíráló – külső"><output id="b7t1_o" for="b7t1"></output></div>
<div class="row"><label for="b7t2">7. bíráló – bélzet</label><input id="b7t2" type="range" min="1" max="10" step="0.5" value="8.5" aria-label="7. bíráló – bélzet"><output id="b7t2_o" for="b7t2"></output></div>
<div class="row"><label for="b7t3">7. bíráló – íz</label><input id="b7t3" type="range" min="1" max="10" step="0.5" value="9" aria-label="7. bíráló – íz"><output id="b7t3_o" for="b7t3"></output></div>
<div class="row"><label for="excl">kiugró kizárása (> 15 pont eltérés az átlagtól)</label><input id="excl" type="checkbox" aria-label="kiugró kizárása (> 15 pont eltérés az átlagtól)"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 250" role="img" aria-label="Három bíráló súlyozott pontszáma oszlopdiagramon a minősítési sávhatárokkal; a 60 pontos kiugró érték az átlagot 89,5-ről 79,67-re húzza le."></svg>
<p class="small">Súlyozott pontszám = 10 · (w1·p1 + w2·p2 + w3·p3) 100 pontos skálán. A kategóriahatárok és a 15 pontos kiugrási küszöb tanulási példa (ellenőrizendő: gyártmánylap, vizsgálati terv).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"w1":"", "w2":"", "w3":"", "b1t1":"p", "b1t2":"p", "b1t3":"p", "b2t1":"p", "b2t2":"p", "b2t3":"p", "b3t1":"p", "b3t2":"p", "b3t3":"p", "b4t1":"p", "b4t2":"p", "b4t3":"p", "b5t1":"p", "b5t2":"p", "b5t3":"p", "b6t1":"p", "b6t2":"p", "b6t3":"p", "b7t1":"p", "b7t2":"p", "b7t3":"p"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const fg=css("--fg"), mu=css("--muted"), hl=css("--hl"), hl2=css("--hl2");
for(let b=1;b<=7;b++)for(let t=1;t<=3;t++)document.getElementById("b"+b+"t"+t).closest(".row").style.display=b<=v.nb?"":"none";
const ws=v.w1+v.w2+v.w3, P=[];
for(let b=1;b<=v.nb;b++)P.push(10*(v.w1*v["b"+b+"t1"]+v.w2*v["b"+b+"t2"]+v.w3*v["b"+b+"t3"]));
const avg=P.reduce((a,b)=>a+b,0)/P.length, out=P.map(p=>Math.abs(p-avg)>15);
const keep=P.filter((p,i)=>!(v.excl&&out[i])), avg2=keep.length?keep.reduce((a,b)=>a+b,0)/keep.length:NaN;
const use=v.excl?avg2:avg, cat=use>=90?"kiváló":use>=75?"jó":use>=60?"megfelelő":"nem megfelelő";
const X0=60,Y0=230,H=200,sy=p=>Y0-H*(Math.max(40,Math.min(p,100))-40)/60, bw=Math.min(60,380/v.nb);
el("line",{x1:X0,y1:Y0,x2:X0+460,y2:Y0,stroke:fg});
[60,75,90].forEach((g,i)=>{el("line",{x1:X0,y1:sy(g),x2:X0+460,y2:sy(g),stroke:mu});el("text",{x:X0+462,y:sy(g)+4,"font-size":11,fill:mu},g+" "+["megfelelő","jó","kiváló"][i]);});
[40,50,60,70,80,90,100].forEach(g=>el("text",{x:X0-8,y:sy(g)+4,"font-size":11,"text-anchor":"end",fill:fg},g));
P.forEach((p,i)=>{const x=X0+20+i*(460-40)/v.nb;
  el("rect",{x:x,y:sy(p),width:bw,height:Y0-sy(p),fill:out[i]?"none":mu,stroke:fg,"stroke-dasharray":out[i]?"5 3":"",opacity:out[i]?1:0.6});
  el("text",{x:x+bw/2,y:sy(p)-5,"font-size":12,"text-anchor":"middle",fill:fg},fmt(p,1));
  el("text",{x:x+bw/2,y:Y0+16,"font-size":11,"text-anchor":"middle",fill:fg},(i+1)+". b.");});
el("line",{x1:X0,y1:sy(avg),x2:X0+460,y2:sy(avg),stroke:hl,"stroke-width":2.5,"stroke-dasharray":"8 4"});
if(v.excl&&isFinite(avg2))el("line",{x1:X0,y1:sy(avg2),x2:X0+460,y2:sy(avg2),stroke:hl2,"stroke-width":2.5,"stroke-dasharray":"2 3"});
let s=`Súlyok összege: <b>${fmt(ws,2)}</b>`+(Math.abs(ws-1)>1e-6?' <span class="bad">≠ 1 – a súlyokat javítani kell!</span>':' ✓');
s+=`<br>Átlag (mind): <b>${fmt(avg,2)}</b>`;
if(v.excl)s+=`; kiugró nélkül: <b>${fmt(avg2,2)}</b>`;
s+=` → kategória: <b>${cat}</b>. Kiugró bíráló: ${out.filter(Boolean).length} (az átlagtól > 15 pont; ennek okát vizsgálni és dokumentálni kell).`;
status(s);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
