<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keverési kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="mode">Számítás</label><select id="mode" aria-label="Számítás"><option value="viz" selected>vízkeverés</option><option value="so">sóoldat-korrekció</option><option value="eleszto">élesztőszuszpenzió</option></select></div>
<div class="row"><label for="th">hideg víz</label><input id="th" type="range" min="0" max="15" step="1" value="4" aria-label="hideg víz"><output id="th_o" for="th"></output></div>
<div class="row"><label for="tm">meleg víz</label><input id="tm" type="range" min="20" max="60" step="1" value="30" aria-label="meleg víz"><output id="tm_o" for="tm"></output></div>
<div class="row"><label for="tc">célhőmérséklet</label><input id="tc" type="range" min="0" max="45" step="1" value="18" aria-label="célhőmérséklet"><output id="tc_o" for="tc"></output></div>
<div class="row"><label for="mw">kell (víz)</label><input id="mw" type="range" min="5" max="60" step="1" value="26" aria-label="kell (víz)"><output id="mw_o" for="mw"></output></div>
<div class="row"><label for="ms">oldat a tartályban</label><input id="ms" type="range" min="10" max="100" step="1" value="40" aria-label="oldat a tartályban"><output id="ms_o" for="ms"></output></div>
<div class="row"><label for="cn">jelenlegi töménység</label><input id="cn" type="range" min="10" max="26" step="0.5" value="22" aria-label="jelenlegi töménység"><output id="cn_o" for="cn"></output></div>
<div class="row"><label for="ct">cél töménység</label><input id="ct" type="range" min="10" max="26" step="0.5" value="25" aria-label="cél töménység"><output id="ct_o" for="ct"></output></div>
<div class="row"><label for="me">kell (élesztő)</label><input id="me" type="range" min="0.5" max="5" step="0.1" value="2.0" aria-label="kell (élesztő)"><output id="me_o" for="me"></output></div>
<div class="row"><label for="ws">szuszpenzió töménysége</label><input id="ws" type="range" min="10" max="20" step="1" value="15" aria-label="szuszpenzió töménysége"><output id="ws_o" for="ws"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 580 270" role="img" aria-label="Keverési kereszt: két kiinduló érték, középen a cél, jobbra a keverési arányok és tömegek."></svg>
<p class="small">Képletből számolt tanulási példa (tömegmérleg, azonos fajhő); a technológiai lap és a fokoló/hőmérő mérése az irányadó.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"th":"°C", "tm":"°C", "tc":"°C", "mw":"kg", "ms":"kg", "cn":"m/m%", "ct":"m/m%", "me":"kg", "ws":"m/m%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const show = {viz:["th","tm","tc","mw"], so:["ms","cn","ct"], eleszto:["me","ws"]}[v.mode];
["th","tm","tc","mw","ms","cn","ct","me","ws"].forEach(i=>{document.getElementById(i).closest(".row").style.display = show.includes(i)?"":"none";});
const fg = css("--fg"), mu = css("--muted"), hl = css("--hl");
function node(x,y,txt,strong){ const lines = txt.split("\n");
  el("rect",{x:x-78,y:y-24,width:156,height:48,rx:8,fill:strong?css("--grid"):css("--bg"),stroke:fg,"stroke-width":strong?2:1});
  lines.forEach((t,i)=>el("text",{x:x,y:y-4+i*17-(lines.length-1)*4,"text-anchor":"middle","font-size":14},t)); }
function crossDraw(la,a,lb,b,c,pa,pb,ra,rb){
  el("line",{x1:110,y1:60,x2:470,y2:220,stroke:mu,"stroke-dasharray":"6 4"});
  el("line",{x1:110,y1:220,x2:470,y2:60,stroke:mu,"stroke-dasharray":"6 4"});
  node(110,60,la+"\n"+a); node(110,220,lb+"\n"+b); node(290,140,"cél\n"+c,true);
  node(470,60,pa+" rész\n"+ra); node(470,220,pb+" rész\n"+rb); }
if (v.mode==="viz"){
  const ok = v.tc>v.th && v.tc<v.tm;
  if(!ok){ status('<span class="bad">A célhőmérséklet nincs a hideg és a meleg víz hőmérséklete között – ebből a két vízből nem keverhető ki (jég vagy melegebb víz kell).</span>'); return; }
  const mh = v.mw*(v.tm-v.tc)/(v.tm-v.th), mm = v.mw-mh;
  crossDraw("hideg",fmt(v.th,0)+" °C","meleg",fmt(v.tm,0)+" °C",fmt(v.tc,0)+" °C",fmt(v.tm-v.tc,0),fmt(v.tc-v.th,0),fmt(mh,2)+" kg hideg",fmt(mm,2)+" kg meleg");
  status(`Hideg víz: <b>${fmt(mh,2)} kg</b>, meleg víz: <b>${fmt(mm,2)} kg</b>. Ellenőrzés: (${fmt(mh,2)}·${fmt(v.th,0)} + ${fmt(mm,2)}·${fmt(v.tm,0)}) / ${fmt(v.mw,0)} = ${fmt((mh*v.th+mm*v.tm)/v.mw,1)} °C.`);
} else if (v.mode==="so"){
  if (Math.abs(v.cn-v.ct)<1e-9){ status("A töménység már megfelel a célnak."); return; }
  if (v.cn<v.ct){
    const x = v.ms*(v.ct-v.cn)/(100-v.ct);
    crossDraw("oldat",fmt(v.cn,1)+" %","só",fmt(100,0)+" %",fmt(v.ct,1)+" %",fmt(100-v.ct,1),fmt(v.ct-v.cn,1),fmt(v.ms,0)+" kg oldat",fmt(x,2)+" kg só");
    status(`Hozzáadandó só: <b>${fmt(x,2)} kg</b>. Ellenőrzés: (${fmt(v.ms*v.cn/100,2)} + ${fmt(x,2)}) / ${fmt(v.ms+x,2)} = ${fmt(100*(v.ms*v.cn/100+x)/(v.ms+x),1)} m/m%.`);
  } else {
    const y = v.ms*(v.cn-v.ct)/v.ct;
    crossDraw("oldat",fmt(v.cn,1)+" %","víz","0 %",fmt(v.ct,1)+" %",fmt(v.ct,1),fmt(v.cn-v.ct,1),fmt(v.ms,0)+" kg oldat",fmt(y,2)+" kg víz");
    status(`Túl tömény: hozzáadandó víz <b>${fmt(y,2)} kg</b>. Ellenőrzés: ${fmt(v.ms*v.cn/100,2)} / ${fmt(v.ms+y,2)} = ${fmt(100*v.ms*v.cn/100/(v.ms+y),1)} m/m%.`);
  }
} else {
  const sz = v.me*100/v.ws, viz = sz - v.me, W = 440, x0 = 70;
  el("text",{x:x0,y:70,"font-size":15},"Élesztőszuszpenzió összetétele");
  el("rect",{x:x0,y:95,width:W*v.me/sz,height:46,fill:hl,stroke:fg});
  el("rect",{x:x0+W*v.me/sz,y:95,width:W*viz/sz,height:46,fill:"none",stroke:fg,"stroke-dasharray":"5 3"});
  el("text",{x:x0+4,y:165,"font-size":13},"élesztő "+fmt(v.me,2)+" kg");
  el("text",{x:x0+W-4,y:165,"font-size":13,"text-anchor":"end"},"víz "+fmt(viz,2)+" kg");
  el("text",{x:x0,y:205,"font-size":13,fill:mu},"A szuszpenzióval bevitt vizet a dagasztóvízből le kell vonni.");
  status(`Adagolandó szuszpenzió: <b>${fmt(sz,2)} kg</b> (= ${fmt(v.me,2)}·100 / ${fmt(v.ws,0)}); ebből víz: <b>${fmt(viz,2)} kg</b>.`);
}

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
