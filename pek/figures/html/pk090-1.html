<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemezkiosztás-számító</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="L">lemez hossza</label><input id="L" type="range" min="40" max="120" step="1" value="80" aria-label="lemez hossza"><output id="L_o" for="L"></output></div>
<div class="row"><label for="B">lemez szélessége</label><input id="B" type="range" min="30" max="80" step="1" value="60" aria-label="lemez szélessége"><output id="B_o" for="B"></output></div>
<div class="row"><label for="d">kelés utáni átmérő</label><input id="d" type="range" min="4" max="40" step="0.5" value="20" aria-label="kelés utáni átmérő"><output id="d_o" for="d"></output></div>
<div class="row"><label for="m">szegély</label><input id="m" type="range" min="0" max="10" step="0.5" value="5" aria-label="szegély"><output id="m_o" for="m"></output></div>
<div class="row"><label for="g">legkisebb hézag</label><input id="g" type="range" min="0" max="10" step="0.5" value="5" aria-label="legkisebb hézag"><output id="g_o" for="g"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 360" role="img" aria-label="60×80 cm-es sütőlemez felülnézetben, a tésztadarabok rácsos elrendezésével és a méretvonalakkal."></svg>
<p class="small">Négyzetrácsos elrendezés; a darabokat a hasznos területen egyenletesen osztja el. A hézag és a szegély tanulási példa, a pontos értéket az üzemi technológiai lap adja (ellenőrizendő: üzemi paraméter).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"L":"cm", "B":"cm", "d":"cm", "m":"cm", "g":"cm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const L=v.L, B=v.B, d=v.d, m=v.m, g=v.g;
const fit=(len)=> (len-2*m<d)?0:Math.floor((len-2*m-d)/(d+g)+1e-9)+1;
const nx=fit(L), ny=fit(B), n=nx*ny;
const sc=Math.min(560/L,300/B), ox=30, oy=20;
el("rect",{x:ox,y:oy,width:L*sc,height:B*sc,fill:"none",stroke:css("--line"),"stroke-width":2,rx:4});
el("rect",{x:ox+m*sc,y:oy+m*sc,width:(L-2*m)*sc,height:(B-2*m)*sc,fill:"none",stroke:css("--muted"),"stroke-dasharray":"2 3"});
const px=nx>1?(L-2*m-d)/(nx-1):0, py=ny>1?(B-2*m-d)/(ny-1):0;
for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){const cx=m+d/2+(nx>1?i*px:(L-2*m-d)/2), cy=m+d/2+(ny>1?j*py:(B-2*m-d)/2);
  el("circle",{cx:ox+cx*sc,cy:oy+cy*sc,r:d/2*sc,fill:css("--grid"),stroke:css("--line"),"stroke-width":1.3});}
el("text",{x:ox+L*sc/2,y:oy+B*sc+18,"text-anchor":"middle","font-size":12},fmt(L,0)+" cm");
el("text",{x:ox-8,y:oy+B*sc/2,"text-anchor":"end","font-size":12},fmt(B,0)+" cm");
const gx=nx>1?px-d:null, gy=ny>1?py-d:null;
let msg="Elfér: <b>"+nx+" × "+ny+" = "+n+" db</b> (hosszában "+nx+", keresztben "+ny+").";
if(nx>1)msg+=" Egyenletes elosztásnál a középpont-távolság hosszában "+fmt(px,1)+" cm (hézag "+fmt(gx,1)+" cm)";
if(ny>1)msg+=", keresztben "+fmt(py,1)+" cm (hézag "+fmt(gy,1)+" cm).";
if(n===0)msg='<span class="bad">A darab a szegéllyel együtt nem fér a lemezre.</span>';
status(msg+"<br><small>Szabály: a szélső középpont a széltől szegély + sugár; a középpont-távolság legalább átmérő + hézag. Az átmérő a KELÉS UTÁNI méret.</small>");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
