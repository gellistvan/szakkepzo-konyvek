<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hűtő-kelesztő program-tervező</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="vet">vetés időpontja (óra)</label><input id="vet" type="range" min="3" max="9" step="0.25" value="6" aria-label="vetés időpontja (óra)"><output id="vet_o" for="vet"></output></div>
<div class="row"><label for="m">darabtömeg</label><select id="m" aria-label="darabtömeg"><option value="70" selected>70 g zsemle</option><option value="1000">1 kg kenyér</option></select></div>
<div class="row"><label for="ts">tárolási hőmérséklet</label><input id="ts" type="range" min="2" max="12" step="0.5" value="6" aria-label="tárolási hőmérséklet"><output id="ts_o" for="ts"></output></div>
<div class="row"><label for="tt">tárolási idő</label><input id="tt" type="range" min="2" max="16" step="0.5" value="6" aria-label="tárolási idő"><output id="tt_o" for="tt"></output></div>
<div class="row"><label for="fin">befejező kelesztés</label><input id="fin" type="range" min="0.5" max="3" step="0.25" value="1.5" aria-label="befejező kelesztés"><output id="fin_o" for="fin"></output></div>
<div class="row"><label for="pre">előkelesztés</label><input id="pre" type="range" min="0.25" max="1" step="0.25" value="0.75" aria-label="előkelesztés"><output id="pre_o" for="pre"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="Hűtő-kelesztő program: kamra- és maghőmérséklet az idő függvényében, a szakaszok és a vetés jelölésével."></svg>
<p class="small">Szemléltető modell, nem mért adat: a maghőmérséklet elsőrendű késleltetéssel számolt, az időállandó feltételezett. A valódi programot a berendezés gyártói adatlapja, az üzemi technológiai lap és a HACCP-terv adja; a maghőmérsékletet mérni kell (ellenőrizendő: HACCP-terv, gyártói adatlap).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"vet":"h", "ts":"°C", "tt":"óra", "fin":"óra", "pre":"óra"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const TAU={70:1.2,1000:4.5}, COOL=2, WARM=1, Tpre=26, Tcool=8, Tfin=26;
const vet=24+v.vet, pre=v.pre, Ts=v.ts, ts=v.tt, fin=v.fin, tau=TAU[v.m];
const t5=vet-fin, t4=t5-WARM, t3=t4-ts, t2=t3-COOL, t1=t2-pre;
const ST=[["előkelesztés",t1,t2,Tpre,Tpre],["lehűtés",t2,t3,Tpre,Tcool],["hűtött tárolás",t3,t4,Ts,Ts],["visszamelegítés",t4,t5,Ts,Tfin],["befejező kelesztés",t5,vet,Tfin,Tfin]];
let T=26, dt=1/60, P=[], minStore=99, tBelow=null;
ST.forEach(([n,a,b,ka,kb])=>{const N=Math.max(1,Math.round((b-a)/dt));for(let i=0;i<N;i++){const t=a+i*dt;
  const k=(n!=="lehűtés")?ka+(kb-ka)*i/N:Math.max(kb,ka-(ka-kb)*i/(N*0.5));T+=(k-T)/tau*dt;P.push([t,k,T]);
  if(n==="hűtött tárolás")minStore=Math.min(minStore,T); if(tBelow===null&&T<10&&t>=t2)tBelow=t-t2;}});
const W=640,H=300,L=46,R=12,Tp=16,B=36, x0=t1-0.25, x1=vet+0.4;
const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=y=>Tp+(30-y)/30*(H-Tp-B);
const sh=["#f2f2f2","#ffffff","#e4e4e4","#ffffff","#f2f2f2"];
ST.forEach(([n,a,b],i)=>{el("rect",{x:X(a),y:Tp,width:X(b)-X(a),height:H-Tp-B,fill:sh[i],opacity:0.5});});
el("line",{x1:L,y1:H-B,x2:W-R,y2:H-B,stroke:css("--line")});el("line",{x1:L,y1:Tp,x2:L,y2:H-B,stroke:css("--line")});
for(let y=0;y<=30;y+=10){el("text",{x:L-6,y:Y(y)+4,"text-anchor":"end","font-size":11},y+" °C");}
for(let h=Math.ceil(x0);h<=x1;h+=2){el("text",{x:X(h),y:H-B+16,"text-anchor":"middle","font-size":11},String(((h%24)+24)%24).padStart(2,"0")+":00");}
el("line",{x1:L,x2:W-R,y1:Y(10),y2:Y(10),stroke:css("--line"),"stroke-dasharray":"2 3"});
let d1="",d2="";P.forEach((p,i)=>{d1+=(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1);d2+=(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[2]).toFixed(1);});
el("path",{d:d1,fill:"none",stroke:css("--hl"),"stroke-width":2.5});
el("path",{d:d2,fill:"none",stroke:css("--hl2"),"stroke-width":2,"stroke-dasharray":"6 4"});
el("line",{x1:X(vet),x2:X(vet),y1:Tp,y2:H-B,stroke:css("--line"),"stroke-dasharray":"8 3 2 3"});
el("text",{x:X(vet)-4,y:Tp+12,"text-anchor":"end","font-size":11},"vetés");
const hm=t=>{let m=Math.round(((t%24)+24)%24*60);return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");};
let rows="<table><tr><th>szakasz</th><th>kezdet</th><th>vég</th></tr>";ST.forEach(([n,a,b])=>{rows+="<tr><td>"+n+"</td><td>"+hm(a)+"</td><td>"+hm(b)+"</td></tr>";});rows+="</table>";
const warn=minStore<10?'<span class="ok">A tésztamag a tárolás alatt 10 °C alá kerül (modell: '+fmt(tBelow,1)+' óra a lehűtés kezdetétől).</span>'
 :'<span class="bad">Figyelem: a tésztamag a tárolás alatt nem kerül 10 °C alá (legkisebb: '+fmt(minStore,1)+' °C) – hosszabb tárolás, alacsonyabb hőmérséklet vagy kisebb darab kell.</span>';
status("Program indítása (betárolás): <b>"+hm(t1)+"</b> · vetés: <b>"+hm(vet)+"</b><br>"+warn+rows+
 "<small>Folytonos: kamra; szaggatott: tésztamag (elsőrendű késleltetés, feltételezett τ = "+fmt(tau,1)+" óra). Lehűtés 2 óra, visszamelegítés 1 óra (modellfeltevés).</small>");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
