<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hűléskalkulátor (felezési idő)</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="pre">előbeállítás</label><select id="pre" aria-label="előbeállítás"><option value="0">kézi</option><option value="1" selected>kenyér (példa)</option><option value="2">túrótöltelék (példa)</option><option value="3">2. feladat: briós</option><option value="4">3. feladat: túrós töltelék</option></select></div>
<div class="row"><label for="t0">kezdeti hőm. T₀</label><input id="t0" type="range" min="10" max="100" step="1" value="95" aria-label="kezdeti hőm. T₀"><output id="t0_o" for="t0"></output></div>
<div class="row"><label for="tk">környezet T_körny</label><input id="tk" type="range" min="-20" max="30" step="1" value="20" aria-label="környezet T_körny"><output id="tk_o" for="tk"></output></div>
<div class="row"><label for="th">felezési idő τ½</label><input id="th" type="range" min="5" max="90" step="1" value="40" aria-label="felezési idő τ½"><output id="th_o" for="th"></output></div>
<div class="row"><label for="tc">célhőm. T_cél</label><input id="tc" type="range" min="-10" max="60" step="1" value="30" aria-label="célhőm. T_cél"><output id="tc_o" for="tc"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Exponenciálisan lecsengő hűlési görbék; a kenyér 116 perc, a túrótöltelék 40 perc alatt éri el a célhőmérsékletet."></svg>
<p class="small">Felezési idős (exponenciális) szemléltető modell; a felezési idő tömeg-, alak-, csomagolás- és légmozgásfüggő. Tanulási példa, nem mért adat (ellenőrizendő: üzemi hűtési próba, HACCP-terv).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"t0":"°C", "tk":"°C", "th":"perc", "tc":"°C"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const P={1:[95,20,40,30],2:[35,5,25,15],3:[92,22,35,32],4:[28,4,20,10]};
if(v.pre && v.pre!==window._lp){const p=P[v.pre];["t0","tk","th","tc"].forEach((id,i)=>{document.getElementById(id).value=p[i];});
  window._lp=v.pre; draw(); return;}
window._lp=v.pre;
const T0=v.t0,Tk=v.tk,th=v.th,Tc=v.tc;
const W=560,H=300,L=50,R=14,T=14,B=40;
if(!(T0>Tc && Tc>Tk)){status('<span class="bad">A számításhoz T₀ &gt; T_cél &gt; T_körny kell.</span>');return;}
const te=th*Math.log2((T0-Tk)/(Tc-Tk)), tmax=Math.max(4*th, te*1.2);
const X=x=>L+x/tmax*(W-L-R), Y=y=>T+(T0+2-y)/(T0+2-(Tk-2))*(H-T-B);
el("line",{x1:L,y1:T,x2:L,y2:H-B,stroke:css("--line")});el("line",{x1:L,y1:H-B,x2:W-R,y2:H-B,stroke:css("--line")});
let d="";for(let i=0;i<=120;i++){const tt=tmax*i/120;d+=(i?"L":"M")+X(tt).toFixed(1)+","+Y(Tk+(T0-Tk)*Math.pow(0.5,tt/th)).toFixed(1);}
el("path",{d:d,fill:"none",stroke:css("--hl"),"stroke-width":2.5});
el("line",{x1:L,x2:W-R,y1:Y(Tc),y2:Y(Tc),stroke:css("--line"),"stroke-dasharray":"6 4"});
el("text",{x:W-R-4,y:Y(Tc)-4,"text-anchor":"end","font-size":11},"cél: "+fmt(Tc,0)+" °C");
el("line",{x1:X(te),x2:X(te),y1:T,y2:H-B,stroke:css("--hl2"),"stroke-dasharray":"2 3"});
let rows="";let k=0;
for(;k<=12;k++){const tt=k*th, dd=(T0-Tk)*Math.pow(0.5,k);
  if(tt<=tmax)el("circle",{cx:X(tt),cy:Y(Tk+dd),r:4,fill:"none",stroke:css("--line")});
  rows+=(k?" · ":"")+fmt(tt,0)+" perc: "+fmt(Tk+dd,1)+" °C";
  if(Tk+dd<=Tc)break;}
for(let tt=0;tt<=tmax;tt+=th){el("text",{x:X(tt),y:H-B+16,"text-anchor":"middle","font-size":10},fmt(tt,0));}
el("text",{x:(L+W)/2,y:H-6,"text-anchor":"middle","font-size":11},"hűlési idő (perc)");
status("Felezések: "+rows+"<br>Felezéssel becsült idő: <b>"+fmt(k*th,0)+" perc</b> · képlettel: τ = τ½ · log₂((T₀−T_körny)/(T_cél−T_körny)) = <b>"+fmt(te,0)+" perc</b>"+
 "<br><small>Tanulási példa; a valódi hűlési időt üzemi próba és a HACCP-terv adja.</small>");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
