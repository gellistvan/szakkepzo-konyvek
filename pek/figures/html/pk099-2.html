<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gőzölési program</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="s">gőzölési idő</label><input id="s" type="range" min="0" max="20" step="1" value="6" aria-label="gőzölési idő"><output id="s_o" for="s"></output></div>
<div class="row"><label for="pe">páraelszívás kezdete</label><input id="pe" type="range" min="5" max="35" step="1" value="13" aria-label="páraelszívás kezdete"><output id="pe_o" for="pe"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 300" role="img" aria-label="Idődiagram a gőzölés és a páraelszívás szakaszaival és a tésztafelület melegedésével."></svg>
<p class="small">Szemléltető modell (1 kg-os kenyér), nem mért adat; a harmatpont a páratartalomtól függ (ellenőrizendő: üzemi technológiai lap, gépkönyv).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"s":"s", "pe":"perc"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const st=v.s, vent=v.pe, DEW=85, W=600,H=300,L=50,R=12,Tp=12,B=34;
const cond=Math.min(3.5,0.5*st);
const Ts=x=>{if(x<=cond)return cond>0?30+(DEW-30)*x/cond:30; if(x<=vent)return cond>0?Math.min(100,DEW+(100-DEW)*(x-cond)/2):Math.min(100,30+70*x/2.5);
  return 100+75*(1-Math.exp(-(x-vent)/9));};
const X=x=>L+x/40*(W-L-R), Y=y=>Tp+(200-y)/180*(H-Tp-B);
el("rect",{x:X(vent),y:Tp,width:X(40)-X(vent),height:H-Tp-B,fill:css("--grid"),opacity:0.5});
el("text",{x:X(vent)+4,y:Tp+12,"font-size":11},"páraelszívás");
if(st>0)el("rect",{x:X(0),y:Tp,width:Math.max(3,X(st/60)-X(0)),height:H-Tp-B,fill:css("--hl2"),opacity:0.6});
el("line",{x1:L,y1:H-B,x2:W-R,y2:H-B,stroke:css("--line")});el("line",{x1:L,y1:Tp,x2:L,y2:H-B,stroke:css("--line")});
[40,85,100,150,200].forEach(y=>el("text",{x:L-5,y:Y(y)+4,"text-anchor":"end","font-size":10},y));
for(let x=0;x<=40;x+=10)el("text",{x:X(x),y:H-B+15,"text-anchor":"middle","font-size":10},x+" perc");
el("line",{x1:L,x2:W-R,y1:Y(DEW),y2:Y(DEW),stroke:css("--line"),"stroke-dasharray":"2 3"});
let d="";for(let i=0;i<=200;i++){const x=40*i/200;d+=(i?"L":"M")+X(x).toFixed(1)+","+Y(Ts(x)).toFixed(1);}
el("path",{d:d,fill:"none",stroke:css("--hl"),"stroke-width":2.5});
let q=[];
if(st<3)q.push('<span class="bad">kevés gőz: fénytelen, fakó héj, zárt vágás, kisebb térfogat</span>');
else if(st>15)q.push('<span class="bad">túl sok gőz: vastag, nyúlós héj, a vágás elmosódhat, csöpögő pára</span>');
else q.push('<span class="ok">gőz: a felület rövid ideig a harmatpont alatt marad – csirizesedés, fényes héj</span>');
if(vent<8)q.push('<span class="bad">korai páraelszívás: a héj túl korán szárad, a kemencerugás csökkenhet</span>');
else if(vent>25)q.push('<span class="bad">késői páraelszívás: gumis, puha, sápadt héj</span>');
else q.push('<span class="ok">páraelszívás a sütés első harmada után: a héj szárad, ropogós lesz</span>');
status("Gőzölés "+fmt(st,0)+" s, páraelszívás a "+fmt(vent,0)+". perctől. Kondenzációs szakasz (modell): ≈ "+fmt(cond,1)+" perc.<br>"+q.join("<br>")+
 "<br><small>Szemléltető modell; a tényleges gőzidőt és páraelszívást a technológiai lap és a gépkönyv adja.</small>");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
