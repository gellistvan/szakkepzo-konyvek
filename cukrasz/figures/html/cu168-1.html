<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vizsga-időterv (Gantt)</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="rest">Omlós tészta pihentetése</label><input id="rest" type="range" min="10" max="60" step="5" value="20" aria-label="Omlós tészta pihentetése"><output id="rest_o" for="rest"></output></div>
<div class="row"><label for="bake">Piskóta sütése</label><input id="bake" type="range" min="20" max="45" step="5" value="30" aria-label="Piskóta sütése"><output id="bake_o" for="bake"></output></div>
<div class="row"><label for="pcool">Piskóta hűlése rácson</label><input id="pcool" type="range" min="20" max="90" step="5" value="60" aria-label="Piskóta hűlése rácson"><output id="pcool_o" for="pcool"></output></div>
<div class="row"><label for="kcool">Krém gyors hűtése</label><input id="kcool" type="range" min="10" max="60" step="5" value="25" aria-label="Krém gyors hűtése"><output id="kcool_o" for="kcool"></output></div>
<div class="row"><label for="kmin">Előírt min. krémhűtési idő (ellenőrizendő)</label><input id="kmin" type="range" min="10" max="60" step="5" value="25" aria-label="Előírt min. krémhűtési idő (ellenőrizendő)"><output id="kmin_o" for="kmin"></output></div>
<div class="row"><label for="lim">Rendelkezésre álló idő</label><input id="lim" type="range" min="150" max="300" step="15" value="210" aria-label="Rendelkezésre álló idő"><output id="lim_o" for="lim"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 330" role="img" aria-label="Gantt-idővonal: a pihentetési és hűtési idők alatt párhuzamosan más műveletek futnak; csúszkákkal állítható pihentetési, sütési és hűtési idők, a teljes idő és a kritikus út automatikus újraszámítása"></svg>
<p class="small">Szemléltető ütemezés a 6. feladat idővonalához; a sütési, hűtési és pihentetési idők tanulási értékek, a technológiai lap és a vizsgaközpont előírása szerint ellenőrizendők. ▼ = kritikus pont (hőmérsékletmérés). Vastag keret = kritikus út, pontozott keret = puffer.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"rest":"perc", "bake":"perc", "pcool":"perc", "kcool":"perc", "kmin":"perc", "lim":"perc"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const R=["Higiéniai munkakezdés","Mise en place","Omlós tészta","Piskóta","Krém (főzés, hűtés)","Összeállítás, díszítés","Takarítás","Dokumentáció"];
const rest=v.rest,bake=v.bake,pc=v.pcool,kc=v.kcool;const B=[];
B.push([0,0,10,"m"],[1,10,30,"m"],[2,30,40,"m"],[2,40,40+rest,"w"],[3,40,60,"m"],[3,60,60+bake,"b"],[3,60+bake,60+bake+pc,"w"]);
const ob=Math.max(40+rest,60+bake);B.push([2,ob,ob+15,"b"]);const k0=60+bake;B.push([4,k0,k0+20,"m"],[4,k0+20,k0+20+kc,"w"]);
const ready={"piskóta":60+bake+pc,"krém":k0+20+kc,"omlós tészta":ob+15};let a0=0,crit="";for(const k in ready){if(ready[k]>a0){a0=ready[k];crit=k;}}
B.push([5,a0,a0+30,"m"],[6,a0+30,a0+50,"m"],[7,a0+50,a0+60,"m"]);const end=a0+60;
const critRow={"piskóta":3,"krém":4,"omlós tészta":2}[crit];
const X0=150,W=470,tmax=Math.max(end,v.lim)+15,sx=t=>X0+t/tmax*W,rh=30;
const hm=m=>(8+Math.floor(m/60))+":"+String(m%60).padStart(2,"0");
for(let t=0;t<=tmax;t+=15){el("line",{x1:sx(t),y1:10,x2:sx(t),y2:10+R.length*rh,stroke:css("--grid")});
  if(t%30==0)el("text",{x:sx(t),y:R.length*rh+26,"font-size":10,"text-anchor":"middle"},hm(t));}
R.forEach((r,i)=>el("text",{x:X0-6,y:10+i*rh+19,"font-size":11,"text-anchor":"end"},r));
const fill={m:css("--hl"),b:css("--hl2"),w:"none"};
B.forEach(b=>{const y=10+b[0]*rh+5,isC=[0,1,5,6,7,critRow].includes(b[0]);
  el("rect",{x:sx(b[1]),y:y,width:Math.max(1,sx(b[2])-sx(b[1])),height:rh-10,fill:fill[b[3]],"fill-opacity":b[3]=="w"?0:0.55,
    stroke:css("--line"),"stroke-width":isC?3:1,"stroke-dasharray":b[3]=="w"?"4 3":"none"});
  if(b[3]=="w")el("text",{x:(sx(b[1])+sx(b[2]))/2,y:y+14,"font-size":9,"text-anchor":"middle",fill:css("--muted")},"várakozás");});
for(const k in ready){if(ready[k]<a0){const row={"piskóta":3,"krém":4,"omlós tészta":2}[k];
  el("rect",{x:sx(ready[k]),y:10+row*rh+5,width:sx(a0)-sx(ready[k]),height:rh-10,fill:"none",stroke:css("--muted"),"stroke-dasharray":"2 3"});}}
[k0+20,k0+20+kc].forEach(t=>el("text",{x:sx(t),y:10+4*rh+4,"font-size":13,"text-anchor":"middle"},"▼"));
el("line",{x1:sx(v.lim),y1:4,x2:sx(v.lim),y2:14+R.length*rh,stroke:end>v.lim?css("--bad"):css("--ok"),"stroke-width":2});
let msg="Befejezés: <b>"+hm(end)+"</b> (teljes idő "+end+" perc; keret "+v.lim+" perc). Kritikus út: a(z) <b>"+crit+"</b> lánca határozza meg az összeállítás kezdetét ("+hm(a0)+").";
for(const k in ready){if(ready[k]<a0)msg+=" Puffer ("+k+"): "+(a0-ready[k])+" perc.";}
if(end>v.lim)msg+='<br><span class="bad">Az időterv túllépi a rendelkezésre álló időt!</span>';
if(kc<v.kmin)msg+='<br><span class="bad">Figyelem: a krém hűtési ideje ('+kc+' perc) rövidebb az előírtnál ('+v.kmin+' perc) – élelmiszer-biztonsági kockázat, a maghőmérsékletet mérni kell.</span>';
status(msg);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
