<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nyomon követés és visszahívás</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="dir">Követés iránya</label><select id="dir" aria-label="Követés iránya"><option value="elore">előrefelé (alapanyag → vevő)</option><option value="vissza">visszafelé (késztermék → alapanyag)</option><option value="mind" selected>mindkét irány</option></select></div>
<div class="row"><label for="ret">Visszahozott (db)</label><input id="ret" type="range" min="0" max="200" step="5" value="60" aria-label="Visszahozott (db)"><output id="ret_o" for="ret"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 415" role="img" aria-label="Tételfa: a mandulaliszt-tételből készült 480 db minyon útja a három értékesítési helyig, előre- és visszafelé követési nyilakkal."></svg>
<p class="small">A fejezet 40.2.6 példájának adatai. Lefedettség = (készlet + visszahozott) / teljes tétel · 100.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"ret":"db"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const dir=v.dir, ret=Math.min(v.ret,200);
const SITES=[["Saját vitrin",120,30],["Partnerkávézó",120,20],["Rendezvény",240,150]];
const N=480, sold=SITES.reduce((a,s)=>a+s[2],0), stock=N-sold;
const fw=dir!=="vissza", bw=dir!=="elore";
const bx=(x,y,w,h,t,on,dash)=>{el("rect",{x:x,y:y,width:w,height:h,rx:6,fill:on?css("--grid"):css("--bg"),stroke:on?css("--hl"):css("--line"),"stroke-width":on?2.6:1.2,"stroke-dasharray":dash?"5 4":""});
 t.split("\n").forEach((l,i,a)=>el("text",{x:x+w/2,y:y+h/2+(i-(a.length-1)/2)*14+4,"font-size":12,"text-anchor":"middle"},l));};
const ar=(x0,y0,x1,y1,back,on)=>{if(!on)return;el("line",{x1:x0,y1:y0,x2:x1,y2:y1,stroke:back?css("--hl2"):css("--hl"),"stroke-width":2.2,"stroke-dasharray":back?"6 4":"","marker-end":"url(#ah"+(back?"b":"f")+")"});};
const defs=document.createElementNS(NS,"defs");
defs.innerHTML='<marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="'+css("--hl")+'"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="'+css("--hl2")+'"/></marker>';
FIG.svg.appendChild(defs);
const R=[["Beszállító: mandulaliszt-tétel (gyanús)",20],["Átvétel, tárolás tételazonosítóval",80],["Gyártási napló: 480 db minyon ebből a tételből",140],["Késztermék-tétel 2025-05-07-MK-01: 480 db",200]];
R.forEach((r,i)=>{bx(140,r[1],320,40,r[0],(fw&&i>=0)||(bw&&i<=3),false);if(i<3){ar(270,r[1]+40,270,r[1]+60,false,fw);ar(330,r[1]+60,330,r[1]+40,true,bw);}});
SITES.forEach((s,i)=>{const x=20+i*195;bx(x,280,170,54,s[0]+"\n"+s[1]+" db: "+s[2]+" eladva, "+(s[1]-s[2])+" készleten",fw,false);
 ar(290,240,x+85,280,false,fw);ar(x+105,280,310,240,true,bw);
 bx(x,370,170,34,"vevők: "+s[2]+" db",fw,true);ar(x+85,334,x+85,370,false,fw);});
const cov1=stock/N*100, cov2=(stock+ret)/N*100;
status((dir==="vissza"?"<b>Visszafelé követés:</b> a késztermék tételszámából a gyártási napló megmondja, melyik alapanyag-tételből készült. ":
 dir==="elore"?"<b>Előrefelé követés:</b> a gyanús alapanyag-tételből kiindulva minden érintett késztermék-tételt és értékesítési helyet megtalálunk. ":
 "<b>Mindkét irány:</b> ")+"Eladva "+sold+" db, készleten "+stock+" db → visszavonási lefedettség <b>"+fmt(cov1,1)+" %</b>; "+ret+" db visszahozott termékkel a teljes lefedettség <b>"+fmt(cov2,1)+" %</b>. A fennmaradó "+(sold-ret)+" db-ról a hatóságot tájékoztatni kell.");
FIG.svg.setAttribute("viewBox","0 0 600 415");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
