<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A búzaszem rétegei és a lisztfajták</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="k">Mi kerül a termékbe?</label><select id="k" aria-label="Mi kerül a termékbe?"><option value="0" selected>a búzaszem minden része</option><option value="1">fehér liszt (alacsony kiőrlési fok)</option><option value="2">teljes kiőrlésű liszt</option><option value="3">korpa</option><option value="4">csíra</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 360 420" role="img" aria-label="A búzaszem hosszmetszete számozott rétegekkel: héj, aleuronréteg, magbelső és csíra; nyilak mutatják, hogy a fehér liszt a magbelsőből, a korpa a héjból és az aleuronrétegből lesz."></svg>
<p class="small">Sematikus, nem méretarányos metszet (cu036). Számozás: 1 héj, 2 aleuronréteg, 3 magbelső, 4 csíra, 5 szakáll.</p>
