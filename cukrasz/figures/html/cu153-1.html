<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vállalkozási forma – döntési fa</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="a1">1. Egyedül indulsz?</label><select id="a1" aria-label="1. Egyedül indulsz?"><option value="igen" selected>igen</option><option value="nem">nem, több tag</option></select></div>
<div class="row"><label for="a2">2. (egyedül) Fontos a magánvagyon védelme?</label><select id="a2" aria-label="2. (egyedül) Fontos a magánvagyon védelme?"><option value="igen">igen</option><option value="nem" selected>nem</option></select></div>
<div class="row"><label for="a3">2. (több tag) Ki vállal korlátlan felelősséget?</label><select id="a3" aria-label="2. (több tag) Ki vállal korlátlan felelősséget?"><option value="mind">mindenki</option><option value="egy" selected>csak egy tag</option><option value="senki">senki</option></select></div>
<div class="row"><label for="a4">3. (senki) Nagy tőke, sok befektető?</label><select id="a4" aria-label="3. (senki) Nagy tőke, sok befektető?"><option value="igen">igen</option><option value="nem" selected>nem</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 440" role="img" aria-label="Döntési fa: egyedül vagy többen, a magánvagyon védelme és a korlátlan felelősség vállalása szerint egyéni vállalkozó, Kft., Kkt., Bt. vagy Zrt."></svg>
<p class="small">A tőke- és felelősségi adatok a fejezet táblázatából (ellenőrizendő: hatályos Ptk.). Csak az aktuális ágon lévő kérdés számít.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const N={"q1": [4.6, 7.9, 3.8, 1.0, "Egyedül indulsz?"], "q2": [0.3, 5.5, 4.4, 1.0, "Fontos a magánvagyon\nvédelme?"], "q3": [7.3, 5.5, 5.4, 1.0, "Ki vállal korlátlan, magánvagyonra\nkiterjedő felelősséget?"], "ev": [0.0, 2.9, 2.5, 1.2, "Egyéni\nvállalkozó"], "kft1": [2.7, 2.9, 2.5, 1.2, "Egyszemélyes\nKft."], "kkt": [5.6, 2.9, 2.2, 1.2, "Kkt."], "bt": [8.0, 2.9, 2.4, 1.2, "Bt. (beltag\n+ kültag)"], "q4": [10.6, 2.9, 2.4, 1.2, "Nagy tőke,\nsok befektető?"], "kft2": [8.6, 0.3, 2.0, 1.1, "Kft."], "zrt": [10.9, 0.3, 2.0, 1.1, "Zrt."]}, F={"ev": ["Egyéni vállalkozó", "egy természetes személy", "nincs", "korlátlan, teljes magánvagyon", "nincs"], "kft1": ["Egyszemélyes Kft.", "egy tag", "törzstőke (ellenőrizendő: 3 000 000 Ft)", "a tag nem felel, csak a törzstőke befizetéséért", "van"], "kkt": ["Kkt.", "legalább két tag", "nincs", "korlátlan, egyetemleges", "van"], "bt": ["Bt.", "legalább egy beltag és egy kültag", "nincs", "beltag korlátlan, kültag a betét erejéig", "van"], "kft2": ["Kft.", "legalább egy tag", "törzstőke (ellenőrizendő: 3 000 000 Ft)", "a tag nem felel, csak a törzstőke befizetéséért", "van"], "zrt": ["Zrt.", "egy vagy több részvényes", "alaptőke (ellenőrizendő: 5 000 000 Ft)", "a részvényes nem felel, csak a részvénye befizetett értékéig", "van"]};
const path=["q1"]; let res=null;
if(v.a1==="igen"){path.push("q2");res=v.a2==="igen"?"kft1":"ev";}
else{path.push("q3");if(v.a3==="mind")res="kkt";else if(v.a3==="egy")res="bt";else{path.push("q4");res=v.a4==="igen"?"zrt":"kft2";}}
path.push(res);
const sc=46, H=9.2, X=x=>10+x*sc, Y=y=>10+(H-y)*sc;
const edges=[["q1","q2","igen"],["q1","q3","nem"],["q2","ev","nem"],["q2","kft1","igen"],["q3","kkt","mindenki"],["q3","bt","egy tag"],["q3","q4","senki"],["q4","kft2","nem"],["q4","zrt","igen"]];
edges.forEach(e=>{const a=N[e[0]],b=N[e[1]],on=path.includes(e[0])&&path.includes(e[1]);
 const x0=X(a[0]+a[2]/2),y0=Y(a[1]),x1=X(b[0]+b[2]/2),y1=Y(b[1]+b[3]);
 el("line",{x1:x0,y1:y0,x2:x1,y2:y1,stroke:on?css("--hl"):css("--muted"),"stroke-width":on?4:1.3,"stroke-dasharray":on?"":"5 4"});
 el("text",{x:(x0+x1)/2+4,y:(y0+y1)/2,"font-size":12,"font-weight":on?"bold":"normal"},e[2]);});
Object.keys(N).forEach(k=>{const n=N[k],on=path.includes(k),leaf=!k.startsWith("q");
 el("rect",{x:X(n[0]),y:Y(n[1]+n[3]),width:n[2]*sc,height:n[3]*sc,rx:8,fill:on?css("--grid"):css("--bg"),stroke:on?css("--hl"):css("--line"),"stroke-width":on?3:1.2,"stroke-dasharray":leaf?"":"0"});
 n[4].split("\n").forEach((l,i,a)=>el("text",{x:X(n[0]+n[2]/2),y:Y(n[1]+n[3]/2)+(i-(a.length-1)/2)*15+5,"font-size":13,"text-anchor":"middle","font-weight":leaf&&on?"bold":"normal"},l));});
const f=F[res];
status("Javasolt forma: <b>"+f[0]+"</b>. Alapítók: "+f[1]+"; minimális tőke: "+f[2]+"; felelősség: "+f[3]+"; jogi személyiség: "+f[4]+". <span class='small'>(Szemléltető; a döntéshez jogi és könyvelői tanács kell.)</span>");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
