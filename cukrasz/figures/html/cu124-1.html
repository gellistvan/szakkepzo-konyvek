</div></div><p class="small">Mutass egy rétegre vagy válaszd a gombot. Sematikus, nem méretarányos rajz a fejezet leírása szerint.</p>
<script>
const PARTS={"p1": ["1 piskótalap, sziruppal áztatva", "alsó lap; a szirup nedvesíti, de nem áztatja szét"], "g1": ["2 gyümölcsréteg", "jól lecsepegtetett gyümölcs; nem csúszhat a torta aljára"], "h1": ["3 tejszínhab", "habkönnyű, enyhén édes; 4–8 °C-os habtejszínből vert hab (ellenőrizendő)"], "p2": ["4 piskótalap", "a második lap, szintén sziruppal nedvesítve"], "g2": ["5 gyümölcsréteg", "a második gyümölcsréteg"], "h2": ["6 tejszínhab", "a felső habréteg"], "bv": ["7 tejszínhab-bevonat", "vékony habréteg a tetején és az oldalán"], "di": ["8 díszítés", "habrózsák és friss gyümölcs a tetején"]};
function hv(root){
  const groups={};
  root.querySelectorAll('[id^="hv-"]').forEach(g=>{const k=g.id.split('-')[1];(groups[k]=groups[k]||[]).push(g);});
  const info=document.getElementById('info'), bar=root.querySelector('.bar.parts');
  function sel(k){
    for(const kk in groups) groups[kk].forEach(g=>{g.classList.toggle('dim',!!k&&kk!==k);g.classList.toggle('on',kk===k);});
    if(bar) bar.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
    info.innerHTML=k&&PARTS[k]?'<b>'+PARTS[k][0]+'</b> – '+PARTS[k][1]:(info.dataset.def||'Mutass egy részre (vagy válaszd a gombot) a magyarázathoz.');
  }
  for(const k in groups) groups[k].forEach(g=>{g.style.cursor='pointer';
    g.addEventListener('mouseenter',()=>sel(k));g.addEventListener('click',()=>sel(k));});
  root.querySelectorAll('.fig').forEach(f=>f.addEventListener('mouseleave',()=>sel(null)));
  if(bar) bar.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>sel(b.dataset.k)));
  sel(null);
}
hv(document.getElementById('root'));</script>
