<script>

const MSG=["<b>Helyes:</b> a kést teljes marokkal fogod a nyélen (1); a tartó kéz ujjai behajlítva, az ujjpercek vezetik a penge lapját (2); a deszka alatt csúszásgátló alátét (3). Átadáskor a nyél megy előre, az él lefelé néz (5).", "<b>Hibás:</b> a nyújtott ujjhegyek a penge előtt, a vágási zónában vannak (4). A kést letéve az asztal hátsó szélére, éllel befelé tedd (6)."];let CUR=0;
function show(i){CUR=i;document.querySelectorAll(".bar button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.i===i));
  document.querySelectorAll("div.fig").forEach(d=>d.hidden=(+d.dataset.i!==i));
  document.getElementById("status").innerHTML=MSG[i];}
document.querySelectorAll(".bar button").forEach(b=>b.addEventListener("click",()=>show(+b.dataset.i)));
show(0);

</script>
