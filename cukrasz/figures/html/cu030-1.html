<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Édesítőcsere-kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="s">Helyettesítő</label><select id="s" aria-label="Helyettesítő"><option value="0">fruktóz (kristályos) – RE 1,3, sz.a. 100 %</option><option value="1" selected>invertcukorszirup – RE 1, sz.a. 75 %</option><option value="2">glükózszirup – RE 0,45, sz.a. 80 %</option><option value="3">méz – RE 1, sz.a. 82 %</option><option value="4">maltit – RE 0,9, sz.a. 100 %</option><option value="5">eritrit – RE 0,7, sz.a. 100 %</option></select></div>
<div class="row"><label for="m">Kiváltandó szacharóz</label><input id="m" type="range" min="50" max="1000" step="10" value="400" aria-label="Kiváltandó szacharóz"><output id="m_o" for="m"></output></div>
<div class="row"><label for="p">Csere aránya</label><input id="p" type="range" min="0" max="100" step="5" value="100" aria-label="Csere aránya"><output id="p_o" for="p"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Édesítőcsere: 400 g szacharóz helyett 533 g 75 %-os invertcukorszirup, amely 133 g vizet visz be."></svg>
<p class="small">Képletek (cu030): m = m_szacharóz/(RE·w), m_víz = m·(1 − w). Az RE- és szárazanyag-értékek tájékoztatók (ellenőrizendő: gyártói adatlap); az édesség azonos, az állag (fagyáspont, vízkötés) eltérhet. A fejezet példája: 400 g → 533 g invertcukorszirup, 133 g víz.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"m":"g", "p":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();
const SW=[["fruktóz (kristályos)", 1.3, 1.0], ["invertcukorszirup", 1.0, 0.75], ["glükózszirup", 0.45, 0.8], ["méz", 1.0, 0.82], ["maltit", 0.9, 1.0], ["eritrit", 0.7, 1.0]];
const sw=SW[v.s], re=sw[1], w=sw[2], m=v.m, ms=m*v.p/100;
const mh=ms/(re*w), viz=mh*(1-w), s0=m, s1=m-ms+mh*w, tot1=m-ms+mh;
const top=Math.max(tot1, m, 1)*1.1, H=220, base=260, sc=H/top;
function bar(x, parts, lab){let y=base; parts.forEach(p=>{const h=p[0]*sc; if(h>0){
  el("rect",{x:x,y:y-h,width:110,height:h,fill:p[1],stroke:css("--line"),"stroke-width":1.2}); y-=h;}});
  el("text",{x:x+55,y:base+18,"text-anchor":"middle","font-size":13},lab);}
el("defs",{}).innerHTML='<pattern id="hv" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="2"/></pattern>';
bar(70, [[m,"#8c8c8c"]], "csere előtt");
bar(230, [[m-ms,"#8c8c8c"],[mh*w,"#c4c4c4"],[viz,"url(#hv)"]], "csere után");
el("text",{x:125,y:base-m*sc-6,"text-anchor":"middle","font-size":12},fmt(m,0)+" g");
el("text",{x:285,y:base-tot1*sc-6,"text-anchor":"middle","font-size":12},fmt(tot1,0)+" g");
[["#8c8c8c","maradó szacharóz"],["#c4c4c4","helyettesítő szárazanyaga"],["url(#hv)","bevitt víz"]].forEach((q,i)=>{
  el("rect",{x:360,y:60+i*28,width:22,height:16,fill:q[0],stroke:css("--line")});
  el("text",{x:388,y:73+i*28,"font-size":13},q[1]);});
status("Helyettesítő: <b>"+fmt(mh,0)+" g</b> "+sw[0]+" · bevitt víz: <b>"+fmt(viz,0)+" g</b> · szárazanyag: "+fmt(s0,0)+" g → "+fmt(s1,0)+" g (változás: "+(s1-s0>=0?"+":"")+fmt(s1-s0,0)+" g)."+(viz>0.5?" A recept folyadékát ennyivel csökkenteni kell, vagy sűrűbb szirupot kell választani.":""));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
