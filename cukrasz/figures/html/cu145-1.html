<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tömegellenőrző kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="n">Minták száma</label><input id="n" type="range" min="5" max="10" step="1" value="5" aria-label="Minták száma"><output id="n_o" for="n"></output></div>
<div class="row"><label for="m0">Előírt tömeg</label><input id="m0" type="range" min="50" max="200" step="1" value="120" aria-label="Előírt tömeg"><output id="m0_o" for="m0"></output></div>
<div class="row"><label for="tol">Tűrés</label><input id="tol" type="range" min="1" max="10" step="0.5" value="5" aria-label="Tűrés"><output id="tol_o" for="tol"></output></div>
<div class="row"><label for="m1">1. minta</label><input id="m1" type="range" min="90" max="150" step="1" value="118" aria-label="1. minta"><output id="m1_o" for="m1"></output></div>
<div class="row"><label for="m2">2. minta</label><input id="m2" type="range" min="90" max="150" step="1" value="121" aria-label="2. minta"><output id="m2_o" for="m2"></output></div>
<div class="row"><label for="m3">3. minta</label><input id="m3" type="range" min="90" max="150" step="1" value="119" aria-label="3. minta"><output id="m3_o" for="m3"></output></div>
<div class="row"><label for="m4">4. minta</label><input id="m4" type="range" min="90" max="150" step="1" value="117" aria-label="4. minta"><output id="m4_o" for="m4"></output></div>
<div class="row"><label for="m5">5. minta</label><input id="m5" type="range" min="90" max="150" step="1" value="120" aria-label="5. minta"><output id="m5_o" for="m5"></output></div>
<div class="row"><label for="m6">6. minta</label><input id="m6" type="range" min="90" max="150" step="1" value="120" aria-label="6. minta"><output id="m6_o" for="m6"></output></div>
<div class="row"><label for="m7">7. minta</label><input id="m7" type="range" min="90" max="150" step="1" value="120" aria-label="7. minta"><output id="m7_o" for="m7"></output></div>
<div class="row"><label for="m8">8. minta</label><input id="m8" type="range" min="90" max="150" step="1" value="120" aria-label="8. minta"><output id="m8_o" for="m8"></output></div>
<div class="row"><label for="m9">9. minta</label><input id="m9" type="range" min="90" max="150" step="1" value="120" aria-label="9. minta"><output id="m9_o" for="m9"></output></div>
<div class="row"><label for="m10">10. minta</label><input id="m10" type="range" min="90" max="150" step="1" value="120" aria-label="10. minta"><output id="m10_o" for="m10"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 580 280" role="img" aria-label="Öt krémes szelet tömege a 120 g ± 5 %-os tűréssávhoz képest; mind a sávon belül van."></svg>
<p class="small">Képletek: átlag = Σm/n; Δm = m − m<sub>előírt</sub>; p = Δm / m<sub>előírt</sub> · 100 %. A ±5 % tűrés csak tanulási példa (ellenőrizendő: hatályos előírások, belső szabályzat). A minták számánál nagyobb sorszámú csúszkák nem számítanak.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"n":"db", "m0":"g", "tol":"%", "m1":"g", "m2":"g", "m3":"g", "m4":"g", "m5":"g", "m6":"g", "m7":"g", "m8":"g", "m9":"g", "m10":"g"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const n=v.n, m0=v.m0, tol=v.tol, ms=[];for(let i=1;i<=n;i++)ms.push(v["m"+i]);
const avg=ms.reduce((a,b)=>a+b,0)/n, devs=ms.map(m=>m-m0);
let wi=0;devs.forEach((d,i)=>{if(Math.abs(d)>Math.abs(devs[wi]))wi=i;});
const pw=devs[wi]/m0*100, pa=(avg-m0)/m0*100, lo=m0*(1-tol/100), hi=m0*(1+tol/100);
const out=ms.filter(m=>m<lo||m>hi).length;
const R={x:60,y:20,w:440,h:230}, y0=Math.min(lo,...ms)-4, y1=Math.max(hi,...ms)+4, sy=t=>R.y+R.h-(t-y0)/(y1-y0)*R.h;
el("rect",{x:R.x,y:sy(hi),width:R.w,height:sy(lo)-sy(hi),fill:css("--grid"),opacity:0.5});
[[lo,"−"+fmt(tol,1)+" %","6 4"],[hi,"+"+fmt(tol,1)+" %","6 4"],[m0,"előírt","" ],[avg,"átlag","2 4"]].forEach(L=>{
 el("line",{x1:R.x,y1:sy(L[0]),x2:R.x+R.w,y2:sy(L[0]),stroke:css("--line"),"stroke-width":1.4,"stroke-dasharray":L[2]});
 el("text",{x:R.x+R.w+4,y:sy(L[0])+4,"font-size":11},L[1]+" "+fmt(L[0],1));});
const bw=R.w/n*0.6;
ms.forEach((m,i)=>{const x=R.x+(i+0.5)*R.w/n-bw/2, ok=m>=lo&&m<=hi;
 el("rect",{x:x,y:sy(m),width:bw,height:R.y+R.h-sy(m),fill:ok?css("--bg"):css("--bad"),stroke:css("--line"),"stroke-width":1.4,"stroke-dasharray":ok?"":"5 3"});
 el("text",{x:x+bw/2,y:sy(m)-5,"font-size":11,"text-anchor":"middle"},fmt(m,0)+" g");
 el("text",{x:x+bw/2,y:R.y+R.h+16,"font-size":11,"text-anchor":"middle"},(i+1)+".");});
el("line",{x1:R.x,y1:R.y+R.h,x2:R.x+R.w,y2:R.y+R.h,stroke:css("--line")});
status("Átlag: <b>"+fmt(avg,1)+" g</b> ("+(pa>=0?"+":"")+fmt(pa)+" %); legnagyobb abszolút eltérés: <b>"+fmt(Math.abs(devs[wi]),1)+" g</b> a "+(wi+1)+". mintán, <b>p = Δm / m<sub>előírt</sub> · 100 % = "+fmt(pw)+" %</b>. "+
 (out?'<span class="bad">'+out+' minta a tűréssávon kívül van.</span>':'<span class="ok">Minden minta a ±'+fmt(tol,1)+' %-os tűréssávon belül van.</span>'));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
