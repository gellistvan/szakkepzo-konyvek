<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tésztafelvágási rajz – kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="sh">Forma</label><select id="sh" aria-label="Forma"><option value="kor" selected>kör, négyzetes elrendezés</option><option value="kor_m">kör, eltolt (méhsejt) elrendezés</option><option value="rect">téglalap (a × 0,6a)</option><option value="tri">háromszög: téglalap átlósan (a × 1,5a)</option></select></div>
<div class="row"><label for="d">Darabméret (Ø / a)</label><input id="d" type="range" min="3" max="12" step="0.5" value="6" aria-label="Darabméret (Ø / a)"><output id="d_o" for="d"></output></div>
<div class="row"><label for="W">Lap hossza</label><input id="W" type="range" min="30" max="60" step="1" value="50" aria-label="Lap hossza"><output id="W_o" for="W"></output></div>
<div class="row"><label for="H">Lap szélessége</label><input id="H" type="range" min="20" max="40" step="1" value="30" aria-label="Lap szélessége"><output id="H_o" for="H"></output></div>
<div class="row"><label for="m">Szegély</label><input id="m" type="range" min="0" max="2" step="0.5" value="0" aria-label="Szegély"><output id="m_o" for="m"></output></div>
<div class="row"><label for="g">Darabok közti hézag</label><input id="g" type="range" min="0" max="1" step="0.1" value="0" aria-label="Darabok közti hézag"><output id="g_o" for="g"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 400" role="img" aria-label="Méretezett tésztafelvágási rajz: a téglalap lapon számozott, kivágandó darabok, méretvonalak és sraffozott hulladék."></svg>
<p class="small">A fejezet 50 × 30 cm-es lapja; Ø 6 cm, négyzetes elrendezés: 40 db, ≈ 24,6 % hulladék. Az eltolt elrendezés köröknél gyakran több darabot ad. A leeső részt egyszer, hidegen dolgozzuk vissza.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"d":"cm", "W":"cm", "H":"cm", "m":"cm", "g":"cm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const Wl=v.W, Hl=v.H, m=v.m, g=v.g, sh=v.sh, d=v.d;
let pieces=[], area=0;
if(sh==="kor"||sh==="kor_m"){
 const r=d/2;area=Math.PI*r*r;
 if(sh==="kor"){for(let y=m+r;y+r<=Hl-m+1e-9;y+=d+g)for(let x=m+r;x+r<=Wl-m+1e-9;x+=d+g)pieces.push(["c",x,y,r]);}
 else{const dy=(d+g)*Math.sqrt(3)/2;let row=0;for(let y=m+r;y+r<=Hl-m+1e-9;y+=dy,row++){const x0=m+r+(row%2?(d+g)/2:0);for(let x=x0;x+r<=Wl-m+1e-9;x+=d+g)pieces.push(["c",x,y,r]);}}
}else{
 const a=d, b=(sh==="tri"?d*1.5:d*0.6); area=sh==="tri"?a*b/2:a*b;
 for(let y=m;y+b<=Hl-m+1e-9;y+=b+g)for(let x=m;x+a<=Wl-m+1e-9;x+=a+g){if(sh==="tri"){pieces.push(["t",x,y,a,b,0]);pieces.push(["t",x,y,a,b,1]);}else pieces.push(["r",x,y,a,b]);}
}
const n=pieces.length, waste=1-n*area/(Wl*Hl);
const sc=Math.min(560/Wl,330/Hl), ox=20, oy=20;
FIG.svg.setAttribute("viewBox","0 0 "+(Wl*sc+40)+" "+(Hl*sc+60));
const defs=document.createElementNS(NS,"defs");defs.innerHTML='<pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="'+css("--muted")+'" stroke-width="1.5"/></pattern>';FIG.svg.appendChild(defs);
el("rect",{x:ox,y:oy,width:Wl*sc,height:Hl*sc,fill:"url(#hz)",stroke:css("--line"),"stroke-width":2});
pieces.forEach((p,i)=>{let e;
 if(p[0]==="c")e=el("circle",{cx:ox+p[1]*sc,cy:oy+p[2]*sc,r:p[3]*sc,fill:css("--bg"),stroke:css("--line")});
 else if(p[0]==="r")e=el("rect",{x:ox+p[1]*sc,y:oy+p[2]*sc,width:p[3]*sc,height:p[4]*sc,fill:css("--bg"),stroke:css("--line")});
 else{const x=ox+p[1]*sc,y=oy+p[2]*sc,a=p[3]*sc,b=p[4]*sc;const P=p[5]?[[x,y],[x+a,y],[x+a,y+b]]:[[x,y],[x,y+b],[x+a,y+b]];
   e=el("polygon",{points:P.map(q=>q.join(",")).join(" "),fill:css("--bg"),stroke:css("--line")});}
 if(n<=80){const c=p[0]==="c"?[p[1],p[2]]:(p[0]==="r"?[p[1]+p[3]/2,p[2]+p[4]/2]:[p[1]+p[3]*(p[5]?0.66:0.33),p[2]+p[4]*(p[5]?0.33:0.66)]);
   el("text",{x:ox+c[0]*sc,y:oy+c[1]*sc+4,"font-size":10,"text-anchor":"middle"},String(i+1));}});
el("text",{x:ox+Wl*sc/2,y:oy+Hl*sc+20,"font-size":12,"text-anchor":"middle"},fmt(Wl,0)+" × "+fmt(Hl,0)+" cm-es lap; sraffozott: hulladék");
status("Darabszám: <b>"+n+" db</b>; egy darab területe "+fmt(area,1)+" cm²; hulladék: <b>"+fmt(waste*100,1)+" %</b>"+(waste>0.35?' <span class="bad">– sok hulladék: próbálj eltolt elrendezést vagy más méretet.</span>':' <span class="ok">– elfogadható kihasználás.</span>'));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
