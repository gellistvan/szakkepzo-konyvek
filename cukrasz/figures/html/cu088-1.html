<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dagasztóvíz-hőmérséklet és jégszükséglet</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="pre">Kidolgozott példa</label><select id="pre" aria-label="Kidolgozott példa"><option value="x" selected>saját értékek</option><option value="p1">1. példa (26 °C-os tészta)</option><option value="p2">2. példa (18 °C-os tészta)</option></select></div>
<div class="row"><label for="tt">Kívánt tésztahő</label><input id="tt" type="range" min="16" max="30" step="1" value="26" aria-label="Kívánt tésztahő"><output id="tt_o" for="tt"></output></div>
<div class="row"><label for="tl">Liszt</label><input id="tl" type="range" min="10" max="30" step="1" value="20" aria-label="Liszt"><output id="tl_o" for="tl"></output></div>
<div class="row"><label for="th">Helyiség</label><input id="th" type="range" min="15" max="35" step="1" value="22" aria-label="Helyiség"><output id="th_o" for="th"></output></div>
<div class="row"><label for="ts">Súrlódás</label><input id="ts" type="range" min="5" max="15" step="1" value="10" aria-label="Súrlódás"><output id="ts_o" for="ts"></output></div>
<div class="row"><label for="m">Folyadék tömege</label><input id="m" type="range" min="100" max="2000" step="50" value="500" aria-label="Folyadék tömege"><output id="m_o" for="m"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 260" role="img" aria-label="Kalkulátor: a kívánt tésztahőmérsékletből, a liszt, a helyiség hőmérsékletéből és a súrlódási hőből számolt dagasztóvíz-hőmérséklet, negatív eredménynél a szükséges jég becsült tömege"></svg>
<p class="small">A fejezet közelítő 3×-szabálya (cu088); a jégbecslés olvadáshővel (334 kJ/kg) és c = 4,19 kJ/(kg·°C) számol, feltételezve, hogy a jég és a többi víz 0 °C-os. Tanulási közelítés, az üzemi képlet az irányadó (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"tt":"°C", "tl":"°C", "th":"°C", "ts":"°C", "m":"g"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

if(v.pre!=="x"){const P={p1:[26,20,22,10],p2:[18,22,25,12]}[v.pre];["tt","tl","th","ts"].forEach((k,i)=>{document.getElementById(k).value=P[i];});
 document.getElementById("pre").value="x";return draw();}
const tv=3*v.tt-(v.tl+v.th+v.ts), C=4.19, L=334;
const bars=[["3 × tésztahő",3*v.tt],["liszt",v.tl],["helyiség",v.th],["súrlódás",v.ts],["víz",tv]];
const Y=t=>170-t*1.6;
el("line",{x1:30,y1:Y(0),x2:540,y2:Y(0),stroke:css("--line"),"stroke-width":1.5});
el("text",{x:540,y:Y(0)-4,"font-size":11,"text-anchor":"end"},"0 °C");
bars.forEach((b,i)=>{const x=40+i*100,t=b[1];
 el("rect",{x:x,y:Math.min(Y(t),Y(0)),width:70,height:Math.abs(Y(t)-Y(0)),fill:i==4?(t<0?css("--bad"):css("--hl")):"none",opacity:i==4?0.6:1,stroke:css("--line"),"stroke-width":1.5});
 el("text",{x:x+35,y:(t>=0?Y(t)-5:Y(t)+15),"font-size":12,"text-anchor":"middle"},fmt(t,0)+" °C");
 el("text",{x:x+35,y:250,"font-size":12,"text-anchor":"middle"},b[0]);});
let h="Képlet: t<sub>víz</sub> ≈ 3·"+v.tt+" − ("+v.tl+" + "+v.th+" + "+v.ts+") = <b>"+fmt(tv,0)+" °C</b>. ";
if(tv<0){const mj=v.m*C*(-tv)/L;
 h+=(mj<v.m)?"<span class='bad'>Tiszta vízzel nem érhető el.</span> Becsült jég: <b>"+fmt(mj,0)+" g</b> a "+fmt(v.m,0)+" g folyadékból (a többi jeges, 0 °C-os víz), vagy a liszt/edény előhűtése.":
  "<span class='bad'>Jéggel sem érhető el</span>: hűtsd elő a lisztet és az edényt, vagy válassz magasabb tésztahőt.";}
else if(tv<2) h+="<span class='bad'>0–2 °C: jeges víz kell</span> (tiszta csapvízzel nem érhető el).";status(h);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
