<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fagylaltkehely és pohárkrém felépítése</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="k">Réteg</label><select id="k" aria-label="Réteg"><option value="0" selected>Mindkét termék</option><option value="1">Pohárkrém: eperöntet</option><option value="2">Pohárkrém: piskótamorzsa</option><option value="3">Pohárkrém: főzött vaníliakrém</option><option value="4">Pohárkrém: tejszínhab</option><option value="5">Pohárkrém: friss eper (fél szem)</option><option value="6">Kehely: fagylaltgombócok (3 × 50 g)</option><option value="7">Kehely: csokoládéöntet</option><option value="8">Kehely: tejszínhab</option><option value="9">Kehely: friss gyümölcs</option><option value="10">Kehely: ostya, dísz</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 400" role="img" aria-label="Üvegpohár metszete alulról felfelé gyümölcsöntettel, vaníliakrémmel, tejszínhabbal; mellette fagylaltkehely gombócokkal, öntettel és habbal."></svg>
<p class="small">Sematikus metszet; a rétegvastagság a tömeggel arányos, közelítő. Adagtömegek: a fejezet kalkulációja.</p>
