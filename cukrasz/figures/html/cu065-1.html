<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Láncolt veszteség kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="m">Végső nettó tömeg</label><input id="m" type="range" min="100" max="5000" step="10" value="800" aria-label="Végső nettó tömeg"><output id="m_o" for="m"></output></div>
<div class="row"><label for="n">Lépések száma</label><select id="n" aria-label="Lépések száma"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></div>
<div class="row"><label for="v1">1. lépés vesztesége</label><input id="v1" type="range" min="0" max="50" step="1" value="20" aria-label="1. lépés vesztesége"><output id="v1_o" for="v1"></output></div>
<div class="row"><label for="v2">2. lépés vesztesége</label><input id="v2" type="range" min="0" max="50" step="1" value="25" aria-label="2. lépés vesztesége"><output id="v2_o" for="v2"></output></div>
<div class="row"><label for="v3">3. lépés vesztesége</label><input id="v3" type="range" min="0" max="50" step="1" value="10" aria-label="3. lépés vesztesége"><output id="v3_o" for="v3"></output></div>
<div class="row"><label for="v4">4. lépés vesztesége</label><input id="v4" type="range" min="0" max="50" step="1" value="5" aria-label="4. lépés vesztesége"><output id="v4_o" for="v4"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 290" role="img" aria-label="Lépcsős oszlopsor: a bruttó tömegből lépésenként a megmaradt tömeg veszít; mellette a téves, összeadott veszteséggel számolt bruttó"></svg>
<p class="small">Alapbeállítás: a fejezet kidolgozott példája (800 g; 20 % és 25 % → 1333,3 g bruttó; téves összeadással 1454,5 g). A 4. feladat ellenőrzése: 1500 g, 35 % és 20 % → 2884,6 g ≈ 2,885 kg.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"m":"g", "v1":"%", "v2":"%", "v3":"%", "v4":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const n=+v.n, vs=[v.v1,v.v2,v.v3,v.v4].slice(0,n);
let h=1; vs.forEach(x=>h*=1-x/100);
const br=v.m/h, steps=[br]; vs.forEach(x=>steps.push(steps[steps.length-1]*(1-x/100)));
const sumv=vs.reduce((a,b)=>a+b,0), wrong=sumv<100?v.m/(1-sumv/100):NaN;
const all=[...steps]; if(isFinite(wrong)) all.push(wrong);
const mx=Math.max(...all)*1.12, H=220, y0=250, bw=60, gap=(540-(all.length)*bw)/(all.length+1);
const sy=x=>y0-x/mx*H;
el("line",{x1:20,x2:550,y1:y0,y2:y0,stroke:css("--line")});
steps.forEach((s,i)=>{const x=20+gap+(i)*(bw+gap);
  if(i>0){el("rect",{x:x,y:sy(steps[i-1]),width:bw,height:sy(s)-sy(steps[i-1]),fill:"none",stroke:css("--line"),"stroke-dasharray":"2 3"});
          el("text",{x:x+bw/2,y:sy(steps[i-1])-4,"font-size":10,"text-anchor":"middle",fill:css("--muted")},"−"+fmt(steps[i-1]-s,1));}
  el("rect",{x:x,y:sy(s),width:bw,height:y0-sy(s),fill:css("--hl"),opacity:0.65,stroke:css("--line")});
  el("text",{x:x+bw/2,y:sy(s)+15,"font-size":11,"text-anchor":"middle","font-weight":"bold"},fmt(s,1));
  el("text",{x:x+bw/2,y:y0+15,"font-size":11,"text-anchor":"middle"},i==0?"bruttó":(i+". lépés után"));
  if(i>0) el("text",{x:x+bw/2,y:y0+29,"font-size":10,"text-anchor":"middle",fill:css("--muted")},"−"+fmt(vs[i-1],0)+" %");});
if(isFinite(wrong)){const x=20+gap+steps.length*(bw+gap);
  el("rect",{x:x,y:sy(wrong),width:bw,height:y0-sy(wrong),fill:"none",stroke:css("--bad"),"stroke-width":2,"stroke-dasharray":"6 3"});
  el("text",{x:x+bw/2,y:sy(wrong)-4,"font-size":11,"text-anchor":"middle",fill:css("--bad")},fmt(wrong,1));
  el("text",{x:x+bw/2,y:y0+15,"font-size":11,"text-anchor":"middle",fill:css("--bad")},"TÉVES");
  el("text",{x:x+bw/2,y:y0+29,"font-size":10,"text-anchor":"middle",fill:css("--bad")},"összeadva");}
let t="h<sub>össz</sub> = "+vs.map(x=>fmt(1-x/100,2)).join(" · ")+" = <b>"+fmt(h,4)+"</b>; v<sub>össz</sub> = "+fmt((1-h)*100,1)+" %. Bruttó = "+fmt(v.m,0)+" g / "+fmt(h,4)+" = <b>"+fmt(br,1)+" g</b> ("+fmt(br/1000,3)+" kg).";
if(isFinite(wrong)) t+=' <span class="bad">Téves összeadással ('+fmt(sumv,0)+" %): "+fmt(wrong,1)+" g, eltérés "+fmt(wrong-br,1)+" g ("+fmt((wrong-br)/br*100,1)+" %).</span>";
else t+=' <span class="bad">Az összeadott veszteség ≥ 100 % – az összeadás itt értelmetlen eredményt adna.</span>';
status(t);
}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
