<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fagyási görbe és cukortartalom</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="S">Hozzáadott cukor</label><input id="S" type="range" min="14" max="28" step="1" value="18" aria-label="Hozzáadott cukor"><output id="S_o" for="S"></output></div>
<div class="row"><label for="Tv">Tálalási hőfok</label><input id="Tv" type="range" min="-18" max="-8" step="1" value="-12" aria-label="Tálalási hőfok"><output id="Tv_o" for="Tv"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 330" role="img" aria-label="A fagylaltkeverék nem egy hőmérsékleten fagy meg: a fagyáspont alatt a jég kiválásával a maradék oldat töményedik, ezért a hőmérséklet tovább csökken."></svg>
<p class="small">Szemléltető, ideális oldat modell (10 % ZST, 8 % zsír, 1 % egyéb, a laktóz szacharózként számolva); tanulási példa, ellenőrizendő. A valós kifagyott arány a modellnél kissé kisebb; a gyakorlati PAC-számítást a cu130 kalkulátora mutatja.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"S":"%", "Tv":"°C"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const MS=10,FA=8,OT=1;
function model(S){const W=100-S-MS-FA-OT, seq=S+0.545*MS, K=1860*seq/342+2.37*MS; return [W,K,-K/W];}
function ice(S,T){const m=model(S); return T>=m[2]?0:1-(m[1]/-T)/m[0];}
const m=model(v.S), W=m[0], K=m[1], Tf=m[2];
const R={x:60,y:20,w:470,h:240}, X=t=>R.x+t/40*R.w, Y=T=>R.y+(6-T)/26*R.h, Yf=p=>R.y+R.h-p/100*R.h;
el("line",{x1:R.x,y1:R.y+R.h,x2:R.x+R.w,y2:R.y+R.h,stroke:css("--line")});
el("line",{x1:R.x,y1:R.y,x2:R.x,y2:R.y+R.h,stroke:css("--line")});
el("line",{x1:R.x+R.w,y1:R.y,x2:R.x+R.w,y2:R.y+R.h,stroke:css("--line")});
[5,0,-5,-10,-15,-20].forEach(T=>{el("line",{x1:R.x,y1:Y(T),x2:R.x+R.w,y2:Y(T),stroke:css("--grid"),"stroke-width":0.6});
 el("text",{x:R.x-6,y:Y(T)+4,"font-size":11,"text-anchor":"end"},T+" °C");});
[0,25,50,75,100].forEach(p=>el("text",{x:R.x+R.w+6,y:Yf(p)+4,"font-size":11},p+" %"));
[0,10,20,30,40].forEach(t=>el("text",{x:X(t),y:R.y+R.h+15,"font-size":11,"text-anchor":"middle"},t));
el("text",{x:R.x+R.w/2,y:R.y+R.h+32,"font-size":12,"text-anchor":"middle"},"idő (perc; dermesztés tömörítve) – folytonos: hőmérséklet, szaggatott: kifagyott víz %");
const P=[],F=[],f1=ice(v.S,-6.5),f2=ice(v.S,-18);
for(let i=0;i<=12;i++){const t=3*i/12;P.push([t,4+(Tf-4)*t/3]);F.push([t,0]);}
for(let i=1;i<=30;i++){const t=3+7*i/30,f=f1*(t-3)/7;P.push([t,-K/(W*(1-f))]);F.push([t,100*f]);}
P.push([12,-6.5]);F.push([12,100*f1]);
for(let i=1;i<=30;i++){const t=12+28*i/30,f=f1+(f2-f1)*(1-Math.exp(-(t-12)/6))/(1-Math.exp(-28/6));P.push([t,-K/(W*(1-f))]);F.push([t,100*f]);}
el("polyline",{points:P.map(p=>X(p[0])+","+Y(p[1])).join(" "),fill:"none",stroke:css("--line"),"stroke-width":2.4});
el("polyline",{points:F.map(p=>X(p[0])+","+Yf(p[1])).join(" "),fill:"none",stroke:css("--hl"),"stroke-width":2,"stroke-dasharray":"7 4"});
el("line",{x1:R.x,y1:Y(v.Tv),x2:R.x+R.w,y2:Y(v.Tv),stroke:css("--hl2"),"stroke-width":1.4,"stroke-dasharray":"3 3"});
el("text",{x:R.x+R.w-4,y:Y(v.Tv)-5,"font-size":11,"text-anchor":"end"},"tálalás "+v.Tv+" °C");
el("circle",{cx:X(3),cy:Y(Tf),r:5,fill:css("--hl2"),stroke:css("--line")});
const fi=ice(v.S,v.Tv);
status("Kezdeti fagyáspont ≈ <b>"+fmt(Tf,1)+" °C</b>; víztartalom "+fmt(W,0)+" %. Tálalási hőfokon ("+v.Tv+" °C) a víz kb. <b>"+fmt(100*fi,0)+" %-a</b> jég, "+fmt(100-100*fi,0)+" %-a fagyatlan szirup. Több cukor → alacsonyabb fagyáspont, kevesebb jég, lágyabb fagylalt.");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
