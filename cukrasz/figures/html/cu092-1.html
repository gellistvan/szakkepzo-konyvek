<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gyúrási idő és sikérszálak (szemléltető)</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="t">Gyúrási idő</label><input id="t" type="range" min="0" max="10" step="0.5" value="1" aria-label="Gyúrási idő"><output id="t_o" for="t"></output></div>
<div class="row"><label for="fat">hideg zsiradékkal resztelve</label><input id="fat" type="checkbox" checked aria-label="hideg zsiradékkal resztelve"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="A gyúrási idő növelésével a zsiradékkal bevont lisztszemcsék között a sikérszálak hosszabbak lesznek, a tészta zsugorodik"></svg>
<p class="small">Szemléltető modell (cu092), nem mérés: a szálhossz a gyúrási idővel nő; a hideg zsiradékkal resztelt lisztben lassabban. Narancs gyűrű: zsiradékhártya, szaggatott kör: lisztszemcse, vonal: sikérszál.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"t":"perc"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();
const P=[[91.5, 216.0], [170.8, 222.7], [242.6, 216.3], [316.6, 216.8], [403.6, 220.3], [125.1, 157.2], [202.1, 155.5], [282.6, 154.5], [365.9, 152.1], [439.0, 150.1], [86.6, 93.4], [168.9, 94.6], [239.4, 89.9], [322.1, 85.8], [401.6, 89.9], [127.5, 27.5], [199.1, 28.1], [284.8, 28.0], [358.4, 30.0], [441.5, 28.5]];
const R=17, fatW=v.fat?7*(1-0.5*v.t/10):0, frac=Math.min(1,(v.fat?0.3:0.6)+v.t/10*(v.fat?0.8:0.5));
P.forEach(p=>{if(fatW>0)el("circle",{cx:p[0],cy:p[1],r:R+fatW/2,fill:"none",stroke:css("--hl2"),"stroke-width":fatW,opacity:0.7});});
const shr=Math.min(1,v.t/10)*(v.fat?1:0.6);
el("rect",{x:20,y:10,width:520,height:280,fill:"none",stroke:css("--grid")});
for(let a=0;a<P.length;a++)for(let b=a+1;b<P.length;b++){const dx=P[b][0]-P[a][0],dy=P[b][1]-P[a][1],d=Math.hypot(dx,dy);if(d>98)continue;
 const ux=dx/d,uy=dy/d,g=d-2*R,L=frac>=1?g:g*frac/2;
 if(frac>=1)el("line",{x1:P[a][0]+ux*R,y1:P[a][1]+uy*R,x2:P[b][0]-ux*R,y2:P[b][1]-uy*R,stroke:css("--line"),"stroke-width":2.5});
 else{el("line",{x1:P[a][0]+ux*R,y1:P[a][1]+uy*R,x2:P[a][0]+ux*(R+L),y2:P[a][1]+uy*(R+L),stroke:css("--line"),"stroke-width":2.5});
      el("line",{x1:P[b][0]-ux*R,y1:P[b][1]-uy*R,x2:P[b][0]-ux*(R+L),y2:P[b][1]-uy*(R+L),stroke:css("--line"),"stroke-width":2.5});}}
P.forEach(p=>{el("circle",{cx:p[0],cy:p[1],r:R,fill:css("--bg"),stroke:css("--line"),"stroke-dasharray":"2 3","stroke-width":1.5});});
if(shr>0.4){el("text",{x:30,y:155,"font-size":26},"→");el("text",{x:505,y:155,"font-size":26},"←");}
let h="Gyúrási idő: <b>"+fmt(v.t,1)+" perc</b>. ";
if(frac<0.5)h+="<span class='ok'>Rövid, megszakadt sikérszálak: omlós, porhanyós tészta.</span>";
else if(frac<1)h+="Hosszabbodó sikérszálak: a tészta kezd rugalmas lenni – ne gyúrd tovább.";
else h+="<span class='bad'>Összefüggő sikérháló: a tészta nyúlós, sütéskor zsugorodik, kemény lesz.</span>";
if(!v.fat)h+=" Zsiradékhártya nélkül a víz közvetlenül éri a sikérfehérjéket.";
status(h);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
