<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bepárlási kalkulátor: dzsem és kandírozás</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="nezet">Nézet</label><select id="nezet" aria-label="Nézet"><option value="dzsem" selected>dzsemfőzés (szárazanyag-mérleg)</option><option value="kand">kandírozás szirupfokozatai</option></select></div>
<div class="row"><label for="mg">Gyümölcspép</label><input id="mg" type="range" min="0.5" max="5" step="0.1" value="2.0" aria-label="Gyümölcspép"><output id="mg_o" for="mg"></output></div>
<div class="row"><label for="p">Pép szárazanyaga</label><input id="p" type="range" min="5" max="25" step="1" value="12" aria-label="Pép szárazanyaga"><output id="p_o" for="p"></output></div>
<div class="row"><label for="mc">Cukor</label><input id="mc" type="range" min="0" max="4" step="0.1" value="1.2" aria-label="Cukor"><output id="mc_o" for="mc"></output></div>
<div class="row"><label for="cel">Cél-Brix (szárazanyag)</label><input id="cel" type="range" min="50" max="75" step="1" value="65" aria-label="Cél-Brix (szárazanyag)"><output id="cel_o" for="cel"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 290" role="img" aria-label="A dzsemfőzés szárazanyag-mérlege: a szárazanyag változatlan, a víz egy része elpárolog."></svg>
<p class="small">A cu086 képletei és példái. A Brix-célértékek tájékoztatók (ellenőrizendő: termékcsoportra vonatkozó előírás); a kandírozás lépcsői a fejezet szerint.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"mg":"kg", "p":"%", "mc":"kg", "cel":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const dry=v.mg*v.p/100+v.mc, before=v.mg+v.mc, kesz=dry/(v.cel/100), viz=before-kesz;
if(v.nezet=="kand"){
  const S=[[30,40,"1. szirup","12–24 óra, 20–25 °C"],[50,55,"2. szirup","12–24 óra"],[70,75,"3. szirup","lassan melegítve, majd hűlni hagyjuk"]];
  const X=i=>90+i*150, Y=b=>260-b*2.6;
  el("line",{x1:60,y1:260,x2:540,y2:260,stroke:css("--line")}); el("line",{x1:60,y1:20,x2:60,y2:260,stroke:css("--line")});
  [0,20,40,60,80].forEach(b=>el("text",{x:54,y:Y(b)+4,"font-size":11,"text-anchor":"end"},b));
  S.forEach((s,i)=>{el("rect",{x:X(i),y:Y(s[1]),width:110,height:260-Y(s[1]),fill:css("--hl"),"fill-opacity":0.25+0.2*i,stroke:css("--line")});
    el("rect",{x:X(i),y:Y(s[1]),width:110,height:Y(s[0])-Y(s[1]),fill:css("--hl2"),"fill-opacity":0.6});
    el("text",{x:X(i)+55,y:Y(s[1])-8,"font-size":13,"text-anchor":"middle","font-weight":"bold"},s[0]+"–"+s[1]+" Brix");
    el("text",{x:X(i)+55,y:278,"font-size":12,"text-anchor":"middle"},s[2]);});
  el("text",{x:20,y:140,"font-size":12,transform:"rotate(-90 20 140)","text-anchor":"middle"},"Brix");
  status("<b>Kandírozás:</b> 30–40 → 50–55 → 70–75 Brix, lépésenként 12–24 óra (a fejezet szerint); a töménységet refraktométerrel ellenőrizzük. A hirtelen magas cukorkoncentráció összehúzza a sejteket – ezért fokozatosan emeljük. Végül szárítás rácson 40–50 °C-on. (Tájékoztató értékek, ellenőrizendő.)");
} else {
  const Ymax=Math.max(before,1)*1.15, H=230, Y=m=>255-m/Ymax*H;
  function bar(x,parts){let y=0;parts.forEach(p=>{el("rect",{x:x,y:Y(y+p[0]),width:120,height:Y(y)-Y(y+p[0]),fill:p[1],"fill-opacity":p[2],stroke:css("--line"),"stroke-dasharray":p[4]||""});
     if(p[0]/Ymax>0.1) el("text",{x:x+60,y:(Y(y)+Y(y+p[0]))/2+4,"font-size":12,"text-anchor":"middle"},p[3]+": "+fmt(p[0],3)+" kg"); y+=p[0];});}
  const fd=v.mg*v.p/100;
  bar(110,[[fd,css("--hl"),0.5,"gyümölcs sz.a."],[v.mc,css("--hl2"),0.5,"cukor"],[Math.max(kesz-dry,0),css("--grid"),0.8,"víz"],[Math.max(viz,0),css("--bg"),1,"elpárolog","6 4"]]);
  bar(330,[[fd,css("--hl"),0.5,"gyümölcs sz.a."],[v.mc,css("--hl2"),0.5,"cukor"],[Math.max(kesz-dry,0),css("--grid"),0.8,"víz"]]);
  el("text",{x:170,y:275,"font-size":13,"text-anchor":"middle"},"főzés előtt: "+fmt(before,3)+" kg");
  el("text",{x:390,y:275,"font-size":13,"text-anchor":"middle"},"kész: "+fmt(kesz,3)+" kg");
  el("line",{x1:100,y1:Y(dry),x2:470,y2:Y(dry),stroke:css("--line"),"stroke-dasharray":"2 3"});
  el("text",{x:476,y:Y(dry)+4,"font-size":12},"sz.a. "+fmt(dry,3)+" kg");
  const ok=viz>=0;
  status(ok?("<b>Kész dzsem: "+fmt(kesz,3)+" kg; elpárologtatandó víz: "+fmt(viz,3)+" kg.</b> m<sub>száraz</sub> = "+fmt(v.mg,2)+"·"+fmt(v.p/100,2)+" + "+fmt(v.mc,2)+" = "+fmt(dry,3)+" kg; m<sub>kész</sub> = "+fmt(dry,3)+" / "+fmt(v.cel/100,2)+" = "+fmt(kesz,3)+" kg; m<sub>víz</sub> = "+fmt(before,2)+" − "+fmt(kesz,3)+" = "+fmt(viz,3)+" kg. (Ellenőrzés: 1. számítás 2,215 / 0,985 kg; 3. feladat 2,773 / 1,227 kg.)")
     :"<span class='bad'>A kiindulási keverék szárazanyag-tartalma már a cél fölött van</span> – a cél-Brixhez víz kellene, bepárlás nem.");
}

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
