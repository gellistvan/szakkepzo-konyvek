<title>Keresd a hibát a rajzon</title><style>:root{--fg:#111;--bg:#fff;--muted:#555;--btn:#e8eefc;--btnb:#1f4e79;--hl:#d32f2f}

*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px}
button{font:inherit;padding:5px 12px;border:1.5px solid var(--btnb);background:var(--btn);color:var(--fg);border-radius:6px;cursor:pointer}

label.chk{display:inline-flex;gap:5px;align-items:center;cursor:pointer;margin-right:8px}
.card{background:#fff;border-radius:8px;padding:6px;color:#111}
.card svg{width:100%;height:auto;display:block;max-height:78vh}
#status{margin:6px 0;min-height:2.6em}
.parts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.parts button{font-size:12.5px;padding:3px 8px}
.small{font-size:12px;color:var(--muted)}
svg .hl path,svg .hl line,svg .hl polyline,svg .hl ellipse,svg .hl circle,svg .hl rect{stroke:#d32f2f!important;stroke-width:2.6px!important}
svg .hl text{fill:#d32f2f!important;font-weight:bold}
svg .hl{filter:drop-shadow(0 0 2px rgba(211,47,47,.7))}
svg .off{display:none}
.pulse{animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
svg [id^=z]{cursor:pointer} svg .found path{fill:#d32f2f!important;fill-opacity:.18!important;opacity:1!important;stroke:#d32f2f!important;stroke-width:2px!important}
#list li.ok{color:var(--fg)} #list li{color:var(--muted)}</style></head><body>

<ol id="list"></ol>
<p class="small">A rajz szándékosan hibás (gyakorlófeladat). A helyes változatot a ve039-1 mintalap mutatja.</p>
<script>
const E=[{"n": 1, "name": "vékony kontúr", "rule": "A látható kontúr (él) vastag folytonos vonal; a vékony vonal a méretezésé."}, {"n": 2, "name": "vastag méretvonal", "rule": "A méretvonal és a segédvonal vékony folytonos vonal, különben élnek látszik."}, {"n": 3, "name": "folytonos tengelyvonal", "rule": "A furat tengelyvonala (szimmetriatengely) vékony pont-vonal (lánc-vonal)."}, {"n": 4, "name": "kettős méretezés", "rule": "Egy méretet csak egyszer adunk meg: a 15 + 90 + 15 lánc és a 120-as összméret együtt túlhatározott (az összméret mellett a lánc egyik tagja elmarad, vagy zárójeles tájékoztató méret)."}, {"n": 5, "name": "hiányzó Ø jel", "rule": "Furat átmérőjénél a méretszám elé a Ø jel kerül: Ø8."}, {"n": 6, "name": "rossz méretszám", "rule": "A méretszám mindig a valós méret (50), a méretaránytól függetlenül; a 25 a rajzon mért hossz."}, {"n": 7, "name": "elálló segédvonal", "rule": "A segédvonal a kontúrnál kezdődik, és kissé túlnyúlik a méretvonalon; rés nem maradhat."}, {"n": 8, "name": "hibás méretarány a feliratmezőben", "rule": "A feliratmező a rajz tényleges méretarányát adja: M 1:2."}];
const SVG=document.getElementById("fig"),ST=document.getElementById("status"),LI=document.getElementById("list"),CNT=document.getElementById("cnt");
const found=new Set();
function render(){LI.innerHTML="";E.forEach(e=>{const li=document.createElement("li");li.value=e.n;
 if(found.has(e.n)){li.className="ok";li.innerHTML="<b>"+e.name+"</b> – "+e.rule;}else li.textContent="…";LI.appendChild(li);});
 CNT.textContent="Talált hibák: "+found.size+" / 8";}
function hit(n){const e=E.find(q=>q.n===n);found.add(n);const z=document.getElementById("z"+n);if(z)z.classList.add("found");
 ST.innerHTML="<b>Hiba "+n+": "+e.name+".</b> "+e.rule;render();if(found.size===8)ST.innerHTML+=" <b>Mind a nyolc hibát megtaláltad!</b>";}
E.forEach(e=>{const z=document.getElementById("z"+e.n);if(!z)return;z.setAttribute("tabindex","0");z.setAttribute("role","button");
 z.addEventListener("click",ev=>{ev.stopPropagation();hit(e.n);});z.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();hit(e.n);}});});
SVG.addEventListener("click",()=>{ST.textContent="Itt nincs hiba – nézd meg a vonalvastagságokat, a méretszámokat és a feliratmezőt!";});
document.getElementById("sol").addEventListener("click",()=>{E.forEach(e=>hit(e.n));ST.textContent="Az összes hiba megjelölve.";});
document.getElementById("reset").addEventListener("click",()=>{found.clear();SVG.querySelectorAll(".found").forEach(z=>z.classList.remove("found"));ST.textContent="";render();});
render();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
