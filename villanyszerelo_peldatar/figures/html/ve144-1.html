<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Váltó- és keresztkapcsolás szimulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#555;--line:#000;--cur:#d32f2f;--ok:#2e7d32;--bad:#b71c1c;--box:#f3f3f3;
--coil:#ffe0b2;--lamp:#ffd54f;--btn:#e8eefc;--btnb:#1f4e79;--grid:#d9d9d9;--brown:#8d5524;--blue:#4fb3ee;--ge1:#2e9d3a;--ge2:#f2d600}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--line:#e6e6e6;--cur:#ff8a80;--ok:#81c784;--bad:#ef9a9a;--box:#2a2a2a;
--coil:#6d4c1f;--lamp:#ffd54f;--btn:#26324a;--btnb:#8fb8e8;--grid:#4a4a4a;--brown:#b57a42;--blue:#6ec3f5;--ge1:#43b052;--ge2:#e6cf1a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
button{font:inherit;padding:6px 14px;border:1.5px solid var(--btnb);background:var(--btn);color:var(--fg);border-radius:6px;cursor:pointer;user-select:none;touch-action:manipulation}
button:hover{filter:brightness(.96)}button:focus-visible,[role=button]:focus-visible{outline:3px solid var(--btnb);outline-offset:2px}
button.on,button[aria-pressed=true]{background:var(--btnb);color:var(--bg)}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
#status{margin:6px 0;min-height:3.2em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
code,.mono{font-family:ui-monospace,Consolas,monospace}</style>
</head>

<style>.tt{border-collapse:collapse;margin:6px 0}.tt th,.tt td{border:1px solid var(--muted);padding:1px 10px;text-align:center}.tt tr.cur td{outline:2px solid var(--btnb);font-weight:bold}</style>
<div class="bar"><button id="bm">Keresztkapcsolás (3 kapcsoló)</button><button id="b1">S1 átbillentése</button>
<button id="bc">Keresztkapcsoló átbillentése</button><button id="b3">Utolsó váltó átbillentése</button>

<div id="st" aria-live="polite"></div>
<svg id="v" role="img" aria-label="Váltó- és keresztkapcsolás: a fázis S1 közös pontjáról a két váltóvezetéken át az utolsó váltókapcsoló közös pontjáig és a lámpáig"></svg>
<div id="tt"></div>
<p class="small">Barna: fázis és váltóvezetékek, világoskék: N, zöld-sárga: PE (a lámpatestre). A piros jelölés a zárt áramút. A jelölések a fejezet 2–3. példájáé (keresztkapcsolásnál S2 a keresztkapcsoló, S3 a második váltó). Szemléltető rajz.</p>

   t.addEventListener("click",fn);t.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fn();}});};
 const q3c=(st.cross?8.3:6.3)+1.2;
 hot(2.1,4,"S1 váltókapcsoló átbillentése",()=>{st.s1=3-st.s1;render();});
 hot(q3c-0.6,4,(st.cross?"S3":"S2")+" váltókapcsoló átbillentése",()=>{st.s3=3-st.s3;render();});
 if(st.cross)hot(5.5,4,"S2 keresztkapcsoló átbillentése",()=>{st.c=1-st.c;render();});
 // igazságtábla
 const rows=[];let h="<table class='tt'><tr><th>S1</th>"+(st.cross?"<th>S2 (kereszt)</th><th>S3</th>":"<th>S2</th>")+"<th>E1</th></tr>";
 [1,2].forEach(a=>[0,1].forEach(c=>{if(!st.cross&&c)return;[1,2].forEach(b=>{const k=""+st.cross+a+c+b+st.sw,on=ST[k].on,cur=a===st.s1&&b===st.s3&&(!st.cross||c===st.c);
   h+="<tr"+(cur?" class='cur'":"")+"><td>"+a+"</td>"+(st.cross?"<td>"+(c?"kereszt":"egyenes")+"</td>":"")+"<td>"+b+"</td><td>"+(on?"ég":"–")+"</td></tr>";});}));
 document.getElementById("tt").innerHTML=h+"</table>";
 document.getElementById("st").innerHTML="E1: <b>"+(S0.on?'<span class="ok">ég</span>':"nem ég")+"</b>. "+
   (st.sw?'<span class="bad">A váltóvezetékek felcserélve:</span> a kapcsolás továbbra is működik (bármelyik kapcsoló vált), csak az igazságtábla fordul meg. ':"")+
   "Kattints a kapcsolókra a rajzon vagy a gombokra.";
 document.getElementById("bm").textContent=st.cross?"Váltókapcsolás (2 kapcsoló)":"Keresztkapcsolás (3 kapcsoló)";
 document.getElementById("bc").disabled=!st.cross;
 document.getElementById("bs").setAttribute("aria-pressed",st.sw===1);}
document.getElementById("b1").addEventListener("click",()=>{st.s1=3-st.s1;render();});
document.getElementById("b3").addEventListener("click",()=>{st.s3=3-st.s3;render();});
document.getElementById("bc").addEventListener("click",()=>{st.c=1-st.c;render();});
document.getElementById("bm").addEventListener("click",()=>{st.cross=1-st.cross;st.c=0;render();});
document.getElementById("bs").addEventListener("click",()=>{st.sw=1-st.sw;render();});
render();

matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(typeof render==="function")render();});
