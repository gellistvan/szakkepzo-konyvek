<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testáram-kalkulátor és áram–idő pont</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="U">U<sub>t</sub> érintési fesz.</label><input id="U" type="range" min="10" max="400" step="0.5" value="70.5" aria-label="U<sub>t</sub> érintési fesz."><output id="U_o" for="U"></output></div>
<div class="row"><label for="rt">testimpedancia</label><select id="rt" aria-label="testimpedancia"><option value="1000" selected>kedvezőtlen, nedves: 1000 Ω</option><option value="dry">száraz, 50 %-os érték U<sub>t</sub> szerint (ellenőrizendő)</option><option value="own">egyéni (csúszka)</option></select></div>
<div class="row"><label for="R">egyéni R<sub>test</sub></label><input id="R" type="range" min="500" max="5000" step="50" value="1000" aria-label="egyéni R<sub>test</sub>"><output id="R_o" for="R"></output></div>
<div class="row"><label for="st">lábbeli + állóhely</label><select id="st" aria-label="lábbeli + állóhely"><option value="0" selected>0 Ω</option><option value="1000">1 kΩ</option><option value="20000">20 kΩ</option><option value="100000">100 kΩ</option></select></div>
<div class="row"><label for="prot">védelem</label><select id="prot" aria-label="védelem"><option value="none">nincs</option><option value="oc" selected>túláramvédelem (idő a csúszkán)</option><option value="rcd">30 mA-es FI</option></select></div>
<div class="row"><label for="tk">kioldási idő (túláram)</label><input id="tk" type="range" min="0.01" max="5" step="0.01" value="0.1" aria-label="kioldási idő (túláram)"><output id="tk_o" for="tk"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 370" role="img" aria-label="Kalkulátor: érintési feszültség, testimpedancia, lábbeli és védelem alapján a testáram és a pont helye a c1 görbéhez képest"></svg>
<p class="small">I<sub>test</sub> = U<sub>t</sub> / (R<sub>test</sub> + R<sub>St</sub>). A száraz testimpedancia-értékek (25 V 3250 Ω, 50 V 2500 Ω, 100 V 1725 Ω, 230 V 1350 Ω) és a c1 négy pontja közelítő, a FI kioldási idők (300/150/40 ms) az MSZ EN 61008-1 szerintiek – mind ellenőrizendő (IEC 60479-1). Szemléltetés, nem méretezés.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"U":"V", "R":"Ω", "tk":"s"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const C1=[[40, 5000], [50, 1000], [400, 100], [500, 10]],RCD=[[30, 300], [60, 150], [150, 40]],DRY=[[25,3250],[50,2500],[100,1725],[230,1350]];
function c1ms(i){if(i<C1[0][0])return null;if(i>=C1[C1.length-1][0])return C1[C1.length-1][1];
 for(let k=1;k<C1.length;k++){const a=C1[k-1],b=C1[k];if(i<=b[0]){const f=(Math.log(i)-Math.log(a[0]))/(Math.log(b[0])-Math.log(a[0]));return Math.exp(Math.log(a[1])+f*(Math.log(b[1])-Math.log(a[1])));}}}
function dry(u){if(u<=DRY[0][0])return DRY[0][1];if(u>=DRY[3][0])return DRY[3][1];for(let k=1;k<4;k++){if(u<=DRY[k][0]){const f=(Math.log(u)-Math.log(DRY[k-1][0]))/(Math.log(DRY[k][0])-Math.log(DRY[k-1][0]));return DRY[k-1][1]+f*(DRY[k][1]-DRY[k-1][1]);}}}
const Rt=v.rt==="own"?v.R:(v.rt==="dry"?dry(v.U):1000),I=v.U/(Rt+(+v.st)),Ima=I*1000;
let t=null,tl="";
if(v.prot==="oc"){t=v.tk*1000;tl="túláramvédelem: "+fmt(v.tk,2)+" s";}
else if(v.prot==="rcd"){if(Ima<30){t=null;tl="30 mA-es FI: 30 mA alatt nem old ki";}else{t=Ima<60?300:Ima<150?150:40;tl="30 mA-es FI: legfeljebb "+t+" ms";}}
else tl="nincs védelem: az áramütés addig tart, amíg a személy el nem engedi (nem jelölhető)";
const tc=c1ms(Ima);
const L=70,R=620,T=15,B=330,X=i=>L+(Math.log10(Math.max(i,1))-0)/(4-0)*(R-L),Y=ms=>B-(Math.log10(ms)-1)/3*(B-T);
el("rect",{x:L,y:T,width:R-L,height:B-T,fill:"none",stroke:css("--line")});
[1,10,100,1000,10000].forEach(i=>{el("line",{x1:X(i),y1:T,x2:X(i),y2:B,stroke:css("--grid")});el("text",{x:X(i),y:B+16,"text-anchor":"middle","font-size":12},String(i));});
[10,100,1000,10000].forEach(m=>{el("line",{x1:L,y1:Y(m),x2:R,y2:Y(m),stroke:css("--grid")});el("text",{x:L-6,y:Y(m)+4,"text-anchor":"end","font-size":12},String(m));});
el("text",{x:(L+R)/2,y:B+34,"text-anchor":"middle","font-size":12},"testáram (mA, log)");el("text",{x:16,y:(T+B)/2,"text-anchor":"middle","font-size":12,transform:"rotate(-90 16 "+(T+B)/2+")"},"idő (ms, log)");
const cp=C1.concat([[40,10000]]).sort((a,b)=>a[1]-b[1]);
el("polyline",{points:cp.map(p=>X(p[0])+","+Y(p[1])).join(" "),fill:"none",stroke:css("--line"),"stroke-width":2.4});
el("text",{x:X(40)+6,y:T+14,"font-size":12,"font-weight":"bold"},"c1");
RCD.forEach(r=>el("rect",{x:X(r[0])-4,y:Y(r[1])-4,width:8,height:8,fill:css("--hl2")}));
el("text",{x:X(150)+8,y:Y(40)+4,"font-size":11},"FI-pontok");
let ok=null;
if(t!==null){const xx=X(Ima),yy=Y(Math.min(Math.max(t,10),10000));ok=(tc===null)||t<tc;
 el("circle",{cx:xx,cy:yy,r:8,fill:ok?css("--ok"):css("--bad"),stroke:css("--line"),"stroke-width":1.5});
 el("text",{x:xx+12,y:yy-10,"font-size":12,"font-weight":"bold"},fmt(Ima,1)+" mA; "+fmt(t/1000,2)+" s");}
else{el("line",{x1:X(Ima),y1:T,x2:X(Ima),y2:B,stroke:css("--bad"),"stroke-width":2,"stroke-dasharray":"6 4"});}
const eff=Ima<0.5?"érzékelési küszöb alatt":Ima<10?"bizsergés, izomösszehúzódás (elengedési határ környéke)":Ima<30?"fájdalmas görcs, a kéz nem tudja elengedni":Ima<50?"légzőizmok görcse, légzési nehézség":"a fibrilláció veszélye, az idő függvényében";
status("<b>R<sub>test</sub> = "+fmt(Rt,0)+" Ω, I<sub>test</sub> = "+fmt(Ima,1)+" mA</b> – "+eff+".<br>"+(tc===null?"40 mA alatt: a c1 görbét (közelítő pontok) nem éri el.":"c1-idő ≈ "+fmt(tc/1000,2)+" s. ")+" "+tl+(ok===null?"":(ok?' → <span class="ok">a pont a c1 alatt</span>':' → <span class="bad">a pont a c1 felett (AC-4)</span>')));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
