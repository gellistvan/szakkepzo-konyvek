<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Járműrelé kapcsai és működése</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="be">12 V a tekercsre (86 +, 85 test)</label><input id="be" type="checkbox" aria-label="12 V a tekercsre (86 +, 85 test)"></div>
<div class="row"><label for="pin">Kapocs kiemelése</label><select id="pin" aria-label="Kapocs kiemelése"><option value="" selected>–</option><option value="30">30</option><option value="85">85</option><option value="86">86</option><option value="87">87</option><option value="87a">87a</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 280" role="img" aria-label="Mini relé alulnézete 30, 85, 86, 87, 87a kapcsokkal és belső kapcsolási képe; tekercs- és érintkezőmérés."></svg>
<p class="small">Kapocsjelölés a DIN 72552 szerinti gyakorlat alapján; a lábkiosztás és a tekercsellenállás tanulási példa, a konkrét relé adatlapja szerint ellenőrizendő. A pinre kattintva vagy rámutatva megjelenik a funkciója.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const L=css("--line"),F=css("--fg"),H=css("--hl2");
const FUNC={"30":"közös kapocs (tápellátás, +12 V a biztosítón át)","85":"tekercs egyik vége (jellemzően test vagy vezérlő)","86":"tekercs másik vége (vezérlő +)","87":"munkaérintkező (záró): behúzott relénél kapcsolódik a 30-hoz","87a":"nyugvóérintkező (bontó): elengedett relénél kapcsolódik a 30-hoz"};
const ln=(x1,y1,x2,y2,w,c,da)=>el("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:c||L,"stroke-width":w||2.2,"stroke-linecap":"round","stroke-dasharray":da||""});
// alulnézet
el("rect",{x:30,y:40,width:200,height:200,rx:14,fill:"none",stroke:L,"stroke-width":2.2});
el("text",{x:130,y:30,"font-size":13,"text-anchor":"middle"},"alulnézet (példa)");
const P={"87":[105,80,1],"87a":[105,140,1],"30":[105,200,1],"85":[52,140,0],"86":[208,140,0]};
for(const k in P){const [x,y,h]=P[k],w=h?50:14,hh=h?14:50,on=(v.pin===k);
  const r=el("rect",{x:x-w/2,y:y-hh/2,width:w,height:hh,fill:on?H:css("--grid"),stroke:L,"stroke-width":on?3:1.5,tabindex:0,style:"cursor:pointer"});
  const t=document.createElementNS(NS,"title");t.textContent=k+": "+FUNC[k];r.appendChild(t);
  r.addEventListener("click",()=>{document.getElementById("pin").value=k;draw();});
  el("text",{x:h?x+32:x,y:h?y+5:y+42,"font-size":14,"font-weight":"bold","text-anchor":h?"start":"middle"},k);}
// belső kapcsolás
const X=300;
el("rect",{x:X,y:100,width:40,height:80,fill:v.be?H:"none",stroke:L,"stroke-width":2.2});ln(X,180,X+40,100,1.4);
ln(X+20,60,X+20,100);ln(X+20,180,X+20,230);
el("text",{x:X+20,y:52,"font-size":14,"text-anchor":"middle","font-weight":v.pin==="86"?"bold":"normal"},"86");
el("text",{x:X+20,y:250,"font-size":14,"text-anchor":"middle","font-weight":v.pin==="85"?"bold":"normal"},"85");
const C=X+170;
ln(C,230,C,170);ln(C-30,60,C-30,120);ln(C+30,60,C+30,120);ln(C-30,120,C-18,120);ln(C+30,120,C+18,120);
el("text",{x:C,y:250,"font-size":14,"text-anchor":"middle","font-weight":v.pin==="30"?"bold":"normal"},"30");
el("text",{x:C-30,y:52,"font-size":14,"text-anchor":"middle","font-weight":v.pin==="87a"?"bold":"normal"},"87a");
el("text",{x:C+30,y:52,"font-size":14,"text-anchor":"middle","font-weight":v.pin==="87"?"bold":"normal"},"87");
const tx=v.be?C+18:C-18;ln(C,170,tx,120,3.2,v.be?css("--ok"):L);el("circle",{cx:C,cy:170,r:4,fill:L});
ln(X+40,145,C-8,145,1.4,L,"6 4");
let m=v.be?"<b>Behúzott relé:</b> a tekercsen áram folyik, a 30–87 munkaérintkező zár (folytonosság ≈ 0 Ω), a 30–87a bont. Kattanás hallható.":
"<b>Elengedett relé (alapállapot):</b> a 30–87a nyugvóérintkező zár, a 30–87 nyitott. Tekercsellenállás 85–86 között feszültségmentesen mérhető (pl. 50–150 Ω, ellenőrizendő: gyártói adat).";
if(v.pin)m+="<br>Kapocs <b>"+v.pin+"</b>: "+FUNC[v.pin]+".";
status(m);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
