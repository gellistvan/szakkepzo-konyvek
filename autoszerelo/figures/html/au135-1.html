<title>Gázelemző és füstölésmérő a járművön</title><style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--box:#f3f3f3}

.spot{fill:transparent;stroke:transparent;stroke-width:3;cursor:pointer}

.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}select,button{font:inherit}
.small{font-size:12px;color:var(--muted)}</style></head><body>

<p class="small">Sematikus vonalrajz; a behelyezési mélységet, a ciklusszámot és a határértékeket a gyártó és a hatályos előírás adja (ellenőrizendő).</p>
<script>
const R=[{"r": [216.3, 350.5, 136.1, 24.7], "label": "1 Mintavevő szonda", "info": "Rozsdamentes cső a kipufogócsőben, legalább a gyártói mélységig betolva. Tipikus hiba: túl kicsi bevezetés → a kívülről beszívott levegő hígítja a mintát, a CO₂ alacsony, az O₂ hamisan magas.", "tags": []}, {"r": [338.0, 346.3, 20.6, 28.9], "label": "2 Rögzítő csipesz", "info": "A szondát a csővéghez rögzíti, hogy mérés közben ne csússzon ki. Tipikus hiba: rögzítés nélkül a szonda kicsúszik, a minta hirtelen levegős lesz.", "tags": []}, {"r": [360.6, 247.4, 20.6, 86.6], "label": "3 Mintavevő tömlő", "info": "A forró gázt a műszerhez vezeti. Tipikus hiba: megtört vagy lyukas tömlő → hamis légbeszívás, a szivárgásvizsgálat ezt mutatja ki.", "tags": []}, {"r": [459.6, 218.5, 28.9, 66.0], "label": "4 Kondenzvíz-leválasztó", "info": "A kipufogógáz vízgőzét kicsapatja, hogy a víz ne jusson a mérőcellákba. Tipikus hiba: tele leválasztó → víz a cellákban, instabil értékek.", "tags": []}, {"r": [492.6, 181.4, 28.9, 33.0], "label": "5 Szűrő", "info": "A kormot és szennyeződést szűri a minta útjából. Tipikus hiba: eldugult szűrő → lassú válasz, kevés mintaáram (a műszer áramlási hibát jelez).", "tags": []}, {"r": [451.4, 74.2, 99.0, 90.7], "label": "6 Gázelemző", "info": "NDIR-cellák (CO, CO₂, HC), elektrokémiai O₂-cella, λ-számítás. Mérés előtt nullázás tiszta levegővel és szivárgásvizsgálat.", "tags": []}, {"r": [113.2, 181.4, 41.2, 33.0], "label": "7 Fordulatszám-jeladó", "info": "A fordulatszámot adja a műszernek (vagy OBD-ről olvassuk). Tipikus hiba: a 2500 1/min-es mérési pont nincs betartva.", "tags": []}, {"r": [171.0, 206.1, 24.7, 33.0], "label": "8 Olajhőmérő-szonda", "info": "A nívópálca helyére dugva az üzemi hőmérsékletet ellenőrzi. Tipikus hiba: hideg motor mérése → hamisan magas CO és HC.", "tags": []}, {"r": [335.9, 305.1, 70.1, 86.6], "label": "9 Elszívó tölcsér", "info": "A kipufogógázt elvezeti a műhelyből; járó motor csak elszívással vizsgálható. A szonda a tölcséren belül, a csőben van.", "tags": []}, {"r": [700.2, 269.4, 114.4, 84.8], "label": "1 Rész-áramú mintavevő szonda", "info": "A kipufogógáz egy részét a mérőkamrába vezeti; a gáziránynak megfelelően kell behelyezni. Tipikus hiba: fordított vagy kicsúszott szonda → alacsony, hamis füstérték.", "tags": []}, {"r": [763.8, 210.0, 169.5, 59.3], "label": "2 Mérőkamra", "info": "A gáz egy ismert hosszúságú fényúton halad át; minél sötétebb a füst, annál kevesebb fény jut a vevőbe. Tipikus hiba: kormos ablak → mérés előtt nullázás tiszta levegővel.", "tags": []}, {"r": [738.3, 222.7, 27.5, 33.9], "label": "3 Fényforrás", "info": "Zöld vagy vörös LED, a fénysugár átvilágítja a kamrát.", "tags": []}, {"r": [931.2, 222.7, 27.5, 33.9], "label": "4 Vevő (érzékelő)", "info": "A beérkező fény intenzitásából a műszer opacitást és k-értéket (1/m) számol.", "tags": []}, {"r": [920.6, 104.1, 101.7, 76.3], "label": "5 Füstölésmérő kijelző", "info": "Ciklusonkénti k-érték és az értékelt ciklusok átlaga; a fordulatszám-ellenőrzés a nem megfelelő gázadást elveti.", "tags": []}, {"r": [607.0, 61.7, 84.8, 114.4], "label": "6 Szabadgyorsítás", "info": "A gázpedált egyszer, gyorsan és teljesen lenyomjuk, majd felengedjük; a ciklust az előírt számban ismételjük. Tipikus hiba: lassú gázadás → alacsonyabb füst, a szoftver elvetheti.", "tags": []}];
