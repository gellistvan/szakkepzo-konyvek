<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hibahatár-kalkulátor: pontossági osztály és méréshatár</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="x">Mért érték x</label><input id="x" type="range" min="0.5" max="30" step="0.01" value="12.46" aria-label="Mért érték x"><output id="x_o" for="x"></output></div>
<div class="row"><label for="k">Analóg pontossági osztály</label><input id="k" type="range" min="0.5" max="2.5" step="0.5" value="1.5" aria-label="Analóg pontossági osztály"><output id="k_o" for="k"></output></div>
<div class="row"><label for="M">Analóg méréshatár</label><input id="M" type="range" min="2" max="50" step="1" value="20" aria-label="Analóg méréshatár"><output id="M_o" for="M"></output></div>
<div class="row"><label for="a">Digitális: a % rdg</label><input id="a" type="range" min="0.1" max="2" step="0.1" value="0.5" aria-label="Digitális: a % rdg"><output id="a_o" for="a"></output></div>
<div class="row"><label for="n">Digitális: n digit</label><input id="n" type="range" min="0" max="10" step="1" value="2" aria-label="Digitális: n digit"><output id="n_o" for="n"></output></div>
<div class="row"><label for="r">Felbontás</label><input id="r" type="range" min="0.001" max="0.1" step="0.001" value="0.01" aria-label="Felbontás"><output id="r_o" for="r"></output></div>
<div class="row"><label for="D">Digitális méréshatár</label><input id="D" type="range" min="2" max="50" step="1" value="20" aria-label="Digitális méréshatár"><output id="D_o" for="D"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Relatív mérési hiba a mért érték függvényében: analóg műszernél a skála alján meredeken nő, digitális műszernél közel állandó."></svg>
<p class="small">A fejezet példái: 1,5 osztály, 20 V → 5 V-nál 6 %; 1,5 osztály, 30 V → 10 V-nál 4,5 %; DMM ±(0,5 % + 2 digit), 10 mV felbontás, 12,46 V → ±0,08 V (12,38–12,54 V). A műszeradatok tanulási példák; a valódi pontosság a gyártói kézikönyvben.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"x":"V", "k":"", "M":"V", "a":"%", "n":"digit", "r":"V", "D":"V"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const X0=60,X1=540,Y0=290,Y1=20,XM=Math.max(v.M,v.D)*1.05,YM=20;
const X=x=>X0+(X1-X0)*x/XM, Y=y=>Y0-(Y0-Y1)*Math.min(y,YM)/YM;
// sraffozott sáv: az analóg skála felső kétharmada
el("rect",{x:X(v.M/3),y:Y1,width:X(v.M)-X(v.M/3),height:Y0-Y1,fill:css("--grid"),opacity:.45});
el("line",{x1:X0,y1:Y0,x2:X1,y2:Y0,stroke:css("--line"),"stroke-width":1.5});
el("line",{x1:X0,y1:Y0,x2:X0,y2:Y1,stroke:css("--line"),"stroke-width":1.5});
const st=XM>30?10:5;
for(let t=0;t<=XM;t+=st){el("line",{x1:X(t),y1:Y0,x2:X(t),y2:Y0+4,stroke:css("--line")});el("text",{x:X(t),y:Y0+16,"font-size":11,"text-anchor":"middle"},fmt(t,0));}
for(let t=0;t<=YM;t+=5){el("line",{x1:X0-4,y1:Y(t),x2:X0,y2:Y(t),stroke:css("--line")});el("text",{x:X0-7,y:Y(t)+4,"font-size":11,"text-anchor":"end"},fmt(t,0));}
el("text",{x:(X0+X1)/2,y:Y0+32,"font-size":12,"text-anchor":"middle"},"mért érték x (V)");
el("text",{x:14,y:(Y0+Y1)/2,"font-size":12,"text-anchor":"middle",transform:"rotate(-90 14 "+(Y0+Y1)/2+")"},"relatív hibahatár (%)");
let pa="",pd="";
for(let i=0;i<=200;i++){const x=Math.max(0.3,v.M*i/200);pa+=(i?"L":"M")+X(x)+" "+Y(v.k/100*v.M/x*100);}
for(let i=0;i<=200;i++){const x=Math.max(0.3,v.D*i/200);pd+=(i?"L":"M")+X(x)+" "+Y((v.a/100*x+v.n*v.r)/x*100);}
el("path",{d:pa,fill:"none",stroke:css("--fg"),"stroke-width":2.4});
el("path",{d:pd,fill:"none",stroke:css("--hl2"),"stroke-width":2.4,"stroke-dasharray":"2 4"});
const dA=v.k/100*v.M, dD=v.a/100*v.x+v.n*v.r, okA=v.x<=v.M, okD=v.x<=v.D;
if(okA){el("circle",{cx:X(v.x),cy:Y(dA/v.x*100),r:5,fill:css("--bg"),stroke:css("--fg"),"stroke-width":2});}
if(okD){el("rect",{x:X(v.x)-5,y:Y(dD/v.x*100)-5,width:10,height:10,fill:css("--bg"),stroke:css("--hl2"),"stroke-width":2});}
el("line",{x1:X1-200,y1:34,x2:X1-170,y2:34,stroke:css("--fg"),"stroke-width":2.4});el("text",{x:X1-164,y:38,"font-size":11},"analóg (folytonos)");
el("line",{x1:X1-200,y1:52,x2:X1-170,y2:52,stroke:css("--hl2"),"stroke-width":2.4,"stroke-dasharray":"2 4"});el("text",{x:X1-164,y:56,"font-size":11},"digitális (pontozott)");
let h="";
h+= okA ? "Analóg: ΔU = ±"+fmt(dA,3)+" V, δ = <b>"+fmt(dA/v.x*100,2)+" %</b>, tartomány "+fmt(v.x-dA,2)+"–"+fmt(v.x+dA,2)+" V"+(v.x<v.M/3?" <span class='bad'>(a skála alsó harmadában: válassz kisebb méréshatárt)</span>":" <span class='ok'>(felső kétharmad)</span>")
     : "<span class='bad'>Analóg: a mért érték nagyobb a méréshatárnál – túlterhelés!</span>";
h+="<br>";
h+= okD ? "Digitális: ΔU = ±"+fmt(dD,3)+" V, δ = <b>"+fmt(dD/v.x*100,2)+" %</b>, tartomány "+fmt(v.x-dD,2)+"–"+fmt(v.x+dD,2)+" V"
     : "<span class='bad'>Digitális: a kijelző túlcsordul (OL) – nagyobb méréshatár kell.</span>";
status(h);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
