<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A kiegyensúlyozatlanság fajtái</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="typ">Típus</label><select id="typ" aria-label="Típus"><option value="0" selected>statikus</option><option value="1">kvázistatikus</option><option value="2">nyomaték (páros)</option><option value="3">dinamikus</option></select></div>
<div class="row"><label for="n">Fordulatszám n</label><input id="n" type="range" min="100" max="1600" step="50" value="800" aria-label="Fordulatszám n"><output id="n_o" for="n"></output></div>
<div class="row"><label for="m">Tömeg m</label><input id="m" type="range" min="5" max="60" step="1" value="20" aria-label="Tömeg m"><output id="m_o" for="m"></output></div>
<div class="row"><label for="r">Sugár r</label><input id="r" type="range" min="0.15" max="0.35" step="0.01" value="0.31" aria-label="Sugár r"><output id="r_o" for="r"></output></div>
<div class="row"><label for="anim">Lassított forgás</label><input id="anim" type="checkbox" checked aria-label="Lassított forgás"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 300" role="img" aria-label="Forgó kerék tengelymetszete négy kiegyensúlyozatlansági típussal; centrifugális erő a fordulatszám szerint"></svg>
<p class="small">A képlet és az 1. példa (20 g, r = 0,31 m, 800 1/min → 43,5 N) a fejezetből. Az animációban az elmozdulás és a billenés mértéke szemléltető, nem méretarányos.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"n":"1/min", "m":"g", "r":"m"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const T=[[[0, 1.75, 1.0, 0], [0, -1.75, 1.0, 1]], [[0.75, 1.75, 1.0, 0], [0.75, -1.75, 1.0, 1]], [[-0.75, 1.75, 1.0, 0], [0.75, -1.75, 1.0, 0], [-0.75, -1.75, 1.0, 1], [0.75, 1.75, 1.0, 1]], [[-0.75, 1.75, 1.0, 0], [0.75, -1.75, 0.6, 0], [-0.75, -1.75, 1.0, 1], [0.75, 1.75, 0.6, 1]]], NM=["statikus", "kvázistatikus", "nyomaték (páros)", "dinamikus"], MO=["„ugrál” (függőleges rezgés)", "„ugrál” és enyhén billeg; egy ellensúly ugyanabban a síkban", "„billeg” (a súlypont a tengelyen)", "„ugrál + billeg”; két ellensúly két síkban"];
if(v.anim&&!FIG.timer)FIG.timer=setInterval(draw,60);
if(!v.anim&&FIG.timer){clearInterval(FIG.timer);FIG.timer=null;}
const ph=v.anim?(performance.now()/1000*2*Math.PI*0.5):0.6;
el("rect",{x:0,y:0,width:600,height:300,fill:"#fff"});
const ms=T[+v.typ], cx=200, cy=145, S=45;
// eredő: statikus rész (függőleges elmozdulás) és nyomaték (billenés) a pillanatnyi szög szerint
let fy=0, mom=0; ms.forEach(p=>{if(!p[3]){const yy=Math.sign(p[1])*Math.cos(ph)*p[2];fy+=yy;mom+=yy*p[0];}});
const dy=-fy*10, tilt=-mom*12;
const g=document.createElementNS("http://www.w3.org/2000/svg","g");g.setAttribute("transform","translate(0,"+dy+") rotate("+tilt+" "+cx+" "+cy+")");FIG.svg.appendChild(g);
const add=(tag,a)=>{const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const k in a)e.setAttribute(k,a[k]);g.appendChild(e);return e;};
add("rect",{x:cx-S,y:cy-2.2*S,width:2*S,height:4.4*S,rx:20,fill:"#ddd",stroke:"#000"});
add("rect",{x:cx-0.9*S,y:cy-1.35*S,width:1.8*S,height:2.7*S,fill:"#fff",stroke:"#000"});
add("line",{x1:cx-2.2*S,x2:cx+2.2*S,y1:cy,y2:cy,stroke:"#000","stroke-dasharray":"8 3 2 3"});
[-0.75,0.75].forEach(x=>add("line",{x1:cx+x*S,x2:cx+x*S,y1:cy-2.4*S,y2:cy+2.4*S,stroke:"#888","stroke-dasharray":"4 3"}));
ms.forEach(p=>{const y=cy-Math.sign(p[1])*1.75*S*Math.cos(ph), front=Math.sign(p[1])*Math.sin(ph)>0;
  if(p[3])return;
  add("circle",{cx:cx+p[0]*S,cy:y,r:7*Math.sqrt(p[2]),fill:front?"#c55a11":"#7a3a0b",stroke:"#000"});});
el("text",{x:cx-0.75*S-12,y:294,"font-size":11,"text-anchor":"middle",fill:"#000"},"belső sík");
el("text",{x:cx+0.75*S+12,y:294,"font-size":11,"text-anchor":"middle",fill:"#000"},"külső sík");
const F=v.m/1000*v.r*Math.pow(2*Math.PI*v.n/60,2);
el("text",{x:370,y:60,"font-size":15,fill:"#000","font-weight":"bold"},NM[+v.typ]);

el("text",{x:370,y:130,"font-size":12,fill:"#000"},"ω = 2πn/60 = "+fmt(2*Math.PI*v.n/60,1)+" rad/s");
el("text",{x:370,y:155,"font-size":12,fill:"#000"},"F = m·r·ω² = "+fmt(F,1)+" N");
el("text",{x:370,y:180,"font-size":12,fill:"#000"},"(≈ "+fmt(F/9.81,1)+" kg súlyerő)");
status("<b>"+NM[+v.typ]+"</b>: "+MO[+v.typ]+". A rezgés amplitúdója a rajzon szemléltető; az erő a fordulatszám négyzetével nő (kétszeres n → négyszeres F).");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
