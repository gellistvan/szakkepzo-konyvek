<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homogén és rétegzett keverékképzés</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="mode">Üzemmód</label><select id="mode" aria-label="Üzemmód"><option value="h" selected>homogén (szívóütem)</option><option value="r">rétegzett (sűrítés vége)</option></select></div>
<div class="row"><label for="ang">Főtengelyszög</label><input id="ang" type="range" min="0" max="720" step="5" value="90" aria-label="Főtengelyszög"><output id="ang_o" for="ang"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 580 430" role="img" aria-label="Hengermetszet a dugattyú mozgásával, az injektor sugarával és a keverék eloszlásával a főtengelyszög függvényében; alatta a 0–720°-os skála a befecskendezési ablakkal."></svg>
<p class="small">Szemléltető modell: a befecskendezési ablakok (homogén 60–120°, rétegzett 300–320°) és a gyújtási szög példaértékek (ellenőrizendő: gyártói adat).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"ang":"°"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const W0=({h:[60,120],r:[300,320]})[v.mode], ang=v.ang, inj=(ang>=W0[0]&&ang<=W0[1]);
const drop=a=>{const t=a*Math.PI/180;return 1.0*(1-Math.cos(t))+3.4-Math.sqrt(3.4*3.4-Math.pow(1.0*Math.sin(t),2));};
const ox=150, top=60, sc=40, yP=top+18+sc*1.6*drop(ang)/1.0;
const ink=css("--fg"), mute=css("--muted"), hl=css("--hl2");
// keverék állapota
let mix="";
if(v.mode==="h"){ if(ang>W0[0]&&ang<360) mix="egyenletes"; }
else { if(ang>W0[0]&&ang<350) mix="felhő"; }
if(ang>=350&&ang<420) mix="égés";
el("rect",{x:ox,y:top,width:200,height:yP-top,fill:mix==="egyenletes"?"#bdbdbd":"none",opacity:0.55});
if(mix==="felhő"){el("ellipse",{cx:ox+100,cy:top+22,rx:52,ry:20,fill:"#555",opacity:0.75});
  el("ellipse",{cx:ox+100,cy:top+22,rx:80,ry:32,fill:"none",stroke:ink,"stroke-dasharray":"5 4"});}
if(mix==="égés"){el("ellipse",{cx:ox+100,cy:top+26,rx:90,ry:Math.max(10,(yP-top)/2-4),fill:hl,opacity:0.45});}
el("rect",{x:ox-14,y:top,width:14,height:260,fill:"none",stroke:ink,"stroke-width":2});
el("rect",{x:ox+200,y:top,width:14,height:260,fill:"none",stroke:ink,"stroke-width":2});
el("rect",{x:ox-14,y:top-30,width:228,height:30,fill:"none",stroke:ink,"stroke-width":2});
el("rect",{x:ox+2,y:yP,width:196,height:60,fill:"none",stroke:ink,"stroke-width":2});
el("path",{d:`M${ox+60} ${yP} L${ox+72} ${yP+16} L${ox+128} ${yP+16} L${ox+140} ${yP}`,fill:"none",stroke:ink,"stroke-width":1.5});
el("rect",{x:ox+94,y:top-34,width:12,height:40,fill:"none",stroke:ink,"stroke-width":1.5});
el("text",{x:ox+120,y:top-40,"font-size":12},"gyertya");
el("path",{d:`M${ox} ${top+4} L${ox-50} ${top-36} L${ox-40} ${top-46} L${ox} ${top-12} Z`,fill:"none",stroke:ink,"stroke-width":1.5});
el("text",{x:ox-110,y:top-50,"font-size":12},"injektor");
if(inj){ const sp=v.mode==="h"?[[-55,120],[-40,120],[-25,120]]:[[-30,60],[-18,60],[-6,60]];
  sp.forEach(([a,l])=>{const t=a*Math.PI/180;el("line",{x1:ox+2,y1:top+2,x2:ox+2+l*Math.cos(t),y2:top+2-l*Math.sin(t),stroke:hl,"stroke-width":2.5,"stroke-dasharray":"4 3"});});}
if(ang>=350-4&&ang<=350+8){el("text",{x:ox+100,y:top+12,"text-anchor":"middle","font-size":20,fill:hl},"✱");}
// skála
const x0=40,x1=540,ys=380,sx=a=>x0+(x1-x0)*a/720;
el("line",{x1:x0,y1:ys,x2:x1,y2:ys,stroke:ink,"stroke-width":1.5});
[0,90,180,270,360,450,540,630,720].forEach(a=>{el("line",{x1:sx(a),y1:ys-5,x2:sx(a),y2:ys+5,stroke:ink});
  el("text",{x:sx(a),y:ys+20,"text-anchor":"middle","font-size":11},a+"°");});
[["szívás",90],["sűrítés",270],["munka",450],["kipufogás",630]].forEach(([n,a])=>el("text",{x:sx(a),y:ys-10,"text-anchor":"middle","font-size":12},n));
el("rect",{x:sx(W0[0]),y:ys+26,width:Math.max(3,sx(W0[1])-sx(W0[0])),height:10,fill:hl});
el("line",{x1:sx(350),y1:ys-14,x2:sx(350),y2:ys+14,stroke:ink,"stroke-width":3});
el("line",{x1:sx(ang),y1:ys-30,x2:sx(ang),y2:ys+40,stroke:hl,"stroke-width":2});
const stroke=["szívóütem","sűrítési ütem","munkaütem","kipufogóütem"][Math.min(3,Math.floor(ang/180))];
status(`<b>${fmt(ang,0)}°</b> – ${stroke}. `+(inj?`<span class="ok">Befecskendezés folyik</span> (ablak: ${W0[0]}–${W0[1]}°). `:"")+
 (v.mode==="h"?"Homogén üzem: a hosszú keveredési idő alatt egyenletes keverék, λ ≈ 1.":"Rétegzett üzem: a gyújtás előtt a gyertyánál dús felhő, máshol szegény keverék; globális λ 1,5–4.")+
 (ang>=350-4&&ang<=350+8?" <b>Gyújtás.</b>":""));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
