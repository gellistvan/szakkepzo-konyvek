function qshow(){const c=CASES[qi];document.getElementById('qres').textContent='';
 document.getElementById('qcase').innerHTML='Mérési eredmény: kompresszió <b>'+c[1]+'</b>, olajpróba után <b>'+c[2]+'</b>, a levegő <b>'+c[3]+'</b> hallható.';}
const qb=document.getElementById('qbtn');
Object.keys(NAMES).forEach((k,j)=>{const b=document.createElement('button');b.textContent=NAMES[k];b.onclick=()=>{
 const ok=k===CASES[qi][0];document.getElementById('qres').textContent=ok?'✓ Helyes – a rajzon kiemelve az út.':'✗ Nem ez – nézd meg a „hol hallható” és az olajpróba összefüggését.';
 if(ok)show(j);};qb.appendChild(b);});
document.getElementById('qnext').onclick=()=>{qi=(qi+1+Math.floor(Math.random()*3))%CASES.length;qshow();};
qi=Math.floor(Math.random()*CASES.length);qshow();
show(0);
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
