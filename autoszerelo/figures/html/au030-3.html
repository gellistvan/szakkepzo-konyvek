<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Féktárcsa ütésmérése mérőórával</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="a">Elfordulás</label><input id="a" type="range" min="0" max="360" step="5" value="0" aria-label="Elfordulás"><output id="a_o" for="a"></output></div>
<div class="row"><label for="r">A tárcsa tényleges ütése</label><input id="r" type="range" min="0" max="0.12" step="0.01" value="0.04" aria-label="A tárcsa tényleges ütése"><output id="r_o" for="r"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Féktárcsa négy vastagságmérési ponttal; mérőóra a tárcsa homlokfelületén az ütésméréshez."></svg>
<p class="small">Szemléltető szimuláció: a mutató a beállított ütésnek megfelelően tér ki; a leolvasott max − min különbség az ütés. A 0,05 mm-es határ a munkalap példája (ellenőrizendő a gyártói adat szerint).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"a":"°", "r":"mm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const R=v.r, A=v.a, fg="#000";
el("rect",{x:0,y:0,width:560,height:300,fill:"#fff"});
const T=(x,y,t,o)=>el("text",Object.assign({x:x,y:y,"font-size":12,"text-anchor":"middle",fill:"#000"},o||{}),t);
const d=th=>R/2*Math.sin((th-60)*Math.PI/180);
// tárcsa elölnézet, forgó jelöléssel
el("circle",{cx:110,cy:150,r:95,fill:"#eee",stroke:fg,"stroke-width":2});el("circle",{cx:110,cy:150,r:45,fill:"#fff",stroke:fg});
const hx=110+70*Math.cos((A-90)*Math.PI/180), hy=150+70*Math.sin((A-90)*Math.PI/180);
el("circle",{cx:hx,cy:hy,r:7,fill:"#555"});T(110,268,"elfordulás: "+A+"°");
el("circle",{cx:110,cy:62,r:5,fill:"#c55a11"});T(110,40,"tapintó helye",{"font-size":11});
// mérőóra
const cx=290,cy=120,val=d(A),ang=val*360*100/100;
el("circle",{cx:cx,cy:cy,r:70,fill:"#fff",stroke:fg,"stroke-width":2});
for(let i=0;i<100;i+=2){const t=i*3.6*Math.PI/180;el("line",{x1:cx+62*Math.sin(t),y1:cy-62*Math.cos(t),x2:cx+(i%10?56:50)*Math.sin(t),y2:cy-(i%10?56:50)*Math.cos(t),stroke:fg});}
[0,10,20,30,40,50].forEach(i=>{const t=i*3.6*Math.PI/180;T(cx+40*Math.sin(t),cy-40*Math.cos(t)+4,String(i===0?0:i),{"font-size":10});});
[10,20,30,40].forEach(i=>{const t=-i*3.6*Math.PI/180;T(cx+40*Math.sin(t),cy-40*Math.cos(t)+4,String(i),{"font-size":10});});
const pa=val*100*3.6*Math.PI/180;el("line",{x1:cx,y1:cy,x2:cx+58*Math.sin(pa),y2:cy-58*Math.cos(pa),stroke:"#c55a11","stroke-width":3});
el("circle",{cx:cx,cy:cy,r:4,fill:fg});T(cx,cy+92,"0,01 mm/osztás; 0 = nullázott állás",{"font-size":11});
// görbe
const X0=390,X1=550,Y0=150,K=1500,Xa=t=>X0+(X1-X0)*t/360;
el("line",{x1:X0,y1:Y0,x2:X1,y2:Y0,stroke:"#999"});el("line",{x1:X0,y1:Y0-60,x2:X0,y2:Y0+60,stroke:"#999"});
let p="",mn=1,mx=-1;for(let t=0;t<=A;t+=2){const q=d(t);mn=Math.min(mn,q);mx=Math.max(mx,q);p+=(t?"L":"M")+Xa(t)+" "+(Y0-q*K);}
if(p)el("path",{d:p,fill:"none",stroke:fg,"stroke-width":2});
T((X0+X1)/2,Y0+80,"kitérés az elfordulás szerint",{"font-size":11});
const u=mx-mn, ok=u<=0.05+1e-9;
status("Mutató most: <b>"+fmt(val,3).replace("-","−")+" mm</b>; eddigi max: "+fmt(mx,3).replace("-","−")+" mm, min: "+fmt(mn,3).replace("-","−")+" mm → ütés = <b>"+fmt(u,3)+" mm</b>"+
 (A>=360?(ok?" <span class='ok'>≤ 0,05 mm: megfelel (példahatár, ellenőrizendő).</span>":" <span class='bad'>> 0,05 mm: esztergálás vagy csere a gyártói utasítás szerint.</span>"):" – forgassa körbe a tárcsát (360°)!"));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
