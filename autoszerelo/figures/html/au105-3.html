.fr.on{display:block}
.fr svg{display:block;width:100%;height:auto;max-height:420px}
.fr text{fill:#111}
g.part{cursor:pointer}
g.hl path,g.hl use{stroke:#c55a11 !important;stroke-width:3px !important}
.small{font-size:12px;color:var(--muted)}
</style>

<p class="small">Sematikus felülnézet, nem méretarányos. A gyújtási sorrend és a hengerpárok a négyhengeres soros motor gyakori kiosztása (ellenőrizendő: gyártói adat). Mutass rá egy elemre a nevéért.</p>
<script>
const MODE="buttons", MSG=["<b>Elosztós rendszer:</b> egy gyújtótekercs; a nagyfeszültséget az elosztóforgó osztja a gyújtási sorrend szerint. Mérés: gyújtókábel-ellenállás, elosztófej repedés/kúszóáram, szekunder gyújtáskép. <b>Járó motornál a kábelt és az elosztót érinteni tilos.</b>", "<b>Páros tekercs (wasted spark):</b> két tekercs, mindkettő két hengert lát el (1–4, 2–3); egyszerre két szikra – az egyik a kompresszió végén gyújt, a másik a kipufogóütemben „pazarló”. Mérés: primer- és szekunder-ellenállás, kimenetpáronként összehasonlítva; az egyik pár hibája két hengeren okoz kimaradást.", "<b>Hengerenkénti ceruzatekercs (COP):</b> minden gyertyán saját tekercs, nincs gyújtókábel. Mérés: hengerenként tekercscsere (áthelyezés) a hiba vándorlásának vizsgálatára, primer áramkép oszcilloszkóppal, a csatlakozó táp- és testellenőrzése; a szilikonszoknya repedése kúszóáramot okoz."], PARTS={"fej": "hengerfej, felülnézet", "gy": "gyertyafurat a gyújtógyertyával", "kab": "nagyfeszültségű gyújtókábel", "tek": "gyújtótekercs (elosztós rendszer)", "eloszto": "elosztófej kivezetésekkel", "forgo": "elosztóforgó", "dis": "páros tekercsblokk: két tekercs, négy nagyfeszültségű kimenet", "cop": "ceruzatekercs a gyertyafuratban", "csat": "kisfeszültségű csatlakozó (táp, vezérlés, test)", "kot": "kábelköteg – csak kisfeszültség", "haz": "tekercsház", "mag": "vasmag", "prim": "primer tekercs", "szek": "szekunder tekercs", "szoknya": "szilikon csatlakozószoknya (a gyertya fejére húzva)"}, LABELS=["Elosztós", "Páros tekercs (DIS)", "Ceruzatekercs (COP)"];
const FR=[...document.querySelectorAll(".fr")], ST=document.getElementById("status");
let k=0, timer=null;
function show(i){k=Math.max(0,Math.min(FR.length-1,i));FR.forEach((f,j)=>f.classList.toggle("on",j===k));
  document.querySelectorAll("button[data-i]").forEach(b=>b.classList.toggle("on",+b.dataset.i===k));
  const r=document.getElementById("pos");if(r){r.value=k;}
  const c=document.getElementById("cnt");if(c){c.textContent=(MODE==="slider"?LABELS[k]:(k+1)+"/"+FR.length);}
  ST.innerHTML=MSG[k]||"";}
function stop(){if(timer){clearInterval(timer);timer=null;}const p=document.getElementById("play");if(p)p.textContent="▶ Lejátszás";}
document.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{stop();show(+b.dataset.i);});
const B=id=>document.getElementById(id);
if(B("first")){B("first").onclick=()=>{stop();show(0);};B("prev").onclick=()=>{stop();show(k-1);};B("next").onclick=()=>{stop();show(k+1);};
  B("play").onclick=()=>{if(timer){stop();return;}if(k>=FR.length-1)show(0);B("play").textContent="⏸ Szünet";
    timer=setInterval(()=>{if(k>=FR.length-1)stop();else show(k+1);},1800);};}
if(B("pos"))B("pos").oninput=()=>{stop();show(+B("pos").value);};
document.querySelectorAll("g[id]").forEach(g=>{const m=g.id.match(/_p_([A-Za-z0-9]+)$/);if(!m||!(m[1] in PARTS))return;
  g.classList.add("part");const t=document.createElementNS("http://www.w3.org/2000/svg","title");t.textContent=PARTS[m[1]];g.prepend(t);
  const on=()=>{document.querySelectorAll("g.part").forEach(x=>{const mm=x.id.match(/_p_([A-Za-z0-9]+)$/);x.classList.toggle("hl",mm&&mm[1]===m[1]);});ST.innerHTML="<b>"+PARTS[m[1]]+"</b>";};
  g.addEventListener("mouseenter",on);g.addEventListener("click",on);g.addEventListener("focus",on);
  g.addEventListener("mouseleave",()=>{document.querySelectorAll("g.part.hl").forEach(x=>x.classList.remove("hl"));ST.innerHTML=MSG[k]||"";});});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){stop();show(k+1);}if(e.key==="ArrowLeft"){stop();show(k-1);}});

show(0);
</script>
