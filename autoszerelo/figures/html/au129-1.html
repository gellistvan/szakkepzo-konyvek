<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A gyári adattábla leolvasása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#555;--hl:#1f4e79;--bd:#bbb}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--bd:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:4px}
button.on{outline:2px solid var(--hl);font-weight:bold}
#status{margin:4px 0 6px;min-height:2.9em}
#info{min-height:2.6em;margin:6px 0;padding:4px 8px;border-left:3px solid var(--hl)}
#stage{background:#fff;border:1px solid var(--bd);border-radius:6px;padding:4px}
#stage svg{width:100%;height:auto;display:block}
#stage svg text{fill:#000}
#stage [id^="pt__"]{cursor:pointer}
#stage .hl path,#stage path.hl{stroke:#c55a11 !important;stroke-width:3px !important}
#stage .hl text,#stage text.hl{fill:#c55a11 !important;font-weight:bold}
.small{font-size:12px;color:var(--muted)}
input[type=text]{font:16px ui-monospace,monospace;padding:3px 6px;width:min(100%,22em)}
</style></head><body>
<div class="ctl" id="nav" role="group" aria-label="Nézetek"></div>
<div id="status" aria-live="polite"></div>
<div id="stage" role="img" aria-label="Gyári adattábla a VIN-nel, az össztömeggel, a szerelvény-össztömeggel és a két tengely megengedett terhelésével; mellette a forgalmi engedély megfelelő mezői."></div>
<div id="info" aria-live="polite" class="small">Mutass rá (vagy koppints) egy kiemelhető részre: megjelenik a neve és a magyarázata.</div>
<fieldset style="margin:6px 0"><legend>Vontatható tömeg (kalkulátor)</legend>

<div id="vres" style="margin-top:6px;font-weight:bold" aria-live="polite"></div></fieldset>

const PARTS = {"tipus": ["Gyártó", "a gyártó neve (a mintán kitalált)"], "jovahagy": ["Típusjóváhagyási szám", "az EU-típusjóváhagyás száma; a mintán kitalált"], "vin": ["VIN", "karakterenként egyeztetjük a forgalmi engedéllyel és a beütött számmal"], "r1": ["Megengedett legnagyobb össztömeg", "a forgalmi engedély F.1 mezőjével vetjük össze (ellenőrizendő)"], "r2": ["Szerelvény-össztömeg", "a jármű és a pótkocsi együttes megengedett tömege (F.3 mező, ellenőrizendő)"], "r3": ["1. tengely megengedett terhelése", "a forgalmi engedélyben a tengelyterhelés adata"], "r4": ["2. tengely megengedett terhelése", "a két tengely összege nagyobb is lehet, mint az össztömeg"], "fe": ["Forgalmi engedély mezői", "F.1 össztömeg, F.3 szerelvény-össztömeg, O.1 / O.2 vontatható tömeg fékezett / fékezetlen pótkocsival (ellenőrizendő: hatályos okmányminta)"]};
const MODE = "tabs";
let k = 0, timer = null;
const nav = document.getElementById("nav"), stage = document.getElementById("stage"),
      status = document.getElementById("status"), info = document.getElementById("info");
function keyOf(id){const m = /^pt__(.+)__\d+$/.exec(id || ""); return m ? m[1] : null;}
function hl(key, on){stage.querySelectorAll('[id^="pt__' + key + '__"]').forEach(g => {
  g.classList.toggle("hl", on); g.querySelectorAll("path,text").forEach(x => x.classList.toggle("hl", on));});}
function bindParts(){
  stage.querySelectorAll('[id^="pt__"]').forEach(g => {
    const key = keyOf(g.id); if (!key || !PARTS[key]) return;
    g.setAttribute("tabindex", "0");
    const showInfo = () => { stage.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")); hl(key, true);
      info.innerHTML = "<b>" + PARTS[key][0] + "</b> – " + PARTS[key][1]; };
    g.addEventListener("mouseenter", showInfo); g.addEventListener("focus", showInfo); g.addEventListener("click", showInfo);
    g.addEventListener("mouseleave", () => hl(key, false));
  });
}
function show(i){
  k = Math.max(0, Math.min(VIEWS.length - 1, i));
  stage.innerHTML = VIEWS[k].svg; status.innerHTML = VIEWS[k].msg || "";
  nav.querySelectorAll("button.v").forEach((b, j) => b.classList.toggle("on", j === k));
  const c = document.getElementById("cnt"); if (c) c.textContent = (k + 1) + "/" + VIEWS.length;
  bindParts(); if (typeof onView === "function") onView(k);
}
function stop(){ if (timer){clearInterval(timer); timer = null;} const p = document.getElementById("play"); if (p) p.textContent = "▶ Lejátszás"; }
function btn(txt, f, cls){const b = document.createElement("button"); b.textContent = txt; b.onclick = f; if (cls) b.className = cls; nav.appendChild(b); return b;}
if (MODE === "steps" && VIEWS.length > 1){
  btn("⏮", () => {stop(); show(0);}); btn("◀ Lépés", () => {stop(); show(k - 1);});
  const p = btn("▶ Lejátszás", () => { if (timer){stop(); return;} if (k >= VIEWS.length - 1) show(0);
    p.textContent = "⏸ Szünet"; timer = setInterval(() => { if (k >= VIEWS.length - 1) stop(); else show(k + 1); }, 3500); });
  p.id = "play"; btn("Lépés ▶", () => {stop(); show(k + 1);});
  const s = document.createElement("span"); s.id = "cnt"; s.className = "small"; nav.appendChild(s);
  document.addEventListener("keydown", e => { if (e.key === "ArrowRight"){stop(); show(k + 1);} if (e.key === "ArrowLeft"){stop(); show(k - 1);} });
} else if (VIEWS.length > 1) {
  VIEWS.forEach((v, j) => btn(v.label, () => show(j), "v"));
}
function vcalc(){const mo=+document.getElementById('mo').value, ms=+document.getElementById('ms').value, o1=+document.getElementById('o1').value;
 const r=document.getElementById('vres'), f=x=>String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
 if(ms<=mo){r.textContent='A szerelvény-össztömeg nem lehet kisebb az össztömegnél – ellenőrizd a leolvasást.';return;}
 const v=ms-mo, m=Math.min(v,o1);
 r.textContent='Szerelvény − össztömeg = '+f(ms)+' − '+f(mo)+' = '+f(v)+' kg; a fékezett pótkocsi határával együtt a mérvadó: '+f(m)+' kg.';}
['mo','ms','o1'].forEach(i=>document.getElementById(i).addEventListener('input',vcalc)); vcalc();
show(0);
