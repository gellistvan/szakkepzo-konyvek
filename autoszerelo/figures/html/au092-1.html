<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megállásiút-kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="v0">Kezdősebesség v₀</label><input id="v0" type="range" min="10" max="150" step="5" value="50" aria-label="Kezdősebesség v₀"><output id="v0_o" for="v0"></output></div>
<div class="row"><label for="tr">Reakcióidő t_r</label><input id="tr" type="range" min="0.5" max="2.5" step="0.1" value="1.0" aria-label="Reakcióidő t_r"><output id="tr_o" for="tr"></output></div>
<div class="row"><label for="tk">Fékkésedelem t_k</label><input id="tk" type="range" min="0" max="0.6" step="0.05" value="0" aria-label="Fékkésedelem t_k"><output id="tk_o" for="tk"></output></div>
<div class="row"><label for="zz">Fékhatás z (útviszony)</label><select id="zz" aria-label="Fékhatás z (útviszony)"><option value="0.8" selected>z = 0,8 (száraz, jó fék)</option><option value="0.7">z = 0,7</option><option value="0.5">z = 0,5 (nedves)</option><option value="0.2">z = 0,2 (havas/jeges)</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Reakcióút, fékút és megállási út a kezdősebesség, a reakcióidő, a fékkésedelem és a fékhatás függvényében; sebesség–idő diagram"></svg>
<p class="small">Ellenőrző esetek: 50 km/h, t_r = 1,0 s, z = 0,8 → 26,2 m; 100 km/h, t_r = 1,2 s, z = 0,7 → 89,5 m. Egyenletes lassulás; a fékkésedelem alatt teljes sebességgel számolva. A z értékek tanulási példák (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"v0":"km/h", "tr":"s", "tk":"s"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const vm=v.v0/3.6, t0=v.tr+v.tk, z=+v.zz, a=z*9.81, sr=vm*t0, sb=vm*vm/(2*a), tb=vm/a, T=t0+tb;
// v–t diagram
const X0=50,X1=530,Y0=40,Y1=200, tmax=Math.max(8,Math.ceil(T)), vmax=45;
const X=t=>X0+(X1-X0)*t/tmax, Y=u=>Y1-(Y1-Y0)*u/vmax;
el("line",{x1:X0,y1:Y1,x2:X1,y2:Y1,stroke:css("--line")});el("line",{x1:X0,y1:Y1,x2:X0,y2:Y0-10,stroke:css("--line")});
for(let t=0;t<=tmax;t+=1)el("text",{x:X(t),y:Y1+14,"font-size":10,"text-anchor":"middle"},t);
[0,10,20,30,40].forEach(u=>el("text",{x:X0-6,y:Y(u)+4,"font-size":10,"text-anchor":"end"},u));
el("text",{x:X0,y:Y0-16,"font-size":11},"v (m/s)");el("text",{x:X1,y:Y1+28,"font-size":11,"text-anchor":"end"},"t (s)");
el("path",{d:"M"+X(0)+" "+Y1+"L"+X(0)+" "+Y(vm)+"L"+X(t0)+" "+Y(vm)+"L"+X(t0)+" "+Y1+"Z",fill:"#e6e6e6",stroke:"none"});
el("path",{d:"M"+X(t0)+" "+Y1+"L"+X(t0)+" "+Y(vm)+"L"+X(T)+" "+Y1+"Z",fill:"#a6a6a6",stroke:"none"});
el("path",{d:"M"+X(0)+" "+Y(vm)+"L"+X(t0)+" "+Y(vm)+"L"+X(T)+" "+Y1,fill:"none",stroke:css("--fg"),"stroke-width":2.5});
el("text",{x:(X(0)+X(t0))/2,y:Y(vm/2),"font-size":11,"text-anchor":"middle"},"reakció");
el("text",{x:(X(t0)*2+X(T))/3,y:Y(vm/3),"font-size":11,"text-anchor":"middle"},"fékezés");
// út-sáv
const tot=sr+sb, W=480, sc=W/Math.max(100,tot);
el("rect",{x:50,y:240,width:sr*sc,height:22,fill:"#e6e6e6",stroke:css("--line")});
el("rect",{x:50+sr*sc,y:240,width:sb*sc,height:22,fill:"#a6a6a6",stroke:css("--line")});
el("text",{x:50,y:282,"font-size":11},"0 m");el("text",{x:50+tot*sc,y:282,"font-size":11,"text-anchor":"middle"},fmt(tot,1)+" m");
status("v₀ = "+fmt(vm,2)+" m/s; lassulás a = z·g = "+fmt(a,2)+" m/s². Reakcióút <b>"+fmt(sr,1)+" m</b> (a v–t diagram világos területe), "+
 "tiszta fékút <b>"+fmt(sb,1)+" m</b> (sötét háromszög), <b>megállási út "+fmt(tot,1)+" m</b>, megállási idő "+fmt(T,2)+" s.");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
