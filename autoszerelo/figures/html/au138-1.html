<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tolószög és összetartás</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="th">Tolószög θ</label><input id="th" type="range" min="-0.5" max="0.5" step="0.01" value="0.3" aria-label="Tolószög θ"><output id="th_o" for="th"></output></div>
<div class="row"><label for="L">Tengelytáv L</label><input id="L" type="range" min="2300" max="3200" step="10" value="2700" aria-label="Tengelytáv L"><output id="L_o" for="L"></output></div>
<div class="row"><label for="de">Összetartási szög δ</label><input id="de" type="range" min="0" max="0.5" step="0.01" value="0.17" aria-label="Összetartási szög δ"><output id="de_o" for="de"></output></div>
<div class="row"><label for="D">Mérőperem-átmérő D</label><input id="D" type="range" min="330" max="430" step="1" value="381" aria-label="Mérőperem-átmérő D"><output id="D_o" for="D"></output></div>
<div class="row"><label for="x">Rajzi nagyítás (szög)</label><input id="x" type="range" min="5" max="20" step="1" value="15" aria-label="Rajzi nagyítás (szög)"><output id="x_o" for="x"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 340" role="img" aria-label="Felülnézet: szimmetriatengely, geometriai menetirány, tolószög és az első tengely oldalirányú eltérése; összetartás mm-ben"></svg>
<p class="small">A képletek és a példák (θ = 0,30°, L = 2700 mm → 14,1 mm; δ = 0°10' ≈ 0,17°, D = 381 mm → 1,11 mm) a fejezetből. A rajz felülnézet, a szögek túlzottak; a valós tűrésmezőt a gyártói adat adja.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"th":"°", "L":"mm", "de":"°", "D":"mm", "x":"×"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

el("rect",{x:0,y:0,width:600,height:340,fill:"#fff"});
const T=(a)=>Math.tan(a*Math.PI/180), th=v.th, dyv=v.L*T(th), sv=v.D*T(v.de), A=th*v.x;
const cx=160, yr=270, yf=90, tw=70, K=(yr-yf);
el("rect",{x:cx-60,y:50,width:120,height:260,rx:24,fill:"none",stroke:"#666"});
el("line",{x1:cx,x2:cx,y1:30,y2:325,stroke:"#000","stroke-width":1.5});
el("text",{x:cx+4,y:336,"font-size":11,fill:"#000"},"szimmetriatengely");
const W=(x,y,a)=>{el("rect",{x:x-7,y:y-20,width:14,height:40,fill:"#bbb",stroke:"#000",transform:"rotate("+a+" "+x+" "+y+")"});};
const c=Math.cos(A*Math.PI/180), s=Math.sin(A*Math.PI/180);
W(cx-tw*c,yr-tw*s,A);W(cx+tw*c,yr+tw*s,A);
el("line",{x1:cx-tw*c,y1:yr-tw*s,x2:cx+tw*c,y2:yr+tw*s,stroke:"#000"});
W(cx-tw,yf,0);W(cx+tw,yf,0);el("line",{x1:cx-tw,x2:cx+tw,y1:yf,y2:yf,stroke:"#000"});
const tx=T(A);el("line",{x1:cx,y1:yr,x2:cx+(yr-20)*tx,y2:20,stroke:"#1f4e79","stroke-width":2,"stroke-dasharray":"7 4"});
el("text",{x:cx+(yr-20)*tx+(th>=0?6:-6),y:24,"font-size":11,fill:"#1f4e79","text-anchor":th>=0?"start":"end"},"geometriai menetirány");
el("line",{x1:cx,x2:cx+K*tx,y1:yf-24,y2:yf-24,stroke:"#c55a11","stroke-width":3});
el("text",{x:cx+K*tx/2,y:yf-30,"font-size":11,fill:"#c55a11","text-anchor":"middle"},"Δy");
// összetartás
const ox=470, oy=170, B=v.de*v.x;
el("line",{x1:ox,x2:ox,y1:40,y2:300,stroke:"#000"});el("text",{x:ox+4,y:36,"font-size":11,fill:"#000"},"menetirány");
el("rect",{x:ox-16,y:oy-100,width:32,height:200,fill:"#ddd",stroke:"#000",transform:"rotate("+(-B)+" "+ox+" "+oy+")"});
const sb=Math.sin(B*Math.PI/180)*100;
el("line",{x1:ox,x2:ox-sb,y1:oy-100*Math.cos(B*Math.PI/180),y2:oy-100*Math.cos(B*Math.PI/180),stroke:"#c55a11","stroke-width":3});
el("text",{x:ox,y:325,"font-size":11,fill:"#000","text-anchor":"middle"},"jobb első kerék összetartása (felülnézet)");
status("Δy = L·tan θ = "+fmt(v.L,0)+" mm · tan "+fmt(th,2)+"° = <b>"+fmt(dyv,1)+" mm</b> az első tengelynél. "+
 (th>0?"A geometriai menetirány a rajzon jobbra mutat el a szimmetriatengelytől: a jármű jobbra húzna, egyenes menetben a kormány ferdén áll.":th<0?"A geometriai menetirány a rajzon balra mutat el: a jármű balra húzna, a kormány ferdén áll.":"A geometriai menetirány egybeesik a szimmetriatengellyel.")+
 "<br>Összetartás: s = D·tan δ = "+fmt(v.D,0)+" mm · tan "+fmt(v.de,2)+"° = <b>"+fmt(sv,2)+" mm</b> (ugyanaz a szög nagyobb mérőperemen több mm). A rajzi szögek "+fmt(v.x,0)+"-szorosan túlzottak.");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
