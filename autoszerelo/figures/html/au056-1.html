<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indikátordiagram és elméleti Otto-körfolyamat</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="e">Sűrítési arány ε</label><input id="e" type="range" min="6" max="14" step="0.5" value="10" aria-label="Sűrítési arány ε"><output id="e_o" for="e"></output></div>
<div class="row"><label for="zoom">Nyomástengely</label><select id="zoom" aria-label="Nyomástengely"><option value="lin" selected>lineáris (teljes)</option><option value="zoom">nagyított alsó tartomány (0–2 bar)</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 360" role="img" aria-label="Szövegesen elmagyarázott p–V diagram: elméleti Otto-ciklus és valós indikátordiagram"></svg>
<p class="small">Szemléltető, kitalált tanulási adatok, nem mért értékek: az elméleti ciklus szívási nyomása 0,9 bar, az égés nyomásaránya 3 (példa); a valós görbe a fejezet chart adatsora (ε = 10). Valódi motoradat a gyártói leírásból.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"e":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const K=1.4,P1=0.9,VM=0.5,RT=3.0,REAL=[[0.05, 0.9], [0.1, 0.88], [0.2, 0.85], [0.3, 0.83], [0.4, 0.82], [0.5, 0.8], [0.5, 0.8], [0.45, 0.95], [0.35, 1.35], [0.25, 2.2], [0.2, 3.1], [0.15, 5], [0.1, 9.4], [0.05, 18], [0.05, 52], [0.07, 35], [0.1, 22], [0.15, 12], [0.2, 8.2], [0.3, 6], [0.4, 5], [0.5, 4.5], [0.5, 1.2], [0.4, 1.17], [0.3, 1.14], [0.2, 1.11], [0.1, 1.08], [0.05, 1.05], [0.05, 0.9]];
const e=v.e, vc=VM/e, p2=P1*Math.pow(e,K), p3=RT*p2, eta=1-Math.pow(e,1-K);
const Z=(v.zoom==="zoom"), ymax=Z?2:Math.max(60,Math.ceil(p3*1.1/10)*10), X0=60,X1=530,Y0=300,Y1=20;
const X=x=>X0+(X1-X0)*x/0.55, Y=y=>Y0-(Y0-Y1)*Math.min(y,ymax*1.04)/ymax;
el("line",{x1:X0,y1:Y0,x2:X1,y2:Y0,stroke:css("--line"),"stroke-width":1.5});
el("line",{x1:X0,y1:Y0,x2:X0,y2:Y1,stroke:css("--line"),"stroke-width":1.5});
for(let t=0;t<=0.5;t+=0.1){el("line",{x1:X(t),y1:Y0,x2:X(t),y2:Y0+4,stroke:css("--line")});el("text",{x:X(t),y:Y0+16,"font-size":11,"text-anchor":"middle"},fmt(t,1));}
for(let t=0;t<=ymax+1e-9;t+=ymax/(Z?4:6)){el("line",{x1:X0-4,y1:Y(t),x2:X0,y2:Y(t),stroke:css("--line")});el("text",{x:X0-7,y:Y(t)+4,"font-size":11,"text-anchor":"end"},fmt(t,Z?1:0));}
if(Z){el("text",{x:X(0.27),y:Y(0.72),"font-size":11,"text-anchor":"middle"},"szívás ≈ 0,8–0,9 bar → (V nő)");el("text",{x:X(0.27),y:Y(1.3),"font-size":11,"text-anchor":"middle"},"← kipufogás ≈ 1,05–1,2 bar (V csökken)");}
el("text",{x:(X0+X1)/2,y:Y0+32,"font-size":12,"text-anchor":"middle"},"henger térfogat V (dm³)");
el("text",{x:14,y:(Y0+Y1)/2,"font-size":12,"text-anchor":"middle",transform:"rotate(-90 14 "+(Y0+Y1)/2+")"},"nyomás p (bar)");
let d="";const N=40;
for(let i=0;i<=N;i++){const V=VM+(vc-VM)*i/N;d+=(i?"L":"M")+X(V)+" "+Y(P1*Math.pow(VM/V,K));}
d+="L"+X(vc)+" "+Y(p3);
for(let i=0;i<=N;i++){const V=vc+(VM-vc)*i/N;d+="L"+X(V)+" "+Y(p3*Math.pow(vc/V,K));}
d+="L"+X(VM)+" "+Y(P1);
el("path",{d:d,fill:"none",stroke:css("--fg"),"stroke-width":2.5});
const r=REAL.map((q,i)=>(i?"L":"M")+X(q[0])+" "+Y(q[1])).join("");
el("path",{d:r,fill:"none",stroke:css("--fg"),"stroke-width":2,"stroke-dasharray":"7 4"});
el("line",{x1:X0+10,y1:30,x2:X0+50,y2:30,stroke:css("--fg"),"stroke-width":2.5});el("text",{x:X0+56,y:34,"font-size":11},"elméleti Otto-ciklus (folytonos)");
el("line",{x1:X0+10,y1:48,x2:X0+50,y2:48,stroke:css("--fg"),"stroke-width":2,"stroke-dasharray":"7 4"});el("text",{x:X0+56,y:52,"font-size":11},"valós indikátordiagram (szaggatott, szemléltető)");
status("<b>ε = "+fmt(e,1)+"</b> → elméleti hatásfok <b>η = 1 − ε<sup>1−κ</sup> = "+fmt(eta*100,1)+" %</b> (κ = 1,4). Nagyobb ε nagyobb sűrítési nyomást és hőmérsékletet ad: nő a kopogásveszély benzinnél.");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
