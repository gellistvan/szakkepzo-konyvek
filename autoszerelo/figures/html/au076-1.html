<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPF nyomáskülönbség-értékelés</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="pre">Adatkészlet</label><select id="pre" aria-label="Adatkészlet"><option value="ex" selected>2. kidolgozott példa</option><option value="real">valós eset (28/180 hPa)</option><option value="task">2. feladat</option><option value="sajat">saját értékek</option></select></div>
<div class="row"><label for="idle">Δp alapjáraton</label><input id="idle" type="range" min="0" max="60" step="1" value="12" aria-label="Δp alapjáraton"><output id="idle_o" for="idle"></output></div>
<div class="row"><label for="full">Δp teljes terhelésen</label><input id="full" type="range" min="0" max="250" step="1" value="80" aria-label="Δp teljes terhelésen"><output id="full_o" for="full"></output></div>
<div class="row"><label for="li">Határ alapjáraton</label><input id="li" type="range" min="10" max="60" step="1" value="30" aria-label="Határ alapjáraton"><output id="li_o" for="li"></output></div>
<div class="row"><label for="lf">Határ teljes terhelésen</label><input id="lf" type="range" min="50" max="250" step="1" value="150" aria-label="Határ teljes terhelésen"><output id="lf_o" for="lf"></output></div>
<div class="row"><label for="soot">Koromtöltet (modell)</label><input id="soot" type="range" min="0" max="100" step="1" value="40" aria-label="Koromtöltet (modell)"><output id="soot_o" for="soot"></output></div>
<div class="row"><label for="ash">Hamu</label><input id="ash" type="range" min="0" max="100" step="1" value="20" aria-label="Hamu"><output id="ash_o" for="ash"></output></div>
<div class="row"><label for="regen">regeneráció után</label><input id="regen" type="checkbox" aria-label="regeneráció után"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 580 245" role="img" aria-label="Zárt csatornás részecskeszűrő csatornái korommal és hamuval; mért nyomáskülönbségek a határértékekhez képest, döntés a regenerációról."></svg>
<p class="small">A döntés a fejezet szabálya: magas a koromtöltet, ha bármelyik mért Δp a gyártói határ felett van (a 30 és 150 hPa tanulási példa, ellenőrizendő). A korom- és hamurajz csak szemléltetés; a Δp-t nem modellből számoljuk.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"idle":"hPa", "full":"hPa", "li":"hPa", "lf":"hPa", "soot":"%", "ash":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const P={ex:[12,80,30,150],real:[28,180,30,150],task:[8,60,25,140]};
if(window._pre!==v.pre){window._pre=v.pre; if(P[v.pre]){["idle","full","li","lf"].forEach((k,i)=>{document.getElementById(k).value=P[v.pre][i];}); Object.assign(v,values());}}
const ink=css("--fg"), hl=css("--hl"), bad=css("--bad"), ok=css("--ok");
const soot=v.regen?0:v.soot/100;
// csatornák
for(let i=0;i<5;i++){const y=30+i*34, inlet=i%2===0;
  el("rect",{x:30,y:y,width:300,height:26,fill:"none",stroke:ink});
  if(inlet){ if(soot>0){el("rect",{x:30,y:y,width:280,height:2+8*soot,fill:ink});el("rect",{x:30,y:y+24-8*soot,width:280,height:2+8*soot,fill:ink});}
    el("rect",{x:285-30*v.ash/100,y:y+4,width:25+30*v.ash/100,height:18,fill:"#9e9e9e"});
    el("rect",{x:310,y:y,width:20,height:26,fill:ink});}
  else el("rect",{x:30,y:y,width:20,height:26,fill:ink});}
el("text",{x:30,y:215,"font-size":12},"fekete: korom ("+(v.regen?"regenerálva":fmt(v.soot,0)+" % modell")+") · szürke: hamu");
el("text",{x:30,y:232,"font-size":12},"a hamu a regeneráció után is megmarad");
// oszlopok
const X=380,B=200,sc=150/220;
const bar=(x,val,lim,lab)=>{const h=Math.min(val,220)*sc, over=val>lim;
  el("rect",{x:x,y:B-h,width:40,height:h,fill:over?bad:hl,opacity:0.75});
  el("line",{x1:x-6,y1:B-lim*sc,x2:x+46,y2:B-lim*sc,stroke:ink,"stroke-width":2,"stroke-dasharray":"6 3"});
  el("text",{x:x+20,y:B-h-5,"text-anchor":"middle","font-size":12},fmt(val,0));
  el("text",{x:x+20,y:B+16,"text-anchor":"middle","font-size":11},lab);};
bar(X,v.idle,v.li,"alapjárat");bar(X+90,v.full,v.lf,"teljes terh.");
el("text",{x:X-10,y:24,"font-size":12},"Δp (hPa), szaggatott: határ");
const regen=(v.idle>v.li||v.full>v.lf);
status(regen?`<span class="bad">Koromtöltet magas – regeneráció javasolt</span> (alapjárat ${fmt(v.idle,0)}/${fmt(v.li,0)} hPa, teljes terhelés ${fmt(v.full,0)}/${fmt(v.lf,0)} hPa). Előbb a regenerációt gátló hibák (EGR, MAF, töltőnyomás) kizárása; kényszerregenerálás csak gyártói eljárással.`
 :`<span class="ok">Rendben</span>: mindkét érték a határ alatt (alapjárat ${fmt(v.idle,0)}/${fmt(v.li,0)}, teljes terhelés ${fmt(v.full,0)}/${fmt(v.lf,0)} hPa).`);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
