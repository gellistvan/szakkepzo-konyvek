<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hidrodinamikus nyomatékváltó: vezetőkerék és lock-up</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="nu">Fordulatszám-viszony ν = n_turbina/n_szivattyú</label><input id="nu" type="range" min="0" max="0.98" step="0.01" value="0.0" aria-label="Fordulatszám-viszony ν = n_turbina/n_szivattyú"><output id="nu_o" for="nu"></output></div>
<div class="row"><label for="lu">Áthidaló (lock-up) tengelykapcsoló zárása</label><input id="lu" type="checkbox" aria-label="Áthidaló (lock-up) tengelykapcsoló zárása"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 504 450" role="img" aria-label="Hidrodinamikus nyomatékváltó félmetszete; a fordulatszám-viszony csúszkájával a vezetőkerék megáll vagy szabadon fut, a lock-up zárható; kiírt nyomatékmódosítás és hatásfok."></svg>
<p class="small">Sematikus, nem méretarányos rajz. A k(ν) és η(ν) értékek a fejezet szemléltető jelleggörbéi (tengelykapcsoló-pont ν ≈ 0,85); a tényleges görbe és a lock-up zárási feltételei gyártói adatok (ellenőrizendő).</p>
