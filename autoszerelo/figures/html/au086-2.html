<title>Kerékagy-csapágyazás, gömbcsukló, szilent</title><style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--box:#f3f3f3}

ék szerint állítjuk, új sasszeggel."}, {"r": [548.0, 34.6, 388.6, 287.8], "label": "1. generáció – préselt csapágy", "info": "Kiszerelés: agy kipréselése, seegergyűrű ki, a csapágy kipréselése a keréktartóból gyártói célszerszámmal (nem kalapáccsal); az új csapágyat a külső gyűrűn át préseljük be."}, {"r": [53.4, 382.1, 388.6, 287.8], "label": "2./3. generáció – csavarozott egység", "info": "Kiszerelés: a rögzítőcsavarok oldása után az egység egyben kivehető; nem állítható, csak cserélhető. Az ABS-kódgyűrű ne kerüljön mágnes vagy szennyeződés közelébe, a beépítési irányt ellenőrizni kell."}, {"r": [548.0, 382.1, 388.6, 287.8], "label": "Gömbcsukló és szilent", "info": "Gömbcsukló: kúpos csap, anyával rögzítve – lehúzóval választjuk le, holtjáték a gyártói határig; szakadt porvédő = csere. Szilent: kipréselés/bepréselés célszerszámmal, meghúzás menetmagasságban."}]}];
