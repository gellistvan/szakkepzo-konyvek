<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Összkerékhajtás-elrendezések</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="sys">Rendszer</label><select id="sys" aria-label="Rendszer"><option value="1" selected>állandó, középdifferenciál</option><option value="2">kapcsolható 4WD, felező</option><option value="3">automatikus, lamellás (Haldex típus)</option><option value="4">két villanymotor</option></select></div>
<div class="row"><label for="M">Bemenő nyomaték</label><input id="M" type="range" min="100" max="800" step="10" value="400" aria-label="Bemenő nyomaték"><output id="M_o" for="M"></output></div>
<div class="row"><label for="x">Elöl jutó arány / kuplungzárás</label><input id="x" type="range" min="0" max="100" step="1" value="40" aria-label="Elöl jutó arány / kuplungzárás"><output id="x_o" for="x"></output></div>
<div class="row"><label for="cl">Kapcsoló zárva (4WD)</label><input id="cl" type="checkbox" aria-label="Kapcsoló zárva (4WD)"></div>
<div class="row"><label for="lo">Felező fokozat (4WD)</label><input id="lo" type="checkbox" aria-label="Felező fokozat (4WD)"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 272 400" role="img" aria-label="Négy felülnézeti hajtásséma; választható rendszer, nyomatékarány vagy kapcsolóállás, kiírt tengelynyomatékok."></svg>
<p class="small">1. példa: 400 Nm, 40:60 → 160 / 240 Nm. A csúszka az (1) és (4) rendszernél az elöl jutó arány, a (3)-nál a kuplung zárása; a (2)-nél a kapcsoló és a felező jelölőnégyzet. Szemléltető modell; a valós arányok és a felező áttétele gyártói adatok (ellenőrizendő).</p>
