.fr{display:none;background:#fff;border-radius:4px;padding:4px}
.fr.on{display:block}
.fr svg{display:block;width:100%;height:auto;max-height:440px}
.fr text{fill:#111}
g.part{cursor:pointer}
g.hl path,g.hl use{stroke:#c55a11 !important;stroke-width:3px !important}
.small{font-size:12px;color:var(--muted)}

<div class="ctl">Rétegek: <label><input type="checkbox" data-l="se" checked> érzékelők</label><label><input type="checkbox" data-l="ecu" checked> SRS-ECU</label><label><input type="checkbox" data-l="ac" checked> beavatkozók</label></div>
<p class="small">Sematikus elhelyezés (balkormányos jármű, felülnézet); az érzékelők és légzsákok száma, helye típusfüggő (ellenőrizendő: gyártói adat). ⚠ = pirotechnikai elem.</p>
<script>
const MODE="buttons", MSG=["Kapcsold ki-be a rétegeket, és mutass rá egy elemre a nevéért."], PARTS={"se1": "első ütközésérzékelő", "se2": "oldalsó ütközésérzékelő (ajtó / B-oszlop)", "ecu": "SRS-ECU – jelfeldolgozás, ütközésfelismerés, gyújtókondenzátor", "ac1": "vezetőlégzsák a kormányban ⚠", "ac2": "utaslégzsák a műszerfalban ⚠", "ac3": "térdlégzsák ⚠", "ac4": "oldallégzsák az ülésben ⚠", "ac5": "függönylégzsák a tetőkeret mentén ⚠", "ac6": "övfeszítő (csévélő, csat) ⚠", "lampa": "SRS-visszajelző lámpa", "m1": "burkolat – a tépővarratnál nyílik", "m2": "hajtogatott zsák", "m3": "gázfejlesztő ⚠", "m4": "ház / tartólemez", "m5": "gyújtóegység-csatlakozó rövidzáró híddal (bontott állapotban rövidre zárja a gyújtót)", "c1": "spirálkábel háza", "c2": "feltekert szalagkábel", "c3": "forgó agy", "c4": "középhelyzet-jelölés", "c5": "rögzítő retesz – kiszerelt állapotban rögzíti a középhelyzetet"}, LABELS=["Rendszer"];
const FR=[...document.querySelectorAll(".fr")], ST=document.getElementById("status");
let k=0, timer=null;
function show(i){k=Math.max(0,Math.min(FR.length-1,i));FR.forEach((f,j)=>f.classList.toggle("on",j===k));
  document.querySelectorAll("button[data-i]").forEach(b=>b.classList.toggle("on",+b.dataset.i===k));
  const r=document.getElementById("pos");if(r){r.value=k;}
  const c=document.getElementById("cnt");if(c){c.textContent=(MODE==="slider"?LABELS[k]:(k+1)+"/"+FR.length);}
  ST.innerHTML=MSG[k]||"";}
function stop(){if(timer){clearInterval(timer);timer=null;}const p=document.getElementById("play");if(p)p.textContent="▶ Lejátszás";}
document.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{stop();show(+b.dataset.i);});
const B=id=>document.getElementById(id);
if(B("first")){B("first").onclick=()=>{stop();show(0);};B("prev").onclick=()=>{stop();show(k-1);};B("next").onclick=()=>{stop();show(k+1);};
  B("play").onclick=()=>{if(timer){stop();return;}if(k>=FR.length-1)show(0);B("play").textContent="⏸ Szünet";
    timer=setInterval(()=>{if(k>=FR.length-1)stop();else show(k+1);},1800);};}
if(B("pos"))B("pos").oninput=()=>{stop();show(+B("pos").value);};
document.querySelectorAll("g[id]").forEach(g=>{const m=g.id.match(/_p_([A-Za-z0-9]+)$/);if(!m||!(m[1] in PARTS))return;
