<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kétkörös fékrendszer – körkiesés</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="osz">Körfelosztás</label><select id="osz" aria-label="Körfelosztás"><option value="X" selected>átlós (X)</option><option value="II">tengelyenkénti (II)</option></select></div>
<div class="row"><label for="hiba">Kör törése</label><select id="hiba" aria-label="Kör törése"><option value="0" selected>nincs (ép rendszer)</option><option value="1">1. kör eltörik</option><option value="2">2. kör eltörik</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 480 600" role="img" aria-label="Tandem főfékhenger két körrel: az egyik a bal első és jobb hátsó, a másik a jobb első és bal hátsó kerékfékhez vezet."></svg>
<p class="small">Szemléltető vázlat; a valós körfelosztást és az ABS-egység belső felépítését a gyártói rajz adja. A fékhatás-százalék egy 70/30 %-os első/hátsó megoszlásból becsült tanulási érték.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const W = {"BE": [4, 72], "JE": [36, 72], "BH": [4, 18], "JH": [36, 18]}, R = {"BE": [[14, 61], [4, 61], [4, 66]], "JE": [[26, 61], [36, 61], [36, 66]], "BH": [[14, 57], [9, 57], [9, 18], [6.5, 18]], "JH": [[26, 57], [31, 57], [31, 18], [33.5, 18]]}, SP = {"X": {"BE": 1, "JH": 1, "JE": 2, "BH": 2}, "II": {"BE": 1, "JE": 1, "BH": 2, "JH": 2}}, FRONT = 0.7;
const k = 6, ox = 120, oy = 10, X = x => ox + x * k, Y = y => oy + (96 - y) * k;
const split = v.osz, br = v.hiba;
const work = Object.keys(SP[split]).filter(w => SP[split][w] !== br);
el("rect", {x: X(0), y: Y(90), width: 40 * k, height: 86 * k, rx: 40, fill: "none", stroke: css("--muted"), "stroke-dasharray": "4 4"});
el("text", {x: X(20), y: Y(95), "text-anchor": "middle", "font-size": 13}, "menetirány ↑");
for (const w in W) { const [x, y] = W[w], on = work.includes(w);
  el("rect", {x: X(x - 2.5), y: Y(y + 6), width: 5 * k, height: 12 * k, fill: on ? css("--fg") : "none", stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": on ? "" : "4 3"});
  el("text", {x: X(x + (x < 20 ? -6.5 : 6.5)), y: Y(y) + 5, "text-anchor": x < 20 ? "end" : "start", "font-size": 15, "font-weight": "bold", fill: on ? css("--fg") : css("--muted")}, w + (on ? "" : " ✗")); }
el("rect", {x: X(10), y: Y(86), width: 20 * k, height: 6 * k, fill: "none", stroke: css("--line"), "stroke-width": 2});
el("text", {x: X(20), y: Y(83) + 4, "text-anchor": "middle", "font-size": 11}, "tandem főfékhenger");
el("rect", {x: X(14), y: Y(64), width: 12 * k, height: 11 * k, fill: "none", stroke: css("--line"), "stroke-width": 2});
el("text", {x: X(20), y: Y(58.5) + 5, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "ABS");
const sty = c => ({stroke: c === br ? css("--bad") : css("--line"), "stroke-width": c === br ? 2 : 3.5, "stroke-dasharray": c === 1 ? "" : "9 5", fill: "none", opacity: c === br ? 0.6 : 1});
[[1, 17], [2, 23]].forEach(([c, xo]) => el("path", Object.assign({d: `M${X(xo)} ${Y(80)} L${X(xo)} ${Y(64)}`}, sty(c))));
for (const w in R) { const c = SP[split][w];
  el("path", Object.assign({d: R[w].map((p, i) => (i ? "L" : "M") + X(p[0]) + " " + Y(p[1])).join(" ")}, sty(c))); }
if (br) { const w0 = Object.keys(SP[split]).find(w => SP[split][w] === br && (split === "II" || w.endsWith("E"))) || "";
  const [x, y] = R[w0][1]; el("text", {x: X(x) + (x < 20 ? -30 : 10), y: Y(y) - 8, "font-size": 22, fill: css("--bad")}, "⚡"); }
let share = 0; work.forEach(w => share += w.endsWith("E") ? FRONT / 2 : (1 - FRONT) / 2);
let pull = "nincs számottevő félrehúzás (a működő fékek szimmetrikusak)";
if (br && split === "X") { const fr = work.find(w => w.endsWith("E")); pull = "félrehúzás a működő első kerék oldala (" + (fr === "JE" ? "jobbra" : "balra") + ") felé lehetséges; a negatív kormánylegördülési sugár ezt csökkenti (gyártófüggő)"; }
const names = {1: "1. kör (folytonos)", 2: "2. kör (szaggatott)"};
status(br ? `<span class="bad">${names[br]} kiesett.</span> Működő kerékfékek: <b>${work.join(", ")}</b>. Megmaradó fékhatás ≈ <b>${Math.round(share * 100)} %</b> (szemléltető, ${Math.round(FRONT * 100)} % első tengelyi fékerőhányaddal); ${pull}. A pedálút megnő.`
          : `Ép rendszer: mind a négy kerékfék működik. Felosztás: ${split === "X" ? "átlós (X): BE+JH és JE+BH" : "tengelyenkénti (II): első és hátsó tengely"}.`);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
