<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EGR-arány és légtömegjel</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="rate">Kért EGR-arány</label><input id="rate" type="range" min="0" max="50" step="0.5" value="22.5" aria-label="Kért EGR-arány"><output id="rate_o" for="rate"></output></div>
<div class="row"><label for="sc">EGR-szelep állapota</label><select id="sc" aria-label="EGR-szelep állapota"><option value="ok" selected>ép, a kért helyzetben</option><option value="zart">zárva ragadt</option><option value="nyitva">nyitva ragadt (szemléltető 40 %)</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 360" role="img" aria-label="Hűtött külső EGR a szívó- és kipufogóág között, légtömegmérővel; az EGR-arány, a friss levegő és a MAF-jel a szelepnyitás szerint."></svg>
<p class="small">A fejezet példája: 18 g/s EGR és 62 g/s friss levegő → 22,5 %. A 80 g/s-os hengertöltet rögzítése egyszerűsítés; a valós munkapontot és a megengedett eltérést a gyártói adat adja (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"rate":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const TOT=80.0, r=v.rate/100, ink=css("--fg"), hl=css("--hl"), hl2=css("--hl2");
const act = v.sc==="ok" ? r : (v.sc==="zart" ? 0 : 0.40);
const egr=TOT*act, air=TOT-egr, egrCmd=TOT*r, airExp=TOT-egrCmd;
// vázlat
const box=(x,y,w,h,t,f)=>{el("rect",{x,y,width:w,height:h,rx:6,fill:f||"none",stroke:ink,"stroke-width":1.5});el("text",{x:x+w/2,y:y+h/2+5,"text-anchor":"middle","font-size":13},t);};
box(20,40,70,36,"MAF");box(140,40,110,150,"szívócső");box(290,40,110,150,"motor");box(440,40,100,150,"kipufogó");
box(300,215,90,36,"EGR-szelep");
el("line",{x1:90,y1:58,x2:140,y2:58,stroke:hl,"stroke-width":Math.max(1,air/6)});
el("text",{x:115,y:30,"text-anchor":"middle","font-size":12},fmt(air,1)+" g/s");
el("path",{d:"M490 190 L490 233 L390 233",fill:"none",stroke:hl2,"stroke-width":Math.max(1,egr/3),"stroke-dasharray":"8 4"});
el("path",{d:"M300 233 L195 233 L195 190",fill:"none",stroke:hl2,"stroke-width":Math.max(1,egr/3),"stroke-dasharray":"8 4"});
el("text",{x:245,y:268,"text-anchor":"middle","font-size":12},"EGR: "+fmt(egr,1)+" g/s");
el("rect",{x:300,y:256,width:90*act/0.5,height:6,fill:ink});el("text",{x:395,y:263,"font-size":11},"nyitás");
// oszlop: hengertöltet
const X=40,Y=300,W=480,H=26;
el("rect",{x:X,y:Y,width:W*air/TOT,height:H,fill:hl,opacity:0.6});
el("rect",{x:X+W*air/TOT,y:Y,width:W*egr/TOT,height:H,fill:hl2,opacity:0.6});
el("rect",{x:X,y:Y,width:W,height:H,fill:"none",stroke:ink});
el("text",{x:X,y:Y+44,"font-size":12},"hengertöltet "+fmt(TOT,0)+" g/s = friss levegő + EGR (munkaponti egyszerűsítés)");
const dev=(air-airExp)/airExp*100;
let s=`EGR-arány: <b>${fmt(act*100,1)} %</b> = ${fmt(egr,1)} / (${fmt(air,1)} + ${fmt(egr,1)}). `+
 `MAF-jel: <b>${fmt(air,1)} g/s</b> (elvárt: ${fmt(airExp,1)} g/s`+(Math.abs(dev)>2?`, <span class="bad">eltérés ${dev>0?"+":""}${fmt(dev,0)} %</span>`:"")+`). `+
 `NOx: ${act>0.05?"csökken ↓ (alacsonyabb égési csúcshőmérséklet)":"nem csökken – EGR nélkül nagyobb ↑"}.`;
if(v.sc==="zart") s+=" A zárva ragadt szelep miatt több friss levegő megy át a MAF-on, mint amennyit az ECU vár; a NOx nő.";
if(v.sc==="nyitva") s+=" A nyitva ragadt szelep (szemléltető 40 %) miatt kevesebb friss levegő: kormozás, teljesítményvesztés, rángatás lehet.";
status(s);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
