<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vonóerő-diagram áttétel-csúszkákkal</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="p5">5. feladat: i_0 = 4,3</label><input id="p5" type="checkbox" aria-label="5. feladat: i_0 = 4,3"></div>
<div class="row"><label for="i0">Tengelyhajtás i_0</label><input id="i0" type="range" min="3.0" max="5.0" step="0.05" value="3.9" aria-label="Tengelyhajtás i_0"><output id="i0_o" for="i0"></output></div>
<div class="row"><label for="i1">1. fokozat i_s</label><input id="i1" type="range" min="2.5" max="4.5" step="0.05" value="3.7" aria-label="1. fokozat i_s"><output id="i1_o" for="i1"></output></div>
<div class="row"><label for="i2">2. fokozat</label><input id="i2" type="range" min="1.5" max="2.8" step="0.05" value="2.1" aria-label="2. fokozat"><output id="i2_o" for="i2"></output></div>
<div class="row"><label for="i3">3. fokozat</label><input id="i3" type="range" min="1.0" max="1.9" step="0.05" value="1.4" aria-label="3. fokozat"><output id="i3_o" for="i3"></output></div>
<div class="row"><label for="i4">4. fokozat</label><input id="i4" type="range" min="0.8" max="1.4" step="0.05" value="1.0" aria-label="4. fokozat"><output id="i4_o" for="i4"></output></div>
<div class="row"><label for="i5">5. fokozat</label><input id="i5" type="range" min="0.6" max="1.1" step="0.05" value="0.8" aria-label="5. fokozat"><output id="i5_o" for="i5"></output></div>
<div class="row"><label for="rd">Gördülési sugár r_d</label><input id="rd" type="range" min="0.28" max="0.36" step="0.005" value="0.31" aria-label="Gördülési sugár r_d"><output id="rd_o" for="rd"></output></div>
<div class="row"><label for="eta">Hatásfok η</label><input id="eta" type="range" min="0.85" max="0.97" step="0.01" value="0.92" aria-label="Hatásfok η"><output id="eta_o" for="eta"></output></div>
<div class="row"><label for="q">Emelkedő q</label><input id="q" type="range" min="0" max="20" step="0.5" value="0" aria-label="Emelkedő q"><output id="q_o" for="q"></output></div>
<div class="row"><label for="m">Tömeg m</label><input id="m" type="range" min="1000" max="2200" step="10" value="1400" aria-label="Tömeg m"><output id="m_o" for="m"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 330" role="img" aria-label="Vonóerő-diagram: alacsony fokozatban nagy erő kis sebességgel, a legmagasabb fokozat és az ellenállásgörbe metszése ≈ 212 km/h."></svg>
<p class="small">Alapérték: a fejezet példajárműve (v_max ≈ 212 km/h, ≈ 5650 1/min). Nyomaték a megadott pontok között lineárisan interpolálva; c_W·A = 0,66 m², f = 0,012. Tanulási adatok, nem gyártói mérés.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"i0":"", "i1":"", "i2":"", "i3":"", "i4":"", "i5":"", "rd":"m", "eta":"", "q":"%", "m":"kg"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const NN = [1000, 2000, 3000, 4000, 5000, 6000], MM = [150, 200, 225, 230, 205, 145], g = 9.81, rho = 1.2, f = 0.012, cwa = 0.66;
if (window._p === undefined) window._p = v.p5;
if (v.p5 !== window._p) { window._p = v.p5; document.getElementById("i0").value = v.p5 ? 4.3 : 3.9; Object.assign(v, values()); }
const IS = [v.i1, v.i2, v.i3, v.i4, v.i5];
const tq = n => { if (n <= NN[0]) return MM[0]; for (let k = 1; k < NN.length; k++) if (n <= NN[k]) return MM[k - 1] + (MM[k] - MM[k - 1]) * (n - NN[k - 1]) / (NN[k] - NN[k - 1]); return MM[MM.length - 1]; };
const spd = (n, i) => 0.377 * v.rd * n / i, trac = (n, i) => tq(n) * i * v.eta / v.rd;
const res = (vk, q) => { const s = vk / 3.6, a = Math.atan(q / 100); return v.m * g * (f * Math.cos(a) + Math.sin(a)) + 0.5 * rho * cwa * s * s; };
const X0 = 60, Y0 = 300, W = 540, H = 280, vmx = 260, fmx = 12000;
const X = u => X0 + W * u / vmx, Y = F => Y0 - H * Math.min(F, fmx) / fmx;
el("line", {x1: X0, y1: Y0, x2: X0 + W, y2: Y0, stroke: css("--line")}); el("line", {x1: X0, y1: Y0, x2: X0, y2: Y0 - H, stroke: css("--line")});
for (let u = 0; u <= vmx; u += 50) el("text", {x: X(u), y: Y0 + 15, "font-size": 11, "text-anchor": "middle"}, String(u));
for (let F = 0; F <= fmx; F += 2000) el("text", {x: X0 - 5, y: Y(F) + 4, "font-size": 11, "text-anchor": "end"}, String(F));
el("text", {x: X0 + W, y: Y0 + 30, "font-size": 11, "text-anchor": "end"}, "v (km/h)"); el("text", {x: 4, y: 14, "font-size": 11}, "F (N)");
const dash = ["", "8 4", "10 3 2 3", "2 3", ""];
IS.forEach((is, k) => { const it = is * v.i0; let d = "";
  for (let n = 1000; n <= 6000; n += 100) d += (n === 1000 ? "M" : "L") + X(spd(n, it)) + " " + Y(trac(n, it)) + " ";
  el("path", {d: d, fill: "none", stroke: k === 4 ? css("--hl") : css("--line"), "stroke-width": 2, "stroke-dasharray": dash[k]});
  el("text", {x: X(spd(6000, it)) + 4, y: Y(trac(6000, it)) + 4, "font-size": 12, "font-weight": "bold"}, (k + 1) + "."); });
let d0 = "", dq = ""; for (let u = 0; u <= vmx; u += 5) { d0 += (u ? "L" : "M") + X(u) + " " + Y(res(u, 0)) + " "; dq += (u ? "L" : "M") + X(u) + " " + Y(res(u, v.q)) + " "; }
el("path", {d: d0, fill: "none", stroke: css("--muted"), "stroke-width": 3});
if (v.q > 0) el("path", {d: dq, fill: "none", stroke: css("--hl2"), "stroke-width": 3, "stroke-dasharray": "6 4"});
// végsebesség: a legnagyobb sebesség bármely fokozatban, ahol vonóerő ≥ ellenállás (q emelkedőn)
let best = 0, bn = 0, bk = 0;
IS.forEach((is, k) => { const it = is * v.i0; for (let n = 1000; n <= 6000; n += 5) { const u = spd(n, it); if (trac(n, it) >= res(u, v.q) && u > best) { best = u; bn = n; bk = k; } } });
el("circle", {cx: X(best), cy: Y(res(best, v.q)), r: 6, fill: css("--bad")});
const lim = bn >= 5995 ? "a motor leszabályozása (6000 1/min) korlátoz" : "a vonóerő és az ellenállás egyensúlya korlátoz";
const it5 = IS[4] * v.i0, n100 = 100 / spd(1, it5), f100 = n100 <= 6000 && n100 >= 1000 ? trac(n100, it5) : NaN, r100 = res(100, 0);
const sa = (f100 - r100) / (v.m * g), qq = Math.tan(Math.asin(Math.max(-1, Math.min(1, sa)))) * 100;
status(`v<sub>max</sub> ≈ <b>${fmt(best, 0)} km/h</b> (${bk + 1}. fokozat, ${fmt(bn, 0)} 1/min) – ${lim}${v.q > 0 ? ", " + fmt(v.q, 1) + " %-os emelkedőn" : ", sík úton"}.<br>` +
       (isNaN(f100) ? "100 km/h 5. fokozatban a motor fordulattartományán kívül esik." :
       `100 km/h, 5. fokozat: n = ${fmt(n100, 0)} 1/min, F<sub>v</sub> = ${fmt(f100, 0)} N, erőtöbblet ${fmt(f100 - r100, 0)} N → elvi emelkedőképesség ≈ <b>${fmt(qq, 1)} %</b>.`));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
