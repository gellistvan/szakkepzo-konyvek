<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nónius- és mikrométer-leolvasó gyakorló</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="md">Műszer</label><select id="md" aria-label="Műszer"><option value="n05" selected>tolómérő, 0,05 mm-es nónius</option><option value="n02">tolómérő, 0,02 mm-es nónius</option><option value="mic">mikrométer (0,01 mm)</option></select></div>
<div class="row"><label for="x">Méret</label><input id="x" type="range" min="0" max="48" step="0.01" value="31.35" aria-label="Méret"><output id="x_o" for="x"></output></div>
<div class="row"><label for="q">Kvíz (0 = csúszka)</label><input id="q" type="range" min="0" max="30" step="1" value="0" aria-label="Kvíz (0 = csúszka)"><output id="q_o" for="q"></output></div>
<div class="row"><label for="sh">Megoldás mutatása</label><input id="sh" type="checkbox" checked aria-label="Megoldás mutatása"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 240" role="img" aria-label="Tolómérő-nónius 31,35 mm-es állásban, a 7. vonás egybeesik; mikrométer 12,84 mm-es állásban."></svg>
<p class="small">A nónius-módokban a beállított méret a felbontásra kerekítve jelenik meg. Példák: 31,35 mm (0,05-ös nónius, k = 7); 45,18 mm (0,02-es nónius, k = 9); mikrométer 12,84 mm (12,5 + 34 · 0,01).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"x":"mm", "q":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const mode=v.md, R=t=>{let x=Math.sin(t*12.9898+78.233)*43758.5453;return x-Math.floor(x);};
let X=v.x; if(v.q>0){X=mode==="mic"?Math.round(R(v.q)*2500)/100:(mode==="n02"?Math.round(R(v.q)*2500)/50:Math.round(R(v.q)*1000)/20);}
X=Math.min(Math.max(X,0),48);
el("rect",{x:0,y:0,width:560,height:240,fill:"#fff"});
const T=(x,y,t,o)=>el("text",Object.assign({x:x,y:y,"font-size":12,"text-anchor":"middle",fill:"#000"},o||{}),t);
const Ln=(x1,y1,x2,y2,w)=>el("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:"#000","stroke-width":w||1});
let res="";
if(mode!=="mic"){
  const b=mode==="n02"?0.02:0.05, N=Math.round(1/b), len=N*(1-b), lo=Math.max(0,Math.floor(X)-3), px=10, P=x=>20+(x-lo)*px;
  el("rect",{x:10,y:40,width:540,height:70,fill:"#f2f2f2",stroke:"#000"});
  for(let m=lo;P(m)<550;m++){const L=m%10===0?40:(m%5===0?28:18);Ln(P(m),110,P(m),110-L,1);if(m%10===0)T(P(m),62,String(m/10));}
  T(100,36,"főskála (mm)",{"font-size":11,"text-anchor":"start"});
  el("rect",{x:P(X)-12,y:110,width:Math.min(len*px+40,540),height:70,fill:"#fff",stroke:"#000"});
  const n=Math.floor(X+1e-9), k=Math.round((X-n)/b);
  for(let i=0;i<=N;i++){const xv=P(X+i*(1-b));if(xv>555)break;const lab=(N===20?i%2===0:i%5===0);
    Ln(xv,110,xv,110+(lab?34:20),i===k%N||(k===N&&i===N)?3:1);if(lab)T(xv,162,String(N===20?i/2:i/5),{"font-size":11});}
  res="L = "+n+" mm + "+k+" · "+fmt(b,2)+" mm = <b>"+fmt(n+k*b,2)+" mm</b> (egybeeső vonás: k = "+k+")";
}else{
  const s=Math.floor(X*2+1e-9)/2, k=Math.round((X-s)/0.01), lo=Math.max(0,Math.floor(s)-12), px=30, P=x=>20+(x-lo)*px, xe=P(X);
  el("rect",{x:10,y:80,width:xe-10,height:70,fill:"#f2f2f2",stroke:"#000"});Ln(10,115,xe,115,1.5);
  for(let m=lo;m<=s+0.001;m+=0.5){const P1=P(m);if(P1<12)continue;const full=Math.abs(m-Math.round(m))<1e-6;Ln(P1,115,P1,full?130:100,1);if(full&&m%5===0)T(P1,145,String(m),{"font-size":11});}
  el("rect",{x:xe,y:30,width:120,height:170,fill:"#e0e0e0",stroke:"#000","stroke-width":1.5});
  for(let j=-6;j<=6;j++){const val=((k+j)%50+50)%50,y=115-j*12;Ln(xe,y,xe+(val%5===0?22:12),y,j===0?3:1);if(val%5===0)T(xe+40,y+4,String(val),{"font-size":11});}
  T(xe+60,225,"dob (0,01 mm/osztás)",{"font-size":11});T(60,72,"szár: alul mm, felül fél mm",{"font-size":11,"text-anchor":"start"});
  res="d = "+fmt(s,1)+" mm + "+k+" · 0,01 mm = <b>"+fmt(s+k*0.01,2)+" mm</b>";
}
status(v.sh?res:(v.q>0?"Kvíz: olvassa le a beállított méretet, majd kapcsolja be a megoldást.":"Állítsa a méretet a csúszkával; a leolvasáshoz kapcsolja be a megoldást."));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
