<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerékfordulatszám-érzékelő jelalakja</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="spd">Sebesség v</label><input id="spd" type="range" min="0" max="130" step="1" value="60" aria-label="Sebesség v"><output id="spd_o" for="spd"></output></div>
<div class="row"><label for="teeth">Fogszám z</label><input id="teeth" type="range" min="29" max="100" step="1" value="48" aria-label="Fogszám z"><output id="teeth_o" for="teeth"></output></div>
<div class="row"><label for="rd">Gördülési sugár r_d</label><input id="rd" type="range" min="0.25" max="0.4" step="0.005" value="0.334" aria-label="Gördülési sugár r_d"><output id="rd_o" for="rd"></output></div>
<div class="row"><label for="typ">Érzékelő</label><select id="typ" aria-label="Érzékelő"><option value="ind" selected>passzív induktív</option><option value="akt">aktív (áramjel)</option></select></div>
<div class="row"><label for="gap">Légrés túl nagy (induktív)</label><input id="gap" type="checkbox" aria-label="Légrés túl nagy (induktív)"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Induktív és aktív kerékérzékelő jelalakja és frekvenciája a sebesség függvényében"></svg>
<p class="small">Szemléltető, számított jelalak, nem mérés. Ellenőrző értékek: 60 km/h, C = 2,1 m, z = 48 → ≈ 381 Hz; 80 km/h, r<sub>d</sub> = 0,34 m, z = 50 → ≈ 520 Hz. Az amplitúdó, az áramszintek és a légréshatár gyártófüggők (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"spd":"km/h", "teeth":"fog", "rd":"m"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const C=2*Math.PI*v.rd, n=v.spd/3.6/C, f=n*v.teeth, W=20, X0=60, X1=540, Y0=20, H=230;
const X=t=>X0+(X1-X0)*t/W;
el("rect",{x:X0,y:Y0,width:X1-X0,height:H,fill:"none",stroke:css("--line")});
const ind=v.typ==="ind", amp=0.04*v.spd*(v.gap?0.4:1);
const lo=ind?-4:0, hi=ind?4:20, Y=u=>Y0+H-H*(u-lo)/(hi-lo);
const ticks=ind?[-4,-2,0,2,4]:[0,7,14,20];
ticks.forEach(u=>{el("line",{x1:X0,x2:X1,y1:Y(u),y2:Y(u),stroke:css("--grid")||"#ccc","stroke-dasharray":"2 3"});
  el("text",{x:X0-6,y:Y(u)+4,"font-size":11,"text-anchor":"end"},String(u));});
el("text",{x:14,y:Y0+H/2,"font-size":12,"text-anchor":"middle",transform:"rotate(-90 14 "+(Y0+H/2)+")"},ind?"U (V)":"I (mA)");
[0,5,10,15,20].forEach(t=>el("text",{x:X(t),y:Y0+H+16,"font-size":11,"text-anchor":"middle"},String(t)));
el("text",{x:(X0+X1)/2,y:Y0+H+34,"font-size":12,"text-anchor":"middle"},"t (ms)");
let d="";const N=1600;
for(let i=0;i<=N;i++){const t=W*i/N,ph=(f*t/1000)%1;
  const u=ind?amp*Math.sin(2*Math.PI*ph):(ph<0.5?14.0:7.0);
  d+=(i?"L":"M")+X(t).toFixed(1)+" "+Y(v.spd>0?u:(ind?0:7.0)).toFixed(1);}
el("path",{d:d,fill:"none",stroke:css("--fg"),"stroke-width":1.8});
status("C = 2π·r<sub>d</sub> = <b>"+fmt(C,3)+" m</b>; n = v/C = <b>"+fmt(n,2)+" 1/s</b>; <b>f = n·z = "+fmt(f,0)+" Hz</b>. "+
 (ind?"Induktív csúcsfeszültség ≈ "+fmt(amp,2)+" V (szemléltető; a sebességgel nő"+(v.gap?", a nagy légrés csökkenti – kis sebességnél a vezérlő már nem ismeri fel a jelet":"")+").":
  "Aktív érzékelő: az áram 7 és 14 mA között kapcsol (ellenőrizendő), az amplitúdó a sebességtől független; a légrés kapcsoló itt nem hat."));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
