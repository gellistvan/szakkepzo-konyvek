<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kicsúszás vagy borulás?</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="burk">Útburkolat (μ betöltése)</label><select id="burk" aria-label="Útburkolat (μ betöltése)"><option value="-" selected>egyéni (csúszka)</option><option value="0.9">száraz aszfalt 0,8–1,0</option><option value="0.55">nedves aszfalt 0,4–0,7</option><option value="0.6">murva 0,5–0,7</option><option value="0.25">tömött hó 0,2–0,3</option><option value="0.1">jég 0,05–0,15</option></select></div>
<div class="row"><label for="r">Ívsugár r</label><input id="r" type="range" min="10" max="300" step="1" value="45" aria-label="Ívsugár r"><output id="r_o" for="r"></output></div>
<div class="row"><label for="mu">Tapadási tényező μ</label><input id="mu" type="range" min="0.05" max="1.1" step="0.01" value="0.85" aria-label="Tapadási tényező μ"><output id="mu_o" for="mu"></output></div>
<div class="row"><label for="d">Nyomtáv d</label><input id="d" type="range" min="1.3" max="2.2" step="0.01" value="1.8" aria-label="Nyomtáv d"><output id="d_o" for="d"></output></div>
<div class="row"><label for="hs">Súlypontmagasság h_s</label><input id="hs" type="range" min="0.4" max="2.0" step="0.01" value="1.2" aria-label="Súlypontmagasság h_s"><output id="hs_o" for="hs"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 320" role="img" aria-label="Ha a nyomtáv és a kétszeres súlypontmagasság hányadosa kisebb a tapadási tényezőnél, a jármű előbb borul, mint csúszik."></svg>
<p class="small">Alapérték: a fejezet 3. példája (r = 45 m, μ = 0,85, d = 1,80 m, h_s = 1,20 m → v_bor = 65,5 km/h, v_cs ≈ 69,7 km/h). 3. feladat: r = 80 m, μ = 1,0, d = 1,55 m, h_s = 0,65 m → 110,1 / 100,9 km/h. Az útburkolat-értékek a fejezet táblázatának irányértékei.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"r":"m", "mu":"", "d":"m", "hs":"m"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const g = 9.81;
if (window._s === undefined) window._s = "-";
if (v.burk !== window._s) { window._s = v.burk; if (v.burk !== "-") { document.getElementById("mu").value = v.burk; Object.assign(v, values()); } }
const vc = rr => Math.sqrt(v.mu * g * rr) * 3.6, vb = rr => Math.sqrt(v.d / (2 * v.hs) * g * rr) * 3.6;
const X0 = 60, Y0 = 290, W = 380, H = 260, rmax = 300, vmax = 300;
const X = rr => X0 + W * rr / rmax, Y = u => Y0 - H * Math.min(u, vmax) / vmax;
el("line", {x1: X0, y1: Y0, x2: X0 + W, y2: Y0, stroke: css("--line")}); el("line", {x1: X0, y1: Y0, x2: X0, y2: Y0 - H, stroke: css("--line")});
for (let rr = 0; rr <= rmax; rr += 50) el("text", {x: X(rr), y: Y0 + 15, "font-size": 11, "text-anchor": "middle"}, String(rr));
for (let u = 0; u <= vmax; u += 50) el("text", {x: X0 - 5, y: Y(u) + 4, "font-size": 11, "text-anchor": "end"}, String(u));
el("text", {x: X0 + W, y: Y0 + 30, "font-size": 11, "text-anchor": "end"}, "r (m)"); el("text", {x: 4, y: 20, "font-size": 11}, "v (km/h)");
let dc = "", db = "", dm = "";
for (let rr = 2; rr <= rmax; rr += 2) { const a = vc(rr), b = vb(rr), p = (rr === 2 ? "M" : "L") + X(rr) + " ";
  dc += p + Y(a) + " "; db += p + Y(b) + " "; dm += p + Y(Math.min(a, b)) + " "; }
el("path", {d: dm, fill: "none", stroke: css("--grid"), "stroke-width": 9});
el("path", {d: dc, fill: "none", stroke: css("--hl"), "stroke-width": 2.5});
el("path", {d: db, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5, "stroke-dasharray": "8 4"});
el("line", {x1: X(v.r), y1: Y0, x2: X(v.r), y2: Y0 - H, stroke: css("--muted"), "stroke-dasharray": "3 3"});
const a = vc(v.r), b = vb(v.r);
el("circle", {cx: X(v.r), cy: Y(a), r: 5, fill: css("--hl")}); el("circle", {cx: X(v.r), cy: Y(b), r: 5, fill: css("--hl2")});
el("text", {x: X0 + 8, y: Y0 - H + 14, "font-size": 12}, "folytonos: kicsúszás, szaggatott: borulás");
// hátulnézet
const cx = 545, gy = 250, sc = 60;
el("line", {x1: cx - 85, y1: gy, x2: cx + 85, y2: gy, stroke: css("--line"), "stroke-width": 2});
el("rect", {x: cx - v.d / 2 * sc - 12, y: gy - 30, width: 24, height: 30, fill: css("--grid"), stroke: css("--line")});
el("rect", {x: cx + v.d / 2 * sc - 12, y: gy - 30, width: 24, height: 30, fill: css("--grid"), stroke: css("--line")});
el("rect", {x: cx - v.d / 2 * sc - 8, y: gy - v.hs * sc * 1.7, width: v.d * sc + 16, height: v.hs * sc * 1.7 - 22, rx: 8, fill: "none", stroke: css("--line"), "stroke-width": 1.5});
el("circle", {cx: cx, cy: gy - v.hs * sc, r: 5, fill: css("--fg")});
el("text", {x: cx + 8, y: gy - v.hs * sc - 6, "font-size": 12}, "S");
el("text", {x: cx, y: gy + 18, "font-size": 11, "text-anchor": "middle"}, "d = " + fmt(v.d, 2) + " m, h_s = " + fmt(v.hs, 2) + " m");
const k = v.d / (2 * v.hs), first = k < v.mu ? "<b>borulás</b> (d/(2h<sub>s</sub>) < μ)" : "<b>kicsúszás</b> (μ ≤ d/(2h<sub>s</sub>))";
status(`r = ${fmt(v.r, 0)} m: v<sub>cs</sub> = <b>${fmt(a, 1)} km/h</b>, v<sub>bor</sub> = <b>${fmt(b, 1)} km/h</b>. d/(2h<sub>s</sub>) = ${fmt(k, 2)}, μ = ${fmt(v.mu, 2)} → előbb ${first} következik be; ` +
       `a<sub>y,max</sub> = ${fmt(Math.min(v.mu, k) * g, 2)} m/s². Idealizált modell (merev futómű, sík út).`);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
