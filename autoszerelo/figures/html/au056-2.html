<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Négyütemű Otto-motor: ütemek és p–V munkapont</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="th">Forgattyúszög</label><input id="th" type="range" min="0" max="720" step="1" value="90" aria-label="Forgattyúszög"><output id="th_o" for="th"></output></div>
<div class="row"><label for="play">Lejátszás</label><input id="play" type="checkbox" aria-label="Lejátszás"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Négy ütem hengermetszetben: szívás, sűrítés, munkaütem, kipufogás a szelephelyzetekkel és forgattyúszöggel."></svg>
<p class="small">Elvi munkafolyamat holtponti szelepállapotokkal; a p–V görbe szemléltető modell (κ ≈ 1,3, csúcsnyomás kb. 45 bar), nem mért érték. A valós vezérlési szögeket A töltéscsere vezérlése alfejezet részletezi.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"th":"°"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const CR=1.6,CL=5.2,th=v.th,t=th*Math.PI/180;
const pin=CR*Math.cos(t)+Math.sqrt(CL*CL-Math.pow(CR*Math.sin(t),2)), crown=pin+1.0;
const ph=Math.floor((th%720)/180), NAMES=["1. szívás","2. sűrítés","3. munkaütem","4. kipufogás"];
const iv=(ph===0)?Math.sin(Math.PI*(th%180)/180):0, ev=(ph===3)?Math.sin(Math.PI*(th%180)/180):0;
// p–V modell (szemléltető): V a dugattyúhelyzetből, p ütemenként
const Vc=0.05, Vh=0.45, Vof=a=>{const tt=a*Math.PI/180,pp=CR*Math.cos(tt)+Math.sqrt(CL*CL-Math.pow(CR*Math.sin(tt),2));return Vc+Vh*((CR+CL)-pp)/(2*CR);};
function pOf(a){a=((a%720)+720)%720;const V=Vof(a);
  if(a<180)return 0.85; if(a<350)return 0.85*Math.pow((Vc+Vh)/V,1.3);
  const pc=0.85*Math.pow((Vc+Vh)/Vof(350),1.3);
  if(a<375){const x=(a-350)/25;return pc+ (45-pc)*x*x*(3-2*x)*1.0;}
  if(a<540){const p3=45,V3=Vof(375);return Math.max(p3*Math.pow(V3/V,1.3),1.1);}
  if(a<560)return 4.2-(4.2-1.15)*(a-540)/20; return 1.15;}
// ---- hengermetszet (bal) ----
const SC=19, OX=130, OY=282, X=x=>OX+x*SC, Y=y=>OY-y*SC, L=css("--line"), F=css("--fg");
const gasFill=[css("--bg"),css("--grid"),"#555","#aaa"][ph];
el("rect",{x:X(-2),y:Y(8.6),width:4*SC,height:(8.6-crown)*SC,fill:gasFill,stroke:"none"});
if(ph===0)for(let i=0;i<30;i++)el("circle",{cx:X(-1.8+3.6*((i*37)%30)/30),cy:Y(crown+(8.6-crown)*((i*17)%30)/30),r:1.4,fill:F});
el("rect",{x:X(-2.5),y:Y(8.6),width:0.5*SC,height:5.4*SC,fill:css("--grid"),stroke:L});
el("rect",{x:X(2),y:Y(8.6),width:0.5*SC,height:5.4*SC,fill:css("--grid"),stroke:L});
el("rect",{x:X(-2.5),y:Y(10.2),width:5*SC,height:1.6*SC,fill:css("--grid"),stroke:L});
[[-1,iv],[1,ev]].forEach(([sx,o])=>{const vx=sx*1.0,d=0.45*o;
  el("rect",{x:X(vx-0.42),y:Y(9.4),width:0.84*SC,height:0.8*SC,fill:css("--bg"),stroke:"none"});
  el("path",{d:"M"+X(vx-0.48)+" "+Y(8.6-d)+"L"+X(vx+0.48)+" "+Y(8.6-d)+"L"+X(vx+0.08)+" "+Y(8.82-d)+"L"+X(vx-0.08)+" "+Y(8.82-d)+"Z",fill:"#888",stroke:L});
  el("line",{x1:X(vx),y1:Y(8.8-d),x2:X(vx),y2:Y(10.9-d),stroke:L,"stroke-width":3});});
el("rect",{x:X(-0.18),y:Y(10.75),width:0.36*SC,height:2.3*SC,fill:"#ddd",stroke:L});
if(th%720>=345&&th%720<=362)el("text",{x:X(0),y:Y(8.0),"font-size":18,"text-anchor":"middle",style:"fill:"+css("--hl2")},"✶");
el("rect",{x:X(-1.95),y:Y(crown),width:3.9*SC,height:1.6*SC,fill:"#ccc",stroke:L,"stroke-width":1.5});
const cx=CR*Math.sin(t),cy=CR*Math.cos(t);
el("circle",{cx:X(0),cy:Y(0),r:CR*SC,fill:"none",stroke:L,"stroke-dasharray":"6 3 1 3"});
el("line",{x1:X(0),y1:Y(pin),x2:X(cx),y2:Y(cy),stroke:"#555","stroke-width":7,"stroke-linecap":"round"});
el("line",{x1:X(0),y1:Y(0),x2:X(cx),y2:Y(cy),stroke:L,"stroke-width":5,"stroke-linecap":"round"});
el("circle",{cx:X(0),cy:Y(pin),r:4,fill:css("--bg"),stroke:L});
[[0,"FHP"],[180,"AHP"]].forEach(([a,s])=>{const yy=CR*Math.cos(a*Math.PI/180)+Math.sqrt(CL*CL)+1.0;el("line",{x1:X(2.6),y1:Y(yy),x2:X(3.0),y2:Y(yy),stroke:L});el("text",{x:X(3.1),y:Y(yy)+4,"font-size":11},s);});
el("text",{x:X(-3.0),y:Y(11.9),"font-size":11},"szívó");el("text",{x:X(1.2),y:Y(11.9),"font-size":11},"kipufogó");
// ---- p–V diagram (jobb) ----
const PX0=300,PX1=545,PY0=290,PY1=30,pmax=50,X2=V=>PX0+(PX1-PX0)*V/0.55,Y2=p=>PY0-(PY0-PY1)*Math.min(p,pmax)/pmax;
el("line",{x1:PX0,y1:PY0,x2:PX1,y2:PY0,stroke:L});el("line",{x1:PX0,y1:PY0,x2:PX0,y2:PY1,stroke:L});
el("text",{x:(PX0+PX1)/2,y:PY0+22,"font-size":11,"text-anchor":"middle"},"V (dm³)");

for(let q=0;q<=50;q+=10)el("text",{x:PX0-6,y:Y2(q)+4,"font-size":10,"text-anchor":"end"},q);
for(let q=0;q<=0.5;q+=0.1)el("text",{x:X2(q),y:PY0+12,"font-size":10,"text-anchor":"middle"},fmt(q,1));
let d="";for(let a=0;a<=720;a+=3)d+=(a?"L":"M")+X2(Vof(a))+" "+Y2(pOf(a));
el("path",{d:d,fill:"none",stroke:F,"stroke-width":1.6,"stroke-dasharray":"5 3"});
el("circle",{cx:X2(Vof(th)),cy:Y2(pOf(th)),r:6,fill:css("--hl2"),stroke:L});
el("text",{x:PX1,y:PY1+4,"font-size":11,"text-anchor":"end"},"p (bar), szemléltető");
status("<b>"+NAMES[ph]+"</b> – forgattyúszög "+(th%720)+"° (ütemen belül "+(th%180)+"°). "+["Szívószelep nyitva, a dugattyú FHP → AHP, friss keverék áramlik be.","Mindkét szelep zárva, AHP → FHP, a keverék sűrűsödik; FHP előtt szikra.","Mindkét szelep zárva, az égés nyomása a dugattyút FHP → AHP nyomja: hasznos munka.","Kipufogószelep nyitva, AHP → FHP, az égéstermék távozik."][ph]+" p ≈ "+fmt(pOf(th),1)+" bar, V ≈ "+fmt(Vof(th),3)+" dm³.");
if(!window._pl)window._pl=setInterval(()=>{const c=document.getElementById("play"),s=document.getElementById("th");if(c&&c.checked){s.value=(+s.value+4)%721;draw();}},60);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
