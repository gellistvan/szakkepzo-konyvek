<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiegyenlítőmű: fordulatszám- és nyomatékmegosztás</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="typ">Típus</label><select id="typ" aria-label="Típus"><option value="open" selected>nyitott</option><option value="lsd">lemezes önzáró (S)</option><option value="locked">zárt (differenciálzár)</option><option value="torsen">Torsen (TBR)</option></select></div>
<div class="row"><label for="nbe">Kosár fordulatszáma n_be</label><input id="nbe" type="range" min="100" max="1200" step="10" value="800" aria-label="Kosár fordulatszáma n_be"><output id="nbe_o" for="nbe"></output></div>
<div class="row"><label for="nin">Belső (bal) kerék fordulatszáma</label><input id="nin" type="range" min="0" max="1200" step="10" value="760" aria-label="Belső (bal) kerék fordulatszáma"><output id="nin_o" for="nin"></output></div>
<div class="row"><label for="M">Bemenő nyomaték</label><input id="M" type="range" min="200" max="3000" step="50" value="2500" aria-label="Bemenő nyomaték"><output id="M_o" for="M"></output></div>
<div class="row"><label for="mul">Tapadás bal μ</label><input id="mul" type="range" min="0.05" max="1.0" step="0.01" value="0.15" aria-label="Tapadás bal μ"><output id="mul_o" for="mul"></output></div>
<div class="row"><label for="mur">Tapadás jobb μ</label><input id="mur" type="range" min="0.05" max="1.0" step="0.01" value="0.15" aria-label="Tapadás jobb μ"><output id="mur_o" for="mur"></output></div>
<div class="row"><label for="S">Zárási tényező S</label><input id="S" type="range" min="0.1" max="0.8" step="0.05" value="0.35" aria-label="Zárási tényező S"><output id="S_o" for="S"></output></div>
<div class="row"><label for="tbr">Torsen TBR</label><input id="tbr" type="range" min="1.5" max="5" step="0.1" value="2.5" aria-label="Torsen TBR"><output id="tbr_o" for="tbr"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 300" role="img" aria-label="Kiegyenlítőmű animált vázlata: a kosár, a bolygókerekek saját forgása és a két kerék fordulatszáma; választható típus és tapadás, kiírt keréknyomatékok."></svg>
<p class="small">Kerékterhelés 4 500 N, gördülési sugár 0,32 m (3. példa): μ = 0,15 → 216 Nm keréknként, nyitott kiegyenlítőnél összesen 432 Nm. 4. feladat: S = 0,35, 1200 Nm (a gyengébb kerék korlátja 390 Nm) → 810 / 390 Nm. Szemléltető modell; a valós zárási jellemzők gyártói adatok (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"nbe":"1/min", "nin":"1/min", "M":"Nm", "mul":"", "mur":"", "S":"", "tbr":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

if(!window.__t0){window.__t0=performance.now();}
if(!window.__an){window.__an=setInterval(draw,60);}
const FN=4500, RD=0.32, S=v.S, TBR=v.tbr, Mbe=v.M;
const nb=v.nbe, nl=v.nin, nr=2*nb-nl;
const ml=v.mul*FN*RD, mr=v.mur*FN*RD, lo=Math.min(ml,mr), hi=Math.max(ml,mr);
let a,b;
if(v.typ==="open"){const k=Math.min(Mbe/2,lo);a=k;b=k;}
else if(Mbe/2<=lo){a=Mbe/2;b=Mbe/2;}
else{const ratio={lsd:(1+S)/(1-S),torsen:TBR,locked:1e9}[v.typ];a=lo;b=Math.min(Mbe-a,a*ratio,hi);}
const Ml=ml<=mr?a:b, Mr=ml<=mr?b:a, tot=Ml+Mr;
const t=(performance.now()-window.__t0)/1000, w=2*Math.PI*0.6/800;
el("rect",{x:0,y:0,width:620,height:300,fill:"#fff"});
function wheel(x,n,M,lab,mu){el("rect",{x:x-25,y:70,width:50,height:150,rx:8,fill:"#ddd",stroke:"#000"});
 const ph=(t*w*n*60)%80;for(let k=-1;k<3;k++){const y=70+ph+k*40;if(y>70&&y<220)el("line",{x1:x-25,y1:y,x2:x+25,y2:y,stroke:"#000","stroke-width":3});}
 el("text",{x:x,y:60,"text-anchor":"middle","font-size":13,fill:"#000"},lab+": "+fmt(n,0)+" 1/min");
 el("text",{x:x,y:242,"text-anchor":"middle","font-size":13,fill:"#000","font-weight":"bold"},fmt(M,0)+" Nm");
 el("text",{x:x,y:260,"text-anchor":"middle","font-size":12,fill:"#555"},"μ = "+fmt(mu,2)+" → max "+fmt(mu*FN*RD,0)+" Nm");}
wheel(70,nl,Ml,"bal (belső)",v.mul);wheel(550,nr,Mr,"jobb (külső)",v.mur);
el("line",{x1:95,y1:145,x2:230,y2:145,stroke:"#000","stroke-width":6});el("line",{x1:390,y1:145,x2:525,y2:145,stroke:"#000","stroke-width":6});
el("rect",{x:230,y:85,width:160,height:120,fill:"#fff",stroke:"#000","stroke-width":2});
const ang=t*w*nb*6, pang=t*w*(nr-nl)/2*6;
el("circle",{cx:310,cy:145,r:52,fill:"none",stroke:"#999","stroke-dasharray":"4 4"});
for(const s of [1,-1]){const px=310+40*Math.cos(ang)*0, py=145+s*38;
 el("circle",{cx:310,cy:py,r:16,fill:"#eee",stroke:"#000"});
 el("line",{x1:310,y1:py,x2:310+14*Math.cos(pang*s),y2:py+14*Math.sin(pang*s),stroke:"#000","stroke-width":2});}
for(const s of [1,-1]){el("rect",{x:310+s*45-8,y:120,width:16,height:50,fill:"#fff",stroke:"#000"});}
el("line",{x1:310,y1:110+20*Math.sin(ang),x2:310,y2:180+20*Math.sin(ang),stroke:"#000","stroke-width":2});
el("text",{x:310,y:80,"text-anchor":"middle","font-size":13,fill:"#000"},"kosár: "+fmt(nb,0)+" 1/min");
el("text",{x:310,y:225,"text-anchor":"middle","font-size":12,fill:"#555"},"bolygókerék saját forgása ~ "+fmt(Math.abs(nr-nl)/2,0)+" 1/min");
const nm={open:"nyitott",lsd:"lemezes önzáró (S = "+fmt(S,2)+")",locked:"zárt",torsen:"Torsen (TBR = "+fmt(TBR,1)+")"}[v.typ];
status("<b>"+nm+"</b>: n<sub>jobb</sub> = 2·n<sub>be</sub> − n<sub>bal</sub> = "+fmt(nr,0)+" 1/min (kanyar). Keréknyomatékok: bal <b>"+fmt(Ml,0)+" Nm</b>, jobb <b>"+fmt(Mr,0)+" Nm</b>, összesen <b>"+fmt(tot,0)+" Nm</b> a "+fmt(Mbe,0)+" Nm-ből"+(tot<Mbe-0.5?" – a többi nem adódik át, a kerék kipörög.":"."));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
