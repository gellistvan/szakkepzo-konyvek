<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fény-sötét határ a beállítófalon</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="h">Fényszóró-középmagasság h</label><input id="h" type="range" min="0.4" max="1.2" step="0.01" value="0.7" aria-label="Fényszóró-középmagasság h"><output id="h_o" for="h"></output></div>
<div class="row"><label for="d">Távolság a falig d</label><input id="d" type="range" min="3" max="25" step="0.5" value="10" aria-label="Távolság a falig d"><output id="d_o" for="d"></output></div>
<div class="row"><label for="p">Lejtés</label><input id="p" type="range" min="0.2" max="3.0" step="0.1" value="1.0" aria-label="Lejtés"><output id="p_o" for="p"></output></div>
<div class="row"><label for="lh">Bal oldali forgalom (tükrözés)</label><input id="lh" type="checkbox" aria-label="Bal oldali forgalom (tükrözés)"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 320" role="img" aria-label="Tompított fény-sötét határ jobb oldali forgalomra: bal oldalon alacsonyabb vízszintes, középen 15°-os emelkedés, jobb oldalon magasabb szakasz."></svg>
<p class="small">Számolt, szemléltető ernyőkép (y = h − d·lejtés). A 15°-os szakasz és a jobb oldali szakasz alakja típusfüggő; a lejtést és a beállítási eljárást a gyártói adat és a fényszóró-ellenőrző készülék útmutatója adja (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"h":"m", "d":"m", "p":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const h=v.h,d=v.d,p=v.p,dy=d*p/100,y=h-dy,t15=Math.tan(15*Math.PI/180),xk=dy/t15,m=v.lh?-1:1;
const X0=40,X1=540,XL=-1.6,XR=1.6,YB=Math.max(0,Math.min(y,h)-0.35),YT=h+0.2,P0=290,P1=20;
const X=x=>X0+(X1-X0)*(x-XL)/(XR-XL),Y=u=>P0-(P0-P1)*(u-YB)/(YT-YB);
for(let g=-1.5;g<=1.5001;g+=0.5){el("line",{x1:X(g),y1:P1,x2:X(g),y2:P0,stroke:css("--grid")});el("text",{x:X(g),y:P0+14,"font-size":10,"text-anchor":"middle"},fmt(g,1));}
const st=Math.ceil(YB*10)/10;for(let g=st;g<=YT;g+=0.1){el("line",{x1:X0,y1:Y(g),x2:X1,y2:Y(g),stroke:css("--grid")});el("text",{x:X0-4,y:Y(g)+4,"font-size":10,"text-anchor":"end"},fmt(g,1));}
const xkc=Math.min(xk,1.55);
const pts=[[XL*m,y],[0,y],[xkc*m,y+xkc*t15],[XR*m,y+xkc*t15]];
let d1="M"+X(XL*m)+" "+Y(YB);pts.forEach(q=>{d1+=" L"+X(q[0])+" "+Y(q[1]);});d1+=" L"+X(XR*m)+" "+Y(YB)+" Z";
el("path",{d:d1,fill:css("--grid"),opacity:0.8});
let d2="";pts.forEach((q,i)=>{d2+=(i?" L":"M")+X(q[0])+" "+Y(q[1]);});
el("path",{d:d2,fill:"none",stroke:css("--fg"),"stroke-width":3});
el("line",{x1:X0,y1:Y(h),x2:X1,y2:Y(h),stroke:css("--hl"),"stroke-width":1.5,"stroke-dasharray":"7 4"});
el("text",{x:X0+4,y:Y(h)-5,"font-size":11},"h = "+fmt(h,2)+" m");
el("line",{x1:X(0),y1:P1,x2:X(0),y2:P0,stroke:css("--muted"),"stroke-dasharray":"8 3 2 3"});
el("text",{x:X(-1.55*m),y:Y(y)+16,"font-size":12,"font-weight":"bold","text-anchor":m>0?"start":"end"},"határ: "+fmt(y,2)+" m");
el("text",{x:X(-0.9*m),y:Y(y)-8,"font-size":11,"text-anchor":"middle"},"szembejövő oldal");
el("text",{x:X(1.0*m),y:Y(y+xkc*t15)-8,"font-size":11,"text-anchor":"middle"},"padka oldal");
el("text",{x:(X0+X1)/2,y:316,"font-size":11,"text-anchor":"middle"},"vízszintes helyzet a falon (m)");
status("Esés = d · lejtés = "+fmt(d,1)+" m · "+fmt(p,1)+" % = <b>"+fmt(dy,3)+" m</b>; a fény-sötét határ magassága y = h − esés = <b>"+fmt(y,3)+" m</b>."+
 (v.lh?" Bal oldali forgalomnál a kép tükrözött: a magasabb szakasz a bal oldalon van.":""));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
