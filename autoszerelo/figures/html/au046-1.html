<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soros RLC kör fázorábrája</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="R">Ellenállás R</label><input id="R" type="range" min="1" max="200" step="1" value="20" aria-label="Ellenállás R"><output id="R_o" for="R"></output></div>
<div class="row"><label for="L">Induktivitás L</label><input id="L" type="range" min="0.01" max="1" step="0.01" value="0.1" aria-label="Induktivitás L"><output id="L_o" for="L"></output></div>
<div class="row"><label for="C">Kapacitás C</label><input id="C" type="range" min="1" max="100" step="1" value="10" aria-label="Kapacitás C"><output id="C_o" for="C"></output></div>
<div class="row"><label for="f">Frekvencia f</label><input id="f" type="range" min="10" max="500" step="0.1" value="100" aria-label="Frekvencia f"><output id="f_o" for="f"></output></div>
<div class="row"><label for="U">Tápfeszültség U</label><input id="U" type="range" min="1" max="240" step="1" value="24" aria-label="Tápfeszültség U"><output id="U_o" for="U"></output></div>
<div class="row"><label for="act">Előbeállítás</label><select id="act" aria-label="Előbeállítás"><option value="0" selected>—</option><option value="1">3. feladat</option><option value="2">5. feladat (rezonancián)</option><option value="3">rezonanciára állít (f = f₀)</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Soros RLC kör fázorábrája, idődiagramja és rezonanciagörbéje"></svg>
<p class="small">Ideális elemekkel számolt értékek (effektív értékek; a fázorábra I-hez viszonyít). A rezonancián fellépő nagy U_L, U_C miatt ilyen kísérlet csak feszültségkorlátozott, felügyelt mérőhelyen végezhető.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"R":"Ω", "L":"H", "C":"µF", "f":"Hz", "U":"V"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const setv=(k,x)=>{document.getElementById(k).value=x;};
if(v.act!==0){if(v.act===1){setv("R",20);setv("L",0.1);setv("C",10);setv("f",100);setv("U",24);}
  if(v.act===2){setv("R",5);setv("L",0.2);setv("C",47);setv("U",240);}
  if(v.act>=2){const L=+document.getElementById("L").value,C=+document.getElementById("C").value*1e-6;setv("f",(1/(2*Math.PI*Math.sqrt(L*C))).toFixed(1));}
  if(v.act===2)setv("U",230);
  document.getElementById("act").value="0";draw();return;}
const C=v.C*1e-6,w=2*Math.PI*v.f,XL=w*v.L,XC=1/(w*C),Z=Math.hypot(v.R,XL-XC),I=v.U/Z,UR=v.R*I,UL=XL*I,UC=XC*I,phi=Math.atan2(XL-XC,v.R),f0=1/(2*Math.PI*Math.sqrt(v.L*C));
// fázorábra
const cx=120,cy=165,m=Math.max(UL,UC,UR,v.U),k=130/m;
el("line",{x1:cx-110,y1:cy,x2:cx+150,y2:cy,stroke:css("--grid")});
el("text",{x:cx+150,y:cy-6,"font-size":11,"text-anchor":"end",fill:css("--muted")},"I (referencia)");
function ar(x0,y0,x1,y1,col,dash,lab){el("line",{x1:x0,y1:y0,x2:x1,y2:y1,stroke:col,"stroke-width":2.4,"stroke-dasharray":dash||""});
  const a=Math.atan2(y1-y0,x1-x0);el("path",{d:"M"+x1+" "+y1+"L"+(x1-9*Math.cos(a-0.4))+" "+(y1-9*Math.sin(a-0.4))+"L"+(x1-9*Math.cos(a+0.4))+" "+(y1-9*Math.sin(a+0.4))+"Z",fill:col});
  if(lab)el("text",{x:x1+6,y:y1+(y1<y0?-4:14),"font-size":12,fill:col},lab);}
ar(cx,cy,cx+UR*k,cy,css("--fg"),"","U_R");
ar(cx,cy,cx,cy-UL*k,css("--hl"),"6 3","U_L");
ar(cx,cy,cx,cy+UC*k,css("--hl2"),"2 3","U_C");
ar(cx,cy,cx+UR*k,cy-(UL-UC)*k,css("--bad"),"","U");
// idődiagram
const X0=300,X1=545,Y0=20,Y1=150,T=1/v.f,um=v.U*Math.SQRT2,im=I*Math.SQRT2;
el("rect",{x:X0,y:Y0,width:X1-X0,height:Y1-Y0,fill:"none",stroke:css("--line")});
let du="",di="";for(let j=0;j<=200;j++){const t=T*j/200,x=X0+(X1-X0)*j/200;du+=(j?"L":"M")+x.toFixed(1)+" "+((Y0+Y1)/2-55*Math.sin(w*t+phi)).toFixed(1);di+=(j?"L":"M")+x.toFixed(1)+" "+((Y0+Y1)/2-55*Math.sin(w*t)).toFixed(1);}
el("path",{d:du,fill:"none",stroke:css("--bad"),"stroke-width":2});el("path",{d:di,fill:"none",stroke:css("--fg"),"stroke-width":1.6,"stroke-dasharray":"6 4"});
el("text",{x:(X0+X1)/2,y:Y1+14,"font-size":11,"text-anchor":"middle"},"u(t) folytonos, i(t) szaggatott (normált), 1 periódus");
// rezonanciagörbe
const RY0=180,RY1=300,fmax=Math.max(3*f0,v.f*1.3),Imax=v.U/v.R,Fx=q=>X0+(X1-X0)*q/fmax,Iy=q=>RY1-(RY1-RY0)*q/Imax;
el("rect",{x:X0,y:RY0,width:X1-X0,height:RY1-RY0,fill:"none",stroke:css("--line")});
let dr="";for(let j=1;j<=300;j++){const q=fmax*j/300,ww=2*Math.PI*q,ii=v.U/Math.hypot(v.R,ww*v.L-1/(ww*C));dr+=(j>1?"L":"M")+Fx(q).toFixed(1)+" "+Iy(ii).toFixed(1);}
el("path",{d:dr,fill:"none",stroke:css("--hl"),"stroke-width":2});
el("line",{x1:Fx(f0),x2:Fx(f0),y1:RY0,y2:RY1,stroke:css("--muted"),"stroke-dasharray":"4 3"});
el("circle",{cx:Fx(v.f),cy:Iy(I),r:5,fill:"none",stroke:css("--bad"),"stroke-width":2});
el("text",{x:X1-4,y:RY0+14,"font-size":11,"text-anchor":"end"},"I(f), f₀ = "+fmt(f0,1)+" Hz");
el("text",{x:(X0+X1)/2,y:RY1+18,"font-size":11,"text-anchor":"middle"},"f: 0 … "+fmt(fmax,0)+" Hz");
const jel=Math.abs(XL-XC)<0.01*Z?"rezonancia":(XL>XC?"induktív (a feszültség siet)":"kapacitív (a feszültség késik)");
status("X_L = <b>"+fmt(XL,1)+" Ω</b>, X_C = <b>"+fmt(XC,1)+" Ω</b>, Z = <b>"+fmt(Z,1)+" Ω</b>, I = <b>"+fmt(I,3)+" A</b>, U_L = "+fmt(UL,1)+" V, U_C = "+fmt(UC,1)+" V, φ = "+fmt(phi*180/Math.PI,1)+"° – "+jel+"."+
  ((UL>v.U||UC>v.U)?" <span class='bad'>Az U_L vagy U_C nagyobb a tápfeszültségnél!</span>":""));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
