<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Induktív és Hall-jeladó jelalakja</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="rpm">Fordulatszám n</label><input id="rpm" type="range" min="600" max="4000" step="100" value="3000" aria-label="Fordulatszám n"><output id="rpm_o" for="rpm"></output></div>
<div class="row"><label for="typ">Jeladótípus</label><select id="typ" aria-label="Jeladótípus"><option value="0">induktív</option><option value="1">Hall</option><option value="2" selected>mindkettő</option></select></div>
<div class="row"><label for="gap">Hiányzó fogak (60−2)</label><input id="gap" type="checkbox" checked aria-label="Hiányzó fogak (60−2)"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Induktív és Hall-jelalak szemléltető ábra: az induktív jel 0 V körül leng, a résnél nagyobb lengéssel; a Hall-jel négyszög."></svg>
<p class="small">Szemléltető, számított jelalak, nem mért érték. A valódi amplitúdó, szintek és fogazás gyártó- és típusfüggő; ellenőrizendő a gyártói mérési útmutatóban.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"rpm":"1/min"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const NT=20,G0=9,G1=10,GA=1.5,rpm=v.rpm,T=1000/rpm,tot=NT*T,typ=String(v.typ);
const X0=60,X1=540,X=t=>X0+(X1-X0)*t/tot;
function panel(y0,h,lab,fn,dash,lo,hi,ticks){
  const Y=u=>y0+h-h*(u-lo)/(hi-lo);
  el("rect",{x:X0,y:y0,width:X1-X0,height:h,fill:"none",stroke:css("--line")});
  if(v.gap) el("rect",{x:X(G0*T),y:y0,width:X(G1*T+T)-X(G0*T),height:h,fill:css("--grid"),opacity:0.5});
  ticks.forEach(u=>{el("text",{x:X0-6,y:Y(u)+4,"font-size":11,"text-anchor":"end"},fmt(u,1));
    el("line",{x1:X0,y1:Y(u),x2:X1,y2:Y(u),stroke:css("--grid"),"stroke-dasharray":"2 3"});});
  el("text",{x:12,y:y0+h/2,"font-size":12,"text-anchor":"middle",transform:"rotate(-90 12 "+(y0+h/2)+")"},lab+" (V)");
  let d="";const n=1000;
  for(let i=0;i<n;i++){const t=tot*i/n,k=Math.floor(t/T),ph=t/T-k,g=v.gap&&(k>=G0&&k<=G1);
    const u=fn(g,ph,(t-G0*T)/(2*T));d+=(i?"L":"M")+X(t)+" "+Y(u);}
  el("path",{d:d,fill:"none",stroke:css("--fg"),"stroke-width":2,"stroke-dasharray":dash});
}
const amp=1.8*rpm/3000;
let y=14,h=typ==="2"?110:230;
if(typ!=="1"){panel(y,h,"induktív",(g,ph,tg)=>g?GA*amp*Math.sin(2*Math.PI*tg):amp*Math.sin(2*Math.PI*ph),"",-4.5,4.5,[-4,-2,0,2,4]);y+=h+22;}
if(typ!=="0"){panel(y,h,"Hall",(g,ph)=>(!g&&ph<0.5)?4.3:0.7,"7 4",0,5,[0,2.5,5]);}
el("text",{x:(X0+X1)/2,y:322,"font-size":12,"text-anchor":"middle"},"idő (ms) – az ablak 20 fogosztás, azaz 120° főtengely-elfordulás: 0 … "+fmt(tot,2)+" ms");
status("<b>n = "+fmt(rpm,0)+" 1/min</b> → fogosztás-periódus <b>"+fmt(T,3)+" ms</b>; fogosztás-frekvencia 60·n/60 = <b>"+fmt(rpm,0)+" Hz</b>, az ECU által számolt átlagos impulzusfrekvencia 58·n/60 = <b>"+fmt(58*rpm/60,0)+" Hz</b> (2. példa, z = 58). Induktív jel csúcsértéke ~ ±"+fmt(amp,2)+" V, 0 V körül (szemléltető: a fordulatszámmal nő). "+(v.gap?"A szürke sáv a szinkronrés: az induktív jel itt nagyobb, hosszabb lengést ad, a Hall-jel kimarad – ebből ismeri fel a vezérlő a főtengely helyzetét.":"Hiányzó fogak nélkül nincs szinkronrés."));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
