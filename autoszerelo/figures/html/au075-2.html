<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lambdaszonda-feszültség</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="lam">Légviszony λ</label><input id="lam" type="range" min="0.9" max="1.1" step="0.002" value="0.98" aria-label="Légviszony λ"><output id="lam_o" for="lam"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Cirkónium-dioxid lambdaszonda elve: a referencialevegő és a kipufogógáz oxigénkülönbsége és a szondafeszültség a λ függvényében."></svg>
<p class="small">A feszültség a fejezet logisztikus közelítése (U = 0,1 + 0,8 / (1 + e^(80(λ−1))) V); a kipufogógáz O₂-tartalma durva szemléltetés. Üzemmeleg szonda; a valós görbe hőmérsékletfüggő (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"lam":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const lam=v.lam, ink=css("--fg"), hl=css("--hl"), hl2=css("--hl2");
const U=0.1+0.8/(1+Math.exp(80*(lam-1)));
const o2=lam>1?20.9*(lam-1)/lam:0.0;           // szemléltető: szegénynél maradék O2, dúsnál ~0
// ujj és rétegek
el("path",{d:"M150 60 L150 230 A70 70 0 0 0 290 230 L290 60",fill:"none",stroke:ink,"stroke-width":14,opacity:0.35});
el("path",{d:"M150 60 L150 230 A70 70 0 0 0 290 230 L290 60",fill:"none",stroke:ink,"stroke-width":1.5});
el("text",{x:220,y:120,"text-anchor":"middle","font-size":13},"referencialevegő");
el("text",{x:220,y:140,"text-anchor":"middle","font-size":13},"O₂ 20,9 %");
el("text",{x:10,y:30,"font-size":13},"kipufogógáz (a szonda külső oldalán): O₂ ≈ "+fmt(o2,1)+" % (szemléltető)");
const n=Math.round(U*10);
for(let i=0;i<n;i++){const y=80+i*17;
  el("line",{x1:160,y1:y,x2:118,y2:y,stroke:hl2,"stroke-width":2});el("path",{d:`M118 ${y} l8 -4 l0 8 z`,fill:hl2});
  el("line",{x1:280,y1:y,x2:322,y2:y,stroke:hl2,"stroke-width":2});el("path",{d:`M322 ${y} l-8 -4 l0 8 z`,fill:hl2});}
// műszer
el("rect",{x:400,y:60,width:30,height:220,fill:"none",stroke:ink});
el("rect",{x:400,y:60+220*(1-U),width:30,height:220*U,fill:hl});
[0,0.45,0.9].forEach(t=>el("text",{x:436,y:60+220*(1-t)+4,"font-size":11},fmt(t,2)+" V"));
el("text",{x:415,y:300,"text-anchor":"middle","font-size":13,"font-weight":"bold"},"U_s = "+fmt(U,2)+" V");
const st=lam<0.995?"dús":(lam>1.005?"szegény":"λ ≈ 1 (ugrás)");
status(`λ = <b>${fmt(lam,3)}</b> → ${st} keverék, szondafeszültség <b>${fmt(U,2)} V</b>. `+
 (lam<1?"Dús keveréknél a kipufogógázban alig van szabad oxigén, nagy a különbség a referencialevegőhöz képest: nagy feszültség.":
  "Szegény keveréknél a kipufogógázban is van oxigén, kicsi a különbség: kis feszültség."));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
