<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PWM-kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="D">Kitöltési tényező D</label><input id="D" type="range" min="0" max="100" step="1" value="40" aria-label="Kitöltési tényező D"><output id="D_o" for="D"></output></div>
<div class="row"><label for="U">Tápfeszültség U</label><input id="U" type="range" min="6" max="28" step="0.5" value="12" aria-label="Tápfeszültség U"><output id="U_o" for="U"></output></div>
<div class="row"><label for="R">Terhelés R</label><input id="R" type="range" min="0.5" max="20" step="0.5" value="2" aria-label="Terhelés R"><output id="R_o" for="R"></output></div>
<div class="row"><label for="rds">R_DS(on)</label><input id="rds" type="range" min="5" max="100" step="1" value="25" aria-label="R_DS(on)"><output id="rds_o" for="rds"></output></div>
<div class="row"><label for="f">PWM-frekvencia</label><input id="f" type="range" min="50" max="2000" step="50" value="100" aria-label="PWM-frekvencia"><output id="f_o" for="f"></output></div>
<div class="row"><label for="kind">Terhelés jellege</label><select id="kind" aria-label="Terhelés jellege"><option value="m">motor (az átlag számít)</option><option value="h" selected>fűtőszál/izzó (az effektív érték számít)</option></select></div>
<div class="row"><label for="pre">Előbeállítás</label><select id="pre" aria-label="Előbeállítás"><option value="0" selected>—</option><option value="2">2. példa</option><option value="4">4. feladat</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 260" role="img" aria-label="40 %-os kitöltésű PWM-jel 12 V-on, átlagfeszültség 4,8 V, effektív feszültség 7,59 V"></svg>
<p class="small">Ideális négyszögjel (végtelen meredek élek), ohmos terhelés, a MOSFET kapcsolási veszteségei nélkül. A PWM-frekvencia itt csak az időtengelyt változtatja.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"D":"%", "U":"V", "R":"Ω", "rds":"mΩ", "f":"Hz"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

if(v.pre!==0){const p=v.pre===2?[40,12,2,25]:[60,12,3,30];["D","U","R","rds"].forEach((k,i)=>{document.getElementById(k).value=p[i];});
  document.getElementById("pre").value="0";draw();return;}
const D=v.D/100,U=v.U,R=v.R,rds=v.rds/1000,T=1000/v.f,ua=D*U,ue=U*Math.sqrt(D),ip=U/R,P=ue*ue/R,PM=D*ip*ip*rds,PW=ua*ua/R;
const X0=50,X1=540,Y0=20,Y1=220,tm=3*T,X=t=>X0+(X1-X0)*t/tm,Ym=Math.max(U*1.15,1),Y=q=>Y1-(Y1-Y0)*q/Ym;
el("rect",{x:X0,y:Y0,width:X1-X0,height:Y1-Y0,fill:"none",stroke:css("--line")});
let d="M"+X(0)+" "+Y(D>0?U:0);for(let k=0;k<3;k++){const a=k*T,b=a+D*T,c=a+T;d+="L"+X(a)+" "+Y(D>0?U:0)+"L"+X(b)+" "+Y(D>0?U:0)+"L"+X(b)+" "+Y(D<1?0:U)+"L"+X(c)+" "+Y(D<1?0:U);}
el("path",{d:d,fill:"none",stroke:css("--fg"),"stroke-width":2});
const hm=v.kind==="m",wa=hm?4:2,we=hm?2:4;
el("line",{x1:X0,x2:X1,y1:Y(ua),y2:Y(ua),stroke:css("--hl"),"stroke-width":wa,"stroke-dasharray":"8 4"});
el("line",{x1:X0,x2:X1,y1:Y(ue),y2:Y(ue),stroke:css("--hl2"),"stroke-width":we,"stroke-dasharray":"2 3"});
el("text",{x:X1-4,y:Y(ua)+16,"font-size":12,"text-anchor":"end",fill:css("--hl")},"U_átlag = "+fmt(ua,2)+" V");
el("text",{x:X1-4,y:Y(ue)-6,"font-size":12,"text-anchor":"end",fill:css("--hl2")},"U_eff = "+fmt(ue,2)+" V");
[0,U/2,U].forEach(q=>el("text",{x:X0-6,y:Y(q)+4,"font-size":11,"text-anchor":"end"},fmt(q,q%1?1:0)));
el("text",{x:(X0+X1)/2,y:Y1+18,"font-size":12,"text-anchor":"middle"},"idő: 3 periódus, T = "+fmt(T,2)+" ms, t_be = "+fmt(D*T,2)+" ms");
status("U_átlag = <b>"+fmt(ua,2)+" V</b>, U_eff = <b>"+fmt(ue,2)+" V</b>, I_csúcs = <b>"+fmt(ip,2)+" A</b>, P_terhelés = U_eff²/R = <b>"+fmt(P,2)+" W</b>, P_MOSFET = D·I²·R_DS(on) = <b>"+fmt(PM,3)+" W</b>. "+
  (hm?"Motornál a fordulatszám az <b>átlagfeszültséget</b> követi.":"Fűtőszálnál/izzónál a teljesítményt az <b>effektív érték</b> adja; <span class='bad'>az átlaggal számolt "+fmt(PW,2)+" W hibás</span>."));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
