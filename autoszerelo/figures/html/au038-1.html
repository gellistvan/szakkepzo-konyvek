<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kétcsöves lengéscsillapító</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="pos">dugattyúrúd helyzete</label><input id="pos" type="range" min="0" max="100" step="1" value="50" aria-label="dugattyúrúd helyzete"><output id="pos_o" for="pos"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 300" role="img" aria-label="Kétcsöves lengéscsillapító metszete az olaj útjával összenyomáskor és kihúzáskor."></svg>
<p class="small">Sematikus működési vázlat; a szelepek kialakítása gyártónként eltér.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"pos":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

svg = FIG.svg;
const ln=css("--line"), fg=css("--fg"), oil=css("--grid");
const prev = (window.P===undefined)? v.pos : window.P; const dv = v.pos - prev; window.P = v.pos;
if (dv!==0) window.D = dv<0 ? "nyom" : "huz";
const mode = window.D || "";
const x0=200, yb=270, Hh=200, RI=40, RO=60;   // SVG: y lefelé nő
const yp = yb-40-(v.pos/100)*110;            // dugattyú felső éle
el("rect",{x:x0-RO,y:yb-Hh,width:2*RO,height:Hh,fill:"none",stroke:ln,"stroke-width":3});
el("rect",{x:x0-RO+2,y:yb-90,width:RO-RI-4,height:88,fill:oil});el("rect",{x:x0+RI+2,y:yb-90,width:RO-RI-4,height:88,fill:oil});
el("text",{x:x0-RO-8,y:yb-130,"font-size":11,"text-anchor":"end"},"gáz");el("text",{x:x0-RO-8,y:yb-40,"font-size":11,"text-anchor":"end"},"olaj");
el("rect",{x:x0-RI,y:yb-Hh+22,width:2*RI,height:Hh-34,fill:oil,stroke:ln,"stroke-width":2});
el("rect",{x:x0-RI,y:yb-12,width:2*RI,height:8,fill:fg});
el("rect",{x:x0-RI,y:yp,width:2*RI,height:14,fill:fg});
el("rect",{x:x0-8,y:20,width:16,height:yp-20,fill:css("--bg"),stroke:ln,"stroke-width":2});
el("rect",{x:x0-RO,y:yb-Hh,width:2*RO,height:20,fill:css("--muted")});
function arr(x1,y1,x2,y2,c){el("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:c,"stroke-width":3});
  const a=Math.atan2(y2-y1,x2-x1);el("path",{d:`M${x2} ${y2} L${x2-10*Math.cos(a-0.4)} ${y2-10*Math.sin(a-0.4)} L${x2-10*Math.cos(a+0.4)} ${y2-10*Math.sin(a+0.4)}Z`,fill:c});}
const c=css("--hl");
if(mode==="nyom"){ arr(x0-20,yp+40,x0-20,yp-10,c);arr(x0+20,yp+40,x0+20,yp-10,c);arr(x0+20,yb-20,x0+20,yb+2,c);arr(x0+30,yb+2,x0+RI+12,yb-20,c);
  status('<b>Összenyomás:</b> az olaj a dugattyúszelepen <b>felfelé</b> áramlik; a betolt rúd térfogatának megfelelő olaj a <b>fenékszelepen át a kiegyenlítő térbe</b> jut. A fojtás a mozgási energiát hővé alakítja.');}
else if(mode==="huz"){ arr(x0-20,yp-30,x0-20,yp+30,c);arr(x0+20,yp-30,x0+20,yp+30,c);arr(x0+RI+12,yb-20,x0+30,yb+2,c);arr(x0+20,yb+2,x0+20,yb-20,c);
  status('<b>Kihúzás:</b> az olaj a dugattyúszelepen <b>lefelé</b> áramlik; a hiányzó olajtérfogat a <b>kiegyenlítő térből a fenékszelepen át</b> visszaszívódik.');}
else status("Mozgasd a csúszkát: lefelé (kisebb érték) = összenyomás, felfelé = kihúzás.");
el("text",{x:330,y:60,"font-size":13},"dugattyúrúd, dugattyú szeleppel");
el("text",{x:330,y:85,"font-size":13},"munkahenger, fenékszelep");
el("text",{x:330,y:110,"font-size":13},"kiegyenlítő tér: alul olaj, felül gáz");
el("text",{x:330,y:150,"font-size":12,fill:css("--muted")},"kék nyíl: az olaj áramlási iránya");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
