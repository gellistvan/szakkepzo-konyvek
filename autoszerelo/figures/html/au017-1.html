<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hajlító- és csavarófeszültség eloszlása</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="Mh">Hajlítónyomaték M_h</label><input id="Mh" type="range" min="0" max="300" step="1" value="120" aria-label="Hajlítónyomaték M_h"><output id="Mh_o" for="Mh"></output></div>
<div class="row"><label for="Mcs">Csavarónyomaték M_cs</label><input id="Mcs" type="range" min="0" max="300" step="1" value="80" aria-label="Csavarónyomaték M_cs"><output id="Mcs_o" for="Mcs"></output></div>
<div class="row"><label for="d">Átmérő d</label><input id="d" type="range" min="15" max="40" step="0.5" value="30" aria-label="Átmérő d"><output id="d_o" for="d"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 360" role="img" aria-label="Hajlításnál a feszültség a semleges száltól lineárisan nő, csavarásnál a középponttól a palástig; mindkettő a felületen maximális."></svg>
<p class="small">Alapérték: a fejezet 3. példája (M_h = 120 Nm, M_cs = 80 Nm, d = 30 mm → 45,3 / 15,1 / 52,3 MPa). A nyilak hossza a feszültséggel arányos (nagy értéknél a rajz kilóghat).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"Mh":"Nm", "Mcs":"Nm", "d":"mm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const d = v.d, Kh = Math.PI * d ** 3 / 32, Kp = 2 * Kh, sh = v.Mh * 1000 / Kh, tc = v.Mcs * 1000 / Kp, sr = Math.sqrt(sh * sh + 3 * tc * tc);
const R = 30 + d * 2.2, sc = 1.1;              // px / MPa
// hajlítás: keresztmetszet + σ(y)
const cx = 120, cy = 170;
el("circle", {cx: cx, cy: cy, r: R, fill: "none", stroke: css("--line"), "stroke-width": 2});
el("line", {x1: cx - R - 20, y1: cy, x2: cx + R + 200, y2: cy, stroke: css("--line"), "stroke-dasharray": "6 4"});
const x0 = cx + R + 40, w = sh * sc;
el("line", {x1: x0, y1: cy - R, x2: x0, y2: cy + R, stroke: css("--line")});
el("path", {d: `M${x0} ${cy} L${x0 - w} ${cy - R} L${x0} ${cy - R} Z`, fill: css("--hl"), "fill-opacity": 0.55, stroke: css("--line")});
el("path", {d: `M${x0} ${cy} L${x0 + w} ${cy + R} L${x0} ${cy + R} Z`, fill: css("--hl2"), "fill-opacity": 0.55, stroke: css("--line")});
el("text", {x: x0 - 4, y: cy - R - 8, "font-size": 12, "text-anchor": "end"}, "− nyomás: " + fmt(sh, 1) + " MPa");
el("text", {x: x0 + 4, y: cy + R + 18, "font-size": 12}, "+ húzás: " + fmt(sh, 1) + " MPa");
el("text", {x: x0 + w + 8, y: cy - 6, "font-size": 11}, "semleges szál");
el("text", {x: 20, y: 24, "font-size": 14, "font-weight": "bold"}, "Hajlítás σ(y)");
// csavarás: keresztmetszet + τ nyilak
const qx = 470, qy = 170;
el("circle", {cx: qx, cy: qy, r: R, fill: "none", stroke: css("--line"), "stroke-width": 2});
for (const f of [0.33, 0.66, 1]) for (let k = 0; k < 8; k++) {
  const a = k * Math.PI / 4, r = R * f, px = qx + r * Math.cos(a), py = qy + r * Math.sin(a), L = tc * sc * f * 0.8;
  const tx = -Math.sin(a), ty = Math.cos(a), ex = px + tx * L, ey = py + ty * L;
  el("line", {x1: px, y1: py, x2: ex, y2: ey, stroke: css("--hl2"), "stroke-width": 1 + 1.5 * f});
  el("path", {d: `M${ex} ${ey} l${-tx * 7 + ty * 4} ${-ty * 7 - tx * 4} l${-ty * 8} ${tx * 8} Z`, fill: css("--hl2")}); }
el("circle", {cx: qx, cy: qy, r: 3, fill: css("--fg")});
el("text", {x: qx, y: qy + R + 24, "font-size": 12, "text-anchor": "middle"}, "τ_max = " + fmt(tc, 1) + " MPa a palástnál, középen 0");
el("text", {x: 360, y: 24, "font-size": 14, "font-weight": "bold"}, "Csavarás τ(r)");
status(`K<sub>h</sub> = πd³/32 = ${fmt(Kh, 0)} mm³, K<sub>p</sub> = 2K<sub>h</sub> = ${fmt(Kp, 0)} mm³.<br>` +
       `σ<sub>h</sub> = M<sub>h</sub>/K<sub>h</sub> = <b>${fmt(sh, 1)} MPa</b>, τ<sub>cs</sub> = M<sub>cs</sub>/K<sub>p</sub> = <b>${fmt(tc, 1)} MPa</b>, ` +
       `σ<sub>red</sub> = √(σ<sub>h</sub>² + 3τ<sub>cs</sub>²) = <b>${fmt(sr, 1)} MPa</b>.`);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
