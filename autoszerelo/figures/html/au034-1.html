<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csavarkötés előfeszítése</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="MA">meghúzási nyomaték M_A</label><input id="MA" type="range" min="0" max="120" step="1" value="80" aria-label="meghúzási nyomaték M_A"><output id="MA_o" for="MA"></output></div>
<div class="row"><label for="k">súrlódási tényező k</label><input id="k" type="range" min="0.1" max="0.25" step="0.01" value="0.2" aria-label="súrlódási tényező k"><output id="k_o" for="k"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 290" role="img" aria-label="Csavarkötés metszete előfeszítő erővel; a meghúzási nyomatékból és k tényezőből számolt előfeszítő erő és feszültség M12 csavarra."></svg>
<p class="small">M12, A_s = 84,3 mm²; F_M = M_A/(k·d), σ = F_M/A_s (közelítés). A folyáshatárok (8.8: 640 MPa, 10.9: 900 MPa) tanulási példák, ellenőrizendők az MSZ EN ISO 898-1 szerint. A nyúlás és az összenyomás eltúlzott szemléltetés.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"MA":"Nm", "k":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

svg = FIG.svg;
const d=12, As=84.3, FM=v.MA/(v.k*d/1000), sig=FM/As, u88=sig/640, u109=sig/900;
status(`F<sub>M</sub> = M<sub>A</sub>/(k·d) = ${fmt(v.MA,0)}/(${fmt(v.k,2)}·0,012) ≈ <b>${fmt(FM/1000,1)} kN</b>; σ = F<sub>M</sub>/A<sub>s</sub> ≈ <b>${fmt(sig,0)} MPa</b><br>`+
  `8.8 (R<sub>p0,2</sub> = 640 MPa): ${fmt(u88*100,0)}% `+(u88>1?'<span class="bad">folyáshatár fölött!</span>':(u88>=0.6&&u88<=0.75?'<span class="ok">60–75% tartomány</span>':''))+
  ` · 10.9 (900 MPa): ${fmt(u109*100,0)}% `+(u109>1?'<span class="bad">folyáshatár fölött!</span>':(u109>=0.6&&u109<=0.75?'<span class="ok">60–75% tartomány</span>':'')));
const st=Math.min(sig/900,1.4)*40;   // eltúlzott nyúlás (px)
const ln=css("--line"), fg=css("--fg");
// lemezek (összenyomás eltúlozva)
const c=Math.min(sig/900,1.4)*10;
el("rect",{x:40,y:80+c/2,width:120,height:50-c/2,fill:"none",stroke:ln});el("rect",{x:200,y:80+c/2,width:120,height:50-c/2,fill:"none",stroke:ln});
el("rect",{x:40,y:130,width:120,height:50-c/2,fill:"none",stroke:ln,"stroke-dasharray":"5 3"});el("rect",{x:200,y:130,width:120,height:50-c/2,fill:"none",stroke:ln,"stroke-dasharray":"5 3"});
el("rect",{x:130,y:40+c/2,width:100,height:40,fill:"none",stroke:ln,"stroke-width":2});
el("rect",{x:165,y:80+c/2,width:30,height:150+st-c/2,fill:"none",stroke:ln,"stroke-width":2});
el("rect",{x:135,y:180-c/2,width:90,height:40,fill:"none",stroke:ln,"stroke-width":2});
el("text",{x:245,y:205,"font-size":12},"anya");el("text",{x:240,y:60,"font-size":12},"csavarfej");el("text",{x:330,y:110,"font-size":12},"lemezek");
el("text",{x:200,y:250+st,"font-size":12},"nyúlás (eltúlozva)");
// kihasználtsági sávok
const bx=400, bw=220;
[["8.8",u88,40],["10.9",u109,110]].forEach(([n,u,y])=>{
  el("text",{x:bx,y:y-6,"font-size":13},`${n}: ${fmt(u*100,0)}% R_p0,2`);
  el("rect",{x:bx,y:y,width:bw,height:22,fill:"none",stroke:ln});
  el("rect",{x:bx+0.6*bw,y:y,width:0.15*bw,height:22,fill:css("--grid")});
  el("rect",{x:bx,y:y+6,width:Math.min(u,1.3)/1.3*bw*1.3>bw?bw:Math.min(u,1)*bw,height:10,fill:u>1?css("--bad"):css("--hl")});
  el("line",{x1:bx+bw,y1:y-4,x2:bx+bw,y2:y+26,stroke:css("--bad"),"stroke-width":2});
});
el("text",{x:bx,y:165,"font-size":12,fill:css("--muted")},"szürke sáv: 60–75% előfeszítési tartomány");
el("text",{x:bx,y:182,"font-size":12,fill:css("--muted")},"piros vonal: folyáshatár (100%)");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
