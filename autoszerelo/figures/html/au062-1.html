<title>A forgattyús tengely részei</title><style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--box:#f3f3f3}

.spot{fill:transparent;stroke:transparent;stroke-width:3;cursor:pointer}

.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}select,button{font:inherit;padding:3px 10px}

.small{font-size:12px;color:var(--muted)}</style></head><body>
