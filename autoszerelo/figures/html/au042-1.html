2 30 \nM 33 105 \nL 105 33 \nM 36 108 \nL 108 36 \n\" style=\"fill: #000000; stroke: #000000; stroke-width: 1.0; stroke-linecap: butt; stroke-linejoin: miter\"/>\n  <\/pattern>\n  <pattern id=\"hd058e9de96\" patternUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"72\" height=\"72\">\n   <rect x=\"0\" y=\"0\" width=\"73\" height=\"73\" fill=\"#d9d9d9\"/>\n   <path d=\"M -36 36 \nL 36 -36 \nM -24 48 \nL 48 -24 \nM -12 60 \nL 60 -12 \nM 0 72 \nL 72 0 \nM 12 84 \nL 84 12 \nM 24 96 \nL 96 24 \nM 36 108 \nL 108 36 \n\" style=\"fill: #000000; stroke: #000000; stroke-width: 1.0; stroke-linecap: butt; stroke-linejoin: miter\"/>\n  <\/pattern>\n <\/defs>\n<\/svg>\n", "msg": "<b>Töltés vége:<\/b> ha már nincs átalakítható PbSO₄, a töltőáram vizet bont: a pozitív lemezen O₂, a negatívon H₂ fejlődik. A durranógáz robbanásveszélyes: szellőztetés, szikra- és lángmentesség, a töltő kikapcsolása a saruk bontása előtt. <span class='small'>(Mutasson egy részre a nevéért.)<\/span>"}], PARTS={"p_pos": "pozitív lemez: ólom-dioxid (PbO₂)", "p_neg": "negatív lemez: szivacsos ólom (Pb)", "p_sep": "szeparátor (szigetelő, ionáteresztő)", "p_el": "elektrolit: hígított kénsav (H₂SO₄-oldat)", "p_haz": "saválló műanyag cellaház", "p_sulf": "ólom-szulfát (PbSO₄) réteg a lemezen", "p_load": "külső kör: fogyasztó (izzó) vagy töltő", "p_gas": "gázbuborékok: O₂ a pozitív, H₂ a negatív lemezen"};
let k=0,timer=null;
const fig=document.getElementById("fig"),st=document.getElementById("status"),part=document.getElementById("part");
function show(i){k=(i+FR.length)%FR.length;fig.innerHTML=FR[k].svg;st.innerHTML=FR[k].msg;
  document.querySelectorAll("button[data-i]").forEach(b=>b.classList.toggle("on",+b.dataset.i===k));
  fig.querySelectorAll('[id^="p_"]').forEach(g=>{const n=PARTS[g.id];if(!n)return;
    g.addEventListener("mouseenter",()=>{g.classList.add("hl");part.textContent=n;});
    g.addEventListener("mouseleave",()=>{g.classList.remove("hl");part.textContent="";});
    g.addEventListener("click",()=>{part.textContent=n;});});}
document.querySelectorAll("button[data-i]").forEach(b=>b.addEventListener("click",()=>{stop();show(+b.dataset.i);}));
function stop(){if(timer){clearInterval(timer);timer=null;const p=document.getElementById("play");if(p)p.textContent="▶ Lejátszás";}}
const pl=document.getElementById("play");
if(pl)pl.addEventListener("click",()=>{if(timer){stop();return;}pl.textContent="⏸ Szünet";timer=setInterval(()=>show(k+1),3500);});
const pv=document.getElementById("prev"),nx=document.getElementById("next");
if(pv)pv.addEventListener("click",()=>{stop();show(k-1);});if(nx)nx.addEventListener("click",()=>{stop();show(k+1);});
show(0);
</script>
