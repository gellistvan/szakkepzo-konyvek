<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viaszos termosztát működése</title><style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--box:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--box:#2a2a2a}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.stage{position:relative;background:#fff;border-radius:4px}.stage img{width:100%;display:block}
.stage svg{position:absolute;left:0;top:0;width:100%;height:100%}
.spot{fill:transparent;stroke:transparent;stroke-width:3;cursor:pointer}
.spot:hover,.spot.on{fill:rgba(31,78,121,.15);stroke:#1f4e79}
.spot.dim{fill:rgba(255,255,255,.72)}
#info{margin:8px 0;padding:6px 10px;background:var(--box);min-height:3.2em;border-left:4px solid var(--hl)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}select,button{font:inherit;padding:3px 10px}
button.on{outline:3px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
input[type=range]{flex:1;min-width:160px}</style></head><body>
<div class="ctl"><label for="s">hűtőfolyadék-hőmérséklet</label><input id="s" type="range" min="0" max="10" step="1" value="0">
<output id="o"></output></div>
<div id="info" aria-live="polite"></div>
<div class="stage"><img id="im" alt="Termosztát hidegen zárt, melegen nyitott állapotban; a viasz tágulása nyitja a szelepet."></div>
<p class="small">Szemléltető modell: nyitás kezdete 87 °C, teljes nyitás 102 °C (a fejezet vizsgálati példája; gyártói adat, ellenőrizendő). Hiba: „zárva marad” → túlmelegedés; „nyitva ragad” → lassú melegedés, hideg fűtés.</p>
