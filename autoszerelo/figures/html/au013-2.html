<title>Robbantott ábra és összeszerelés</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--btn:#f0f0f0}

.fig{background:#fff;border-radius:6px;padding:4px}
.fig svg{width:100%;height:auto;display:block}

#desc{min-height:2.6em}
.small{font-size:12px;color:var(--muted)}</style>
