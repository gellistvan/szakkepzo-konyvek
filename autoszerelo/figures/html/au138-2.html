.spot{fill:transparent;stroke:transparent;stroke-width:3;cursor:pointer}

.spot.dim{fill:rgba(255,255,255,.72)}

.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}select,button{font:inherit}
.small{font-size:12px;color:var(--muted)}</style></head><body>
