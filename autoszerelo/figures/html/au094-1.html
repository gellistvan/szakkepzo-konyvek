#info{margin:6px 0;min-height:1.6em}
#parts{display:flex;flex-wrap:wrap;gap:4px}

.small{font-size:12px;color:var(--muted)}

818 100.697945 \nL 84.636818 96.697945 \nL 86.636818 100.697945 \nz\n\" style=\"stroke: #000000; stroke-width: 1.6; stroke-linecap: round\"/>\n   <\/g>\n   <g id=\"text_1\">\n    <text style=\"font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: middle\" x=\"154.26\" y=\"19.139892\" transform=\"rotate(-0 154.26 19.139892)\">fékhenger<\/text>\n   <\/g>\n   <g id=\"text_2\">\n    <text style=\"font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: middle\" x=\"154.26\" y=\"202.569267\" transform=\"rotate(-0 154.26 202.569267)\">támaszpont (közös, lent)<\/text>\n   <\/g>\n   <g id=\"text_3\">\n    <text style=\"font-size: 7.6px; font-family: 'DejaVu Sans'\" transform=\"translate(141.009875 106.417011)\">forgás-<\/text>\n    <text style=\"font-size: 7.6px; font-family: 'DejaVu Sans'\" transform=\"translate(144.656094 115.292148)\">irány<\/text>\n   <\/g>\n   <g id=\"text_4\">\n    <text style=\"font-size: 7.4px; font-family: 'DejaVu Sans'\" transform=\"translate(251.502116 165.687798)\">RÁFUTÓ pofa:<\/text>\n    <text style=\"font-size: 7.4px; font-family: 'DejaVu Sans'\" transform=\"translate(228.229116 173.97418)\">a súrlódás a dobhoz<\/text>\n    <text style=\"font-size: 7.4px; font-family: 'DejaVu Sans'\" transform=\"translate(229.093991 182.615761)\">szorítja (önerősítés)<\/text>\n   <\/g>\n   <g id=\"text_5\">\n    <text style=\"font-size: 7.4px; font-family: 'DejaVu Sans'\" transform=\"translate(5.882727 165.687798)\">ELFUTÓ pofa:<\/text>\n    <text style=\"font-size: 7.4px; font-family: 'DejaVu Sans'\" transform=\"translate(5.882727 173.97418)\">a súrlódás elemeli,<\/text>\n    <text style=\"font-size: 7.4px; font-family: 'DejaVu Sans'\" transform=\"translate(5.882727 182.260561)\">kisebb szorítás<\/text>\n   <\/g>\n   <g id=\"text_6\">\n    <text style=\"font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start\" x=\"5.882727\" y=\"13.081321\" transform=\"rotate(-0 5.882727 13.081321)\">(a) Szimplex dobfék<\/text>\n   <\/g>\n  <\/g>\n <\/g>\n <defs>\n  <clipPath id=\"pe31c8a584e\">\n   <rect x=\"3.6\" y=\"3.6\" width=\"301.32\" height=\"205.445455\"/>\n  <\/clipPath>\n <\/defs>\n<\/svg>\n"}], PARTS={"tarcsa": ["Féktárcsa", "a kerékkel együtt forog"], "dugattyu": ["Dugattyú", "a hidraulikus nyomás tolja"], "belso": ["Belső fékbetét", "a dugattyú nyomja a tárcsához"], "kulso": ["Külső fékbetét", "a nyereg reakcióereje húzza a tárcsához"], "nyereg": ["Úszó nyereg", "a vezetőcsapokon oldalirányban elcsúszik"], "csap": ["Vezetőcsap", "korrózió/megszorulás → egyoldali (belső) kopás"], "tarto": ["Nyeregtartó (rögzített)", "a keréktartóhoz csavarozva"], "folyadek": ["Fékfolyadék nyomás alatt", ""]}, MODE="step";
let k=0,sel=null,timer=null;
const box=document.getElementById("fig"),st=document.getElementById("status"),info=document.getElementById("info");
function hl(key){sel=key;box.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl"));
  if(key){box.querySelectorAll('[id^="p_'+key+'__"]').forEach(e=>e.classList.add("hl"));}
  const p=key&&PARTS[key];info.innerHTML=p?"<b>"+p[0]+"</b>"+(p[1]?" – "+p[1]:""):"<span class=small>Mutass vagy kattints egy alkatrészre (vagy a lenti gombokra).</span>";
  document.querySelectorAll("#parts button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===key));}
function bind(){box.querySelectorAll('[id^="p_"]').forEach(g=>{const key=g.id.slice(2).split("__")[0];if(!PARTS[key])return;
  g.style.cursor="pointer";g.addEventListener("mouseenter",()=>hl(key));g.addEventListener("click",()=>hl(key));});}
function parts(){const have=new Set([...box.querySelectorAll('[id^="p_"]')].map(g=>g.id.slice(2).split("__")[0]));
  const pc=document.getElementById("parts");pc.innerHTML="";
  Object.keys(PARTS).filter(x=>have.has(x)).forEach(x=>{const b=document.createElement("button");b.textContent=PARTS[x][0];b.dataset.k=x;
  b.onclick=()=>hl(sel===x?null:x);pc.appendChild(b);});}
function show(i){k=Math.max(0,Math.min(FR.length-1,i));const f=FR[k];box.innerHTML=f.svg;st.innerHTML=f.msg||"";
  const c=document.getElementById("cnt");if(c)c.textContent=(k+1)+"/"+FR.length;
  document.querySelectorAll("button[data-f]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.f===k));
  const pos=document.getElementById("pos");if(pos)pos.value=k;
  bind();parts();hl(sel&&PARTS[sel]?sel:null);if(window.onFrame)window.onFrame(k);}
function stop(){if(timer){clearInterval(timer);timer=null;}const p=document.getElementById("play");if(p)p.textContent="▶ Lejátszás";}
const $=id=>document.getElementById(id);
if(MODE==="step"){$("first").onclick=()=>{stop();show(0)};$("prev").onclick=()=>{stop();show(k-1)};$("next").onclick=()=>{stop();show(k+1)};
  $("pos").max=FR.length-1;$("pos").oninput=()=>{stop();show(+$("pos").value)};
  $("play").onclick=()=>{if(timer){stop();return;}if(k>=FR.length-1)show(0);$("play").textContent="⏸ Szünet";
    timer=setInterval(()=>{if(k>=FR.length-1)stop();else show(k+1);},1800);};
  document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){stop();show(k+1);}if(e.key==="ArrowLeft"){stop();show(k-1);}});}
else{document.querySelectorAll("button[data-f]").forEach(b=>b.onclick=()=>show(+b.dataset.f));}

show(0);
</script>
