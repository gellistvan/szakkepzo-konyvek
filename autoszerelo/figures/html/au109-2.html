<title>Klímaszerviz lépésről lépésre</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#c55a11;--btn:#f0f0f0;--btnon:#1f4e79;--btnonfg:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#f0a060;--btn:#2a2a2a;--btnon:#8fb8e8;--btnonfg:#111}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer;background:var(--btn);color:var(--fg);border:1px solid var(--muted);border-radius:4px}
button.on{background:var(--btnon);color:var(--btnonfg);border-color:var(--btnon)}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:2.9em}
.fr{display:none;background:#fff;border-radius:4px;padding:4px}
.fr.on{display:block}
.fr svg{display:block;width:100%;height:auto;max-height:400px}
.fr text{fill:#111}
g.part{cursor:pointer}
g.hl path,g.hl use{stroke:#c55a11 !important;stroke-width:3px !important}
.small{font-size:12px;color:var(--muted)}
</style>
</head>

<p class="small">Sematikus képsor; a pontos sorrend, az idők és a mennyiségek a gyártói utasítás és az állomás kezelési útmutatója szerint (ellenőrizendő). F-gáz képesítés és nyilvántartás: hatályos rendelet szerint (ellenőrizendő).</p>
<script>
const MODE="steps", MSG=["<b>1.</b> Védőkesztyű és védőszemüveg (fagysérülés). A hűtőközeg típusát (R134a / R1234yf) és a töltetet a motortéri adattábláról olvassuk le; a szervizállomás és a csatlakozó legyen ehhez való.", "<b>2.</b> Motor áll. A kék (L) gyorscsatlakozó a kisebb kisnyomású, a piros (H) a nagyobb nagynyomású szervizszelepre kerül; felhelyezés után nyitjuk a csatlakozó szelepét. <i>Ellenőrzés: a mérők nyomást mutatnak.</i>", "<b>3.</b> Lefejtés: az állomás visszanyeri a hűtőközeget; leolvassuk a visszanyert mennyiséget és a kivált olajat. <i>Ellenőrzés: a kinyert tömeg összevetése az adattáblával.</i>", "<b>4.</b> Vákuumozás a gyártói időtartamig, majd vákuumtartás-próba. <i>Ellenőrzés: ha a vákuum nem tart, szivárgás van – javítás (pl. O-gyűrű) és új próba.</i>", "<b>5.</b> A lefejtett olaj (és szükség szerint UV-adalék) pótlása az előírt mennyiségben, majd töltés az adattábla szerinti tömegre. <i>Ellenőrzés: a betöltött tömeg az állomás mérlegén.</i>", "<b>6.</b> Működéspróba: kifújt levegő hőmérséklete, nyomások, szivárgásvizsgálat detektorral; a tömlők levétele után a szelepek zárása és a védősapkák visszahelyezése. <i>Hűtőközeget légkörbe engedni tilos.</i>"], PARTS={"allomas": "klímaszerviz-állomás", "kijelzo": "kijelző", "mero": "nyomásmérő (L kisnyomású, H nagynyomású)", "szelep": "szervizszelep a klímacsövön", "sapka": "védősapka", "gyors": "gyorscsatlakozó", "eve": "egyéni védőeszköz", "tabla": "klíma-adattábla", "szell": "szellőzőnyílás", "homero": "hőmérő", "detektor": "elektronikus szivárgáskereső"}, LABELS=["1  EVE, hűtőközeg-típus", "2  csatlakoztatás (L/H)", "3  lefejtés (visszanyerés)", "4  vákuumozás, tartáspróba", "5  olaj/UV, töltés", "6  működéspróba, sapkák"];
const FR=[...document.querySelectorAll(".fr")], ST=document.getElementById("status");
let k=0, timer=null;
function show(i){k=Math.max(0,Math.min(FR.length-1,i));FR.forEach((f,j)=>f.classList.toggle("on",j===k));
  document.querySelectorAll("button[data-i]").forEach(b=>b.classList.toggle("on",+b.dataset.i===k));
  const r=document.getElementById("pos");if(r){r.value=k;}
  const c=document.getElementById("cnt");if(c){c.textContent=(MODE==="slider"?LABELS[k]:(k+1)+"/"+FR.length);}
  ST.innerHTML=MSG[k]||"";}
function stop(){if(timer){clearInterval(timer);timer=null;}const p=document.getElementById("play");if(p)p.textContent="▶ Lejátszás";}
document.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{stop();show(+b.dataset.i);});
const B=id=>document.getElementById(id);
if(B("first")){B("first").onclick=()=>{stop();show(0);};B("prev").onclick=()=>{stop();show(k-1);};B("next").onclick=()=>{stop();show(k+1);};
  B("play").onclick=()=>{if(timer){stop();return;}if(k>=FR.length-1)show(0);B("play").textContent="⏸ Szünet";
    timer=setInterval(()=>{if(k>=FR.length-1)stop();else show(k+1);},3500);};}
if(B("pos"))B("pos").oninput=()=>{stop();show(+B("pos").value);};
document.querySelectorAll("g[id]").forEach(g=>{const m=g.id.match(/_p_([A-Za-z0-9]+)$/);if(!m||!(m[1] in PARTS))return;
  g.classList.add("part");const t=document.createElementNS("http://www.w3.org/2000/svg","title");t.textContent=PARTS[m[1]];g.prepend(t);
  const on=()=>{document.querySelectorAll("g.part").forEach(x=>{const mm=x.id.match(/_p_([A-Za-z0-9]+)$/);x.classList.toggle("hl",mm&&mm[1]===m[1]);});ST.innerHTML="<b>"+PARTS[m[1]]+"</b>";};
  g.addEventListener("mouseenter",on);g.addEventListener("click",on);g.addEventListener("focus",on);
  g.addEventListener("mouseleave",()=>{document.querySelectorAll("g.part.hl").forEach(x=>x.classList.remove("hl"));ST.innerHTML=MSG[k]||"";});});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){stop();show(k+1);}if(e.key==="ArrowLeft"){stop();show(k-1);}});

show(0);
</script>
