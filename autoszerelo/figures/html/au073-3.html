<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Injektor-visszafolyás értékelése</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="i1">1. injektor</label><input id="i1" type="range" min="0" max="40" step="0.5" value="6.0" aria-label="1. injektor"><output id="i1_o" for="i1"></output></div>
<div class="row"><label for="i2">2. injektor</label><input id="i2" type="range" min="0" max="40" step="0.5" value="6.0" aria-label="2. injektor"><output id="i2_o" for="i2"></output></div>
<div class="row"><label for="i3">3. injektor</label><input id="i3" type="range" min="0" max="40" step="0.5" value="24.0" aria-label="3. injektor"><output id="i3_o" for="i3"></output></div>
<div class="row"><label for="i4">4. injektor</label><input id="i4" type="range" min="0" max="40" step="0.5" value="6.0" aria-label="4. injektor"><output id="i4_o" for="i4"></output></div>
<div class="row"><label for="lim">Határ (gyártói)</label><input id="lim" type="range" min="10" max="40" step="1" value="25.0" aria-label="Határ (gyártói)"><output id="lim_o" for="lim"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 340" role="img" aria-label="Négy mérőcső az injektorok visszafolyásával; a határ feletti vagy a többihez képest kiugró érték vastag kerettel jelölve."></svg>
<p class="small">Mérési idő 60 s. A kiinduló értékek szemléltetők (a fejezet esete: a 3. injektor visszafolyása a többi négyszerese); a határérték gyártói adat (ellenőrizendő). A „kiugró” szabály (a többi mediánjának kétszerese) tanulási segédszabály, nem gyártói előírás.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"i1":"ml", "i2":"ml", "i3":"ml", "i4":"ml", "lim":"ml"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const vals=[v.i1,v.i2,v.i3,v.i4], lim=v.lim, ink=css("--fg"), mute=css("--muted");
const med=a=>{const b=[...a].sort((x,y)=>x-y);const m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2;};
const res=vals.map((x,i)=>{const o=vals.filter((_,j)=>j!==i);return x>lim?"határ felett":(med(o)>0&&x>2*med(o)?"kiugró":"rendben");});
const X0=70,W=60,GAP=60,TOP=40,H=260,MAX=40;
const y=val=>TOP+H-H*Math.min(val,MAX)/MAX;
for(let k=0;k<=MAX;k+=10){el("line",{x1:X0-12,y1:y(k),x2:X0+4*(W+GAP),y2:y(k),stroke:mute,"stroke-width":0.5,"stroke-dasharray":"2 3"});
  el("text",{x:X0-16,y:y(k)+4,"text-anchor":"end","font-size":11},k+" ml");}
vals.forEach((x,i)=>{const xx=X0+i*(W+GAP),bad=res[i]!=="rendben";
  el("rect",{x:xx,y:y(x),width:W,height:TOP+H-y(x),fill:"#9e9e9e"});
  el("rect",{x:xx,y:TOP,width:W,height:H,fill:"none",stroke:ink,"stroke-width":bad?5:1.5,"stroke-dasharray":res[i]==="kiugró"?"8 4":""});
  el("text",{x:xx+W/2,y:TOP+H+18,"text-anchor":"middle","font-size":13,"font-weight":"bold"},(i+1)+". injektor");
  el("text",{x:xx+W/2,y:y(x)-6,"text-anchor":"middle","font-size":12},fmt(x,1)+" ml");
  el("text",{x:xx+W/2,y:TOP+H+34,"text-anchor":"middle","font-size":11,"font-weight":bad?"bold":"normal"},res[i]);});
el("line",{x1:X0-12,y1:y(lim),x2:X0+4*(W+GAP),y2:y(lim),stroke:ink,"stroke-width":2,"stroke-dasharray":"7 4"});
el("text",{x:X0+4*(W+GAP)-100,y:y(lim)-6,"font-size":11},"határ: "+fmt(lim,0)+" ml");
const bad=res.map((r,i)=>r!=="rendben"?(i+1)+". ("+r+")":null).filter(Boolean);
status(bad.length?`<span class="bad">Gyanús: ${bad.join(", ")}</span> – vastag keret: határ felett; szaggatott vastag keret: a többi mediánjának kétszerese fölött (kiugró). Belső tömítetlenség gyanúja; ellenőrzés a gyártói eljárással.`
 :`<span class="ok">Mind rendben</span>: a határ alatt, és egyik sem ugrik ki a többihez képest.`);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
