<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RC töltés és kisütés</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="R">Ellenállás R</label><input id="R" type="range" min="1" max="200" step="1" value="10" aria-label="Ellenállás R"><output id="R_o" for="R"></output></div>
<div class="row"><label for="C">Kapacitás C</label><input id="C" type="range" min="10" max="5000" step="10" value="1000" aria-label="Kapacitás C"><output id="C_o" for="C"></output></div>
<div class="row"><label for="U0">Kezdeti/végfeszültség U₀</label><input id="U0" type="range" min="1" max="400" step="1" value="9" aria-label="Kezdeti/végfeszültség U₀"><output id="U0_o" for="U0"></output></div>
<div class="row"><label for="Uk">Küszöbfeszültség (kisütés)</label><input id="Uk" type="range" min="1" max="400" step="1" value="1" aria-label="Küszöbfeszültség (kisütés)"><output id="Uk_o" for="Uk"></output></div>
<div class="row"><label for="preset">Előbeállítás</label><select id="preset" aria-label="Előbeállítás"><option value="0" selected>saját értékek</option><option value="1">Gyakorlati útmutató: 10 kΩ, 1000 µF, 9 V</option><option value="2">5. feladat: 50 kΩ, 2000 µF, 350 V → 60 V</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Kondenzátor töltési és kisütési görbéje, τ után 63 %, illetve 37 %, 5τ után gyakorlatilag teljes"></svg>
<p class="small">Számított, ideális RC-görbék (állandó R és C, ideális kapcsoló). A HV-rendszerek várakozási idejét a gyártói előírás adja; a számolt idő nem helyettesíti a feszültségmentesség műszeres ellenőrzését.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"R":"kΩ", "C":"µF", "U0":"V", "Uk":"V"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

if(v.preset!==0){const p=v.preset===1?[10,1000,9,1]:[50,2000,350,60];["R","C","U0","Uk"].forEach((k,i)=>{document.getElementById(k).value=p[i];});
  document.getElementById("preset").value="0";draw();return;}
const tau=v.R*1e3*v.C*1e-6, U0=v.U0, Uk=Math.min(v.Uk,U0), tk=Uk<U0?tau*Math.log(U0/Uk):0, tmax=Math.max(5*tau,tk*1.1);
const X0=60,X1=540,Y0=20,Y1=280,X=t=>X0+(X1-X0)*t/tmax,Y=u=>Y1-(Y1-Y0)*u/U0;
el("rect",{x:X0,y:Y0,width:X1-X0,height:Y1-Y0,fill:"none",stroke:css("--line")});
[0.368,0.632].forEach(f=>{el("line",{x1:X0,x2:X1,y1:Y(f*U0),y2:Y(f*U0),stroke:css("--grid"),"stroke-dasharray":"4 3"});
  el("text",{x:X1-4,y:Y(f*U0)-4,"font-size":11,"text-anchor":"end"},Math.round(f*100)+" %");});
for(let k=1;k<=5;k++){if(k*tau<=tmax){el("line",{x1:X(k*tau),x2:X(k*tau),y1:Y0,y2:Y1,stroke:css("--grid")});
  el("text",{x:X(k*tau),y:Y1+16,"font-size":11,"text-anchor":"middle"},k+"τ");}}
[0,U0/2,U0].forEach(u=>el("text",{x:X0-6,y:Y(u)+4,"font-size":11,"text-anchor":"end"},fmt(u,u<10?1:0)));
let d1="",d2="";for(let i=0;i<=300;i++){const t=tmax*i/300;d1+=(i?"L":"M")+X(t).toFixed(1)+" "+Y(U0*(1-Math.exp(-t/tau))).toFixed(1);
  d2+=(i?"L":"M")+X(t).toFixed(1)+" "+Y(U0*Math.exp(-t/tau)).toFixed(1);}
el("path",{d:d1,fill:"none",stroke:css("--hl"),"stroke-width":2.2});
el("path",{d:d2,fill:"none",stroke:css("--hl2"),"stroke-width":2.2,"stroke-dasharray":"7 4"});
el("text",{x:X(1.3*tau),y:Y(0.5*U0)-6,"font-size":12,fill:css("--hl")},"töltés");el("text",{x:X(1.3*tau),y:Y(0.5*U0)+14,"font-size":12,fill:css("--hl2")},"kisütés");
if(Uk<U0){el("line",{x1:X0,x2:X1,y1:Y(Uk),y2:Y(Uk),stroke:css("--bad"),"stroke-width":1.2});
  el("circle",{cx:X(tk),cy:Y(Uk),r:5,fill:"none",stroke:css("--bad"),"stroke-width":2});
  el("text",{x:X(tk)+8,y:Y(Uk)-8,"font-size":12,fill:css("--bad")},"t = "+fmt(tk,tk<10?2:0)+" s");}
el("text",{x:(X0+X1)/2,y:Y1+36,"font-size":12,"text-anchor":"middle"},"idő t: 0 … "+fmt(tmax,tmax<10?2:0)+" s");
status("τ = R·C = <b>"+fmt(tau,tau<10?3:1)+" s</b>; 5τ = "+fmt(5*tau,1)+" s. Kisütéskor "+fmt(U0,0)+" V-ról "+fmt(Uk,0)+" V-ra: t = τ·ln(U₀/U) = <b>"+fmt(tk,1)+" s</b>"+
  (U0>60&&Uk<=60?" <span class='small'>(60 V a HV-példa érintésvédelmi küszöbe; a feszültségmentességet mindig műszerrel kell ellenőrizni)</span>":"")+".");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
