<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homokformázás és öntés lépésenként</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--acc:#c55a11;--btn:#f0f0f0}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--acc:#f0a060;--btn:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer;background:var(--btn);color:var(--fg);border:1px solid var(--muted);border-radius:4px}
button.on{outline:2px solid var(--hl);font-weight:bold}
#msg{min-height:2.9em;margin:4px 0 6px}
.fig{background:#fff;border-radius:6px;padding:4px}
.fig svg{width:100%;height:auto;max-height:68vh;display:block}
.fig .hlg path{stroke:#c55a11 !important;stroke-width:3.2px !important}
.fig .hlg text,.fig text.hlg{fill:#c55a11 !important;font-weight:bold}
#parts{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 4px;padding:0;list-style:none}
#parts button{font-size:13px}
#desc{min-height:2.6em}
.small{font-size:12px;color:var(--muted)}</style>
</head>

let k=0, timer=null;
const box=document.getElementById("fig"), msg=document.getElementById("msg"), parts=document.getElementById("parts"),
      desc=document.getElementById("desc"), ctl=document.getElementById("ctl");
function groups(key){return box.querySelectorAll('[id^="hv-'+key+'-"]');}
function hl(key,on){box.querySelectorAll(".hlg").forEach(g=>g.classList.remove("hlg"));
  parts.querySelectorAll("button").forEach(b=>b.classList.toggle("on",on&&b.dataset.k===key));
  if(!on){desc.textContent="";return;}
  groups(key).forEach(g=>g.classList.add("hlg"));
  const p=(VIEWS[k].parts||[]).find(q=>q[0]===key); if(p) desc.innerHTML="<b>"+p[1]+"</b> – "+p[2];}
function show(i){k=Math.max(0,Math.min(VIEWS.length-1,i));const V=VIEWS[k];
  box.innerHTML=V.svg; msg.innerHTML=V.msg||""; desc.textContent="";
  parts.innerHTML=""; (V.parts||[]).forEach(p=>{const b=document.createElement("button");b.textContent=p[1];b.dataset.k=p[0];
    b.addEventListener("mouseenter",()=>hl(p[0],true));b.addEventListener("focus",()=>hl(p[0],true));
    b.addEventListener("click",()=>hl(p[0],true));b.addEventListener("mouseleave",()=>hl(p[0],false));
    const li=document.createElement("li");li.appendChild(b);parts.appendChild(li);});
  ctl.querySelectorAll("button[data-i]").forEach(b=>b.classList.toggle("on",+b.dataset.i===k));
  const c=document.getElementById("cnt"); if(c) c.textContent=(k+1)+"/"+VIEWS.length;}
box.addEventListener("mouseover",e=>{const g=e.target.closest('[id^="hv-"]');if(g){hl(g.id.split("-")[1],true);}});
box.addEventListener("mouseleave",()=>hl("",false));
function stop(){if(timer){clearInterval(timer);timer=null;const p=document.getElementById("play");if(p)p.textContent="▶ Lejátszás";}}
if(MODE==="tabs"){VIEWS.forEach((V,i)=>{const b=document.createElement("button");b.textContent=V.label;b.dataset.i=i;
  b.addEventListener("click",()=>show(i));ctl.appendChild(b);});}
else{[["⏮","first",()=>show(0)],["◀ Lépés","prev",()=>show(k-1)],["▶ Lejátszás","play",null],["Lépés ▶","next",()=>show(k+1)]].forEach(([t,id,f])=>{
  const b=document.createElement("button");b.textContent=t;b.id=id;ctl.appendChild(b);
  b.addEventListener("click",f?()=>{stop();f();}:()=>{if(timer){stop();return;}b.textContent="⏸ Szünet";
    timer=setInterval(()=>{if(k>=VIEWS.length-1){stop();return;}show(k+1);},2600);});});
  const s=document.createElement("span");s.id="cnt";s.className="small";ctl.appendChild(s);}
show(0);
</script>
