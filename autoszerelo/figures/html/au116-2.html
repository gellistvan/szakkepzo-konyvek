<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamera-kalibrálás szöghibája</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="e">Tábla oldalirányú eltolása</label><input id="e" type="range" min="-20" max="20" step="1" value="0" aria-label="Tábla oldalirányú eltolása"><output id="e_o" for="e"></output></div>
<div class="row"><label for="al">Menettengely szöghibája</label><input id="al" type="range" min="-1" max="1" step="0.05" value="0.5" aria-label="Menettengely szöghibája"><output id="al_o" for="al"></output></div>
<div class="row"><label for="d">Tábla távolsága a kamerától</label><input id="d" type="range" min="1" max="3" step="0.1" value="1.5" aria-label="Tábla távolsága a kamerától"><output id="d_o" for="d"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 280" role="img" aria-label="A kamera statikus kalibrálásának elrendezése és a szöghiba hatása a sávbecslésre"></svg>
<p class="small">Tanulási modell: hiba = 50 m · tan(θ), θ = menettengely-szöghiba + atan(eltolás / távolság). A fejezet 2. példája: 0,5° → 50 m-en ≈ 0,44 m. A tűréseket a gyártói javítási utasítás adja (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"e":"cm", "al":"°", "d":"m"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const th=v.al+Math.atan(v.e/100/v.d)*180/Math.PI, err=50*Math.tan(th*Math.PI/180);
const cx=60,cy=140,sc=9; // 1 m = 9 px oldalirányban nagyítva ×6
el("rect",{x:cx-40,y:cy-14,width:46,height:28,rx:8,fill:"none",stroke:css("--line"),"stroke-width":2});
el("text",{x:cx-17,y:cy+40,"font-size":11,"text-anchor":"middle"},"jármű");
el("line",{x1:cx-60,y1:cy,x2:540,y2:cy,stroke:css("--line"),"stroke-dasharray":"8 3 2 3"});
el("text",{x:540,y:cy-8,"font-size":11,"text-anchor":"end"},"menettengely");
const bx=150, by=cy+v.e*0.9;
el("rect",{x:bx,y:by-28,width:8,height:56,fill:css("--grid"),stroke:css("--line")});
el("text",{x:bx+4,y:by-34,"font-size":11,"text-anchor":"middle"},"tábla");
const ex=540, ey=cy-Math.tan(th*Math.PI/180)*(ex-cx)*6;
el("line",{x1:cx,y1:cy,x2:ex,y2:ey,stroke:css("--hl2"),"stroke-width":2.5});
el("text",{x:ex-4,y:ey+(ey<cy?-8:16),"font-size":12,"text-anchor":"end"},"a kamera „egyenesnek” hitt iránya");
el("line",{x1:ex-30,y1:cy,x2:ex-30,y2:ey,stroke:css("--fg"),"stroke-width":1.5});
el("text",{x:20,y:270,"font-size":11},"Oldalirányú eltérés hatszorosan nagyítva; 50 m-es távolság a jobb szélen.");
status("A kamera látóirányának hibája: <b>"+fmt(th,2)+"°</b> (a menettengely szöghibája + a tábla eltolásából atan(e/d)). "+
 "A sávbecslés oldalirányú hibája 50 m-en: <b>"+fmt(Math.abs(err),2)+" m</b>"+(Math.abs(err)>0.2?" – <span class='bad'>a sávtartó tévesen avatkozhat be.</span>":" – <span class='ok'>kicsi.</span>"));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
