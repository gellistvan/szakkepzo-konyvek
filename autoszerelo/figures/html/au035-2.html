<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gördülőcsapágy-típusok</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#c55a11;--line:#000;--btn:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#f0a060;--line:#ddd;--btn:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer;background:var(--btn);color:var(--fg);border:1px solid var(--muted);border-radius:4px}
button.on{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
#fig{background:#fff;border-radius:4px;padding:2px}
#fig svg{width:100%;height:auto;display:block}
#fig svg text{fill:#000}
#fig .hl path,#fig .hl use{stroke:#c55a11 !important;stroke-width:2.6px !important}
#fig .hl text,#fig text.hl{fill:#c55a11 !important;font-weight:bold}
#fig [id^="p-"]{cursor:pointer}
#parts button{font-size:12.5px;padding:2px 7px}
.small{font-size:12px;color:var(--muted)}
.ok{color:#2e7d32;font-weight:bold}.bad{color:#b71c1c;font-weight:bold}
@media (prefers-color-scheme:dark){.ok{color:#81c784}.bad{color:#ef9a9a}}</style>
</head>
<body>
<div class="ctl" id="views" role="group" aria-label="Nézet"></div>
<div class="ctl" id="steps" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div id="status" aria-live="polite"></div>
<div class="ctl" id="quiz"></div>
<div id="fig" role="img" aria-label="Golyós, hengergörgős, kúpgörgős és tűgörgős csapágy metszete terhelési irányokkal; kúpgörgős pár a kerékagyban."></div>
<div class="ctl" id="parts" style="margin-top:6px"></div>
<p class="small">Mutass a rajz egy részére (vagy a lenti gombokra) – a rész kiemelődik, és megjelenik a neve. Sematikus vonalrajz; a konkrét csapágyat a gyártói azonosító adja.</p>

    b.onmouseenter=b.onfocus=()=>{hl(key,true);showPart(key);};b.onmouseleave=b.onblur=()=>{hl(key,false);showStep();};pbar.appendChild(b);});
  pbar.style.display=pbar.children.length?"flex":"none";}
function showStep(){const F=SETS[cur][k];st.innerHTML=F.msg||"";const q=document.getElementById("quiz");q.innerHTML="";
  if(F.quiz){F.quiz.forEach((o,i)=>{const b=document.createElement("button");b.textContent=o;b.onclick=()=>{
    st.innerHTML=(i===F.ok?'<span class="ok">✔ Helyes.</span> ':'<span class="bad">✘ Nem ez.</span> ')+(i===F.ok?(F.why||""):"Próbáld újra!");};q.appendChild(b);});}}
function show(i){const L=SETS[cur];k=Math.max(0,Math.min(L.length-1,i));fig.innerHTML=L[k].svg;
  document.getElementById("pos").value=k;document.getElementById("pos").max=L.length-1;
  document.getElementById("cnt").textContent=(k+1)+"/"+L.length;sbar.style.display=L.length>1?"flex":"none";showStep();bind();}
function view(n){stop();cur=n;vbar.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===n));show(0);}
names.forEach(n=>{const b=document.createElement("button");b.dataset.v=n;b.textContent=n;b.onclick=()=>view(n);vbar.appendChild(b);});
vbar.style.display=names.length>1?"flex":"none";
document.getElementById("first").onclick=()=>{stop();show(0);};
document.getElementById("prev").onclick=()=>{stop();show(k-1);};
document.getElementById("next").onclick=()=>{stop();show(k+1);};
document.getElementById("play").onclick=()=>{if(timer){stop();return;}if(k>=SETS[cur].length-1)show(0);
  document.getElementById("play").textContent="⏸ Szünet";timer=setInterval(()=>{if(k>=SETS[cur].length-1)stop();else show(k+1);},DELAY);};
document.getElementById("pos").oninput=e=>{stop();show(+e.target.value);};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){stop();show(k+1);}if(e.key==="ArrowLeft"){stop();show(k-1);}});
view(cur);
</script>
