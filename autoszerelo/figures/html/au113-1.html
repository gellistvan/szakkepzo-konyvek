<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zárási idő és zárásszög</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="n">Fordulatszám n</label><input id="n" type="range" min="800" max="6000" step="100" value="3000" aria-label="Fordulatszám n"><output id="n_o" for="n"></output></div>
<div class="row"><label for="tz">Zárási idő t_z</label><input id="tz" type="range" min="2" max="5" step="0.1" value="3.5" aria-label="Zárási idő t_z"><output id="tz_o" for="tz"></output></div>
<div class="row"><label for="ub">Fedélzeti feszültség</label><input id="ub" type="range" min="11" max="14" step="0.1" value="12" aria-label="Fedélzeti feszültség"><output id="ub_o" for="ub"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="A gyújtótekercs primeráramának és primerfeszültségének jelalakja a zárási idővel és a szikrával"></svg>
<p class="small">Szemléltető modell (R = 0,6 Ω, L = 4 mH, áramkorlát 8 A, megszakítási csúcs ≈ 350 V, égési vonal ≈ 40 V): nem mért jel. A valós zárási idő és szintek gyártó- és típusfüggők (ellenőrizendő: gyártói adat).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"n":"1/min", "tz":"ms", "ub":"V"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const R=0.6,TAU=6.666666666666667,IL=8.0,T=120000/v.n,tz=v.tz,ub=v.ub;
const tig=350/720*T,ton=tig-tz,X0=60,X1=545,X=t=>X0+(X1-X0)*t/T;
const phi=360*v.n/60*tz/1000, ib=Math.min(IL,ub/R*(1-Math.exp(-tz/TAU)));
function frame(y0,h,lab,ticks,ymax){
  el("rect",{x:X0,y:y0,width:X1-X0,height:h,fill:"none",stroke:css("--line")});
  el("rect",{x:X(ton),y:y0,width:X(tig)-X(ton),height:h,fill:css("--grid"),opacity:0.6});
  ticks.forEach(u=>el("text",{x:X0-5,y:y0+h-h*u/ymax+4,"font-size":11,"text-anchor":"end"},fmt(u,0)));
  el("text",{x:14,y:y0+h/2,"font-size":11,"text-anchor":"middle",transform:"rotate(-90 14 "+(y0+h/2)+")"},lab);
}
frame(20,120,"áram (A)",[0,4,8],10);
let d="";const NP=600;
for(let k=0;k<=NP;k++){const t=T*k/NP;let i=0;if(t>=ton&&t<tig)i=Math.min(IL,ub/R*(1-Math.exp(-(t-ton)/TAU)));
  d+=(k?"L":"M")+X(t)+" "+(140-120*i/10);}
el("path",{d:d,fill:"none",stroke:css("--fg"),"stroke-width":2});
frame(170,120,"feszültség (V)",[0,200,400],400);
const Y=u=>290-120*u/400;
let e="M"+X0+" "+Y(ub)+" L"+X(ton)+" "+Y(ub)+" L"+X(ton)+" "+Y(1)+" L"+X(tig)+" "+Y(1.5)+" L"+X(tig)+" "+Y(350)+" L"+X(tig+0.08)+" "+Y(40)+" L"+X(Math.min(T,tig+1.5))+" "+Y(40)+" L"+X(Math.min(T,tig+1.6))+" "+Y(ub)+" L"+X1+" "+Y(ub);
el("path",{d:e,fill:"none",stroke:css("--fg"),"stroke-width":1.6,"stroke-dasharray":"6 3"});
[0,180,360,540,720].forEach(g=>{el("text",{x:X(g/720*T),y:14,"font-size":10,"text-anchor":"middle"},g+"°");});
el("text",{x:(X0+X1)/2,y:318,"font-size":11,"text-anchor":"middle"},"idő: 0 … "+fmt(T,1)+" ms (720° főtengely); szürke sáv = zárási idő; szikra FHP előtt 10°-nál");
status("Zárásszög: <b>"+fmt(phi,1)+"° főtengely</b> = <b>"+fmt(phi/2,1)+"° elosztótengely</b> (φ = 360° · n/60 · t_z). "+
 "Megszakítási áram ≈ <b>"+fmt(ib,1)+" A</b>"+(ib<IL-0.05?" – <span class='bad'>nem éri el a 8 A-t: kisebb gyújtási energia, az ECU alacsony fedélzeti feszültségnél hosszabb t_z-t ad.</span>":" – <span class='ok'>eléri az áramkorlátot.</span>")+
 (tz>=T?" <span class='bad'>A zárási idő nem fér el a ciklusban.</span>":""));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
