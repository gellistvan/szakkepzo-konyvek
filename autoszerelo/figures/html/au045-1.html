<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL-kör be- és kikapcsolása</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="R">Ellenállás R</label><input id="R" type="range" min="20" max="500" step="5" value="100" aria-label="Ellenállás R"><output id="R_o" for="R"></output></div>
<div class="row"><label for="L">Induktivitás L</label><input id="L" type="range" min="0.02" max="1" step="0.01" value="0.2" aria-label="Induktivitás L"><output id="L_o" for="L"></output></div>
<div class="row"><label for="U">Tápfeszültség U</label><input id="U" type="range" min="6" max="28" step="0.5" value="12" aria-label="Tápfeszültség U"><output id="U_o" for="U"></output></div>
<div class="row"><label for="dt">Megszakítási idő Δt</label><input id="dt" type="range" min="10" max="500" step="10" value="50" aria-label="Megszakítási idő Δt"><output id="dt_o" for="dt"></output></div>
<div class="row"><label for="dio">Szabadonfutó dióda beépítve</label><input id="dio" type="checkbox" checked aria-label="Szabadonfutó dióda beépítve"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 380" role="img" aria-label="Relétekercs árama és a kapcsoló feszültsége be- és kikapcsoláskor, szabadonfutó diódával és anélkül"></svg>
<p class="small">Számított, szemléltető görbék (ideális RL-kör, a dióda nyitófeszültsége 0,7 V, a megszakítás Δt alatt lineáris). A valós tüske nagyságát a kapcsoló, a szórt kapacitás és a beépített védelem korlátozza; nem mért érték.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"R":"Ω", "L":"H", "U":"V", "dt":"µs"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const R=v.R,L=v.L,U=v.U,dt=v.dt*1e-6,tau=L/R,I0=U/R,toff=5*tau,tend=10*tau,t0=-tau;
const X0=70,X1=540,X=t=>X0+(X1-X0)*(t-t0)/(tend-t0);
const iAt=t=>{const ioff=I0*(1-Math.exp(-toff/tau));if(t<0)return 0;if(t<toff)return I0*(1-Math.exp(-t/tau));
  return v.dio?ioff*Math.exp(-(t-toff)/tau):Math.max(0,ioff*(1-(t-toff)/dt));};
const spike=U+L*I0*(1-Math.exp(-5))/dt, uMax=40;
const uAt=t=>{if(t<0)return U;if(t<toff)return 0;if(v.dio)return iAt(t)>1e-4*I0?U+0.7:U;return (t<toff+dt)?spike:U;};
function panel(y0,h,ymax,lab,fn,unit,sc){
  const Y=q=>y0+h-h*Math.min(q,ymax)/ymax;
  el("rect",{x:X0,y:y0,width:X1-X0,height:h,fill:"none",stroke:css("--line")});
  [0,0.5,1].forEach(f=>el("text",{x:X0-6,y:Y(f*ymax)+4,"font-size":11,"text-anchor":"end"},fmt(f*ymax*sc,f*ymax*sc<10?1:0)));
  el("text",{x:14,y:y0+h/2,"font-size":12,"text-anchor":"middle",transform:"rotate(-90 14 "+(y0+h/2)+")"},lab);
  [0,toff].forEach(t=>el("line",{x1:X(t),x2:X(t),y1:y0,y2:y0+h,stroke:css("--muted"),"stroke-dasharray":"3 3"}));
  let d="",n=900;for(let k=0;k<=n;k++){let t=t0+(tend-t0)*k/n;
    if(!v.dio&&t>toff&&t<toff+dt+(tend-t0)/n)t=toff+Math.min(dt,(t-toff));d+=(k?"L":"M")+X(t).toFixed(1)+" "+Y(fn(t)).toFixed(1);}
  el("path",{d:d,fill:"none",stroke:css("--hl"),"stroke-width":2.2});
}
panel(20,140,I0*1.2,"i (mA)",iAt,"mA",1000);
panel(200,140,uMax,"u kapcsoló (V)",t=>{if(!v.dio&&t>=toff&&t<toff+Math.max(dt,(tend-t0)/400))return spike;return uAt(t);},"V",1);
el("text",{x:X(0)+4,y:34,"font-size":12},"bekapcsolás");el("text",{x:X(toff)+4,y:34,"font-size":12},"kikapcsolás");
el("text",{x:(X0+X1)/2,y:372,"font-size":12,"text-anchor":"middle"},"idő: "+fmt(t0*1e3,1)+" … "+fmt(tend*1e3,1)+" ms (a kikapcsolás 5τ után)");
if(!v.dio)el("text",{x:X(toff)+8,y:216,"font-size":12,fill:css("--bad")},"tüske ≈ "+fmt(spike,0)+" V – a skálán kívül");
else el("text",{x:X(toff)+8,y:216,"font-size":12},"korlátozva: U + 0,7 V = "+fmt(U+0.7,1)+" V");
status("τ = L/R = <b>"+fmt(tau*1e3,2)+" ms</b>, I₀ = U/R = <b>"+fmt(I0*1e3,0)+" mA</b>, 3τ = "+fmt(3*tau*1e3,2)+" ms alatt 95 %. "+
  (v.dio?"<span class='ok'>Diódával</span> a kapcsoló feszültsége kikapcsoláskor kb. "+fmt(U+0.7,1)+" V, az áram a diódán át τ szerint cseng le."
        :"<span class='bad'>Dióda nélkül</span> a tekercs L·ΔI/Δt ≈ "+fmt(L*I0/dt,0)+" V-ot indukál; a kapcsolón ≈ "+fmt(spike,0)+" V tüske jelenik meg (szemléltető becslés: lineáris megszakítás Δt alatt)."));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
