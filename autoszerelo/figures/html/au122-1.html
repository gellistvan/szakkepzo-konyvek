const MODE = "steps";
let k = 0, timer = null;
const nav = document.getElementById("nav"), stage = document.getElementById("stage"),
      status = document.getElementById("status"), info = document.getElementById("info");
function keyOf(id){const m = /^pt__(.+)__\d+$/.exec(id || ""); return m ? m[1] : null;}
function hl(key, on){stage.querySelectorAll('[id^="pt__' + key + '__"]').forEach(g => {
  g.classList.toggle("hl", on); g.querySelectorAll("path,text").forEach(x => x.classList.toggle("hl", on));});}
function bindParts(){
  stage.querySelectorAll('[id^="pt__"]').forEach(g => {
    const key = keyOf(g.id); if (!key || !PARTS[key]) return;
    g.setAttribute("tabindex", "0");
    const showInfo = () => { stage.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")); hl(key, true);
      info.innerHTML = "<b>" + PARTS[key][0] + "</b> – " + PARTS[key][1]; };
    g.addEventListener("mouseenter", showInfo); g.addEventListener("focus", showInfo); g.addEventListener("click", showInfo);
    g.addEventListener("mouseleave", () => hl(key, false));
  });
}
function show(i){
  k = Math.max(0, Math.min(VIEWS.length - 1, i));
  stage.innerHTML = VIEWS[k].svg; status.innerHTML = VIEWS[k].msg || "";
  nav.querySelectorAll("button.v").forEach((b, j) => b.classList.toggle("on", j === k));
  const c = document.getElementById("cnt"); if (c) c.textContent = (k + 1) + "/" + VIEWS.length;
  bindParts(); if (typeof onView === "function") onView(k);
}
function stop(){ if (timer){clearInterval(timer); timer = null;} const p = document.getElementById("play"); if (p) p.textContent = "▶ Lejátszás"; }
function btn(txt, f, cls){const b = document.createElement("button"); b.textContent = txt; b.onclick = f; if (cls) b.className = cls; nav.appendChild(b); return b;}
if (MODE === "steps" && VIEWS.length > 1){
  btn("⏮", () => {stop(); show(0);}); btn("◀ Lépés", () => {stop(); show(k - 1);});
  const p = btn("▶ Lejátszás", () => { if (timer){stop(); return;} if (k >= VIEWS.length - 1) show(0);
    p.textContent = "⏸ Szünet"; timer = setInterval(() => { if (k >= VIEWS.length - 1) stop(); else show(k + 1); }, 3500); });
  p.id = "play"; btn("Lépés ▶", () => {stop(); show(k + 1);});
  const s = document.createElement("span"); s.id = "cnt"; s.className = "small"; nav.appendChild(s);
  document.addEventListener("keydown", e => { if (e.key === "ArrowRight"){stop(); show(k + 1);} if (e.key === "ArrowLeft"){stop(); show(k - 1);} });
} else if (VIEWS.length > 1) {
