<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hátsó váltó beállítása és láncnyúlás mérése</title>
<style>
:root{--bg:#ffffff;--fg:#1a1a1a;--muted:#555;--line:#bbb;--hl:#c0392b;--card:#f4f4f4;--btn:#e8e8e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1b1b;--fg:#eaeaea;--muted:#aaa;--line:#555;--hl:#ff7b6b;--card:#262626;--btn:#333}}
:root[data-theme="dark"]{--bg:#1b1b1b;--fg:#eaeaea;--muted:#aaa;--line:#555;--hl:#ff7b6b;--card:#262626;--btn:#333}
body{margin:0;padding:10px 12px;background:var(--bg);color:var(--fg);font:14px/1.4 "DejaVu Sans",system-ui,sans-serif}
.pic{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
.pic svg{display:block;width:100%;height:auto}
.fr svg{max-height:440px}
.wrap{display:flex;gap:12px;flex-wrap:wrap}
.wrap .pic{flex:3 1 420px}.wrap .side{flex:2 1 220px;min-width:0}
ul.parts{list-style:none;margin:0;padding:0;max-height:430px;overflow:auto}
ul.parts li{padding:3px 6px;border-radius:4px;cursor:pointer;border-left:3px solid transparent}
ul.parts li.on{background:var(--card);border-left-color:var(--hl)}
#info{margin-top:8px;padding:8px;background:var(--card);border-radius:6px;min-height:3.2em}
.hl path,.hl line,.hl polyline,.hl polygon,.hl circle,.hl ellipse,.hl rect{stroke:#c0392b !important;stroke-width:2.6px !important}
.hl text{fill:#c0392b !important;font-weight:bold}
.bar{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
button{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px 10px;font-size:15px;cursor:pointer}
#msg{padding:8px;background:var(--card);border-radius:6px;min-height:3.2em}
.small{color:var(--muted);font-size:12px}
</style>
</head>

<text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="16.281818" y="19.452273" transform="rotate(-0 16.281818 19.452273)">HIBÁS ✗</text>

</div></div><div class="bar"><button id="b0" title="első">⏮</button><button id="bp" title="előző">◀</button><button id="bn" title="következő">▶</button><button id="be" title="utolsó">⏭</button><button id="pl" title="lejátszás">⏵ lejátszás</button><span id="cnt" class="small"></span></div><div id="msg" aria-live="polite"></div><p class="small">Sematikus hátulnézet, nem méretarányos; a kazetta fogszámsora szemléltető. A beállítási értékek és a kopási határok a váltó- és láncgyártó adatai (ellenőrizendő).</p>
<script>
const M=["<b>1. Váltószem.</b> Hátulról nézve a váltószemnek és a váltó görgőinek a fogaskerekekkel párhuzamos síkban kell lenniük. Az elhajlott váltószemet (az ábrán) első lépésként mérőszerszámmal ellenőrizni, igazítani vagy cserélni kell – enélkül a beállítás nem sikerülhet.", "<b>2. H határolócsavar.</b> A bowdent kiakasztva (vagy lazán) a lánc a legkisebb fogaskeréken fut. A H csavarral úgy állítjuk a váltót, hogy a felső váltógörgő pontosan a legkisebb fogaskerék síkjába essen: a lánc ne essen le kifelé, és ne kapaszkodjon a szomszéd fogaskerékre.", "<b>3. Bowden és finomállítás.</b> A legkisebb fogaskeréken a huzalt kézzel megfeszítve rögzítjük. Fokozatonként felfelé váltunk: ha a lánc késve lép a nagyobb fogaskerékre, a bowdenfeszítőt kifelé (feszítés) csavarjuk negyed fordulatonként; ha zörög vagy túllép, befelé. Hangra és látványra minden fokozatnak tisztán kell kapcsolnia.", "<b>4. L határolócsavar.</b> A legnagyobb fogaskerékre váltva az L csavarral úgy állítjuk a váltót, hogy a lánc biztosan fellépjen, de a váltó és a lánc ne érhessen a küllőkhöz (a küllők közé eső váltó a kereket és a vázat is tönkreteheti). Ezután a B-csavarral a felső görgő és a legnagyobb fogaskerék távolságát állítjuk a gyártói érték szerint (ellenőrizendő).", "<b>5. Láncnyúlás mérése – helyes.</b> A láncmérőt a feszes (felső) láncágra tesszük, mindkét csapja a görgők közé ül, erőltetés nélkül. Ha a 0,5 %-os oldal beesik, de a 0,75 %-os nem: lánccsere javasolt; ha a 0,75 %-os is beesik: a lánc és a fogaskeréksor is csere; ha egyik sem: tisztítás és kenés (a fejezet határai, ellenőrizendő: gyártói érték).", "<b>6. Láncnyúlás mérése – HIBÁS.</b> Ferdén, erővel benyomva vagy laza láncon mérve a mérő „beesik” akkor is, ha a lánc jó – vagy fordítva. Mérés előtt tisztítsuk a láncot; több helyen mérjünk."],F=document.querySelectorAll('.fr');let i=0,tm=null;
function show(k){i=Math.max(0,Math.min(F.length-1,k));F.forEach((f,j)=>f.style.display=j===i?'block':'none');
 document.getElementById('msg').innerHTML=M[i];document.getElementById('cnt').textContent=(i+1)+' / '+F.length;}
function stop(){if(tm){clearInterval(tm);tm=null;document.getElementById('pl').textContent='⏵ lejátszás';}}
document.getElementById('b0').onclick=()=>{stop();show(0)};document.getElementById('be').onclick=()=>{stop();show(F.length-1)};
document.getElementById('bp').onclick=()=>{stop();show(i-1)};document.getElementById('bn').onclick=()=>{stop();show(i+1)};
document.getElementById('pl').onclick=()=>{if(tm){stop();return;}if(i>=F.length-1)show(0);
 document.getElementById('pl').textContent='⏸ szünet';tm=setInterval(()=>{if(i>=F.length-1)stop();else show(i+1);},2200);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();show(i+1)}if(e.key==='ArrowLeft'){stop();show(i-1)}});
show(0);
</script>
