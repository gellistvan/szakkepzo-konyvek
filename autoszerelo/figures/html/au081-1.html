<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVT-variátor és kettős tengelykapcsolós váltó</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="ir">CVT-áttétel i</label><input id="ir" type="range" min="0.42" max="2.35" step="0.01" value="2.35" aria-label="CVT-áttétel i"><output id="ir_o" for="ir"></output></div>
<div class="row"><label for="nm">Motorfordulatszám</label><input id="nm" type="range" min="800" max="6000" step="50" value="1800" aria-label="Motorfordulatszám"><output id="nm_o" for="nm"></output></div>
<div class="row"><label for="ph">DSG-fázis</label><select id="ph" aria-label="DSG-fázis"><option value="1" selected>1. fokozat, 2. előválasztva</option><option value="2">átfedő váltás</option><option value="3">2. fokozat</option><option value="4">2. fokozat, 3. előválasztva</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 900 400" role="img" aria-label="CVT kúptárcsapárok változtatható futósugárral és kiírt kimenő fordulatszámmal; kettős tengelykapcsolós váltó fázisai a tengelykapcsolók átfedő váltásával."></svg>
<p class="small">Ellenőrzés: 2. példa (1800 1/min) i = 2,35 → 766 1/min, i = 0,42 → 4286 ≈ 4290 1/min; 3. feladat: 2500 1/min, i = 1,8 → 1389 1/min. A tolószalag tolóelem, a lánc húzóelem. Sematikus rajz; a DSG-átfedés ideje szemléltető.</p>
