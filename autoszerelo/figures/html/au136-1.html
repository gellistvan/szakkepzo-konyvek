<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Common rail visszafolyó mennyiség mérése</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="t">Mérési idő (alapjárat)</label><input id="t" type="range" min="0" max="60" step="1" value="60" aria-label="Mérési idő (alapjárat)"><output id="t_o" for="t"></output></div>
<div class="row"><label for="bad">Hibás injektor</label><select id="bad" aria-label="Hibás injektor"><option value="0">nincs</option><option value="1">1.</option><option value="2">2.</option><option value="3">3.</option><option value="4" selected>4. (1. példa)</option></select></div>
<div class="row"><label for="lim">Gyártói határ (példa)</label><input id="lim" type="range" min="10" max="60" step="1" value="25" aria-label="Gyártói határ (példa)"><output id="lim_o" for="lim"></output></div>
<div class="row"><label for="anim">Töltődés lejátszása</label><input id="anim" type="checkbox" aria-label="Töltődés lejátszása"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 300" role="img" aria-label="Common rail injektorok visszafolyó mennyisége mérőhengerekben, idő és hibás injektor választásával"></svg>
<p class="small">Az 1. példa adatai (20, 15, 18, 120 ml/perc; határ pl. 25 ml/perc) a fejezetből; a 4. injektor ép értéke (19 ml/perc) és a határ tanulási példa, ellenőrizendő a gyártói adatban. A mérés előtt gyártói nyomásmentesítés; a nagynyomású csöveket nem bontjuk.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"t":"s", "lim":"ml/perc"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const base=[20,15,18,19], q=base.map((x,i)=>(+v.bad===i+1)?120:x);
if(v.anim){if(!FIG.t0)FIG.t0=performance.now();const tt=Math.min(60,(performance.now()-FIG.t0)/1000*6);
  document.getElementById("t").value=Math.round(tt);if(tt<60)setTimeout(draw,80);else{document.getElementById("anim").checked=false;FIG.t0=0;}}
else FIG.t0=0;
const t=+document.getElementById("t").value;
el("rect",{x:0,y:0,width:600,height:300,fill:"#fff"});
const Y=ml=>260-ml*1.6;
el("line",{x1:60,x2:565,y1:Y(v.lim*t/60),y2:Y(v.lim*t/60),stroke:"#000","stroke-dasharray":"6 4"});
el("text",{x:598,y:Y(v.lim*t/60)+4,"font-size":11,"text-anchor":"end",fill:"#000"},"határ");
q.forEach((r,i)=>{const x=90+i*120,ml=r*t/60,bad=r>v.lim;
  el("rect",{x:x,y:Y(130),width:50,height:130*1.6,fill:"#fff",stroke:"#000"});
  el("rect",{x:x,y:Y(ml),width:50,height:ml*1.6,fill:bad?"#c55a11":"#9cc3e6",stroke:"#000"});
  el("text",{x:x+25,y:Y(ml)-6,"font-size":12,"text-anchor":"middle",fill:"#000","font-weight":bad?"bold":"normal"},fmt(ml,0)+" ml");
  el("text",{x:x+25,y:282,"font-size":12,"text-anchor":"middle",fill:"#000"},(i+1)+". injektor");});
const tot=q.reduce((s,x)=>s+x,0), bad=q.map((x,i)=>x>v.lim?(i+1)+".":null).filter(x=>x);
status("Mérési idő: <b>"+t+" s</b> (a határ ennyi idő alatt "+fmt(v.lim*t/60,1)+" ml). Hengerenkénti visszafolyás: "+q.join(", ")+" ml/perc, összesen "+tot+" ml/perc. "+
  (bad.length?"Határ fölött: <b>"+bad.join(", ")+" injektor</b> → belső tömítetlenség, a rail-nyomás esését okozhatja.":"Minden injektor a határ alatt."));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
