<style>
:root{--bg:#ffffff;--fg:#1a1a1a;--muted:#555;--line:#bbb;--hl:#c0392b;--card:#f4f4f4;--btn:#e8e8e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1b1b;--fg:#eaeaea;--muted:#aaa;--line:#555;--hl:#ff7b6b;--card:#262626;--btn:#333}}
:root[data-theme="dark"]{--bg:#1b1b1b;--fg:#eaeaea;--muted:#aaa;--line:#555;--hl:#ff7b6b;--card:#262626;--btn:#333}
body{margin:0;padding:10px 12px;background:var(--bg);color:var(--fg);font:14px/1.4 "DejaVu Sans",system-ui,sans-serif}
.pic{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
.pic svg{display:block;width:100%;height:auto}
.fr svg{max-height:440px}
.wrap{display:flex;gap:12px;flex-wrap:wrap}
.wrap .pic{flex:3 1 420px}.wrap .side{flex:2 1 220px;min-width:0}
ul.parts{list-style:none;margin:0;padding:0;max-height:430px;overflow:auto}
ul.parts li{padding:3px 6px;border-radius:4px;cursor:pointer;border-left:3px solid transparent}
ul.parts li.on{background:var(--card);border-left-color:var(--hl)}
#info{margin-top:8px;padding:8px;background:var(--card);border-radius:6px;min-height:3.2em}
.hl path,.hl line,.hl polyline,.hl polygon,.hl circle,.hl ellipse,.hl rect{stroke:#c0392b !important;stroke-width:2.6px !important}
.hl text{fill:#c0392b !important;font-weight:bold}
.bar{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
button{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px 10px;font-size:15px;cursor:pointer}
#msg{padding:8px;background:var(--card);border-radius:6px;min-height:3.2em}
.small{color:var(--muted);font-size:12px}
</style>
</head>

<script>
const M=["<b>1. jel.</b> Mit jelent? <details><summary>Megoldás (kattints)</summary><b>Kezdés (figyelem)</b>: Mindkét kar vízszintesen oldalra kinyújtva, a tenyér előre néz.</details>", "<b>2. jel.</b> Mit jelent? <details><summary>Megoldás (kattints)</summary><b>Állj (megszakítás)</b>: A jobb kar felfelé nyújtva, a tenyér előre néz. Nem azonos a Kezdés jelével!</details>", "<b>3. jel.</b> Mit jelent? <details><summary>Megoldás (kattints)</summary><b>Vége (befejezés)</b>: A két kéz összekulcsolva mellmagasságban.</details>", "<b>4. jel.</b> Mit jelent? <details><summary>Megoldás (kattints)</summary><b>Emelés</b>: A jobb kar felfelé nyújtva, a tenyér előre néz, a kéz lassú körző mozgást végez.</details>", "<b>5. jel.</b> Mit jelent? <details><summary>Megoldás (kattints)</summary><b>Süllyesztés</b>: A jobb kar lefelé nyújtva, a tenyér befelé néz, a kéz lassú körző mozgást végez.</details>", "<b>6. jel.</b> Mit jelent? <details><summary>Megoldás (kattints)</summary><b>Előre / hátra (pl. hídmozgás)</b>: Mindkét kar behajlítva, tenyér felfelé, az alkar lassan a test felé int (előre, a jelző felé); hátra: tenyér lefelé, az alkar a testtől el int.</details>", "<b>7. jel.</b> Mit jelent? <details><summary>Megoldás (kattints)</summary><b>Jobbra / balra (pl. macskamozgás)</b>: A jobb (balra mozgásnál a bal) kar vízszintesen oldalra kinyújtva, tenyér lefelé, kis lassú mozdulatok a mozgás irányába.</details>", "<b>8. jel.</b> Mit jelent? <details><summary>Megoldás (kattints)</summary><b>Veszély – vészleállítás</b>: Mindkét kar felfelé nyújtva, a tenyér előre néz. Bárki adhatja, azonnal végre kell hajtani.</details>"],F=document.querySelectorAll('.fr');let i=0,tm=null;
function show(k){i=Math.max(0,Math.min(F.length-1,k));F.forEach((f,j)=>f.style.display=j===i?'block':'none');
 document.getElementById('msg').innerHTML=M[i];document.getElementById('cnt').textContent=(i+1)+' / '+F.length;}
function stop(){if(tm){clearInterval(tm);tm=null;document.getElementById('pl').textContent='⏵ lejátszás';}}
document.getElementById('b0').onclick=()=>{stop();show(0)};document.getElementById('be').onclick=()=>{stop();show(F.length-1)};
document.getElementById('bp').onclick=()=>{stop();show(i-1)};document.getElementById('bn').onclick=()=>{stop();show(i+1)};
document.getElementById('pl').onclick=()=>{if(tm){stop();return;}if(i>=F.length-1)show(0);
 document.getElementById('pl').textContent='⏸ szünet';tm=setInterval(()=>{if(i>=F.length-1)stop();else show(i+1);},3500);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();show(i+1)}if(e.key==='ArrowLeft'){stop();show(i-1)}});
show(0);
</script>
