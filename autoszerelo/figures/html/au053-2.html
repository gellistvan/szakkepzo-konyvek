<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiméter bekötése: feszültség- és árammérés</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="mod">Mérési mód (forgókapcsoló)</label><select id="mod" aria-label="Mérési mód (forgókapcsoló)"><option value="V" selected>V DC – feszültség</option><option value="A">A DC – áram (10 A)</option><option value="O">Ω – ellenállás</option></select></div>
<div class="row"><label for="alj">Piros zsinór aljzata</label><select id="alj" aria-label="Piros zsinór aljzata"><option value="VO" selected>VΩ</option><option value="A10">10 A</option></select></div>
<div class="row"><label for="kot">Bekötés</label><select id="kot" aria-label="Bekötés"><option value="par" selected>párhuzamosan az izzóval</option><option value="ser">sorosan, a kört megszakítva</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 260" role="img" aria-label="Multiméter aljzatai és kezelőszervei; feszültségmérés párhuzamosan, árammérés sorosan helyes, árammérés párhuzamosan hibás."></svg>
<p class="small">Sematikus szimuláció, tanulási példa. A valódi műszer aljzatkiosztása, biztosítója és CAT-besorolása a gyártói kézikönyv szerint.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const L=css("--line"),F=css("--fg");
const ln=(x1,y1,x2,y2,w)=>el("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:L,"stroke-width":w||2.2,"stroke-linecap":"round"});
const par=v.kot==="par";
// akkumulátor
ln(80,40,80,110);ln(80,150,80,220);ln(62,116,98,116,2.2);ln(71,128,89,128,5);
el("text",{x:50,y:112,"font-size":14},"+");el("text",{x:52,y:142,"font-size":14},"−");el("text",{x:100,y:132,"font-size":12},"G1 12 V");
ln(80,220,330,220);ln(330,220,330,152);
el("circle",{cx:330,cy:130,r:22,fill:"none",stroke:L,"stroke-width":2.2});ln(315,115,345,145,1.8);ln(315,145,345,115,1.8);
el("text",{x:362,y:134,"font-size":12},"E1 izzó");
let mx,my;
if(par){ln(80,40,330,40);ln(330,40,330,108);ln(330,40,460,40);ln(460,40,460,108);ln(330,220,460,220);ln(460,220,460,152);
  el("circle",{cx:330,cy:40,r:4,fill:L});el("circle",{cx:330,cy:220,r:4,fill:L});mx=460;my=130;}
else{ln(80,40,180,40);ln(240,40,330,40);ln(330,40,330,108);mx=210;my=40;}
el("circle",{cx:mx,cy:my,r:24,fill:css("--bg"),stroke:F,"stroke-width":2.6});
el("text",{x:mx,y:my+6,"font-size":18,"text-anchor":"middle","font-weight":"bold"},v.mod==="V"?"V":(v.mod==="A"?"A":"Ω"));
let msg="",ok=false;
if(v.mod==="O"){msg="<span class='bad'>Ellenállást csak feszültségmentes áramkörben mérünk!</span> Feszültség alatti körben a mérés hamis, és a műszer is sérülhet.";}
else if(v.mod==="V"&&v.alj==="VO"&&par){ok=true;msg="<span class='ok'>Helyes: feszültségmérés párhuzamosan</span> (VΩ + COM, kb. 10 MΩ bemenet). A kijelző kb. 12,4 V-ot mutat, a kör működése nem változik.";}
else if(v.mod==="V"&&v.alj==="VO"&&!par){msg="<span class='bad'>Hibás bekötés:</span> a 10 MΩ-os voltmérő sorosan szinte nem enged áramot – az izzó nem világít, a műszer közel a teljes akkumulátorfeszültséget mutatja.";}
else if(v.mod==="A"&&v.alj==="A10"&&!par){ok=true;msg="<span class='ok'>Helyes: árammérés sorosan</span> (10 A + COM, a kör megszakítva). Egy 21 W-os izzónál kb. 1,7 A folyik (tanulási példa).";}
else if(v.mod==="A"&&v.alj==="A10"&&par){msg="<span class='bad'>Veszélyes hiba: árammérő párhuzamosan!</span> A sönt ellenállása kicsi, az akkumulátor rövidre záródik a műszeren át: a 10 A-es biztosító kiolvad, a zsinór felmelegszik, a műszer sérülhet.";
  el("text",{x:280,y:250,"font-size":15,"text-anchor":"middle","font-weight":"bold",style:"fill:"+css("--bad")},"✘ RÖVIDZÁR – a biztosító kiolvad");}
else{msg="<span class='bad'>A mód és az aljzat nem illik össze.</span> Feszültségméréshez VΩ aljzat és V mód, áramméréshez 10 A (vagy mA) aljzat és A mód kell. A 10 A aljzat V módban is a söntre köt – soha ne mérj így feszültséget!";}
if(ok)el("text",{x:280,y:250,"font-size":15,"text-anchor":"middle","font-weight":"bold",style:"fill:"+css("--ok")},"✔ helyes mérés");
status(msg);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
