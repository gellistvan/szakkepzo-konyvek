<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teljes és lépcsős metszet lépésenként</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--btn:#f0f0f0}

*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}

#msg{min-height:2.9em;margin:4px 0 6px}
.fig{background:#fff;border-radius:6px;padding:4px}
.fig svg{width:100%;height:auto;display:block}

#parts{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 4px;padding:0;list-style:none}
#parts button{font-size:13px}
#desc{min-height:2.6em}
.small{font-size:12px;color:var(--muted)}</style>
</head>

<div id="desc" aria-live="polite"></div>
