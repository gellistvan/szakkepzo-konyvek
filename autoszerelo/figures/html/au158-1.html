<title>Teleszkópos rakodó körbejárásos ellenőrzése</title>
<style>
:root{--bg:#ffffff;--fg:#1a1a1a;--muted:#555;--line:#bbb;--hl:#c0392b;--card:#f4f4f4;--btn:#e8e8e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1b1b;--fg:#eaeaea;--muted:#aaa;--line:#555;--hl:#ff7b6b;--card:#262626;--btn:#333}}
:root[data-theme="dark"]{--bg:#1b1b1b;--fg:#eaeaea;--muted:#aaa;--line:#555;--hl:#ff7b6b;--card:#262626;--btn:#333}
body{margin:0;padding:10px 12px;background:var(--bg);color:var(--fg);font:14px/1.4 "DejaVu Sans",system-ui,sans-serif}
.pic{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
.pic svg{display:block;width:100%;height:auto}
.fr svg{max-height:440px}
.wrap{display:flex;gap:12px;flex-wrap:wrap}
.wrap .pic{flex:3 1 420px}.wrap .side{flex:2 1 220px;min-width:0}
ul.parts{list-style:none;margin:0;padding:0;max-height:430px;overflow:auto}
ul.parts li{padding:3px 6px;border-radius:4px;cursor:pointer;border-left:3px solid transparent}
ul.parts li.on{background:var(--card);border-left-color:var(--hl)}
#info{margin-top:8px;padding:8px;background:var(--card);border-radius:6px;min-height:3.2em}
.hl path,.hl line,.hl polyline,.hl polygon,.hl circle,.hl ellipse,.hl rect{stroke:#c0392b !important;stroke-width:2.6px !important}
.hl text{fill:#c0392b !important;font-weight:bold}
.bar{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
button{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px 10px;font-size:15px;cursor:pointer}
#msg{padding:8px;background:var(--card);border-radius:6px;min-height:3.2em}
.small{color:var(--muted);font-size:12px}
</style>
</head>

</div></div><div class="bar"><button id="b0" title="első">⏮</button><button id="bp" title="előző">◀</button><button id="bn" title="következő">▶</button><button id="be" title="utolsó">⏭</button><button id="pl" title="lejátszás">⏵ lejátszás</button><span id="cnt" class="small"></span></div><div id="msg" aria-live="polite"></div><p class="small">Sematikus vonalrajz; a pontok helye és sorrendje típusonként eltér – a gyártó kezelési utasítása és a munkáltató ellenőrző lapja a mérvadó (ellenőrizendő).</p>
<script>
const M=["<b>1. gumiabroncsok, keréknyomás</b> (útmutató 2. lépés)<br>Vágás, kidudorodás, idegen tárgy, kerékanyák megléte; a nyomás a gyártói érték szerint. Hiba: vágott vagy leeresztett abroncs – a gép borulásveszélyes.", "<b>2. hidraulikus munkahengerek és tömlők</b> (útmutató 2. és 8. lépés)<br>Olajfolt a gép alatt, nedves tömlőcsatlakozó, kidörzsölt tömlő, sérült dugattyúrúd. A szivárgást nem kézzel tapintjuk (befecskendezéses sérülés)!", "<b>3. gém, teleszkóp csúszólapjai, kenési pontok</b> (útmutató 2. lépés)<br>Repedés, deformáció, kopott csúszólap, kenetlen csap; a gém leengedett, alátámasztott helyzetben.", "<b>4. adapter / villa rögzítőcsapjai</b> (útmutató 2. lépés)<br>A gyorscsatlakozó csapja a helyén és biztosítva; a villák repedésmentesek, a villazár rögzít.", "<b>5. motorolaj, hűtőfolyadék, hidraulikaolaj szintje</b> (útmutató 3. lépés)<br>A szint a jelölések között, a hidraulikaolaj a munkaszervek nyugalmi helyzetében mérve; habos vagy tejes olaj hibára utal.", "<b>6. levegőszűrő-eltömődésjelző</b> (útmutató 3. lépés)<br>A jelző nem áll piros mezőben; eltömődött szűrő: teljesítményvesztés, füstölés.", "<b>7. világítás, villogó, tolatásjelző</b> (útmutató 5. lépés)<br>Működő fényszórók, irányjelzők, sárga villogó és hangos tolatásjelző; törött búra csere.", "<b>8. vészleállító</b> (útmutató 5. lépés)<br>Rövid próba: megnyomásra a motor és a munkaszervek leállnak; visszaállítás után a gép csak szándékos indítással indul.", "<b>9. kezelőfülke: biztonsági öv, terhelésdiagram, terhelésnyomaték-jelző (LMI)</b> (útmutató 4., 6. és 8. lépés)<br>Ép öv és zár; a terhelésdiagram olvasható; az LMI önteszt hibátlan; rögzítőfék, kormány-holtjáték rendben; kapcsolóváltó üresben.", "<b>10. tűzoltó készülék</b> (útmutató 2. lépés)<br>Helyén, plombája ép, a nyomásmérő a zöld mezőben, a felülvizsgálati címke érvényes.", "<b>11. gépnapló</b> (útmutató 9. lépés)<br>Üzemóra, folyadékszintek, a próba eredménye és a talált hiba bejegyzése; a hibás gépet nem adjuk ki munkára (pl. reggeli olajfolt → bejegyzés és javítás)."],F=document.querySelectorAll('.fr');let i=0,tm=null;
function show(k){i=Math.max(0,Math.min(F.length-1,k));F.forEach((f,j)=>f.style.display=j===i?'block':'none');
 document.getElementById('msg').innerHTML=M[i];document.getElementById('cnt').textContent=(i+1)+' / '+F.length;}
function stop(){if(tm){clearInterval(tm);tm=null;document.getElementById('pl').textContent='⏵ lejátszás';}}
document.getElementById('b0').onclick=()=>{stop();show(0)};document.getElementById('be').onclick=()=>{stop();show(F.length-1)};
document.getElementById('bp').onclick=()=>{stop();show(i-1)};document.getElementById('bn').onclick=()=>{stop();show(i+1)};
document.getElementById('pl').onclick=()=>{if(tm){stop();return;}if(i>=F.length-1)show(0);
 document.getElementById('pl').textContent='⏸ szünet';tm=setInterval(()=>{if(i>=F.length-1)stop();else show(i+1);},3000);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();show(i+1)}if(e.key==='ArrowLeft'){stop();show(i-1)}});
show(0);
</script>
