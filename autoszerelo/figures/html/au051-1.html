<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irányjelző villogó</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif} svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="dir">Irányjelző-kapcsoló</label><select id="dir" aria-label="Irányjelző-kapcsoló"><option value="0">középállás (ki)</option><option value="1" selected>bal</option><option value="2">jobb</option></select></div>
<div class="row"><label for="bad">Bal első izzó kiégett</label><input id="bad" type="checkbox" aria-label="Bal első izzó kiégett"></div>
<div class="row"><label for="f0">Alap villogási frekvencia</label><input id="f0" type="range" min="1" max="2" step="0.1" value="1.5" aria-label="Alap villogási frekvencia"><output id="f0_o" for="f0"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Irányjelző villogó blokkvázlata: astabil billenő kapcsolja az izzók áramát, az áramfigyelő izzóhiba esetén megkétszerezi a villogási frekvenciát."></svg>
<p class="small">Elvi szemléltetés; a frekvenciák és áramok tanulási példák (ellenőrizendő: előírás és gyártói adat). LED-es lámpáknál a hibafelismerés a vezérlőegység szoftverében történik.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"f0":"Hz"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

if(window._vt){clearTimeout(window._vt);window._vt=null;}
const side=v.dir, bad=v.bad&&side===1, f=side===0?0:(bad?2*v.f0:v.f0), on=side!==0&&(Math.floor(performance.now()/1000*f*2)%2===0);
const P=[21,5,21], lit=(s,k)=>on&&side===s&&!(bad&&k===0);
const I=side===0?0:(P.reduce((a,b)=>a+b,0)-(bad?21:0))/12;
function bx(x,y,w,h,t){el("rect",{x:x,y:y,width:w,height:h,rx:6,fill:"none",stroke:css("--line"),"stroke-width":1.5});
  t.split("\n").forEach((l,i,a)=>el("text",{x:x+w/2,y:y+h/2+5+(i-(a.length-1)/2)*14,"font-size":12,"text-anchor":"middle"},l));}
bx(10,30,90,40,"akkumulátor\n30");bx(130,30,120,40,"villogórelé\n49 → 49a");bx(130,110,120,40,"áramfigyelő\n+ astabil billenő");
el("line",{x1:100,y1:50,x2:130,y2:50,stroke:css("--line"),"stroke-width":3});
el("line",{x1:190,y1:70,x2:190,y2:110,stroke:css("--line"),"stroke-dasharray":"4 3"});
el("line",{x1:250,y1:50,x2:300,y2:50,stroke:css("--line"),"stroke-width":on?4:1.5});
el("text",{x:262,y:20,"font-size":12},"irányjelző-kapcsoló");
const ys={1:90,2:210};
[1,2].forEach(s=>{const y=ys[s];el("line",{x1:300,y1:50,x2:300,y2:y,stroke:css("--line"),"stroke-width":(side===s)?3:1.2,"stroke-dasharray":(side===s)?"":"5 4"});
  el("line",{x1:300,y1:y,x2:520,y2:y,stroke:css("--line"),"stroke-width":(side===s&&on)?3:1.2});
  el("text",{x:310,y:y-8,"font-size":12},s===1?"bal oldal":"jobb oldal");
  ["első 21 W","oldalsó 5 W","hátsó 21 W"].forEach((n,k)=>{const x=360+k*70;el("line",{x1:x,y1:y,x2:x,y2:y+20,stroke:css("--line")});
    const dead=(s===1&&k===0&&v.bad);
    el("circle",{cx:x,cy:y+34,r:14,fill:lit(s,k)?"#ffb300":"none",stroke:css("--line"),"stroke-width":1.5});
    if(dead){el("line",{x1:x-10,y1:y+24,x2:x+10,y2:y+44,stroke:css("--bad"),"stroke-width":2.5});el("line",{x1:x+10,y1:y+24,x2:x-10,y2:y+44,stroke:css("--bad"),"stroke-width":2.5});}
    el("text",{x:x,y:y+64,"font-size":11,"text-anchor":"middle"},n);});});
el("circle",{cx:60,cy:150,r:12,fill:on?"#43a047":"none",stroke:css("--line"),"stroke-width":1.5});
el("text",{x:60,y:180,"font-size":11,"text-anchor":"middle"},"visszajelző");
status(side===0?"Az irányjelző ki van kapcsolva.":"Villogási frekvencia: <b>"+fmt(f,1)+" Hz</b>; az izzók árama bekapcsolt állapotban kb. <b>"+fmt(I,1)+" A</b> 12 V-on"+
  (bad?". <span class='bad'>Egy 21 W-os izzó kiégett: az áramfigyelő kisebb áramot érzékel, a villogás kb. kétszeresére gyorsul.</span>":"."));
if(side!==0) window._vt=setTimeout(draw,60);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
