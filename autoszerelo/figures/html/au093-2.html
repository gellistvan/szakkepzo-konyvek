let k=0,sel=null,timer=null;
const box=document.getElementById("fig"),st=document.getElementById("status"),info=document.getElementById("info");
function hl(key){sel=key;box.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl"));
  if(key){box.querySelectorAll('[id^="p_'+key+'__"]').forEach(e=>e.classList.add("hl"));}
  const p=key&&PARTS[key];info.innerHTML=p?"<b>"+p[0]+"</b>"+(p[1]?" – "+p[1]:""):"<span class=small>Mutass vagy kattints egy alkatrészre (vagy a lenti gombokra).</span>";
  document.querySelectorAll("#parts button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===key));}
function bind(){box.querySelectorAll('[id^="p_"]').forEach(g=>{const key=g.id.slice(2).split("__")[0];if(!PARTS[key])return;
  g.style.cursor="pointer";g.addEventListener("mouseenter",()=>hl(key));g.addEventListener("click",()=>hl(key));});}
function parts(){const have=new Set([...box.querySelectorAll('[id^="p_"]')].map(g=>g.id.slice(2).split("__")[0]));
  const pc=document.getElementById("parts");pc.innerHTML="";
  Object.keys(PARTS).filter(x=>have.has(x)).forEach(x=>{const b=document.createElement("button");b.textContent=PARTS[x][0];b.dataset.k=x;
  b.onclick=()=>hl(sel===x?null:x);pc.appendChild(b);});}
function show(i){k=Math.max(0,Math.min(FR.length-1,i));const f=FR[k];box.innerHTML=f.svg;st.innerHTML=f.msg||"";
  const c=document.getElementById("cnt");if(c)c.textContent=(k+1)+"/"+FR.length;
  document.querySelectorAll("button[data-f]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.f===k));
  const pos=document.getElementById("pos");if(pos)pos.value=k;
  bind();parts();hl(sel&&PARTS[sel]?sel:null);if(window.onFrame)window.onFrame(k);}
function stop(){if(timer){clearInterval(timer);timer=null;}const p=document.getElementById("play");if(p)p.textContent="▶ Lejátszás";}
const $=id=>document.getElementById(id);
if(MODE==="step"){$("first").onclick=()=>{stop();show(0)};$("prev").onclick=()=>{stop();show(k-1)};$("next").onclick=()=>{stop();show(k+1)};
  $("pos").max=FR.length-1;$("pos").oninput=()=>{stop();show(+$("pos").value)};
  $("play").onclick=()=>{if(timer){stop();return;}if(k>=FR.length-1)show(0);$("play").textContent="⏸ Szünet";
    timer=setInterval(()=>{if(k>=FR.length-1)stop();else show(k+1);},2200);};
  document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){stop();show(k+1);}if(e.key==="ArrowLeft"){stop();show(k-1);}});}
else{document.querySelectorAll("button[data-f]").forEach(b=>b.onclick=()=>show(+b.dataset.f));}

show(0);
