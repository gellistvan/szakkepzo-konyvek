<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Légzsákmodul hordozása és tárolása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#c55a11;--btn:#f0f0f0;--btnon:#1f4e79;--btnonfg:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#f0a060;--btn:#2a2a2a;--btnon:#8fb8e8;--btnonfg:#111}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer;background:var(--btn);color:var(--fg);border:1px solid var(--muted);border-radius:4px}
button.on{background:var(--btnon);color:var(--btnonfg);border-color:var(--btnon)}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:2.9em}
.fr{display:none;background:#fff;border-radius:4px;padding:4px}
.fr.on{display:block}
.fr svg{display:block;width:100%;height:auto;max-height:380px}
.fr text{fill:#111}
g.part{cursor:pointer}
g.hl path,g.hl use{stroke:#c55a11 !important;stroke-width:3px !important}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők"><button data-i="0">hordozás – helyes</button><button data-i="1">hordozás – hibás</button><button data-i="2">letevés – helyes</button><button data-i="3">letevés – hibás</button><button data-i="4">tárolás – helyes</button><button data-i="5">tárolás – hibás</button></div>
<div id="status" aria-live="polite"></div>

<p class="small">Sematikus vonalrajz; a gyártói javítási utasítás és a pirotechnikai elemekre vonatkozó szabályok az irányadók (ellenőrizendő).</p>
<script>
const MODE="buttons", MSG=["<b>Hordozás – helyes:</b> a kinyíló (burkolati) oldal a testtől elfelé, a csatlakozó/kábel hátra-lefelé, a modult a testtől távol tartjuk.", "<b>Hordozás – HIBÁS:</b> a burkolat a mellkas felé néz. Véletlen kioldáskor a zsák és a burkolat a test felé lövell (szaggatott nyíl).", "<b>Letevés – helyes:</b> kinyíló oldallal felfelé, sík, nem éghető, pormentes felületre, hőtől távol (5. lépés).", "<b>Letevés – HIBÁS:</b> kinyíló oldallal lefelé. Kioldáskor a gáz a felületnek ütközik, és a modul fellövődik (szaggatott nyíl).", "<b>Tárolás – helyes:</b> zárható, jelölt tárolóban, a gyártói előírás szerint, más pirotechnikai elemektől előírt módon elkülönítve (ellenőrizendő).", "<b>Tárolás – HIBÁS:</b> nyitott polcon, hőforrás és gyúlékony anyag mellett, jelöletlenül."], PARTS={"burk": "burkolat – a kinyíló oldal", "haz": "modulház", "asztal": "nem éghető munkafelület", "szekreny": "zárható, jelölt tároló"}, LABELS=["hordozás – helyes", "hordozás – hibás", "letevés – helyes", "letevés – hibás", "tárolás – helyes", "tárolás – hibás"];
const FR=[...document.querySelectorAll(".fr")], ST=document.getElementById("status");
let k=0, timer=null;
function show(i){k=Math.max(0,Math.min(FR.length-1,i));FR.forEach((f,j)=>f.classList.toggle("on",j===k));
  document.querySelectorAll("button[data-i]").forEach(b=>b.classList.toggle("on",+b.dataset.i===k));
  const r=document.getElementById("pos");if(r){r.value=k;}
  const c=document.getElementById("cnt");if(c){c.textContent=(MODE==="slider"?LABELS[k]:(k+1)+"/"+FR.length);}
  ST.innerHTML=MSG[k]||"";}
function stop(){if(timer){clearInterval(timer);timer=null;}const p=document.getElementById("play");if(p)p.textContent="▶ Lejátszás";}
document.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{stop();show(+b.dataset.i);});
const B=id=>document.getElementById(id);
if(B("first")){B("first").onclick=()=>{stop();show(0);};B("prev").onclick=()=>{stop();show(k-1);};B("next").onclick=()=>{stop();show(k+1);};
  B("play").onclick=()=>{if(timer){stop();return;}if(k>=FR.length-1)show(0);B("play").textContent="⏸ Szünet";
    timer=setInterval(()=>{if(k>=FR.length-1)stop();else show(k+1);},1800);};}
if(B("pos"))B("pos").oninput=()=>{stop();show(+B("pos").value);};
document.querySelectorAll("g[id]").forEach(g=>{const m=g.id.match(/_p_([A-Za-z0-9]+)$/);if(!m||!(m[1] in PARTS))return;
