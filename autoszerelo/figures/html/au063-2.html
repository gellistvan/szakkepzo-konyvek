<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hengerfejcsavarok meghúzási sorrendje</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hengerfej síkságmérése vonalzóval és hézagmérővel hosszirányban és átlósan; csavarok meghúzási sorrendje középről kifelé."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A csavar színe a már elért fokozatot mutatja (világos → sötét). Jellemző, középről kifelé haladó sorrend; a pontos sorrend, a nyomatékok és a szögek gyártói adatok (ellenőrizendő).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kiinduló állapot: a csavarok kézzel behajtva. A meghúzás a sorrend szerint, fokozatonként halad (a sorrend és az értékek gyártói adatok; itt a fejezet példái).", "st": -1, "k": -1}, {"msg": "1. előnyomaték (pl. 30 Nm): 1. csavar", "st": 0, "k": 0}, {"msg": "1. előnyomaték (pl. 30 Nm): 2. csavar", "st": 0, "k": 1}, {"msg": "1. előnyomaték (pl. 30 Nm): 3. csavar", "st": 0, "k": 2}, {"msg": "1. előnyomaték (pl. 30 Nm): 4. csavar", "st": 0, "k": 3}, {"msg": "1. előnyomaték (pl. 30 Nm): 5. csavar", "st": 0, "k": 4}, {"msg": "1. előnyomaték (pl. 30 Nm): 6. csavar", "st": 0, "k": 5}, {"msg": "1. előnyomaték (pl. 30 Nm): 7. csavar", "st": 0, "k": 6}, {"msg": "1. előnyomaték (pl. 30 Nm): 8. csavar", "st": 0, "k": 7}, {"msg": "1. előnyomaték (pl. 30 Nm): 9. csavar", "st": 0, "k": 8}, {"msg": "1. előnyomaték (pl. 30 Nm): 10. csavar – a fokozat kész, mind a 10 csavar ezen az értéken.", "st": 0, "k": 9}, {"msg": "2. nyomaték (pl. 90 Nm): 1. csavar", "st": 1, "k": 0}, {"msg": "2. nyomaték (pl. 90 Nm): 2. csavar", "st": 1, "k": 1}, {"msg": "2. nyomaték (pl. 90 Nm): 3. csavar", "st": 1, "k": 2}, {"msg": "2. nyomaték (pl. 90 Nm): 4. csavar", "st": 1, "k": 3}, {"msg": "2. nyomaték (pl. 90 Nm): 5. csavar", "st": 1, "k": 4}, {"msg": "2. nyomaték (pl. 90 Nm): 6. csavar", "st": 1, "k": 5}, {"msg": "2. nyomaték (pl. 90 Nm): 7. csavar", "st": 1, "k": 6}, {"msg": "2. nyomaték (pl. 90 Nm): 8. csavar", "st": 1, "k": 7}, {"msg": "2. nyomaték (pl. 90 Nm): 9. csavar", "st": 1, "k": 8}, {"msg": "2. nyomaték (pl. 90 Nm): 10. csavar – a fokozat kész, mind a 10 csavar ezen az értéken.", "st": 1, "k": 9}, {"msg": "3. szöghúzás 90°: 1. csavar", "st": 2, "k": 0}, {"msg": "3. szöghúzás 90°: 2. csavar", "st": 2, "k": 1}, {"msg": "3. szöghúzás 90°: 3. csavar", "st": 2, "k": 2}, {"msg": "3. szöghúzás 90°: 4. csavar", "st": 2, "k": 3}, {"msg": "3. szöghúzás 90°: 5. csavar", "st": 2, "k": 4}, {"msg": "3. szöghúzás 90°: 6. csavar", "st": 2, "k": 5}, {"msg": "3. szöghúzás 90°: 7. csavar", "st": 2, "k": 6}, {"msg": "3. szöghúzás 90°: 8. csavar", "st": 2, "k": 7}, {"msg": "3. szöghúzás 90°: 9. csavar", "st": 2, "k": 8}, {"msg": "3. szöghúzás 90°: 10. csavar – a fokozat kész, mind a 10 csavar ezen az értéken.", "st": 2, "k": 9}, {"msg": "4. szöghúzás további 90°: 1. csavar", "st": 3, "k": 0}, {"msg": "4. szöghúzás további 90°: 2. csavar", "st": 3, "k": 1}, {"msg": "4. szöghúzás további 90°: 3. csavar", "st": 3, "k": 2}, {"msg": "4. szöghúzás további 90°: 4. csavar", "st": 3, "k": 3}, {"msg": "4. szöghúzás további 90°: 5. csavar", "st": 3, "k": 4}, {"msg": "4. szöghúzás további 90°: 6. csavar", "st": 3, "k": 5}, {"msg": "4. szöghúzás további 90°: 7. csavar", "st": 3, "k": 6}, {"msg": "4. szöghúzás további 90°: 8. csavar", "st": 3, "k": 7}, {"msg": "4. szöghúzás további 90°: 9. csavar", "st": 3, "k": 8}, {"msg": "4. szöghúzás további 90°: 10. csavar – a fokozat kész, mind a 10 csavar ezen az értéken.", "st": 3, "k": 9}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const B = [[290.0, 72.5], [290.0, 207.5], [195.0, 207.5], [385.0, 72.5], [385.0, 207.5], [195.0, 72.5], [100.0, 72.5], [480.0, 207.5], [480.0, 72.5], [100.0, 207.5]], ST = ["1. előnyomaték (pl. 30 Nm)", "2. nyomaték (pl. 90 Nm)", "3. szöghúzás 90°", "4. szöghúzás további 90°"];
function render(s){
  svg.setAttribute("viewBox", "0 0 620 330"); svg.innerHTML = "";
  el("rect", {x: 40, y: 40, width: 500, height: 200, fill: "#f2f2f2", stroke: "#000", "stroke-width": 2});
  for (let c = 0; c < 4; c++) el("circle", {cx: 40 + (2.15 + c * 1.9) * 50, cy: 140, r: 39, fill: "#fff", stroke: "#000"});
  B.forEach((p, i) => {
    const done = s.st > -1 && (i < s.k || i === s.k), cur = i === s.k;
    const lvl = s.st < 0 ? 0 : (i <= s.k ? s.st + 1 : s.st);
    const g = ["#ffffff", "#d9d9d9", "#a6a6a6", "#6e6e6e", "#333333"][lvl];
    el("circle", {cx: p[0], cy: p[1], r: cur ? 16 : 12, fill: g, stroke: "#000", "stroke-width": cur ? 3.5 : 1.2});
    el("text", {x: p[0], y: p[1] + 5, "text-anchor": "middle", "font-size": 13, "font-weight": "bold",
                fill: lvl >= 3 ? "#fff" : "#000"}, String(i + 1));
  });
  ST.forEach((t, j) => {
    const on = j === s.st;
    el("rect", {x: 40 + j * 128, y: 268, width: 120, height: 40, rx: 6, fill: ["#d9d9d9", "#a6a6a6", "#6e6e6e", "#333333"][j],
                stroke: "#000", "stroke-width": on ? 3.5 : 1});
    el("text", {x: 100 + j * 128, y: 293, "text-anchor": "middle", "font-size": 11.5, fill: j >= 2 ? "#fff" : "#000",
                "font-weight": on ? "bold" : "normal"}, t.replace(/^\d\. /, ""));
  });
  el("text", {x: 290, y: 28, "text-anchor": "middle", "font-size": 13}, "szívóoldal");
  el("text", {x: 290, y: 258, "text-anchor": "middle", "font-size": 13}, "kipufogóoldal");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.innerHTML = s.msg || "";   // a lépésszöveg saját, megbízható HTML-t (<b>, <i>) tartalmazhat
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
