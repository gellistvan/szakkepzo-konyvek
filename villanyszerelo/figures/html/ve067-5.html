<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fényeloszlási görbe olvasása (cd/klm)</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="tip">Lámpatest</label><select id="tip" aria-label="Lámpatest"><option value="panel" selected>opál LED-panel (Lambert)</option><option value="mely">mélysugárzó, 60°-os nyaláb</option><option value="spot">spot, 24°-os nyaláb</option></select></div>
<div class="row"><label for="th">Irány θ</label><input id="th" type="range" min="0" max="80" step="1" value="0" aria-label="Irány θ"><output id="th_o" for="th"></output></div>
<div class="row"><label for="phi">Fényáram Φ</label><input id="phi" type="range" min="500" max="12000" step="100" value="4000" aria-label="Fényáram Φ"><output id="phi_o" for="phi"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 310" role="img" aria-label="Három lámpatest fényeloszlási görbéje polárdiagramon cd/klm egységben: széles panel, közepes mélysugárzó és szűk spot."></svg>
<p class="small">Szemléltető görbék: I(θ) = I0·cos^m θ, 1000 lm-re normálva (a teljes fényáram az alsó féltérbe jut). A polárdiagram léptéke a kiválasztott görbéhez igazodik. A valódi értéket a gyártói adatlap / LDT-fájl adja.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"th":"°", "phi":"lm"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const TP={"panel": ["opál LED-panel (Lambert)", 1.0], "mely": ["mélysugárzó, félérték-szög 30°", 4.81884167930642], "spot": ["spot, nyalábszög 24°", 31.371650273390117]};
const m=TP[v.tip][1],I0=1000*(m+1)/(2*Math.PI),f=t=>I0*Math.pow(Math.cos(t*Math.PI/180),m);
const cx=280,cy=30,Rp=250,sc=Rp/I0;
const P=(t,r)=>[cx+r*sc*Math.sin(t*Math.PI/180),cy+r*sc*Math.cos(t*Math.PI/180)];
for(let q=1;q<=4;q++){const r=I0*q/4;let d="";for(let t=-90;t<=90;t+=2){const p=P(t,r);d+=(t===-90?"M":"L")+p[0].toFixed(1)+" "+p[1].toFixed(1);}
 el("path",{d:d,fill:"none",stroke:css("--grid")});const p=P(-90,r);el("text",{x:p[0],y:cy+14,"text-anchor":"middle","font-size":10},Math.round(r));}
[-90,-60,-30,0,30,60,90].forEach(t=>{const p=P(t,I0*1.04);el("line",{x1:cx,y1:cy,x2:P(t,I0)[0],y2:P(t,I0)[1],stroke:css("--grid")});el("text",{x:p[0],y:p[1]+4,"text-anchor":"middle","font-size":11},Math.abs(t)+"°");});
let d="";for(let t=-90;t<=90;t+=0.5){const p=P(t,f(Math.abs(t)));d+=(t===-90?"M":"L")+p[0].toFixed(1)+" "+p[1].toFixed(1);}
el("path",{d:d,fill:css("--hl"),"fill-opacity":.15,stroke:css("--hl"),"stroke-width":2.2});
const it=f(v.th),pt=P(v.th,it);
el("line",{x1:cx,y1:cy,x2:P(v.th,I0)[0],y2:P(v.th,I0)[1],stroke:css("--hl2"),"stroke-width":1.5,"stroke-dasharray":"5 4"});
el("line",{x1:cx,y1:cy,x2:pt[0],y2:pt[1],stroke:css("--hl2"),"stroke-width":3});
el("circle",{cx:pt[0],cy:pt[1],r:5,fill:css("--hl2")});
el("rect",{x:cx-40,y:cy-14,width:80,height:12,fill:css("--fg")});el("text",{x:cx+48,y:cy-4,"font-size":11},"lámpatest");
el("text",{x:10,y:300,"font-size":11},"cd/klm; 0° = függőlegesen lefelé");
status("<b>"+TP[v.tip][0]+"</b>: I<sub>0</sub> = "+fmt(I0,0)+" cd/klm (m = "+fmt(m,2)+")<br>θ = "+v.th+"°: I(θ) = "+fmt(it,1)+" cd/klm → Φ = "+fmt(v.phi,0)+" lm = "+fmt(v.phi/1000,2)+" klm mellett <b>I = "+fmt(it,1)+" · "+fmt(v.phi/1000,2)+" = "+fmt(it*v.phi/1000,0)+" cd</b>");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
