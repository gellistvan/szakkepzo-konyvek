<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ipari kommunikációs csatlakozók</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#555;--btn:#e8eefc;--btnb:#1f4e79;--hl:#d32f2f}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--btn:#26324a;--btnb:#8fb8e8;--hl:#ff6e6e}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px}
button{font:inherit;padding:5px 12px;border:1.5px solid var(--btnb);background:var(--btn);color:var(--fg);border-radius:6px;cursor:pointer}
button[aria-pressed=true]{background:var(--btnb);color:var(--bg)}
button:focus-visible{outline:3px solid var(--btnb);outline-offset:2px}
label.chk{display:inline-flex;gap:5px;align-items:center;cursor:pointer;margin-right:8px}
.card{background:#fff;border-radius:8px;padding:6px;color:#111}
.card svg{width:100%;height:auto;display:block;max-height:78vh}
#status{margin:6px 0;min-height:2.6em}
.parts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.parts button{font-size:12.5px;padding:3px 8px}
.small{font-size:12px;color:var(--muted)}
svg .hl path,svg .hl line,svg .hl polyline,svg .hl ellipse,svg .hl circle,svg .hl rect{stroke:#d32f2f!important;stroke-width:2.6px!important}
svg .hl text{fill:#d32f2f!important;font-weight:bold}
svg .hl{filter:drop-shadow(0 0 2px rgba(211,47,47,.7))}
svg .off{display:none}
.pulse{animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
</head>

<div class="parts" id="parts" aria-label="Részek"></div>
<p class="small">Sematikus rajz; az M12-kiosztás és a lezárás értéke a gyártói/protokoll-irányelv szerint ellenőrizendő.</p>
<script>
const PARTS=[{"k": "rj", "n": "1", "name": "RJ45 (8P8C) dugó", "d": "Érintkezők felül, rögzítőfül hátul; krimpelés a T568B sorrend szerint, mindkét végen azonosan."}, {"k": "ere", "n": "2", "name": "T568B érsorrend", "d": "1 fehér-narancs, 2 narancs, 3 fehér-zöld, 4 kék, 5 fehér-kék, 6 zöld, 7 fehér-barna, 8 barna."}, {"k": "kod", "n": "3", "name": "D-kódolás", "d": "A horony csak az illeszkedő csatlakozót engedi; rezgésálló, csavaros rögzítés."}, {"k": "m12", "n": "4", "name": "M12 érintkezők", "d": "4 pólus; a kiosztás a gyártói/protokoll rajz szerint (a jelölés itt példa, ellenőrizendő)."}, {"k": "utp", "n": "", "name": "UTP", "d": "Árnyékolatlan: csak zavarszegény szekrényen belül."}, {"k": "ftp", "n": "", "name": "FTP", "d": "Közös fóliaárnyékolás."}, {"k": "stp", "n": "", "name": "STP / S/FTP", "d": "Páronkénti fólia és közös fonat: szekrények között, hajtások közelében."}, {"k": "busz", "n": "5", "name": "RS-485 vonal", "d": "Csavart érpár A/B és közös GND; láncszerűen fűzve, leágazás nélkül."}, {"k": "lezaro", "n": "6", "name": "Lezáró ellenállás", "d": "A vonal mindkét fizikai végén (tipikusan 120 Ω, gyártói előírás szerint); középen nincs."}, {"k": "node", "n": "", "name": "Állomások", "d": "Mester és állomások; mindegyiknek egyedi címe van."}], LAYERS=[],
FRAMES=[], HIDE=[], STEPPER=true,
ZOOM=true, SHOWALL=true, START=0, DELAY=1600,
ALLMSG="Mutasson egy részre vagy a lenti gombokra a kiemeléshez.";


const SVG=document.getElementById("fig"), ST=document.getElementById("status");
const VB0=SVG.getAttribute("viewBox");
const q=k=>Array.from(SVG.querySelectorAll('[id^="'+k+'-"]')).concat(Array.from(SVG.querySelectorAll('[id="'+k+'"]')));
function status(h){ST.innerHTML=h;}
/* --- kiemelhető részek --- */
let cur=null;
function hl(k,on){q(k).forEach(e=>e.classList.toggle("hl",on));}
function pick(p){if(cur)hl(cur.k,false);cur=p;if(p){hl(p.k,true);status("<b>"+(p.n?p.n+" – ":"")+p.name+"</b>"+(p.d?": "+p.d:""));}
  document.querySelectorAll(".parts button").forEach(b=>b.setAttribute("aria-pressed",p&&b.dataset.k===p.k?"true":"false"));}
if(PARTS.length){const box=document.getElementById("parts");
  PARTS.forEach(p=>{const b=document.createElement("button");b.type="button";b.dataset.k=p.k;b.textContent=(p.n?p.n+" ":"")+p.name;
    b.addEventListener("mouseenter",()=>pick(p));b.addEventListener("focus",()=>pick(p));b.addEventListener("click",()=>pick(p));box.appendChild(b);
    q(p.k).forEach(e=>{e.style.cursor="pointer";e.addEventListener("mouseenter",()=>pick(p));e.addEventListener("click",()=>pick(p));});});}
/* --- rétegek --- */
LAYERS.forEach(L=>{const c=document.getElementById("ly_"+L.k);const f=()=>{L.k.split(",").forEach(k=>q(k).forEach(e=>e.classList.toggle("off",!c.checked)));};
  c.addEventListener("change",f);f();});
/* --- képkockák / nézetek --- */
let fi=-1,timer=null;
function zoomTo(k){const g=q(k);if(!g.length)return;let b=null;
  g.forEach(e=>{const r=e.getBBox();if(!b)b={x:r.x,y:r.y,x2:r.x+r.width,y2:r.y+r.height};else{b.x=Math.min(b.x,r.x);b.y=Math.min(b.y,r.y);b.x2=Math.max(b.x2,r.x+r.width);b.y2=Math.max(b.y2,r.y+r.height);}});
  const p=6;SVG.setAttribute("viewBox",(b.x-p)+" "+(b.y-p)+" "+(b.x2-b.x+2*p)+" "+(b.y2-b.y+2*p));}
function show(i){if(!FRAMES.length)return;fi=(i+FRAMES.length)%FRAMES.length;
  FRAMES.forEach((F,j)=>F.k.split(",").forEach(k=>q(k).forEach(e=>e.classList.toggle("off",j!==fi))));
  (FRAMES[fi].hide||"").split(",").filter(Boolean).forEach(k=>q(k).forEach(e=>e.classList.add("off")));
  HIDE.forEach(k=>q(k).forEach(e=>e.classList.add("off")));
  if(ZOOM)zoomTo(FRAMES[fi].k.split(",")[0]);
  status("<b>"+(fi+1)+"/"+FRAMES.length+"</b> – "+FRAMES[fi].c);
  document.querySelectorAll(".fr").forEach((b,j)=>b.setAttribute("aria-pressed",j===fi?"true":"false"));
  if(typeof onFrame==="function")onFrame(fi);}
function all(){stop();fi=-1;FRAMES.forEach(F=>F.k.split(",").forEach(k=>q(k).forEach(e=>e.classList.remove("off"))));
  HIDE.forEach(k=>q(k).forEach(e=>e.classList.remove("off")));SVG.setAttribute("viewBox",VB0);status(ALLMSG);
  document.querySelectorAll(".fr").forEach(b=>b.setAttribute("aria-pressed","false"));if(typeof onFrame==="function")onFrame(-1);}
function stop(){if(timer){clearInterval(timer);timer=null;const b=document.getElementById("play");if(b)b.textContent="▶ lejátszás";}}
if(FRAMES.length){const bar=document.getElementById("frames");
  const mkb=(t,f,id)=>{const b=document.createElement("button");b.type="button";b.textContent=t;if(id)b.id=id;b.addEventListener("click",f);bar.appendChild(b);return b;};
  if(STEPPER){mkb("⏮",()=>{stop();show(0);});mkb("◀",()=>{stop();show(fi<0?0:fi-1);});mkb("▶",()=>{stop();show(fi+1);});
    mkb("▶ lejátszás",()=>{if(timer){stop();return;}document.getElementById("play").textContent="⏸ megállítás";if(fi<0)show(0);
      timer=setInterval(()=>{if(fi>=FRAMES.length-1){stop();return;}show(fi+1);},DELAY);},"play");}
  FRAMES.forEach((F,j)=>{const b=mkb(F.b||String(j+1),()=>{stop();show(j);});b.className="fr";});
  if(SHOWALL)mkb("Teljes ábra",all);
  document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"){stop();show(fi+1);}if(e.key==="ArrowLeft"){stop();show(fi<0?0:fi-1);}});
  if(START>=0)show(START);else all();}
else status(ALLMSG);

</script>
