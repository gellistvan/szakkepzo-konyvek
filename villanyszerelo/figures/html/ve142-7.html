<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kötés melegedése: P = I²·R</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="I">Áram I</label><input id="I" type="range" min="1" max="63" step="1" value="16" aria-label="Áram I"><output id="I_o" for="I"></output></div>
<div class="row"><label for="R">Átmeneti ellenállás R</label><select id="R" aria-label="Átmeneti ellenállás R"><option value="0.1">0,1 mΩ</option><option value="0.2" selected>0,2 mΩ</option><option value="0.5">0,5 mΩ</option><option value="1">1 mΩ</option><option value="2">2 mΩ</option><option value="5">5 mΩ</option><option value="10">10 mΩ</option><option value="20">20 mΩ</option><option value="50">50 mΩ</option><option value="100">100 mΩ</option></select></div>
<div class="row"><label for="cmp">Összehasonlítás: ép 10 mm-es 2,5 mm² Cu (0,07 mΩ)</label><input id="cmp" type="checkbox" aria-label="Összehasonlítás: ép 10 mm-es 2,5 mm² Cu (0,07 mΩ)"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 700 160" role="img" aria-label="Sávskála a kötésben keletkező hőteljesítményről (W), a beállított áram és átmeneti ellenállás szerint"></svg>
<p class="small">A sávhatárok (0,1 / 1 / 5 W) és a hasonlatok szemléltetők, nem szabványértékek. Egy kötés megengedett melegedését a gyártói adat és a vizsgálati szabvány adja (ellenőrizendő: MSZ EN 60947-7-1, MSZ EN 60998).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"I":"A"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const I=v.I, R=v.R/1000, P=I*I*R, Pep=I*I*0.07/1000;
const bands=[[0.1,"normális","#2e7d32","normális"],[1,"figyelendő","#f9a825","figyelendő"],[5,"melegszik – javítandó","#ef6c00","melegszik"],[1e9,"tűzveszélyes","#c62828","tűzveszélyes"]];
let b=0; while(P>bands[b][0]) b++;
const X=p=>40+ (Math.log10(Math.max(p,1e-3))+3)/6*620;   // 0,001 W … 1000 W
const labs=[["0,001",1e-3],["0,01",1e-2],["0,1",0.1],["1",1],["10",10],["100",100],["1000",1000]];
let x0=X(1e-3);
bands.forEach((bd,k)=>{const x1=X(Math.min(bd[0],1000));el("rect",{x:x0,y:60,width:x1-x0,height:34,fill:bd[2],opacity:.75});
  el("text",{x:(x0+x1)/2,y:82,"text-anchor":"middle","font-size":12,fill:"#111"},bd[3]);x0=x1;});
labs.forEach(l=>{el("line",{x1:X(l[1]),x2:X(l[1]),y1:94,y2:100,stroke:css("--fg")});el("text",{x:X(l[1]),y:50,"text-anchor":"middle","font-size":11,fill:css("--fg")},l[0]+" W");});
el("polygon",{points:`${X(P)},96 ${X(P)-9},132 ${X(P)+9},132`,fill:css("--fg")});
el("text",{x:X(P),y:150,"text-anchor":"middle","font-size":14,"font-weight":"bold",fill:css("--fg")},"P = "+fmt(P,P<0.1?3:(P<10?2:1))+" W");
if(v.cmp){el("polygon",{points:`${X(Pep)},58 ${X(Pep)-7},30 ${X(Pep)+7},30`,fill:"none",stroke:css("--fg"),"stroke-width":2});
  el("text",{x:X(Pep),y:22,"text-anchor":"middle","font-size":11,fill:css("--fg")},"ép vezetőszakasz");}
const has=P<0.05?"alig mérhető melegedés":P<0.5?"kb. egy LED-es jelzőfény hője":P<3?"kb. egy kis éjszakai fény (1–3 W) hője, kis térfogatba zárva":
 P<15?"egy kis forrasztópáka (10–15 W) hegyének nagyságrendje – a kapocs és a szigetelés túlmelegszik":"egy forrasztópáka teljes teljesítménye vagy több – parázsló szigetelés, tűz";
status(`<b>P = I²·R = ${fmt(I,0)}² A² · ${fmt(v.R,v.R<1?2:0)} mΩ = ${fmt(P,P<0.1?3:2)} W</b> – sáv: <b>${bands[b][1]}</b><br>Hasonlat: ${has}.`+
 (v.cmp?`<br>Ép 10 mm-es 2,5 mm²-es rézszakasz ugyanennél az áramnál: ${fmt(Pep,4)} W – a kötés ${fmt(P/Pep,0)}-szorosa ennek.`:""));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
