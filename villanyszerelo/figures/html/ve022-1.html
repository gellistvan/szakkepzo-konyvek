<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soros RLC-kör impedanciagörbéje</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="R">Ellenállás R</label><input id="R" type="range" min="10" max="500" step="5" value="100" aria-label="Ellenállás R"><output id="R_o" for="R"></output></div>
<div class="row"><label for="L">Induktivitás L</label><input id="L" type="range" min="10" max="500" step="5" value="100" aria-label="Induktivitás L"><output id="L_o" for="L"></output></div>
<div class="row"><label for="C">Kapacitás C</label><input id="C" type="range" min="1" max="100" step="1" value="10" aria-label="Kapacitás C"><output id="C_o" for="C"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="A soros RLC-kör impedanciájának nagysága a frekvencia függvényében, a rezonanciafrekvencia jelölésével"></svg>
<p class="small">Szemléltetés (6.3): |Z| = √(R² + (ωL − 1/ωC)²). Alap: R = 100 Ω, L = 100 mH, C = 10 µF → f₀ = 159,2 Hz (a fejezet pontjai). Számolt görbe; a valódi tekercs és kondenzátor veszteségei nincsenek modellezve.</p>
<script>
const NS="http://www.w3.org/2000/svg", S=document.getElementById("v"), ST=document.getElementById("status");
const UN={"R":"Ω", "L":"mH", "C":"µF"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;S.appendChild(e);return e;}
function status(h){ST.innerHTML=h;}
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});return v;}
function draw(){S.innerHTML="";const v=values();

const L=v.L/1000, C=v.C*1e-6, f0=1/(2*Math.PI*Math.sqrt(L*C)), Zf=f=>{const w=2*Math.PI*f;return Math.hypot(v.R,w*L-1/(w*C));};
const fmax=Math.max(400,Math.ceil(2.5*f0/50)*50), Zmax=Math.max(400,4*v.R), x0=60,x1=530,y0=250,y1=28,X=f=>x0+(x1-x0)*(f-20)/(fmax-20),Y=z=>y0-(y0-y1)*Math.min(z,Zmax)/Zmax;
el("line",{x1:x0,y1:y0,x2:x1,y2:y0,stroke:css("--line")});el("line",{x1:x0,y1:y0,x2:x0,y2:y1,stroke:css("--line")});
const st=fmax>800?200:100;for(let f=st;f<=fmax;f+=st){el("line",{x1:X(f),y1:y0,x2:X(f),y2:y0+4,stroke:css("--line")});el("text",{x:X(f),y:y0+16,"text-anchor":"middle","font-size":11},""+f);}
for(let k=0;k<=4;k++){const z=Zmax*k/4;el("line",{x1:x0-4,y1:Y(z),x2:x1,y2:Y(z),stroke:css("--grid")});el("text",{x:x0-8,y:Y(z)+4,"text-anchor":"end","font-size":11},fmt(z,0));}
el("text",{x:(x0+x1)/2,y:y0+34,"text-anchor":"middle","font-size":12},"f (Hz)");el("text",{x:x0+6,y:y1-10,"font-size":11},"|Z| (Ω)");
let d="",pen=false;for(let k=0;k<=600;k++){const f=20+(fmax-20)*k/600,z=Zf(f);if(z>Zmax){pen=false;continue;}d+=(pen?"L":"M")+X(f)+" "+Y(z);pen=true;}
el("path",{d:d,fill:"none",stroke:css("--hl"),"stroke-width":3});
el("line",{x1:x0,y1:Y(v.R),x2:x1,y2:Y(v.R),stroke:css("--muted"),"stroke-dasharray":"2 4"});
el("line",{x1:X(f0),y1:y0,x2:X(f0),y2:y1,stroke:css("--hl2"),"stroke-dasharray":"6 4","stroke-width":2});
el("circle",{cx:X(f0),cy:Y(v.R),r:6,fill:css("--hl2"),stroke:css("--line")});el("text",{x:X(f0)+8,y:y1+14,"font-size":12,fill:css("--hl2")},"f₀ = "+fmt(f0,1)+" Hz");
status("f<sub>0</sub> = 1/(2π√(LC)) = <b>"+fmt(f0,1)+" Hz</b>; rezonanciánál |Z| = R = <b>"+fmt(v.R,0)+" Ω</b>. 50 Hz-en X<sub>L</sub> = "+fmt(2*Math.PI*50*L)+" Ω, X<sub>C</sub> = "+fmt(1/(2*Math.PI*50*C))+" Ω, |Z| = "+fmt(Zf(50),1)+" Ω.");

}
document.querySelectorAll("input[type=range]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
