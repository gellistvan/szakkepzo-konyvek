<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szerelési sávok – fúrási pont ellenőrzése</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="fx">Fúrási pont vízszintesen (a fal bal szélétől, elvi egység)</label><input id="fx" type="range" min="0" max="11.0" step="0.1" value="4.6" aria-label="Fúrási pont vízszintesen (a fal bal szélétől, elvi egység)"><output id="fx_o" for="fx"></output></div>
<div class="row"><label for="fy">Fúrási pont függőlegesen (a padlótól, elvi egység)</label><input id="fy" type="range" min="0" max="6.0" step="0.1" value="3.6" aria-label="Fúrási pont függőlegesen (a padlótól, elvi egység)"><output id="fy_o" for="fy"></output></div>
<div class="row"><label for="sb">Sávok megjelenítése (0 = rejtve, 1 = látható)</label><input id="sb" type="range" min="0" max="1" step="1" value="1" aria-label="Sávok megjelenítése (0 = rejtve, 1 = látható)"><output id="sb_o" for="sb"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Falnézet ajtóval és ablakkal; a rejtett vezetékek vízszintes és függőleges sávjai; a fúrási pont áthelyezhető, és a lap jelzi, hogy sávba esik-e."></svg>
<p class="small">Elvi, nem méretarányos vázlat; a fúrási pontot a csúszkákkal vagy a falra kattintva lehet áthelyezni. A sávok szélessége és távolsága a fejezet szerint csak tájékoztató („néhány tíz cm”), a pontos méretek forrásellenőrzést igényelnek (ellenőrizendő: MSZ HD 60364-5-52 és a hazai gyakorlat).</p>
<script>
const NS="http://www.w3.org/2000/svg", S=document.getElementById("v"), ST=document.getElementById("status");
const UN={"fx":"", "fy":"", "sb":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;S.appendChild(e);return e;}
function status(h){ST.innerHTML=h;}
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});return v;}
function draw(){S.innerHTML="";const v=values();
const H=[[5.4,6.0],[2.4,3.0],[0.0,0.6]], V=[[0.0,0.6],[1.2000000000000002,1.8],[3.0,3.6],[6.0,6.6],[8.6,9.2],[10.4,11.0]], OP=[[1.8,0.0,1.2,4.6],[6.6,2.0,2.0,2.7]];
const WW=11.0, WH=6.0, L=16, T=10, K=48, X=x=>L+x*K, Y=y=>T+(WH-y)*K;
const inOp=(x,y)=>OP.some(o=>x>=o[0]&&x<=o[0]+o[2]&&y>=o[1]&&y<=o[1]+o[3]);
const inBand=(x,y)=>!inOp(x,y)&&(H.some(b=>y>=b[0]&&y<=b[1])||V.some(b=>x>=b[0]&&x<=b[1]));
el("rect",{x:X(0),y:Y(WH),width:WW*K,height:WH*K,fill:"none",stroke:css("--line"),"stroke-width":2});
if(v.sb){H.forEach(b=>el("rect",{x:X(0),y:Y(b[1]),width:WW*K,height:(b[1]-b[0])*K,fill:css("--grid"),opacity:0.8}));
 V.forEach(b=>el("rect",{x:X(b[0]),y:Y(WH),width:(b[1]-b[0])*K,height:WH*K,fill:css("--grid"),opacity:0.8}));}
OP.forEach((o,i)=>{el("rect",{x:X(o[0]),y:Y(o[1]+o[3]),width:o[2]*K,height:o[3]*K,fill:css("--bg")||"white",stroke:css("--line"),"stroke-width":2});
 el("text",{x:X(o[0]+o[2]/2),y:Y(o[1]+o[3]/2),"text-anchor":"middle","font-size":13},i?"ablak":"ajtó");});
const SWI=[3.3,2.6999999999999997], SOC=[[0.3,0.3],[6.3,0.3],[10.7,0.3]];
el("rect",{x:X(SWI[0])-8,y:Y(SWI[1])-8,width:16,height:16,fill:css("--bg"),stroke:css("--line"),"stroke-width":2});el("text",{x:X(SWI[0]),y:Y(SWI[1])+5,"text-anchor":"middle","font-size":12},"K");
SOC.forEach(p=>{el("circle",{cx:X(p[0]),cy:Y(p[1]),r:9,fill:css("--bg"),stroke:css("--line"),"stroke-width":2});el("text",{x:X(p[0]),y:Y(p[1])+4,"text-anchor":"middle","font-size":11},"A");});
const ok=inBand(v.fx,v.fy), op=inOp(v.fx,v.fy);
el("circle",{cx:X(v.fx),cy:Y(v.fy),r:9,fill:"none",stroke:ok?css("--hl2"):css("--hl"),"stroke-width":3});
el("line",{x1:X(v.fx)-12,x2:X(v.fx)+12,y1:Y(v.fy),y2:Y(v.fy),stroke:css("--line")});
el("line",{x1:X(v.fx),x2:X(v.fx),y1:Y(v.fy)-12,y2:Y(v.fy)+12,stroke:css("--line")});
if(!S._click){S._click=1;S.addEventListener("click",ev=>{const r=S.getBoundingClientRect(),vb=S.viewBox.baseVal;
 const sx=(ev.clientX-r.left)*vb.width/r.width, sy=(ev.clientY-r.top)*vb.height/r.height;
 const x=Math.min(WW,Math.max(0,(sx-L)/K)), y=Math.min(WH,Math.max(0,WH-(sy-T)/K));
 document.getElementById("fx").value=x.toFixed(1);document.getElementById("fy").value=y.toFixed(1);draw();});}
status(op?"A pont nyílászáróra esik, itt nincs fal.":ok?"<b>A fúrási pont szerelési sávba esik:</b> itt rejtett vezeték lehet – fúrás előtt vezetékkeresővel ellenőrizd, vagy válassz sávon kívüli helyet.":
 "<b>A fúrási pont a sávokon kívül esik:</b> szabályos szerelésnél itt nem fut rejtett vezeték (a régi, szabálytalan szerelés miatt fúrás előtt ekkor is érdemes vezetékkeresővel ellenőrizni).");

}
document.querySelectorAll("input[type=range]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
