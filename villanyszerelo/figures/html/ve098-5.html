<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kondenzátoros motor – fázorábra</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="C">Kapacitás C</label><input id="C" type="range" min="5" max="120" step="1" value="37" aria-label="Kapacitás C"><output id="C_o" for="C"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Fázorábra: U vízszintes referencia, a főtekercs I_f árama késik, a segédág I_s árama a kondenzátor miatt siet; a csúszkával a kapacitás változtatható"></svg>
<p class="small">Szemléltető, képletből számolt helyettesítő modell, nem mért adat: főtekercs Z = 30 + j40 Ω, segédág 60 + j40 Ω sorban a kondenzátorral, U = 230 V, 50 Hz. A valós motor kondenzátorát mindig a gyártói adattábla szerint válaszd. A referencia (U) vízszintesen jobbra mutat.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"C":"µF"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const U=230,f=50,Rf=30,Xf=40,Rs=60,Xl=40, Xc=1/(2*Math.PI*f*v.C*1e-6);
const cdiv=(a,b)=>{const d=b[0]*b[0]+b[1]*b[1];return [(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d];};
const If=cdiv([U,0],[Rf,Xf]), Is=cdiv([U,0],[Rs,Xl-Xc]), I=[If[0]+Is[0],If[1]+Is[1]];
const ang=z=>Math.atan2(z[1],z[0])*180/Math.PI, mag=z=>Math.hypot(z[0],z[1]);
const th=ang(Is)-ang(If), M=mag(If)*mag(Is)*Math.sin(th*Math.PI/180);
const Is0=cdiv([U,0],[Rs,Xl-1/(2*Math.PI*f*37e-6)]), M0=mag(If)*mag(Is0)*Math.sin((ang(Is0)-ang(If))*Math.PI/180);
const L=css("--line"), ox=180, oy=200, k=26;
el("line",{x1:ox-90,y1:oy,x2:ox+250,y2:oy,stroke:L,"stroke-width":0.5,opacity:0.5});
el("line",{x1:ox,y1:oy+120,x2:ox,y2:oy-190,stroke:L,"stroke-width":0.5,opacity:0.5});
const arr=(z,col,dash,w,lab,dx,dy)=>{const x=ox+k*z[0],y=oy-k*z[1];
  el("line",{x1:ox,y1:oy,x2:x,y2:y,stroke:col,"stroke-width":w,"stroke-dasharray":dash||""});
  const a=Math.atan2(y-oy,x-ox),h=10;
  el("path",{d:`M${x} ${y}L${x-h*Math.cos(a-0.35)} ${y-h*Math.sin(a-0.35)}L${x-h*Math.cos(a+0.35)} ${y-h*Math.sin(a+0.35)}Z`,fill:col});
  const t=el("text",{x:x+dx,y:y+dy,"font-size":15,fill:col},lab[0]); if(lab[1]){const s=document.createElementNS(NS,"tspan");s.setAttribute("baseline-shift","sub");s.setAttribute("font-size","11");s.textContent=lab[1];t.appendChild(s);}};
arr([7.6,0],L,"",3,["U"],-6,-8);
arr(If,L,"",2,["I","f"],8,14);
arr(Is,css("--hl2")||"#c55a11","7 4",2,["I","s"],-28,-4);
arr(I,L,"2 3",2.4,["I"],8,-4);
const lim=M/M0;
let msg = v.C<25 ? "túl kicsi C: I<sub>s</sub> kicsi → gyenge indítónyomaték" : (v.C>55 ? "túl nagy C: I<sub>s</sub> nagy → a segédtekercs túlterhelt, melegszik" : "megfelelő C: az I<sub>s</sub> kb. 90°-kal siet az I<sub>f</sub>-hez képest → jó forgómező");
status("I<sub>f</sub> = "+fmt(mag(If),2)+" A ∠"+fmt(ang(If),0)+"°, I<sub>s</sub> = "+fmt(mag(Is),2)+" A ∠"+fmt(ang(Is),0)+"°, szög I<sub>f</sub>–I<sub>s</sub>: <b>"+fmt(th,0)+"°</b>, I = "+fmt(mag(I),2)+" A; nyomatékmutató (I<sub>f</sub>·I<sub>s</sub>·sin θ, a 37 µF-os esethez viszonyítva): <b>"+fmt(lim,2)+"</b>. "+msg);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
