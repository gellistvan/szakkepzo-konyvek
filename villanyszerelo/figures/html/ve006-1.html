<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az öt biztonsági szabály lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="okb" aria-pressed="true">Helyes sorrend</button> <button id="badb" aria-pressed="false">Hibás sorrend (mérés a zárolás előtt)</button><script>window.addEventListener("load",()=>{const OK=[{"q1": true, "lock": false, "meter": null, "pairs": false, "earth": false, "cover": false, "nums": [], "msg": "0. Kiinduló állapot: a Q1 zárva, a munkahely kapcsai (U, V, W, N) feszültség alatt vannak (vastag vonal, ~ jel). Ide még nem nyúlunk."}, {"q1": false, "lock": false, "meter": null, "pairs": false, "earth": false, "cover": false, "nums": [1], "msg": "1. Leválasztás: a Q1 4 pólusú leválasztó minden aktív vezetőt (L1, L2, L3, N) bont; a PE folytonos marad."}, {"q1": false, "lock": true, "meter": null, "pairs": false, "earth": false, "cover": false, "nums": [1, 2], "msg": "2. Visszakapcsolás elleni biztosítás: lakat a Q1 karján, rajta „Tilos kapcsolni! Dolgoznak” tábla a munkavégző nevével; a kulcs a munkavégzőnél."}, {"q1": false, "lock": true, "meter": "known", "pairs": false, "earth": false, "cover": false, "nums": [1, 2], "msg": "3a. A kétpólusú feszültségvizsgáló ellenőrzése ismert feszültségű ponton: kijelzi a feszültséget, tehát a műszer jó."}, {"q1": false, "lock": true, "meter": "work", "pairs": true, "earth": false, "cover": false, "nums": [1, 2, 3], "msg": "3b. Feszültségmentesség ellenőrzése a munkahelyen mind a 10 pontpáron (L1–L2 … N–PE): mindenhol 0 V."}, {"q1": false, "lock": true, "meter": "known", "pairs": true, "earth": false, "cover": false, "nums": [1, 2, 3], "msg": "3c. A műszer újra-ellenőrzése az ismert ponton: a mérés közben nem romlott el, a 0 V-os eredmények érvényesek."}, {"q1": false, "lock": true, "meter": null, "pairs": true, "earth": true, "cover": false, "nums": [1, 2, 3, 4], "msg": "4. Földelés és rövidre zárás (ha előírt): a zárlatbiztos földelő-rövidrezáró eszköz az L1, L2, L3, N kapcsokat egymással és a PE-vel köti össze."}, {"q1": false, "lock": true, "meter": null, "pairs": true, "earth": true, "cover": true, "nums": [1, 2, 3, 4, 5], "msg": "5. A szomszédos, feszültség alatt maradó Q2 leágazás letakarása szigetelő takaróval. Ezután kezdődhet a munka."}],BAD=[{"q1": true, "lock": false, "meter": null, "pairs": false, "earth": false, "cover": false, "nums": [], "msg": "HIBÁS SORREND – 0. Kiinduló állapot: a Q1 zárva, a munkahely feszültség alatt."}, {"q1": false, "lock": false, "meter": null, "pairs": false, "earth": false, "cover": false, "nums": [1], "msg": "HIBÁS SORREND – 1. Q1 nyit, de zárolás és tábla NINCS."}, {"q1": false, "lock": false, "meter": "work", "pairs": true, "earth": false, "cover": false, "nums": [1, 3], "msg": "HIBÁS SORREND – 3b. Mérés a zárolás előtt: most mindenhol 0 V …"}, {"q1": true, "lock": false, "meter": null, "pairs": "live", "earth": false, "cover": false, "nums": [1, 3], "msg": "HIBÁS SORREND – Valaki, aki nem tud a munkáról, visszakapcsolja a Q1-et! A kapcsok ismét feszültség alatt vannak: a korábbi 0 V-os mérés ÉRVÉNYTELEN."}, {"q1": true, "lock": false, "meter": null, "pairs": "live", "earth": false, "cover": false, "nums": [], "msg": "Tanulság: zárolás (2. szabály) nélkül a feszültségmentesség nem biztosított. A helyes sorrend: leválasztás → zárolás → ellenőrzés → földelés → letakarás."}];document.getElementById("okb").onclick=e=>{setSteps(OK);e.target.setAttribute("aria-pressed","true");document.getElementById("badb").setAttribute("aria-pressed","false");};document.getElementById("badb").onclick=e=>{setSteps(BAD);e.target.setAttribute("aria-pressed","true");document.getElementById("okb").setAttribute("aria-pressed","false");};});</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az öt biztonsági szabály lépésenként egy háromfázisú leágazáson: leválasztás, zárolás, mérés tíz pontpáron, földelés-rövidre zárás, a szomszédos ág letakarása."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető rajz (2.4): a Q1 4 pólusú leválasztó az L1, L2, L3 és N vezetőt bontja, a PE (zöld-sárga) folytonos. A földelés-rövidre zárás kisfeszültségen csak ha előírt; az eszköz keresztmetszete gyártói adat szerint ellenőrizendő.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"q1": true, "lock": false, "meter": null, "pairs": false, "earth": false, "cover": false, "nums": [], "msg": "0. Kiinduló állapot: a Q1 zárva, a munkahely kapcsai (U, V, W, N) feszültség alatt vannak (vastag vonal, ~ jel). Ide még nem nyúlunk."}, {"q1": false, "lock": false, "meter": null, "pairs": false, "earth": false, "cover": false, "nums": [1], "msg": "1. Leválasztás: a Q1 4 pólusú leválasztó minden aktív vezetőt (L1, L2, L3, N) bont; a PE folytonos marad."}, {"q1": false, "lock": true, "meter": null, "pairs": false, "earth": false, "cover": false, "nums": [1, 2], "msg": "2. Visszakapcsolás elleni biztosítás: lakat a Q1 karján, rajta „Tilos kapcsolni! Dolgoznak” tábla a munkavégző nevével; a kulcs a munkavégzőnél."}, {"q1": false, "lock": true, "meter": "known", "pairs": false, "earth": false, "cover": false, "nums": [1, 2], "msg": "3a. A kétpólusú feszültségvizsgáló ellenőrzése ismert feszültségű ponton: kijelzi a feszültséget, tehát a műszer jó."}, {"q1": false, "lock": true, "meter": "work", "pairs": true, "earth": false, "cover": false, "nums": [1, 2, 3], "msg": "3b. Feszültségmentesség ellenőrzése a munkahelyen mind a 10 pontpáron (L1–L2 … N–PE): mindenhol 0 V."}, {"q1": false, "lock": true, "meter": "known", "pairs": true, "earth": false, "cover": false, "nums": [1, 2, 3], "msg": "3c. A műszer újra-ellenőrzése az ismert ponton: a mérés közben nem romlott el, a 0 V-os eredmények érvényesek."}, {"q1": false, "lock": true, "meter": null, "pairs": true, "earth": true, "cover": false, "nums": [1, 2, 3, 4], "msg": "4. Földelés és rövidre zárás (ha előírt): a zárlatbiztos földelő-rövidrezáró eszköz az L1, L2, L3, N kapcsokat egymással és a PE-vel köti össze."}, {"q1": false, "lock": true, "meter": null, "pairs": true, "earth": true, "cover": true, "nums": [1, 2, 3, 4, 5], "msg": "5. A szomszédos, feszültség alatt maradó Q2 leágazás letakarása szigetelő takaróval. Ezután kezdődhet a munka."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox","0 0 720 330"); svg.innerHTML="";
  const BY={"L1": 30, "L2": 46, "L3": 62, "N": 78, "PE": 94}, F1={"L1": 120, "L2": 140, "L3": 160, "N": 180, "PE": 205}, F2={"L1": 420, "L2": 440, "L3": 460, "N": 480, "PE": 505}, QY0=125, QY1=165, TY=235, TERM={"L1": "U", "L2": "V", "L3": "W", "N": "N", "PE": "PE"}, PAIRS=["L1–L2", "L1–L3", "L1–N", "L1–PE", "L2–L3", "L2–N", "L2–PE", "L3–N", "L3–PE", "N–PE"];
  const ln=css("--line"), hl=css("--hl2");
  const L=(x0,y0,x1,y1,live)=>el("line",{x1:x0,y1:y0,x2:x1,y2:y1,stroke:live?hl:ln,"stroke-width":live?4:1.4,"stroke-dasharray":live?"":"5 4","stroke-linecap":"round"});
  const T=(x,y,t,o)=>el("text",Object.assign({x:x,y:y,"font-size":12,"text-anchor":"middle","dominant-baseline":"central"},o||{}),t);
  for(const c in BY){if(c==="PE"){el("line",{x1:30,y1:BY[c],x2:560,y2:BY[c],stroke:"#2e9d3a","stroke-width":3});el("line",{x1:30,y1:BY[c],x2:560,y2:BY[c],stroke:"#f2d600","stroke-width":3,"stroke-dasharray":"6 6"});}
    else L(30,BY[c],560,BY[c],true);T(18,BY[c],c,{"font-weight":"bold"});}
  T(10,322,"vastag színes + ~ : feszültség alatt · szaggatott: feszültségmentes · zöld-sárga: PE (a Q1 nem bontja)",{"font-size":11,"text-anchor":"start"});
  const work = s.q1;   // a munkahely kapcsai feszültség alatt?
  [[F1,"Q1",s.q1],[F2,"Q2",true]].forEach(([F,name,closed])=>{
    for(const c in F){const x=F[c];el("circle",{cx:x,cy:BY[c],r:3,fill:ln});
      if(c==="PE"){L(x,BY[c],x,TY,false);el("line",{x1:x,y1:BY[c],x2:x,y2:TY,stroke:"#2e9d3a","stroke-width":3});el("line",{x1:x,y1:BY[c],x2:x,y2:TY,stroke:"#f2d600","stroke-width":3,"stroke-dasharray":"6 6"});}
      else{L(x,BY[c],x,QY0,true);
        if(closed)L(x,QY0,x,QY1,true);else el("line",{x1:x,y1:QY1,x2:x+14,y2:QY0+5,stroke:ln,"stroke-width":2});
        const lv=closed; L(x,QY1,x,TY,lv); if(lv)T(x+9,(QY1+TY)/2,"~",{"font-size":14,fill:hl});}
      el("circle",{cx:x,cy:TY,r:6,fill:css("--bg"),stroke:ln,"stroke-width":1.6});T(name==="Q1"?x+7:x,name==="Q1"?TY+18:TY+27,TERM[c],name==="Q1"?{"font-size":10,"text-anchor":"start"}:{"font-size":11});}
    const x0=F.L1-14,x1=F.N+22;el("rect",{x:x0,y:QY0-9,width:x1-x0,height:QY1-QY0+18,fill:"none",stroke:ln,"stroke-dasharray":"2 3"});
    T(x0-8,(QY0+QY1)/2,name+(name==="Q1"?" 4P":""),{"text-anchor":"end","font-weight":"bold"});});
  T(165,298,"munkahely",{"font-size":12});T(462,298,"szomszédos leágazás",{"font-size":12});
  if(s.lock){el("rect",{x:212,y:132,width:18,height:15,fill:css("--cellhl"),stroke:ln,"stroke-width":1.5});
    el("path",{d:"M215,132 a6,7 0 0 1 12,0",fill:"none",stroke:ln,"stroke-width":2});
    el("line",{x1:224,y1:147,x2:245,y2:178,stroke:ln,"stroke-width":1.2});el("rect",{x:232,y:178,width:150,height:38,fill:css("--bg"),stroke:css("--bad")||"#b71c1c","stroke-width":2});
    T(307,190,"TILOS KAPCSOLNI!",{"font-size":11,"font-weight":"bold"});T(307,205,"Dolgoznak – név, dátum",{"font-size":10});}
  if(s.meter==="known"){el("circle",{cx:300,cy:255,r:16,fill:css("--bg"),stroke:ln,"stroke-width":2});T(300,255,"V",{"font-weight":"bold"});
    T(300,282,"ismert ponton: ✓ jelez",{"font-size":11});}
  if(s.meter==="work"){el("circle",{cx:260,cy:260,r:16,fill:css("--bg"),stroke:ln,"stroke-width":2});T(260,260,"V",{"font-weight":"bold"});
    el("line",{x1:246,y1:258,x2:F1.N+6,y2:TY-4,stroke:ln,"stroke-dasharray":"2 2"});}
  if(s.pairs){const live=s.pairs==="live";T(640,70,"10 pontpár a munkahelyen",{"font-size":11,"font-weight":"bold"});
    PAIRS.forEach((p,i)=>{const v=live?(p.includes("PE")||p.includes("N")?(p==="N–PE"?"≈ 0 V":"230 V"):"400 V"):"0 V";
      T(600,88+i*15,p,{"font-size":11,"text-anchor":"start"});T(700,88+i*15,v,{"font-size":11,"text-anchor":"end",fill:live&&v!=="≈ 0 V"?(css("--bad")||"#b71c1c"):css("--fg")});});
    if(live)T(640,245,"a mérés érvénytelen!",{"font-size":12,"font-weight":"bold",fill:"#b71c1c"});}
  if(s.earth){const y=TY+32;el("line",{x1:F1.L1,y1:y,x2:F1.PE,y2:y,stroke:ln,"stroke-width":3});
    for(const c in F1)el("line",{x1:F1[c],y1:TY+6,x2:F1[c],y2:y,stroke:ln,"stroke-width":1.6});
    el("line",{x1:F1.PE,y1:y,x2:F1.PE,y2:y+12,stroke:ln,"stroke-width":1.6});[12,8,4].forEach((w,i)=>el("line",{x1:F1.PE-w,y1:y+12+4*i,x2:F1.PE+w,y2:y+12+4*i,stroke:ln,"stroke-width":1.6}));}
  if(s.cover){const x0=F2.L1-20,w=F2.PE-F2.L1+40;el("rect",{x:x0,y:QY1+8,width:w,height:TY-QY1+8,fill:css("--cellhl"),stroke:ln,"stroke-width":2,opacity:.92});
    for(let k=0;k<w+60;k+=10)el("line",{x1:x0+Math.max(0,k-(TY-QY1+8)),y1:QY1+8+Math.min(k,TY-QY1+8),x2:x0+Math.min(k,w),y2:QY1+8+Math.max(0,k-w),stroke:ln,"stroke-width":.6,opacity:.6});
    T(x0+w/2,(QY1+TY)/2+10,"szigetelő takaró",{"font-size":12,"font-weight":"bold"});}
  const pos={1:[40,145],2:[250,110],3:[96,215],4:[232,TY+32],5:[F2.PE+34,(QY1+TY)/2+10]};
  (s.nums||[]).forEach(n=>{const p=pos[n];el("circle",{cx:p[0],cy:p[1],r:10,fill:ln});T(p[0],p[1],String(n),{fill:css("--bg"),"font-weight":"bold"});});
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
