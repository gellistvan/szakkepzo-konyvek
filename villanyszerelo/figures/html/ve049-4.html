<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keresd meg a hibákat – lakáselosztó</title><style>:root{--fg:#111;--bg:#fff;--muted:#555;--btn:#e8eefc;--btnb:#1f4e79;--hl:#d32f2f}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--btn:#26324a;--btnb:#8fb8e8;--hl:#ff6e6e}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px}
button{font:inherit;padding:5px 12px;border:1.5px solid var(--btnb);background:var(--btn);color:var(--fg);border-radius:6px;cursor:pointer}
button[aria-pressed=true]{background:var(--btnb);color:var(--bg)}
button:focus-visible{outline:3px solid var(--btnb);outline-offset:2px}
label.chk{display:inline-flex;gap:5px;align-items:center;cursor:pointer;margin-right:8px}
.card{background:#fff;border-radius:8px;padding:6px;color:#111}
.card svg{width:100%;height:auto;display:block;max-height:78vh}
#status{margin:6px 0;min-height:2.6em}
.parts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.parts button{font-size:12.5px;padding:3px 8px}
.small{font-size:12px;color:var(--muted)}
svg .hl path,svg .hl line,svg .hl polyline,svg .hl ellipse,svg .hl circle,svg .hl rect{stroke:#d32f2f!important;stroke-width:2.6px!important}
svg .hl text{fill:#d32f2f!important;font-weight:bold}
svg .hl{filter:drop-shadow(0 0 2px rgba(211,47,47,.7))}
svg .off{display:none}
.pulse{animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
#fig{cursor:crosshair} .mk{fill:none;stroke:#d32f2f;stroke-width:3} .mt{fill:#d32f2f;font:bold 15px system-ui}
#list li{margin:3px 0}</style></head><body>

<p class="small">Sematikus rajz; a színek: barna = fázis, kék = N, zöld-sárga = PE. A megoldókulcs a könyv szövegében.</p>
<script>
const H=[{"n": 1, "x": 4.2, "y": 2.05, "name": "A két FI-csoport N-vezetője ugyanarra az N-sínre (N1) fut", "risk": "a két FI N-árama keveredik: terheléskor a FI-k tévesen kioldanak, az N2-sín táplálatlan, így a Q3 csoport körei N nélkül maradnak", "fix": "a Q3 N-kimenetét az N2-sínre kötni; minden FI-csoportnak saját N-sín"}, {"n": 2, "x": 6.85, "y": 7.7, "name": "Sodrott ér érvéghüvely nélkül, szétálló szálakkal (F2)", "risk": "egyes szálak kimaradnak a kapocsból: laza kötés, melegedés; a kiálló szál zárlatot okozhat", "fix": "érvéghüvely (megfelelő méret, préselve), húzópróba"}, {"n": 3, "x": 7.75, "y": 7.6, "name": "Túl hosszú csupaszolás – csupasz réz a kapcson kívül (F3)", "risk": "érinthető, feszültség alatti rész; zárlatveszély a szomszédos vezetővel", "fix": "a vezetőt visszavágni, a csupaszolási sablon szerint újracsupaszolni"}, {"n": 4, "x": 4.85, "y": 3.75, "name": "Szigetelés a kapocs alá szorítva (F6)", "risk": "a kötés elsőre tart, de terhelés alatt a műanyag enged: lazulás, melegedés, égés", "fix": "kioldani, helyes hosszon csupaszolni, újrakötni, nyomatékkal meghúzni"}, {"n": 5, "x": 8.65, "y": 7.3, "name": "Zöld-sárga ér fázisvezetőként a kismegszakító kimenetén (F4)", "risk": "a zöld-sárga ér kizárólag védővezető lehet: életveszélyes tévedés a következő szerelőnél", "fix": "a vezetéket megfelelő színű (barna/fekete/szürke) érre cserélni"}, {"n": 6, "x": 5.75, "y": 3.45, "name": "Kék ér fázisvezetőként jelölés nélkül (F7)", "risk": "a kéket N-nek gondolják: feszültség alatti vezető „nullaként” kezelve", "fix": "barna érre cserélni (ha kék ér fázisként elkerülhetetlen, mindkét végén barna jelöléssel)"}, {"n": 7, "x": 3.95, "y": 3.45, "name": "1,5 mm²-es vezeték a B16-os kismegszakítón (F5, „aljzatkör”)", "risk": "a 16 A-es védelem nem védi az 1,5 mm²-es vezetéket túlterhelés ellen: melegedés", "fix": "2,5 mm²-es vezeték, vagy a védelmet a vezetékhez igazítani (ellenőrizendő: terhelhetőség, szerelési mód)"}, {"n": 8, "x": 7.55, "y": 4.8, "name": "Hiányzó takarólap üres modulhelyen", "risk": "a burkolat nyílásán át feszültség alatti rész (sín) érinthető", "fix": "takarólapot (vakmodult) behelyezni"}, {"n": 9, "x": 6.2, "y": 6.14, "name": "Hiányzó felirat két kismegszakítón (F7, F8)", "risk": "hibánál nem azonosítható a kör: rossz kör kapcsolható le, vagy a teljes elosztó", "fix": "feliratcsík a rajz szerint (jel + rendeltetés), áramkörjegyzék az ajtón"}, {"n": 10, "x": 12.9, "y": 2.05, "name": "PE-sín egy kapcsában három vezető, egy laza és kiálló", "risk": "a PE-folytonosság megszakadhat: hibánál a fém testek feszültség alá kerülnek", "fix": "kapcsonként a gyártó által engedett számú vezető, mindegyik meghúzva; PE-folytonosság mérése"}], XL=[0.0,16.0], YL=[0.0,13.0];
const svg=document.getElementById("fig"), ST=document.getElementById("status"), found=new Set();
const NS="http://www.w3.org/2000/svg";
let ax=null;
function axBox(){ /* az axes téglalapja az SVG-ben: a matplotlib 'patch_1' utáni első axes-hátteret keressük */
  const g=document.getElementById("axframe"); return g.getBBox(); }
function toData(evt){const pt=svg.createSVGPoint();pt.x=evt.clientX;pt.y=evt.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const b=ax; return [XL[0]+(p.x-b.x)/b.width*(XL[1]-XL[0]), YL[1]-(p.y-b.y)/b.height*(YL[1]-YL[0])];}
function toSvg(x,y){const b=ax;return [b.x+(x-XL[0])/(XL[1]-XL[0])*b.width, b.y+(YL[1]-y)/(YL[1]-YL[0])*b.height];}
function mark(h){if(found.has(h.n))return;found.add(h.n);const [sx,sy]=toSvg(h.x,h.y),r=0.45/(XL[1]-XL[0])*ax.width;
  const c=document.createElementNS(NS,"circle");c.setAttribute("cx",sx);c.setAttribute("cy",sy);c.setAttribute("r",r);c.setAttribute("class","mk");svg.appendChild(c);
  const t=document.createElementNS(NS,"text");t.setAttribute("x",sx+r);t.setAttribute("y",sy-r);t.setAttribute("class","mt");t.textContent=h.n;svg.appendChild(t);
  document.getElementById("cnt").textContent=found.size+"/10 megtalálva";
  const li=document.getElementById("h"+h.n);li.innerHTML="<b>"+h.n+". "+h.name+"</b> – kockázat: "+h.risk+"; javítás: "+h.fix;}
function say(h){ST.innerHTML="<b>"+h.n+". "+h.name+".</b> Kockázat: "+h.risk+". Javítás: "+h.fix+".";}
function init(){ax=axBox();const L=document.getElementById("list");L.innerHTML="";
  H.forEach(h=>{const li=document.createElement("li");li.id="h"+h.n;li.tabIndex=0;li.textContent="?";L.appendChild(li);
    li.addEventListener("keydown",e=>{if(e.key==="Enter"){mark(h);say(h);}});});}
svg.addEventListener("click",e=>{const [x,y]=toData(e);let best=null,bd=1e9;
  H.forEach(h=>{const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h;}});
  if(bd<0.7){mark(best);say(best);} else ST.textContent="Itt nem látok hibát – nézd meg közelebbről a kötéseket, a színeket, a feliratokat és a takarást.";});
document.getElementById("all").onclick=()=>{H.forEach(mark);ST.textContent="Mind a 10 hiba jelölve; a részleteket a lista mutatja.";};
document.getElementById("rst").onclick=()=>{found.clear();svg.querySelectorAll(".mk,.mt").forEach(e=>e.remove());init();
  document.getElementById("cnt").textContent="0/10 megtalálva";ST.textContent="Kattints a képre.";};
init();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
