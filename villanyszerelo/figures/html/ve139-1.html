<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RC aluláteresztő szűrő frekvenciamenete</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="R">Ellenállás R</label><input id="R" type="range" min="0.1" max="100" step="0.1" value="1.5" aria-label="Ellenállás R"><output id="R_o" for="R"></output></div>
<div class="row"><label for="C">Kapacitás C</label><input id="C" type="range" min="10" max="1000" step="10" value="100" aria-label="Kapacitás C"><output id="C_o" for="C"></output></div>
<div class="row"><label for="lf">Vizsgált frekvencia: log₁₀(f/Hz)</label><input id="lf" type="range" min="1" max="5" step="0.05" value="3" aria-label="Vizsgált frekvencia: log₁₀(f/Hz)"><output id="lf_o" for="lf"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 400" role="img" aria-label="Az RC aluláteresztő szűrő erősítése decibelben és fázisa a frekvencia függvényében, a törésponti frekvenciával"></svg>
<p class="small">Az RC aluláteresztő szűrő: |Au| = 1/√(1+(f/fc)²), fázis = −arctan(f/fc), fc = 1/(2πRC); fc-nél −3 dB és −45°. Szemléltető, számított görbék; terheletlen szűrő.</p>
<script>
const NS="http://www.w3.org/2000/svg", S=document.getElementById("v"), ST=document.getElementById("status");
const UN={"R":"kΩ", "C":"nF", "lf":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;S.appendChild(e);return e;}
function status(h){ST.innerHTML=h;}
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});return v;}
function draw(){S.innerHTML="";const v=values();

const fc=1/(2*Math.PI*v.R*1e3*v.C*1e-9), fx=Math.pow(10,v.lf);
const mag=f=>-10*Math.log10(1+(f/fc)*(f/fc)), ph=f=>-Math.atan(f/fc)*180/Math.PI;
const X0=60,X1=540,sx=f=>X0+(X1-X0)*(Math.log10(f)-1)/4;
const A0=24,A1=200,sa=d=>A0+(A1-A0)*(3-d)/63, B0=250,B1=350,sb=p=>B0+(B1-B0)*(-p)/90;
for(let k=1;k<=5;k++){const f=Math.pow(10,k);el("line",{x1:sx(f),x2:sx(f),y1:A0,y2:B1,stroke:css("--grid"),"stroke-width":1});el("text",{x:sx(f),y:B1+16,"text-anchor":"middle","font-size":12},f>=1000?fmt(f/1000,0)+" k":fmt(f,0));}
el("text",{x:(X0+X1)/2,y:B1+34,"text-anchor":"middle","font-size":12},"frekvencia (Hz)");
[0,-20,-40,-60].forEach(d=>{el("line",{x1:X0,x2:X1,y1:sa(d),y2:sa(d),stroke:css("--grid"),"stroke-width":1});el("text",{x:X0-6,y:sa(d)+4,"text-anchor":"end","font-size":12},(d+"").replace("-","−"));});
[0,-45,-90].forEach(p=>{el("line",{x1:X0,x2:X1,y1:sb(p),y2:sb(p),stroke:css("--grid"),"stroke-width":1});el("text",{x:X0-6,y:sb(p)+4,"text-anchor":"end","font-size":12},(p+"°").replace("-","−"));});
el("text",{x:10,y:(A0+A1)/2,"text-anchor":"middle","font-size":12,transform:"rotate(-90 10 "+((A0+A1)/2)+")"},"|Au| (dB)");
el("text",{x:10,y:(B0+B1)/2,"text-anchor":"middle","font-size":12,transform:"rotate(-90 10 "+((B0+B1)/2)+")"},"fázis");
let p1=[],p2=[];for(let n=0;n<=200;n++){const f=Math.pow(10,1+4*n/200);p1.push(sx(f)+","+Math.max(sa(mag(f)),A0));p2.push(sx(f)+","+sb(ph(f)));}
el("polyline",{points:p1.join(" "),fill:"none",stroke:css("--hl2"),"stroke-width":2.8});
el("polyline",{points:p2.join(" "),fill:"none",stroke:css("--hl2"),"stroke-width":2.8,"stroke-dasharray":"8 4"});
if(fc>=10&&fc<=1e5){el("line",{x1:sx(fc),x2:sx(fc),y1:A0,y2:B1,stroke:css("--hl"),"stroke-width":1.6,"stroke-dasharray":"6 4"});
 el("circle",{cx:sx(fc),cy:sa(-3.0103),r:5.5,fill:css("--bg"),stroke:css("--hl"),"stroke-width":2.4});
 el("circle",{cx:sx(fc),cy:sb(-45),r:5.5,fill:css("--bg"),stroke:css("--hl"),"stroke-width":2.4});
 el("text",{x:sx(fc)+(sx(fc)>400?-8:8),y:A0+14,"text-anchor":sx(fc)>400?"end":"start","font-size":12,fill:css("--hl")},"fc = "+fmt(fc,0)+" Hz");}
el("line",{x1:sx(fx),x2:sx(fx),y1:A0,y2:B1,stroke:css("--fg"),"stroke-width":1.2,"stroke-dasharray":"2 3"});
el("circle",{cx:sx(fx),cy:Math.max(sa(mag(fx)),A0),r:5,fill:css("--fg")});el("circle",{cx:sx(fx),cy:sb(ph(fx)),r:5,fill:css("--fg")});
status("R = "+fmt(v.R,1)+" kΩ, C = "+fmt(v.C,0)+" nF → <b>f<sub>c</sub> = 1/(2πRC) = "+fmt(fc,fc<100?1:0)+" Hz</b>. "+
 "f = "+fmt(fx,fx<100?1:0)+" Hz-nél: |A<sub>u</sub>| = "+fmt(1/Math.sqrt(1+(fx/fc)*(fx/fc)),3)+" ("+fmt(mag(fx),1).replace("-","−")+" dB), fázis = "+fmt(ph(fx),1).replace("-","−")+"°. "+
 (fx<=fc?"A jel a sávban van (a törésponti frekvencia alatt).":"A jelet a szűrő csillapítja (a törésponti frekvencia fölött)."));

}
document.querySelectorAll("input[type=range]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
