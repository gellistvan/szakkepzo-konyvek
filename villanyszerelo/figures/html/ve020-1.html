<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fázorösszeadó</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="A1">Û₁ csúcsérték</label><input id="A1" type="range" min="0" max="200" step="1" value="100" aria-label="Û₁ csúcsérték"><output id="A1_o" for="A1"></output></div>
<div class="row"><label for="F1">φ₁ fázisszög</label><input id="F1" type="range" min="-180" max="180" step="1" value="0" aria-label="φ₁ fázisszög"><output id="F1_o" for="F1"></output></div>
<div class="row"><label for="A2">Û₂ csúcsérték</label><input id="A2" type="range" min="0" max="200" step="1" value="60" aria-label="Û₂ csúcsérték"><output id="A2_o" for="A2"></output></div>
<div class="row"><label for="F2">φ₂ fázisszög</label><input id="F2" type="range" min="-180" max="180" step="1" value="30" aria-label="φ₂ fázisszög"><output id="F2_o" for="F2"></output></div>
<div class="row"><label for="w">pillanat ωt</label><input id="w" type="range" min="0" max="359" step="1" value="45" aria-label="pillanat ωt"><output id="w_o" for="w"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 300" role="img" aria-label="Két forgó fázor és összegük, mellette a megfelelő szinuszos időfüggvények"></svg>
<p class="small">Szemléltetés (6.1): u(t) = Û·sin(ωt + φ), a pillanatérték a forgó fázor függőleges vetülete. Alap: 100 V, 0° és 60 V, 30° → 154,9 V, 11,2°. U₁ kék folytonos, U₂ narancs szaggatott, az eredő vastag. Számolt görbék.</p>
<script>
const NS="http://www.w3.org/2000/svg", S=document.getElementById("v"), ST=document.getElementById("status");
const UN={"A1":"V", "F1":"°", "A2":"V", "F2":"°", "w":"°"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;S.appendChild(e);return e;}
function status(h){ST.innerHTML=h;}
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});return v;}
function draw(){S.innerHTML="";const v=values();

if(!window.__ui){window.__ui=1;const bar=document.createElement("div");bar.style.margin="6px 0";
 const mk=(t,f)=>{const b=document.createElement("button");b.textContent=t;b.style.marginRight="8px";b.onclick=()=>f(b);bar.appendChild(b);return b;};
 let tm=null;mk("▶ Lejátszás",b=>{if(tm){clearInterval(tm);tm=null;b.textContent="▶ Lejátszás";}else{tm=setInterval(()=>{const w=document.getElementById("w");w.value=(+w.value+3)%360;draw();},60);b.textContent="⏸ Szünet";}});
 const setF2=d=>{const f1=+document.getElementById("F1").value;let f=f1+d;while(f>180)f-=360;document.getElementById("F2").value=f;draw();};
 mk("φ₂ = φ₁ (fázisban)",()=>setF2(0));mk("φ₂ = φ₁ + 90°",()=>setF2(90));mk("φ₂ = φ₁ + 180°",()=>setF2(180));
 document.body.insertBefore(bar,document.getElementById("status"));}
const r=Math.PI/180, ux=v.A1*Math.cos(v.F1*r)+v.A2*Math.cos(v.F2*r), uy=v.A1*Math.sin(v.F1*r)+v.A2*Math.sin(v.F2*r);
const A=Math.hypot(ux,uy), ph=Math.atan2(uy,ux)/r, M=Math.max(200,A)*1.05;
const cx=140,cy=150,R=120,k=R/M, X0=300,X1=570, Yc=150, H=120;
el("circle",{cx:cx,cy:cy,r:A*k,fill:"none",stroke:css("--grid"),"stroke-dasharray":"3 3"});
el("line",{x1:cx-R,y1:cy,x2:cx+R,y2:cy,stroke:css("--grid")});el("line",{x1:cx,y1:cy-R,x2:cx,y2:cy+R,stroke:css("--grid")});
el("line",{x1:X0,y1:Yc,x2:X1,y2:Yc,stroke:css("--grid")});
[0,90,180,270,360].forEach(d=>el("text",{x:X0+(X1-X0)*d/360,y:Yc+H+18,"text-anchor":"middle","font-size":11},d+"°"));
const set=[[v.A1,v.F1,css("--hl"),"","U₁"],[v.A2,v.F2,css("--hl2"),"6 4","U₂"],[A,ph,css("--line"),"","U"]];
set.forEach(([a,f,c,da,lab],i)=>{const ang=(f+v.w)*r, x=cx+a*k*Math.cos(ang), y=cy-a*k*Math.sin(ang);
 el("line",{x1:cx,y1:cy,x2:x,y2:y,stroke:c,"stroke-width":i==2?4:2.5,"stroke-dasharray":da});el("circle",{cx:x,cy:y,r:3.5,fill:c});
 el("text",{x:x+15*Math.cos(ang),y:y-15*Math.sin(ang)+4,"text-anchor":"middle","font-size":12,fill:c},lab);
 let d="";for(let q=0;q<=180;q++){const t=q*2;d+=(q?"L":"M")+(X0+(X1-X0)*t/360)+" "+(Yc-a*k*Math.sin((t+f)*r));}
 el("path",{d:d,fill:"none",stroke:c,"stroke-width":i==2?3.2:2,"stroke-dasharray":da});
 const px=X0+(X1-X0)*v.w/360;el("line",{x1:x,y1:y,x2:px,y2:y,stroke:c,"stroke-dasharray":"1 4"});el("circle",{cx:px,cy:y,r:4,fill:c});});
el("line",{x1:X0+(X1-X0)*v.w/360,y1:Yc-H,x2:X0+(X1-X0)*v.w/360,y2:Yc+H,stroke:css("--muted"),"stroke-dasharray":"2 3"});
const u=A*Math.sin((v.w+ph)*r);
status("Eredő: Û = √(Uₓ² + U_y²) = <b>"+fmt(A,1)+" V</b>, φ = <b>"+fmt(ph,1)+"°</b> (Uₓ = "+fmt(ux,2)+" V, U_y = "+fmt(uy,2)+" V). Pillanatérték ωt = "+fmt(v.w,0)+"°-nál: u = "+fmt(u,1)+" V. Skalár összeg (hibás): "+fmt(v.A1+v.A2,0)+" V.");

}
document.querySelectorAll("input[type=range]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
