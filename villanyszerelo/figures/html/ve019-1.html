<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL-tag bekapcsolási áramgörbéi</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="U">Feszültség U</label><input id="U" type="range" min="1" max="48" step="1" value="24" aria-label="Feszültség U"><output id="U_o" for="U"></output></div>
<div class="row"><label for="R">Ellenállás R</label><input id="R" type="range" min="10" max="500" step="5" value="100" aria-label="Ellenállás R"><output id="R_o" for="R"></output></div>
<div class="row"><label for="L">Induktivitás L</label><input id="L" type="range" min="0.1" max="5" step="0.1" value="2" aria-label="Induktivitás L"><output id="L_o" for="L"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az RL-tag bekapcsolási árama és a tekercs feszültsége az idő függvényében, az 1, 2 és 3 időállandó jelölésével"></svg>
<p class="small">Szemléltetés (5.4): i(t) = (U/R)(1 − e^(−t/τ)), u_L = U·e^(−t/τ). Alap: 24 V, 100 Ω, 2 H → τ = 20 ms, I∞ = 0,24 A. Számolt görbék; R a teljes soros ellenállás (a tekercs saját ellenállásával együtt), a vasmag telítése nincs figyelembe véve.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"U":"V", "R":"Ω", "L":"H"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const tau=v.L/v.R, Ii=v.U/v.R, T=5.5*tau, x0=60,x1=530,y0=250,y1=20, X=t=>x0+(x1-x0)*t/T, Y=f=>y0-(y0-y1)*f/1.05;
el("line",{x1:x0,y1:y0,x2:x1,y2:y0,stroke:css("--line")});el("line",{x1:x0,y1:y0,x2:x0,y2:y1,stroke:css("--line")});
for(let k=0;k<=5;k++){el("line",{x1:X(k*tau),y1:y0,x2:X(k*tau),y2:y0+4,stroke:css("--line")});el("text",{x:X(k*tau),y:y0+16,"text-anchor":"middle","font-size":11},k+"τ");}
el("text",{x:(x0+x1)/2,y:y0+34,"text-anchor":"middle","font-size":12},"t (τ = "+fmt(tau*1000,1)+" ms)");
[0,0.5,1].forEach(f=>{el("line",{x1:x0-4,y1:Y(f),x2:x1,y2:Y(f),stroke:css("--grid")});el("text",{x:x0-8,y:Y(f)+4,"text-anchor":"end","font-size":11},fmt(f*100,0)+" %");});
let di="",du="";for(let k=0;k<=200;k++){const t=T*k/200;di+=(k?"L":"M")+X(t)+" "+Y(1-Math.exp(-t/tau));du+=(k?"L":"M")+X(t)+" "+Y(Math.exp(-t/tau));}
el("path",{d:di,fill:"none",stroke:css("--hl2"),"stroke-width":3});el("path",{d:du,fill:"none",stroke:css("--hl"),"stroke-width":2.5,"stroke-dasharray":"7 4"});
[1,2,3].forEach(k=>{const f=1-Math.exp(-k);el("circle",{cx:X(k*tau),cy:Y(f),r:5,fill:css("--hl2"),stroke:css("--line")});el("text",{x:X(k*tau)+6,y:Y(f)+16,"font-size":11},fmt(f*100,1)+" %");});
el("text",{x:x1,y:Y(0.55),"text-anchor":"end","font-size":12,fill:css("--hl2")},"— i / I∞ (folytonos)");el("text",{x:x1,y:Y(0.55)+16,"text-anchor":"end","font-size":12,fill:css("--hl")},"- - u_L / U (szaggatott)");
status("τ = L/R = <b>"+fmt(tau*1000,1)+" ms</b>; I<sub>∞</sub> = U/R = <b>"+fmt(Ii,3)+" A</b>. τ-nál i = "+fmt(Ii*0.632,3)+" A (63,2 %), 3τ-nál "+fmt(Ii*(1-Math.exp(-3)),3)+" A (95,0 %); 5τ után ≈ állandósult (99,3 %). Induláskor u<sub>L</sub> = U = "+fmt(v.U,0)+" V.");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
