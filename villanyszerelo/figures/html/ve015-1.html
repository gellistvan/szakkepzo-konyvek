<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valódi feszültségforrás terhelési görbéi</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="E">Üresjárási fesz. E</label><input id="E" type="range" min="1" max="48" step="0.1" value="9" aria-label="Üresjárási fesz. E"><output id="E_o" for="E"></output></div>
<div class="row"><label for="Rb">Belső ellenállás Rb</label><input id="Rb" type="range" min="0.01" max="10" step="0.01" value="2" aria-label="Belső ellenállás Rb"><output id="Rb_o" for="Rb"></output></div>
<div class="row"><label for="Rt">Terhelés Rt</label><input id="Rt" type="range" min="0.01" max="30" step="0.01" value="2" aria-label="Terhelés Rt"><output id="Rt_o" for="Rt"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="A kapocsfeszültség, az áram és a terhelés teljesítménye a terhelő ellenállás függvényében, a maximális teljesítmény jelölésével"></svg>
<p class="small">Szemléltetés (4.5): E, Rb tanulási példa értékek (alap: a fejezet 9 V / 2 Ω elemes példája); valós akkumulátor belső ellenállása és zárlati árama gyártói adatlapból ellenőrizendő. Számolt görbék, nem mérések.</p>
<script>
const NS="http://www.w3.org/2000/svg", S=document.getElementById("v"), ST=document.getElementById("status");
const UN={"E":"V", "Rb":"Ω", "Rt":"Ω"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;S.appendChild(e);return e;}
function status(h){ST.innerHTML=h;}
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});return v;}
function draw(){S.innerHTML="";const v=values();

const I=v.E/(v.Rb+v.Rt), Uk=v.E-I*v.Rb, Pt=I*I*v.Rt, Pb=I*I*v.Rb, Pm=v.E*v.E/(4*v.Rb), Ik=v.E/v.Rb, eta=v.Rt/(v.Rb+v.Rt);
const x0=60,x1=530,y0=250,y1=44,xm=Math.max(30,3*v.Rb), X=r=>x0+(x1-x0)*Math.min(r,xm)/xm;
const Yp=p=>y0-(y0-y1)*p/(Pm*1.1), Yu=u=>y0-(y0-y1)*u/(v.E*1.05);
el("line",{x1:x0,y1:y0,x2:x1,y2:y0,stroke:css("--line")});el("line",{x1:x0,y1:y0,x2:x0,y2:y1,stroke:css("--line")});
// „kerek” osztásköz (1, 2, 5, 10 …), hogy a tengelyfeliratok ne legyenek kerekített törtek (pl. 22,5 → „23”)
const st=[1,2,5,10,20,50,100].find(s=>xm/s<=6)||200;
for(let r=0;r<=xm+1e-9;r+=st){el("line",{x1:X(r),y1:y0,x2:X(r),y2:y0+4,stroke:css("--line")});el("text",{x:X(r),y:y0+16,"text-anchor":"middle","font-size":11},fmt(r,0));}
el("text",{x:(x0+x1)/2,y:y0+34,"text-anchor":"middle","font-size":12},"Rt (Ω)");
el("text",{x:x0,y:12,"font-size":11,fill:css("--hl2")},"Pt (W), max: "+fmt(Pm,2));el("text",{x:x0+110,y:12,"font-size":11,fill:css("--hl")},"Uk (V), max: "+fmt(v.E,1));el("text",{x:x0+220,y:12,"font-size":11,fill:css("--line")},"I (A, pontozott), max: Ik = "+fmt(Ik,2));
const Yi=i=>y0-(y0-y1)*i/(Ik*1.05);
let dp="",du="",di="";for(let i=0;i<=200;i++){const r=xm*i/200+1e-6,Ii=v.E/(v.Rb+r);dp+=(i?"L":"M")+X(r)+" "+Yp(Ii*Ii*r);du+=(i?"L":"M")+X(r)+" "+Yu(v.E-Ii*v.Rb);di+=(i?"L":"M")+X(r)+" "+Yi(Ii);}
el("path",{d:di,fill:"none",stroke:css("--line"),"stroke-width":2,"stroke-dasharray":"2 4"});
el("path",{d:dp,fill:"none",stroke:css("--hl2"),"stroke-width":2.5});el("path",{d:du,fill:"none",stroke:css("--hl"),"stroke-width":2.5,"stroke-dasharray":"7 4"});
el("line",{x1:X(v.Rb),y1:y0,x2:X(v.Rb),y2:y1,stroke:css("--muted"),"stroke-dasharray":"2 4"});el("text",{x:X(v.Rb)+4,y:y1+12,"font-size":11,fill:css("--muted")},"Rt = Rb");
el("circle",{cx:X(v.Rt),cy:Yp(Pt),r:6,fill:css("--hl2"),stroke:css("--line")});el("circle",{cx:X(v.Rt),cy:Yu(Uk),r:6,fill:css("--bg"),stroke:css("--hl"),"stroke-width":2});
status("I = <b>"+fmt(I,3)+" A</b>, U<sub>k</sub> = <b>"+fmt(Uk)+" V</b>, P<sub>t</sub> = <b>"+fmt(Pt)+" W</b>, belső veszteség P<sub>b</sub> = "+fmt(Pb)+" W, η = "+fmt(eta*100,1)+" %. P<sub>max</sub> = E²/(4R<sub>b</sub>) = <b>"+fmt(Pm)+" W</b> (R<sub>t</sub> = R<sub>b</sub>-nél, η = 50 %); zárlati áram I<sub>k</sub> = E/R<sub>b</sub> = "+fmt(Ik,1)+" A.");

}
document.querySelectorAll("input[type=range]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
