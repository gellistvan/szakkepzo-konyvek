<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Munkapont a kimeneti jelleggörbén</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="IB">Bázisáram I_B</label><input id="IB" type="range" min="0" max="3" step="0.05" value="0.4" aria-label="Bázisáram I_B"><output id="IB_o" for="IB"></output></div>
<div class="row"><label for="RC">Tekercsellenállás R_C</label><input id="RC" type="range" min="200" max="1000" step="10" value="400" aria-label="Tekercsellenállás R_C"><output id="RC_o" for="RC"></output></div>
<div class="row"><label for="beta">Áramerősítés β</label><input id="beta" type="range" min="50" max="300" step="5" value="100" aria-label="Áramerősítés β"><output id="beta_o" for="beta"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 330" role="img" aria-label="NPN tranzisztor kimeneti jelleggörbéje és a relétekercs munkaegyenese; állítható bázisáram, kollektorköri ellenállás és β; kiírt munkapont, P_C és állapot (lezárt, aktív, telítés)"></svg>
<p class="small">Szemléltető modell (37.2): I_C = β·I_B·(1 − e^(−U_CE/0,1 V)), Early-hatás nélkül; U = 24 V. A 0,5 W-os disszipációs határ példaérték (ellenőrizendő: a tranzisztor adatlapja). A valódi görbéket a gyártói adatlap adja.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"IB":"mA", "RC":"Ω", "beta":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const UT=24, UK=0.1, ib=v.IB/1000, rc=v.RC, b=v.beta;
const x0=60,x1=600,y0=20,y1=290, X=u=>x0+u/26*(x1-x0), Y=i=>y1-Math.min(i,0.13)/0.13*(y1-y0);
const ic=u=>b*ib*(1-Math.exp(-u/UK));
for(let k=0;k<=13;k+=1){const u=2*k; if(u>26)break; el("line",{x1:X(u),x2:X(u),y1:y0,y2:y1,stroke:css("--grid"),"stroke-dasharray":"2 3"});
  el("text",{x:X(u),y:y1+16,"font-size":11,"text-anchor":"middle"},fmt(u,0));}
for(let k=0;k<=6;k++){const i=k*0.02; el("line",{x1:x0,x2:x1,y1:Y(i),y2:Y(i),stroke:css("--grid"),"stroke-dasharray":"2 3"});
  el("text",{x:x0-6,y:Y(i)+4,"font-size":11,"text-anchor":"end"},fmt(i*1000,0));}
el("text",{x:x1,y:y1+30,"font-size":12,"text-anchor":"end"},"U_CE (V)"); el("text",{x:x0,y:y0-6,"font-size":12},"I_C (mA)");
let ph="";for(let u=4;u<=26;u+=0.25){ph+=(ph?"L":"M")+X(u).toFixed(1)+" "+Y(0.5/u).toFixed(1);}
el("path",{d:ph,fill:"none",stroke:css("--muted"),"stroke-dasharray":"2 4","stroke-width":1.5});
el("text",{x:X(20),y:Y(0.5/20)-6,"font-size":11,fill:css("--muted")},"P_C = 0,5 W");
let pc="";for(let k=0;k<=520;k++){const u=k*26/520;pc+=(k?"L":"M")+X(u).toFixed(1)+" "+Y(ic(u)).toFixed(1);}
el("path",{d:pc,fill:"none",stroke:css("--hl2"),"stroke-width":2});
el("line",{x1:X(0),y1:Y(UT/rc),x2:X(UT),y2:Y(0),stroke:css("--fg"),"stroke-width":2.5});
let u=UT,i=0; if(ib>0){let lo=0,hi=UT;for(let k=0;k<80;k++){const m=(lo+hi)/2;if(ic(m)>(UT-m)/rc)hi=m;else lo=m;} u=(lo+hi)/2; i=(UT-u)/rc;}
el("circle",{cx:X(u),cy:Y(i),r:7,fill:css("--hl"),stroke:css("--fg"),"stroke-width":1.5});
const P=u*i, isat=UT/rc; let st;
if(ib<=0) st="<b>lezárt</b>: nincs bázisáram, I<sub>C</sub> = 0, U<sub>CE</sub> = 24 V – a relé nem húz";
else if(u<0.3) st="<b style='color:var(--ok)'>telítés</b>: a tranzisztor kapcsolóként zárva, a teljes tápfeszültség a tekercsen";
else st="<b style='color:var(--bad)'>aktív tartomány</b>: kevés a bázisáram (β·I<sub>B</sub> = "+fmt(b*ib*1000,1)+" mA &lt; "+fmt(isat*1000,1)+" mA), a tranzisztor melegszik, a relé kevés feszültséget kap";
status("Munkapont: U<sub>CE</sub> = "+fmt(u,u<1?3:2)+" V, I<sub>C</sub> = "+fmt(i*1000,1)+" mA, P<sub>C</sub> = "+fmt(P*1000,0)+" mW (a tekercsen "+fmt(UT-u,2)+" V). Állapot: "+st+(P>0.5?" – <b style='color:var(--bad)'>P<sub>C</sub> &gt; 0,5 W!</b>":"")+".");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
