<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szinkron gép: terhelési szög és billenőnyomaték</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="E">Gerjesztés (indukált fesz.) E</label><input id="E" type="range" min="150" max="400" step="1" value="289" aria-label="Gerjesztés (indukált fesz.) E"><output id="E_o" for="E"></output></div>
<div class="row"><label for="P">Terhelés P</label><input id="P" type="range" min="0" max="200" step="1" value="100" aria-label="Terhelés P"><output id="P_o" for="P"></output></div>
<div class="row"><label for="X">Szinkron reaktancia X_s</label><select id="X" aria-label="Szinkron reaktancia X_s"><option value="0.8">0,8 Ω</option><option value="1.2" selected>1,2 Ω</option><option value="1.6">1,6 Ω</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="P(δ) jelleggörbe: a gerjesztés (E), a terhelés (P) és a szinkron reaktancia változtatható; kijelzés: δ, P_max, tartalék"></svg>
<p class="small">Szemléltető, képletből számolt modell: P = 3·U_f·E·sin δ / X_s (hengeres pólusú gép, R_s elhanyagolva), U_f = 231 V; alapadatok a V-görbe modelljével egyezők (E = 289 V, X_s = 1,2 Ω). Nyomaték 1500 1/min-en: M = P/ω.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"E":"V", "P":"kW"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const Uf=231, om=2*Math.PI*1500/60, Pm=3*Uf*v.E/v.X/1000, L=css("--line");
const X0=60,Y0=250,W=460,H=210,ymax=Math.max(250,Pm*1.1);
const px=d=>X0+W*d/180, py=p=>Y0-H*p/ymax;
el("line",{x1:X0,y1:Y0,x2:X0+W,y2:Y0,stroke:L});el("line",{x1:X0,y1:Y0,x2:X0,y2:Y0-H,stroke:L});
for(let d=0;d<=180;d+=30){el("text",{x:px(d),y:Y0+16,"font-size":11,"text-anchor":"middle",fill:L},d+"°");}
for(let p=0;p<=ymax;p+=50){el("text",{x:X0-6,y:py(p)+4,"font-size":11,"text-anchor":"end",fill:L},p);}
el("text",{x:X0+W/2,y:Y0+34,"font-size":12,"text-anchor":"middle",fill:L},"terhelési szög δ");
el("text",{x:14,y:30,"font-size":12,fill:L},"P (kW)");
let a="",b="";for(let d=0;d<=90;d+=2)a+=(d?"L":"M")+px(d)+" "+py(Pm*Math.sin(d*Math.PI/180));
for(let d=90;d<=180;d+=2)b+=(d>90?"L":"M")+px(d)+" "+py(Pm*Math.sin(d*Math.PI/180));
el("path",{d:a,fill:"none",stroke:L,"stroke-width":2.4});el("path",{d:b,fill:"none",stroke:L,"stroke-width":2,"stroke-dasharray":"7 5"});
el("circle",{cx:px(90),cy:py(Pm),r:6,fill:"#c00000"});
el("text",{x:px(90)+10,y:py(Pm)-6,"font-size":12,fill:L},"billenőpont "+fmt(Pm,1)+" kW");
el("line",{x1:X0,y1:py(v.P),x2:X0+W,y2:py(v.P),stroke:css("--hl2")||"#c55a11","stroke-width":1.5,"stroke-dasharray":"4 3"});
if(v.P<=Pm){const d=Math.asin(v.P/Pm)*180/Math.PI;el("rect",{x:px(d)-5,y:py(v.P)-5,width:10,height:10,fill:"white",stroke:L,"stroke-width":2});
  status("δ = <b>"+fmt(d,1)+"°</b>, P<sub>max</sub> = "+fmt(Pm,1)+" kW (M<sub>max</sub> ≈ "+fmt(Pm*1000/om,0)+" N·m), M = "+fmt(v.P*1000/om,0)+" N·m, tartalék P<sub>max</sub>/P = "+(v.P>0?fmt(Pm/v.P,2):"–")+". Nagyobb gerjesztés → nagyobb billenőnyomaték, stabilabb gép.");}
else status("<b style='color:#c00000'>P &gt; P<sub>max</sub>: a gép kiesik a szinkronból!</b> (P<sub>max</sub> = "+fmt(Pm,1)+" kW) – növeld a gerjesztést vagy csökkentsd a terhelést.");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
