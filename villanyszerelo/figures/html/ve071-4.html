<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kétpontos szabályozás: hiszterézis, holtidő, túllendülés</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="h">Hiszterézis</label><input id="h" type="range" min="0.2" max="2" step="0.1" value="1.0" aria-label="Hiszterézis"><output id="h_o" for="h"></output></div>
<div class="row"><label for="td">Holtidő (szelepnyitás)</label><input id="td" type="range" min="0" max="8" step="0.5" value="4" aria-label="Holtidő (szelepnyitás)"><output id="td_o" for="td"></output></div>
<div class="row"><label for="tf">τ_f (fűtés)</label><input id="tf" type="range" min="20" max="120" step="5" value="60" aria-label="τ_f (fűtés)"><output id="tf_o" for="tf"></output></div>
<div class="row"><label for="th">τ_h (hűlés)</label><input id="th" type="range" min="40" max="240" step="10" value="120" aria-label="τ_h (hűlés)"><output id="th_o" for="th"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 340" role="img" aria-label="Kétpontos szabályozás: a hőmérséklet a két küszöb között fűrészfogszerűen ingadozik, alatta a termosztát ki/be jele és a szelep késleltetett állása."></svg>
<p class="small">Szemléltető elsőrendű modell (nem mért adat): fűtéskor a helyiség 26 °C felé, hűléskor 15 °C felé tart; a szelep a holtidő alatt nyit/zár. Kisebb hiszterézis → kisebb ingadozás, de több kapcsolás; nagyobb holtidő → túllendülés.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"h":"K", "td":"perc", "tf":"perc", "th":"perc"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const TMAX=26,TK=15,ALAP=21,DT=0.05,TEND=240;
let t=0,th=19,y=1,s=0;const T=[],TH=[],Y=[],S=[];
while(t<=TEND+1e-9){T.push(t);TH.push(th);Y.push(y);S.push(s);
 if(y===0&&th<=ALAP-v.h/2)y=1;else if(y===1&&th>=ALAP+v.h/2)y=0;
 if(v.td<=0)s=y;else s=y?Math.min(1,s+DT/v.td):Math.max(0,s-DT/v.td);
 th+=DT*(s*(TMAX-th)/v.tf+(1-s)*(TK-th)/v.th);t+=DT;}
let mx=-1e9,mn=1e9,on=0;for(let i=0;i<T.length;i++){if(T[i]>=120){mx=Math.max(mx,TH[i]);mn=Math.min(mn,TH[i]);if(i>0&&T[i-1]>=120&&Y[i]===1&&Y[i-1]===0)on++;}}
const X0=60,X1=520,Ya=20,Yb=210,Yc=240,Yd=320,lo=18.8,hi=22.8,ln=css("--line");
const X=q=>X0+(X1-X0)*q/240,YT=q=>Yb-(Yb-Ya)*(q-lo)/(hi-lo),YS=q=>Yd-(Yd-Yc)*q;
const pl=(pts,st,da,w)=>el("polyline",{points:pts.join(" "),fill:"none",stroke:st,"stroke-width":w||2,"stroke-dasharray":da||""});
el("rect",{x:X0,y:Ya,width:X1-X0,height:Yb-Ya,fill:"none",stroke:css("--grid")});el("rect",{x:X0,y:Yc,width:X1-X0,height:Yd-Yc,fill:"none",stroke:css("--grid")});
for(let g=19;g<=22;g++){el("text",{x:X0-6,y:YT(g)+4,"text-anchor":"end","font-size":11},g+" °C");}
for(let m=0;m<=240;m+=60){el("text",{x:X(m),y:Yd+14,"text-anchor":"middle","font-size":11},m+" perc");}
[[ALAP+v.h/2,"ki"],[ALAP-v.h/2,"be"]].forEach(([q,l])=>{pl([X0+","+YT(q),X1+","+YT(q)],css("--muted"),"6 4",1.2);el("text",{x:X1+6,y:YT(q)+4,"font-size":11},l+": "+fmt(q,2)+" °C");});
const step=Math.max(1,Math.round(0.5/DT));const a=[],b=[],c=[];
for(let i=0;i<T.length;i+=step){a.push(X(T[i])+","+YT(Math.max(lo,Math.min(hi,TH[i]))));b.push(X(T[i])+","+YS(Y[i]));c.push(X(T[i])+","+YS(S[i]));}
pl(a,css("--hl"),"",2.2);pl(b,ln,"",1.5);pl(c,css("--hl2"),"2 3",2);
el("text",{x:X1+6,y:YS(1)+4,"font-size":11},"termosztát");el("text",{x:X1+6,y:YS(1)+18,"font-size":11,fill:css("--hl2")},"szelep (pont.)");
status("Ingadozás (120–240 perc): <b>"+fmt(mx-mn,2)+" K</b> · bekapcsolások: <b>"+fmt(on/2,1)+" ciklus/óra</b> · túllendülés a kikapcsolási küszöb fölé: <b>"+fmt(Math.max(0,mx-(ALAP+v.h/2)),2)+" K</b>");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
