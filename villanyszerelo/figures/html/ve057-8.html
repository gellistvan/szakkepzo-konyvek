<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Világítási kapcsolás-szimulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#555;--line:#000;--cur:#d32f2f;--ok:#2e7d32;--bad:#b71c1c;--box:#f3f3f3;
--coil:#ffe0b2;--lamp:#ffd54f;--btn:#e8eefc;--btnb:#1f4e79;--grid:#d9d9d9;--brown:#8d5524;--blue:#4fb3ee;--ge1:#2e9d3a;--ge2:#f2d600}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--line:#e6e6e6;--cur:#ff8a80;--ok:#81c784;--bad:#ef9a9a;--box:#2a2a2a;
--coil:#6d4c1f;--lamp:#ffd54f;--btn:#26324a;--btnb:#8fb8e8;--grid:#4a4a4a;--brown:#b57a42;--blue:#6ec3f5;--ge1:#43b052;--ge2:#e6cf1a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
button{font:inherit;padding:6px 14px;border:1.5px solid var(--btnb);background:var(--btn);color:var(--fg);border-radius:6px;cursor:pointer;user-select:none;touch-action:manipulation}
button:hover{filter:brightness(.96)}button:focus-visible,[role=button]:focus-visible{outline:3px solid var(--btnb);outline-offset:2px}
button.on,button[aria-pressed=true]{background:var(--btnb);color:var(--bg)}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
#status{margin:6px 0;min-height:3.2em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
code,.mono{font-family:ui-monospace,Consolas,monospace}</style>
</head>
<body>
<style>table{border-collapse:collapse;font-size:13px;margin:6px 0}td,th{border:1px solid var(--grid);padding:2px 8px;text-align:center}
tr.cur td{background:var(--lamp);color:#111;font-weight:bold}.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}.wrap svg{flex:1 1 520px;max-width:900px}</style>
<div class="bar" id="modes" role="group" aria-label="Kapcsolás választása"></div>
<div class="bar"><label class="chk"><input type="checkbox" id="fault">Hibamód</label><span class="small" id="fdesc"></span></div>
<div class="bar" id="gbox" style="display:none"><label for="guess">Tipp: mit tapasztal a felhasználó?</label><select id="guess"></select><button type="button" id="gok">Tipp rögzítése</button></div>
<div id="st" aria-live="polite"></div>
<div class="wrap"><svg id="v" role="img" aria-label="Világítási kapcsolás áramúti rajza kattintható kapcsolókkal"></svg><div id="tb" aria-label="Igazságtábla"></div></div>
<p class="small">Kattints a kapcsolók rajzjelére (vagy Tab + Enter). A piros kiemelés az áram útja, a sárga lámpa ég; a táblázat aktuális sora kiemelt. 0 = alapállás, 1 = átváltva. Szemléltető modell; valós berendezésen csak feszültségmentesítés után, jogosult személy dolgozhat.</p>
<script>

const NS="http://www.w3.org/2000/svg";
let S, U=50, GX0=0, GY1=0;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(tag,a,parent,text){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(text!==undefined)e.textContent=text;(parent||S).appendChild(e);return e;}
function initSvg(id,x0,y0,x1,y1,unit){S=document.getElementById(id);U=unit||50;GX0=x0;GY1=y1;S.setAttribute("viewBox","0 0 "+((x1-x0)*U)+" "+((y1-y0)*U));S.innerHTML="";}
function P(x,y){return [(x-GX0)*U,(GY1-y)*U];}
function wire(pts,live,o){o=o||{};const p=pts.map(q=>P(q[0],q[1]).join(",")).join(" ");
  if(o.color){mk("polyline",{points:p,fill:"none",stroke:css("--line"),"stroke-width":(o.w||7)+2.4,"stroke-linejoin":"round","stroke-linecap":"round"});
    mk("polyline",{points:p,fill:"none",stroke:o.color,"stroke-width":o.w||7,"stroke-linejoin":"round","stroke-linecap":"round"});
    if(o.color2)mk("polyline",{points:p,fill:"none",stroke:o.color2,"stroke-width":o.w||7,"stroke-dasharray":"9 9","stroke-linejoin":"round"});
    if(live)mk("polyline",{points:p,fill:"none",stroke:css("--cur"),"stroke-width":2.6,"stroke-dasharray":"1 7","stroke-linecap":"round","stroke-linejoin":"round"});return;}
  if(live)mk("polyline",{points:p,fill:"none",stroke:css("--cur"),"stroke-width":6.5,"stroke-linejoin":"round","stroke-linecap":"round",opacity:.9});
  mk("polyline",{points:p,fill:"none",stroke:css("--line"),"stroke-width":2.2,"stroke-linejoin":"round","stroke-linecap":"round"});}
function dot(x,y,live){const q=P(x,y);mk("circle",{cx:q[0],cy:q[1],r:4.5,fill:css("--line")});}
function text(x,y,s,o){o=o||{};const q=P(x,y);return mk("text",{x:q[0],y:q[1],"text-anchor":o.anchor||"middle","dominant-baseline":"central","font-size":o.size||13,"font-weight":o.bold?"bold":"normal",fill:o.fill||css("--fg")},S,s);}
function term(x,y,label,o){o=o||{};const q=P(x,y);mk("circle",{cx:q[0],cy:q[1],r:5,fill:css("--bg"),stroke:css("--line"),"stroke-width":2});
  if(label)text(x+(o.dx||0),y+(o.dy===undefined?0.45:o.dy),label,{bold:true,anchor:o.anchor});}
function busbar(x1,y1,x2,y2){const a=P(x1,y1),b=P(x2,y2);mk("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:css("--line"),"stroke-width":7,"stroke-linecap":"butt"});}
function pe(x,y,label){const q=P(x,y);mk("line",{x1:q[0],y1:q[1],x2:q[0],y2:q[1]+12,stroke:css("--line"),"stroke-width":2.2});
  [[22,12],[14,18],[6,24]].forEach(w=>mk("line",{x1:q[0]-w[0],y1:q[1]+w[1],x2:q[0]+w[0],y2:q[1]+w[1],stroke:css("--line"),"stroke-width":2.4}));
  if(label)mk("text",{x:q[0],y:q[1]+42,"text-anchor":"middle","font-size":12},S,label);}
/* két kivezetésű rajzjel az a-b rácsszakaszon; o: closed, l1, l2 (kivezetés áram alatt), body (tekercs/lámpa be), pressed,
   label, sub, onclick, aria */
function dev(kind,a,b,o){o=o||{};
  const A=P(a[0],a[1]),B=P(b[0],b[1]),L=Math.hypot(B[0]-A[0],B[1]-A[1]),ang=Math.atan2(B[1]-A[1],B[0]-A[0])*180/Math.PI;
  const cx=(A[0]+B[0])/2,cy=(A[1]+B[1])/2,h=30,g=mk("g",{transform:"translate("+cx+","+cy+") rotate("+ang+")"});
  const line=css("--line"),cur=css("--cur"),sw=2.2;
  const seg=(x1,y1,x2,y2,c,w,extra)=>mk("line",Object.assign({x1:x1,y1:y1,x2:x2,y2:y2,stroke:c||line,"stroke-width":w||sw,"stroke-linecap":"round"},extra||{}),g);
  const closedPath=(kind==="coil"||kind==="lamp"||kind==="thermal"||kind==="res"||kind==="fuse")?true:!!o.closed;
  // áram alatti halo (a kivezetések és a záródott test)
  if(o.l1)seg(-L/2,0,-h,0,cur,6.5,{opacity:.9});
  if(o.l2)seg(h,0,L/2,0,cur,6.5,{opacity:.9});
  if(o.body&&closedPath)seg(-h,0,h,0,cur,6.5,{opacity:.9});
  seg(-L/2,0,-h,0);seg(h,0,L/2,0);
  const isContact=["no","nc","pbno","pbnc","sw","mcb"].includes(kind);
  if(isContact){
    mk("circle",{cx:-h,cy:0,r:3.2,fill:css("--bg"),stroke:line,"stroke-width":2},g);
    mk("circle",{cx:h,cy:0,r:3.2,fill:css("--bg"),stroke:line,"stroke-width":2},g);
    if(o.closed)seg(-h,0,h,0);else seg(-h,0,h-5,-24);
    if(kind==="nc"||kind==="pbnc")seg(h-1,-11,h+1,11,line,2.6);          // NC: a rögzített érintkező jelzője
    if(kind==="pbno"||kind==="pbnc"){const d=o.pressed?9:0;                // nyomógomb-működtető (T-alak)
      seg(0,-8+d,0,-30+d,line,1.8,{"stroke-dasharray":"4 3"});seg(-9,-30+d,9,-30+d,line,3);}
    if(kind==="sw"){seg(0,-12,0,-26,line,1.8,{"stroke-dasharray":"4 3"});seg(-8,-26,8,-26,line,3);}
    if(kind==="mcb"){const dy=o.closed?12:0;                              // kismegszakító: a túláramkioldó X-e a késsel együtt mozog
      seg(-6,-6+dy,6,-18+dy,line,2);seg(6,-6+dy,-6,-18+dy,line,2);}
    if(o.delay==="on"||o.delay==="off"){seg(0,-10,0,-28,line,1.8);       // késleltetett érintkező (időrelé): ejtőernyő-ív
      mk("path",{d:"M -9 -28 A 9 9 0 0 "+(o.delay==="on"?1:0)+" 9 -28",fill:"none",stroke:line,"stroke-width":2},g);}
  }else if(kind==="coil"){
    mk("rect",{x:-h,y:-17,width:2*h,height:34,fill:o.body?css("--coil"):css("--bg"),stroke:line,"stroke-width":2.2},g);
    if(o.hatch)seg(-h+4,13,h-4,-13,line,1.4);
  }else if(kind==="thermal"){
    mk("rect",{x:-h,y:-17,width:2*h,height:34,fill:css("--bg"),stroke:line,"stroke-width":2.2},g);
    mk("polyline",{points:"-14,0 -7,-9 0,9 7,-9 14,0",fill:"none",stroke:line,"stroke-width":2},g);
  }else if(kind==="res"){                                                  // ellenállás (IEC téglalap)
    mk("rect",{x:-h,y:-9,width:2*h,height:18,fill:o.body?css("--coil"):css("--bg"),stroke:line,"stroke-width":2.2},g);
  }else if(kind==="fuse"){                                                 // olvadóbiztosító: téglalap, középvonal
    mk("rect",{x:-h,y:-10,width:2*h,height:20,fill:css("--bg"),stroke:line,"stroke-width":2.2},g);seg(-h,0,h,0,line,2);
  }else if(kind==="lamp"){
    mk("circle",{cx:0,cy:0,r:17,fill:o.body?css("--lamp"):css("--bg"),stroke:line,"stroke-width":2.2},g);
    seg(-12,-12,12,12,line,2);seg(-12,12,12,-12,line,2);
    if(o.body)for(let k=0;k<8;k++){const t=k*Math.PI/4+Math.PI/8;seg(Math.cos(t)*21,Math.sin(t)*21,Math.cos(t)*28,Math.sin(t)*28,line,1.8);}
  }
  // felirat: vízszintesnél fölötte, függőlegesnél jobbra (nem forgatva)
  const horiz=Math.abs(B[1]-A[1])<1e-6;
  const lx=o.left?cx-38:cx+38,an=o.left?"end":"start";
  if(o.label)mk("text",{x:horiz?cx:lx,y:horiz?cy-44:cy-(o.sub?8:0),"text-anchor":horiz?"middle":an,"dominant-baseline":"central","font-size":13,"font-weight":"bold"},S,o.label);
  if(o.sub)mk("text",{x:horiz?cx:lx,y:horiz?cy+34:cy+9,"text-anchor":horiz?"middle":an,"dominant-baseline":"central","font-size":11.5,fill:css("--muted")},S,o.sub);
  if(o.onclick){const t=mk("circle",{cx:cx,cy:cy,r:36,fill:"transparent",role:"button",tabindex:0,"aria-label":o.aria||o.label||"",style:"cursor:pointer"},S);
    t.addEventListener("click",o.onclick);t.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();o.onclick();}});}
  return g;}
function motor(x,y,on,label){const q=P(x,y),r=38;
  mk("circle",{cx:q[0],cy:q[1],r:r,fill:on?css("--lamp"):css("--bg"),stroke:css("--line"),"stroke-width":2.4});
  mk("text",{x:q[0],y:q[1]-6,"text-anchor":"middle","dominant-baseline":"central","font-size":22,fill:on?"#111":css("--fg")},S,"M");
  mk("text",{x:q[0],y:q[1]+16,"text-anchor":"middle","dominant-baseline":"central","font-size":13,fill:on?"#111":css("--fg")},S,"3~");
  if(on){const gg=mk("g",{transform:"translate("+q[0]+","+q[1]+")"});
    const sp=mk("path",{d:"M0,-46 A46,46 0 0 1 40,-23",fill:"none",stroke:css("--cur"),"stroke-width":3.5,"stroke-linecap":"round"},gg);
    mk("path",{d:"M40,-23 l-4,-9 m4,9 l-10,3",fill:"none",stroke:css("--cur"),"stroke-width":3.5,"stroke-linecap":"round"},gg);
    if(!matchMedia("(prefers-reduced-motion: reduce)").matches)mk("animateTransform",{attributeName:"transform",type:"rotate",from:"0",to:"360",dur:"1.6s",repeatCount:"indefinite"},sp);}
  if(label)mk("text",{x:q[0]-r-10,y:q[1],"text-anchor":"end","dominant-baseline":"central","font-size":13,"font-weight":"bold"},S,label);
  // kapcsok a motor tetején: x-0.5, x, x+0.5
  [-0.5,0,0.5].forEach(d=>{const t=P(x+d,y+1);const k=P(x+d,y+Math.sqrt(0.78*0.78-d*d)*0.97);mk("line",{x1:t[0],y1:t[1],x2:k[0],y2:k[1]+1,stroke:css("--line"),"stroke-width":2.2});});}
/* nyomógomb nyomva tartása: egérrel/érintéssel tartásig, billentyűzetnél Enter/szóköz le- és felengedésig */
function hold(el,down,up){let on=false;const d=e=>{if(!on){on=true;down();}},u=e=>{if(on){on=false;up();}};
  el.addEventListener("pointerdown",e=>{d();});["pointerup","pointerleave","pointercancel","blur"].forEach(t=>el.addEventListener(t,u));
  el.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&!e.repeat){e.preventDefault();d();}});
  el.addEventListener("keyup",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();u();}});}
function pulse(down,up,ms){down();setTimeout(up,ms||600);}


const Q=new URLSearchParams(location.search);
/* ---- kapcsolások: elemek (sw: kétkivezetésű kapcsoló, co: váltó, cx: kereszt), lámpák, vezetékek (net) ---- */
function chain(n){ // váltó (n=0) / kereszt n db keresztkapcsolóval
  const E=[],W=[],lamps=[];const x=2.2;let left=x+1.6;
  W.push({p:[[0.4,5],[x,5]],n:"L"});
  E.push({k:"co",id:"S1",x:x,y:5,dir:1,c:"L",u:"p0u",l:"p0l"});
  for(let k=0;k<n;k++){const xa=left+1.4, xb=xa+1.8;
    W.push({p:[[left,6.2],[xa,6.2]],n:"p"+k+"u"});W.push({p:[[left,3.8],[xa,3.8]],n:"p"+k+"l"});
    E.push({k:"cx",id:"S"+(k+2),x:xa,x2:xb,iu:"p"+k+"u",il:"p"+k+"l",ou:"p"+(k+1)+"u",ol:"p"+(k+1)+"l"});left=xb;}
  const xr=left+1.4;
  W.push({p:[[left,6.2],[xr,6.2]],n:"p"+n+"u"});W.push({p:[[left,3.8],[xr,3.8]],n:"p"+n+"l"});
  E.push({k:"co",id:"S"+(n+2),x:xr+1.6,y:5,dir:-1,c:"up",u:"p"+n+"u",l:"p"+n+"l"});
  const xl=xr+3.2;W.push({p:[[xr+1.6,5],[xl,5],[xl,4.4]],n:"up"});
  lamps.push({id:"E1",x:xl,y1:4.4,y2:2.0,a:"up",b:"N"});
  W.push({p:[[xl,2.0],[xl,1],[0.4,1]],n:"N"});W.push({p:[[0.4,-0.2],[xl-1,-0.2],[xl-1,3.2],[xl-0.55,3.2]],n:"PE"});
  return {E:E,W:W,lamps:lamps,w:xl+2.2};}
const MODES={
 e1:{t:"egypólusú",build(){return {E:[{k:"sw",id:"S1",a:[2.5,5],b:[4.5,5],na:"L",nb:"up"}],
   W:[{p:[[0.4,5],[2.5,5]],n:"L"},{p:[[4.5,5],[8,5],[8,4.4]],n:"up"},{p:[[8,2.0],[8,1],[0.4,1]],n:"N"},{p:[[0.4,-0.2],[7,-0.2],[7,3.2],[7.45,3.2]],n:"PE"}],
   lamps:[{id:"E1",x:8,y1:4.4,y2:2.0,a:"up",b:"N"}],w:10.5};}},
 e2:{t:"kétpólusú",build(){return {E:[{k:"sw",id:"S1",a:[3,5],b:[5,5],na:"L",nb:"Lu"},{k:"sw",id:"S1",a:[3,1],b:[5,1],na:"N",nb:"Nu",slave:true}],
   W:[{p:[[0.4,5],[3,5]],n:"L"},{p:[[5,5],[8,5],[8,4.4]],n:"Lu"},{p:[[8,2.0],[8,1],[5,1]],n:"Nu"},{p:[[0.4,1],[3,1]],n:"N"},{p:[[0.4,-0.2],[7,-0.2],[7,3.2],[7.45,3.2]],n:"PE"}],
   lamps:[{id:"E1",x:8,y1:4.4,y2:2.0,a:"Lu",b:"Nu"}],link:[[4,4.55],[4,1.45]],w:10.5};}},
 cs:{t:"csillár",build(){return {E:[{k:"sw",id:"S1a",a:[3,6],b:[5,6],na:"L",nb:"u1"},{k:"sw",id:"S1b",a:[3,4],b:[5,4],na:"L",nb:"u2"}],
   W:[{p:[[0.4,6],[3,6]],n:"L"},{p:[[2.2,6],[2.2,4],[3,4]],n:"L"},{p:[[5,6],[11,6],[11,5.2]],n:"u1"},{p:[[5,4],[8.5,4],[8.5,3.6]],n:"u2"},
      {p:[[11,2.8],[11,1],[0.4,1]],n:"N"},{p:[[8.5,1.6],[8.5,1]],n:"N"},{p:[[0.4,-0.2],[10,-0.2],[10,4.0],[10.45,4.0]],n:"PE"},{p:[[7.5,-0.2],[7.5,2.6],[7.95,2.6]],n:"PE"}],
   lamps:[{id:"E1.1",x:11,y1:5.2,y2:2.8,a:"u1",b:"N"},{id:"E1.2",x:8.5,y1:3.6,y2:1.6,a:"u2",b:"N"}],w:13.5,Ly:6};}},
 v:{t:"váltó (2 hely)",build(){return chain(0);}},
 k3:{t:"kereszt 3 helyről",build(){return chain(1);}},
 k4:{t:"kereszt 4 helyről",build(){return chain(2);}}};
const FAULTS={v:{t:"S2 közös kapcsa és egy váltóvezeték felcserélve",ok:"B"},k3:{t:"a keresztkapcsoló egyik bemenete és egyik kimenete felcserélve (1↔3)",ok:"B"},
  e1:{t:"a kapcsoló a nullavezetőben",ok:"D"}};
const GUESS=[["A","minden kapcsoló minden állásban vált"],["B","csak bizonyos állásokban működik (valamelyik kapcsoló néha hatástalan)"],["C","egyik állásban sem ég"],["D","működik, de veszélyes"]];
/* hibák alkalmazása a modellre */
function applyFault(m,M){M=JSON.parse(JSON.stringify(M));
  if(m==="v"){const s=M.E.find(e=>e.id==="S2");const c=s.c;s.c=s.l;s.l=c;s.faulty=true;}
  if(m==="k3"){const s=M.E.find(e=>e.k==="cx");const t=s.il;s.il=s.ou;s.ou=t;s.faulty=true;}
  if(m==="e1"){const s=M.E[0];M.E[0]={k:"sw",id:"S1",a:[2.5,1],b:[4.5,1],na:"N",nb:"Nu",faulty:true};
    M.W=[{p:[[0.4,5],[8,5],[8,4.4]],n:"L"},{p:[[8,2.0],[8,1],[4.5,1]],n:"Nu"},{p:[[0.4,1],[2.5,1]],n:"N"},M.W[3]];M.lamps[0].a="L";M.lamps[0].b="Nu";}
  return M;}
/* ---- megoldó ---- */
function solve(M,st){const par={};const f=x=>{while(par[x]!==undefined&&par[x]!==x)x=par[x];return x;};const u=(a,b)=>{a=f(a);b=f(b);if(a!==b)par[a]=b;};
  const edges=[];
  M.E.forEach(e=>{const s=!!st[e.id];
    if(e.k==="sw"){if(s)edges.push([e.na,e.nb]);}
    else if(e.k==="co"){edges.push([e.c,s?e.l:e.u]);}
    else if(e.k==="cx"){if(!s){edges.push([e.iu,e.ou]);edges.push([e.il,e.ol]);}else{edges.push([e.iu,e.ol]);edges.push([e.il,e.ou]);}}});
  edges.forEach(([a,b])=>u(a,b));
  const short=f("L")===f("N");
  const lit=M.lamps.filter(l=>!short&&((f(l.a)===f("L")&&f(l.b)===f("N"))||(f(l.b)===f("L")&&f(l.a)===f("N")))).map(l=>l.id);
  // áramot vivő hálózatok: L-, N-komponens, holtágak nyesésével
  let E2=edges.filter(([a,b])=>f(a)===f("L")||f(a)===f("N"));const keep=new Set(["L","N"]);
  M.lamps.forEach(l=>{if(lit.includes(l.id)){keep.add(l.a);keep.add(l.b);}});
  let ch=true;while(ch){ch=false;const deg={};E2.forEach(([a,b])=>{deg[a]=(deg[a]||0)+1;deg[b]=(deg[b]||0)+1;});
    const n=E2.length;E2=E2.filter(([a,b])=>(keep.has(a)||deg[a]>1)&&(keep.has(b)||deg[b]>1));if(E2.length!==n)ch=true;}
  const cur=new Set();if(lit.length){E2.forEach(([a,b])=>{cur.add(a);cur.add(b);});keep.forEach(k=>cur.add(k));}
  const live=new Set();Object.keys(par).concat(["L"]).forEach(k=>{if(f(k)===f("L"))live.add(k);});
  return {lit:lit,cur:cur,live:live,short:short};}
function ids(M){const s=[];M.E.forEach(e=>{if(!e.slave&&!s.includes(e.id))s.push(e.id);});return s;}
/* ---- rajz ---- */
let mode=Q.get("mode")||"k3", st={}, fault=false, guessed=false;
function seg(a,b,o){const A=P(a[0],a[1]),B=P(b[0],b[1]);return mk("line",Object.assign({x1:A[0],y1:A[1],x2:B[0],y2:B[1],stroke:css("--line"),"stroke-width":2.4,"stroke-linecap":"round"},o||{}));}
function tp(x,y){const q=P(x,y);mk("circle",{cx:q[0],cy:q[1],r:3.6,fill:css("--bg"),stroke:css("--line"),"stroke-width":2});}
function hot(x,y,id,lab){const q=P(x,y);const t=mk("circle",{cx:q[0],cy:q[1],r:34,fill:"transparent",role:"button",tabindex:0,"aria-label":lab,style:"cursor:pointer"});
  const go=()=>{if(fault&&!guessed){status('<span class="bad">Hibamódban előbb tippelj a lenti listából, és nyomd meg a „Tipp rögzítése” gombot.</span>');return;}st[id]=!st[id];render();};
  t.addEventListener("click",go);t.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});}
function status(h){document.getElementById("st").innerHTML=h;}
function model(){let M=MODES[mode].build();if(fault&&FAULTS[mode])M=applyFault(mode,M);return M;}
function render(){const M=model();const R=solve(M,st);
  initSvg("v",-0.6,-1.2,M.w,7.6,48);const cur=css("--cur");
  M.W.forEach(w=>{const c=R.cur.has(w.n);wire(w.p,c,w.n==="PE"?{color:css("--ge1"),color2:css("--ge2"),w:4}:undefined);});
  M.E.forEach(e=>{const s=!!st[e.id];
    if(e.k==="sw"){dev("sw",e.a,e.b,{closed:s,l1:R.cur.has(e.na)&&s,l2:R.cur.has(e.nb)&&s,body:s&&R.cur.has(e.na),label:e.slave?"":e.id,sub:e.slave?"":(s?"BE":"KI")});
      if(!e.slave)hot((e.a[0]+e.b[0])/2,e.a[1],e.id,e.id+" kapcsoló");}
    else if(e.k==="co"){const x=e.x,y=e.y,d=e.dir,xt=x+d*1.6;tp(x,y);tp(xt,6.2);tp(xt,3.8);
      seg([xt,6.2],[xt,6.2]);const to=s?[xt,3.8]:[xt,6.2];const on=R.cur.has(e.c)&&R.cur.has(s?e.l:e.u);
      if(on)seg([x,y],to,{stroke:cur,"stroke-width":7,opacity:.85});seg([x,y],[x+d*1.45,s?3.95:6.05]);
      text(x+d*0.8,7.0,e.id,{bold:true});text(x+d*0.8,2.9,s?"1":"0",{size:12,fill:css("--muted")});
      if(e.faulty)text(x+d*0.8,7.55,"⚠ hibás bekötés",{size:11,fill:css("--bad")});hot(x+d*0.8,5,e.id,e.id+" váltókapcsoló");}
    else if(e.k==="cx"){const a=e.x,b=e.x2;[[a,6.2],[a,3.8],[b,6.2],[b,3.8]].forEach(p=>tp(p[0],p[1]));
      const pairs=s?[[[a,6.2],[b,3.8],e.iu],[[a,3.8],[b,6.2],e.il]]:[[[a,6.2],[b,6.2],e.iu],[[a,3.8],[b,3.8],e.il]];
      pairs.forEach(([p,q,n])=>{if(R.cur.has(n))seg(p,q,{stroke:cur,"stroke-width":7,opacity:.85});seg(p,q);});
      const r1=P(a-0.25,6.7),r2=P(b+0.25,3.3);mk("rect",{x:r1[0],y:r1[1],width:r2[0]-r1[0],height:r2[1]-r1[1],fill:"none",stroke:css("--line"),"stroke-dasharray":"6 4","stroke-width":1.4});
      text((a+b)/2,7.0,e.id+" (kereszt)",{bold:true});text((a+b)/2,2.9,s?"1 – keresztben":"0 – egyenesen",{size:12,fill:css("--muted")});
      if(e.faulty)text((a+b)/2,7.55,"⚠ hibás bekötés",{size:11,fill:css("--bad")});hot((a+b)/2,5,e.id,e.id+" keresztkapcsoló");}});
  if(M.link)seg(M.link[0],M.link[1],{"stroke-dasharray":"5 4","stroke-width":1.6});
  M.lamps.forEach(l=>{dev("lamp",[l.x,l.y1],[l.x,l.y2],{body:R.lit.includes(l.id),l1:R.lit.includes(l.id),l2:R.lit.includes(l.id),label:l.id});});
  term(0.4,M.Ly||5,"L",{dy:0.5});term(0.4,1,"N",{dy:-0.5});term(0.4,-0.2,"PE",{dy:-0.5});
  table(M);
  const names=ids(M).map(i=>i+"="+(st[i]?1:0)).join(", ");
  let h=names+" → "+(R.short?'<span class="bad">ZÁRLAT</span>':(R.lit.length?'<span class="ok">ég: '+R.lit.join(", ")+'</span>':"nem ég"));
  if(fault&&mode==="e1"&&!st.S1)h+=' – <span class="bad">a lámpa nem ég, de a foglalat a fázison van (érintésveszély)!</span>';
  if(!(fault&&!guessed))status(h);}
function table(M){const I=ids(M),n=I.length,R=[];
  for(let k=0;k<(1<<n);k++){const s={};I.forEach((id,j)=>s[id]=!!(k>>(n-1-j)&1));R.push([s,solve(M,s)]);}
  const curk=I.reduce((a,id)=>a*2+(st[id]?1:0),0);
  let h="<table><tr>"+I.map(i=>"<th>"+i+"</th>").join("")+"<th>lámpa</th></tr>";
  R.forEach(([s,r],k)=>{h+="<tr"+(k===curk?' class="cur"':"")+">"+I.map(i=>"<td>"+(s[i]?1:0)+"</td>").join("")+"<td>"+(r.lit.length?r.lit.join(", "):"–")+"</td></tr>";});
  document.getElementById("tb").innerHTML=h+"</table>";}
function setMode(m){mode=m;st={};guessed=false;document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
  const fa=document.getElementById("fault");fa.disabled=!FAULTS[m];if(!FAULTS[m]){fault=false;fa.checked=false;}
  document.getElementById("fdesc").textContent=FAULTS[m]?"Hiba ebben a kapcsolásban: "+FAULTS[m].t+".":"Ehhez a kapcsoláshoz nincs hibamód.";
  document.getElementById("gbox").style.display=fault?"flex":"none";render();if(fault)status("Hibamód: előbb tippelj, mit tapasztal a felhasználó!");}
const bar=document.getElementById("modes");Object.keys(MODES).forEach(m=>{const b=document.createElement("button");b.type="button";b.dataset.m=m;b.textContent=MODES[m].t;b.addEventListener("click",()=>setMode(m));bar.appendChild(b);});
const sel=document.getElementById("guess");GUESS.forEach(([v,t])=>{const o=document.createElement("option");o.value=v;o.textContent=t;sel.appendChild(o);});
document.getElementById("fault").addEventListener("change",e=>{fault=e.target.checked;setMode(mode);});
document.getElementById("gok").addEventListener("click",()=>{if(!fault)return;guessed=true;const F=FAULTS[mode];const g=sel.value;
  const M=model(),I=ids(M);let n=0,tot=1<<I.length;for(let k=0;k<tot;k++){const s={};I.forEach((id,j)=>s[id]=!!(k>>(I.length-1-j)&1));if(solve(M,s).lit.length)n++;}
  const why={v:"Az S2 közös kapcsára váltóvezeték került, ezért az S2 csak az egyik állásában köti tovább a fázist a lámpa felé: a 4 állásból csak "+n+" esetén ég. Javítás: a lámpa felé menő ér a közös kapocsra.",
   k3:"Ha a keresztkapcsoló egy bemenete és egy kimenete helyet cserél, az S2 egyik állásában a keresztkapcsoló a két váltóvezetéket egymással köti össze, és a lámpa egyáltalán nem kapcsolható: a 8 állásból csak "+n+" esetén ég. Javítás: a bemenő pár (1, 2) az egyik, a kimenő pár (3, 4) a másik szélső kapcsoló felé.",
   e1:"A kapcsoló a nullát szakítja: a lámpa kapcsolható, de kikapcsolt állapotban a foglalat és a lámpatest vezetékei fázisfeszültségen vannak – lámpacseréskor áramütés veszélye. Javítás: a kapcsoló a fázisba."}[mode];
  status((g===F.ok?'<span class="ok">Helyes tipp.</span> ':'<span class="bad">Nem ez történik.</span> ')+why+" Most kipróbálhatod a kapcsolókat.");});
/* önteszt */
if(Q.get("selftest")){let bad=0;const chk=(m,fa,exp)=>{mode=m;fault=fa;const M=model(),I=ids(M);
   for(let k=0;k<(1<<I.length);k++){const s={};let c=0;I.forEach((id,j)=>{s[id]=!!(k>>(I.length-1-j)&1);c+=s[id]?1:0;});const r=solve(M,s);const e=exp(s,c);
     if(JSON.stringify(r.lit)!==JSON.stringify(e)){bad++;console.error("SELFTEST error",m,fa,JSON.stringify(s),r.lit,e);}}};
 ["v","k3","k4"].forEach(m=>chk(m,false,(s,c)=>c%2===0?["E1"]:[]));
 chk("e1",false,(s)=>s.S1?["E1"]:[]);chk("e2",false,(s)=>s.S1?["E1"]:[]);chk("e1",true,(s)=>s.S1?["E1"]:[]);
 chk("cs",false,(s)=>(s.S1a?["E1.1"]:[]).concat(s.S1b?["E1.2"]:[]));

 mode="k3";fault=true;{const M=model();let n=0;for(let k=0;k<8;k++){const s={S1:!!(k&4),S2:!!(k&2),S3:!!(k&1)};if(solve(M,s).lit.length)n++;}if(n!==2){bad++;console.error("SELFTEST error k3 hiba",n);}}
 if(!bad)console.log("SELFTEST OK");fault=false;mode=Q.get("mode")||"k3";}
