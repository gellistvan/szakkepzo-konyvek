<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vészvilágítás elhelyezése alaprajzon</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Alaprajz: vészvilágítási lámpatestek a kijáratoknál, a folyosó kanyarjánál, a lépcsőnél és a tűzoltó készüléknél; a menekülési útvonal szaggatott vonallal."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető, nem léptékes alaprajz. Jelek: E kijárati jel, V vészvilágítási lámpatest, T térvilágítás, TK tűzoltó készülék, KJ kézi tűzjelző. A megvilágítási és üzemidő-követelmények: MSZ EN 1838, MSZ EN 50172 (ellenőrizendő).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 1, "msg": "1. A menekülési útvonal kijelölése (szaggatott vonal): az irodatérből a folyosón át a két kijárathoz és a lépcsőhöz."}, {"k": 2, "msg": "2. Kijáratok: minden kijárat fölé megvilágított kijárati jel kerül (E1, E2)."}, {"k": 3, "msg": "3. Irányváltások és kereszteződések: ahol a menekülő irányt vált vagy választania kell, vészvilágítási lámpatest (V) és szükség esetén irányjel kerül."}, {"k": 4, "msg": "4. Lépcső és tűzvédelmi eszközök: a lépcsőnél, a tűzoltó készüléknél (TK) és a kézi tűzjelzőnél (KJ) is van lámpatest, hogy az eszköz sötétben is megtalálható legyen."}, {"k": 5, "msg": "5. Térvilágítás (T): a nagy, kijelölt út nélküli irodatérben a pánik elkerülésére egyenletes alapmegvilágítás. Az előírt értékek: MSZ EN 1838 (ellenőrizendő)."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const D={"rooms": [[0, 6, 14, 10, "nyitott irodatér", true], [14, 6, 7, 10, "iroda", false], [24, 6, 6, 10, "iroda", false], [0, 0, 9, 3, "iroda", false], [9, 0, 12, 3, "tárgyaló", false], [24, 0, 6, 3, "gépészet", false]], "stair": [25, 3.2, 4.6, 2.6], "route": [[[7, 6.6], [7, 4.5], [0.0, 4.5]], [[7, 4.5], [22.5, 4.5], [22.5, 16.0]], [[22.5, 4.5], [25.6, 4.5]]], "sym": [[2, "exit", 1.3, 5.3, "E1 kijárat"], [2, "exit", 22.5, 15.3, "E2 kijárat"], [3, "V", 22.5, 4.5, "irányváltás"], [3, "V", 7.0, 4.5, "kereszteződés"], [3, "dir", 15.0, 5.4, "irányjel"], [4, "V", 25.6, 4.5, ""], [4, "TK", 18.0, 3.45, "tűzoltó készülék"], [4, "V", 18.0, 4.5, ""], [4, "KJ", 3.5, 3.45, "kézi tűzjelző"], [4, "V", 3.5, 4.5, ""], [5, "T", 3.5, 9.5, ""], [5, "T", 10.5, 9.5, ""], [5, "T", 3.5, 13.5, ""], [5, "T", 10.5, 13.5, ""]], "W": 30.0, "H": 16.0}, U=18, OX=10, OY=8;
function X(x){return OX+x*U;} function Y(y){return OY+(D.H-y)*U;}
function render(s){svg.innerHTML="";svg.setAttribute("viewBox","0 0 560 310");
 el("rect",{x:X(0),y:Y(D.H),width:D.W*U,height:D.H*U,fill:"none",stroke:css("--line"),"stroke-width":3});
 D.rooms.forEach(r=>{el("rect",{x:X(r[0]),y:Y(r[1]+r[3]),width:r[2]*U,height:r[3]*U,fill:(r[5]&&s.k>=5)?css("--cellhl"):css("--cell"),stroke:css("--line"),"stroke-width":1.4});
  el("text",{x:X(r[0]+r[2]/2),y:Y(r[1]+r[3]/2+(r[5]?1.5:0))+4,"text-anchor":"middle","font-size":11,fill:css("--muted")},r[4]);});
 const st=D.stair;el("rect",{x:X(st[0]),y:Y(st[1]+st[3]),width:st[2]*U,height:st[3]*U,fill:"none",stroke:css("--line")});
 el("text",{x:X(st[0]+st[2]/2),y:Y(st[1])+14,"text-anchor":"middle","font-size":11},"lépcső");
 for(let i=1;i<8;i++)el("line",{x1:X(st[0]+i*st[2]/8),x2:X(st[0]+i*st[2]/8),y1:Y(st[1]),y2:Y(st[1]+st[3]),stroke:css("--line"),"stroke-width":.8});
 el("line",{x1:X(0),x2:X(0),y1:Y(5.4),y2:Y(3.6),stroke:css("--bg"),"stroke-width":5});
 el("line",{x1:X(21.6),x2:X(23.4),y1:Y(16),y2:Y(16),stroke:css("--bg"),"stroke-width":5});
 if(s.k>=1)D.route.forEach(p=>el("polyline",{points:p.map(q=>X(q[0])+","+Y(q[1])).join(" "),fill:"none",stroke:css("--hl2"),"stroke-width":3,"stroke-dasharray":"9 6"}));
 D.sym.forEach(q=>{const [k,t,x,y,lab]=q; if(k>s.k)return; const on=k===s.k, sw=on?3:1.6, col=on?css("--hl"):css("--line");
  if(t==="exit"){el("rect",{x:X(x)-14,y:Y(y)-8,width:28,height:16,fill:css("--bg"),stroke:col,"stroke-width":sw});el("text",{x:X(x),y:Y(y)+5,"text-anchor":"middle","font-size":12,"font-weight":"bold"},"E");
    el("text",{x:X(x)+(x<5?18:-18),y:Y(y)+5,"text-anchor":x<5?"start":"end","font-size":11},lab);}
  else if(t==="dir"){el("rect",{x:X(x)-16,y:Y(y)-8,width:32,height:16,fill:css("--bg"),stroke:col,"stroke-width":sw});el("text",{x:X(x),y:Y(y)+5,"text-anchor":"middle","font-size":13},"→");el("text",{x:X(x)+20,y:Y(y)+4,"font-size":11},lab);}
  else if(t==="V"||t==="T"){el("circle",{cx:X(x),cy:Y(y),r:8,fill:t==="T"?css("--cellhl"):css("--bg"),stroke:col,"stroke-width":sw});el("text",{x:X(x),y:Y(y)+4,"text-anchor":"middle","font-size":10,"font-weight":"bold"},t);
    if(lab==="irányváltás")el("text",{x:X(x)-11,y:Y(y)-10,"text-anchor":"end","font-size":11},lab);else if(lab)el("text",{x:X(x)+10,y:Y(y)+18,"font-size":11},lab);}
  else{el("polygon",{points:(X(x)-8)+","+(Y(y)+6)+" "+(X(x)+8)+","+(Y(y)+6)+" "+X(x)+","+(Y(y)-8),fill:css("--bg"),stroke:col,"stroke-width":sw});el("text",{x:X(x)+11,y:Y(y)+4,"font-size":10},t);}
 });}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
