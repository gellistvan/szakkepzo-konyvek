<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hárompontos földelésmérés</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="D">E–C távolság D</label><input id="D" type="range" min="5" max="60" step="1" value="40" aria-label="E–C távolság D"><output id="D_o" for="D"></output></div>
<div class="row"><label for="p">P-szonda helyzete x/D</label><input id="p" type="range" min="10" max="90" step="1" value="62" aria-label="P-szonda helyzete x/D"><output id="p_o" for="p"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 360" role="img" aria-label="Hárompontos földelésmérés: a P-szondát E és C között mozgatva a mért ellenállás a 62 % körül sík szakaszt mutat, ha E és C elég messze van."></svg>
<p class="small">Idealizált modell: homogén talaj (ρ = 50 Ωm), egyenértékű félgömb-földelő (R<sub>A</sub> = 8,4 Ω), pontszerű áramszonda; nem mért görbe. A szondatávolságokra a gyártói és szabványi ajánlás a mérvadó (ellenőrizendő).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"D":"m", "p":"%"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const RHO=50.0,RA=8.4,A=0.9473508517374722,I=0.5;
const R=(x,D)=>RHO/(2*Math.PI)*(1/A-1/D-1/x+1/(D-x));
// elrendezés
const X0=30,W=500,XS=m=>X0+W*m/60,G=70;
el("rect",{x:0,y:G,width:560,height:40,fill:css("--grid"),opacity:.5});
el("line",{x1:0,x2:560,y1:G,y2:G,stroke:css("--line")});
const xp=v.D*v.p/100;
[[0,"E"],[xp,"P"],[v.D,"C"]].forEach(([m,l],i)=>{el("line",{x1:XS(m),x2:XS(m),y1:G-8,y2:G+(i?24:34),stroke:css("--line"),"stroke-width":i?3:5});
 el("text",{x:XS(m),y:G-14,"text-anchor":"middle","font-size":13,"font-weight":"bold"},l);});
el("text",{x:XS(v.D/2),y:G+56,"text-anchor":"middle","font-size":12},"D = "+fmt(v.D,0)+" m,  x = "+fmt(xp,1)+" m");
// görbe
const C0=60,CW=470,Y0=330,CH=180,ymax=15,XC=q=>C0+CW*q/100,YC=r=>Y0-CH*Math.min(r,ymax)/ymax;
el("rect",{x:XC(Math.max(v.p-10,0)),y:Y0-CH,width:XC(Math.min(v.p+10,100))-XC(Math.max(v.p-10,0)),height:CH,fill:css("--grid"),opacity:.45});
el("line",{x1:C0,x2:C0+CW,y1:Y0,y2:Y0,stroke:css("--line")});el("line",{x1:C0,x2:C0,y1:Y0,y2:Y0-CH,stroke:css("--line")});
[0,20,40,60,80,100].forEach(q=>el("text",{x:XC(q),y:Y0+15,"text-anchor":"middle","font-size":11},q+" %"));
[0,5,10,15].forEach(r=>el("text",{x:C0-6,y:YC(r)+4,"text-anchor":"end","font-size":11},String(r)));
el("text",{x:C0-40,y:Y0-CH-8,"font-size":11},"R (Ω)");
el("line",{x1:C0,x2:C0+CW,y1:YC(RA),y2:YC(RA),stroke:css("--hl2"),"stroke-dasharray":"3 4"});
let d="";for(let i=0;i<=300;i++){const q=3+94*i/300;d+=(i?"L":"M")+XC(q)+" "+YC(R(q/100*v.D,v.D));}
el("path",{d:d,fill:"none",stroke:css("--line"),"stroke-width":2.4});
const r0=R(xp,v.D);el("circle",{cx:XC(v.p),cy:YC(r0),r:6,fill:css("--hl2")});
const lo=v.p>10?R((v.p-10)/100*v.D,v.D):NaN, hi=v.p<90?R((v.p+10)/100*v.D,v.D):NaN;
const dev=Math.max(Math.abs(lo-r0)||0,Math.abs(hi-r0)||0)/r0;
status("Műszer: R = U/I = <b>"+fmt(r0,2)+" Ω</b> (U = "+fmt(r0*I,2)+" V, I = 0,5 A). A P-szonda ±10 %-os áthelyezésével: "+fmt(lo,2)+" / "+fmt(hi,2)+" Ω, eltérés "+fmt(100*dev,1)+" % → "+
 (dev<=0.05?'<span class="ok">sík szakaszon vagy: az eredmény elfogadható.</span>':'<span class="bad">több mint 5 %: nincs sík szakasz (átfedő tölcsérek vagy rossz szondahely) – növeld az E–C távolságot.</span>'));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
