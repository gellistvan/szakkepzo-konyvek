<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terhelt transzformátor: fázorábra, külső karakterisztika, hatásfok</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="Sn">Névleges teljesítmény</label><select id="Sn" aria-label="Névleges teljesítmény"><option value="100" selected>100 VA (24 V)</option><option value="25000">25 kVA (230 V)</option><option value="630000">630 kVA (400 V)</option></select></div>
<div class="row"><label for="uk">u_k</label><input id="uk" type="range" min="2" max="10" step="0.01" value="7.61" aria-label="u_k"><output id="uk_o" for="uk"></output></div>
<div class="row"><label for="uR">u_R (≤ u_k)</label><input id="uR" type="range" min="0.5" max="6.5" step="0.1" value="6.2" aria-label="u_R (≤ u_k)"><output id="uR_o" for="uR"></output></div>
<div class="row"><label for="P0">P0 (vasveszteség, Sn %-ában)</label><input id="P0" type="range" min="0.2" max="5" step="0.1" value="4.5" aria-label="P0 (vasveszteség, Sn %-ában)"><output id="P0_o" for="P0"></output></div>
<div class="row"><label for="b">Terhelés β</label><input id="b" type="range" min="0" max="1.2" step="0.01" value="1" aria-label="Terhelés β"><output id="b_o" for="b"></output></div>
<div class="row"><label for="cf">cos φ2</label><input id="cf" type="range" min="0.5" max="1" step="0.01" value="0.8" aria-label="cos φ2"><output id="cf_o" for="cf"></output></div>
<div class="row"><label for="jel">Terhelés jellege</label><select id="jel" aria-label="Terhelés jellege"><option value="ind" selected>induktív</option><option value="kap">kapacitív</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 770 280" role="img" aria-label="Három panel: a terhelt transzformátor fázorábrája U2 vízszintes referenciával, I2 a φ2 szöggel, R·I2 és jX·I2 (Kapp-háromszög) és U20; a külső karakterisztika induktív és kapacitív terhelésre a munkaponttal; a hatásfok a terhelés függvényében β_opt jelöléssel"></svg>
<p class="small">Viszonylagos egységek, állandó U<sub>20</sub>; a fázorábrán a Kapp-háromszög nagyítva (a nagyítás a címben). Alapállapot: a 25.1 alfejezet 100 VA-es transzformátora (u<sub>k</sub> = 7,61 %, u<sub>R</sub> = 6,2 %, P<sub>0</sub> = 4,5 %). A 25 kVA-es példa: u<sub>R</sub> ≈ 2,84 %, u<sub>X</sub> ≈ 2,50 % (u<sub>k</sub> ≈ 3,78 %), cos φ<sub>2</sub> = 0,85 → ε ≈ 3,7 %, ΔU ≈ 8,6 V.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"uk":"%", "uR":"%", "P0":"%", "b":"", "cf":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const SN={"100":[100,24,"VA"],"25000":[25000,230,"VA"],"630000":[630000,400,"VA"]}[String(v.Sn)];
const uk=v.uk, uR=Math.min(v.uR,uk-0.01), uX=Math.sqrt(uk*uk-uR*uR), r=uR/100, x=uX/100, p0=v.P0/100, beta=v.b;
const cos=v.cf, sin=Math.sqrt(Math.max(0,1-cos*cos))*(v.jel==="kap"?-1:1);
const U2=b=>-b*(r*cos+x*sin)+Math.sqrt(Math.max(0,1-b*b*Math.pow(x*cos-r*sin,2)));
const U2c=(b,c,s)=>-b*(r*c+x*s)+Math.sqrt(Math.max(0,1-b*b*Math.pow(x*c-r*s,2)));
const eta=b=>b*cos/(b*cos+p0+b*b*r), bopt=Math.sqrt(p0/r);
const epsP=(1-U2(beta))*100, epsK=beta*(r*cos+x*sin)*100;
// 1. fázorábra
const ox=20, oy=150, sc=190, m=Math.max(1,Math.min(10,0.35/Math.max(0.005,beta*uk/100)));
const u2=1-m*(1-U2(beta)), Ix=cos, Iy=-sin, ax=a=>ox+a*sc, ay=a=>oy-a*sc;
function arrow(x0,y0,x1,y1,c,w,d){el("line",{x1:ax(x0),y1:ay(y0),x2:ax(x1),y2:ay(y1),stroke:c,"stroke-width":w,"stroke-dasharray":d||""});
  const a=Math.atan2(ay(y1)-ay(y0),ax(x1)-ax(x0)),L=9;el("polygon",{points:[ax(x1),ay(y1),ax(x1)-L*Math.cos(a-0.4),ay(y1)-L*Math.sin(a-0.4),ax(x1)-L*Math.cos(a+0.4),ay(y1)-L*Math.sin(a+0.4)].join(","),fill:c});}
const p1=[u2,0], p2=[u2+m*beta*r*Ix,m*beta*r*Iy], p3=[p2[0]-m*beta*x*Iy,p2[1]+m*beta*x*Ix];
el("text",{x:10,y:22,"font-size":13,"font-weight":"bold"},"Fázorábra (Kapp-háromszög ×"+fmt(m,1)+")");
arrow(0,0,u2,0,css("--fg"),3); el("text",{x:ax(u2/2),y:oy+18,"text-anchor":"middle","font-size":13},"U2");
arrow(0,0,0.5*Ix,0.5*Iy,css("--hl"),2,"6 4"); el("text",{x:ax(0.55*Ix),y:ay(0.55*Iy)+(sin>0?14:-6),"font-size":13,fill:css("--hl")},"I2");
arrow(p1[0],p1[1],p2[0],p2[1],css("--hl2"),2.4); arrow(p2[0],p2[1],p3[0],p3[1],css("--hl2"),2.4);
el("text",{x:ax(p3[0])+6,y:ay((p2[1]+p3[1])/2),"font-size":12,fill:css("--hl2")},"jX·I2");
el("text",{x:ax((p1[0]+p2[0])/2),y:ay((p1[1]+p2[1])/2)+(sin>0?16:-8),"font-size":12,fill:css("--hl2")},"R·I2");
arrow(0,0,p3[0],p3[1],css("--fg"),2.4); el("text",{x:ax(p3[0]*0.45),y:ay(p3[1]*0.45)-8,"font-size":13},"U20");
// 2. külső karakterisztika
const X0=290,X1=500,Yt=40,Yb=250, bx=b=>X0+b/1.2*(X1-X0), ymin=Math.min(85,Math.floor(Math.min(U2c(1.2,cos,Math.abs(sin)),U2c(1.2,cos,-Math.abs(sin)))*100/5)*5), ymax=Math.max(105,Math.ceil(U2c(1.2,cos,-Math.abs(sin))*100/5)*5);
const yy=p=>Yb-(p-ymin)/(ymax-ymin)*(Yb-Yt);
el("text",{x:X0,y:22,"font-size":13,"font-weight":"bold"},"U2/U20 (%) – β");
el("line",{x1:X0,y1:Yb,x2:X1,y2:Yb,stroke:css("--line")});el("line",{x1:X0,y1:Yt,x2:X0,y2:Yb,stroke:css("--line")});
for(let p=ymin;p<=ymax;p+=5){el("line",{x1:X0,x2:X1,y1:yy(p),y2:yy(p),stroke:css("--grid")});el("text",{x:X0-4,y:yy(p)+4,"text-anchor":"end","font-size":11},p);}
[0,0.4,0.8,1.2].forEach(b=>el("text",{x:bx(b),y:Yb+15,"text-anchor":"middle","font-size":11},fmt(b,1)));
[["ind",Math.abs(sin),"",css("--fg")],["kap",-Math.abs(sin),"6 4",css("--fg")]].forEach(q=>{let pts=[];for(let i=0;i<=48;i++){const b=1.2*i/48;pts.push(bx(b)+","+yy(100*U2c(b,cos,q[1])));}
  el("polyline",{points:pts.join(" "),fill:"none",stroke:q[3],"stroke-width":2,"stroke-dasharray":q[2]});
  el("text",{x:X1+3,y:yy(100*U2c(1.2,cos,q[1]))+4,"font-size":11},q[0]);});
el("circle",{cx:bx(beta),cy:yy(100*U2(beta)),r:6,fill:css("--hl2")});
// 3. hatásfok
const E0=560,E1=750, ex=b=>E0+b/1.2*(E1-E0), ey=p=>Yb-(p-50)/50*(Yb-Yt);
el("text",{x:E0,y:22,"font-size":13,"font-weight":"bold"},"η (%) – β");
el("line",{x1:E0,y1:Yb,x2:E1,y2:Yb,stroke:css("--line")});el("line",{x1:E0,y1:Yt,x2:E0,y2:Yb,stroke:css("--line")});
for(let p=50;p<=100;p+=10){el("line",{x1:E0,x2:E1,y1:ey(p),y2:ey(p),stroke:css("--grid")});el("text",{x:E0-4,y:ey(p)+4,"text-anchor":"end","font-size":11},p);}
[0,0.4,0.8,1.2].forEach(b=>el("text",{x:ex(b),y:Yb+15,"text-anchor":"middle","font-size":11},fmt(b,1)));
let pe=[];for(let i=1;i<=48;i++){const b=1.2*i/48,e=Math.max(50,100*eta(b));pe.push(ex(b)+","+ey(e));}
el("polyline",{points:pe.join(" "),fill:"none",stroke:css("--fg"),"stroke-width":2});
if(bopt<=1.2){el("line",{x1:ex(bopt),x2:ex(bopt),y1:Yt,y2:Yb,stroke:css("--muted"),"stroke-dasharray":"4 4"});el("text",{x:ex(bopt)+3,y:Yt+12,"font-size":11},"βopt");}
if(beta>0)el("circle",{cx:ex(beta),cy:ey(Math.max(50,100*eta(beta))),r:6,fill:css("--hl2")});
const I2n=SN[0]/SN[1];
status("u<sub>X</sub> = √(u<sub>k</sub>² − u<sub>R</sub>²) = <b>"+fmt(uX,2)+" %</b>; I<sub>2n</sub> = "+fmt(I2n,2)+" A ("+SN[1]+" V-ra vonatkoztatva). "+
 "Feszültségváltozás: pontos (vektoros) <b>ε = "+fmt(epsP,2)+" %</b>, közelítő β(u<sub>R</sub>cos φ + u<sub>X</sub>sin φ) = "+fmt(epsK,2)+" % (eltérés "+fmt(epsP-epsK,3)+" %-pont); ΔU ≈ "+fmt(epsP/100*SN[1],1)+" V. "+
 (epsP<0?"<b>U2 > U20</b> – kapacitív terhelésnél feszültségemelkedés. ":"")+
 "Hatásfok: <b>η = "+(beta>0?fmt(100*eta(beta),1):"–")+" %</b>, β<sub>opt</sub> = √(P<sub>0</sub>/P<sub>k</sub>) = "+fmt(bopt,2)+".");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
