<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vegyes kapcsolás lépésenkénti egyszerűsítése</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="k">Lépés (1–7)</label><input id="k" type="range" min="1" max="7" step="1" value="1" aria-label="Lépés (1–7)"><output id="k_o" for="k"></output></div>
<div class="row"><label for="U">Feszültség U</label><input id="U" type="range" min="1" max="48" step="1" value="24" aria-label="Feszültség U"><output id="U_o" for="U"></output></div>
<div class="row"><label for="R1">R1</label><input id="R1" type="range" min="1" max="100" step="1" value="10" aria-label="R1"><output id="R1_o" for="R1"></output></div>
<div class="row"><label for="R2">R2</label><input id="R2" type="range" min="1" max="100" step="1" value="20" aria-label="R2"><output id="R2_o" for="R2"></output></div>
<div class="row"><label for="R3">R3</label><input id="R3" type="range" min="1" max="100" step="1" value="30" aria-label="R3"><output id="R3_o" for="R3"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 250" role="img" aria-label="Vegyes kapcsolás lépésenkénti egyszerűsítése: R2 és R3 párhuzamos eredője 12 Ω, ezzel sorosan R1, eredő 22 Ω, majd visszabontás az ágáramokig"></svg>
<p class="small">Szemléltetés (4.3, 1. példa): a lépés-csúszkával az egyszerűsítés (1–3) és a visszabontás (4–7) követhető; az ellenállások és a feszültség csúszkával állíthatók, a számok minden lépésben frissülnek. Alap: 24 V, 10 Ω, 20 Ω, 30 Ω → 22 Ω, 1,09 A.</p>
<script>
const NS="http://www.w3.org/2000/svg", S=document.getElementById("v"), ST=document.getElementById("status");
const UN={"k":"", "U":"V", "R1":"Ω", "R2":"Ω", "R3":"Ω"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;S.appendChild(e);return e;}
function status(h){ST.innerHTML=h;}
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});return v;}
function draw(){S.innerHTML="";const v=values();

const k=Math.round(v.k), R23=v.R2*v.R3/(v.R2+v.R3), Re=v.R1+R23, I=v.U/Re, U1=I*v.R1, U23=v.U-U1, I2=U23/v.R2, I3=U23/v.R3;
const P=v.U*I, P1=I*I*v.R1, P2=I2*I2*v.R2, P3=I3*I3*v.R3, ln=css("--line");
const w=(p,c,sw)=>el("polyline",{points:p.map(q=>q.join(",")).join(" "),fill:"none",stroke:c||ln,"stroke-width":sw||2});
const box=(x,y,bw,bh,lab,val,strong)=>{el("rect",{x:x,y:y,width:bw,height:bh,fill:strong?css("--grid"):css("--bg"),stroke:strong?css("--hl2"):ln,"stroke-width":strong?4:2});
  if(bh>bw){el("text",{x:x+bw+8,y:y+bh/2-3,"font-size":13,"font-weight":"bold"},lab);el("text",{x:x+bw+8,y:y+bh/2+13,"font-size":12},val);}
  else{el("text",{x:x+bw/2,y:y-8,"text-anchor":"middle","font-size":13,"font-weight":"bold"},lab+" = "+val);}};
const dot=(x,y,lab)=>{el("circle",{cx:x,cy:y,r:k==1?7:4.5,fill:k==1?css("--hl2"):ln});if(lab)el("text",{x:x-10,y:y-10,"text-anchor":"end","font-size":13,"font-weight":"bold"},lab);};
const T=40,B=210,X0=70;
// telep
w([[X0,T],[X0,117]]);w([[X0,131],[X0,B]]);el("line",{x1:X0-20,y1:117,x2:X0+20,y2:117,stroke:ln,"stroke-width":2.5});el("line",{x1:X0-11,y1:131,x2:X0+11,y2:131,stroke:ln,"stroke-width":5});
el("text",{x:X0-26,y:112,"text-anchor":"end","font-size":14},"+");el("text",{x:X0-24,y:150,"text-anchor":"end","font-size":12},fmt(v.U,0)+" V");
if(k===3){w([[X0,T],[300,T],[300,95]]);box(288,95,24,70,"Rₑ",fmt(Re,2)+" Ω",true);w([[300,165],[300,B],[X0,B]]);}
else{w([[X0,T],[130,T]]);box(130,28,90,24,"R1",fmt(v.R1,0)+" Ω"+(k>=5?"  ·  U1 = "+fmt(U1,2)+" V":""),false);w([[220,T],[300,T]]);
 if(k===2){w([[300,T],[300,95]]);box(288,95,24,70,"R23",fmt(R23,2)+" Ω",true);w([[300,165],[300,B],[X0,B]]);dot(300,T,"A");dot(300,B,"B");}
 else{w([[300,T],[440,T]]);w([[300,T],[300,95]]);box(288,95,24,70,"R2",fmt(v.R2,0)+" Ω",false);w([[300,165],[300,B]]);
  w([[440,T],[440,95]]);box(428,95,24,70,"R3",fmt(v.R3,0)+" Ω",false);w([[440,165],[440,B],[X0,B]]);dot(300,T,"A");dot(300,B,"B");
  if(k>=6){el("text",{x:340,y:200,"font-size":12,fill:css("--hl")},"I2 = "+fmt(I2,3)+" A");el("text",{x:480,y:200,"font-size":12,fill:css("--hl")},"I3 = "+fmt(I3,3)+" A");}
  if(k>=5)el("text",{x:370,y:232,"text-anchor":"middle","font-size":12,fill:css("--hl")},"U23 = "+fmt(U23,2)+" V");}}
if(k>=4)el("text",{x:X0+8,y:T+20,"font-size":12,fill:css("--hl")},"I = "+fmt(I,3)+" A →");
const msg=["",
 "1. Csomópontok: A (R1 jobb vége, R2 és R3 teteje) és B (alsó sín). R2 és R3 mindkét vége ugyanarra a két csomópontra csatlakozik, ezért párhuzamosak; R1 ezzel a csoporttal sorban van.",
 "2. Párhuzamos csoport összevonása: R23 = R2·R3/(R2+R3) = "+fmt(R23,2)+" Ω.",
 "3. Soros összevonás: Rₑ = R1 + R23 = "+fmt(Re,2)+" Ω.",
 "4. Teljes áram: I = U/Rₑ = "+fmt(v.U,0)+" V / "+fmt(Re,2)+" Ω = "+fmt(I,3)+" A.",
 "5. Visszabontás: U1 = I·R1 = "+fmt(U1,2)+" V; U23 = U − U1 = "+fmt(U23,2)+" V.",
 "6. Ágáramok: I2 = U23/R2 = "+fmt(I2,3)+" A, I3 = U23/R3 = "+fmt(I3,3)+" A; I2 + I3 = "+fmt(I2+I3,3)+" A = I.",
 "7. Teljesítmény-mérleg: P = U·I = "+fmt(P,2)+" W; P1 + P2 + P3 = "+fmt(P1,2)+" + "+fmt(P2,2)+" + "+fmt(P3,2)+" = "+fmt(P1+P2+P3,2)+" W – a mérleg zár."];
status(msg[k]);

}
document.querySelectorAll("input[type=range]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
