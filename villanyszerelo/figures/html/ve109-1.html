<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ívoltás váltakozó és egyenáramon</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="t0">Nyitás időpontja a periódusban</label><input id="t0" type="range" min="0" max="9.8" step="0.1" value="2" aria-label="Nyitás időpontja a periódusban"><output id="t0_o" for="t0"></output></div>
<div class="row"><label for="n">Részívek (deionlemez-rések) száma</label><input id="n" type="range" min="1" max="12" step="1" value="6" aria-label="Részívek (deionlemez-rések) száma"><output id="n_o" for="n"></output></div>
<div class="row"><label for="U">DC tápfeszültség</label><input id="U" type="range" min="24" max="220" step="2" value="220" aria-label="DC tápfeszültség"><output id="U_o" for="U"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 650 330" role="img" aria-label="Váltakozó áramon az ív az áram nullaátmeneténél kialszik, ha a rés szilárdsága gyorsabban nő a visszatérő feszültségnél; egyenáramon a deionkamra az ívfeszültséget a tápfeszültség fölé emeli, és az áram nullára csökken."></svg>
<p class="small">Szemléltető modell, nem gyártói adat (ellenőrizendő): részívenként ≈ 150 V gyors szilárdság-visszatérés (AC) és ≈ 25 V ívfeszültség (DC); a visszatérő feszültség csillapított 5 kHz-es lengés. A valós értékek a készülék szerkezetétől függnek.</p>
<script>
const NS="http://www.w3.org/2000/svg", S=document.getElementById("v"), ST=document.getElementById("status");
const UN={"t0":"ms", "n":"db", "U":"V"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;S.appendChild(e);return e;}
function status(h){ST.innerHTML=h;}
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});return v;}
function draw(){S.innerHTML="";const v=values();

const UP=325,IP=10,F0=5000,TR=0.15e-3,TD=0.03e-3,PG=150,R=22,L=0.05,PD=25,TAU=L/R;
const ur=t=>UP*(1-Math.exp(-t/TR)*Math.cos(2*Math.PI*F0*t));
const ud=(t,n,s)=>n*PG*(1-Math.exp(-t/TD))*Math.min(1,s/1e-3);
function clears(n,t0){let k=Math.floor(t0/0.01)+1;for(let j=0;j<6;j++){const tz=k*0.01;let ok=true;for(let q=1;q<=400;q++){const t=q*2.5e-6;if(ud(t,n,tz-t0)<ur(t)){ok=false;break;}}if(ok)return tz;k++;}return null;}
const t0=v.t0/1000, tz=clears(v.n,t0);
// AC panel
const X0=50,W=250,Y0=90,H=60,TM=0.04,X=t=>X0+W*t/TM,Y=i=>Y0-H*i/IP;
el("text",{x:10,y:16,"font-size":13,"font-weight":"bold"},"Váltakozó áram (230 V, 10 A)");
el("line",{x1:X0,x2:X0+W,y1:Y0,y2:Y0,stroke:css("--grid")});
if(tz)el("rect",{x:X(t0),y:Y0-H,width:X(tz)-X(t0),height:2*H,fill:css("--grid"),opacity:.6});
let d="";for(let k=0;k<=400;k++){const t=TM*k/400,i=(tz===null||t<tz)?IP*Math.sin(2*Math.PI*50*t):0;d+=(k?"L":"M")+X(t).toFixed(1)+" "+Y(i).toFixed(1);}
el("path",{d:d,fill:"none",stroke:css("--fg"),"stroke-width":2.2});
el("line",{x1:X(t0),x2:X(t0),y1:Y0-H,y2:Y0+H,stroke:css("--hl2"),"stroke-dasharray":"4 3"});el("text",{x:X(t0)+3,y:Y0+H+14,"font-size":11},"nyitás");
for(let t=0;t<=0.04;t+=0.01)el("text",{x:X(t),y:Y0+H+28,"text-anchor":"middle","font-size":11},String(Math.round(t*1000)));
el("text",{x:X0+W+12,y:Y0+H+28,"font-size":11},"ms");
// TRV panel
const XB=50,WB=250,YB=310,HB=90,TB=0.6e-3,XX=t=>XB+WB*t/TB,YY=u=>YB-HB*u/1000;
const zt=Math.floor(t0/0.01)*0.01+0.01;
el("text",{x:10,y:200,"font-size":12,"font-weight":"bold"},"Az első nullaátmenet után (0–0,6 ms)");
el("line",{x1:XB,x2:XB+WB,y1:YB,y2:YB,stroke:css("--line")});el("line",{x1:XB,x2:XB,y1:YB,y2:YY(1000),stroke:css("--line")});
for(const u of [0,500,1000])el("text",{x:XB-4,y:YY(u)+4,"text-anchor":"end","font-size":11},String(u));
el("text",{x:XB-4,y:YY(1000)-8,"text-anchor":"start","font-size":11},"V");
for(const q of [0,0.2,0.4,0.6])el("text",{x:XX(q*1e-3),y:YB+14,"text-anchor":"middle","font-size":11},String(q).replace(".",","));
el("text",{x:XB+WB+12,y:YB+14,"font-size":11},"ms");
let a="",b="";for(let k=0;k<=200;k++){const t=TB*k/200;a+=(k?"L":"M")+XX(t).toFixed(1)+" "+YY(ur(t)).toFixed(1);b+=(k?"L":"M")+XX(t).toFixed(1)+" "+YY(ud(t,v.n,zt-t0)).toFixed(1);}
el("path",{d:a,fill:"none",stroke:css("--fg"),"stroke-width":2.2});el("path",{d:b,fill:"none",stroke:css("--hl"),"stroke-width":2.2,"stroke-dasharray":"7 4"});
el("text",{x:XB+WB+4,y:YY(ur(TB))+4,"font-size":11},"u_r");el("text",{x:XB+WB+4,y:YY(ud(TB,v.n,zt-t0))+4,"font-size":11,fill:css("--hl")},"szilárdság");
// DC panel
const XC=380,WC=220,YC=300,HC=200,TC=0.015,XC_=t=>XC+WC*t/TC,YC_=i=>YC-HC*i/11;
const I0=v.U/R, ua=v.n*PD;
el("text",{x:370,y:16,"font-size":13,"font-weight":"bold"},"Egyenáram (R = 22 Ω, L = 50 mH)");
el("line",{x1:XC,x2:XC+WC,y1:YC,y2:YC,stroke:css("--line")});el("line",{x1:XC,x2:XC,y1:YC,y2:YC-HC,stroke:css("--line")});
for(let i=0;i<=10;i+=2)el("text",{x:XC-4,y:YC_(i)+4,"text-anchor":"end","font-size":11},String(i));
for(let t=0;t<=0.015;t+=0.005)el("text",{x:XC_(t),y:YC+14,"text-anchor":"middle","font-size":11},String(Math.round(t*1000)));
el("text",{x:XC+WC+10,y:YC+14,"font-size":11},"ms");el("text",{x:XC+4,y:YC-HC-6,"font-size":11},"áram (A)");
const ton=ua>v.U?TAU*Math.log((I0*R+ua-v.U)/(ua-v.U)):null, iinf=(v.U-ua)/R;
let c="";for(let k=0;k<=300;k++){const t=TC*k/300;let i=iinf+(I0-iinf)*Math.exp(-t/TAU);if(ton!==null&&t>=ton)i=0;c+=(k?"L":"M")+XC_(t).toFixed(1)+" "+YC_(Math.max(i,0)).toFixed(1);}
el("path",{d:c,fill:"none",stroke:css("--hl2"),"stroke-width":2.5});
let s="<b>AC:</b> "+(tz===null?'<span class="bad">az ív 3 periódus alatt sem alszik ki (kevés részív)</span>':(Math.abs(tz-zt)<1e-9?'<span class="ok">az első nullaátmenetnél ('+fmt(tz*1000,0)+' ms) kialszik</span>':'<span class="bad">az első nullaátmenet után újragyullad</span>, végleg '+fmt(tz*1000,0)+' ms-nál alszik ki'))+
 " (rés szilárdsága ≈ "+fmt(v.n*PG*Math.min(1,(zt-t0)/1e-3),0)+" V, u_r csúcs ≈ 500 V). ";
s+="<b>DC:</b> u<sub>ív</sub> ≈ "+v.n+" · 25 V = <b>"+ua+" V</b>, U = "+v.U+" V: "+(ton!==null?'<span class="ok">az áram '+fmt(ton*1000,1)+' ms alatt nullára csökken</span>':'<span class="bad">u<sub>ív</sub> ≤ U: az ív tovább ég ('+fmt(iinf,1)+' A)</span>')+".";
status(s);

}
document.querySelectorAll("input[type=range]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
