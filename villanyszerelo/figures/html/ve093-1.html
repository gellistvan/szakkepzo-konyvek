<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motorazonosító: pólusszám és szlip az adattáblából</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="n">Névleges fordulatszám n</label><input id="n" type="range" min="600" max="3000" step="5" value="1450" aria-label="Névleges fordulatszám n"><output id="n_o" for="n"></output></div>
<div class="row"><label for="f">Frekvencia</label><select id="f" aria-label="Frekvencia"><option value="50" selected>50 Hz</option><option value="60">60 Hz</option></select></div>
<div class="row"><label for="src">Adattábla (a motortáblából)</label><select id="src" aria-label="Adattábla (a motortáblából)"><option value="0" selected>kézi beállítás (csúszka)</option><option value="1">0,75 kW, 4 pólus – 1435 1/min</option><option value="2">1,5 kW, 4 pólus – 1440 1/min</option><option value="3">2,2 kW, 4 pólus – 1450 1/min</option><option value="4">3,0 kW, 4 pólus – 1450 1/min</option><option value="5">4,0 kW, 4 pólus – 1460 1/min</option><option value="6">5,5 kW, 4 pólus – 1465 1/min</option><option value="7">7,5 kW, 4 pólus – 1470 1/min</option><option value="8">11,0 kW, 4 pólus – 1475 1/min</option><option value="9">15,0 kW, 4 pólus – 1475 1/min</option><option value="10">3,0 kW, 2 pólus – 2900 1/min</option><option value="11">2,2 kW, 6 pólus – 960 1/min</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Motorazonosító: a névleges fordulatszámból és a frekvenciából a szinkron fordulatszám, a pólusszám, a szlip és a rotorfrekvencia, számegyenesen ábrázolva"></svg>
<p class="small">Motorazonosító (26.1): az adattábla névleges fordulatszámából a szinkron fordulatszám a következő nagyobb 60·f/p érték; ebből a pólusszám és a szlip. A legördülőben a könyv motortáblájának (26.2) adattábla-fordulatszámai.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"n":"1/min"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const TABLA = [[0.75, 4, 1435], [1.5, 4, 1440], [2.2, 4, 1450], [3.0, 4, 1450], [4.0, 4, 1460], [5.5, 4, 1465], [7.5, 4, 1470], [11.0, 4, 1475], [15.0, 4, 1475], [3.0, 2, 2900], [2.2, 6, 960]];
let n = v.n; if (+v.src > 0) n = TABLA[+v.src - 1][2];
const f = +v.f, p = Math.floor(60 * f / n), ns = 60 * f / p, s = (ns - n) / ns, fr = s * f;
const X = x => 30 + 500 * x / 3700, Y0 = 170;
el("line", {x1: X(0), x2: X(3700), y1: Y0, y2: Y0, stroke: css("--line"), "stroke-width": 1.5});
for (let q = 1; q <= 10; q++) { const val = 60 * f / q; if (val < 700 && q !== p) continue;
  const on = q === p;
  el("line", {x1: X(val), x2: X(val), y1: Y0 - 60, y2: Y0 + 8, stroke: on ? css("--hl2") : css("--grid"), "stroke-width": on ? 3 : 1.2, "stroke-dasharray": on ? "" : "4 3"});
  el("text", {x: X(val), y: Y0 - 66, "text-anchor": "middle", "font-size": 11, "font-weight": on ? "bold" : "normal"}, fmt(val, 0));
  el("text", {x: X(val), y: Y0 + 24, "text-anchor": "middle", "font-size": 10}, (2 * q) + " p.");
}
for (let t = 0; t <= 3500; t += 500) el("text", {x: X(t), y: Y0 + 44, "text-anchor": "middle", "font-size": 10}, String(t));
el("text", {x: X(1850), y: Y0 + 64, "text-anchor": "middle", "font-size": 11}, "1/min (felül: szinkron fordulatszámok, alattuk a pólusszám)");
el("circle", {cx: X(n), cy: Y0 - 25, r: 5, fill: css("--hl")});
el("line", {x1: X(n), x2: X(ns) - 6, y1: Y0 - 25, y2: Y0 - 25, stroke: css("--hl"), "stroke-width": 2.5});
el("polygon", {points: `${X(ns)},${Y0 - 25} ${X(ns) - 9},${Y0 - 30} ${X(ns) - 9},${Y0 - 20}`, fill: css("--hl")});
el("text", {x: X(n), y: Y0 - 36, "text-anchor": "end", "font-size": 12, "font-weight": "bold"}, "n = " + fmt(n, 0));
el("text", {x: 20, y: 30, "font-size": 13}, `n_s = ${fmt(ns, 0)} 1/min → p = ${p}, 2p = ${2 * p} pólus`);
el("text", {x: 20, y: 52, "font-size": 13}, `s = (${fmt(ns, 0)} − ${fmt(n, 0)}) / ${fmt(ns, 0)} = ${fmt(100 * s, 1)} %,  f_r = s·f = ${fmt(fr, 2)} Hz`);
let warn = "";
if (s <= 0) warn = " <b>Figyelem:</b> a névleges fordulatszám nem érheti el a szinkron fordulatszámot – aszinkronmotornál ez nem lehet névleges adat.";
else if (s > 0.10) warn = " <b>Figyelem: s > 10 %</b> – nem valószínű névleges adat, nézd meg újra a pólusszámot (vagy az adattáblát).";
status("A szinkron fordulatszám a névlegesnél <b>következő nagyobb</b> 60·f/p érték: p = ⌊60·" + f + "/" + fmt(n, 0) + "⌋ = " + p +
       "; n<sub>s</sub> = " + fmt(ns, 0) + " 1/min, s = " + fmt(100 * s, 1) + " %, rotorfrekvencia f<sub>r</sub> = " + fmt(fr, 2) + " Hz." + warn);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
