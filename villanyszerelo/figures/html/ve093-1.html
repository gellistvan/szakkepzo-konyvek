<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szinkron fordulatszám-kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="f">Frekvencia f</label><input id="f" type="range" min="10" max="100" step="1" value="50" aria-label="Frekvencia f"><output id="f_o" for="f"></output></div>
<div class="row"><label for="p">Póluspárszám p</label><input id="p" type="range" min="1" max="6" step="1" value="2" aria-label="Póluspárszám p"><output id="p_o" for="p"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Oszlopdiagram a szinkron fordulatszámról a póluspárszám függvényében, és egy forgó vektor a forgó mágneses mező szemléltetésére"></svg>
<p class="small">Szemléltetés: nₛ = 60·f/p (26.1). A számolt érték a mező fordulatszáma; a terhelt motor a szlip miatt valamivel lassabb. A forgó vektor szemléltető, lassított animáció (3000 1/min = 1 ford./s a képernyőn).</p>
<script>
const NS="http://www.w3.org/2000/svg", S=document.getElementById("v"), ST=document.getElementById("status");
const UN={"f":"Hz", "p":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;S.appendChild(e);return e;}
function status(h){ST.innerHTML=h;}
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});return v;}
function draw(){S.innerHTML="";const v=values();

const ns=60*v.f/v.p, w=2*Math.PI*ns/60, base=3000*2;   // az oszlopok skálája: legfeljebb 6000 1/min (10 Hz..100 Hz, p=1)
const X0=40, Y0=250, H=190, BW=34, GAP=14;
el("line",{x1:X0-6,x2:X0+6*(BW+GAP),y1:Y0,y2:Y0,stroke:css("--line"),"stroke-width":1.5});
for(let q=1;q<=6;q++){
  const val=60*v.f/q, h=H*Math.min(1,val/base), x=X0+(q-1)*(BW+GAP), sel=(q===v.p);
  el("rect",{x:x,y:Y0-h,width:BW,height:h,fill:sel?css("--hl2"):css("--grid"),stroke:css("--line"),"stroke-width":sel?2.5:1});
  el("text",{x:x+BW/2,y:Y0-h-5,"text-anchor":"middle","font-size":11},fmt(val,0));
  el("text",{x:x+BW/2,y:Y0+15,"text-anchor":"middle","font-size":12},String(2*q));
}
el("text",{x:X0+3*(BW+GAP),y:Y0+34,"text-anchor":"middle","font-size":12},"pólusszám 2p");
el("text",{x:X0,y:28,"font-size":12},"nₛ (1/min), f = "+fmt(v.f,0)+" Hz");
// forgó vektor
const cx=430, cy=140, R=85;
el("circle",{cx:cx,cy:cy,r:R,fill:"none",stroke:css("--line"),"stroke-width":1.5});
for(let k=0;k<2*v.p;k++){const a=k*Math.PI/v.p;el("circle",{cx:cx+R*Math.cos(a),cy:cy-R*Math.sin(a),r:4,fill:css("--grid"),stroke:css("--line")});}
const ln=el("line",{x1:cx,y1:cy,x2:cx+R-8,y2:cy,stroke:css("--hl2"),"stroke-width":4});
el("text",{x:cx,y:cy+R+26,"text-anchor":"middle","font-size":12},"forgó mező (lassított szemléltetés)");
if(window.__raf)cancelAnimationFrame(window.__raf);
const t0=performance.now(), rate=ns/3000;   // 3000 1/min-nek felel meg 1 ford./s a képernyőn
const step=t=>{const ang=-((t-t0)/1000)*rate*360;ln.setAttribute("transform","rotate("+ang+" "+cx+" "+cy+")");window.__raf=requestAnimationFrame(step);};
window.__raf=requestAnimationFrame(step);
status("<b>n<sub>s</sub> = 60·f/p = 60·"+fmt(v.f,0)+"/"+v.p+" = "+fmt(ns,0)+" 1/min</b> ("+fmt(w,1)+" rad/s); pólusszám 2p = "+2*v.p+". 50 Hz-en: 3000 / 1500 / 1000 / 750 1/min (2/4/6/8 pólus).");

}
document.querySelectorAll("input[type=range]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
