<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y-Δ indítás: átkapcsolási idő és áram</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="ts">Átkapcsolási idő</label><input id="ts" type="range" min="2" max="15" step="0.5" value="8" aria-label="Átkapcsolási idő"><output id="ts_o" for="ts"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 320" role="img" aria-label="Idő–áram–fordulatszám diagram Y-Δ indításnál; az átkapcsolási idő csúszkával állítható"></svg>
<p class="small">Tanulási modell, nem mért görbe (ellenőrizendő): a számpéldák a fejezetből (11 kW, 21 A, 6·In, 2,2·Mn; Y-ban az áram és a nyomaték a deltás harmada), a görbe alakja és a 70–80 A-es csúcs tájékoztató. A tényleges időt lakatfogós méréssel kell beállítani.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"ts":"s"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const IN=21, ID=126, NY=.97, T1=3.5, T2=1.5, TI=.6, NF=.985;
const X0=55,Y0=270,W=440,H=220,TM=21,YM=130, X=t=>X0+W*t/TM, Y=a=>Y0-H*a/YM;
const nsw=NY*(1-Math.exp(-v.ts/T1)), pk=IN+(ID-IN)*Math.pow(1-nsw,.35);
const nn=t=>t<v.ts?NY*(1-Math.exp(-t/T1)):nsw+(NF-nsw)*(1-Math.exp(-(t-v.ts)/T2));
const ii=t=>t<v.ts?7+35*Math.pow(1-nn(t),2):IN+(pk-IN)*Math.exp(-(t-v.ts)/TI);
el("line",{x1:X0,x2:X0+W,y1:Y0,y2:Y0,stroke:css("--line"),"stroke-width":1.5});el("line",{x1:X0,x2:X0,y1:Y0,y2:Y(YM),stroke:css("--line"),"stroke-width":1.5});
el("line",{x1:X0+W,x2:X0+W,y1:Y0,y2:Y(YM),stroke:css("--hl2"),"stroke-width":1.5});
for(let t=0;t<=20;t+=5)el("text",{x:X(t),y:Y0+16,"text-anchor":"middle","font-size":11},String(t));
for(let a=0;a<=125;a+=25){el("text",{x:X0-6,y:Y(a)+4,"text-anchor":"end","font-size":11},String(a));el("text",{x:X0+W+6,y:Y(a)+4,"font-size":11,fill:css("--hl2")},String(a));el("line",{x1:X0,x2:X0+W,y1:Y(a),y2:Y(a),stroke:css("--grid")});}
el("text",{x:X0+W/2,y:Y0+34,"text-anchor":"middle","font-size":12},"idő (s)");
el("text",{x:X0,y:Y(YM)-8,"font-size":12},"áram (A) – fekete");el("text",{x:X0+W,y:Y(YM)-8,"text-anchor":"end","font-size":12,fill:css("--hl2")},"fordulatszám (%) – narancs");
el("line",{x1:X0,x2:X0+W,y1:Y(85),y2:Y(85),stroke:css("--hl2"),"stroke-dasharray":"3 4"});
el("line",{x1:X(v.ts),x2:X(v.ts),y1:Y0,y2:Y(YM),stroke:css("--fg"),"stroke-dasharray":"2 4"});
el("text",{x:X(v.ts)+4,y:Y(YM)+12,"font-size":11},"átkapcsolás");
let di="",dn="";for(let i=0;i<=500;i++){const t=TM*i/500;di+=(i?"L":"M")+X(t)+" "+Y(ii(t));dn+=(i?"L":"M")+X(t)+" "+Y(nn(t)*100);}
el("path",{d:di,fill:"none",stroke:css("--line"),"stroke-width":2.5});el("path",{d:dn,fill:"none",stroke:css("--hl2"),"stroke-width":2.5,"stroke-dasharray":"8 4"});
const ok=nsw>=.85;
status("Y-ban: <b>"+fmt(ID/3,0)+" A</b> (a deltás indítás 126 A-ének harmada), nyomaték <b>"+fmt(2.2/3,2)+"·Mn</b>. Átkapcsoláskor n = <b>"+fmt(nsw*100,0)+" %</b>, áramcsúcs ≈ <b>"+fmt(pk,0)+" A</b>, utána deltában 21 A. "+
 (v.ts<5?'<span class="bad">Túl korai: alacsony fordulatszám, nagy áramlökés – közel a közvetlen indításhoz.</span>':(ok?(v.ts>12?'<span class="bad">Túl hosszú: csillagban a motor már nem gyorsul tovább, csak melegszik.</span>':'<span class="ok">Jó beállítás: n &gt; 85 %, kis áramlökés.</span>'):'<span class="bad">Az átkapcsolás előtt a fordulatszám még &lt; 85 %.</span>')));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
