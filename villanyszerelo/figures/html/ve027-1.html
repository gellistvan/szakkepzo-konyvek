<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgó mágneses mező keletkezése</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="th">Szöghelyzet ωt</label><input id="th" type="range" min="0" max="360" step="1" value="0" aria-label="Szöghelyzet ωt"><output id="th_o" for="th"></output></div>
<div class="row"><label for="sw">L2–L3 csere (0 = nem, 1 = igen)</label><input id="sw" type="range" min="0" max="1" step="1" value="0" aria-label="L2–L3 csere (0 = nem, 1 = igen)"><output id="sw_o" for="sw"></output></div>
<div class="row"><label for="f">Frekvencia f</label><input id="f" type="range" min="10" max="60" step="1" value="50" aria-label="Frekvencia f"><output id="f_o" for="f"></output></div>
<div class="row"><label for="p">Póluspárok száma p</label><input id="p" type="range" min="1" max="4" step="1" value="1" aria-label="Póluspárok száma p"><output id="p_o" for="p"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="Három, egymáshoz képest 120°-ra elhelyezett tekercs mezőjéből összegződő, állandó nagyságú, forgó mágneses mező; az időkurzor a három fázisáram pillanatértékét mutatja."></svg>
<p class="small">L1 (U tekercs) barna folytonos, L2 (V) fekete szaggatott, L3 (W) szürke pontvonal; a vastag kék nyíl (B) az eredő mező, a függőleges vonal az időkurzor. Számolt értékek: i_k = sin(ωt − k·120°), az eredő mindig 1,5·B_max. Kétpólusú gépen (p = 1) 50 Hz-en n_s = 3000 1/min.</p>
<script>
const NS="http://www.w3.org/2000/svg", S=document.getElementById("v"), ST=document.getElementById("status");
const UN={"th":"°", "sw":"", "f":"Hz", "p":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;S.appendChild(e);return e;}
function status(h){ST.innerHTML=h;}
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});return v;}
function draw(){S.innerHTML="";const v=values();

if(!document.getElementById("playbtn")){const b=document.createElement("button");b.id="playbtn";b.textContent="▶ Lejátszás";
 b.style.cssText="font:inherit;padding:4px 12px;margin:4px 0";let timer=null;
 b.onclick=()=>{const sl=document.getElementById("th");if(timer){clearInterval(timer);timer=null;b.textContent="▶ Lejátszás";return;}
  b.textContent="⏸ Szünet";timer=setInterval(()=>{sl.value=(+sl.value+2)%360;draw();},50);};
 document.getElementById("status").before(b);}
const r=Math.PI/180, th=v.th*r, sw=v.sw==1, ax=[0,120,240].map(a=>a*r);
const sh=sw?[0,240,120]:[0,120,240];
const col=["#8d5524",css("--line"),"#8a8a8a"], dash=["","7 4","2 4"], nm=["U","V","W"];
const cx=140, cy=150, R=110, k=55;
el("circle",{cx:cx,cy:cy,r:R,fill:"none",stroke:css("--line"),"stroke-width":2});
let Bx=0, By=0; const ii=[];
for(let q=0;q<3;q++){const c=Math.cos(ax[q]), s=Math.sin(ax[q]);
 el("line",{x1:cx-R*c,y1:cy+R*s,x2:cx+R*c,y2:cy-R*s,stroke:css("--grid"),"stroke-dasharray":"6 3 1 3"});
 el("text",{x:cx+(R+14)*c-5,y:cy-(R+14)*s+5,"font-size":14,"font-weight":"bold"},nm[q]);
 const i=Math.sin(th-sh[q]*r); ii.push(i); Bx+=i*c; By+=i*s;
 el("line",{x1:cx,y1:cy,x2:cx+k*i*c,y2:cy-k*i*s,stroke:col[q],"stroke-width":3,"stroke-dasharray":dash[q]});}
el("line",{x1:cx,y1:cy,x2:cx+k*Bx,y2:cy-k*By,stroke:css("--hl"),"stroke-width":7});
el("circle",{cx:cx+k*Bx,cy:cy-k*By,r:7,fill:css("--hl")});
el("text",{x:cx+k*Bx*1.12-4,y:cy-k*By*1.12+5,"font-size":13,"font-weight":"bold",fill:css("--hl")},"B");
const X0=300, XW=330, Y0=150, A=90;
el("line",{x1:X0,y1:Y0,x2:X0+XW,y2:Y0,stroke:css("--grid")});
for(let q=0;q<3;q++){let d="";for(let j=0;j<=180;j++){const a=j*2*r, x=X0+XW*j/180, y=Y0-A*Math.sin(a-sh[q]*r);d+=(j?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);}
 el("path",{d:d,fill:"none",stroke:col[q],"stroke-width":2,"stroke-dasharray":dash[q]});
 el("line",{x1:X0+XW-95,y1:16+16*q,x2:X0+XW-65,y2:16+16*q,stroke:col[q],"stroke-width":2.5,"stroke-dasharray":dash[q]});
 el("text",{x:X0+XW-60,y:20+16*q,"font-size":12},"i"+(q+1)+" ("+nm[q]+")");}
const xc=X0+XW*v.th/360;
el("line",{x1:xc,y1:40,x2:xc,y2:270,stroke:css("--hl2"),"stroke-width":1.5});
el("text",{x:X0+XW,y:290,"font-size":11,"text-anchor":"end"},"ωt (°) → 360");
const ns=60*v.f/v.p, ang=(Math.atan2(By,Bx)/r+360)%360;
status("Eredő mező: |B| = <b>"+fmt(Math.hypot(Bx,By),2)+"·B<sub>max</sub></b> (állandó), iránya <b>"+fmt(ang,0)+"°</b>; forgásirány: <b>"
 +(sw?"az óramutató járásával megegyező (L1–L3–L2, negatív sorrend)":"az óramutatóval ellentétes (L1–L2–L3, pozitív sorrend)")+"</b><br>"
 +"i1 = "+fmt(ii[0],2)+", i2 = "+fmt(ii[1],2)+", i3 = "+fmt(ii[2],2)+" (I<sub>max</sub> egységben); szinkron fordulatszám n<sub>s</sub> = 60·f/p = <b>"+fmt(ns,0)+" 1/min</b>");

}
document.querySelectorAll("input[type=range]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
