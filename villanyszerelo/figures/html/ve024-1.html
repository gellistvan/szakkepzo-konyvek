<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Háromfázisú fázorok és időfüggvények</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="t">Idő t</label><input id="t" type="range" min="0" max="40" step="0.2" value="0" aria-label="Idő t"><output id="t_o" for="t"></output></div>
<div class="row"><label for="pr">Fázispár (0 = L1–L2, 1 = L2–L3, 2 = L3–L1)</label><input id="pr" type="range" min="0" max="2" step="1" value="0" aria-label="Fázispár (0 = L1–L2, 1 = L2–L3, 2 = L3–L1)"><output id="pr_o" for="pr"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="Háromfázisú fázorcsillag és a fázisfeszültségek időfüggvénye; a vonali feszültség két fázisfeszültség különbsége, csúcsértéke 563 V."></svg>
<p class="small">u1 folytonos, u2 szaggatott, u3 pontvonal; a vastag színes görbe és a fázorcsillag vastag szakasza a kiválasztott vonali feszültség. A pillanatérték a forgó fázor függőleges vetülete (a vízszintes szaggatott segédvonalak). Számolt értékek: Û = √2·230 V ≈ 325 V, 50 Hz.</p>
<script>
const NS="http://www.w3.org/2000/svg", S=document.getElementById("v"), ST=document.getElementById("status");
const UN={"t":"ms", "pr":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;S.appendChild(e);return e;}
function status(h){ST.innerHTML=h;}
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});return v;}
function draw(){S.innerHTML="";const v=values();

if(!document.getElementById("playbtn")){const b=document.createElement("button");b.id="playbtn";b.textContent="▶ Lejátszás";
 b.style.cssText="font:inherit;padding:4px 12px;margin:4px 0";let timer=null;
 b.onclick=()=>{const sl=document.getElementById("t");if(timer){clearInterval(timer);timer=null;b.textContent="▶ Lejátszás";return;}
  b.textContent="⏸ Szünet";timer=setInterval(()=>{sl.value=((+sl.value+0.2)%40).toFixed(1);draw();},60);};
 document.getElementById("status").before(b);}
const UH=Math.SQRT2*230, w=2*Math.PI*50, tt=v.t/1000, ph=[0,-2*Math.PI/3,2*Math.PI/3];
const a=Math.round(v.pr), b=(a+1)%3, names=["L1","L2","L3"];
const dash=["","8 5","2 4"];
const cx=120, cy=150, R=78, k=R/UH, X0=250, XW=380, xc=X0+XW*v.t/40;
el("circle",{cx:cx,cy:cy,r:R,fill:"none",stroke:css("--grid"),"stroke-dasharray":"2 3"});
el("line",{x1:cx-120,y1:cy,x2:cx+120,y2:cy,stroke:css("--grid")});
el("line",{x1:cx,y1:cy-140,x2:cx,y2:cy+140,stroke:css("--grid")});
const tip=[];
for(let i=0;i<3;i++){const ang=w*tt+ph[i], x=cx+R*Math.cos(ang), y=cy-R*Math.sin(ang);tip.push([x,y]);
 el("line",{x1:cx,y1:cy,x2:x,y2:y,stroke:css("--line"),"stroke-width":2.5,"stroke-dasharray":dash[i]});
 el("circle",{cx:x,cy:y,r:4,fill:css("--line")});
 el("text",{x:cx+1.2*R*Math.cos(ang)-6,y:cy-1.2*R*Math.sin(ang)+5,"font-size":13},"U"+(i+1));
 el("line",{x1:x,y1:y,x2:xc,y2:y,stroke:css("--grid"),"stroke-dasharray":"3 3"});}
el("line",{x1:tip[b][0],y1:tip[b][1],x2:tip[a][0],y2:tip[a][1],stroke:css("--hl2"),"stroke-width":4});
// időtengely: 250..630 px = 0..40 ms
const ys=q=>cy-q*k;
el("line",{x1:X0,y1:cy,x2:X0+XW,y2:cy,stroke:css("--grid")});
[563,325,-325,-563].forEach(q=>{el("line",{x1:X0,y1:ys(q),x2:X0+XW,y2:ys(q),stroke:css("--grid"),"stroke-dasharray":"1 4"});
 el("text",{x:X0-4,y:ys(q)+4,"font-size":10,"text-anchor":"end"},String(q).replace("-","−"));});
for(let i=0;i<3;i++){let d="";for(let j=0;j<=200;j++){const s=j*0.0002, x=X0+XW*j/200, y=ys(UH*Math.sin(w*s+ph[i]));d+=(j?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);}
 el("path",{d:d,fill:"none",stroke:css("--line"),"stroke-width":1.4,"stroke-dasharray":dash[i]});}
let d="";for(let j=0;j<=200;j++){const s=j*0.0002, x=X0+XW*j/200, y=ys(UH*(Math.sin(w*s+ph[a])-Math.sin(w*s+ph[b])));d+=(j?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);}
el("path",{d:d,fill:"none",stroke:css("--hl2"),"stroke-width":3});
el("line",{x1:xc,y1:5,x2:xc,y2:295,stroke:css("--hl"),"stroke-width":1.5});
el("text",{x:X0+XW,y:292,"font-size":11,"text-anchor":"end"},"t (ms) → 40");
const ui=[0,1,2].map(i=>UH*Math.sin(w*tt+ph[i])), uab=ui[a]-ui[b];
status("u1 = <b>"+fmt(ui[0],0)+" V</b>, u2 = <b>"+fmt(ui[1],0)+" V</b>, u3 = <b>"+fmt(ui[2],0)+" V</b>; "
 +"u"+(a+1)+(b+1)+" = u"+(a+1)+" − u"+(b+1)+" = <b>"+fmt(uab,0)+" V</b> ("+names[a]+"–"+names[b]+")<br>"
 +"|U<sub>v</sub>| = √3·U<sub>f</sub> = √3·230 V ≈ <b>"+fmt(Math.sqrt(3)*230,1)+" V</b> effektív, csúcsérték ≈ "+fmt(Math.sqrt(3)*UH,0)+" V");

}
document.querySelectorAll("input[type=range]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
