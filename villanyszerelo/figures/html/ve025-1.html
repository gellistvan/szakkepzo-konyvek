<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csillag–delta kapcsolás kalkulátor</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="Uv">Vonali feszültség Uv</label><input id="Uv" type="range" min="100" max="700" step="1" value="400" aria-label="Vonali feszültség Uv"><output id="Uv_o" for="Uv"></output></div>
<div class="row"><label for="R">Fázisellenállás R</label><input id="R" type="range" min="10" max="500" step="1" value="100" aria-label="Fázisellenállás R"><output id="R_o" for="R"></output></div>
<div class="row"><label for="c">Kapcsolás (0 = csillag, 1 = delta)</label><input id="c" type="range" min="0" max="1" step="1" value="0" aria-label="Kapcsolás (0 = csillag, 1 = delta)"><output id="c_o" for="c"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Csillag vagy delta kapcsolású három azonos ellenállás: fázisfeszültség, fázisáram, vonali áram és teljesítmény a vonali feszültségből és az ellenállásból"></svg>
<p class="small">Ohmos fázisterhelés (cosφ = 1), szimmetrikus hálózat. 400 V és 100 Ω mellett: csillag 230,9 V, 2,31 A, 1,6 kW; delta 400 V, 4 A, 6,93 A, 4,8 kW. Szemléltető számítás.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"Uv":"V", "R":"Ω", "c":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const S3=Math.sqrt(3), Y=v.c==0;
const Uf=Y?v.Uv/S3:v.Uv, If=Uf/v.R, Iv=Y?If:S3*If, P=3*Uf*Uf/v.R;
const Pother=Y?3*v.Uv*v.Uv/v.R:(v.Uv*v.Uv/v.R);
const cx=150, cy=150, r=100, V=[90,210,330].map(a=>[cx+r*Math.cos(a*Math.PI/180), cy-r*Math.sin(a*Math.PI/180)]);
const nm=["L1","L2","L3"];
for(let i=0;i<3;i++){const j=(i+1)%3;
 el("line",{x1:V[i][0],y1:V[i][1],x2:V[j][0],y2:V[j][1],stroke:css("--line"),"stroke-width":2.5});}
for(let i=0;i<3;i++){
 el("circle",{cx:V[i][0],cy:V[i][1],r:5,fill:css("--line")});
 el("text",{x:cx+(V[i][0]-cx)*1.28,y:cy+(V[i][1]-cy)*1.28+5,"text-anchor":"middle","font-size":14,"font-weight":"bold"},nm[i]);
 if(Y){el("line",{x1:cx,y1:cy,x2:cx+(V[i][0]-cx)*.93,y2:cy+(V[i][1]-cy)*.93,stroke:css("--hl2"),"stroke-width":3,"stroke-dasharray":"7 4"});}
 else{const dx=(V[i][0]-cx)/r, dy=(V[i][1]-cy)/r;
  el("line",{x1:V[i][0]+dx*8,y1:V[i][1]+dy*8,x2:V[i][0]+dx*40,y2:V[i][1]+dy*40,stroke:css("--hl"),"stroke-width":3});
  el("circle",{cx:V[i][0]+dx*40,cy:V[i][1]+dy*40,r:3,fill:css("--hl")});}
}
if(Y){el("circle",{cx:cx,cy:cy,r:5,fill:css("--hl2")});
 el("text",{x:cx+8,y:cy+16,"font-size":13},"N");
 el("text",{x:cx+75,y:cy-70,"text-anchor":"start","font-size":13,fill:css("--hl2")},"Uf = Uv/√3");
 el("text",{x:cx,y:cy+r*.5+22,"text-anchor":"middle","font-size":13},"Uv (oldal)");}
else{el("text",{x:cx,y:cy+8,"text-anchor":"middle","font-size":13},"Uf = Uv, If");
 el("text",{x:cx+r*1.0+24,y:cy-r*.45,"font-size":12,fill:css("--hl")},"Iv = √3·If");}
el("text",{x:cx,y:290,"text-anchor":"middle","font-size":14,"font-weight":"bold"},Y?"Csillag (Y)":"Delta (Δ)");
const col=[["Fázisfeszültség Uf",fmt(Uf,1)+" V"],["Fázisáram If",fmt(If)+" A"],["Vonali áram Iv",fmt(Iv)+" A"],["Teljesítmény P",fmt(P/1000)+" kW"],["P(Δ)/P(Y)","3,00"]];
col.forEach((c,k)=>{el("text",{x:320,y:70+k*40,"font-size":14,fill:css("--muted")},c[0]);
 el("text",{x:320,y:90+k*40,"font-size":18,"font-weight":"bold"},c[1]);});
status("<b>"+(Y?"Csillag":"Delta")+"</b>: Uf = "+fmt(Uf,1)+" V, If = "+fmt(If)+" A, Iv = "+fmt(Iv)+" A (Iv/If = "+fmt(Iv/If)+"), P = 3·Uf²/R = "+fmt(P/1000)+" kW. "+
 "A másik kapcsolásban ugyanez a terhelés "+fmt(Pother/1000)+" kW lenne ("+(Y?"delta: háromszoros":"csillag: harmadannyi")+").");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
