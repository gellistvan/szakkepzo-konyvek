<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maximális megengedett hurokimpedancia</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="U0">Fázisfeszültség U0</label><input id="U0" type="range" min="210" max="240" step="1" value="230" aria-label="Fázisfeszültség U0"><output id="U0_o" for="U0"></output></div>
<div class="row"><label for="c">Jelleg (1 = B, 2 = C, 3 = D)</label><input id="c" type="range" min="1" max="3" step="1" value="2" aria-label="Jelleg (1 = B, 2 = C, 3 = D)"><output id="c_o" for="c"></output></div>
<div class="row"><label for="In">Névleges áram In</label><input id="In" type="range" min="6" max="63" step="1" value="16" aria-label="Névleges áram In"><output id="In_o" for="In"></output></div>
<div class="row"><label for="Zs">Mért hurokimpedancia Zs</label><input id="Zs" type="range" min="0.1" max="8" step="0.05" value="1.2" aria-label="Mért hurokimpedancia Zs"><output id="Zs_o" for="Zs"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 290" role="img" aria-label="A megengedett hurokimpedancia határgörbéje B, C, D jellegű kismegszakítónál a névleges áram függvényében, a mért Zs ponttal"></svg>
<p class="small">Szemléltetés, TN-rendszer. Tanulási példa: az Ia = 5/10/20·In szorzók (a pillanatkioldó sáv felső határa) és az időkorlát ellenőrizendők a hatályos szabvány és a gyártói jelleggörbe szerint; tervezéshez és ellenőrzéshez nem használható.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"U0":"V", "c":"", "In":"A", "Zs":"Ω"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const K=[5,10,20], names=["B","C","D"], k=K[v.c-1], sel=names[v.c-1];
const Ia=k*v.In, Zmax=v.U0/Ia, If=v.U0/v.Zs, ok=v.Zs<=Zmax;
const L=60,R=540,T=15,B=240, lg=Math.log10, X=i=>L+(i-6)/(63-6)*(R-L), ymin=0.05, ymax=12, Y=z=>B-(lg(z)-lg(ymin))/(lg(ymax)-lg(ymin))*(B-T);
[0.1,1,10].forEach(z=>{el("line",{x1:L,x2:R,y1:Y(z),y2:Y(z),stroke:css("--grid")});el("text",{x:L-6,y:Y(z)+4,"text-anchor":"end","font-size":12},fmt(z,z<1?1:0));});
[6,16,32,48,63].forEach(i=>{el("text",{x:X(i),y:B+16,"text-anchor":"middle","font-size":12},i);});
el("line",{x1:L,x2:R,y1:B,y2:B,stroke:css("--line")});
const dash=["","8 4","2 4"];
K.forEach((kk,j)=>{let d="";for(let i=6;i<=63;i+=1){d+=(d?"L":"M")+X(i).toFixed(1)+" "+Y(v.U0/(kk*i)).toFixed(1);}
 el("path",{d:d,fill:"none",stroke:j===v.c-1?css("--hl"):css("--muted"),"stroke-width":j===v.c-1?3.5:1.5,"stroke-dasharray":dash[j]});
 el("text",{x:R-4,y:Y(v.U0/(kk*63))-6,"text-anchor":"end","font-size":13,fill:j===v.c-1?css("--hl"):css("--muted")},names[j]);});
el("circle",{cx:X(v.In),cy:Y(Zmax),r:6,fill:css("--hl")});
el("circle",{cx:X(v.In),cy:Y(Math.min(Math.max(v.Zs,ymin),ymax)),r:8,fill:ok?css("--ok"):css("--bad")});
el("text",{x:(L+R)/2,y:B+36,"text-anchor":"middle","font-size":13},"névleges áram In (A)");
el("text",{x:14,y:(T+B)/2,"font-size":13,transform:"rotate(-90 14 "+((T+B)/2)+")","text-anchor":"middle"},"Zs,max (Ω, log)");
status(sel+" "+v.In+" A: <b>Ia = "+k+"·"+v.In+" = "+fmt(Ia,0)+" A</b>, <b>Zs,max = "+fmt(v.U0,0)+"/"+fmt(Ia,0)+" = "+fmt(Zmax,3)+" Ω</b>. Mért Zs = "+fmt(v.Zs)+" Ω → hibaáram "+fmt(If,0)+" A. "+
 (ok?'<span class="ok">Tartalék nélkül megfelel: Zs ≤ Zs,max (If ≥ Ia).</span>':'<span class="bad">NEM felel meg: Zs > Zs,max (If < Ia).</span>')+
 " 2/3-os tartalékkal (Zs ≤ "+fmt(2*Zmax/3,2)+" Ω): "+(v.Zs<=2*Zmax/3?'<span class="ok">megfelel</span>':'<span class="bad">nem felel meg</span>')+". Kék pont: a határ, színes pont: a mért érték.");

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
