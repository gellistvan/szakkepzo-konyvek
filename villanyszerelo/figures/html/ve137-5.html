<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fázishasítás: jelalak és teljesítmény</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="a">Gyújtásszög α</label><input id="a" type="range" min="0" max="180" step="1" value="90" aria-label="Gyújtásszög α"><output id="a_o" for="a"></output></div>
<div class="row"><label for="mode">Üzemmód</label><select id="mode" aria-label="Üzemmód"><option value="fel" selected>felfutó él (triac)</option><option value="le">lefutó él (MOSFET/IGBT)</option></select></div>
<div class="row"><label for="load">Terhelés</label><select id="load" aria-label="Terhelés"><option value="R" selected>ohmos</option><option value="L">induktív (cos φ = 0,7)</option></select></div>
<div class="row"><label for="pn">Névleges teljesítmény</label><select id="pn" aria-label="Névleges teljesítmény"><option value="500">500 W</option><option value="1000" selected>1000 W</option><option value="2000">2000 W</option></select></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="Fázishasítás szimulátor: hálózati feszültség, terhelésfeszültség és gyújtóimpulzusok két periódusban; effektív feszültség és teljesítmény a gyújtásszög függvényében"></svg>
<p class="small">Ohmos terhelésnél U<sub>ki</sub>/U<sub>be</sub> = √(1 − α/π + sin 2α/(2π)), P/P<sub>n</sub> = (U<sub>ki</sub>/U<sub>be</sub>)². Lefutó éles üzemmódban a terhelés a nullátmenettől a 180° − α szögig kap feszültséget – azonos csúszkaállásnál azonos a teljesítmény.</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"a":"°"};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const a=v.a, mode=v.mode, load=v.load, PN=v.pn;
const r=1-a/180+Math.sin(2*a*Math.PI/180)/(2*Math.PI), Uk=230*Math.sqrt(r), Up=230*Math.SQRT2;
const W=640,H=300,x0=50,x1=620,y0=150,ky=110/Up;
el("rect",{x:0,y:0,width:W,height:H,fill:"none"});
for(let ms=0;ms<=40;ms+=5){const x=x0+(x1-x0)*ms/40;el("line",{x1:x,y1:30,x2:x,y2:270,stroke:css("--grid"),"stroke-width":1});
  el("text",{x:x,y:288,"text-anchor":"middle","font-size":12},ms);}
el("text",{x:x1,y:288,"text-anchor":"end","font-size":12,dy:-14},"t [ms]");
el("line",{x1:x0,y1:y0,x2:x1,y2:y0,stroke:css("--line"),"stroke-width":1});
let pn="",pl="";
for(let i=0;i<=800;i++){const ms=40*i/800, th=(360*ms/20)%180, u=Up*Math.sin(2*Math.PI*50*ms/1000);
  const cond = mode==="fel" ? th>=a : th<=180-a;
  const x=x0+(x1-x0)*ms/40; pn+=(i?"L":"M")+x+","+(y0-u*ky); pl+=(i?"L":"M")+x+","+(y0-(cond?u:0)*ky);}
el("path",{d:pn,fill:"none",stroke:css("--muted"),"stroke-width":1.2,"stroke-dasharray":"6 4"});
el("path",{d:pl,fill:"none",stroke:css("--hl"),"stroke-width":3});
const sw = mode==="fel" ? a : 180-a;
for(let k=0;k<4;k++){const ms=(k*180+sw)/18; if(ms>40)continue; const x=x0+(x1-x0)*ms/40;
  el("line",{x1:x,y1:y0-22,x2:x,y2:y0+22,stroke:css("--hl2"),"stroke-width":4});}
el("text",{x:x0,y:22,"font-size":13},mode==="fel"?"szaggatott: hálózat · vastag: terhelés · narancs: gyújtóimpulzus":"szaggatott: hálózat · vastag: terhelés · narancs: kikapcsolás");
let h=`U<sub>eff</sub> = <b>${fmt(Uk,1)} V</b> (${fmt(100*Math.sqrt(r),1)} %) · `;
if(load==="R") h+=`P = <b>${fmt(PN*r,0)} W</b> = ${fmt(100*r,1)} % · P<sub>n</sub> (P ∝ U<sup>2</sup>)`;
else h+=`<span class="bad">Induktív terhelés (cos φ ≈ 0,7, szemléltető):</span> az áram késik a feszültséghez képest, a triac csak az áram nullátmenetében olt, ezért a terhelésfeszültség alakja és a teljesítmény eltér a rajzolt ohmos esettől – a pontos számítás a könyv szintjén túl van. Lefutó éles szabályozó induktív terheléshez nem való.`;
status(h);

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
