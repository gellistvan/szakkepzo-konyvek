<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPD bekötővezeték hossza</title>
<style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e7d32;--bad:#b71c1c;--line:#000;--grid:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#81c784;--bad:#ef9a9a;--line:#ddd;--grid:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(70px,110px);gap:8px;align-items:center;margin:4px 0}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}select{font:inherit;padding:2px 6px}
#status{margin:8px 0;min-height:3em}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}</style>
</head>
<body>
<div class="row"><label for="l">Bekötési hossz a₁ + a₂</label><input id="l" type="range" min="0" max="3" step="0.05" value="0.5" aria-label="Bekötési hossz a₁ + a₂"><output id="l_o" for="l"></output></div>
<div class="row"><label for="di">Meredekség di/dt</label><input id="di" type="range" min="1" max="20" step="0.5" value="10" aria-label="Meredekség di/dt"><output id="di_o" for="di"></output></div>
<div class="row"><label for="up">Védelmi szint U_p</label><input id="up" type="range" min="0.8" max="2.5" step="0.1" value="1.5" aria-label="Védelmi szint U_p"><output id="up_o" for="up"></output></div>
<div class="row"><label for="uw">Készülék U_w (1 = 1,5; 2 = 2,5; 3 = 4 kV)</label><input id="uw" type="range" min="1" max="3" step="1" value="3" aria-label="Készülék U_w (1 = 1,5; 2 = 2,5; 3 = 4 kV)"><output id="uw_o" for="uw"></output></div>
<div class="row"><label for="vb">V-bekötés (0/1)</label><input id="vb" type="range" min="0" max="1" step="1" value="0" aria-label="V-bekötés (0/1)"><output id="vb_o" for="vb"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="SPD bekötése: a két bekötővezeték induktív feszültsége hozzáadódik az SPD védelmi szintjéhez; V-bekötésnél ez elmarad."></svg>
<p class="small">Közelítés: L' ≈ 1 µH/m, a hossz a két bekötővezeték (a₁ + a₂) együtt; a 10 kA/µs a fejezet példájának értéke (ellenőrizendő). Az U_w értékek tanulási példák (ellenőrizendő: MSZ HD 60364-4-44, -5-534 és a gyártói adatlap).</p>
<script>
const NS="http://www.w3.org/2000/svg", FIG={svg:document.getElementById("v"), st:document.getElementById("status")};
const S=FIG.svg, ST=FIG.st;
const UN={"l":"m", "di":"kA/µs", "up":"kV", "uw":"", "vb":""};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,a,t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;FIG.svg.appendChild(e);return e;}
function status(h){FIG.st.innerHTML=h;}
FIG.el=el;FIG.css=css;FIG.status=status;
const fmt=(x,d=2)=>Number(x).toFixed(d).replace(".",",");
function values(){const v={};document.querySelectorAll("input[type=range]").forEach(i=>{v[i.id]=+i.value;
  document.getElementById(i.id+"_o").textContent=fmt(i.value,(+i.step<1?2:0))+" "+UN[i.id];});
  document.querySelectorAll("select").forEach(i=>{v[i.id]=isNaN(+i.value)?i.value:+i.value;});
  document.querySelectorAll("input[type=checkbox]").forEach(i=>{v[i.id]=i.checked?1:0;});return v;}
function draw(){FIG.svg.innerHTML="";const v=values();

const Uw=[1.5,2.5,4][v.uw-1], l=v.vb>0?0:v.l, ul=1e-6*l*v.di*1e9/1000, uh=v.up+ul, ok=uh<=Uw;
const top=Math.max(8,Math.ceil((uh+1)/4)*4), Y=u=>270-u/top*240;
for(let k=0;k<=4;k++){const u=top*k/4;el("line",{x1:300,x2:540,y1:Y(u),y2:Y(u),stroke:css("--grid")});el("text",{x:296,y:Y(u)+4,"text-anchor":"end","font-size":11},fmt(u,0)+" kV");}
el("rect",{x:380,y:Y(v.up),width:80,height:270-Y(v.up),fill:css("--bg"),stroke:css("--line"),"stroke-width":2});
el("text",{x:420,y:(Y(v.up)+270)/2+4,"text-anchor":"middle","font-size":12},"U_p");
if(ul>0){el("rect",{x:380,y:Y(uh),width:80,height:Y(v.up)-Y(uh),fill:ok?css("--grid"):css("--hl2"),stroke:css("--line"),"stroke-width":2});
 if(Y(v.up)-Y(uh)>16)el("text",{x:420,y:(Y(uh)+Y(v.up))/2+4,"text-anchor":"middle","font-size":12},"L·di/dt");}
el("line",{x1:360,x2:540,y1:Y(Uw),y2:Y(Uw),stroke:css("--bad"),"stroke-width":2,"stroke-dasharray":"8 5"});
el("text",{x:540,y:Y(Uw)-5,"text-anchor":"end","font-size":12},"U_w = "+fmt(Uw,1)+" kV");
// vázlat
el("line",{x1:20,x2:260,y1:60,y2:60,stroke:css("--line"),"stroke-width":4});el("text",{x:14,y:64,"text-anchor":"end","font-size":12},"L");
el("line",{x1:20,x2:260,y1:250,y2:250,stroke:css("--line"),"stroke-width":4,"stroke-dasharray":"10 4 2 4"});el("text",{x:16,y:254,"text-anchor":"end","font-size":12},"PE");
const a=Math.min(70,10+l*20);
el("rect",{x:105,y:155-30,width:30,height:60,fill:css("--bg"),stroke:css("--line"),"stroke-width":2});el("text",{x:100,y:160,"text-anchor":"end","font-size":12},"SPD");
if(v.vb>0){el("line",{x1:20,x2:260,y1:60,y2:60,stroke:css("--bg"),"stroke-width":6});
 el("polyline",{points:"20,60 112,60 112,125",fill:"none",stroke:css("--line"),"stroke-width":4});el("polyline",{points:"128,125 128,60 260,60",fill:"none",stroke:css("--line"),"stroke-width":4});
 el("line",{x1:20,x2:260,y1:250,y2:250,stroke:css("--bg"),"stroke-width":6});
 el("polyline",{points:"20,250 112,250 112,185",fill:"none",stroke:css("--line"),"stroke-width":4});el("polyline",{points:"128,185 128,250 260,250",fill:"none",stroke:css("--line"),"stroke-width":4,"stroke-dasharray":"10 4 2 4"});
 el("text",{x:140,y:100,"font-size":12},"V-bekötés");}
else{el("line",{x1:120,x2:120,y1:60,y2:125,stroke:css("--hl"),"stroke-width":3,"stroke-dasharray":"6 4"});el("line",{x1:120,x2:120,y1:185,y2:250,stroke:css("--hl"),"stroke-width":3,"stroke-dasharray":"6 4"});
 el("text",{x:128,y:95,"font-size":12},"a₁");el("text",{x:128,y:222,"font-size":12},"a₂");}
el("rect",{x:200,y:130,width:40,height:50,fill:css("--grid"),stroke:css("--line")});el("text",{x:220,y:196,"text-anchor":"middle","font-size":11},"készülék");
el("line",{x1:220,x2:220,y1:60,y2:130,stroke:css("--line"),"stroke-width":2});el("line",{x1:220,x2:220,y1:180,y2:250,stroke:css("--line"),"stroke-width":2});
status("U<sub>vezeték</sub> = L'·l·di/dt = 1 µH/m · "+fmt(l,2)+" m · "+fmt(v.di,1)+" kA/µs = <b>"+fmt(ul,2)+" kV</b> · U<sub>hatásos</sub> = U<sub>p</sub> + U<sub>vezeték</sub> = <b>"+fmt(uh,2)+" kV</b> → "+(ok?'<span class="ok">≤ U_w: a készülék védett</span>':'<span class="bad">&gt; U_w: a védelem nem elég</span>'));

}
document.querySelectorAll("input[type=range],select,input[type=checkbox]").forEach(i=>i.addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
